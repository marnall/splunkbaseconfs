###########################################################################
# TA_cisco_cvp - index-time settings for Cisco Unified Customer Voice Portal
#


[cvp]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=[^\r\n]{0,160}?[A-Z][a-z]{2} \d\d \d{4} \d\d:\d\d:\d\d\.\d{3} [+-]\d{4}: )

# CVP writes whole SIP messages and Java stack traces inline, and the default
# of 10000 bytes cuts them in half.  20000 covers everything we have seen.
TRUNCATE = 20000

TIME_PREFIX = ^.*?(?=[A-Z][a-z]{2} \d\d \d{4} \d\d:\d\d:\d\d\.\d{3} [+-]\d{4})
TIME_FORMAT = %b %d %Y %H:%M:%S.%3N %z
MAX_TIMESTAMP_LOOKAHEAD = 40

# punct:: is not useful on this data - the SIP and Java content makes it
# enormous and near-unique per event, so it costs index space and buys
# nothing.
ANNOTATE_PUNCT = false



# this is simply an older deprecated alias that some Sideview customers
# *may* still be using, and that used to ship in the cisco_cdr app.
# basically use sourcetype=cvp and dont use this.
[cvp_log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=[^\r\n]{0,160}?[A-Z][a-z]{2} \d\d \d{4} \d\d:\d\d:\d\d\.\d{3} [+-]\d{4}: )
TRUNCATE = 20000
TIME_PREFIX = ^.*?(?=[A-Z][a-z]{2} \d\d \d{4} \d\d:\d\d:\d\d\.\d{3} [+-]\d{4})
TIME_FORMAT = %b %d %Y %H:%M:%S.%3N %z
MAX_TIMESTAMP_LOOKAHEAD = 40
ANNOTATE_PUNCT = false
