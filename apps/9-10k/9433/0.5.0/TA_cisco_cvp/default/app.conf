[id]
version = 0.5.0
name = TA_cisco_cvp
#splunkbase_id =

[ui]
is_visible = 0
label = Supporting Add-on for Cisco CVP

[launcher]
author = Sideview, LLC
description = This Supporting Add-on defines index-time settings to ingest the log files written by Cisco Unified Customer Voice Portal (CVP).  It is to be deployed on the forwarders that sit on the CVP servers, and on your Splunk Indexers (or if you are using a Heavy Forwarder and forwarding cooked data to your indexers, on that HF instead).  It contains no search-time configuration at all and must not be installed on the search head tier.  The matching search-time configuration lives in Sideview's "SA_cisco_ucce" app, which is deployed on the search head(s) alongside Sideview's commercial "Cisco CDR Reporting and Analytics" app.
version = 0.5.0

[package]
id = TA_cisco_cvp
check_for_updates = 1
show_upgrade_notification = 1

[install]
build = 12
