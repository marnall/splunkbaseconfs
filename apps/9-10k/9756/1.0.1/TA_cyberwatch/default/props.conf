# Parsing and CIM normalisation.
#
# Every sourcetype here is a single-line JSON document written by a modular
# input, so the line breaking settings are trivial -- they are declared anyway
# because an undeclared one is a guess, and a guess on a 100 kB asset document
# is an expensive one.
#
# INDEXED_EXTRACTIONS is deliberately not used anywhere. The documents are
# deeply nested and change shape with the Cyberwatch version, which is the case
# the guidance explicitly calls out as unsuitable: it would cost ingest CPU and
# index size for fields most searches never touch. KV_MODE = json does the work
# at search time instead.
#
# CIM mapping is against the Vulnerabilities data model, Splunk CIM 8.5.
# Verified 2026-09-12:
# https://help.splunk.com/en/splunk-cloud-platform/common-information-model/8.5/data-models/vulnerabilities

# The parsing block below is repeated in every stanza rather than factored out:
# props.conf has no inheritance, and a stanza that merely looks shared would be
# dead configuration. collected_at is written first by the collector precisely
# so TIME_PREFIX is stable -- see ta_cyberwatch/collectors.py, _stamped().
#
# _time is the collection time rather than detected_at.
#
# Each run is a snapshot: a vulnerability detected six months ago is reported
# again today, still open. Stamping it with detected_at would pile hundreds of
# identical events onto one instant and leave every "last 24 hours" dashboard
# empty. The detection, fix and publication dates are kept as fields, and
# detected_at is exposed below.


[cyberwatch:asset]
category = Security
pulldown_type = 1
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 500000
EVENT_BREAKER_ENABLE = true
EVENT_BREAKER = ([\r\n]+)
KV_MODE = json
TIME_PREFIX = \"collected_at\":\s*\"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 24
EVAL-dest = coalesce('hostname', mvindex('addresses{}', 0))
EVAL-dvc = 'cyberwatch.instance'
EVAL-vendor_product = "Cyberwatch"

