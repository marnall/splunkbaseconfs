LOOKUP-cyberwatch_cve = cyberwatch_cve_lookup cve_code AS cve.cve_code OUTPUT cim_category AS category, level AS vendor_severity, cim_xref AS xref, cwe AS cyberwatch_cwe, content AS cyberwatch_cve_content, exploit_code_maturity AS cyberwatch_exploit_code_maturity, exploitable AS cyberwatch_exploitable
EVAL-dest = coalesce('asset.hostname', mvindex('asset.addresses{}', 0))
EVAL-dvc = 'cyberwatch.instance'
EVAL-cve = 'cve.cve_code'
EVAL-signature_id = 'cve.cve_code'
EVAL-cvss = 'cve.score'
EVAL-cyberwatch_environmental_score = 'cve.environmental_score'
EVAL-vendor_product = "Cyberwatch"
EVAL-signature = 'cve.cve_code'
EVAL-severity = case( \
    'cve.score'>=9.0, "critical", \
    'cve.score'>=7.0, "high", \
    'cve.score'>=4.0, "medium", \
    'cve.score'>0.0, "low", \
    'cve.score'==0.0, "informational", \
    1==1, "unknown")
EVAL-cyberwatch_epss = 'cve.epss'
EVAL-cyberwatch_triage_status = 'cve.triage_status'
EVAL-cyberwatch_active = 'cve.active'
EVAL-cyberwatch_prioritized = 'cve.prioritized'
EVAL-cyberwatch_detected_at = 'cve.detected_at'
EVAL-cyberwatch_fixed_at = 'cve.fixed_at'
EVAL-cyberwatch_published = 'cve.published'

