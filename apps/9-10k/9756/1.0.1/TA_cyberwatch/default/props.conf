[source::...ta_cyberwatch_*.log*]
sourcetype = ta:cyberwatch:log

[ta:cyberwatch:log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} )
TRUNCATE = 10000
EVENT_BREAKER_ENABLE = true
EVENT_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} )
KV_MODE = none
EXTRACT-fields = ^(?<log_time>\S+ \S+) log_level=(?<log_level>\w+) pid=(?<pid>\d+) tid=(?<tid>\S+) file=(?<log_source>\S+) \| (?<message>.*)$
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 24
