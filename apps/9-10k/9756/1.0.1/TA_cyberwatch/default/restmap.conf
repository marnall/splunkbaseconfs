[admin:TA_cyberwatch_configuration]
match = /
members = TA_cyberwatch_account, TA_cyberwatch_settings

[admin:TA_cyberwatch_inputs]
match = /
members = TA_cyberwatch_agents, TA_cyberwatch_application_scans, TA_cyberwatch_asset_groups, TA_cyberwatch_assets, TA_cyberwatch_compliance_findings, TA_cyberwatch_compliance_rule_catalog, TA_cyberwatch_cve_catalog, TA_cyberwatch_discoveries, TA_cyberwatch_discovery_assets, TA_cyberwatch_nodes, TA_cyberwatch_operating_systems, TA_cyberwatch_security_issues, TA_cyberwatch_vulnerabilities

[admin_external:TA_cyberwatch_account]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = TA_cyberwatch_rh_account.py
handleractions = edit, list, remove, create
handlerpersistentmode = true

