[launcher]
version = 1.0.1
description = Collects assets, vulnerabilities, compliance rules and security issues from the Cyberwatch API and normalizes them to the Splunk Common Information Model.
author = Thomas Dussossoy

[id]
version = 1.0.1
name = TA_cyberwatch

[install]
build = 1789323491
is_configured = false
state = enabled

[package]
id = TA_cyberwatch
check_for_updates = true

[ui]
label = Cyberwatch Add-on
supported_themes = light, dark
is_visible = true

[triggers]
reload.ta_cyberwatch_settings = simple
reload.ta_cyberwatch_account = simple
