# Lookup definitions over the catalogue collections.

[cyberwatch_cve_lookup]
external_type = kvstore
collection = cyberwatch_cve
fields_list = _key, cve_code, content, cwe, level, cim_xref, cim_category, score, score_v2, score_v3, score_v4, score_custom, cvss_v2, cvss_v3, cvss_v4, cvss_custom, epss, exploit_code_maturity, exploitable, published, last_modified, technologies, catalogs, euvd_id, note_custom

[cyberwatch_compliance_rule_lookup]
external_type = kvstore
collection = cyberwatch_compliance_rule
fields_list = _key, id, code, name, description, level, type, rationale, remediation, audit, checks, reference, repositories, os, require_sudo, published_at, last_modified_at, created_at, updated_at
