# Event types are defined on the sourcetype, never on the index.
#

[cyberwatch_vulnerability]
search = sourcetype="cyberwatch:vulnerability"

[cyberwatch_asset]
search = sourcetype="cyberwatch:asset"

[cyberwatch_compliance_finding]
search = sourcetype="cyberwatch:compliance_finding"

[cyberwatch_security_issue]
search = sourcetype="cyberwatch:security_issue"
