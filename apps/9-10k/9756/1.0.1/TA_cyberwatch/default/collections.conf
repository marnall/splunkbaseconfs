# Reference data collected by the catalogue inputs, plus the input checkpoints.
#
# Catalogues live here rather than in an index because they are reference data,
# not a time series. The CVE catalogue is 6692 rows for what is present on an
# estate, and 393539 rows for the whole Cyberwatch knowledge base, for data that
# barely changes; re-indexing that daily would cost a great deal to answer a
# question a lookup answers instantly and always with the current value.
#
# Access control is NOT set here -- collections.conf has no access settings.
# It lives in metadata/default.meta, under [collections/<name>].

[cyberwatch_cve]
# _key is the CVE code, so no separate index on it is needed.
field.cve_code = string
field.level = string
field.score = number
field.epss = number
field.exploit_code_maturity = string
field.exploitable = bool
field.published = string
field.last_modified = string
accelerated_fields.by_level = {"level": 1, "score": -1}
accelerated_fields.by_epss = {"epss": -1}

[cyberwatch_compliance_rule]
# _key is the Cyberwatch rule id.
field.code = string
field.level = string
field.type = string
accelerated_fields.by_code = {"code": 1}

[ta_cyberwatch_checkpoints]
# Written by solnlib's KVStoreCheckpointer: one document per input stanza,
# holding the last analyzed_at seen for each asset. Declared here so the
# collection ships with the add-on rather than being created on first run.
