[launcher]
version = 1.0.0
author = Thomas Dussossoy
description = Dashboards for the data collected by the Cyberwatch Add-on: vulnerability posture, prioritisation, compliance, estate inventory and collection health.

[id]
name = cyberwatch_splunk
version = 1.0.0

[install]
is_configured = false
state = enabled

[package]
id = cyberwatch_splunk
check_for_updates = true

[ui]
is_visible = true
label = Cyberwatch
supported_themes = light, dark
