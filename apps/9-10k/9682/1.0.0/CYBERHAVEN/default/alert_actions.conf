[cyberhaven_update_status]
label = Cyberhaven - Update Incident Status
description = Updates the status, close_reason, and close_note of a Cyberhaven incident on the Cyberhaven platform via the Incidents API (PATCH /v2/incidents/:id). Reads the Cyberhaven Tenant URL and API Key from the TA-CYBERHAVEN add-on configuration. Intended to run automatically from the "Cyberhaven - Sync Closed Notable Status to Platform" saved search when a linked notable event's review status is changed to Closed, with close_reason/close_note derived from the notable's disposition.
is_custom = 1
icon_path = cyberhaven_adaptive_response.png
python.version = python3
python.required = 3.13
payload_format = json
alert.execute.cmd = cyberhaven_update_status.py
alert.execute.cmd.arg.1 = --execute
param._cam = {"category": ["Adaptive Response Event"], "task": ["correction"], "subject": ["endpoint", "user", "network"], "technology": [{"vendor": "Cyberhaven", "product": "Cyberhaven Data Security Platform", "version": ["1.0"]}], "supports_adhoc": true}
param.incident_id =
param.status = Closed
param.close_reason = invalid_other
param.close_note = Closed by Splunk SIEM Integration: Undetermined

[cyberhaven_update_owner]
label = Cyberhaven - Update Incident Owner
description = Updates the assigned_to (owner) field of a Cyberhaven incident on the Cyberhaven platform via the Incidents API (PATCH /v2/incidents/:id). Reads the Cyberhaven Tenant URL and API Key from the TA-CYBERHAVEN add-on configuration. Intended to run automatically from the "Cyberhaven - Sync Notable Owner to Platform" saved search when a linked notable event's owner is reassigned.
is_custom = 1
icon_path = cyberhaven_adaptive_response.png
python.version = python3
python.required = 3.13
payload_format = json
alert.execute.cmd = cyberhaven_update_owner.py
alert.execute.cmd.arg.1 = --execute
param._cam = {"category": ["Adaptive Response Event"], "task": ["correction"], "subject": ["endpoint", "user", "network"], "technology": [{"vendor": "Cyberhaven", "product": "Cyberhaven Data Security Platform", "version": ["1.0"]}], "supports_adhoc": true}
param.incident_id =
param.owner =
