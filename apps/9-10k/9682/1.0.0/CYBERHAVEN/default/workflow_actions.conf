[cyberhaven_view_incident]
display_location = both
fields           = id, cyberhaven_tenant_url
label            = View Incident in Cyberhaven
link.method      = get
link.uri         = https://$cyberhaven_tenant_url$/incidents?id=$id$
link.target      = _blank
type             = link
eventtypes       = cyberhaven_alerts_dlp_incident

[cyberhaven_view_lineage]
display_location = both
fields           = cyberhaven_tenant_url, cyberhaven_lineage_b64, event_details.start_event.id, event_details.end_event.id, event_details.start_event.timestamp, event_details.end_event.timestamp
label            = View File Lineage in Cyberhaven
link.method      = get
link.uri         = https://$cyberhaven_tenant_url$/overview?origin=dashboards&s=$cyberhaven_lineage_b64$&view="reports"
link.target      = _blank
type             = link
eventtypes       = cyberhaven_alerts_dlp_incident

[cyberhaven_insider_risk]
display_location = both
fields           = cyberhaven_tenant_url, cyberhaven_insider_risk_b64
label            = View User Risk Profile in Cyberhaven
link.method      = get
link.uri         = https://$cyberhaven_tenant_url$/insider-risks?s=$cyberhaven_insider_risk_b64$
link.target      = _blank
type             = link
