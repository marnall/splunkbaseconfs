# KV store collection that tracks the status/owner value last successfully pushed to the
# Cyberhaven platform for a given Splunk ES notable (rule_id). rule_id is a plain queryable
# field rather than the KV store's own _key, since a single Cyberhaven incident can be
# linked to more than one notable over time (e.g. re-opened/re-created notables) -- each
# notable gets its own row, all sharing the same cyberhaven_incident_id.
#
# Both sync searches read this via the cyberhaven_sync_state_lookup lookup definition
# (transforms.conf) before firing their adaptive response action, and both
# cyberhaven_update_status/cyberhaven_update_owner scripts write back to it after a
# confirmed-successful Cyberhaven API call (see bin/cyberhaven_settings.py:upsert_sync_state).
[cyberhaven_sync_state]
field.rule_id = string
field.cyberhaven_incident_id = string
field.synced_status = string
field.synced_close_reason = string
field.synced_owner = string
field.last_synced_time = number
