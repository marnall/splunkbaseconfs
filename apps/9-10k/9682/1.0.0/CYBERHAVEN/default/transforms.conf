# Lookup definition wrapping the cyberhaven_sync_state KV store collection
# (collections.conf). Match on rule_id (aliased to notable_rule_id in SPL) to fetch the
# last status/owner value successfully synced to the Cyberhaven platform for a notable.
[cyberhaven_sync_state_lookup]
collection = cyberhaven_sync_state
external_type = kvstore
fields_list = _key, rule_id, cyberhaven_incident_id, synced_status, synced_close_reason, synced_owner, last_synced_time
