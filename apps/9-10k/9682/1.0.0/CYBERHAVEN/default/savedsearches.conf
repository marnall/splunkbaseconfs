# All four searches below are disabled by default. Enable them via the
# "Enable Notable Event Automation" checkbox on the TA-CYBERHAVEN add-on's
# Configuration > Splunk ES Notable Settings page, which validates that this app
# (CYBERHAVEN) and Splunk Enterprise Security are both installed and enabled
# before turning them on (see NotableAutomationValidator in
# TA-CYBERHAVEN/bin/CYBERHAVEN_utils.py). Do not rename these stanzas without
# also updating NOTABLE_CORRELATION_SEARCH / NOTABLE_SYNC_SEARCH / NOTABLE_OWNER_SYNC_SEARCH /
# NOTABLE_REOPEN_SYNC_SEARCH there.

[Cyberhaven - Incident Notable]
disabled = 1
description = Creates a Splunk ES notable event for each new Cyberhaven incident (status=open) ingested via the cyberhaven:incidents sourcetype. Disabled by default; enable via the "Enable Notable Event Automation" checkbox in the TA-CYBERHAVEN add-on configuration (requires the CYBERHAVEN app and Splunk Enterprise Security to be installed).
search = \
    `cyberhaven_index` sourcetype=cyberhaven:incidents status=open\
    | eval policy_name='policy.name', policy_severity='policy.severity', dataset_sensitivity='dataset.sensitivity'\
    | eval urgency=case(policy_severity="Critical", "critical", policy_severity="High", "high", policy_severity="Medium", "medium", policy_severity="Low", "low", true(), "medium")\
    | dedup id
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
realtime_schedule = 0
alert.suppress = 0
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.verbose = 0
action.notable.param.rule_title = Cyberhaven Incident: $policy_name$
action.notable.param.rule_description = Cyberhaven detected a "$action$" event for user $user$ that triggered policy "$policy_name$" (severity: $policy_severity$, dataset sensitivity: $dataset_sensitivity$). Blocked: $blocked$.
action.notable.param.security_domain = threat
action.notable.param.default_owner = unassigned
action.notable.param.default_status = unassigned

[Cyberhaven - Sync Closed Notable Status to Platform]
disabled = 1
description = Runs every 5 minutes to find notable events created by the "Cyberhaven - Incident Notable" correlation search whose reviewed status was changed to Closed in the prior review window, then calls the Cyberhaven Incidents API (via the cyberhaven_update_status adaptive response action) to close the matching incident on the Cyberhaven platform, deriving close_reason/close_note from the notable's disposition field. Checks the cyberhaven_sync_state KV store lookup (see collections.conf/transforms.conf) and skips notables whose status and close_reason were already synced with the same values, so a notable that keeps reappearing in the trailing review window (e.g. a later comment) doesn't repeatedly re-send the same update -- but still re-syncs if the disposition (and therefore close_reason) changes after the notable was already closed. Disabled by default; enable via the "Enable Notable Event Automation" checkbox in the TA-CYBERHAVEN add-on configuration. NOTE: the join against the `notable` macro to recover the original Cyberhaven incident id and disposition has not been validated against a live Enterprise Security instance -- confirm the field names below (rule_id, id, orig_sourcetype, disposition) match your ES environment before relying on this in production.
# disposition -> close_reason / close_note mapping (missing/unrecognized disposition -> invalid_other):
# close_reason values are constrained by the Cyberhaven Incidents API -- see the
# Splunk -> Cyberhaven Disposition Mapping table in README.md before changing these.
# close_note is free text, sent as "Closed by Splunk SIEM Integration: <disposition label>"
# (the label shown below after the slash):
#   disposition:0 -> invalid_other         / "Unassigned"
#   disposition:1 -> valid                 / "True Positive - Suspicious Activity"
#   disposition:2 -> invalid_user_exempt   / "Benign Positive - Suspicious But Expected"
#   disposition:3 -> invalid_other         / "False Positive - Incorrect Analytic Logic"
#   disposition:4 -> invalid_data_mislabled / "False Positive - Inaccurate Data"
#   disposition:5 -> invalid_other         / "Other"
#   (null/other)  -> invalid_other         / "Undetermined"
search = \
    | `incident_review`\
    | where _time>=relative_time(now(), "-6m@m")\
    | stats latest(*) as * by rule_id\
    | search status_label="Closed"\
    | rename rule_id as notable_rule_id\
    | join type=inner notable_rule_id\
        [ search `notable`\
          | rename rule_id as notable_rule_id\
          | table notable_rule_id, id, orig_sourcetype, disposition ]\
    | search orig_sourcetype="cyberhaven:incidents"\
    | rename id as cyberhaven_incident_id\
    | eval close_reason=case(\
        disposition="disposition:0", "invalid_other",\
        disposition="disposition:1", "valid",\
        disposition="disposition:2", "invalid_user_exempt",\
        disposition="disposition:3", "invalid_other",\
        disposition="disposition:4", "invalid_data_mislabled",\
        disposition="disposition:5", "invalid_other",\
        true(), "invalid_other")\
    | eval close_note=case(\
        disposition="disposition:0", "Closed by Splunk SIEM Integration: Unassigned",\
        disposition="disposition:1", "Closed by Splunk SIEM Integration: True Positive - Suspicious Activity",\
        disposition="disposition:2", "Closed by Splunk SIEM Integration: Benign Positive - Suspicious But Expected",\
        disposition="disposition:3", "Closed by Splunk SIEM Integration: False Positive - Incorrect Analytic Logic",\
        disposition="disposition:4", "Closed by Splunk SIEM Integration: False Positive - Inaccurate Data",\
        disposition="disposition:5", "Closed by Splunk SIEM Integration: Other",\
        true(), "Closed by Splunk SIEM Integration: Undetermined")\
    | lookup cyberhaven_sync_state_lookup rule_id AS notable_rule_id OUTPUT synced_status, synced_close_reason\
    | where isnull(synced_status) OR synced_status!=status_label OR isnull(synced_close_reason) OR synced_close_reason!=close_reason\
    | table notable_rule_id, cyberhaven_incident_id, status_label, close_reason, close_note
dispatch.earliest_time = 0
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
realtime_schedule = 0
alert.suppress = 0
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
action.cyberhaven_update_status = 1
action.cyberhaven_update_status.param.incident_id = $cyberhaven_incident_id$
action.cyberhaven_update_status.param.status = Closed
action.cyberhaven_update_status.param.close_reason = $close_reason$
action.cyberhaven_update_status.param.close_note = $close_note$

[Cyberhaven - Sync Notable Owner to Platform]
disabled = 1
description = Runs every 5 minutes to find notable events created by the "Cyberhaven - Incident Notable" correlation search whose owner was set/changed in the prior review window, then calls the Cyberhaven Incidents API (via the cyberhaven_update_owner adaptive response action) to update the assigned_to field of the matching incident on the Cyberhaven platform, sending the owner's resolved real name (owner_realname, from user_realnames_lookup) rather than the raw Splunk username. Checks the cyberhaven_sync_state KV store lookup (see collections.conf/transforms.conf) and skips notables whose owner_realname was already synced, so a notable that keeps reappearing in the trailing review window doesn't repeatedly re-send the same update. Disabled by default; enable via the "Enable Notable Event Automation" checkbox in the TA-CYBERHAVEN add-on configuration. Skips the default "unassigned" owner to avoid syncing no-op assignments. NOTE: the join against the `notable` macro to recover the original Cyberhaven incident id has not been validated against a live Enterprise Security instance -- confirm the field names below (rule_id, id, orig_sourcetype, owner) match your ES environment before relying on this in production.
search = \
    | `incident_review`\
    | where _time>=relative_time(now(), "-6m@m")\
    | stats latest(*) as * by rule_id\
    | search owner!="unassigned"\
    | rename rule_id as notable_rule_id\
    | join type=inner notable_rule_id\
        [ search `notable`\
          | rename rule_id as notable_rule_id\
          | table notable_rule_id, id, orig_sourcetype ]\
    | search orig_sourcetype="cyberhaven:incidents"\
    | rename id as cyberhaven_incident_id\
    | lookup cyberhaven_sync_state_lookup rule_id AS notable_rule_id OUTPUT synced_owner\
    | where isnull(synced_owner) OR synced_owner!=owner_realname\
    | table notable_rule_id, cyberhaven_incident_id, owner_realname
dispatch.earliest_time = 0
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
realtime_schedule = 0
alert.suppress = 0
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
action.cyberhaven_update_owner = 1
action.cyberhaven_update_owner.param.incident_id = $cyberhaven_incident_id$
action.cyberhaven_update_owner.param.owner = $owner_realname$

[Cyberhaven - Sync Reopened Notable Status to Platform]
disabled = 1
description = Runs every 5 minutes to find notable events created by the "Cyberhaven - Incident Notable" correlation search whose reviewed status was changed away from Closed (reopened) in the prior review window, after having already been synced to Cyberhaven as Closed, then calls the Cyberhaven Incidents API (via the cyberhaven_update_status adaptive response action) to reopen the matching incident on the Cyberhaven platform with status=Open. Unlike the closed-status sync search, this does not set close_reason/close_note -- those only apply when actually closing an incident. Checks the cyberhaven_sync_state KV store lookup (see collections.conf/transforms.conf) and only fires for notables previously synced as Closed, so a notable that was never closed (e.g. a brand new one) doesn't spuriously trigger a reopen call, and a notable that keeps reappearing in the trailing review window doesn't repeatedly re-send the same update. Disabled by default; enable via the "Enable Notable Event Automation" checkbox in the TA-CYBERHAVEN add-on configuration. NOTE: the join against the `notable` macro to recover the original Cyberhaven incident id has not been validated against a live Enterprise Security instance -- confirm the field names below (rule_id, id, orig_sourcetype) match your ES environment before relying on this in production.
search = \
    | `incident_review`\
    | where _time>=relative_time(now(), "-6m@m")\
    | stats latest(*) as * by rule_id\
    | search status_label!="Closed"\
    | rename rule_id as notable_rule_id\
    | join type=inner notable_rule_id\
        [ search `notable`\
          | rename rule_id as notable_rule_id\
          | table notable_rule_id, id, orig_sourcetype ]\
    | search orig_sourcetype="cyberhaven:incidents"\
    | rename id as cyberhaven_incident_id\
    | lookup cyberhaven_sync_state_lookup rule_id AS notable_rule_id OUTPUT synced_status\
    | where synced_status="Closed"\
    | table notable_rule_id, cyberhaven_incident_id, status_label
dispatch.earliest_time = 0
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
realtime_schedule = 0
alert.suppress = 0
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
action.cyberhaven_update_status = 1
action.cyberhaven_update_status.param.incident_id = $cyberhaven_incident_id$
action.cyberhaven_update_status.param.status = Open
