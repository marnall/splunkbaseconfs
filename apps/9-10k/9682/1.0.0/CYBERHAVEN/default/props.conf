# Sourcetype override for CYBERHAVEN's own notable-automation log file (bin/cyberhaven_settings.py:
# get_logger output). Lands in $SPLUNK_HOME/var/log/splunk/, which the stock
# [monitor://$SPLUNK_HOME/var/log/splunk] input (index=_internal) already ingests with no
# filename filter -- this stanza just gives the matching source a clean sourcetype
# instead of falling back to Splunk's generic default, same pattern as TA-CYBERHAVEN's own
# [source::...TA-CYBERHAVEN*.log*] override for ta:cyberhaven:log.
#
# The ModularAlertBase framework's own "<alert_name>_modalert.log" files are deliberately
# not sourcetyped here: every message the AR scripts produce is now dual-logged into the
# file above too (see _log_error()/_log_info() in cyberhaven_update_status_helper.py /
# cyberhaven_update_owner_helper.py), so the modalert files are a redundant, independent
# copy kept only as a safety net -- no dashboard panel or search depends on them.

# bin/cyberhaven_settings.py:get_logger() output -- CYBERHAVEN_cyberhaven_update_status.log,
# CYBERHAVEN_cyberhaven_update_owner.log.
[source::...CYBERHAVEN_cyberhaven_update_*.log*]
SHOULD_LINEMERGE = true
sourcetype = cyberhaven:notable_automation:log

