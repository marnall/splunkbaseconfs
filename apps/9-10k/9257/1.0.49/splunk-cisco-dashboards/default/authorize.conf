[capability::ssne_manage_insights_workspaces]

# The capability uses the SSNE product acronym. Existing scd_* REST names are
# retained as stable technical identifiers for compatibility.
# Administrators receive shared workspace management by default. Other roles
# must be granted the narrow capability explicitly; in particular, role_power
# remains read-only for shared workspace configuration.
[role_admin]
ssne_manage_insights_workspaces = enabled

[role_sc_admin]
ssne_manage_insights_workspaces = enabled
