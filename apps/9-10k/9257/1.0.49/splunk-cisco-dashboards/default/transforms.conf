#
# transforms.conf - Executive Dashboards
#

[asset_inventory]
filename = asset_inventory.csv
case_sensitive_match = false
match_type = WILDCARD(device_name)
min_matches = 1

# Build 115.4 - Splunk infrastructure inventory.
#
# Populated by the [Splunk Inventory - Build Lookup] saved search
# in savedsearches.conf, which runs daily at 02:30 and writes one
# row per Splunk host (search heads, indexers, cluster managers,
# deployment servers, IDMs, heavy/universal forwarders, ES/ITSI
# search heads). The Network Diagram authoring page reads this
# lookup as a SECOND inventory source alongside `asset_inventory`,
# so operators can drag indexers / search-heads onto the canvas
# and "Bind to host" placeholder shapes against real Splunk hosts.
#
# Schema highlights (full list in the saved search):
#   - host_name           : lowercased Splunk server hostname
#                           (stable join key)
#   - name                : friendly shortname like idx-01,
#                           shc-01, cm-01, es-01, itsi-shc-01
#   - label               : cluster label or hostname (whichever
#                           is more meaningful for grouping)
#   - role                : comma-joined role list
#                           (indexer,search_peer,cluster_slave …)
#   - primary_role        : single role token used by the JS
#                           shape mapper (indexer, search_head,
#                           search_head_cluster, cluster_manager,
#                           heavy_forwarder, idm, deployment_server)
#   - index_cluster_label : when the host belongs to an index
#                           cluster, the cluster label
#   - sh_cluster_label    : same, for SHC members
#   - version             : Splunk version (model field on canvas)
#   - is_es / is_itsi     : ES / ITSI app indicators
#   - env                 : "Cloud" or "Enterprise"
[splunk_inventory]
filename = splunk_inventory.csv
case_sensitive_match = false
match_type = WILDCARD(host_name)
min_matches = 1

[exec_scores]
filename = exec_scores.csv

[data_status]
filename = data_status.csv

[site_topology_lookup]
filename = site_topology_lookup.csv
case_sensitive_match = false
# Populated by [Executive Dashboard - Site Topology Lookup Generator]
# in savedsearches.conf. Snapshot of cisco:dnac:site:topology, keyed
# on `id` (DNAC site UUID). Use as a join target for any sourcetype
# whose site reference is a UUID:
#   cisco:dnac:client.siteHierarchyId  (slash-delimited UUID chain;
#                                       extract leaf via mvindex)
#   cisco:dnac:client.siteId           (leaf UUID directly)
#   cisco:dnac:clienthealth.siteId     (leaf UUID directly)
#   cisco:dnac:audit:logs.network.siteId (leaf UUID directly)

[sgt_naming]
filename = sgt_naming.csv
case_sensitive_match = false
# SGT catalog - maps SGT_Hex (e.g. "0004") to Name and Description.
# Keyed on SGT_Hex; used by SGT enrichment searches throughout
# secure_networking_* stanzas. Ideally regenerated by the
# [Secure Networking - SGT Naming Lookup Generator] saved search,
# which polls cisco:ise:securitygroups (ISE ERS API). Until that
# feed is configured, this CSV ships as a seed with the known SGTs.

