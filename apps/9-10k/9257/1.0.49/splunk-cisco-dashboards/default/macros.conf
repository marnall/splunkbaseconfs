# =============================================================================
# Cisco Exec Dashboards - macros.conf
# =============================================================================
# Tier 0 - Legacy compatibility (1): deprecated customer-name macro
# Tier 1 - Index abstraction (27)  : map customer index name once
# Tier 2 - Acceleration toggle (1) : tstats summariesonly switch
# Tier 3 - Reusable structural macros (3) : Spaces hierarchy, wireless trust, DNAC site normalize
# Tier 4 - NRS tuning and utilities (7) : NRS controls plus field inventory
#
# Total: 39 macros. Sub-weights, D_risk components, and capacity constants are
# inlined in the SPL - see DECISIONS.md 2026-04-28 for the audit.
# =============================================================================


# -----------------------------------------------------------------------------
# Tier 0 - Legacy compatibility
# Deprecated: Insights Workspace titles now come from insights_workspaces.conf
# and the in-dashboard branding editor. Keep this macro so external or custom
# dashboards that still call `customer_name` do not break during migration.
# -----------------------------------------------------------------------------
[customer_name]
# Examples:
#   definition = "Acme Corporation"
#   definition = "City of Springfield"
definition = "Your Organization Name"
# iseval = 1
description = DEPRECATED compatibility value for external/custom dashboards. Insights Workspace titles are configured in insights_workspaces.conf or the in-dashboard branding editor.


# -----------------------------------------------------------------------------
# Tier 1 - Index abstraction
# Each macro is the first token of every search. Edit the `index=` value once
# per customer to retarget all panels and saved-searches at the right indexes.
# -----------------------------------------------------------------------------
[index_catalyst]
definition = index IN (*)
iseval = 0
description = Index(es) for Catalyst Center / DNAC data (cisco:dnac:*)

[index_firewall]
definition = index IN (*)
iseval = 0
description = Index(es) for firewall data (cisco:asa, cisco:ftd*, cisco:firepower:syslog, cisco:sfw:estreamer, cisco:sfw:policy, cisco:estreamer:*, cisco:multicloud:defense:*, cisco:sourcefire:*, pan:*)

[index_network_ftd]
definition = index IN (*)
iseval = 0
description = Index(es) dedicated to Cisco Secure Firewall / FTD conference telemetry. The Agentic SOC workspace uses this narrower macro so high-volume connection searches do not scan unrelated security indexes.

[index_dns_umbrella]
definition = index IN (*)
iseval = 0
description = Index(es) for Cisco Umbrella and Secure Access DNS plus application-discovery telemetry (cisco:cloud_security:dns, cisco:cloud_security:appdiscovery)

[index_identity]
definition = index IN (*)
iseval = 0
description = Index(es) for ISE identity and TrustSec data (cisco:ise:*)

[index_windows]
definition = index IN (*)
iseval = 0
description = Index(es) for Windows / Active Directory data (XmlWinEventLog, ActiveDirectory, MSAD:NT6:DNS)

[index_network]
definition = index IN (*)
iseval = 0
description = Index(es) for network syslog and model-driven telemetry (cisco:ios, cisco:ios:traceback, cisco:telemetry)

