# -----------------------------------------------------------------------------
# Tier 3 - Reusable structural macros
# These replace large blocks of duplicated SPL across many panels.
# -----------------------------------------------------------------------------

# Cisco Spaces firehose location-hierarchy walker.
# Walks up to 5 parent levels and exposes campus / building / floor / site.
# Pass the event prefix (devicePresence, userPresence, deviceAssociation, etc.)
# as the only argument. site = "<campus>: <building>" - the standard label.
[spaces_hierarchy(1)]
args = prefix
definition = eval lh_t0='$prefix$.location.inferredLocationTypes{}', \
 lh_t1='$prefix$.location.parent.inferredLocationTypes{}', \
 lh_t2='$prefix$.location.parent.parent.inferredLocationTypes{}', \
 lh_t3='$prefix$.location.parent.parent.parent.inferredLocationTypes{}', \
 lh_t4='$prefix$.location.parent.parent.parent.parent.inferredLocationTypes{}', \
 lh_n0='$prefix$.location.name', \
 lh_n1='$prefix$.location.parent.name', \
 lh_n2='$prefix$.location.parent.parent.name', \
 lh_n3='$prefix$.location.parent.parent.parent.name', \
 lh_n4='$prefix$.location.parent.parent.parent.parent.name' \
| eval floor=case(mvfind(lh_t0,"FLOOR")>=0,lh_n0, mvfind(lh_t1,"FLOOR")>=0,lh_n1, mvfind(lh_t2,"FLOOR")>=0,lh_n2) \
| eval building=case(mvfind(lh_t0,"NETWORK")>=0,lh_n0, mvfind(lh_t1,"NETWORK")>=0,lh_n1, mvfind(lh_t2,"NETWORK")>=0,lh_n2, mvfind(lh_t3,"NETWORK")>=0,lh_n3, mvfind(lh_t4,"NETWORK")>=0,lh_n4) \
| eval campus=case(mvfind(lh_t0,"CAMPUS")>=0,lh_n0, mvfind(lh_t1,"CAMPUS")>=0,lh_n1, mvfind(lh_t2,"CAMPUS")>=0,lh_n2, mvfind(lh_t3,"CAMPUS")>=0,lh_n3, mvfind(lh_t4,"CAMPUS")>=0,lh_n4) \
| eval site=if(isnotnull(campus) AND isnotnull(building), campus.": ".building, coalesce(building, campus, "Unknown")) \
| fields - lh_t0 lh_t1 lh_t2 lh_t3 lh_t4 lh_n0 lh_n1 lh_n2 lh_n3 lh_n4
iseval = 0
description = Walks the Cisco Spaces location tree (up to 5 parent levels) and exposes campus / building / floor / site fields. site = "<campus>: <building>" - the standard label across all NetOps charts. Uses lh_* (letter-prefixed) intermediate fields because Splunk rejects field names with leading double underscore.

# Wireless device trust base - shared foundation for wireless_device_trust_summary
# and wireless_devices_to_review. Loads Cisco Spaces DEVICE_LOCATION_UPDATE and
# DEVICE_ASSOCIATION events, normalizes MAC addresses, extracts building/floor/SSID/
# type metadata, then left-joins with ISE syslog for ise_user, ise_pass, ise_profile.
# Post-join fields: mac, ssid, spaces_user_id, building, floor, spaces_type,
# ise_user, ise_pass, ise_profile.
[wireless_trust_base]
definition = `index_spaces` sourcetype="cisco:spaces:firehose" (eventType="DEVICE_LOCATION_UPDATE" OR (eventType="DEVICE_ASSOCIATION" deviceAssociation.event="ASSOCIATE")) \
| eval mac=lower(replace(coalesce('deviceLocationUpdate.device.macAddress', 'deviceAssociation.device.macAddress'), ":", "-")) \
| where isnotnull(mac) AND mac!="" \
| eval ssid=coalesce('deviceAssociation.ssid', "") \
| eval spaces_user_id=coalesce('deviceLocationUpdate.device.userId', "") \
| eval building=coalesce('deviceLocationUpdate.location.parent.name', 'deviceAssociation.location.parent.name', 'deviceAssociation.location.parent.parent.name') \
| eval floor=coalesce('deviceLocationUpdate.location.name', 'deviceAssociation.location.name') \
| eval spaces_type=coalesce('deviceLocationUpdate.device.type', "") \
| stats latest(spaces_user_id) as spaces_user_id, latest(building) as building, latest(floor) as floor, latest(spaces_type) as spaces_type, values(ssid) as ssid_mv by mac \
| eval ssid=coalesce(mvindex(ssid_mv, 0), "") \
| fields - ssid_mv \
| join mac type=left [search `index_identity` sourcetype="cisco:ise:syslog" ("5200" OR "5400") | eval mac=lower(replace(coalesce(Calling_Station_ID, EndPointMACAddress), ":", "-")) | where isnotnull(mac) AND len(mac)>=11 | eval identity=lower(trim(coalesce(user, user_name, User_Name, 'User-Name', username, ""))) | where NOT match(identity, "^#ctsrequest#$") AND NOT match(identity, "^#[^#]+#$") | eval ise_pass=if(match(_raw, "5200") OR match(_raw, "(?i)CISE_Passed"), 1, 0) | stats latest(identity) as ise_user, max(ise_pass) as ise_pass, latest(EndpointIdentityGroup) as ise_profile by mac]
iseval = 0
description = Cisco Spaces wireless device trust base. Filters DEVICE_LOCATION_UPDATE and DEVICE_ASSOCIATION events, normalizes MAC, extracts building/floor/SSID/type, then left-joins with ISE syslog to produce ise_user, ise_pass, and ise_profile. Used by building_resilience_wireless_device_trust_summary and building_resilience_wireless_devices_to_review.

# Catalyst Center site path normalization.
# Maps any DNAC raw site path to canonical "<Campus>: <Building>" - matching
# what spaces_hierarchy produces, so DNAC + Spaces join cleanly.
# Use:
# | eval site_raw = coalesce(Site, Location)
# | eval site = `dnac_site_normalize(site_raw)`
#
# Algorithm (two chained replace() calls):
#   1. Strip the "Global/<Country>/" root prefix (e.g. "Global/USA/").
#   2. From the remainder take the first two slash-delimited segments as
#      "<City/Campus>: <Building>", discarding any trailing floor/sub-path.
#      If only one segment remains, it is returned as-is.
# Examples:
#   "Global/USA/Chicago-IL/Midwest HQ/1st Floor" → "Chicago-IL: Midwest HQ"
#   "Global/USA/Austin-TX/North Office"           → "Austin-TX: North Office"
#   "Global/USA/Atlanta-GA"                       → "Atlanta-GA"
#   "Austin-TX/HQ Tower"                          → "Austin-TX: HQ Tower"
[dnac_site_normalize(1)]
args = site
definition = case(isnull($site$) OR trim($site$)="" OR lower($site$)="null", "", true(), replace(replace($site$, "^Global/[^/]+/", ""), "^([^/]+)/([^/]+)(/.*)?$", "\1: \2"))
iseval = 0
description = Normalize a DNAC raw site path into "<Campus>: <Building>" form. Returns empty string for null/blank/literal-null inputs. Strips the leading "Global/<Country>/" prefix, then extracts the first two path segments as "<Campus>: <Building>". Any trailing floor or sub-path is discarded. Works for any DNAC hierarchy without customer-specific hardcoding.


# -----------------------------------------------------------------------------
# Tier 4 - NRS tuning knobs (the only six worth a macro)
# Edit any of these to retune NRS without touching SPL. All other constants
# (sub-weights, D_risk components, capacity assumptions) are inlined in the
# panels themselves - there's only one or two places per constant, and folding
# them through 20+ macros made the dashboard hard to read.
# -----------------------------------------------------------------------------

# Headline ARQ rebalance - NRS = (wA*A + wR*R + wQ*Q) * D_risk
[nrs_w_nrs_a]
definition = "0.30"
iseval = 1
description = NRS top-level weight A (Attainability). Tune to rebalance the headline formula.

[nrs_w_nrs_r]
definition = "0.30"
iseval = 1
description = NRS top-level weight R (Retainability).

[nrs_w_nrs_q]
definition = "0.25"
iseval = 1
description = NRS top-level weight Q (Quality). Remaining 0.15 is implicit in the D_risk multiplier.

# Health pass thresholds (DNAC native 0-10 scale)
[nrs_th_ap_health]
definition = "7"
iseval = 1
description = Min OverallHealth for an AP to count as ok in R / per-site NRS arms. Also used by AP-health alerts.

[nrs_th_cl_health]
definition = "5"
iseval = 1
description = Min health.overallScore for a client to count as ok. Also used by Q9 worst-clients filter and client-health alerts.

# AP saturation threshold (concurrent clients)
[nrs_ap_saturation_clients]
definition = "30"
iseval = 1
description = Concurrent-client count above which an AP is flagged saturated. Used by Q5 KPI, Q5 heatmap filter, and the saturation alert.

[field_list]
description = Produces a sorted, comma-separated inventory of useful event fields for schema discovery. Removes Splunk metadata and generated fields before running fieldsummary so the result focuses on fields available for search, normalization, and dashboard design.
definition = fields - date_*,eventtype,host,index,info_*_time,linecount,punct,source,sourcetype,splunk_server*,tag*,timeendpos,timestartpos | fieldsummary | stats values(field) as Fields_List | eval Fields_List=mvjoin(mvsort(Fields_List), ", ")
