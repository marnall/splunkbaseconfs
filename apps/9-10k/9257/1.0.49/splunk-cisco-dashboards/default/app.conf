# NOTE: The authoritative release version lives in the repository-root VERSION
# file. Build tooling stamps version/build values into stage/package output.
# These source values are placeholders and must not be bumped for a release.

[install]
state = enabled
build = 2071

[id]
name = splunk-cisco-dashboards
version = 1.0.49

[launcher]
author = Splunk Field Solutions Team
description = Splunk Secure Networking Essentials delivers a curated set of React-based dashboards for visualizing Cisco fleet inventory, network performance, and security posture inside Splunk Web.
version = 1.0.49

[package]
check_for_updates = true
show_upgrade_notification = true
id = splunk-cisco-dashboards

[ui]
label = Splunk Secure Networking Essentials (Beta)
is_visible = 1
show_in_nav = 1
supported_themes = light,dark

# Reload triggers for custom config files. Without these, Splunk would
# request a restart on every change to the config, which Cloud Vetting
# blocks. searchbase.conf is the Dashboard Studio searchbase registry;
# network_diagrams.conf, searchbase_canvases.conf, customer_topology.conf,
# insights_workspaces.conf, templates.conf, and setup.conf are runtime persistence layers; the
# simple reload picks up edits made via the REST API or btool without
# requiring a Splunkd restart.
[triggers]
reload.setup = simple
reload.searchbase = simple
reload.network_diagrams = simple
reload.customer_topology = simple
reload.insights_workspaces = simple
reload.insights_workspace_preferences = simple
reload.templates = simple
