
[Executive Dashboard - Site Topology Lookup Generator]
description = Snapshots cisco:dnac:site:topology into site_topology_lookup.csv. Keyed on `id` (DNAC site UUID). Used as a join target for client/clienthealth/audit:logs to resolve siteId/siteHierarchyId UUIDs into human-readable site names + GPS + addresses. Schedule is conservative (every hour) since site:topology is a slow snapshot input. Floor rows are enriched with their parent building's `address`, `country`, `lat`, and `lon` so any consumer joining on a leaf UUID gets a complete location regardless of whether the leaf is a building or a floor. **Dual-schema note:** this sourcetype carries TWO different payload shapes upstream - event-style (Cisco's stock TA demo feed: `type="NETWORK"`, `eventId`, `name="topology_link_added"`, etc.) and hierarchy-style (real Catalyst Center site snapshots: `type IN ("global","area","building","floor")`, `id` UUID, `nameHierarchy`). The generator filters to hierarchy-style explicitly so demo-feed noise can never pollute the lookup, even if both schemas coexist on the same indexer.
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = 7 * * * *
enableSched = 1
allow_skew = 5m
dispatch.ttl = 16200
search = `index_catalyst` sourcetype="cisco:dnac:site:topology" type IN ("global","area","building","floor") \
| dedup id sortby -_time \
| eval Site=`dnac_site_normalize(nameHierarchy)` \
| eval lat=tonumber(latitude), lon=tonumber(longitude) \
| eval updated=strftime(now(), "%Y-%m-%d %H:%M:%S") \
| join type=left parentId \
   [ search `index_catalyst` sourcetype="cisco:dnac:site:topology" type="building" \
     | dedup id sortby -_time \
     | eval parentId=id \
     | rename latitude as buildingLat, longitude as buildingLon, address as buildingAddress, country as buildingCountry, name as buildingName \
     | table parentId buildingLat buildingLon buildingAddress buildingCountry buildingName ] \
| eval lat=if(isnotnull(lat),lat,tonumber(buildingLat)), lon=if(isnotnull(lon),lon,tonumber(buildingLon)), address=if(isnotnull(address),address,buildingAddress), country=if(isnotnull(country),country,buildingCountry), inheritedFromBuilding=if(type="floor",buildingName,null()) \
| table id name type parentId nameHierarchy Site lat lon address country floorNumber rfModel cisco_catalyst_host inheritedFromBuilding updated \
| outputlookup site_topology_lookup CreateInApp=true Create_Empty=true Override_If_Empty=false

[Asset Inventory - Build Lookup]
description = Builds the unified asset inventory lookup by correlating devices from Catalyst Center, Meraki, IOS syslog, ASA/FTD/Firepower, ISE NADs, F5 BIG-IP, and Windows/AD. Deduplicates by canonical device_name_short so short-name and FQDN rows collapse into one asset, preferring the richest source. Outputs to asset_inventory.csv.
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 5 2 * * *
enableSched = 1
allow_skew = 5m
dispatch.ttl = 90000
search = `index_catalyst` sourcetype="cisco:dnac:devicehealth" \
| stats latest(DeviceFamily) as device_family, latest(DeviceType) as device_type_raw, latest(Platform) as platform_id, latest(IpAddress) as ip_address, latest(MACAddress) as mac_address, latest(ImageVersion) as software_version, latest(SerialNumber) as serial_number, latest(Reachability) as reachability, latest(Manageability) as manageability, latest(DeviceRole) as device_role, latest(DeviceSeries) as device_series, latest(Site) as location by DeviceName \
| rename DeviceName as device_name \
| eval management_source="Catalyst Center", device_type=case(device_family=="Unified AP" OR device_family=="Access Points","AP", device_family=="Switches and Hubs","Switch", device_family=="Wireless Controller","WLC", device_family=="Routers","Router", 1==1,device_family), health_score=case(reachability=="Reachable" AND match(manageability,"^Managed"),100, reachability=="Reachable",50, 1==1,0), last_seen=now() \
| append \
[| search `index_catalyst` sourcetype="cisco:dnac:compliance" \
| stats latest(ComplianceStatus) as compliance_status by ComplianceDeviceID DeviceName \
| rename DeviceName as device_name \
| fields _time, device_name compliance_status] \
| stats latest(_time) as _time, latest(device_type) as device_type, latest(device_family) as device_family, latest(device_type_raw) as device_type_raw, latest(platform_id) as platform_id, latest(ip_address) as ip_address, latest(mac_address) as mac_address, latest(software_version) as software_version, latest(serial_number) as serial_number, latest(health_score) as health_score, latest(compliance_status) as compliance_status, latest(management_source) as management_source, latest(device_role) as device_role, latest(device_series) as device_series, latest(location) as location, latest(last_seen) as last_seen by device_name \
| append \
[| search `index_meraki` sourcetype="meraki:devicesavailabilitieschangehistory" \
| stats latest(device.model) as platform_id, latest(device.productType) as meraki_type, latest(network.name) as location by device.serial device.name \
| rename device.serial as serial_number, device.name as device_name \
| where len(device_name)>0 \
| eval management_source="Meraki Dashboard", device_family=case(meraki_type=="wireless","Meraki Wireless", meraki_type=="switch","Meraki Switch", meraki_type=="appliance","Meraki Appliance", meraki_type=="cellularGateway","Meraki Cellular Gateway", meraki_type=="sensor","Meraki Sensor", 1==1,"Meraki ".meraki_type), device_type=case(meraki_type=="wireless","AP", meraki_type=="switch","Switch", meraki_type=="appliance","Firewall", meraki_type=="cellularGateway","Gateway", meraki_type=="sensor","Sensor", 1==1,meraki_type), last_seen=now() \
| fields device_name device_type device_family platform_id serial_number location management_source last_seen] \
| append \
[| search `index_network` sourcetype="cisco:ios" \
| rex "^\d+/\d+/\d+\s+\d+:\d+:\d+\s+(?<device_name>[\w\-\.]+)" \
| where device_name!="AP" \
| stats count by device_name \
| eval management_source="IOS Syslog", device_type=case(match(device_name,"(?i)rtr|router"),"Router", match(device_name,"(?i)swi|switch|sw\d"),"Switch", match(device_name,"(?i)wlc|wireless"),"WLC", 1==1,"Network Device"), device_family="IOS Device", last_seen=now() \
| fields device_name device_type device_family management_source last_seen] \
| append \
[| tstats `scd_summariesonly` count from datamodel=Network_Traffic by All_Traffic.dvc \
| rename All_Traffic.dvc as device_name \
| eval device_name=lower(device_name) \
| where isnotnull(device_name) AND device_name!="" AND NOT match(device_name, "^[0-9a-f]{8}-[0-9a-f]{4}-") \
| stats count by device_name \
| eval management_source="Firewall Syslog", device_type="Firewall", device_family="ASA/FTD/Firepower", last_seen=now() \
| fields device_name device_type device_family management_source last_seen] \
| append \
[| search `index_identity` sourcetype="cisco:ise:syslog" \
| rex "NetworkDeviceName=(?<device_name>[^,]+)" \
| where isnotnull(device_name) AND device_name!="DefaultNetworkDevice" \
| stats count by device_name \
| eval management_source="ISE NAD", device_type=case(match(device_name,"(?i)wlc|wireless"),"WLC", match(device_name,"(?i)sw|switch"),"Switch", match(device_name,"(?i)rtr|router"),"Router", match(device_name,"(?i)fw|asa|vpn"),"Firewall", 1==1,"Network Device"), device_family="ISE Network Access Device", last_seen=now() \
| fields device_name device_type device_family management_source last_seen] \
| append \
[| search `index_f5` sourcetype="f5:bigip:management:device:icontrol" \
| stats latest(hostname) as device_name, latest(managementIp) as ip_address, latest(version) as software_version, latest(marketingName) as device_series, latest(platform) as platform_id by name \
| eval device_name=if(isnotnull(device_name),device_name,name), management_source="F5 iControl", device_type="Load Balancer", device_family="F5 BIG-IP", last_seen=now() \
| fields device_name device_type device_family platform_id ip_address software_version device_series management_source last_seen] \
| append \
[| search `index_windows` (sourcetype="XmlWinEventLog" OR sourcetype="ActiveDirectory" OR sourcetype="MSAD:NT6:DNS") \
| stats count by host \
| rename host as device_name \
| eval management_source="Windows/AD", device_type="Server", device_family="Windows Server", last_seen=now() \
| fields device_name device_type device_family management_source last_seen] \
| append \
[| search `index_dhcp` sourcetype="DhcpSrvLog" \
| stats count by host \
| rename host as device_name \
| eval management_source="Windows DHCP", device_type="Server", device_family="DHCP Server", last_seen=now() \
| fields device_name device_type device_family management_source last_seen] \
| eval device_name=lower(device_name), device_name_short=lower(if(match(device_name,"^[^\.]+\.[a-zA-Z]"),replace(device_name,"\..*$",""),device_name)) \
| eventstats values(management_source) as all_sources by device_name_short \
| eval management_source=mvjoin(all_sources, ", "), source_priority=case(match(management_source,"Catalyst Center"),1, match(management_source,"Meraki"),2, match(management_source,"F5"),3, match(management_source,"Firewall Syslog"),4, match(management_source,"IOS Syslog"),5, match(management_source,"ISE"),6, 1==1,7), name_rank=if(device_name=device_name_short,0,1) \
| sort 0 device_name_short source_priority name_rank -last_seen \
| stats first(*) as * by device_name_short \
| eval device_name=coalesce(device_name, device_name_short), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| table device_name device_name_short device_type device_family platform_id ip_address mac_address software_version serial_number location device_role device_series health_score compliance_status management_source last_seen \
| sort device_type device_name \
| search NOT device_name IN ("unknown") \
| outputlookup asset_inventory CreateInApp=true Create_Empty=true Override_If_Empty=false

[Splunk Inventory - Build Lookup]
description = Discovers Splunk infrastructure hosts (indexers, search heads, SHC members, cluster managers, deployment servers, IDMs, heavy/universal forwarders, ES/ITSI search heads) and writes them to splunk_inventory.csv. Used by the Network Diagram page as the "Splunk" side of the asset inventory.
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = 30 2 * * *
enableSched = 1
allow_skew = 5m
dispatch.ttl = 90000
search = | rest /services/server/info splunk_server=local count=0 \
| fields instance_type \
| eval splunk_deployment=if(isnull(instance_type) OR instance_type="","Enterprise","Cloud") \
| fields splunk_deployment \
| append maxtime=60 maxout=50000 timeout=60 \
    [| tstats summariesonly=true latest(dns_alt_name) as dns_alt_name latest(sh_label) as sh_label count as num_searches WHERE index=_introspection sourcetype=splunk_resource_usage component::Hostwide host IN (idx-*,sh-*,idm-*,c0m1-*,si-*) OR dns_alt_name=* OR sh_label=* earliest=-24h by host \
    | eval label = case(match(host,"^idm-"), "idm", match(host,"^c0m1-"), "cm", match(host,"^idx-"), "indexer", true(), dns_alt_name) \
    | eval role = case(match(host,"^idm-"), "idm", match(host,"^c0m1-"), "cm", match(host,"^idx-"), "indexer", true(), "search_head") \
    | rename host as host_name \
    | eval name=label, splunk_server_name=host_name, lower_splunk_server=host_name, host_fqdn=host_name, host_resolved=host_name, serverName=host_name, is_connected="yes", isForwarding=if(role!="indexer", 1, 0), is_search_head=if(role="search_head", "yes", "no"), env="Cloud" \
    | fields env host_name splunk_server_name lower_splunk_server name label host_fqdn host_resolved serverName role is_search_head is_connected isForwarding num_searches] \
| append maxtime=60 maxout=50000 timeout=60 \
    [| search (index=_internal) earliest=-7d sourcetype=splunkd NOT (CASE(MetricSchemaProcessor)) Metrics TERM(group=instance) TERM(name=instance) (deployment_client OR cluster_search_head OR search_head OR indexer OR cluster_slave OR search_peer OR license_master) NOT (universal_forwarder) \
    | eval mv_roles=split(instance_roles, ", ") \
    | stats count values(instance_roles) as roles values(mv_roles) as mv_roles values(index_cluster_label) as index_cluster_label values(sh_cluster_label) as sh_cluster_label by instance_guid server_name \
    | eval index_cluster_label=if(index_cluster_label="none", "", index_cluster_label), sh_cluster_label=if(sh_cluster_label="none", "", sh_cluster_label) \
    | stats count(eval(mv_roles="indexer")) as indexer count(eval(mv_roles="search_peer")) as search_peer count(eval(mv_roles="cluster_search_head")) as cluster_search_head count(eval(mv_roles="search_head")) as search_head count(eval(mv_roles="cluster_slave")) as cluster_peer count(eval(mv_roles="kv_store")) as kv_store_role count(eval(mv_roles="cluster_master")) as cluster_manager count(eval(mv_roles="license_master")) as license_manager count(eval(mv_roles="deployment_server")) as deployment_server count(eval(mv_roles="deployment_client")) as deployment_client count(eval(mv_roles="shc_captain")) as shc_captain count(eval(mv_roles="shc_member")) as shc_member values(sh_cluster_label) as sh_cluster_label by instance_guid server_name roles index_cluster_label \
    | eval roles=split(roles, ", ") \
    | rename instance_guid as guid \
    | rename server_name as host \
    | eval host=lower(host) \
    | append maxtime=60 maxout=50000 timeout=60 \
        [| search (index=_internal) Metrics sourcetype=splunkd TERM(group=tcpin_connections) earliest=-4h latest=now TERM(fwdType=full) \
        | stats values(connectionType) as tcp_connectionType values(arch) as tcp_arch values(version) as tcp_version values(fwdType) as tcp_fwdType values(os) as tcp_os sum(kb) as tcp_sum_kb dc(host) as tcp_targets_touched by hostname guid \
        | table * \
        | eval hostname = lower(host), isForwarding=1] \
    | append maxtime=60 maxout=50000 timeout=60 \
        [| search index=_introspection component=hostwide earliest=-24h \
        | eval host = lower(host) \
        | stats values(data.cpu_count) as cpu_count values(data.virtual_cpu_count) as vcpu_count values(data.splunk_version) as introspection_splunk_version values(data.os_version) as introspection_os_version by host data.instance_guid \
        | rename data.instance_guid as guid] \
    | append maxtime=60 maxout=50000 timeout=60 \
        [| rest /servicesNS/-/-/server/info splunk_server=* count=0 \
        | eval is_connected = "yes", is_search_head = if(server_roles="search_head", "yes", null()), is_indexer = if(server_roles="indexer" OR isForwarding = 0, "yes", null()), host_resolved = lower(host_resolved), host_fqdn = lower(host_fqdn), lower_splunk_server = lower(splunk_server), host = lower(host), server_roles = mvjoin(server_roles, ",") \
        | fields lower_splunk_server splunk_server host_fqdn host_resolved serverName host is_connected is_search_head is_indexer guid server_roles isForwarding] \
    | stats values(*) as * by guid \
    | append maxtime=60 maxout=50000 timeout=60 \
        [| tstats dc(data.search_props.sid) as num_searches WHERE index=_introspection sourcetype=splunk_resource_usage data.process_type=search earliest=-7d by data.search_props.search_head \
        | rename data.search_props.search_head as host \
        | eval is_search_head = "yes", host = lower(host) \
        | fields host is_search_head num_searches] \
    | append maxtime=60 maxout=50000 timeout=60 \
        [search (index=_internal sourcetype=splunkd_access method=POST CASE(/services/shcluster/member)) OR (index=_internal sourcetype=splunkd_access uri_path = "*/itsi*" OR uri_path="*/SplunkEnterpriseSecuritySuite*") OR (index=_internal sourcetype=splunk_web_access) earliest=-4h \
        | eval host = lower(host) \
        | stats values(uri_path) as uri_path by host \
        | eval is_es = if(uri_path LIKE "%/SplunkEnterpriseSecuritySuite/%", "yes", null()), is_itsi = if(uri_path LIKE "%/itsi/%", "yes", null()) \
        | where isnotnull(is_es) OR isnotnull(is_itsi) \
        | fields host is_es is_itsi] \
    | stats values(*) as * by host \
    | eval primary_role=case(indexer=1,"indexer", cluster_manager=1,"cluster_manager", shc_member=1 OR shc_captain=1,"search_head_cluster", cluster_search_head=1,"cluster_search_head", search_head=1,"search_head", license_manager=1,"license_manager", deployment_server=1,"deployment_server", tcp_fwdType="full","heavy_forwarder", tcp_fwdType="uf","universal_forwarder") \
    | eval index_cluster_label = if(isnull(index_cluster_label) OR index_cluster_label="", null(), index_cluster_label) \
    | eval roles = case(isnull(roles) AND primary_role="heavy_forwarder", "heavy_forwarder", true(), roles) \
    | eval version=coalesce(tcp_version, introspection_splunk_version) \
    | eval label = case(primary_role="cluster_manager", host, primary_role="search_head_cluster", sh_cluster_label, isnotnull(index_cluster_label), index_cluster_label, true(), host) \
    | eval name = case(primary_role = "search_head_cluster" AND is_itsi = "yes", "itsi-shc", primary_role = "search_head_cluster" AND is_es = "yes", "es-shc", primary_role = "search_head_cluster", "shc", primary_role = "indexer" AND isnull(index_cluster_label), "idx", primary_role = "indexer" AND isnotnull(index_cluster_label), "idxc", (primary_role = "search_head" OR primary_role = "cluster_search_head") AND is_itsi = "yes", "itsi", (primary_role = "search_head" OR primary_role = "cluster_search_head") AND is_es = "yes", "es", primary_role = "search_head" OR primary_role = "cluster_search_head" OR is_search_head="yes", "sh", primary_role = "cluster_manager", "cm", primary_role = "heavy_forwarder", "hf", true(), "adhoc") \
    | eval is_search_head = case(primary_role="search_head", "yes", primary_role="indexer" OR primary_role = "heavy_forwarder", "no", true(), is_search_head) \
    | streamstats dc(label) as count by name \
    | eval name = name . "-" . printf("%02d", count) \
    | eval server_roles=split(server_roles, ",") \
    | eval roles = if(isnull(roles) AND is_search_head="yes", "search_head", roles), roles = mvdedup(mvappend(roles,server_roles)) \
    | eval role=mvjoin(roles,","), splunk_server = if(isnull(splunk_server) OR splunk_server="", host, splunk_server) \
    | foreach host host_fqdn host_resolved serverName lower_splunk_server \
        [| eval <<FIELD>> = if(isnull(<<FIELD>>) OR <<FIELD>>="", splunk_server, <<FIELD>>), <<FIELD>> = lower(<<FIELD>>)] \
    | eval _time = now() \
    | fillnull value="no" is_connected \
    | fillnull value=0 num_searches \
    | eval env="Enterprise" \
    | rename host as host_name, splunk_server as splunk_server_name \
    | fields env host_name label role primary_role cluster_manager cluster_peer cluster_search_head count cpu_count deployment_client deployment_server guid host_fqdn host_resolved index_cluster_label indexer introspection_os_version introspection_splunk_version isForwarding is_connected is_es is_indexer is_itsi is_search_head kv_store_role license_manager lower_splunk_server name num_searches roles search_head search_peer serverName server_roles sh_cluster_label shc_captain shc_member splunk_server_name tcp_arch tcp_connectionType tcp_fwdType tcp_os tcp_sum_kb tcp_targets_touched tcp_version vcpu_count version] \
| filldown splunk_deployment \
| where env=splunk_deployment \
| stats latest(*) as * by host_name \
| eval name=if(isnull(name) OR name="", host_name, name), label=if(isnull(label) OR label="", host_name, label) \
| table splunk_server_name lower_splunk_server name label host_name host_fqdn host_resolved serverName guid role primary_role index_cluster_label sh_cluster_label is_search_head is_connected isForwarding num_searches version cpu_count vcpu_count introspection_os_version introspection_splunk_version is_es is_itsi env \
| outputlookup splunk_inventory
