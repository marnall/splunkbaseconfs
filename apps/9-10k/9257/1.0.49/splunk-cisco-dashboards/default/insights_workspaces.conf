# insights_workspaces.conf - shared Insights workspace definitions and layouts.
#
# QUICK START
# -----------
# 1. Define the workspace in [workspace.<workspace_id>].
# 2. Add one [layout.<workspace_id>.<section_id>] stanza per section.
# 3. List Searchbase stanza IDs in each layout's tiles setting.
# 4. Optionally define reusable [signal_item.<item_id>] entries and reference
#    them from [signal_rail.<workspace_id>].
#
# Workspace and section IDs are stable data contracts, not display labels.
# Section titles, icons, links, and the valid source_workspace values are
# defined in src/main/webapp/common/config/insightsWorkspaces.ts. Each
# Searchbase tile must also have search_name metadata and matching
# viz_options.overview workspace, section, and tileId values; otherwise the
# catalogue cannot join the search to the configured layout.
#
# TILE-COUNT PRECEDENCE
# ---------------------
# The effective tile count is resolved in this order:
#   1. The authenticated user's saved per-section browser preference.
#   2. visible_count in [layout.<workspace_id>.<section_id>].
#   3. default_tile_count in [workspace.<workspace_id>].
#
# Therefore, default_tile_count is only a fallback. If every layout stanza has
# visible_count = 9, changing default_tile_count to 3 will not change those
# sections. Returning users can also retain an older count until they reset
# their workspace customizations or adjust the tile-count control.
#
# WORKSPACE FIELDS
# ----------------
# label                    Display name in the workspace manager.
# source_workspace         Registered workspace source/catalogue contract.
# sections                 Ordered section IDs available in this workspace.
# default_visible_sections Subset shown when no user preference exists.
# max_visible_sections     Maximum number of simultaneously visible sections.
# min_tile_count           Lowest count selectable for a section.
# max_tile_count           Highest count selectable for a section.
# default_tile_count       Fallback count when a layout has no visible_count.
# header_title             Main workspace heading.
# header_subtitle          Supporting heading text.
# hide_default_logo        1 hides the packaged header logo; 0 shows it.
# is_builtin               1 marks a packaged workspace.
# enabled                  1 makes the workspace available.
# sort_order               Lower values appear earlier in the manager.
# map_visible              1 enables the topology/map region.
# map_position             left or right.
# regional_view            map or table.
#
# LAYOUT FIELDS
# -------------
# tiles                Ordered, comma-separated Searchbase stanza IDs.
# searchbase_additions Optional extra Searchbase stanza IDs for this section.
# visible_count        Section-specific factory count; overrides the workspace
#                      default_tile_count for users without a saved preference.
#
# EXAMPLE: WORKSPACE AND SECTION LAYOUT
# -------------------------------------
# [workspace.conference_soc]
# label = Conference SOC
# source_workspace = agentic_soc
# sections = dns_security,unified_investigation
# default_visible_sections = dns_security,unified_investigation
# max_visible_sections = 2
# min_tile_count = 1
# max_tile_count = 9
# default_tile_count = 3
# header_title = Conference Security Operations
# header_subtitle = Live DNS and investigation telemetry
# hide_default_logo = 1
# is_builtin = 1
# enabled = 1
# sort_order = 100
# map_visible = 0
# map_position = right
# regional_view = table
#
# [layout.conference_soc.dns_security]
# tiles = agentic_soc_umbrella_dns_requests,agentic_soc_umbrella_unique_domains,agentic_soc_umbrella_blocked_requests
# visible_count = 3
#
# [layout.conference_soc.unified_investigation]
# tiles = agentic_soc_unified_threat_activity,agentic_soc_unified_xdr_severity,agentic_soc_unified_investigation_queue
# visible_count = 3
#
# EXAMPLE: SIGNAL ITEM AND RAIL
# -----------------------------
# [signal_item.conference_dns_blocks]
# search_name = Agentic SOC - Umbrella Blocked Requests
# label = DNS blocks
# value_field = WindowBlocked
# threshold_warning = 25
# threshold_critical = 100
# threshold_direction = higher_is_worse
# threshold_unit = events
#
# [signal_rail.conference_soc]
# enabled = 1
# show_priority_drilldown = 0
# rows = 1
# speed = 0
# density = comfortable
# font_size = standard
# items = conference_dns_blocks
#
# Packaged definitions belong in default/insights_workspaces.conf. Workspace
# Manager changes are written to local/insights_workspaces.conf through the
# capability-protected scd_insights_workspaces REST endpoint. The local overlay
# takes precedence and survives app upgrades. Installing the endpoint mapping
# requires one Splunk restart; subsequent configuration writes do not.

