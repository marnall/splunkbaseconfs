[script:scd_insights_workspaces]
match = /scd_insights_workspaces
script = scd_workspace_rest.py
scripttype = persist
handler = scd_workspace_rest.WorkspaceMutationHandler
python.version = python3
python.required = 3.9, 3.13
requireAuthentication = true
output_modes = json
passPayload = true
passSystemAuth = true
capability = ssne_manage_insights_workspaces

