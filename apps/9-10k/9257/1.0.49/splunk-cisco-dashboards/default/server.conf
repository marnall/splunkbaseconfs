# Search Head Cluster replication for custom configs shipped with this app.
# Splunk Cloud Vetting (check_custom_conf_replication) requires that any
# custom .conf file the app introduces is included in the SHC replication
# allow-list so configurations stay synchronized across captain and members.
# Splunk-stock conf files (props.conf, transforms.conf, savedsearches.conf,
# macros.conf, times.conf) replicate by default and do not need entries.
[shclustering]
conf_replication_include.searchbase = true
conf_replication_include.network_diagrams = true
conf_replication_include.customer_topology = true
conf_replication_include.insights_workspaces = true
conf_replication_include.insights_workspace_preferences = true
conf_replication_include.templates = true
conf_replication_include.setup = true
