[Previdian - Scanner findings in active exploitation]
search = | inputlookup previdian_scanner_sample | lookup previdian_kev cve_id AS cve OUTPUT sensor_observed confidence_level in_cisa_kev added_date first_observed title vendor product cvss_score previdian_url | where isnotnull(title) | table cve title vendor product sensor_observed confidence_level in_cisa_kev added_date first_observed cvss_score scanner previdian_url
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 15 * * * *
enableSched = 0
description = Join scanner CVE rows to the Previdian catalog lookup. Replace previdian_scanner_sample with your scanner index and call the previdian_prioritize macro.

[Previdian - First exploitation attempt observed]
search = `previdian_index` sourcetype=previdian:notification event_type=first_observation
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
description = Watch notification that Previdian sensors first observed exploitation attempts for a vulnerability.

[Previdian - Priority Act Now]
search = | inputlookup previdian_priority WHERE classification=act_now | table cve_id title vendor product bucket workflow_state sensor_observed in_cisa_kev confidence_level watched_name previdian_url
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 20 * * * *
enableSched = 0
description = Current Priority rows classified Act Now. This lookup is replaced on each poll.

[Previdian - Attacker infrastructure in proxy logs]
search = `previdian_index` sourcetype=previdian:infrastructure | table host kind cve_id unique_attacker_ips open_directory last_seen_at previdian_url
dispatch.earliest_time = -30d
dispatch.latest_time = now
cron_schedule = 30 * * * *
enableSched = 0
description = Enterprise attacker infrastructure indexed by the optional input. Look host up against proxy, DNS, or firewall logs.

[Previdian - Open CVE]
search = `previdian_index` sourcetype=previdian:kev cve="$cve$" | head 1 | table cve_id title vendor product confidence_level sensor_observed first_observed last_observed in_cisa_kev added_date cvss_score epss_score unique_attacker_ips total_attempts previdian_url
description = One catalog row for a CVE. Pass cve from a workflow action.
enableSched = 0
