[previdian:kev]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "added_date":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 30
TRUNCATE = 0
ANNOTATE_PUNCT = false
FIELDALIAS-cve = cve_id AS cve
FIELDALIAS-vendor = vendor AS vendor_product
FIELDALIAS-severity = cvss_severity AS severity
EVAL-signature = title

[previdian:notification]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "created_at":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 0
ANNOTATE_PUNCT = false
FIELDALIAS-cve = cve_id AS cve

[previdian:observation]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "observed_at":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 0
ANNOTATE_PUNCT = false
FIELDALIAS-cve = cve_id AS cve
FIELDALIAS-src = attacker_ip AS src
FIELDALIAS-url = request_path AS url
FIELDALIAS-http_user_agent = user_agent AS http_user_agent

[previdian:infrastructure]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "last_seen_at":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 0
ANNOTATE_PUNCT = false
FIELDALIAS-dest = host AS dest
FIELDALIAS-cve = cve_id AS cve

[previdian:attacker]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "last_seen_at":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 0
ANNOTATE_PUNCT = false
FIELDALIAS-src = attacker_ip AS src
