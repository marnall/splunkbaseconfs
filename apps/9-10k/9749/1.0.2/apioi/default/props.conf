# Sourcetypes. Events arrive through the HEC /event endpoint, which carries
# the timestamp, host, source, index and INDEXED fields in the envelope, so
# time extraction and line breaking below only matter for the rare event
# posted to the raw endpoint by hand.

[e2r:apigw:access]
description = API Gateway access log, one JSON object per request (see the e2r-oas stack's AccessLogSetting)
category = Structured
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
TIME_PREFIX = "time":"
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 16
TZ = UTC
# Search-time aliases so the nested names read like the indexed ones and a
# search works whichever way the event was written.
FIELDALIAS-caller = caller.sub AS sub caller.email AS email caller.group AS group caller.actingAs AS actingAs caller.sourceIp AS sourceIp caller.userAgent AS userAgent caller.apiKeyId AS apiKeyId
FIELDALIAS-error = error.type AS errorType error.checkpoint AS checkpoint
EVAL-isError = coalesce(mvindex(isError,0), if(mvindex(status,0) >= 400, "true", "false"))
# Search-time fallback for events that arrived without the indexed apiName.
EVAL-apiName = coalesce(mvindex(apiName,0), case(mvindex(service,0)=="oas", "e2r-oas", service=="pilots", "e2r-pilots", service=="idp", "e2r-identity", service=="invitations", "e2r-identity", isnotnull(service), "e2r-".mvindex(service,0)))
EVAL-statusClass = coalesce(mvindex(statusClass,0), substr(tostring(mvindex(status,0)), 1, 1)."xx")
EVAL-latencySec = round(mvindex(responseLatencyMs,0) / 1000, 2)
# Each of these arrives twice - as an indexed field from the HEC envelope and
# again from the JSON in _raw (or a FIELDALIAS) - and Splunk would show both.
# Collapse identical values so tables read once. tstats never sees _raw.
EVAL-requestId = mvdedup(requestId)
EVAL-service = mvdedup(service)
EVAL-stage = mvdedup(stage)
EVAL-domain = mvdedup(domain)
EVAL-api = mvdedup(api)
EVAL-method = mvdedup(method)
EVAL-resourcePath = mvdedup(resourcePath)
EVAL-path = mvdedup(path)
EVAL-status = mvdedup(status)
EVAL-responseLatencyMs = mvdedup(responseLatencyMs)
EVAL-integrationLatencyMs = mvdedup(integrationLatencyMs)
EVAL-integrationStatus = mvdedup(integrationStatus)
EVAL-authorizerStatus = mvdedup(authorizerStatus)
EVAL-authorizerLatencyMs = mvdedup(authorizerLatencyMs)
EVAL-sub = mvdedup(sub)
EVAL-email = mvdedup(email)
EVAL-group = mvdedup(group)
EVAL-actingAs = mvdedup(actingAs)
EVAL-sourceIp = mvdedup(sourceIp)
EVAL-userAgent = mvdedup(userAgent)
EVAL-apiKeyId = mvdedup(apiKeyId)
EVAL-errorType = mvdedup(errorType)
EVAL-checkpoint = mvdedup(checkpoint)
EVAL-waf = mvdedup(waf)
LOOKUP-app = api_keys apiKeyId OUTPUT appName, channel

[e2r:apioi:replayer]
description = One summary event per replayer run (pending, replayed, records, rejected, quarantined, skipped)
category = Structured
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
