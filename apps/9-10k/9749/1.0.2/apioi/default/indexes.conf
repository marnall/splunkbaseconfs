# Index DEFINITIONS only. Sizing (maxTotalDataSizeMB for these and for the
# built-in indexes) is deliberately not here: AppInspect rejects size
# properties and built-in-index stanzas inside an app package, so they live
# in splunk/instance/indexes.conf, which the bootstrap installs as
# $SPLUNK_HOME/etc/system/local/indexes.conf on the box.

[apigw]
homePath   = $SPLUNK_DB/apigw/db
coldPath   = $SPLUNK_DB/apigw/colddb
thawedPath = $SPLUNK_DB/apigw/thaweddb
frozenTimePeriodInSecs = 2592000

[cloudtrail]
homePath   = $SPLUNK_DB/cloudtrail/db
coldPath   = $SPLUNK_DB/cloudtrail/colddb
thawedPath = $SPLUNK_DB/cloudtrail/thaweddb
frozenTimePeriodInSecs = 7776000

# The replayer's run summaries and anything else the pipeline says about itself.
[apioi]
homePath   = $SPLUNK_DB/apioi/db
coldPath   = $SPLUNK_DB/apioi/colddb
thawedPath = $SPLUNK_DB/apioi/thaweddb
frozenTimePeriodInSecs = 7776000
