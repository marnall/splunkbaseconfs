# Where the data lives. These are the only places the app names an index
# or a sourcetype - point them at yours and every dashboard, alert and
# report follows. The defaults match the pipeline in
# github.com/earth2recon/e2r-apioi (Firehose processor sets the sourcetype).

[apigw_access]
definition = index=apigw sourcetype=e2r:apigw:access
iseval = 0

[cloudtrail]
definition = index=cloudtrail sourcetype=aws:cloudtrail
iseval = 0

[replayer]
definition = index=apioi sourcetype=e2r:apioi:replayer
iseval = 0

# The app's indexes, as a search (events per day) and as a list (for the
# REST index table and the ingestion dropdown).
[apioi_indexes]
definition = index=apigw OR index=cloudtrail OR index=apioi
iseval = 0

[apioi_index_names]
definition = apigw, cloudtrail, apioi
iseval = 0

# Daily-volume alert threshold in GB (80% of the licence; 8 for the 10 GB
# Developer licence).
[licence_alert_gb]
definition = 8
iseval = 0
