# apioi - API Operational Intelligence
# Dashboards, alerts, indexes and sourcetypes for Amazon API Gateway access
# logs and CloudTrail. Source and the ingestion pipeline (CloudWatch Logs ->
# Firehose -> HEC): github.com/earth2recon/e2r-apioi

[install]
is_configured = false
state = enabled
build = 30

[launcher]
author = Adam Ali
description = API Operational Intelligence for Amazon API Gateway - access logs and CloudTrail: traffic, latency, errors, callers, user sessions, deploy audit and ingestion-pipeline health. Indexes and sourcetypes are set in macros.conf.
version = 1.0.2

[package]
id = apioi
check_for_updates = true

[id]
name = apioi
version = 1.0.2

[ui]
is_visible = true
label = API Operational Intelligence
supported_themes = enterprise,dark

