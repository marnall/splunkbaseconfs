# Alerts. Cron is in the server's timezone (Australia/Sydney on the
# instance). The box is up 07:00-19:00, so the 15-minute alerts run inside
# that window and the morning summary looks back 13 hours to cover the
# night's replay.
#
# Push to the phone: the Secure Gateway alert action (action.ssg_mobile_alert)
# is enabled on each alert; it does nothing until a device is paired.

[apioi - 5xx spike]
description = More than 5 server errors across the APIs in the last 15 minutes
search = | tstats count where `apigw_access` statusClass=5xx by apiName, service | where count > 5
cron_schedule = */15 7-18 * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 1h
action.ssg_mobile_alert = 1
counttype = number of events
relation = greater than
quantity = 0

[apioi - authorizer refusal burst]
description = A single source IP refused (401/403) more than 30 times in 15 minutes - credential guessing or a broken client
search = | tstats count where `apigw_access` status IN (401, 403) by sourceIp, apiName | where count > 30
cron_schedule = */15 7-18 * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.fields = sourceIp
alert.suppress.period = 2h
action.ssg_mobile_alert = 1
counttype = number of events
relation = greater than
quantity = 0

[apioi - replayer quarantined a batch]
description = The overnight replayer moved a batch to quarantine/ - HEC rejected it three times
search = `replayer` quarantined > 0
cron_schedule = */30 7-18 * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.track = 1
action.ssg_mobile_alert = 1
counttype = number of events
relation = greater than
quantity = 0

[apioi - overnight not caught up by 08:00]
description = Objects were still waiting under splunk-failed/ at the 07:45 replayer run
search = `replayer` | head 1 | where pending > 0
cron_schedule = 0 8 * * *
dispatch.earliest_time = -13h
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
action.ssg_mobile_alert = 1
counttype = number of events
relation = greater than
quantity = 0

[apioi - licence usage above 8 GB]
description = Yesterday's indexed volume passed the `licence_alert_gb` threshold (GB) - set the macro to ~80% of your licence
search = index=_internal source=*license_usage.log type=Usage earliest=-1d@d latest=@d | stats sum(eval(b/1024/1024/1024)) AS gb | where gb > `licence_alert_gb`
cron_schedule = 10 7 * * *
dispatch.earliest_time = -13h
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.track = 1
action.ssg_mobile_alert = 1
counttype = number of events
relation = greater than
quantity = 0

[apioi - morning summary]
description = Yesterday and overnight in one table: requests, errors, p95, distinct users, per service (report, not an alert)
search = | tstats count dc(sub) AS users where `apigw_access` earliest=-1d@d latest=@d by apiName, isError | eventstats sum(count) AS requests max(users) AS users by apiName | eval errors=if(isError="true", count, 0) | stats first(requests) AS requests sum(errors) AS errors first(users) AS users by apiName | join type=left apiName [search `apigw_access` earliest=-1d@d latest=@d | stats perc95(responseLatencyMs) AS p95 by apiName] | eval errorPct=round(errors/requests*100, 1), p95=round(p95)
cron_schedule = 20 7 * * *
dispatch.earliest_time = -13h
dispatch.latest_time = now
enableSched = 1
is_visible = 1
