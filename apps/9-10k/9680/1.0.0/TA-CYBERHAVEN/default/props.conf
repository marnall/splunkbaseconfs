[source::...TA-CYBERHAVEN*.log*]
SHOULD_LINEMERGE = true
sourcetype = ta:cyberhaven:log

[cyberhaven:incidents]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%Z
TIME_PREFIX = "event_time":"

# CIM Intrusion Detection (DLP) and Alerts data model mappings
EVAL-action             = if(blocked="true", "blocked", "allowed")
EVAL-app                = coalesce('event_details.start_event.destination.app.name', 'event_details.start_event.source.app.name')
FIELDALIAS-body         = ai_summary AS body
EVAL-dest               = coalesce('event_details.start_event.destination.cloud_app.name', 'event_details.start_event.destination.web.url', 'event_details.start_event.destination.file.name')
FIELDALIAS-dvc          = event_details.start_event.action.hostname AS dvc
FIELDALIAS-object       = dataset.name AS object
FIELDALIAS-severity     = policy.severity AS severity
FIELDALIAS-signature    = policy.name AS signature
FIELDALIAS-signature_id = policy.id AS signature_id
FIELDALIAS-src_user     = user.local_username AS src_user
FIELDALIAS-user         = user.local_username AS user
FIELDALIAS-user_name    = user.local_username AS user_name
EVAL-src                = coalesce('event_details.start_event.source.cloud_app.name', 'event_details.start_event.source.web.url', 'event_details.start_event.source.file.name')
FIELDALIAS-type         = created_by AS type
LOOKUP-cyberhaven_lineage   = cyberhaven_lineage_lookup start_id AS event_details.start_event.id end_id AS event_details.end_event.id start_time AS event_details.start_event.timestamp end_time AS event_details.end_event.timestamp OUTPUTNEW cyberhaven_lineage_b64
LOOKUP-cyberhaven_tenant    = cyberhaven_tenant_lookup sourcetype OUTPUTNEW cyberhaven_tenant_url
LOOKUP-cyberhaven_insider_risk = cyberhaven_insider_risk_lookup user_id AS user.id OUTPUTNEW cyberhaven_insider_risk_b64
EVAL-vendor_product         = "Cyberhaven"

[cyberhaven:events]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%Z
TIME_PREFIX = "timestamp":"
MAX_TIMESTAMP_LOOKAHEAD = 28

# CIM Intrusion Detection (DLP) and Endpoint-filesystem data model mappings
EVAL-action = case('action.blocked'="true", "blocked", 'action.kind'="copy", "copied", 'action.kind'="move", "moved", 'action.kind'="delete", "deleted", 'action.kind'="create", "created", 'action.kind'="upload", "uploaded", 'action.kind'="download","downloaded", 'action.kind'="email_send","email", 'action.kind'="send_to_printer", "printed", 'action.kind'="clipboard_copy_paste", "copied", true(), "unknown")
EVAL-app       = coalesce('destination.cloud_app.name', 'source.cloud_app.name', 'destination.app.name', 'source.app.name')
EVAL-dest      = coalesce('destination.display_name', 'destination.domain', 'destination.file.name', 'destination.web.url', 'destination.cloud_app.name')
FIELDALIAS-dvc = action.hostname AS dvc
FIELDALIAS-file_create_time = source.file.file_create_time AS file_create_time
FIELDALIAS-file_modify_time = source.file.modified_at AS file_modify_time
EVAL-file_hash = coalesce('source.file.sha256_hash', 'source.file.md5_hash')
FIELDALIAS-file_size = source.file.size AS file_size
FIELDALIAS-process_id = action.process_id AS process_id
FIELDALIAS-src_user = user.local_username AS src_user
FIELDALIAS-user = user.local_username AS user
EVAL-src      = coalesce('source.display_name', 'source.domain', 'source.file.name', 'source.web.url', 'source.cloud_app.name')
LOOKUP-cyberhaven_tenant       = cyberhaven_tenant_lookup sourcetype OUTPUTNEW cyberhaven_tenant_url
LOOKUP-cyberhaven_insider_risk = cyberhaven_insider_risk_lookup user_id AS user.id OUTPUTNEW cyberhaven_insider_risk_b64
EVAL-vendor_product = "Cyberhaven"

[cyberhaven:audit]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%Z
TIME_PREFIX = "timestamp":"
MAX_TIMESTAMP_LOOKAHEAD = 28

# CIM Change data model mappings
LOOKUP-action         = cyberhaven_change_action_lookup action_type OUTPUT action
FIELDALIAS-object          = object_name AS object
FIELDALIAS-object_category = object_type AS object_category
FIELDALIAS-dvc             = actor_ip AS dvc
EVAL-src_user         = case(actor_type="user", actor, actor_type="api_key", actor, true(), null())
EVAL-user = src_user
EVAL-vendor_product   = "Cyberhaven"