[admin:ta_astelia_configuration]
match = /
members = ta_astelia_account, ta_astelia_settings

[admin:ta_astelia_inputs]
match = /
members = ta_astelia_astelia_audit_logs, ta_astelia_astelia_connectors

[admin_external:ta_astelia_account]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = ta_astelia_rh_account.py
handleractions = edit, list, remove, create
handlerpersistentmode = true

[admin_external:ta_astelia_settings]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = ta_astelia_rh_settings.py
handleractions = edit, list
handlerpersistentmode = true

[admin_external:ta_astelia_astelia_audit_logs]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = ta_astelia_rh_astelia_audit_logs.py
handleractions = edit, list, remove, create
handlerpersistentmode = true

[admin_external:ta_astelia_astelia_connectors]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = ta_astelia_rh_astelia_connectors.py
handleractions = edit, list, remove, create
handlerpersistentmode = true
