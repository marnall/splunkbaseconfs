[astelia:audit]
category = Structured
description = Astelia audit-log events pulled from the public API (GET /v1/audit-logs)
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
DATETIME_CONFIG = NONE
FIELDALIAS-astelia_audit_action = action ASNEW astelia_action
FIELDALIAS-astelia_audit_object_category = target.type ASNEW object_category
EVAL-user_id = nullif('actor.id', "null")
EVAL-user = coalesce(nullif('actor.email', "null"), nullif('actor.id', "null"), 'actor.type')
EVAL-user_type = 'actor.type'
EVAL-object_id = nullif('target.id', "null")
EVAL-object = coalesce(nullif('target.name', "null"), nullif('target.id', "null"))
EVAL-status = if(result == "success", "success", "failure")
EVAL-vendor_product = "Astelia"
EVAL-change_type = mvindex(split(astelia_action, "."), 0)
LOOKUP-astelia_audit_action_cim = astelia_audit_action_cim astelia_action OUTPUT cim_action AS action

[astelia:connector]
category = Structured
description = Astelia connector-health snapshot rows pulled from the public API (GET /v1/connectors)
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
DATETIME_CONFIG = NONE
FIELDALIAS-astelia_connector_type = type ASNEW connector_type
FIELDALIAS-astelia_connector_status = status ASNEW connector_status
EVAL-vendor_product = "Astelia"
EVAL-dest = name
