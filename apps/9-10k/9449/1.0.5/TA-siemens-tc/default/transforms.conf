##############################################
# Siemens Teamcenter PLM - transforms.conf
##############################################

# ─── Log Level Lookup ────────────────────────────────────────────────────────
# Maps extracted log_level → normalized_severity label + numeric priority.
# CSV lives at:  lookups/tc_log_levels.csv
[tc_log_level_lookup]
filename   = tc_log_levels.csv
match_type = WILDCARD(log_level)

# ─── Session ID Type Classification ──────────────────────────────────────────
# Reads the session_id field produced by EXTRACT-tc_main and tags each event
# with a session_id_type dimension:
#
#   noid        - NoID / NoId / NoId.Svr / NoId.Mux.Svr
#   module_init - InitializeModule.*
#   thread      - Thread-NNNNN[:...]
#   server      - host.pid.server[.seq.role]  (fully-qualified)
#
[tc_session_type]
SOURCE_KEY = session_id
REGEX      = ^(?P<session_id_type>NoI[dD](?:\.[A-Za-z.]+)?|InitializeModule\.[A-Za-z0-9_]+|Thread-\d+|[a-zA-Z0-9-]+\.\d+\.\w+)
FORMAT     = session_id_type::$1
