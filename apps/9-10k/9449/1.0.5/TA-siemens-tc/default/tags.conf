# ============================================================
# Siemens Teamcenter PLM TA - tags.conf
# Correct format per Splunk spec:
#   Stanza = [field=value]  (the thing being tagged)
#   Keys   = tag_name = enabled|disabled
# ============================================================

# ---- Authentication / Session ----

[eventtype=tc_user_login]
authentication = enabled
plm            = enabled
teamcenter     = enabled

[eventtype=tc_user_logout]
authentication = enabled
session        = enabled
plm            = enabled
teamcenter     = enabled

[eventtype=tc_session_start]
application = enabled
start       = enabled
plm         = enabled
teamcenter  = enabled

[eventtype=tc_session_init]
application = enabled
start       = enabled
plm         = enabled
teamcenter  = enabled

[eventtype=tc_digital_signing_disabled]
authentication = enabled
policy         = enabled
plm            = enabled
teamcenter     = enabled

# ---- Server Health ----

[eventtype=tc_server_ready]
application  = enabled
start        = enabled
availability = enabled
plm          = enabled
teamcenter   = enabled

[eventtype=tc_db_connected]
database   = enabled
connect    = enabled
plm        = enabled
teamcenter = enabled

[eventtype=tc_schema_loaded]
database   = enabled
update     = enabled
plm        = enabled
teamcenter = enabled

[eventtype=tc_module_load]
application = enabled
inventory   = enabled
plm         = enabled
teamcenter  = enabled

[eventtype=tc_pipe_error]
network    = enabled
error      = enabled
plm        = enabled
teamcenter = enabled

[eventtype=tc_server_exiting]
application = enabled
end         = enabled
plm         = enabled
teamcenter  = enabled

# ---- License Management ----

[eventtype=tc_license_info]
license    = enabled
plm        = enabled
teamcenter = enabled

[eventtype=tc_license_session_info]
license    = enabled
session    = enabled
plm        = enabled
teamcenter = enabled

[eventtype=tc_license_deprecation]
license    = enabled
warning    = enabled
plm        = enabled
teamcenter = enabled

# ---- Error Tracking ----

[eventtype=tc_error_event]
error      = enabled
plm        = enabled
teamcenter = enabled

[eventtype=tc_warning_event]
warning    = enabled
plm        = enabled
teamcenter = enabled

[eventtype=tc_error_code_event]
error      = enabled
plm        = enabled
teamcenter = enabled

[eventtype=tc_function_missing]
error       = enabled
application = enabled
plm         = enabled
teamcenter  = enabled

# ---- Performance ----

[eventtype=tc_timeout_config]
performance   = enabled
configuration = enabled
plm           = enabled
teamcenter    = enabled

[eventtype=tc_pom_refresh_stats]
performance = enabled
database    = enabled
plm         = enabled
teamcenter  = enabled

[eventtype=tc_bom_ext_enter]
performance = enabled
application = enabled
plm         = enabled
teamcenter  = enabled

[eventtype=tc_bom_ext_exit]
performance = enabled
application = enabled
plm         = enabled
teamcenter  = enabled
