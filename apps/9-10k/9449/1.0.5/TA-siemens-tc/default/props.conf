##############################################
# Siemens Teamcenter PLM - props.conf
# sourcetype: siemens:teamcenter:syslog
# Source:     tcserver.exe syslog files
##############################################

[siemens:teamcenter:syslog]

# ─── Event Boundary ─────────────────────────────────────────────────────────
# Each new event begins on a line starting with a log-level keyword.
# Continuation lines (DLL lists, env-var dumps, etc.) are merged into the
# preceding event automatically.
SHOULD_LINEMERGE = true
BREAK_ONLY_BEFORE = ^(?:INFO|WARN|ERROR|DEBUG)\s+-\s

# ─── Timestamp ──────────────────────────────────────────────────────────────
# Format: INFO  - 2026/07/16-17:13:51.818 UTC - ...
# Edge case: 2026/07/16-17:19:01. 22 UTC  (space before ms) is handled by \s*
TIME_PREFIX           = ^(?:INFO|WARN|ERROR|DEBUG)\s+-\s+
TIME_FORMAT           = %Y/%m/%d-%H:%M:%S.%3N
MAX_TIMESTAMP_LOOKAHEAD = 30
TZ                    = UTC

# ─── Encoding ───────────────────────────────────────────────────────────────
CHARSET         = UTF-8
NO_BINARY_CHECK = true

# ─── Credential Masking ─────────────────────────────────────────────────────
# Masks TC_DB_CONNECT passwords (including empty passwords via [^@]* not +)
# Before: TC_DB_CONNECT=infodba:SecretPass@TCDB
# After:  TC_DB_CONNECT=infodba:***MASKED***@TCDB
SEDCMD-mask_db_connect = s/(TC_DB_CONNECT\s*=\s*[^:]+:)[^@]*(@)/\1***MASKED***\2/g

# Masks TC_INDEXING_ENGINE_PASSWORD_FILE (Solr/search engine password file path)
# Before: TC_INDEXING_ENGINE_PASSWORD_FILE=C:\path\to\secret.pwf
# After:  TC_INDEXING_ENGINE_PASSWORD_FILE=***MASKED***
SEDCMD-mask_solr_pwf = s/(TC_INDEXING_ENGINE_PASSWORD_FILE\s*=\s*).+/\1***MASKED***/g

# ─── Primary Field Extraction ────────────────────────────────────────────────
# Handles every session_id variant seen in tcserver syslog files:
#   NoID                                            (plain no-session)
#   NoId.Svr  /  NoId.Mux.Svr                      (qualifier variants)
#   InitializeModule.POM  / .LOG_ENVIRONMENT / …   (module-init style)
#   Thread-60624:                                   (thread-based, colon suffix)
#   frkvbhhptcea71.60624.tcserver15946              (host.pid.server)
#   frkvbhhptcea71.60624.tcserver15946.1.Svr        (host.pid.server.seq.role)
#   frkvbhhptcea71.73991.15939.Anonymous.00001.Svr  (fully-qualified)
#
# The non-greedy log_message stops at the earliest " - Teamcenter" or "-
# Teamcenter" boundary, leaving tc_component and optional src_file/src_line.
# When no Teamcenter component is present the optional group is skipped and
# log_message captures the entire remaining text.
EXTRACT-tc_main = ^(?P<log_level>INFO|WARN|ERROR|DEBUG)\s+-\s+(?P<full_timestamp>\d{4}/\d{2}/\d{2}-\d{2}:\d{2}:\d{2}\.\s*\d+)\s+UTC\s+-\s+(?P<session_id>\S+)\s+-\s+(?P<log_message>.+?)(?:\s*-\s*(?P<tc_component>Teamcenter(?:\.[A-Za-z0-9_]+)+)(?:\s+at\s+(?P<src_file>[^\(]+)\((?P<src_line>\d+)\))?)?$

# ─── Session ID Sub-field Extraction ────────────────────────────────────────
# Thread-based:  Thread-60624:  →  tc_thread_id = 60624
EXTRACT-tc_thread_id = ^(?:INFO|WARN|ERROR|DEBUG)\s+-\s+\S+\s+(?:\d+\s+)?UTC\s+-\s+Thread-(?P<tc_thread_id>\d+)

# Module-init:   InitializeModule.POM  →  tc_init_module = POM
EXTRACT-tc_init_module = ^(?:INFO|WARN|ERROR|DEBUG)\s+-\s+\S+\s+(?:\d+\s+)?UTC\s+-\s+InitializeModule\.(?P<tc_init_module>[A-Za-z0-9_]+)

# Server sessions: frkvbhhptcea71.60624.tcserver15946[.1.Svr]
#                  frkvbhhptcea71.73991.15939.Anonymous.00001.Svr (numeric 3rd segment)
#   →  tc_host = frkvbhhptcea71, tc_pid = 60624, tc_server_name = tcserver15946 (or 15939)
EXTRACT-tc_server_session = ^(?:INFO|WARN|ERROR|DEBUG)\s+-\s+\S+\s+(?:\d+\s+)?UTC\s+-\s+(?P<tc_host>[a-zA-Z0-9-]+)\.(?P<tc_pid>\d+)\.(?P<tc_server_name>\w+)

# ─── Session Type Classification (via transforms) ───────────────────────────
REPORT-tc_session_type = tc_session_type

# ─── Log-level Normalisation ────────────────────────────────────────────────
FIELDALIAS-severity = log_level AS severity
LOOKUP-tc_log_level = tc_log_level_lookup log_level OUTPUT normalized_severity, priority
