# ============================================================
# Siemens Teamcenter PLM TA - eventtypes.conf
# ============================================================

# ---- Authentication / Session ----

[tc_session_start]
search = sourcetype="siemens:teamcenter:syslog" "Teamcenter Server is ready"
priority = 1

[tc_user_login]
search = sourcetype="siemens:teamcenter:syslog" "POM_login" "has logged in"
priority = 1

[tc_user_logout]
search = sourcetype="siemens:teamcenter:syslog" ("POM shutdown complete" OR "@@@ End of session" OR "Teamcenter Server Exiting")
priority = 1

[tc_session_init]
search = sourcetype="siemens:teamcenter:syslog" "system log created by"
priority = 2

[tc_digital_signing_disabled]
search = sourcetype="siemens:teamcenter:syslog" "digital signing of services disabled"
priority = 2

# ---- Server Health ----

[tc_server_ready]
search = sourcetype="siemens:teamcenter:syslog" "Teamcenter Server is ready"
priority = 1

[tc_db_connected]
search = sourcetype="siemens:teamcenter:syslog" "Connected to" "as" ("infodba" OR "ORACLE")
priority = 1

[tc_schema_loaded]
search = sourcetype="siemens:teamcenter:syslog" "Loaded schema has" "classes" "attributes"
priority = 2

[tc_module_load]
search = sourcetype="siemens:teamcenter:syslog" "Successfully loaded dynamic module"
priority = 3

[tc_pipe_error]
search = sourcetype="siemens:teamcenter:syslog" "TcPipe_closePipe CancelIoEx failed"
priority = 1

[tc_server_exiting]
search = sourcetype="siemens:teamcenter:syslog" "Teamcenter Server Exiting"
priority = 1

[tc_pom_enquiry_stats]
search = sourcetype="siemens:teamcenter:syslog" "POM enquiries statistics"
priority = 2

# ---- License Management ----

[tc_license_info]
search = sourcetype="siemens:teamcenter:syslog" "License Server/File Information"
priority = 1

[tc_license_session_info]
search = sourcetype="siemens:teamcenter:syslog" "License Session Information"
priority = 1

[tc_license_borrow]
search = sourcetype="siemens:teamcenter:syslog" "borrow count"
priority = 2

[tc_license_deprecation]
search = sourcetype="siemens:teamcenter:syslog" "FMS MD5 Tickets deprecated"
priority = 2

# ---- Error Tracking ----

[tc_error_event]
search = sourcetype="siemens:teamcenter:syslog" log_level=ERROR
priority = 1

[tc_warning_event]
search = sourcetype="siemens:teamcenter:syslog" log_level=WARN
priority = 1

[tc_error_code_event]
search = sourcetype="siemens:teamcenter:syslog" error_code=*
priority = 2

[tc_function_missing]
search = sourcetype="siemens:teamcenter:syslog" "Could not find function"
priority = 2

[tc_preference_missing]
search = sourcetype="siemens:teamcenter:syslog" "does not exist" ("Preference" OR "preference")
priority = 3

# ---- Performance Metrics ----

[tc_bom_ext_enter]
search = sourcetype="siemens:teamcenter:syslog" bom_ext_action=Entering
priority = 2

[tc_bom_ext_exit]
search = sourcetype="siemens:teamcenter:syslog" bom_ext_action=Exiting
priority = 2

[tc_timeout_config]
search = sourcetype="siemens:teamcenter:syslog" ("INITIALIZING timeout" OR "EDIT IDLE timeout" OR "READ IDLE timeout" OR "STATELESS IDLE timeout" OR "QUERY timeout" OR "LOGOUT timeout")
priority = 2

[tc_pom_refresh_stats]
search = sourcetype="siemens:teamcenter:syslog" "POM_refresh_instances" "misses" "new loads"
priority = 2

[tc_arr_cache_stats]
search = sourcetype="siemens:teamcenter:syslog" "Basic Arr Cache Info"
priority = 3

[tc_metadata_cache_loaded]
search = sourcetype="siemens:teamcenter:syslog" "metadata dataset version"
priority = 3

# ---- Module Registration ----

[tc_custom_module_registered]
search = sourcetype="siemens:teamcenter:syslog" ("CUSTOM_register_exit" OR "Registering" OR "Registered")
priority = 3

[tc_gateway_configured]
search = sourcetype="siemens:teamcenter:syslog" ("Configured BGS connection" OR "Configured GS connection" OR "Configured LOG connection")
priority = 2
