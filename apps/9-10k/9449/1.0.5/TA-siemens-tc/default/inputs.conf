# ============================================================
# Siemens Teamcenter PLM TA - inputs.conf
#
# Deploy this file on Universal Forwarders monitoring
# Teamcenter syslog directories.
#
# Adjust the path below to match the TC_TMP_DIR / TC_LOGS
# directory on each host, then enable the stanza.
# ============================================================

# ---- Linux / Unix forwarder example (recommended) ----
# Uncomment and set the correct path before deploying.
#
# [monitor:///opt/siemens/teamcenter/logs/tcserver.exe*.syslog]
# disabled   = false
# sourcetype = siemens:teamcenter:syslog
# index      = plm_teamcenter
# whitelist  = \.syslog$
# recursive  = true
# followTail = 0

# ---- Windows forwarder example ----
# Uncomment and set the correct path before deploying.
#
# [monitor://C:\Siemens\Teamcenter\TC_LOGS\...\tcserver*.syslog]
# disabled   = false
# sourcetype = siemens:teamcenter:syslog
# index      = plm_teamcenter
# whitelist  = \.syslog$
# recursive  = true
# followTail = 0
