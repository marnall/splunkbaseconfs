# ============================================================
# Siemens Teamcenter PLM TA - macros.conf
# Reusable search macros for common query patterns
# ============================================================

# Base sourcetype filter
[tc_syslog]
definition = sourcetype="tc:teamcenter:syslog"
iseval = 0

# ---- Authentication & Session ----

[tc_logins]
definition = sourcetype="tc:teamcenter:syslog" "POM_login" "has logged in"
iseval = 0

[tc_logouts]
definition = sourcetype="tc:teamcenter:syslog" ("POM shutdown complete" OR "@@@ End of session")
iseval = 0

[tc_session_activity]
definition = sourcetype="tc:teamcenter:syslog" (eventtype=tc_user_login OR eventtype=tc_user_logout OR eventtype=tc_session_start)
iseval = 0

# ---- Server Health ----

[tc_server_errors]
definition = sourcetype="tc:teamcenter:syslog" log_level=ERROR
iseval = 0

[tc_server_warnings]
definition = sourcetype="tc:teamcenter:syslog" log_level=WARN
iseval = 0

[tc_server_starts]
definition = sourcetype="tc:teamcenter:syslog" "Teamcenter Server is ready"
iseval = 0

[tc_db_events]
definition = sourcetype="tc:teamcenter:syslog" ("Connected to" OR "DBMS VERSION" OR "Loaded schema has")
iseval = 0

# ---- License ----

[tc_license_events]
definition = sourcetype="tc:teamcenter:syslog" ("License Server/File Information" OR "License Session Information")
iseval = 0

[tc_license_borrow]
definition = sourcetype="tc:teamcenter:syslog" "borrow count"
iseval = 0

# ---- Error Tracking ----

[tc_error_codes]
definition = sourcetype="tc:teamcenter:syslog" error_code=*
iseval = 0

[tc_missing_functions]
definition = sourcetype="tc:teamcenter:syslog" "Could not find function"
iseval = 0

# ---- Performance ----

[tc_bom_operations]
definition = sourcetype="tc:teamcenter:syslog" (bom_ext_action=Entering OR bom_ext_action=Exiting)
iseval = 0

[tc_pom_stats]
definition = sourcetype="tc:teamcenter:syslog" "POM enquiries statistics"
iseval = 0

[tc_pom_refresh]
definition = sourcetype="tc:teamcenter:syslog" "POM_refresh_instances"
iseval = 0

[tc_timeout_settings]
definition = sourcetype="tc:teamcenter:syslog" timeout_type=*
iseval = 0

# ---- Module Management ----

[tc_loaded_modules]
definition = sourcetype="tc:teamcenter:syslog" "Successfully loaded dynamic module"
iseval = 0

[tc_custom_modules]
definition = sourcetype="tc:teamcenter:syslog" ("CUSTOM_register_exit" OR "Registering" OR ENTER OR LEAVE)
iseval = 0

# ---- Security ----

[tc_security_events]
definition = sourcetype="tc:teamcenter:syslog" ("Security Level" OR "digital signing" OR "Configured BGS connection" OR "Configured GS connection")
iseval = 0

# ---- Useful field-based search helpers ----

[tc_by_user(1)]
args = username
definition = sourcetype="tc:teamcenter:syslog" (pom_username="$username$" OR epdm_user_id="$username$" OR session_user="$username$")
iseval = 0

[tc_by_server(1)]
args = servername
definition = sourcetype="tc:teamcenter:syslog" server_name="$servername$"
iseval = 0

[tc_by_pool(1)]
args = poolname
definition = sourcetype="tc:teamcenter:syslog" tc_pool_name="$poolname$"
iseval = 0

[tc_by_host(1)]
args = hostname
definition = sourcetype="tc:teamcenter:syslog" (node_name="$hostname$" OR session_host="$hostname$" OR tc_server_host="$hostname$")
iseval = 0
