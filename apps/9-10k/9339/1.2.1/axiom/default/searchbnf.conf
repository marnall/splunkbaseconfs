[axquery-command]
syntax = axquery apl=<double-quoted-string> (<axquery-options>)*
shortdesc = Run an Axiom APL query and return results to Splunk.
description = Use the axquery generating command when you need full APL control. \
 If no explicit time options are provided, the command uses the Splunk dispatch time range. All-time dispatch sentinels are treated as unbounded.
usage = public
example1 = | axquery apl="['axiom-audit'] | where ['actor.type'] == 'user' | summarize count() by ['actor.email'], action"
comment1 = Runs an APL query using the current Splunk dispatch time range.
tags = axiom apl api

[axquery-options]
syntax = (startTime=<string>)? (endTime=<string>)? (earliest=<string>)? (latest=<string>)? (paginate=(cursor|time))? (debug=<bool>)? (maxTime=<int>)? (tokenName=<string>)? (mgmtPort=<int>)?
description = startTime/endTime override the Axiom query time range per boundary. earliest/latest are Splunk-style aliases. \
 If a boundary is not specified, the command uses the Splunk dispatch boundary when available. paginate accepts cursor or time and requires the APL query to sort by _time. tokenName defaults to axiom_token.

[axdatasets-command]
syntax = axdatasets (<axiom-connection-options>)*
shortdesc = List Axiom datasets available to the configured token.
description = Use axdatasets to discover Axiom dataset IDs before querying or sampling data.
usage = public
example1 = | axdatasets | table id, name, kind, retentionDays, *
comment1 = Lists accessible Axiom datasets.
tags = axiom datasets discovery api

[axfields-command]
syntax = axfields dataset=<string> (<axiom-connection-options>)*
shortdesc = List fields for an Axiom dataset.
description = Use axfields to inspect the available fields in a dataset before writing a query.
usage = public
example1 = | axfields dataset="app-logs" | table name, type, *
comment1 = Lists field metadata for the app-logs dataset.
tags = axiom fields discovery api

[axsample-command]
syntax = axsample dataset=<string> (<axsample-options>)*
shortdesc = Fetch sample events from an Axiom dataset.
description = Use axsample to inspect recent matching events from a dataset without writing APL. \
 If no explicit time options are provided, the command uses the Splunk dispatch time range.
usage = public
example1 = | axsample dataset="app-logs" limit=20 fields="service,message"
comment1 = Returns up to 20 sample events and preserves _time for Splunk.
tags = axiom sample discovery api

[axsample-options]
syntax = (limit=<int>)? (fields=<comma-separated-list>)? (startTime=<string>)? (endTime=<string>)? (earliest=<string>)? (latest=<string>)? (tokenName=<string>)? (mgmtPort=<int>)?
description = limit defaults to 20. fields optionally projects returned fields; _time is preserved automatically. \
 Time options override the Splunk dispatch time range per boundary.

[axsearch-command]
syntax = axsearch dataset=<string> (<axsearch-options>)*
shortdesc = Search an Axiom dataset with Splunk-style command options.
description = Use axsearch for common searches when full raw APL is not needed. \
 If no explicit time options are provided, the command uses the Splunk dispatch time range.
usage = public
example1 = | axsearch dataset="app-logs" search="timeout" fields="service,message" limit=100
comment1 = Searches app-logs for timeout and returns a bounded set of events.
tags = axiom search api

[axsearch-options]
syntax = (q=<string>)? (search=<string>)? (where=<string>)? (fields=<comma-separated-list>)? (sort=<string>)? (limit=<int>)? (explain=<bool>)? (startTime=<string>)? (endTime=<string>)? (earliest=<string>)? (latest=<string>)? (tokenName=<string>)? (mgmtPort=<int>)?
description = q accepts a constrained Splunk-like search expression and compiles it to APL. \
 search compiles to APL's text search operator. where accepts an APL predicate for structured filtering. \
 sort defaults to _time desc and limit defaults to 100. explain returns compiled APL and the resolved time range without querying Axiom.

[axstats-command]
syntax = axstats dataset=<string> (<axstats-options>)*
shortdesc = Aggregate Axiom data with Splunk-shaped stats options.
description = Use axstats to push count, sum, avg, min, max, dcount, stdev, variance, and percentile aggregations into Axiom. \
 If no explicit time options are provided, the command uses the Splunk dispatch time range.
usage = public
example1 = | axstats dataset="app-logs" q="status>=500" stats="count as errors" by="service"
comment1 = Counts matching events by service in Axiom and returns the grouped table to Splunk.
tags = axiom search stats api

[axstats-options]
syntax = (q=<string>)? (stats=<string>)? (by=<comma-separated-list>)? (limit=<int>)? (explain=<bool>)? (startTime=<string>)? (endTime=<string>)? (earliest=<string>)? (latest=<string>)? (tokenName=<string>)? (mgmtPort=<int>)?
description = q accepts a constrained Splunk-like search expression. stats defaults to count and accepts expressions like count as events, avg(duration), or dc(trace_id) as traces. \
 by groups results, limit caps grouped rows, and explain returns compiled APL and the resolved time range without querying Axiom.

[axtimechart-command]
syntax = axtimechart dataset=<string> (<axtimechart-options>)*
shortdesc = Build row-oriented time-series aggregations from Axiom data.
description = Use axtimechart to push time-bucketed aggregation into Axiom while returning Splunk-friendly rows. \
 This is a reporting command, so the result is a chartable table of _time plus the aggregation columns. \
 If no explicit time options are provided, the command uses the Splunk dispatch time range.
usage = public
example1 = | axtimechart dataset="app-logs" q="status>=500" span=5m agg="count as errors" by="service"
comment1 = Returns error counts bucketed by _time and split by service, ready to chart.
tags = axiom search timechart api

[axtimechart-options]
syntax = (q=<string>)? (agg=<string>)? (span=<duration>)? (by=<field>)? (limit=<int>)? (explain=<bool>)? (startTime=<string>)? (endTime=<string>)? (earliest=<string>)? (latest=<string>)? (tokenName=<string>)? (mgmtPort=<int>)?
description = q accepts a constrained Splunk-like search expression. agg defaults to count and accepts one aggregation expression. \
 span defaults to 1m. by optionally splits the series by a field. explain returns compiled APL and the resolved time range without querying Axiom.

[axlookup-command]
syntax = axlookup dataset=<string> on=<field-or-mapping> fields=<comma-separated-list> (<axlookup-options>)*
shortdesc = Look up Axiom context for Splunk events.
description = Use axlookup in a Splunk pipeline to match incoming events against an Axiom dataset and add selected fields. \
 The command runs locally on the search head, batches distinct join keys, and normalizes added Axiom field names for SPL.
usage = public
example1 = index=main service=api | axlookup dataset="deployments" on="service=service.name" fields="version,owner,team"
comment1 = Adds axiom_version, axiom_owner, and axiom_team to matching Splunk events.
example2 = index=main service=api | axlookup dataset="otel-demo-logs" on="service=service.name" fields="service.version,resource.k8s.deployment.name"
comment2 = Adds axiom_service_version and axiom_resource_k8s_deployment_name.
tags = axiom lookup enrich streaming api

[axlookup-options]
syntax = (prefix=<string>)? (overwrite=<bool>)? (batchSize=<int>)? (maxFields=<int>)? (strict=<bool>)? (startTime=<string>)? (endTime=<string>)? (earliest=<string>)? (latest=<string>)? (tokenName=<string>)? (mgmtPort=<int>)?
description = on accepts either a shared field name or splunkField=axiomField. prefix defaults to axiom_. \
 Added fields use Splunk-safe names, so dots and punctuation become underscores. overwrite defaults to false. \
 batchSize defaults to 250 and is capped at 1000. maxFields defaults to 50 when fields=* is used. strict defaults to true. \
 Time options control the Axiom lookup window; if absent, the Splunk dispatch range is used when available.

[axiom-connection-options]
syntax = (tokenName=<string>)? (mgmtPort=<int>)?
description = tokenName defaults to axiom_token. mgmtPort defaults to Splunk management port autodetection, then 8089.
