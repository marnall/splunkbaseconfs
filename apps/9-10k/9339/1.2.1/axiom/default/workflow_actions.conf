[axiom_search_trace]
type = search
display_location = event_menu
fields = axiom_dataset, trace_id
label = Axiom: Search trace $trace_id$
search.app = axiom
search.view = search
search.target = blank
search.preserve_timerange = true
search.search_string = | axsearch dataset="$axiom_dataset$" q="trace_id=\"$trace_id$\"" fields="_time,service.name,severity_text,body,trace_id,span_id" limit=100 | table _time service.name severity_text body trace_id span_id

