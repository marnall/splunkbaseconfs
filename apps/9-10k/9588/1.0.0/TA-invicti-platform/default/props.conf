[invicti:platform:vulnerability]
description = Invicti Platform vulnerability event (one JSON object per event)
INDEXED_EXTRACTIONS = json
KV_MODE = none
disabled = false
pulldown_type = true

# Each event is a single self-contained JSON object emitted by the modular input.
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
TRUNCATE = 0

# Use the vulnerability's lastSeen as event time (ISO-8601, supports microseconds and 'Z').
TIME_PREFIX = "lastSeen"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%Z
MAX_TIMESTAMP_LOOKAHEAD = 40
