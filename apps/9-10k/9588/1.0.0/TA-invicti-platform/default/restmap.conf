[admin:TA_invicti_platform_configuration]
match = /
members = TA_invicti_platform_account, TA_invicti_platform_settings

[admin:TA_invicti_platform_inputs]
match = /
members = TA_invicti_platform_invicti_vulnerabilities

[admin_external:TA_invicti_platform_account]
handlertype = python
python.version = python3
handlerfile = TA_invicti_platform_rh_account.py
handleractions = edit, list, remove, create
handlerpersistentmode = true
python.required = 3.13
args = name, base_url, api_token

[admin_external:TA_invicti_platform_settings]
handlertype = python
python.version = python3
handlerfile = TA_invicti_platform_rh_settings.py
handleractions = edit, list
handlerpersistentmode = true
python.required = 3.13
args = proxy_enabled, proxy_type, proxy_url, proxy_port, proxy_username, proxy_password, proxy_rdns, loglevel

[admin_external:TA_invicti_platform_invicti_vulnerabilities]
handlertype = python
python.version = python3
handlerfile = invicti_platform_rh_input.py
handleractions = edit, list, remove, create
handlerpersistentmode = true
python.required = 3.13
args = name, interval, index, account, asset_id, origin_id, page_size, disabled
