[Xage - Untrusted Audit Event - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = Xage - Untrusted Audit Event - Rule
action.correlationsearch.annotations = {"mitre_attack":["T1562","T1070"],"nist":["DE.CM","SI.4"],"analytic_story":["Xage Zero Trust Access"]}
action.notable = 1
action.notable.param.nes_fields = user,dest,signature
action.notable.param.rule_title = Xage: untrusted audit event $signature$ for $user$
action.notable.param.rule_description = Xage marked isTrusted=false on $untrusted_count$ event(s). signature=$signature$ dest=$dest$ dvc=$dvc$. Tamper or relay issues on the Edge should be treated as high severity.
action.notable.param.security_domain = threat
action.notable.param.severity = critical
action.notable.param.drilldown_name = Untrusted Xage events
action.notable.param.drilldown_search = `xage` isTrusted=false
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":80},{"risk_object_field":"dvc","risk_object_type":"system","risk_score":80}]
action.risk.param._risk_message = Untrusted Xage audit event user=$user$ dvc=$dvc$
alert.digest_mode = 1
alert.expires = 30d
alert.severity = 5
alert.suppress = 1
alert.suppress.fields = user,dvc,signature
alert.suppress.period = 1h
alert.track = 0
counttype = number of events
cron_schedule = */15 * * * *
description = Notable + risk. isTrusted=false on an Xage audit event. Rare in the captured sample (all true); treat as critical when it appears.
disabled = 1
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
request.ui_dispatch_view = correlationsearch
schedule_window = auto
search = `xage` (isTrusted=false OR isTrusted="false" OR isTrusted=0) \
| stats count as untrusted_count, values(dest) as dest, values(dvc) as dvc, values(signature) as signature by user \
| eval vendor_product="Xage Fabric"
