[Xage - Failed Then Successful Device Access - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = Xage - Failed Then Successful Device Access - Rule
action.correlationsearch.annotations = {"mitre_attack":["T1078","T1110"],"nist":["DE.CM","DE.AE"],"kill_chain_phases":["Exploitation"],"analytic_story":["Xage Zero Trust Access"]}
action.notable = 1
action.notable.param.nes_fields = user,dest
action.notable.param.rule_title = Xage: $user$ failed then accessed $dest$
action.notable.param.rule_description = User $user$ had $fails$ failed access(es) and $oks$ success(es) against $dest$ within `xage_cs_fail_then_success_window` seconds. Pattern matches password spraying / lockout-then-valid-account use.
action.notable.param.security_domain = access
action.notable.param.severity = high
action.notable.param.drilldown_name = Access events for user and dest
action.notable.param.drilldown_search = `xage_cim_authentication` user="$user$" dest="$dest$"
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":70},{"risk_object_field":"dest","risk_object_type":"system","risk_score":30}]
action.risk.param._risk_message = Xage fail-then-success user=$user$ dest=$dest$ fails=$fails$
alert.digest_mode = 1
alert.expires = 30d
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = user,dest
alert.suppress.period = 4h
alert.track = 0
counttype = number of events
cron_schedule = */15 * * * *
description = Notable + risk. Failed device access followed by success for the same user and destination inside one hour.
disabled = 1
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
request.ui_dispatch_view = correlationsearch
schedule_window = auto
search = `xage` (message=user_access_device_fail OR message=user_access_device_success) user=* dest=* \
| eval fail=if(message="user_access_device_fail",1,0), ok=if(message="user_access_device_success",1,0) \
| stats sum(fail) as fails, sum(ok) as oks, min(_time) as first, max(_time) as last, values(reason) as reason, values(dvc) as dvc by user, dest \
| eval duration=last-first \
| where fails>=1 AND oks>=1 AND duration<=`xage_cs_fail_then_success_window` \
| eval vendor_product="Xage Fabric"

