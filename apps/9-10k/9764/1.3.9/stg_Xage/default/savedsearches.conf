# Reports (always available) and optional ES correlation searches (disabled).
# Correlation searches: action.correlationsearch.enabled=1 identifies them to
# Enterprise Security Content Management. Enable individually — do not enable
# all of them on day one. See README/detections.md.

################################################################################
# REPORTS
################################################################################

[Xage - Event volume by signature]
display.general.type = visualizations
display.page.search.tab = visualizations
display.visualizations.charting.chart = column
cron_schedule = 0 * * * *
enableSched = 0
disabled = 0
request.ui_dispatch_app = stg_Xage
request.ui_dispatch_view = search
search = `xage` \
| stats count by signature, action, severity \
| sort - count

[Xage - Failed device access]
display.general.type = events
display.page.search.tab = events
enableSched = 0
disabled = 0
request.ui_dispatch_app = stg_Xage
search = `xage_cim_authentication` action=failure \
| table _time, user, dest, authentication_method, reason, reason_id, dvc, signature, id

[Xage - Privileged credential unveils]
display.general.type = events
enableSched = 0
disabled = 0
request.ui_dispatch_app = stg_Xage
search = `xage` message=credentials_unveiled \
| table _time, object, object_attrs, src_user, dvc, dest, isTrusted, id

[Xage - Password rotations]
display.general.type = events
enableSched = 0
disabled = 0
request.ui_dispatch_app = stg_Xage
search = `xage` message=user_on_AD_password_rotation_* \
| table _time, user, dest, status, session_id, dvc, signature

[Xage - Multiple failed access by user]
display.general.type = statistics
enableSched = 0
disabled = 0
request.ui_dispatch_app = stg_Xage
search = `xage_cim_authentication` action=failure \
| stats count values(dest) as dest values(reason) as reason by user \
| where count >= `xage_cs_fail_count` \
| sort - count

################################################################################
# ENTERPRISE SECURITY CORRELATION SEARCHES
# Optional. disabled=1. enableSched=1 so enabling the search in Content
# Management starts the cron immediately.
#
# Risk-only  → intermediate risk events (RBA), no Incident Review ticket
# Notable    → notable event in Incident Review
# Both       → risk object scoring AND a notable
################################################################################

[Xage - Multiple Failed Device Access - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = Xage - Multiple Failed Device Access - Rule
action.correlationsearch.annotations = {"mitre_attack":["T1110","T1110.001","T1078"],"nist":["DE.CM","PR.AC"],"cis20":["CIS 16"],"kill_chain_phases":["Exploitation"],"analytic_story":["Xage Zero Trust Access"]}
action.notable = 1
action.notable.param.nes_fields = user,dest,dvc
action.notable.param.rule_title = Xage: multiple failed device access by $user$
action.notable.param.rule_description = User $user$ failed Zero Trust device access $fail_count$ times (threshold `xage_cs_fail_count`) in the search window. Destinations: $dest$. Reasons: $reason$. Edge: $dvc$.
action.notable.param.security_domain = access
action.notable.param.severity = high
action.notable.param.drilldown_name = Xage failures for this user
action.notable.param.drilldown_search = `xage_cim_authentication` action=failure user="$user$"
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":50}]
action.risk.param._risk_message = Multiple Xage device-access failures ($fail_count$) for $user$
alert.digest_mode = 1
alert.expires = 30d
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 4h
alert.track = 0
counttype = number of events
cron_schedule = */15 * * * *
description = Notable + risk. Three or more failed Xage device access attempts by one user (brute force / lockout / policy denial).
disabled = 1
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
request.ui_dispatch_view = correlationsearch
schedule_window = auto
search = `xage_cim_authentication` action=failure user=* \
| stats count as fail_count, values(dest) as dest, values(reason) as reason, values(reason_id) as reason_id, values(dvc) as dvc, values(authentication_method) as authentication_method by user \
| where fail_count >= `xage_cs_fail_count` \
| eval vendor_product="Xage Fabric", signature="user_access_device_fail"

[Xage - Device Access Failure - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = Xage - Device Access Failure - Rule
action.correlationsearch.annotations = {"mitre_attack":["T1078","T1110"],"nist":["DE.CM"],"analytic_story":["Xage Zero Trust Access"]}
action.notable = 0
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":20},{"risk_object_field":"dest","risk_object_type":"system","risk_score":10}]
action.risk.param._risk_message = Xage device access failure user=$user$ dest=$dest$ reason=$reason$
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.fields = user,dest
alert.suppress.period = 30m
alert.track = 0
counttype = number of events
cron_schedule = */15 * * * *
description = Risk only (intermediate RBA). Aggregates failed device access per user+dest. Does not create a notable — pair with "Multiple Failed Device Access" for Incident Review.
disabled = 1
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
request.ui_dispatch_view = correlationsearch
schedule_window = auto
search = `xage_cim_authentication` action=failure user=* dest=* \
| stats count as fail_count, values(reason) as reason, values(reason_id) as reason_id, values(dvc) as dvc, values(authentication_method) as authentication_method by user, dest \
| eval vendor_product="Xage Fabric"

[Xage - Privileged Credential Unveil by Non-System - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = Xage - Privileged Credential Unveil by Non-System - Rule
action.correlationsearch.annotations = {"mitre_attack":["T1555","T1078","T1552"],"nist":["PR.AC","DE.CM"],"cis20":["CIS 5","CIS 6"],"kill_chain_phases":["Exploitation"],"analytic_story":["Xage Zero Trust Access"]}
action.notable = 1
action.notable.param.nes_fields = user,object,dvc
action.notable.param.rule_title = Xage: privileged credential $object$ unveiled by $user$
action.notable.param.rule_description = A non-system identity ($user$) unveiled privileged credential $object$ ($object_attrs$) on Edge $dvc$ $unveil_count$ time(s). System ldap binds are excluded; those are covered by the spike detection.
action.notable.param.security_domain = identity
action.notable.param.severity = high
action.notable.param.drilldown_name = Credential unveils for this user
action.notable.param.drilldown_search = `xage` message=credentials_unveiled user="$user$"
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":60}]
action.risk.param._risk_message = Non-system Xage credential unveil user=$user$ object=$object$
alert.digest_mode = 1
alert.expires = 30d
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = user,object
alert.suppress.period = 4h
alert.track = 0
counttype = number of events
cron_schedule = */15 * * * *
description = Notable + risk. Privileged credential checkout (PAM) by a human / non-system identity. System unveils are noisy (ldap bind heartbeat) and are not included.
disabled = 1
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
request.ui_dispatch_view = correlationsearch
schedule_window = auto
search = `xage` message=credentials_unveiled \
| eval user=coalesce(unveiledByUser, src_user, user) \
| where isnotnull(user) AND user!="" AND lower(user)!="system" \
| stats count as unveil_count, values(object) as object, values(object_attrs) as object_attrs, values(dvc) as dvc, values(dest) as dest by user \
| eval vendor_product="Xage Fabric", signature="credentials_unveiled"

[Xage - Credential Unveil Spike - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = Xage - Credential Unveil Spike - Rule
action.correlationsearch.annotations = {"mitre_attack":["T1555","T1110.004"],"nist":["DE.AE","DE.CM"],"analytic_story":["Xage Zero Trust Access"]}
action.notable = 1
action.notable.param.nes_fields = object,dvc
action.notable.param.rule_title = Xage: credential unveil spike for $object$ on $dvc$
action.notable.param.rule_description = Credential $object$ was unveiled $unveil_count$ times on Edge $dvc$ (threshold `xage_cs_unveil_spike`). Includes system ldap binds so a runaway heartbeat or credential stuffing against the vault surfaces here.
action.notable.param.security_domain = identity
action.notable.param.severity = medium
action.notable.param.drilldown_name = Unveils for this credential
action.notable.param.drilldown_search = `xage` message=credentials_unveiled object="$object$"
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"dvc","risk_object_type":"system","risk_score":40}]
action.risk.param._risk_message = Xage credential unveil spike object=$object$ count=$unveil_count$ dvc=$dvc$
alert.digest_mode = 1
alert.expires = 14d
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = object,dvc
alert.suppress.period = 4h
alert.track = 0
counttype = number of events
cron_schedule = */15 * * * *
description = Notable + risk. Burst of credential unveils per object+edge, including system. Use instead of per-event risk on credentials_unveiled (sample data unveils about once a minute).
disabled = 1
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
request.ui_dispatch_view = correlationsearch
schedule_window = auto
search = `xage` message=credentials_unveiled \
| stats count as unveil_count, values(unveiledByUser) as unveiledByUser, dc(unveiledByUser) as actors, values(object_attrs) as object_attrs by object, dvc \
| where unveil_count >= `xage_cs_unveil_spike` \
| eval vendor_product="Xage Fabric", user=mvjoin(unveiledByUser,","), signature="credentials_unveiled"

