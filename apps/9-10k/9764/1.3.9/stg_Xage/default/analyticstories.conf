# Analytic story grouping for Splunk Enterprise Security Content Management.
# Detection names must match savedsearches.conf stanza names.

[Xage Zero Trust Access]
category = Access
description = Failed Zero Trust device access, privileged credential checkout, and AD password-rotation anomalies from Xage Fabric Edge audit logs.
narrative = Xage Fabric brokers identity-based access to IT and OT devices. A typical successful privileged session is credential unveil → AD password rotation → device access success → write access enabled. Breaks in that chain (repeated failures, human credential checkout, rotation failure, or a fail-then-success pattern) are high-value Enterprise Security signals. Risk-only searches feed RBA; notable searches open Incident Review tickets.
detections = Xage - Multiple Failed Device Access - Rule, Xage - Device Access Failure - Rule, Xage - Privileged Credential Unveil by Non-System - Rule, Xage - Credential Unveil Spike - Rule, Xage - AD Password Rotation Failure - Rule, Xage - Device Write Access Enabled - Rule, Xage - Failed Then Successful Device Access - Rule, Xage - User Access Across Many Devices - Rule, Xage - Untrusted Audit Event - Rule
references = https://docs.splunk.com/Documentation/CIM/latest/User/Authentication, https://docs.splunk.com/Documentation/CIM/latest/User/Change, https://docs.splunk.com/Documentation/ES/latest/Admin/Correlationsearches
tags = xage, zerotrust, pam, authentication, change
version = 1.0.0
