# Dashboard/search macros live HERE so Simple XML in this app does not depend
# on cross-app macro expansion from stg_Xage_TA (that is the split regression).
# Keep definitions in sync with the TA. Pin the index in THIS app:
#   [xage_index]
#   definition = index=<your_index> `xage_sources`
# CIM-pure tag= macros remain in the TA for data-model acceleration.

[xage_sources]
definition = (source=xage OR source="tcp:5514" OR sourcetype=xage:audit OR sourcetype=xage:syslog)
iseval = 0

[xage_index]
definition = `xage_sources`
iseval = 0

[xage]
definition = `xage_index`
iseval = 0

# Resilient: message= fallback if TA eventtypes/tags are not visible in this app.
[xage_cim_authentication]
definition = `xage` (tag=authentication OR message=user_access_device_success OR message=user_access_device_fail OR message=user_login_success OR message=user_login_fail)
iseval = 0

[xage_cim_change]
definition = `xage` (tag=change OR message=credentials_unveiled OR message=credentials_unveiled_fail OR message=device_write_access_* OR message=user_on_AD_password_rotation_*)
iseval = 0

[xage_cim_alerts]
definition = `xage` (tag=alert OR msgLevel=Error OR msgLevel=Critical OR message=*fail*)
iseval = 0

[xage_privileged]
definition = `xage` (tag=privileged OR message=credentials_unveiled OR message=device_write_access_enabled OR message=user_on_AD_password_rotation_*)
iseval = 0

# ES correlation-search thresholds. Tune in local/macros.conf without editing SPL.
[xage_cs_fail_count]
definition = 3
iseval = 0

[xage_cs_multi_dest]
definition = 4
iseval = 0

[xage_cs_unveil_spike]
definition = 10
iseval = 0

[xage_cs_fail_then_success_window]
definition = 3600
iseval = 0
