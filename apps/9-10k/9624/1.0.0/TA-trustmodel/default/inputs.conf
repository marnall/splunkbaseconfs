#
# Intentionally no input stanzas.
#
# Splunk Cloud apps cannot define HEC stanzas (Splunk-AppInspect
# "check_for_inputs_conf" and "check_for_inputs_conf_http_stanzas" —
# HEC enablement and token creation are stack-admin operations performed
# via Splunk Web (Settings → Data Inputs → HTTP Event Collector) or ACS.
#
# Customers integrating with TrustModel:
#   1. Create their own HEC token in Splunk
#   2. Set the allowed indexes on that token (recommend an index named
#      `trustmodel` — or use any existing index they prefer)
#   3. Paste the HEC URL + token into the TrustModel Console
#      (Settings → Integrations → Splunk)
#
# Each TrustModel event self-declares its sourcetype (`trustmodel:eval`
# or `trustmodel:finding`), so no default sourcetype assignment is
# required here.
