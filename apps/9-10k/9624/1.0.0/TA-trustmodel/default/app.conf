#
# TA-trustmodel — TrustModel AI Assurance Add-on for Splunk
# https://trustmodel.ai/splunk
#
# Receives TrustModel events via HTTP Event Collector and maps them to
# Splunk Common Information Model so they light up natively in Enterprise
# Security, Risk-Based Alerting, and Observability.
#
# Two sourcetypes — `trustmodel:eval` (lifecycle, all flavors) and
# `trustmodel:finding` (detected risks). The eval flavor (LLM, COTS,
# agentic_trace, DataScan) is carried in the `eval_source` field on every
# event. Schema source-of-truth: TRUS-785 (Confluence v1.0).
#
# Companion add-on for the Cisco AI Defense + Splunk integration.
#

[install]
is_configured = false
state = enabled
build = 20260518

[launcher]
version = 1.0.0
description = TrustModel AI Assurance — evaluation lifecycle + finding events from TrustModel into Splunk ES / SOAR / Observability. Two sourcetypes; flavor on `eval_source`. Companion add-on for Cisco AI Defense.
author = TrustModel.AI

[ui]
is_visible = true
label = TrustModel AI Assurance
docs_check_link = https://trustmodel.ai/splunk

[package]
id = TA-trustmodel
check_for_updates = true

[id]
#group = sourcetype
name = TA-trustmodel
version = 1.0.0
