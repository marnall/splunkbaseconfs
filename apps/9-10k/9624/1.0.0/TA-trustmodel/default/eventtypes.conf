#
# Eventtypes for CIM datamodel mapping.
#
# Splunk's CIM datamodels match events by eventtype + tags. Pairing the two
# below makes TrustModel events visible in the right datamodels with no
# customer config.
#
# Schema source-of-truth: TRUS-785 v1.0 (Confluence). Two sourcetypes,
# discriminated by `eval_source` for downstream filters.
#

[trustmodel_eval]
search = sourcetype="trustmodel:eval"
description = TrustModel evaluation lifecycle events (all flavors via eval_source)

[trustmodel_finding]
search = sourcetype="trustmodel:finding"
description = TrustModel finding events (PII, bias, proxy, hallucination, etc.)
