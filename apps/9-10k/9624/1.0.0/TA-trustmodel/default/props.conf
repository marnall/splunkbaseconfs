#
# Source-type property declarations.
#
# Schema source-of-truth: TRUS-785 (Confluence — TrustModel → Splunk Event
# Schema v1.0). Two sourcetypes only:
#
#   trustmodel:eval     — evaluation lifecycle (one per terminal-state run).
#                         Covers ALL eval flavors (LLM, COTS, agentic_trace,
#                         DataScan) discriminated by the `eval_source` field.
#                         Not mapped to a CIM datamodel.
#
#   trustmodel:finding  — detected risk / issue within an evaluation
#                         (PII, bias, proxy, hallucination, etc.).
#                         Strict CIM Alerts compliance.
#
# KV_MODE=json auto-extracts every field — including nested `eval_meta.*`
# and `evidence.*`. So `eval_meta.model=gpt-4o`, `evidence.column=notes`,
# etc. are all searchable directly. No custom transforms required.
#

# ─────────────────────────────────────────────────────────────────────────────
# trustmodel:eval — evaluation lifecycle event
# ─────────────────────────────────────────────────────────────────────────────
[trustmodel:eval]
KV_MODE = json
SHOULD_LINEMERGE = false
NO_BINARY_CHECK = true
TIME_PREFIX = "time"\s*:\s*
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 25
TRUNCATE = 1000000
disabled = false
category = TrustModel
description = TrustModel evaluation lifecycle event (terminal-state, all flavors)
pulldown_type = true

EVAL-vendor_product = "TrustModel"

# ─────────────────────────────────────────────────────────────────────────────
# trustmodel:finding — detected risk / issue within an evaluation
#   Strict CIM Alerts compliance.
# ─────────────────────────────────────────────────────────────────────────────
[trustmodel:finding]
KV_MODE = json
SHOULD_LINEMERGE = false
NO_BINARY_CHECK = true
TIME_PREFIX = "time"\s*:\s*
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 25
TRUNCATE = 1000000
disabled = false
category = TrustModel
description = TrustModel finding event (PII, bias, proxy, hallucination, etc.)
pulldown_type = true

# CIM Alerts data-model field aliases
FIELDALIAS-trustmodel_finding_signature = signature AS signature
FIELDALIAS-trustmodel_finding_severity  = severity  AS severity
FIELDALIAS-trustmodel_finding_action    = action    AS action
FIELDALIAS-trustmodel_finding_src_user  = src_user  AS src_user
FIELDALIAS-trustmodel_finding_user      = user      AS user

EVAL-vendor_product = "TrustModel"
