#
# Custom (non-CIM) field declarations.
#
# Splunk auto-extracts everything via KV_MODE=json (see props.conf), so most
# fields don't need to be declared here. The fields below benefit from
# explicit declaration for fast filtering on common dashboards.
#
# Schema source-of-truth: TRUS-785 v1.0 (Confluence).
#

# ── Common envelope ────────────────────────────────────────────────────────
[event_type]
INDEXED_VALUE = false

[event_id]
INDEXED_VALUE = false

[org_id]
INDEXED_VALUE = false

[tenant]
INDEXED_VALUE = false

[eval_source]
INDEXED_VALUE = false

[run_id]
INDEXED_VALUE = false

# ── trustmodel:eval ────────────────────────────────────────────────────────
[overall_score]
INDEXED_VALUE = false

[findings_count]
INDEXED_VALUE = false

[duration_seconds]
INDEXED_VALUE = false

# ── trustmodel:finding ─────────────────────────────────────────────────────
[dimension]
INDEXED_VALUE = false

# ── eval_meta nested-object fields (auto-extracted by KV_MODE=json) ────────
[eval_meta.model]
INDEXED_VALUE = false

[eval_meta.model_provider]
INDEXED_VALUE = false

[eval_meta.byok]
INDEXED_VALUE = false

[eval_meta.eval_type]
INDEXED_VALUE = false

[eval_meta.eval_subtype]
INDEXED_VALUE = false

[eval_meta.framework]
INDEXED_VALUE = false

[eval_meta.ingestion_mode]
INDEXED_VALUE = false

[eval_meta.warehouse]
INDEXED_VALUE = false

[eval_meta.dataset]
INDEXED_VALUE = false

[eval_meta.table]
INDEXED_VALUE = false

# ── evidence nested-object fields ──────────────────────────────────────────
[evidence.column]
INDEXED_VALUE = false

[evidence.match_count]
INDEXED_VALUE = false

[evidence.match_rate]
INDEXED_VALUE = false

[evidence.score]
INDEXED_VALUE = false

[evidence.protected_class]
INDEXED_VALUE = false

[evidence.correlation]
INDEXED_VALUE = false
