#
# Saved search macros. Used by DA-ESS-TrustModel correlation searches and by
# customer-authored dashboards. Wrapping the index/sourcetype lets customers
# rename the index without rewriting every search.
#
# Schema source-of-truth: TRUS-785 v1.0 (Confluence).
#

[trustmodel_index]
definition = index=trustmodel
description = Default TrustModel index. Override in local/macros.conf to point at a different index.

[trustmodel_eval]
definition = `trustmodel_index` sourcetype="trustmodel:eval"
description = All TrustModel evaluation lifecycle events (all flavors)

[trustmodel_finding]
definition = `trustmodel_index` sourcetype="trustmodel:finding"
description = All TrustModel finding events

# Per-eval_source convenience macros (drilldown by flavor)

[trustmodel_eval_llm]
definition = `trustmodel_eval` eval_source=llm
description = LLM evaluations only

[trustmodel_eval_cots]
definition = `trustmodel_eval` eval_source=cots
description = COTS / agent compliance evaluations only (lending, healthcare, hr-bias, ...)

[trustmodel_eval_agentic_trace]
definition = `trustmodel_eval` eval_source=agentic_trace
description = Agentic-trace evaluations only

[trustmodel_eval_datascan]
definition = `trustmodel_eval` eval_source=datascan
description = DataScan runs only

[trustmodel_finding_llm]
definition = `trustmodel_finding` eval_source=llm
description = Findings from LLM evaluations

[trustmodel_finding_cots]
definition = `trustmodel_finding` eval_source=cots
description = Findings from COTS / agent compliance evaluations

[trustmodel_finding_agentic_trace]
definition = `trustmodel_finding` eval_source=agentic_trace
description = Findings from agentic-trace evaluations

[trustmodel_finding_datascan]
definition = `trustmodel_finding` eval_source=datascan
description = Findings from DataScan runs

# Per-dimension convenience macros (cross-flavor)

[trustmodel_finding_pii]
definition = `trustmodel_finding` dimension=pii
description = PII findings (across all eval flavors)

[trustmodel_finding_bias]
definition = `trustmodel_finding` dimension=bias
description = Bias findings (across all eval flavors)

[trustmodel_finding_proxy]
definition = `trustmodel_finding` dimension=proxy
description = Proxy-correlation findings

[trustmodel_finding_hallucination]
definition = `trustmodel_finding` dimension=hallucination
description = Hallucination findings (across all eval flavors)
