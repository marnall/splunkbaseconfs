[expose:ta_misp_threat_fetcher_settings]
pattern = ta_misp_threat_fetcher_settings
methods = POST, GET

[expose:ta_misp_threat_fetcher_settings_specified]
pattern = ta_misp_threat_fetcher_settings/*
methods = POST, GET, DELETE

[expose:ta_misp_threat_fetcher_misp_threat_events]
pattern = ta_misp_threat_fetcher_misp_threat_events
methods = POST, GET

[expose:ta_misp_threat_fetcher_misp_threat_events_specified]
pattern = ta_misp_threat_fetcher_misp_threat_events/*
methods = POST, GET, DELETE

[expose:data/indexes]
pattern = data/indexes
methods = GET
