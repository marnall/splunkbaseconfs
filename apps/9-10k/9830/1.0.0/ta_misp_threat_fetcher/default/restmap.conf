[admin:ta_misp_threat_fetcher_configuration]
match = /
members = ta_misp_threat_fetcher_settings

[admin:ta_misp_threat_fetcher_inputs]
match = /
members = ta_misp_threat_fetcher_misp_threat_events

[admin_external:ta_misp_threat_fetcher_settings]
handlertype = python
python.version = python3
python.required = 3.13
handlerfile = ta_misp_threat_fetcher_rh_settings.py
handleractions = edit, list
handlerpersistentmode = true

[admin_external:ta_misp_threat_fetcher_misp_threat_events]
handlertype = python
python.version = python3
python.required = 3.13
handlerfile = ta_misp_threat_fetcher_rh_misp_threat_events.py
handleractions = edit, list, remove, create
handlerpersistentmode = true
