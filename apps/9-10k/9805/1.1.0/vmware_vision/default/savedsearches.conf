[VMware Vision - VM deletion audit]
search = `vmware_vision_audit` | `vmware_vision_unique` | search vmware_action=deleted status=success | table _time vcenter vm_name vm_id user message
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0
description = On-demand report; configure a schedule and alert recipients explicitly if needed.

[VMware Vision - Failed operations]
search = `vmware_vision_audit` | `vmware_vision_unique` | search status=failure | stats count values(message) AS messages by vcenter vm_name user event_type
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0
description = On-demand report; configure a schedule and alert recipients explicitly if needed.

[VMware Vision - Daily lifecycle]
search = `vmware_vision_audit` | `vmware_vision_unique` | search category IN (lifecycle,power,configuration,migration,snapshot) | timechart span=1d count by vmware_action
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0
description = On-demand report; configure a schedule and alert recipients explicitly if needed.

[VMware Vision - Unmapped event types]
search = `vmware_vision_events` | search parser_status IN (unmapped,unmapped_event_type) | stats count by sourcetype event_type parser_status
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0
description = On-demand report; configure a schedule and alert recipients explicitly if needed.
