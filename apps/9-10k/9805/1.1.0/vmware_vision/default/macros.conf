[vmware_vision_indexes]
definition = index=vmware
iseval = 0
description = Set this macro in local/macros.conf to the VMware indexes you are authorized to search.

[vmware_vision_events]
definition = `vmware_vision_indexes` (sourcetype="vmware:vision:vcenter" OR sourcetype="vmware:vision:aria" OR sourcetype="vmware:vision:esxi" OR sourcetype="vmware:vision:json")
iseval = 0

[vmware_vision_unique]
definition = eval vv_dedup=if(isnotnull(event_uid) AND len(event_uid)>0,event_uid,sha256(_raw."::".host."::".tostring(_time))) | dedup vv_dedup
iseval = 0
description = Deduplicate copies forwarded by multiple paths; no event ID falls back to raw+host+time.

[vmware_vision_audit]
definition = `vmware_vision_events` | regex _raw="(?i)(?:Event\s+\[|vim\.event\.|eventType|event_type|eventTypeId|_typeName|\btype[\x22\x27]?\s*[:=])" | search record_kind=event
iseval = 0
description = Select event-shaped records before normalization; diagnostic logs remain in the full source macro.
