# searchbnf.conf — search assistant (typeahead) definitions for PTK Bottle Opener
#
# Provides in-UI syntax help and argument completion for the | certcheck
# generating command when users type in the Splunk search bar.
#
# Reference: https://docs.splunk.com/Documentation/Splunk/latest/Admin/Searchbnfconf

[certcheck-command]
syntax = certcheck [mode=<certcheck-mode>] [check=<certcheck-check>]
alias =
shortdesc = Audit SSL/TLS certificate configuration on this Splunk instance.
description = \
    Generating command.  Reads Splunk configuration via btool and performs \
    static certificate chain verification (and optionally live outbound SSL \
    handshakes) for every active TLS component found on this instance.  \
    Returns one result row per active component.  \
    Components include: HEC, Splunk-to-Splunk inputs, forwarder output groups, \
    Splunkweb, KVStore, indexer replication, Deployment Server/Client, and the \
    management port CLI setting. \
    \
    Output fields: component, priority, is_active, server_cert, ca_cert, \
    client_cert, status, messages. \
    \
    Requires the admin or sc_admin role.
comment1 = Check all TLS components (static, on-disk analysis):
example1 = | certcheck
comment2 = Check input-side components only:
example2 = | certcheck mode=inputs
comment3 = Check output-side components only:
example3 = | certcheck mode=outputs
comment4 = Check output-side components and attempt live SSL handshakes:
example4 = | certcheck mode=outputs check=live
comment5 = Show only failing components, sorted by priority:
example5 = | certcheck | where status="fail" | sort priority
usage = public
tags = ssl tls certificate x509 pki splunk

[certcheck-mode]
syntax = all | inputs | outputs
description = \
    Limit results to a subset of TLS components. \
    "all" (default) returns every active component. \
    "inputs" returns only components that accept inbound TLS connections \
    (HEC, Splunk-to-Splunk inputs, Splunkweb, KVStore, replication). \
    "outputs" returns only components that make outbound TLS connections \
    (forwarder output groups, Deployment Client).

[certcheck-check]
syntax = static | live
description = \
    Controls the depth of certificate analysis. \
    "static" (default) performs on-disk analysis only: certificate chain \
    verification, expiry checks, and component-specific rules.  No outbound \
    network connections are made. \
    "live" additionally attempts a live outbound SSL handshake for each \
    output-side component to verify the remote server certificate in real time.
