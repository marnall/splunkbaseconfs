## Base index for all F5 Distributed Cloud (XC) events.
## Defaults to every index; scope this to your F5 XC index(es) if desired,
## e.g. definition = index=f5_xc
[f5_xc_index]
definition = index=*
iseval = 0

## Base search for all F5 Distributed Cloud (XC) events.
## Keys off the TA-f5-xc vendor sourcetype. Override in local/ if your
## F5 XC data uses a different sourcetype or lands in a specific index.
[f5xc]
definition = `f5_xc_index` sourcetype=f5:xc
iseval = 0
