[admin:ta_cert_monitor_configuration]
match = /
members = ta_cert_monitor_settings

[admin:ta_cert_monitor_inputs]
match = /
members = ta_cert_monitor_cert_checker

[admin_external:ta_cert_monitor_settings]
handlertype = python
python.version = python3
python.required = 3.12, 3.13, 3.14
handlerfile = ta_cert_monitor_rh_settings.py
handleractions = edit, list
handlerpersistentmode = true

[admin_external:ta_cert_monitor_cert_checker]
handlertype = python
python.version = python3
python.required = 3.12, 3.13, 3.14
handlerfile = ta_cert_monitor_rh_cert_checker.py
handleractions = edit, list, remove, create
handlerpersistentmode = true
