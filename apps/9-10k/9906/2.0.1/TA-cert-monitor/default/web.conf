[expose:ta_cert_monitor_settings]
pattern = ta_cert_monitor_settings
methods = POST, GET

[expose:ta_cert_monitor_settings_specified]
pattern = ta_cert_monitor_settings/*
methods = POST, GET, DELETE

[expose:ta_cert_monitor_cert_checker]
pattern = ta_cert_monitor_cert_checker
methods = POST, GET

[expose:ta_cert_monitor_cert_checker_specified]
pattern = ta_cert_monitor_cert_checker/*
methods = POST, GET, DELETE

[expose:data/indexes]
pattern = data/indexes
methods = GET
