[scaleway:audittrail_events]
TIMESTAMP_FIELDS = recorded_at
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9N%Z
INDEXED_EXTRACTIONS = json
KV_MODE = none

TRANSFORMS-scaleway_audittrail_events_sourcetyper = scaleway_audittrail_events_auths 

FIELDALIAS-object = resources{}.name AS object
FIELDALIAS-object_id = resources{}.id AS object_id
FIELDALIAS-object_category = resources{}.type AS object_category
FIELDALIAS-result = status_code AS result
FIELDALIAS-src = source_ip AS src
FIELDALIAS-src_ip = source_ip AS src_ip
FIELDALIAS-vendor_account = organization_id AS vendor_account
FIELDALIAS-vendor_product = product_name AS vendor_product

EVAL-action = case(match(method_name, "^(Create|Clone).*$"), "created", match(method_name, "^Delete.*$"), "deleted", match(method_name, "^Lock.*$"), "lockout", match(method_name, "^Unlock.*$"), "unlocked", match(method_name, "^Export.*$"), "read", 1=1, "modified")
EVAL-change_type = case(match(method_name, "^(Update|Create|Delete|Lock|Unlock)User.*$") AND !match(method_name, "MFAOTP$"), "AAA", method_name="ServerAction", "OPS", 1=1, "CFG")
EVAL-command = case(method_name="ServerAction", 'request_body.action', 1=1, method_name)
EVAL-object_attrs = mvappend(object_attrs, "created_at: "+'resources{}.created_at', "deleted_at: "+'resources{}.deleted_at', "updated_at: "+'resources{}.updated_at')
# Only for AAA events, we use principal.id as the src_user field
EVAL-src_user = case(match(method_name, "^(Update|Create|Delete|Lock|Unlock)User.*$") AND !match(method_name, "MFAOTP$"), 'principal.id', 1=1, null()) 
EVAL-status = case(status_code="200", "success", match(status_code, "^4\d+$"), "failure", 1=1, null())
# For AAA events, we use the resources{}.id as the user field. For all other events, we use the principal.id if it's not null, otherwise we use resources{}.id.
EVAL-user = case(match(method_name, "^(Update|Create|Delete|Lock|Unlock)User.*$") AND !match(method_name, "MFAOTP$"), 'resources{}.id', isnull('principal.id'), 'resources{}.id', 1=1, 'principal.id')
# Only for AAA events, we use the resources{}.name as the user_name field
EVAL-user_name = case(match(method_name, "^(Update|Create|Delete|Lock|Unlock)User.*$") AND !match(method_name, "MFAOTP$"), 'resources{}.name', 1=1, null())
EVAL-vendor_region = case(match(locality, "^\w{2}-\w{3}-\d+$"), substr(locality, 0, 6), 1=1, locality)

LOOKUP-locality = localities_lookup locality OUTPUT locality_country, locality_city

[scaleway:audittrail_events:auths]
TIMESTAMP_FIELDS = recorded_at
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9N%Z
INDEXED_EXTRACTIONS = json
KV_MODE = none

FIELDALIAS-authentication_method = method_name AS authentication_method
FIELDALIAS-authentication_service = service_name AS authentication_service
FIELDALIAS-app = product_name AS app
FIELDALIAS-result = status_code AS result
FIELDALIAS-src = source_ip AS src
FIELDALIAS-src_ip = source_ip AS src_ip
FIELDALIAS-user = resources{}.name AS user
FIELDALIAS-user_id = resources{}.id AS user_id
FIELDALIAS-user_type = resources{}.type AS user_type
FIELDALIAS-vendor_account = organization_id AS vendor_account

EVAL-action = case((method_name="RenewJWT" OR method_name="CommitLogin") AND status_code="200", "success", (method_name="CheckLoginMFAOTP" OR method_name="CreateMagicCodeLogin" OR method_name="CreateOAuth2Login" OR method_name="CreatePasswordLogin" OR method_name="CreateSamlLogin" OR method_name="RenewJWT") AND match(status_code, "^4\d+$"), "failure", 1=1, null())

LOOKUP-locality = localities_lookup locality OUTPUT locality_country, locality_city

[scaleway:audittrail_authentication_events]
# To be implemented in the future, if needed.

[scaleway:audittrail_system_events]
TIMESTAMP_FIELDS = recorded_at
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9N%Z
INDEXED_EXTRACTIONS = json
KV_MODE = none

FIELDALIAS-command = system_name AS command
FIELDALIAS-object = resources{}.name AS object
FIELDALIAS-object_id = resources{}.id AS object_id
FIELDALIAS-object_category = resources{}.type AS object_category
FIELDALIAS-result = kind AS result
FIELDALIAS-vendor_account = organization_id AS vendor_account
FIELDALIAS-vendor_product = product_name AS vendor_product

EVAL-action = case(match(system_name, "^.*_deletion$"), "deleted", match(system_name, "^.*_creation$"), "created", match(system_name, "^.*_update$"), "modified", 1=1, null())
EVAL-change_type = "system " + kind
EVAL-object_attrs = mvappend(object_attrs, "created_at: "+'resources{}.created_at', "deleted_at: "+'resources{}.deleted_at', "updated_at: "+'resources{}.updated_at')
EVAL-status = case(kind="notification" OR kind="cron", "success", 1=1, "failure")
EVAL-user = "system"
EVAL-vendor_region = case(match(locality, "^\w{2}-\w{3}-\d+$"), substr(locality, 0, 6), 1=1, locality)

LOOKUP-locality = localities_lookup locality OUTPUT locality_country, locality_city

[scaleway:iam:logs]
TIMESTAMP_FIELDS = created_at
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%Z
INDEXED_EXTRACTIONS = json
KV_MODE = none

FIELDALIAS-object = resource_id AS object
FIELDALIAS-object_id = resource_id AS object_id
FIELDALIAS-object_category = resource_type AS object_category
FIELDALIAS-result = action AS result
FIELDALIAS-src = ip AS src
FIELDALIAS-src_ip = ip AS src_ip
FIELDALIAS-vendor_account = organization_id AS vendor_account

EVAL-action = case(action="unknown_action", null(), 1=1, action)
EVAL-change_type = "CFG"
EVAL-object_attrs = "created_at: " + created_at
EVAL-src_user = case(resource_type="user", bearer_id, 1=1, null())
EVAL-status = "success"
EVAL-user = case(resource_type="user", resource_id, 1=1, bearer_id)
EVAL-vendor_product = "Scaleway Identity and Access Management"

