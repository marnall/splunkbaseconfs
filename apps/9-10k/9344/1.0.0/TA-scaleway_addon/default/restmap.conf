[admin:TA-scaleway_addon_configuration]
match = /
members = TA-scaleway_addon_account, TA-scaleway_addon_settings

[admin:TA-scaleway_addon_inputs]
match = /
members = TA-scaleway_addon_audittrail_authentication_events, TA-scaleway_addon_audittrail_events, TA-scaleway_addon_audittrail_system_events, TA-scaleway_addon_iam_applications, TA-scaleway_addon_iam_groups, TA-scaleway_addon_iam_logs, TA-scaleway_addon_iam_users, TA-scaleway_addon_instance_servers

[admin_external:TA-scaleway_addon_account]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = TA-scaleway_addon_rh_account.py
handleractions = edit, list, remove, create
handlerpersistentmode = true

[admin_external:TA-scaleway_addon_settings]
