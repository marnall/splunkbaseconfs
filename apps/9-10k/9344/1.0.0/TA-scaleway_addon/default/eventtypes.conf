[audittrail_events_change]
search = sourcetype=scaleway:audittrail_events

[audittrail_events_change_account]
search = sourcetype=scaleway:audittrail_events change_type="AAA"

[audittrail_events_change_instance]
search = sourcetype=scaleway:audittrail_events change_type="OPS"

[audittrail_events_authentication]
search = sourcetype=scaleway:audittrail_events:auths action=*

[iam_logs_change]
search = sourcetype=scaleway:iam:logs

[iam_logs_change_account]
search = sourcetype=scaleway:iam:logs resource_type="user"
