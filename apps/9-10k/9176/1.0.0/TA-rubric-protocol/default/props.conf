[rubric:attestation]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
TIME_PREFIX = "ts"\s*:\s*
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 20
TRUNCATE = 100000

[rubric:cef]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = none
TIME_PREFIX = rt=
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 20
TRUNCATE = 100000
EXTRACT-rubric_cef_header = ^CEF:0\|(?<vendor>[^\|]+)\|(?<product>[^\|]+)\|(?<product_version>[^\|]+)\|(?<signature_id>[^\|]+)\|(?<signature_name>[^\|]+)\|(?<cef_severity>[^\|]+)\|
EXTRACT-rubric_act = \bact=(?<action_path>\S+)
EXTRACT-rubric_suser = \bsuser=(?<agent_id>\S+)
EXTRACT-rubric_attid = cs1Label=attestationId cs1=(?<attestation_id>\S+)
EXTRACT-rubric_topic = cs2Label=hcsTopic cs2=(?<hcs_topic>\S+)
EXTRACT-rubric_tier = cs3Label=tier cs3=(?<tier>\S+)
EXTRACT-rubric_sigalg = cs4Label=sigAlg cs4=(?<sig_alg>\S+)
EXTRACT-rubric_hcsseq = cn1Label=hcsSequence cn1=(?<hcs_sequence>\d+)
EXTRACT-rubric_payloadhash = cs5Label=payloadHash cs5=(?<payload_hash>\S+)
EXTRACT-rubric_node = \bdvchost=(?<federation_node>\S+)
EVAL-verify_url = "https://rubric-protocol.com/verify/v1/verify/" . attestation_id
