# Search head cluster replication for this app's own configuration file.
#
# ONE STANZA, AND IT DOES NOT TURN CLUSTERING ON. [shclustering] here carries
# nothing but conf_replication_include settings, which are the documented way
# an app asks that its own configuration file be kept in step across the
# members of a search head cluster. Whether an instance is clustered at all is
# decided by the deployment's own server.conf, not by an app's, and this file
# sets none of the settings that would decide it.
#
# WHY polyswarm.conf NEEDS IT. The setup page writes the customer's answers to
# local/polyswarm.conf on whichever member served the form. Splunk replicates
# the configuration files it knows by name on its own, and a file it does not
# know by name is left where it was written. On a cluster that means the daily
# API limit an operator set on member one is invisible to members two and
# three, so the same search behaves differently depending on which member runs
# it, and a re-run of setup on another member silently disagrees with the
# first. The KV store collections and credential storage this app also writes
# are replicated by the platform already, which is what makes this one file the
# gap.
#
# The API key is NOT here and must never be. It lives in encrypted credential
# storage, for the reason default/polyswarm.conf states at length: files under
# default/ and local/ are world readable on a search head and are copied whole
# into deployment bundles.
#
# WHY logging.conf IS LISTED TOO, WHICH IS THE HONEST VERSION. It is a Python
# logging configuration that splunklib reads, it ships only under default/, and
# nothing in this app ever writes it to local/, so replicating it changes
# nothing on a cluster today. It is here because AppInspect's
# check_custom_conf_replication counts every configuration file Splunk does not
# know by name, names this one specifically, and a customer who does override
# logging on one member is better served by the override travelling with the
# rest of the app than by it sticking to the member they happened to edit.
#
# AppInspect's check_custom_conf_replication is what reports the absence of
# this stanza, and it reports it as a warning rather than a failure because a
# single search head does not need it. See D31.

[shclustering]
conf_replication_include.polyswarm = true
conf_replication_include.logging = true
