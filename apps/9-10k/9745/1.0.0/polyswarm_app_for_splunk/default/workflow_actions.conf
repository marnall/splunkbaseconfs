# Event workflow actions. Design section 4.1, and the single-event half of 4.8.
#
# Three actions, in two kinds. Two dispatch a search that spends quota, one at
# one request per invocation and one at two; the third opens a page in the
# PolySwarm portal and spends nothing. Everything below follows from that split,
# and the two search actions differ only in whether they ask for attribution,
# which is a cost and therefore a choice the analyst makes in the menu.
#
#
# THE SUBSTITUTION SYNTAX, AND WHERE IT COMES FROM
# ------------------------------------------------
# Splunk's workflow_actions.conf specification defines two ways a field value
# reaches an action. A named field is written $FIELDNAME$, and the field the
# action was invoked from is written with the special variables, of which the
# documented set is:
#
#     $@field_name$     the name of the field the action was invoked from
#     $@field_value$    the value of that field
#     $@sid$            the search job id
#     $@offset$         the offset of the event being viewed
#     $@namespace$      the app namespace the search ran in
#     $@latest_time$    the latest time of the event
#
# Only $@field_value$ is used here, and tests/unit/test_workflow_actions.py
# pins that: it fails on any token outside the documented set, so a later
# addition cannot invent one. The vendored splunklib carries nothing about
# workflow actions (it is the search-command and REST SDK, and a tree-wide grep
# for "workflow" in bin/lib returns nothing), so the specification is the only
# source for this and there is no second opinion available in the package.
#
# CONSEQUENCE, AND IT IS NOT COSMETIC: $@field_value$ has a value only when the
# action is invoked from a FIELD, because it is defined as the value of the
# invoking field. An action offered on the event menu has no invoking field, so
# the same action reached that way would substitute nothing and dispatch a
# search for the empty string. Both actions below therefore set
# display_location = field_menu. That is narrower than "workflow actions on any
# event" reads in the design, and it is the honest reading of the variable: an
# event-menu action would need a named $FIELDNAME$ and could then only ever work
# on sourcetypes carrying that exact field name.
#
#
# WHY search.app IS STILL SET
# ---------------------------
# Until 2026-09-09 metadata/default.meta exported nothing, so polyswarmsearch
# resolved only inside the polyswarm_app_for_splunk namespace and search.app was
# load bearing. The commands are exported system wide now, so the dispatched
# search would resolve from any app; search.app stays as belt and braces and
# because it lands the analyst in this app's search view, next to the
# dashboards. A test asserts it against the app id rather than a literal.
#
# search.view names the platform's own search view. This app ships no view by
# that name; the Search app's is exported globally, which is why
# default/data/ui/nav/default.xml already lists it and why
# tests/unit/test_dashboards.py carries it as an external nav view. The same
# fact is what makes it resolvable here.

# ---------------------------------------------------------------------------
# Enrich with PolySwarm. Dispatches a search, and that search spends quota.
# ---------------------------------------------------------------------------
#
# Offered on the field names an IOC realistically arrives under in Splunk data:
# the CIM hash fields, the CIM endpoint and network address fields, and the web
# and DNS fields. The list is asserted in the tests rather than left to drift.
#
# WHAT THIS ACTION DELIVERS PER FIELD, AND WHERE IT STOPS.
#
# 1. Hash, url and domain fields deliver a real verdict. polyswarmsearch
#    defaults to ioctype=auto and routes each value by type: a sha256 goes to
#    /v3/search/hash/sha256, and a URL or a bare domain goes to /v3/search/url.
#    Both are pinned by recorded live responses,
#    tests/fixtures/search-hash-recorded.json and
#    tests/fixtures/search-url-recorded.json, and the domain case is recorded
#    specifically: the URL recording was taken by querying a bare host. So no
#    ioctype is stated below. The action does not know what type the invoking
#    field holds, and auto is the mode that does not need to be told.
#
# 2. md5, sha1 and address fields come back unknown WITH A REASON, and no
#    request is spent on them. The platform's artifact search takes a sha256,
#    so an md5 cannot be looked up and no md5 endpoint is invented; there is no
#    recorded response for a network address, so none is guessed at either.
#    Those values report verdict unknown plus a polyswarm_note saying which of
#    the two it was. That is the difference between "we asked and the platform
#    has nothing" and "we cannot ask", and an analyst who cannot tell them
#    apart concludes the platform is empty. Which is why polyswarm_note is in
#    the table below: the limit arrives in the analyst's own results rather
#    than only in docs/decisions.md.
#
#    The fields stay on the list for the reason they always did. The field list
#    is where the surface is declared, and an action absent from an md5 field
#    menu teaches an analyst that the app has nothing to say about that event,
#    when what it has to say is a specific and useful sentence.
#
# 3. The field value is quoted into the search string, and no escaping function
#    exists in a workflow action. A value carrying a double quote produces SPL
#    the analyst can see and correct in the search bar of the new tab, because
#    the action opens a search rather than modifying theirs and because
#    | makeresults means nothing runs against their index. limit=1 bounds the
#    cost of the dispatched search to a single request whatever the value is.

[polyswarm_enrich]
label = Enrich with PolySwarm
type = search

# Comma separated. The action appears in the field menu for each of these.
fields = file_hash, sha256, md5, sha1, dest, src, dest_ip, src_ip, url, domain, query

# field_menu, not all and not event_menu. See the substitution note above.
display_location = field_menu

# limit=1 is design constraint C11 at the smallest scale the constraint has: one
# invocation, one indicator, one request, stated at the point of spend.
search.search_string = | makeresults | eval ioc="$@field_value$" | polyswarmsearch field=ioc limit=1 | table ioc, polyswarm_verdict, polyswarm_polyscore, polyswarm_detections, polyswarm_permalink, polyswarm_cache, polyswarm_note

# A new tab. An analyst mid-investigation does not lose the search they were
# reading in order to look one indicator up.
search.target = blank

search.app = polyswarm_app_for_splunk
search.view = search

# ---------------------------------------------------------------------------
# Enrich with PolySwarm (with attribution). The same action, twice the cost.
# ---------------------------------------------------------------------------
#
# WHY THIS IS A SECOND ENTRY AND NOT AN OPTION ON THE FIRST ONE.
#
# A workflow action's search string is fixed in this file. There is no prompt,
# no parameter, and no way for an analyst to answer a question between clicking
# a menu entry and the search being dispatched. So a single entry could only
# either always fetch attribution or never fetch it, and neither is right: never
# means the federal-prospect ask this surface answers is unreachable from an
# event, and always means every analyst who wanted a verdict paid for
# attribution they did not ask for.
#
# Two entries make the cost the analyst's choice, taken at the moment of spend,
# which is what design constraint C11 means by explicit. The label says
# "with attribution" for the same reason: the entry that spends more has to say
# so in the menu, because the menu is where the decision is made.
#
# WHAT IT COSTS, EXACTLY. Two requests rather than one. limit=1 bounds the
# verdict lookup to a single indicator, as on the action above, and
# attribution=true adds at most one tag-link request for the artifact that
# verdict resolved to. An artifact with no attribution on file costs the second
# request and emits no attribution fields, which is the ordinary outcome and is
# not a failure: see the note at ACTOR_TAG_PREFIX in bin/cmd_search.py for why
# absence here is silent rather than annotated.
#
# The table clause carries every field the command can emit in this mode, which
# is cmd_search.EVERY_FIELD: the default set the action above tables, plus the
# four attribution fields. The tests read both sets out of the command rather
# than restating them, so a field added to either one fails here until the
# actions move with it.
#
# The field list is deliberately identical to the action above. Attribution is
# addressed by the ARTIFACT'S sha256 rather than by the value in the event, and
# a url or domain field resolves to an artifact that carries one, so a proxy log
# gets family and actor context through this entry exactly as an endpoint hash
# field does. On an md5, a sha1 or an address the routing table declines before
# any request is made, so this entry costs the same nothing the other one does
# and returns the same polyswarm_note.

[polyswarm_enrich_attribution]
label = Enrich with PolySwarm (with attribution)
type = search

# Identical to [polyswarm_enrich]. Asserted against that action's list in the
# tests rather than compared by eye.
fields = file_hash, sha256, md5, sha1, dest, src, dest_ip, src_ip, url, domain, query

display_location = field_menu

search.search_string = | makeresults | eval ioc="$@field_value$" | polyswarmsearch field=ioc limit=1 attribution=true | table ioc, polyswarm_verdict, polyswarm_polyscore, polyswarm_detections, polyswarm_permalink, polyswarm_families, polyswarm_tags, polyswarm_actor, polyswarm_emerging, polyswarm_cache, polyswarm_note

search.target = blank

search.app = polyswarm_app_for_splunk
search.view = search

# ---------------------------------------------------------------------------
# Open in PolySwarm portal. A link. No command, no key, no quota.
# ---------------------------------------------------------------------------
#
# SCOPED TO SHA256-BEARING FIELDS ONLY, AND HERE IS THE DERIVATION.
#
# The only portal URL this repository can show is the permalink in
# tests/fixtures/search-hash-recorded.json, a scrubbed recording of a live
# response. Its shape is:
#
#     https://polyswarm.network/scan/results/file/<sha256>/<scan id>
#
# So the host and the path prefix up to the artifact hash are observed facts,
# and link.uri below is exactly that prefix with the field value substituted.
# tests/unit/test_workflow_actions.py derives the prefix from the fixture at run
# time by splitting the recorded permalink on the recorded sha256, and compares:
# the URI is not permitted to contain a segment the recording does not show.
#
# Three consequences, all of them limits rather than features:
#
# 1. No general search path. The recording shows a scan-result path and nothing
#    else, so a /search/ or /url/ or /domain/ path would be invented. Field is
#    not feature (constraint C10), so the action is not offered on url, domain,
#    or address fields at all.
# 2. md5 and sha1 are excluded even though they are hash fields. The segment
#    after the prefix is the artifact's sha256 in the recording, and an md5 in
#    that position is a different claim about the portal's routing, not a
#    narrower one.
# 3. The trailing scan-id segment is dropped, because a scan id cannot be
#    derived from a field value. Whether the portal serves the two-segment form
#    is NOT verified: no live portal check has been made, and constraint C10 is
#    what says that matters. It is recorded as outstanding in
#    docs/decisions.md rather than asserted here.
#
# Field values in a link.uri raise a URL-encoding question in general. It does
# not arise here: both fields this action is offered on carry hexadecimal, which
# needs no encoding, and that is a further reason the scope is what it is.

[polyswarm_portal]
label = Open in PolySwarm portal
type = link
fields = file_hash, sha256
display_location = field_menu
link.uri = https://polyswarm.network/scan/results/file/$@field_value$
link.target = blank
link.method = get
