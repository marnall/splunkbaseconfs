# Lookup definitions.
#
# One definition, and it exists for the dashboards.
#
# SPL cannot read a KV store collection directly. bin/verdict_cache.py does not
# need it to: it reaches ps_verdict_cache through splunkd's REST endpoint by
# document id, one indicator at a time, which is the right shape for a search
# command enriching event by event. A dashboard panel wants the opposite shape,
# every document at once, and the supported way to get that in SPL is a
# collection-backed lookup definition read with | inputlookup.
#
# So this stanza is the bridge, and it is the only reason a transforms.conf
# exists in this app. Design section 4.8 depends on it: the Overview dashboard
# renders entirely from this lookup and from the app's own log lines, which is
# what makes opening the app cost zero PolySwarm API quota.

[ps_verdict_cache_lookup]

# external_type = kvstore is what makes this a view onto a collection rather
# than a csv file. collection names the stanza in default/collections.conf, and
# the two have to agree: a lookup pointing at a collection that does not exist
# fails at search time with an error about the lookup, not about the
# collection, which is a confusing place to start debugging.
# tests/unit/test_dashboards.py asserts they agree.
external_type = kvstore
collection = ps_verdict_cache

# Every field a panel reads, including _key.
#
# fields_list is not documentation, it is the projection: a field absent from
# this list is not returned by | inputlookup even though it is present in the
# collection. _key is the indicator's document id and is listed first because
# it is what a drilldown would key on.
#
# The four data fields are the collection's own, declared in collections.conf
# for the same reason they are declared here: the reader validates types on the
# way out and treats an unreadable document as a miss, so this list is a
# projection and not a promise about content.
#
# attribution IS ON THIS LIST BECAUSE A PANEL READS IT, and that is the only
# reason a field belongs here. The Overview dashboard's top-families panel
# reads the family list out of it with json_extract, so a field left off this
# line would leave that panel permanently empty on a customer's search head
# with nothing failing anywhere: | inputlookup returns only what is projected,
# whatever the collection holds. tests/unit/test_dashboards.py asserts the
# names against bin/verdict_cache.py rather than restating them, so a field
# added to the cache module without being added here fails a test instead of
# disappearing from a panel.
fields_list = _key, payload, stored_at, ttl_seconds, attribution

# ---------------------------------------------------------------------------
# The usage and entitlement cache, read by the Overview dashboard.
# ---------------------------------------------------------------------------
#
# Same bridge as above and the same reason for it: the Entitlement panel reads
# every stored row at once, which in SPL means a collection backed lookup
# definition and | inputlookup. It is what makes the panel cost zero PolySwarm
# API requests to open, which is the rule design section 4.8 sets and which the
# refresh input beside the panel is the deliberate, gated exception to.

[ps_usage_cache_lookup]

external_type = kvstore
collection = ps_usage_cache

# Every field bin/cmd_usage.py can emit, plus _key.
#
# fields_list is the projection and not documentation: a field absent from it is
# not returned by | inputlookup even though the document carries it. So this
# list is asserted against the command's own ALL_FIELDS, and a field added to
# the command without being added here fails a test rather than disappearing
# from the panel.
#
# The order matches cmd_usage.ALL_FIELDS: the row discriminator and the fetch
# time, the throttle message, the per feature block, then the account row's
# identity and plan fields.
fields_list = _key, row_type, fetched_at, message, feature, tag, feature_type, base_uses, remaining_uses, overage, account_type, tenant, communities, account_plan_name, is_trial, daily_api_limit, daily_api_remaining, plan_period_end

# ---------------------------------------------------------------------------
# The sandbox task table, read by the tasks tray. Design section 4.3.
# ---------------------------------------------------------------------------
#
# Same bridge as the two above and the same reason for it: SPL cannot read a KV
# store collection directly, and a tray wants every row at once, which in SPL
# means a collection backed lookup definition and | inputlookup.
#
# The tray itself lands with the rest of Phase 2. The definition ships with the
# collection rather than with the dashboard because the collection and its
# projection are one decision: a field written into the collection and left off
# the projection below is a field that exists and cannot be read, which fails
# nowhere and shows up as a permanently empty column.

[ps_sandbox_tasks_lookup]

external_type = kvstore
collection = ps_sandbox_tasks

# Every field bin/task_store.py writes, plus _key.
#
# fields_list is the projection and not documentation: a field absent from it
# is not returned by | inputlookup even though the document carries it. So this
# list is asserted against task_store.ALL_FIELDS, and a field added to the
# store without being added here fails a test rather than disappearing from the
# tray.
#
# The order matches task_store.ALL_FIELDS: the task's identity, what was
# detonated and where, then the status and the two timestamps, then the digest
# and the portal link that are absent until the platform has hashed the upload,
# then the findings the poller reads out of the final sandbox report, then the
# poller's own four state fields, and last the six fields saying where the
# detonation was asked for.
#
# The poller's fields and the provenance fields are projected even though no
# panel shows them, because this list is the projection of the row and a row
# field that cannot be read is a diagnostic an operator cannot reach. "Why has
# this task not moved" is answered by next_poll_at and poll_abandoned_at,
# "which notable spent this detonation" is answered by notable_event_id, and
# | inputlookup is the only way an operator gets at a KV document without the
# management port. Being projected is not being tabled: the Sandbox Tasks page
# names its columns explicitly and leaves all ten of those fields off.
fields_list = _key, task_id, target, provider, vm, community, status, submitted_at, updated_at, sha256, report_url, analysis_score, tags, malware_family, c2_ip_count, c2_ips, process_count, poll_attempts, next_poll_at, poll_abandoned_at, poll_not_found, source_sid, source_rid, source_orig_sid, source_orig_rid, notable_event_id, notable_rule_id
