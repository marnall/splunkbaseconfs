# CIM tags for the events this app writes. Design section 5.
#
# ONE TAG, AND THE MISSING SECOND ONE IS THE WHOLE POINT OF THIS FILE.
#
# The Common Information Model's Malware_Attacks dataset matches events tagged
# `malware` AND `attack`. Applying both here would put every artifact this
# input pulls into a customer's Malware data model, and that would be wrong in
# a way that is expensive to undo.
#
# A Malware_Attacks event means malware was DETECTED ON A HOST. The dataset is
# built around `dest`, the system it was found on, and `action`, what the
# security product did about it. A PolySwarm intel artifact has neither,
# because nobody's host is involved: it is a reputation record about a file the
# platform has seen. Tagging it `attack` would mean every dashboard, saved
# search and ES correlation rule that counts malware attacks would start
# counting our feed, with no dest to pivot on and no action to report. An
# analyst asking "how many malware attacks this week" would get an answer that
# included several hundred files nobody was ever attacked by.
#
# So the events carry `malware` alone. That is enough to make them
# discoverable through the tag an analyst already knows, `tag=malware`, and it
# leaves the data model's host-oriented datasets to events that actually have a
# host. default/props.conf carries the same reasoning for the fields, and the
# two files agree: map what is the same fact under another name, invent
# nothing.
#
# THIS IS GROUNDWORK AND NOT A FINISHED MAPPING, which is what design section 5
# asks of it at this phase. The finished version arrives from the other
# direction: when the enrichment path annotates a customer's own endpoint or
# proxy event with a PolySwarm verdict, THAT event already has a dest, a user
# and an action, and it is the one that belongs in Malware_Attacks. Nothing
# here has to change for that to happen.

[eventtype=polyswarm_artifact]
malware = enabled
