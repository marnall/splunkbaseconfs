# Data inputs shipped by the PolySwarm App.
#
# One input, the sandbox task poller. It is the second half of a detonation:
# bin/cmd_detonate.py buys the detonation and writes the task row, and this is
# what follows that task until the platform settles it. Without it a row sits
# in the tasks tray reading PENDING forever, which is a metered call the
# customer paid for and cannot see the result of.
#
# THE STANZA NAME IS THE SCRIPT'S FILE NAME, AND THAT IS NOT A STYLE CHOICE.
# splunkd discovers a modular input by running every script in an app's bin
# directory with --scheme and taking the script's own basename as the input
# kind. So this is [input_task_poller://...] because the script is
# bin/input_task_poller.py, which is the name design section 6 gives it.
# Renaming the file renames the kind and orphans this stanza, and a customer's
# own configured stanza with it.

# THE KIND STANZA, WHICH IS NOT THE SAME THING AS AN INPUT.
#
# [input_task_poller] configures the input KIND and applies to every stanza of
# it, including one a customer creates for themselves. The stanza below it,
# with the ://name suffix, is the one instance this app ships enabled.
#
# python.version belongs here rather than on the instance, and that is measured
# rather than preferred: splunk-appinspect's
# check_inputs_conf_spec_stanzas_has_python_version_property reads the property
# off the kind and FAILS an app that sets it only on an instance. It is right
# to. A customer who adds a second stanza inherits the interpreter from here,
# where setting it per instance would leave their input running on whatever
# splunkd defaults to that release.
#
# Splunk 9 and 10 ship Python 3 and this app has no py2 shims: design section 6
# sets the floor at 3.9.
#
# BOTH INTERPRETER SETTINGS ARE SET, AND THE LIST FORM IS WHY THAT COSTS
# NOTHING. python.required supersedes python.version on Splunk 10.2 and later,
# and it takes a comma separated list rather than one version: the platform
# selects the highest entry it can actually provide. So 3.9,3.13 asks for 3.13
# on a release that ships it and falls back to 3.9 on one that does not, which
# is the mixed estate this tarball has to cross. Splunk 9.x does not read the
# setting at all, so python.version below is what selects the interpreter
# there, and both inputs read their parameters by name rather than iterating
# them, so the unread setting cannot reach a stanza's own arguments.
#
# Read off 10.4.2's own README/inputs.conf.spec rather than assumed, which is
# what corrects the earlier reading in D5 that the setting pins one version.
# See D31.
#
# It goes on the kind AND the instance. AppInspect's
# check_modular_inputs_python_required reports an instance stanza that does not
# carry it, and Splunk's own guidance is to set the same value in both so that
# the interpreter cannot differ between the scheme and the running input.

[input_task_poller]
python.version = python3
python.required = 3.9,3.13

[input_task_poller://polyswarm_sandbox_tasks]
python.required = 3.9,3.13

# ENABLED, WHICH IS A DELIBERATE EXCEPTION TO DEFECT CLASS B8.
#
# B8 says a feature that spends quota or money ships opt-in, and every other
# such setting in this app obeys it: polyswarmsearch's attribution option is
# off, and there is no automatic CIM lookup at all. This input is enabled
# because it spends nothing on its own behalf. With no detonations there are no
# task rows, and with no rows this input makes no request: the shipped state on
# a fresh install is a process that reads an empty collection and exits.
#
# The spend it follows up on has already happened, deliberately, at the moment
# somebody ran polyswarmdetonate or fired the PolySwarm Detonate alert action.
# A detonation nobody polls is worse than the status requests this input makes:
# an Enterprise plan includes 30 detonations a month, and losing the result of
# one of them to a disabled input is the expensive failure here.
#
# The requests it does make are bounded twice over. Each in-flight task costs
# at most one status request per run, with a per-row backoff growing 30, 60,
# 120 then 300 seconds, and max_polls below caps the requests any single run
# may spend. See bin/input_task_poller.py.
disabled = false

# How often splunkd runs the input, in seconds.
#
# Two minutes, and the per-row backoff is what makes that inexpensive rather
# than chatty: a run visits only the rows whose own next_poll_at has passed, so
# a task in its first minute is polled on the next run and a task that has been
# running for an hour is polled every five minutes whatever this interval says.
#
# The number is chosen against what an analyst is doing. A URL detonation
# settles in minutes, and the tasks tray is a page somebody opens and watches
# after pressing detonate, so a settled task should appear there in about the
# time it takes to read the row. A five minute interval would make the tray look
# broken for the first four.
interval = 120

# Most status requests one run may spend. Bounded at 200 in code, which an
# operator cannot raise from a form: see MAX_POLLS_HARD_CAP in
# bin/input_task_poller.py. Rows above the ceiling are left for the next run
# rather than dropped, which is constraint C11's refuse-rather-than-proceed
# shape applied to an input.
#
# Sized against the entitlement rather than guessed: an Enterprise plan
# includes 30 detonations a month, so fifty tasks in flight at once is already
# an unusual day.
max_polls = 50

# How long a detonation may stay unsettled before the poller stops asking about
# it, in hours.
#
# THIS IS THE PER-TASK CEILING, AND max_polls IS NOT ONE. max_polls bounds what
# a single run may spend; it says nothing about what one row costs over its
# life. Without this setting a task the platform will never settle, a 404, a
# status read that keeps failing, a detonation dropped platform-side, was
# polled every five minutes for as long as the row existed: 288 metered
# requests a day, per stale row, forever.
#
# A day, which is roughly eight times the platform's own task expiration of
# about three hours. It has to be well above how long a real detonation takes,
# because a row abandoned early is a paid detonation whose result this app then
# never reads, and small enough that a stale row cannot accumulate. At least 1
# and at most 168, refused rather than clamped when the input is saved: see
# MIN_MAX_TASK_AGE_HOURS in bin/input_task_poller.py.
#
# Two things retire a row sooner and need no setting: the platform's own
# expiration, and three consecutive polls the platform answers with nothing. An
# abandoned row is KEPT, with whatever the platform last said about it, and
# stamped with poll_abandoned_at. It is the receipt for a metered detonation
# and the platform's own task listing hangs, so it is never deleted.
max_task_age_hours = 24

# No index or sourcetype setting, because THIS INPUT WRITES NO EVENTS.
#
# Its output is the state of the rows in the ps_sandbox_tasks collection, which
# the Sandbox Tasks dashboard reads through the ps_sandbox_tasks_lookup
# definition, and its diagnostics are the ps_log lines splunkd already indexes
# into _internal from the app's own log file. Writing the rows into an index as
# well would put the customer's detonated URLs in a second place under a second
# retention policy to serve a tray that already has them.

# ---------------------------------------------------------------------------
# The scheduled threat intel pull. Design section 4.2.
# ---------------------------------------------------------------------------
#
# This is the last feature the retired v1 add-on had that this app did not: a
# scheduled, checkpointed pull of artifacts matching malware families, tags and
# a PolyScore floor into a Splunk index. bin/input_intel_pull.py carries the
# v1 line cites and the two defect classes v1 shipped here.
#
# THE STANZA NAME IS THE SCRIPT'S FILE NAME, for the reason the poller's is:
# splunkd derives a modular input's kind from the script's own basename, so
# this is [input_intel_pull://...] because the script is
# bin/input_intel_pull.py. Renaming the file orphans this stanza and a
# customer's own with it.

# THE KIND STANZA, WHICH IS NOT THE SAME THING AS AN INPUT.
#
# python.version belongs here rather than on the instance, measured rather than
# preferred: splunk-appinspect's
# check_inputs_conf_spec_stanzas_has_python_version_property reads the property
# off the kind and FAILS an app that sets it only on an instance. A customer who
# adds a second stanza inherits the interpreter from here.
#
# python.required carries the list form for the reason the poller's block above
# gives in full: it supersedes python.version on Splunk 10.2 and later, and
# 3.9,3.13 spans the estate rather than pinning one interpreter. Set on the
# kind and the instance both. See D31.
[input_intel_pull]
python.version = python3
python.required = 3.9,3.13

[input_intel_pull://polyswarm_intel_pull]
python.required = 3.9,3.13

# DISABLED, AND THIS ONE IS NOT AN EXCEPTION TO DEFECT CLASS B8.
#
# The task poller above ships enabled and explains at length why that is
# defensible: it spends nothing on its own behalf, because with no detonations
# there are no task rows and with no rows it makes no request.
#
# This input is the opposite of that. Enabled on a fresh install with a key
# saved, it would begin pulling intel on a schedule nobody chose and bill every
# page of it, which is exactly the "cost-incurring feature defaulted on" that
# B8 names and that design section 7.2 found in our own connector work. There is
# no version of this input that costs nothing when idle: an idle window is
# still a query.
#
# So an operator turns it on deliberately, after choosing a window, a floor and
# a cap. Constraint C11's refuse-rather-than-proceed shape starts here, before
# the first request.
disabled = true

# How often splunkd runs the input, in seconds.
#
# Fifteen minutes. The number is chosen against what the feed is: threat intel
# arriving over hours, consumed by correlation searches and dashboards rather
# than watched live. A one minute interval would spend a request every minute
# to learn that nothing new matched a three-family filter, and the window
# arithmetic means a longer interval costs no artifacts: each run starts where
# the last one ended, so nothing is skipped by waiting.
interval = 900

# The index the artifacts are written to.
#
# `default` means the index splunkd resolves as this input's default, which is
# what a fresh install can honestly ship: the app cannot know a customer's
# index names and must not create one. An operator points this at their own
# threat intel index, which is the normal Splunk way and the reason this
# setting is here rather than hardcoded in bin/input_intel_pull.py.
index = default

# The sourcetype, declared here AND set on every event in code.
#
# Deliberate duplication with one purpose: default/props.conf keys its JSON
# extraction and its timestamp fields on this exact string. An operator who
# changed it here alone would keep indexing events and silently lose every
# field extraction and the CIM mapping on top of them, so the code sets it too
# and a test asserts the constant, this line and the props stanza all name the
# same string. That is defect class B5 closed rather than left open.
sourcetype = polyswarm:artifact

# Malware families to pull, comma separated. At most three are used, which is
# v1's own ceiling. Blank, together with a blank tags below, pulls the
# feed:premium tag, which is what v1 did when an operator filled in neither.
families =

# Tags to pull, comma separated, for example sector:healthcare,ransomware. At
# most three are used.
tags =

# The PolyScore floor. Only artifacts scoring at or above this are pulled.
#
# 0.7 is not an arbitrary default: it is the score at which polyswarmsearch
# already bands an artifact malicious, so the shipped floor pulls what the rest
# of the app calls malicious and nothing below it. v1 defaulted to 0.75, which
# sat between two of this app's own bands and matched nothing else in it.
min_polyscore = 0.7

# How far back the FIRST run reaches, in minutes. 1440 is one day, which is
# v1's own default in the unit this input uses.
#
# It applies only when there is no checkpoint. Every later run starts where the
# last one ended, so this is the size of the first window and not a rolling
# overlap: raising it does not make every run more expensive, it makes the
# first one cover more.
lookback_minutes = 1440

# Most events one run may write, and the cap that makes this input affordable.
#
# Bounded at 1000 in code, which an operator cannot raise from a form: see
# MAX_ARTIFACTS_HARD_CAP in bin/input_intel_pull.py. A run that reaches the cap
# stops, says so on its finish line, and leaves the rest of the window for the
# next run rather than dropping it. Constraint C11.
#
# The next run genuinely gets the REST. This endpoint answers newest first, so
# a capped run records the point it reached and the run after it continues from
# there, backwards through the window, until the backlog is drained. See the
# capped-run section of bin/input_intel_pull.py.
max_artifacts_per_run = 200

# How far behind the clock each window closes, in seconds.
#
# WHAT IT IS FOR. An artifact's `artifact.created`, the field the window
# filters on, is stamped when the platform takes the artifact. Scanning,
# normalising and indexing happen after that, so for a short period an artifact
# exists with a timestamp inside the window and is not yet findable by the
# metadata search. A window that closed at the clock would ask about that
# instant, get an answer that did not include those artifacts, and then start
# the next window where this one ended, which skips them for good. Nothing in
# the app could report it: the query answers 200 and the run looks clean.
#
# WHY 300. It is the longest delay this app already treats as normal for a
# platform-side operation that has not finished yet: the sandbox poller's
# per-row backoff runs 30, 60, 120 then 300 seconds and settles at 300. Using
# the same number keeps one claim in the app about how long the platform may
# take rather than two. Against the 900 second interval above it means an
# artifact is indexed between 5 and 20 minutes after the platform took it, which
# is well inside what a correlation search over threat intel needs, and it costs
# no artifacts at any value because the windows still chain.
#
# 0 is accepted and is the behaviour this input had before the buffer existed.
# Set it only if you have measured your own latency, because the failure it
# exposes is silent.
lag_seconds = 300

# The PolySwarm community to pull from.
#
# BLANK IS THE ANSWER FOR ALMOST EVERY DEPLOYMENT. It means the community rule
# in bin/community.py answers: the operator's setting on the setup page, then
# the account's most private entitled community, then the platform default. See
# decision D15. This setting exists for the deployment that pulls one
# community's intel into one index and another's into another, which the rule
# cannot express because it resolves one answer per account.
community =
