# Event types for the events this app writes.
#
# One event type, over the one sourcetype the polyswarm_intel_pull modular
# input produces. It exists so that default/tags.conf has something to hang a
# tag on: Splunk's data models match on tags, and a tag is applied to an event
# type rather than to a sourcetype directly.
#
# The search is the sourcetype and nothing else. No family filter, no score
# threshold, no verdict test: an event type that selected a subset would make
# the tag mean "a malicious PolySwarm artifact" rather than "a PolySwarm
# artifact", and the verdict is already a field an analyst can filter on. One
# event type per sourcetype is also what keeps this file from becoming a place
# where detection logic lives, which belongs in a customer's own correlation
# searches.

[polyswarm_artifact]
search = sourcetype="polyswarm:artifact"

# Shown wherever Splunk lists event types.
description = A PolySwarm threat intel artifact pulled by the PolySwarm App
