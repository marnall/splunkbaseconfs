# App configuration that is not a credential.
#
# ONE STANZA, ONE SETTING, AND A HARD RULE ABOUT WHAT MAY JOIN IT.
#
# Files under default/ and local/ are world readable on a search head and are
# copied wholesale into deployment bundles. So nothing secret is ever declared
# here, and the specification in README/polyswarm.conf.spec says the same thing
# in the place an operator reads first. The API key lives in encrypted
# credential storage under the realm bin/ps_client.py names, and
# tests/unit/test_conf_defaults.py fails this file on a credential-shaped
# setting name on sight.
#
# The setup page writes this file through splunkd's configs/conf-polyswarm
# endpoint, which puts the customer's value in local/polyswarm.conf and leaves
# this copy alone. app.conf's [triggers] carries reload.polyswarm = simple, so
# a change here does not need a restart.

[settings]

# The PolySwarm community every request is scoped to.
#
# BLANK IS NOT A MISSING VALUE. Blank means "work it out", and the app does,
# in three steps. bin/community.py holds the rule and docs/decisions.md D15
# holds the reasoning; in short:
#
#   1. A NON-BLANK VALUE HERE WINS OUTRIGHT and no request is made to check it.
#      An operator who typed a community name into the setup page is not asking
#      the app to audit the choice.
#   2. Blank, and the app reads the account's entitled communities from
#      /v3/public/accounts/whois and scopes the detonation to the most private
#      one, which means any entry that is not the public community. The answer
#      is cached in the ps_community_cache collection for an hour, so this
#      costs one request an hour rather than one per detonation.
#   3. Blank, and an account entitled to the public community only, and the app
#      sends the literal "default", exactly as the polyswarm-api SDK's
#      settings.DEFAULT_COMMUNITY does. The platform then resolves the
#      account's own community: the recorded sandbox task in
#      tests/fixtures/sandbox-submit-recorded.json came back on mainnet1, which
#      is the resolution rather than the request.
#
# WHERE THE VALUE IS SENT, PRECISELY. It scopes a detonation: the create and
# the finalize steps of a submit both carry it. It is NOT sent on the sandbox
# task status poll, and that is measured rather than overlooked: the recorded
# status call carried community "default" for a task that had run in mainnet1
# and the platform answered with the task, so a poll is a read by opaque task
# id and scoping it would add a whois call per input run to no effect. The task
# row records the community the detonation actually ran in either way.
#
# It is also not sent on enrichment or on the account endpoints, none of which
# takes a community parameter.
community =
