# KV store collections owned by the PolySwarm App.
#
# One collection, the verdict cache. It exists for a commercial reason as much
# as a technical one: this app meters per API call, so repeated enrichment of
# the same indicator has to cost zero quota or the app is too expensive to
# leave switched on. Design section 4.1 sets the default lifetime at 24 hours
# and section 4.8 depends on it, because the triage dashboard renders from this
# collection and would otherwise be a metered page view.
#
# The cache is an optimisation and never a correctness dependency. Every read
# and write goes through bin/verdict_cache.py, which degrades to a miss or a
# no-op if this collection is absent, unreadable, or splunkd is unreachable. A
# customer who deletes it gets slower, more expensive searches, not failing
# ones.

[ps_verdict_cache]

# One document per indicator, keyed by _key. The fields are declared so the KV
# store knows their types for the lookup definition that reads them and for any
# future accelerated field, not because the reader trusts them:
# bin/verdict_cache.py validates every field it reads and treats an unreadable
# document as a miss.
#
#   payload      the API response body, JSON encoded. A stored "null" is the
#                platform reporting nothing on this indicator, which is a real
#                cached answer and not an empty document. See the write-through
#                note in bin/verdict_cache.py.
#   stored_at    epoch seconds at which the document was written.
#   ttl_seconds  how long this document stays fresh. Held per document rather
#                than applied globally at read time, because a cached
#                not-found deliberately expires sooner than a cached answer
#                and that difference has to survive the write.
#   attribution  the tag-link response body, JSON encoded, for the same
#                artifact. Present only when an attribution request was
#                actually made, which is when a search ran with
#                attribution=true. THE FIELD BEING ABSENT AND HOLDING "null"
#                ARE DIFFERENT FACTS: absent means attribution was never asked
#                for and is still owed, "null" means it was asked for and the
#                platform holds none, which is a real cached answer that owes
#                no second request. bin/verdict_cache.py carries that
#                distinction as CacheEntry.attribution_fetched, and the note at
#                ATTRIBUTION_FIELD there explains why one document holds both
#                answers rather than two collections holding one each.
field.payload = string
field.stored_at = number
field.ttl_seconds = number
field.attribution = string

# enforceTypes is left off deliberately.
#
# With it on, splunkd rejects a document whose field types do not match the
# declarations above, and this app's failure mode for a rejected write is to
# degrade silently to a no-op with one log line. So a type mismatch would not
# raise an error a customer notices; it would quietly turn the cache off and
# every search would start paying full quota again. The reader is defensive
# about types on the way back out instead, which fails one document rather
# than the whole cache.
enforceTypes = false

# Not replicated to indexers.
#
# Two readers, and neither one needs a replicated copy. The search command
# reads a document at a time by id through splunkd on the search head, and the
# Overview dashboard reads the whole collection through the
# ps_verdict_cache_lookup definition in default/transforms.conf, which also
# runs on the search head because | inputlookup is a generating command.
#
# Replication exists for a lookup that has to be resolved on the indexers as
# part of a distributed search, and turning it on would push a copy of the
# cache to every indexer on a bundle cycle to serve a search that never asks
# them for it. If a later panel or props stanza does need indexer-side
# resolution, this is the setting to revisit, and it is a bundle-size decision
# rather than a correctness one.
replicate = false

# ---------------------------------------------------------------------------
# The usage and entitlement surface. Design section 4.6, and Phase 1 per
# commercial goal 2.
# ---------------------------------------------------------------------------
#
# Two collections, and they are separate on purpose rather than one collection
# with two kinds of document in it. The cache is read whole by a dashboard
# panel through the ps_usage_cache_lookup definition in default/transforms.conf,
# and | inputlookup returns every document in the collection it is pointed at.
# A throttle timestamp living in the same collection would arrive in the panel
# as a row with no feature and no quota on it, and the panel would have to
# filter out a document it should never have been shown.

[ps_usage_cache]

# One document per row | polyswarmusage last emitted successfully. The command
# writes them through with deterministic ids, so a feature still present on the
# next refresh overwrites its own document rather than adding a second one.
#
#   row_type      account, feature, or throttled. Which shape this row is.
#   fetched_at    epoch seconds at which the answer was obtained. Every row
#                 carries it, which is what lets the Overview panel say "as of"
#                 without a second lookup, and what lets it show only the
#                 newest generation of rows.
#   message       the throttle notice, on a throttled row only.
#
# On a feature row, from the accounts response's features block:
#
#   feature       the entitlement feature's display name, the API's "name".
#   tag           the platform's stable machine identifier for the feature, for
#                 example sandbox_download. The field to match on in SPL, since
#                 a display name is free to be reworded.
#   feature_type  the API's "type", renamed on the way out because a column
#                 named type beside row_type is one an analyst misreads.
#   base_uses     what the plan includes.
#   remaining_uses what is left.
#   overage       what has been used beyond the plan.
#
# On the account row, the first three from the whois response and the rest from
# the top level of the accounts response:
#
#   account_type  the account's type.
#   tenant        the account's tenant.
#   communities   the account's entitled communities, joined into one string.
#   account_plan_name  the plan the account is on, as the platform names it.
#   is_trial      "true" or "false". A string and not a boolean, because these
#                 are SPL field values and Python's "True" is not one.
#   daily_api_limit      today's entitlement.
#   daily_api_remaining  what is left of it. NOT ALWAYS A COUNT: a limit of 0
#                 with a remaining of -1 is what an unmetered plan looks like,
#                 so the Overview panel's used-today arithmetic guards on the
#                 sign rather than subtracting blind.
#   plan_period_end  when the current plan period ends, absent when there is
#                 no period end. Absent is the ordinary reading of a healthy
#                 response here and not a sign of a shape change.
#
# The account number is deliberately not among these. See the note in
# bin/cmd_usage.py: it identifies the customer rather than describing their
# entitlement, and a field that is not read cannot leak.
#
# Declared so the KV store knows the types for the lookup definition that reads
# them, not because the reader trusts them: bin/cmd_usage.py validates every
# field it reads out of an API response and omits anything unreadable.
field.row_type = string
field.fetched_at = number
field.message = string
field.feature = string
field.tag = string
field.feature_type = string
field.base_uses = number
field.remaining_uses = number
field.overage = number
field.account_type = string
field.tenant = string
field.communities = string
field.account_plan_name = string
field.is_trial = string
field.daily_api_limit = number
field.daily_api_remaining = number
field.plan_period_end = string

# Off for the same reason it is off on the verdict cache: this app's failure
# mode for a rejected write is a silent no-op with one log line, so a type
# mismatch would quietly stop the Entitlement panel updating rather than
# raising anything a customer notices. The reader is defensive instead.
enforceTypes = false

# Not replicated to indexers. One reader, the Overview panel, and | inputlookup
# is a generating command that resolves on the search head.
replicate = false

[ps_usage_throttle]

# One document, id "usage", holding the last time | polyswarmusage called the
# account endpoints. It exists so that a dashboard refresh cannot call them in
# a loop; see bin/usage_store.py for why the window is consumed before the call
# rather than after it, and why a broken KV store fails the throttle open.
#
#   last_run_at   epoch seconds of the last attempt, successful or not.
field.last_run_at = number

enforceTypes = false

# Not replicated. The throttle is read and written by the command on the search
# head and by nothing else. Note that in a search head cluster the KV store is
# shared between members, so the window is per cluster rather than per member:
# that is stronger than the one-per-search-head rule this is written against,
# and stronger is the safe direction for a guard on somebody else's endpoint.
replicate = false

# ---------------------------------------------------------------------------
# The sandbox detonation surface. Design section 4.3, Phase 2.
# ---------------------------------------------------------------------------
#
# Two collections, separate for the same reason the usage pair is separate: a
# lookup definition returns every document in the collection it is pointed at,
# so a cached providers blob living beside the task rows would arrive in the
# tasks tray as a row with no task on it.
#
# THESE TWO ARE NOT THE SAME KIND OF THING, and the difference is the reason
# bin/task_store.py opens with a paragraph about it. Every other collection in
# this file is an optimisation: delete it and searches get slower and more
# expensive. ps_sandbox_tasks is a record of purchase. The platform's own
# listing endpoint for an account's tasks, /v3/sandbox/sandboxtask/my-tasks,
# HANGS, which design section 0 item 5 records as an open platform bug, so a
# task row that is lost is a metered detonation that nothing in this app can
# ever find again. A customer who deletes this collection does not get slower
# searches; they lose the tray and the poller's worklist.

[ps_sandbox_tasks]

# One document per detonation, keyed by _key as task_<task id>. The id is the
# platform's own task id rather than a digest of it, unlike the verdict cache's
# key: a task id is a short opaque handle that the poller has in hand when it
# needs the row, where a cache key is an unbounded indicator that can carry a
# customer's query string. bin/task_store.py validates it against a character
# set before building a document id from it.
#
#   task_id       the platform's task id. Also in the document id, and carried
#                 as a field because a lookup projects fields and not keys.
#   target        the URL that was detonated. The customer's own data, in the
#                 customer's own KV store: it is what the tray shows and what
#                 makes a row mean anything. It never reaches a log line,
#                 because bin/ps_log.py has no key it could travel under.
#   provider      the sandbox provider slug, as the platform resolved it.
#   vm            the VM image slug, as the platform resolved it.
#   community     the community the detonation ran in, AS RESOLVED. The app
#                 sends "default", exactly as the polyswarm-api SDK does, and
#                 the platform answers with the real one: "mainnet1" in the
#                 recording. So this field is where a detonation actually went
#                 rather than what was asked for. See docs/decisions.md D12 for
#                 what that does and does not satisfy in design 4.3.
#   status        THE PLATFORM'S STATUS STRING, VERBATIM: PENDING, STARTED,
#                 SUCCEEDED, KNOWN_GOOD. Not this app's reading of it. The
#                 reading is applied fresh at read time by
#                 task_store.map_status(), which is decision D6's doctrine in a
#                 second place: store the platform's answer so that a mapping
#                 change does not leave a day of rows carrying the last
#                 release's interpretation.
#   submitted_at  epoch seconds the submission was made.
#   updated_at    epoch seconds the row was last written. Equal to
#                 submitted_at on a fresh row; the poller moves it.
#   sha256        the artifact digest, once the platform has hashed the
#                 uploaded content. ABSENT AT SUBMIT TIME, which is the
#                 ordinary case and not a fault: the recorded create and
#                 finalize responses both carry sha256 null.
#   report_url    the artifact's page in the portal, derived from the digest.
#                 Absent until there is one. The host and path prefix are
#                 derived from a recorded permalink per decision D8; the
#                 resulting two-segment form is NOT VERIFIED against the live
#                 portal, which is the same outstanding C10 item D8 records.
#
# Both timestamps are epoch seconds and neither is the platform's own "created"
# ISO string, because a tray sorts and ages these rows and every other
# timestamp this app stores is epoch seconds.
#
# The findings, written by the poller from the final sandbox report, and the
# two fields that are the poller's own checkpoint:
#
#   analysis_score  the report's analysis score, report.analysis.score. Not the
#                   static score beside it and not config.traige_analysis_score,
#                   whose misspelling is the platform's: the report is the
#                   answer and the config block is the request. See the note at
#                   RESPONSE_REPORT_FIELD in bin/task_store.py.
#   tags            the report's analysis tags, comma joined.
#   malware_family  the report's attributed families, comma joined. ABSENT IS
#                   THE ORDINARY CASE: the recorded detonation of a benign URL
#                   returns an empty list, and an empty list writes no field
#                   rather than an empty one.
#   c2_ip_count     how many command-and-control addresses the report
#                   extracted. ZERO IS A REAL ANSWER here, unlike an absent
#                   field: the report asserting it found none is a finding, and
#                   the app having nothing to say is not.
#   c2_ips          those addresses, comma joined. Absent when the count is
#                   zero, because there are no names to list.
#   process_count   how many processes the report recorded.
#   poll_attempts   how many status requests this row has cost. The index into
#                   the poller's backoff schedule.
#   next_poll_at    epoch seconds before which the poller leaves this row
#                   alone. ABSENT MEANS DUE NOW, which is why the detonate
#                   command writes neither field: a fresh detonation is polled
#                   on the next run.
#   poll_abandoned_at
#                   epoch seconds the poller gave up on this row, and absent on
#                   every row it has not given up on. The poller stops asking
#                   about a task the platform has expired, cannot find three
#                   polls in a row, or that is older than the stanza's
#                   max_task_age_hours, because the backoff floor of five
#                   minutes bounds what such a row costs per hour and bounds
#                   nothing about what it costs in total.
#
#                   THE STATUS FIELD IS UNTOUCHED WHEN THIS IS SET, which is
#                   the same doctrine as the status field's own note: the app
#                   does not write a status word of its own, so the row keeps
#                   the platform's last word and this field carries the app's
#                   decision to stop asking. The row is kept rather than
#                   deleted because it is the receipt for a metered detonation
#                   and the platform's own task listing hangs.
#   poll_not_found  how many CONSECUTIVE polls of this row came back with no
#                   payload, which is a 404 for a task id the platform does not
#                   know or a status read that keeps failing. A poll that does
#                   answer resets it to zero. Three in a row abandons the row.
#
# THE COMMA IS A DELIMITER AND NOT TYPOGRAPHY on the two joined lists. The
# tray's findings strip reads them back with split(), so a ", " separator would
# put a leading space on every family after the first. See LIST_SEPARATOR in
# bin/task_store.py.
#
# THE LAST FOUR OF THOSE FIELDS ARE THE INPUT'S OWN STATE, and there is no
# checkpoint document beside this collection. Constraint C7 asks a modular input to keep a
# checkpoint and be safe to run twice; here the state worth remembering is per
# row rather than per run, and it is written by the same call that records the
# answer. A separate checkpoint would be a second source of truth about these
# rows, and the failure it introduces is a checkpoint claiming a task is up to
# date while its row sits unpolled forever, with no reconciling read available
# because my-tasks hangs. bin/input_task_poller.py carries that in full.
field.task_id = string
field.target = string
field.provider = string
field.vm = string
field.community = string
field.status = string
field.submitted_at = number
field.updated_at = number
field.sha256 = string
field.report_url = string
field.analysis_score = number
field.tags = string
field.malware_family = string
field.c2_ip_count = number
field.c2_ips = string
field.process_count = number
field.poll_attempts = number
field.next_poll_at = number
field.poll_abandoned_at = number
field.poll_not_found = number

# WHERE THE DETONATION WAS ASKED FOR, written only by the PolySwarm Detonate
# alert action and absent on every detonation somebody ran from a search bar.
# All six are strings because every one of them is an identifier some other
# piece of Splunk minted: a search id, a result id, a notable id and a
# correlation rule id are opaque handles rather than numbers to do arithmetic
# on.
#
#   source_sid       the search job that fired the action.
#   source_rid       the result within that job the detonation came from.
#   source_orig_sid  the search that produced that result, when it was itself
#                    produced by an earlier action.
#   source_orig_rid  the result within that earlier search.
#   notable_event_id the Enterprise Security notable the detonation was started
#                    from.
#   notable_rule_id  the correlation rule that raised that notable.
#
# THEY ARE DECLARED AND PROJECTED AND THEY ARE NOT TRAY COLUMNS, which is the
# same split the two checkpoint fields above sit on. The lookup definition
# returns them so that "which notable spent this detonation" is answerable with
# | inputlookup, and the Sandbox Tasks table leaves them off, because they are
# empty on every detonation that did not come from Enterprise Security and six
# empty columns beside the findings is a worse triage table. See docs/using.md
# section 14 for the search, and docs/decisions.md D20 for the ruling.
field.source_sid = string
field.source_rid = string
field.source_orig_sid = string
field.source_orig_rid = string
field.notable_event_id = string
field.notable_rule_id = string

# Off for the same reason it is off on every other collection here: this app's
# failure mode for a rejected write is a no-op with one log line, so a type
# mismatch would quietly stop task rows landing. On this collection that would
# be worse than elsewhere, which is why the command also reports a failed write
# as a warning to the analyst rather than only to the log.
enforceTypes = false

# Not replicated to indexers. Two readers, and neither needs a replicated copy:
# the poller reads a document at a time by id through splunkd on the search
# head, and a tray reads the whole collection through the
# ps_sandbox_tasks_lookup definition in default/transforms.conf, which also
# runs on the search head because | inputlookup is a generating command.
replicate = false

[ps_sandbox_providers]

# One document, id "providers", holding the last providers and VMs list the app
# fetched. It exists so that validating a provider and a VM costs nothing per
# detonation: without it, every detonation would carry a providers request in
# front of it. Lifetime is 24 hours, matching the verdict cache's default,
# because the answer is a list of sandbox images and it changes on a release
# cadence rather than an hourly one.
#
#   payload      the providers response body, JSON encoded.
#   stored_at    epoch seconds at which the document was written.
#   ttl_seconds  how long this document stays fresh, held per document for the
#                same reason the verdict cache holds it per document.
#
# Unlike the task collection, this one IS purely an optimisation: a miss, an
# absent collection and an unreadable document all cost exactly one live
# providers call. What is never cached here is a failure. A cached
# "the platform told us nothing" would refuse every detonation for 24 hours on
# the strength of one bad request, which is the opposite of the verdict cache's
# write-through rule and the difference is that a cached not-found there saves
# a request where one here would withhold a capability.
field.payload = string
field.stored_at = number
field.ttl_seconds = number

enforceTypes = false

# Not replicated. Read and written by the detonate command on the search head
# and by nothing else. Note that in a search head cluster the KV store is
# shared between members, so the 24 hour window is per cluster rather than per
# member, which is the direction that makes fewer requests.
replicate = false

# ---------------------------------------------------------------------------
# The community rule's cache. Design section 4.3, and docs/decisions.md D15.
# ---------------------------------------------------------------------------
#
# One document, id "whois", holding the last account identity response the app
# fetched. It exists so that resolving which community a detonation is scoped
# to does not cost a request per detonation: without it, every detonation would
# carry a whois call in front of it, which is the defect the providers cache
# above exists to prevent one step further along the same path.
#
#   payload      the whois response body, JSON encoded. A stored "null" is the
#                platform reporting nothing, which is a real cached answer:
#                unlike the providers cache, a cached nothing here costs the
#                customer nothing, because it means the app sends the platform
#                default for an hour, which is what it does anyway for an
#                account entitled to the public community only.
#   stored_at    epoch seconds at which the document was written.
#   ttl_seconds  how long this document stays fresh, held per document for the
#                same reason every other cache in this file holds it there.
#
# ONE HOUR, NOT TWENTY FOUR, and the difference from the providers cache beside
# it is what the two answers are. A provider list is a set of sandbox images
# that changes on a release cadence. An account's community membership changes
# when somebody at PolySwarm adds a team to it, which is a support conversation
# happening while the customer waits for their new private community to work.
#
# WHAT IS NEVER CACHED HERE IS A FAILURE. bin/community.py falls back to the
# platform default without storing anything when the whois call fails, so a
# brief outage does not pin the fallback in place for an hour. That is the same
# rule the providers cache follows for a different reason: there a cached
# failure would withhold a capability, here it would withhold a preference.
#
# No lookup definition points at this collection, because no panel reads it.

[ps_community_cache]

field.payload = string
field.stored_at = number
field.ttl_seconds = number

enforceTypes = false

# Not replicated. Read and written on the search head by the detonate command
# and the detonate alert action, and by nothing else. In a search head cluster
# the KV store is shared between members, so the hour is per cluster rather
# than per member, which is the direction that makes fewer requests.
replicate = false

# ---------------------------------------------------------------------------
# The scheduled intel pull's checkpoint. Design section 4.2, and constraint C7.
# ---------------------------------------------------------------------------
#
# One document per input stanza, keyed by _key as stanza_<digest of the stanza
# name>. The id is a digest for the reason the verdict cache's is: an input
# stanza name is the operator's own free text and can carry a colon, a slash or
# a space, none of which belong in a document id, and validating a charset
# would refuse a stanza splunkd itself accepted.
#
# THIS IS THE THIRD KIND OF THING IN THIS FILE, and it is worth naming because
# the other two set expectations it does not meet. Most collections here are
# optimisations: delete one and searches get slower and more expensive.
# ps_sandbox_tasks is a record of purchase: lose a row and a paid detonation is
# unfindable. This one is a POSITION. Delete it and nothing is lost and nothing
# is unfindable; the next run falls back to lookback_minutes and re-pulls at
# most one lookback's worth of artifacts the index already has. So the cost of
# losing it is bounded duplication, which is the direction bin/intel_checkpoint.py
# chooses on every failure path for the same reason: a duplicate event is
# recoverable and a skipped window is not.
#
#   stanza       the input stanza name, as splunkd names it. Also in the
#                document id as a digest, and carried as a field because a
#                digest cannot be read back and an operator looking at this
#                collection needs to know which input a row belongs to.
#   window_end   epoch seconds of the last window that COMPLETED. The next run
#                starts here. Written only after a run that covered its whole
#                window: a run that failed part way leaves this alone so the
#                window is pulled again.
#   backlog_end  epoch seconds the NEXT window must close at, or 0 when there
#                is nothing to drain. Written by a run that stopped at its own
#                cap: this endpoint answers newest first, so a capped run
#                covered the newest part of its window and this is the oldest
#                artifact it emitted. Without it a capped run made no forward
#                progress at all and re-emitted the same artifacts every
#                interval.
#   backlog_target
#                epoch seconds window_end becomes once that drain finishes, or
#                0. It is a second field rather than a recomputation because
#                the artifacts between the boundary and the original window end
#                were already emitted and their digests are one run deep, so a
#                drain that forgot the target would re-cover and re-emit them.
#   digests      the sha256 of every artifact that window emitted, comma
#                joined and lowercased. It exists because the query mirrors
#                v1's range syntax and Lucene's square brackets are INCLUSIVE
#                AT BOTH ENDS, so an artifact created at exactly window_end
#                falls inside both that window and the next one. This list is
#                what refuses it. Bounded by the input's own hard cap of 1000
#                artifacts per run, so about 65KB at worst and about 13KB at
#                the shipped cap of 200.
#   artifacts    how many events that window wrote. Not used by the input; it
#                is what makes a row readable to an operator and what the
#                polyswarmsync summary compares against.
#   updated_at   epoch seconds the row was last written.
#
# THE COMMA IS A DELIMITER AND NOT TYPOGRAPHY on the digest list, for the same
# reason task_store's joined lists carry the same note: the value is read back
# with split(), so a ", " separator would put a leading space on every digest
# after the first and none of them would then match a digest computed fresh.
#
# No lookup definition points at this collection, because no panel reads it.
# The polyswarmsync command reports the window it is about to cover, which is
# the operator-facing view of this document.

[ps_intel_pull_checkpoint]

field.stanza = string
field.window_end = number
field.digests = string
field.backlog_end = number
field.backlog_target = number
field.artifacts = number
field.updated_at = number

# Off for the same reason it is off on every other collection here: this app's
# failure mode for a rejected write is a no-op with one log line, so a type
# mismatch would quietly stop the checkpoint advancing. The consequence on this
# collection is duplicate events rather than lost ones, which is why the reader
# is defensive about every field on the way back out instead.
enforceTypes = false

# Not replicated to indexers. One reader and one writer, both the modular input
# running on the search head, reading a document at a time by id through
# splunkd. In a search head cluster the KV store is shared between members, so
# the checkpoint is per cluster rather than per member, which is the direction
# that emits fewer duplicates.
replicate = false
