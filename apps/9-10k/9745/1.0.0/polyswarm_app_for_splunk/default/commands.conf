# Custom search commands.
#
# Both commands use the chunked (v2) protocol. The v1 protocol is deprecated,
# buffers the whole result set, and has no way to report a warning back to the
# job, which polyswarmsearch needs when it hits its limit.
#
# filename is checked against bin/ by tests/unit/test_conf_defaults.py. Splunk
# does not validate it at install time, so a typo here produces a command that
# appears in the search assistant and fails only when a user runs it.

# EVERY STANZA CARRIES BOTH INTERPRETER SETTINGS, AND THE LIST IS WHY THAT IS
# NOT A PIN. python.required supersedes python.version on Splunk 10.2 and
# later, and it takes a comma separated list: the platform selects the highest
# entry it can actually provide, so 3.9,3.13 gets 3.13 on a release that ships
# it and 3.9 on one that does not. Splunk 9.x does not read the setting at all,
# which leaves python.version as the interpreter selector there. That is the
# correction D31 records to D5, which read the setting as pinning one version.

# Local IOC extraction. No network, no API key, no quota.
[polyswarmextract]
filename = cmd_extract.py
python.version = python3
python.required = 3.9,3.13
chunked = true

# API enrichment. Spends one request per distinct hash, which is why the limit
# option is required and why this command is not readable by the user role.
# See metadata/default.meta.
[polyswarmsearch]
filename = cmd_search.py
python.version = python3
python.required = 3.9,3.13
chunked = true

# Account identity and per feature entitlement, design section 4.6 and
# commercial goal 2's Phase 1 mechanism. A generating command: it takes no
# input events and emits a fixed, small set of rows.
#
# Two API requests per invocation, to the account endpoints. Neither submits,
# scans, nor detonates anything, so neither consumes the scan or detonation
# allowance a customer buys. That is why there is no limit option here and why
# polyswarmsearch has one: there is no per-event metered path to cap, because
# there are no input events.
#
# It is not the same as free, and the command carries its own guard. It refuses
# to call out more than once a minute per search head, through a KV backed
# timestamp, so that a dashboard panel with a refresh interval on it cannot
# call the endpoints in a loop. See bin/usage_store.py and bin/cmd_usage.py.
[polyswarmusage]
filename = cmd_usage.py
python.version = python3
python.required = 3.9,3.13
chunked = true

# URL detonation. Design section 4.3, and the quota-heaviest command in the
# app: one invocation books a virtual machine and runs a browser in it.
#
# A generating command, and ONE DETONATION PER INVOCATION BY DESIGN. There is
# no limit option because the cap is structural rather than a parameter: no
# input events to fan out over and no way to raise the ceiling from the search
# bar. The browser and mobile apps do allow a batch, up to twenty, behind a
# per-item confirmation; a search command has nowhere to put a confirmation, so
# the only honest cap is one. Constraint C11, and bin/cmd_detonate.py carries
# the argument in full.
#
# Three HTTP requests per detonation, not one: create, upload to a presigned
# location, finalize. None of them is retried. See ps_client.sandbox_submit_url.
#
# Withheld from the user role in metadata/default.meta, which is the gate that
# matters most in this file.
[polyswarmdetonate]
filename = cmd_detonate.py
python.version = python3
python.required = 3.9,3.13
chunked = true

# Manual intel sync. Design section 4.2's quality-of-life feature 2.
#
# A generating command, and a PREVIEW ONLY. It runs one cycle of the
# polyswarm_intel_pull modular input for a named stanza and returns the run
# summary: the window, the artifact count, the pages and requests spent, and
# whether the cap was reached. It does NOT write to an index and it does NOT
# advance the input's checkpoint, because a search command's output is search
# results: advancing the checkpoint for a window whose artifacts were never
# indexed would leave a permanent, silent gap. bin/cmd_sync.py carries that
# argument in full.
#
# It spends exactly what one scheduled run spends: one request per page, up to
# the stanza's own max_artifacts_per_run. That is why it is withheld from the
# user role in metadata/default.meta, which is constraint C3 applied to a
# command that spends quota.
#
# The parameters come from the stanza, not from the search bar, so that what
# the command verifies is what the schedule will actually do. There is no
# families, floor or cap option for the same reason there is no second cap.
[polyswarmsync]
filename = cmd_sync.py
python.version = python3
python.required = 3.9,3.13
chunked = true
