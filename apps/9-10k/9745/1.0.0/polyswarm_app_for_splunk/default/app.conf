[install]
state = enabled
state_change_requires_restart = false

# Ships false, and stays false in this file forever.
#
# false is what makes Splunk offer the "Set up" affordance that routes to the
# view named by [ui] setup_view below. An app that shipped as already
# configured would load with no credential and fail every search with an
# authentication error instead of prompting for a key, which is design
# constraint C8's failure mode with the prompt removed.
#
# WHERE THE RUNTIME FLIP LIVES. When a customer saves a key, the setup page
# POSTs configured=1 to /services/apps/local/polyswarm_app_for_splunk, and
# splunkd writes the flip into local/app.conf as
#
#     [install]
#     is_configured = 1
#
# never into this file. That layering is what makes an app upgrade safe in both
# directions: the shipped default stays false so a fresh install still prompts,
# and the customer's local copy wins so an upgrade does not send a configured
# instance back to the setup page. It is also why local/ is excluded from the
# package (see the Makefile) and why tests/unit/test_conf_defaults.py asserts
# the value here rather than reading it from wherever it happens to be set.
is_configured = false
build = 1

[launcher]

# The splunk.com username of the account that submits the app, which is what
# the app.conf reference asks for here: "For apps that you intend to upload to
# Splunkbase, list the username of your splunk.com account". Not a company
# name, which is what this setting carried before. The value is the account the
# developer license on the test instance is issued to.
author = erick.ingleby@polyswarm.io
version = 1.0.0

# Names the supported Splunk products, because the label no longer can.
#
# Splunk's naming conventions for Splunkbase say a third-party app name must
# not end with a Splunk product name, and that the supported products belong in
# the description instead. So this is the one place a reader learns which
# products the app runs on. Under 200 characters, which is what the listing
# shows without truncating.
description = PolySwarm malware threat intelligence for use with Splunk Enterprise and Splunk Cloud Platform: enrich hashes, URLs and domains with crowd-sourced verdicts, attribution and sandbox detonation.

[ui]
is_visible = true

# The display name, and it deliberately does not say "Splunk".
#
# Splunk's published naming conventions for apps and add-ons in Splunkbase
# require that a third-party app name not end with a Splunk product name; the
# example they give is to name an app "My App" rather than "My App for Splunk",
# and to state the supported products in the description, which [launcher]
# description above does. The Splunkbase listing's display name has to match
# this label exactly, so this is the single source for the app's name and
# tests/unit/test_conf_defaults.py holds it to the rule.
#
# The app id, the package directory, the log file name and the three dashboard
# titles are all unchanged. Only the human readable name moved.
label = PolySwarm App

# Where the "Set up" affordance goes.
#
# Names the view default/data/ui/views/setup.xml, so the setup link on the app
# list, the post-install prompt, and the banner an unconfigured app shows all
# land on the page that can save a key. Without this setting the affordance is
# absent, and a customer's only route to storing a credential is the REST API,
# which is the gap this app shipped with and which nobody outside engineering
# can act on.
#
# NOT default/setup.xml, which is the pre-8.0 mechanism and is refused by Cloud
# vetting. This is a pointer to an ordinary view. See docs/decisions.md D14.
setup_view = setup

[package]
id = polyswarm_app_for_splunk
check_for_updates = true

[id]
name = polyswarm_app_for_splunk
version = 1.0.0

# Reload triggers.
#
# Required rather than optional: AppInspect fails an app that ships a custom
# conf with no [triggers] stanza, and it is right to. Without an entry here,
# splunkd has no instruction for what to do when the file changes, so the
# safe default it falls back to is "the admin restarts Splunk". Asking a
# customer to restart a production search head to change a log level is not a
# reasonable thing to ship.
#
# simple means reload the conf in place. It is correct for every entry below
# because nothing here is read once at startup: ps_log reads the logging
# configuration when a command starts, ps_client reads the credential when it
# builds a client, and both happen per search.
#
# reload.storage covers storage/passwords, which metadata/default.meta
# permissions and which holds the API key. Written at the endpoint level
# rather than as reload.storage.passwords deliberately: the narrower spelling
# carries a credential-shaped word in a setting name, and
# tests/unit/test_conf_defaults.py refuses those in a .conf file on sight. The
# broader trigger covers the same endpoint without arguing with that rule.
#
# reload.workflow-actions is here because AppInspect asked for it by name.
# check_reload_trigger_for_meta reports one warning per [workflow-actions*]
# stanza in metadata/default.meta without it, and the remedy it names is this
# exact setting rather than something inferred. Measured before and after: with
# the line, those three warnings are gone and no other check changes verdict.
#
# THERE IS DELIBERATELY NO ENTRY FOR props, eventtypes OR tags, and the intel
# pull input is what settled that. Those three arrived with it, and the obvious
# move was to add them here alongside the rest: they are conf files this app
# ships, and the comment above says a shipped conf needs a trigger.
#
# It does not apply to them, and AppInspect says so from both directions.
# check_reload_trigger_for_all_custom_confs is about CUSTOM conf files, which
# is why polyswarm.conf is listed; props.conf, eventtypes.conf and tags.conf are
# Splunk-defined, and splunkd already reloads them without being told to. Adding
# them measured worse rather than better: with the three lines in place,
# check_for_trigger_stanza reported one message per file saying a Splunk-defined
# conf should not be configured here, and check_reload_trigger_for_all_custom_confs
# passed either way. So the lines are not an improvement that AppInspect happens
# to dislike; they are configuration with no effect and one warning.
#
# reload.collections used to sit here as a deliberate exception, on the reading
# that the message it drew was a warning worth paying for. Measured again on
# 2026-09-09 with splunk-appinspect 4.3.1 in precert mode, the check reports it
# as a FAILURE, not a warning, and a failure blocks a Splunkbase submission. The
# line also bought nothing: collections.conf is Splunk-defined, splunkd reloads
# it on its own terms, and the collections this app ships are defined once at
# install and never edited at runtime; the KV store DATA needs no conf reload at
# all. So it is gone, and a test asserts the absence for the same reason the
# three above are asserted.
[triggers]
reload.logging = simple
reload.polyswarm = simple
reload.storage = simple
reload.workflow-actions = simple
