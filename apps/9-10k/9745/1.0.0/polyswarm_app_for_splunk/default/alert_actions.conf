# Alert actions shipped by the PolySwarm App.
#
# One action, PolySwarm Detonate. Design section 4.3 asks for an alert action
# and an ES adaptive response action that fire "from correlation searches or
# manually from a notable"; this is that one action, declared as both. The
# alert action is the mechanism and param._cam below is the declaration that
# makes Enterprise Security offer the same mechanism as an adaptive response.
#
# THE STANZA NAME IS THREE THINGS AT ONCE, so it cannot be changed in one
# place: it is the action name a saved search references as
# action.polyswarm_detonate, the base name of the configuration form Splunk
# resolves at default/data/ui/alerts/polyswarm_detonate.html, and the name
# ACTION_NAME in bin/action_detonate.py reports itself as.

[polyswarm_detonate]

# What an operator sees in the alert dialog's action list, and what they read
# before deciding. The description says what it spends, because this is the
# most expensive thing the app can be told to do on a schedule.
label = PolySwarm Detonate
description = Submit a URL from the search results to PolySwarm sandbox detonation, and record each task in the app's task table for the Sandbox Tasks dashboard. Metered: an Enterprise plan includes 30 detonations a month, so this action detonates one row per firing by default and never more than five.

# A custom (modular) alert action rather than a legacy alert script, and the
# JSON payload form rather than a per-result invocation.
#
# payload_format = json is what makes splunkd hand the script one object on
# standard input carrying the session, the configuration and the path to the
# gzipped results file, which is the contract bin/action_detonate.py parses and
# documents. The alternative, one invocation per result, would put the cap in
# splunkd's hands rather than in the app's, and constraint C11 says the cap is
# the app's to declare and enforce.
is_custom = 1
payload_format = json

# The script, and the argument it insists on.
#
# alert.execute.cmd is required because the file is action_detonate.py rather
# than polyswarm_detonate.py: without it, splunkd looks for a script named
# after the stanza. The name follows design section 6's architecture, which
# names the file action_detonate.py, so the pointer is explicit here instead.
#
# --execute is passed by splunkd and is also declared here, so the argument is
# present however the action is invoked. The script refuses to do anything
# without it, deliberately: a detonation is not a thing to spend because
# somebody ran a file by hand to see what it did.
alert.execute.cmd = action_detonate.py
alert.execute.cmd.arg.0 = --execute

# Splunk 9 and 10 ship Python 3, and this app has no py2 shims: design section
# 6 sets the floor at 3.9.
#
# python.required supersedes python.version on Splunk 10.2 and later and takes
# a comma separated list, so 3.9,3.13 asks for 3.13 where the release provides
# it and falls back to 3.9 where it does not. That spans the estate instead of
# pinning it, which is what D5 read the setting as doing. Splunk 9.x does not
# read the setting, so python.version is what selects the interpreter there.
# See D31.
python.version = python3
python.required = 3.9,3.13

# ---------------------------------------------------------------------------
# Parameters. These are the defaults the form starts from, and they are the
# cheapest values that work.
# ---------------------------------------------------------------------------
#
# THE DEFAULTS ARE THE C11 POSTURE, not a convenience. Defect class B8 says a
# cost-incurring feature ships opt-in: the opt-in for this action is attaching
# it to a saved search, and no correlation search in this package does. What
# the defaults have to guarantee is that the first firing of a newly attached
# action is as small as it can be while still doing something.

# The result field to take the URL from.
#
# url rather than a CIM field name on purpose. The CIM's Web dataset carries
# the target as url, which is why this is the default, and Network Resolution
# and Email carry it under other names, so an operator pointing this at their
# own search sets the field rather than reshaping their search. The value is
# validated per row by the same rule polyswarmdetonate applies: an http or
# https scheme is required, and a row without one is skipped rather than
# guessed at.
param.field = url

# How many rows one firing may detonate.
#
# ONE, and the hard ceiling is five, in bin/action_detonate.py at
# MAX_DETONATIONS_HARD_CAP, where a configured value above it is clamped rather
# than honoured. Five because an Enterprise plan includes 30 detonations a
# month: an hourly alert detonating five at a time would spend a month's
# allowance before lunch, and no number typed into the form can do worse than
# that. Rows above the cap are left undetonated and reported in the alert's
# own status, which is C11's refuse-rather-than-proceed shape.
param.max_detonations = 1

# ---------------------------------------------------------------------------
# The adaptive response declaration.
# ---------------------------------------------------------------------------
#
# NOT A PARAMETER AN OPERATOR SETS. Every other param on this stanza is a
# value the configuration form collects; this one is metadata that Enterprise
# Security reads about the action, and the form neither shows it nor writes it.
#
# WHAT IT BUYS. An alert action with no _cam is an ordinary alert action: it
# can be attached to a saved search, and that is all. With this declaration
# Enterprise Security's adaptive response framework knows the action exists,
# what it does and that it may be invoked on demand, which is what puts it in a
# notable's action menu as well as in the correlation search editor.
#
# WHERE THE CONTRACT IS WRITTEN DOWN, AND WHY EVERY VALUE BELOW IS QUOTED FROM
# IT RATHER THAN CHOSEN. The common action model is Splunk's, not ours, and the
# recommended values live in three lookups shipped inside Splunk_SA_CIM. The
# sources read for this stanza:
#
#   Use the common action model to build custom alert actions
#     https://help.splunk.com/en/splunk-enterprise/common-information-model/6.3/using-the-common-information-model/use-the-common-action-model-to-build-custom-alert-actions
#   The specification itself, Splunk_SA_CIM/README/alert_actions.conf.spec,
#   Appendix A, "Common Action Model Specification", as shipped by Splunk at
#     https://github.com/splunk/pytest-splunk-addon/blob/main/deps/apps/Splunk_SA_CIM/README/alert_actions.conf.spec
#   The recommended value lists, from the same package:
#     lookups/cam_categories.csv.default
#     lookups/cam_tasks.csv.default
#     lookups/cam_subjects.csv.default
#
# The dev.splunk.com pages on the adaptive response framework are rendered by
# JavaScript and serve no text to a plain fetch, so they were not readable and
# nothing here rests on them.
#
# THE VALUES, AND THE ONE JUDGEMENT CALL IN THEM.
#
#   category   Information Gathering. One of the five in cam_categories:
#              Information Conveyance, Information Gathering, Information
#              Tracking, Permissions Control, Device Control. A detonation
#              gathers information about a URL and changes nothing.
#   task       scan. One of the six in cam_tasks: block, allow, create,
#              update, delete, scan. Detonating a URL is a scan of it; create
#              would describe the task record rather than the work.
#   subject    network and process.sandbox, both in cam_subjects. THIS IS THE
#              JUDGEMENT CALL: the list has no value for a URL, so the object
#              acted on is declared as network, the documented generic for a
#              network resource, and process.sandbox names what performs the
#              work. Neither is invented and no closer value exists.
#   technology The vendor, the product and the version. The version is the
#              app's own, from default/app.conf, and a test asserts the two
#              are equal so a release bump cannot leave this line stale.
#   supports_adhoc   true. The spec: "Specifies if the modular action supports
#              adhoc invocations." This is the setting that makes the action
#              offerable on demand rather than only from a saved search.
#   supports_cloud   true. The spec: "does the action function properly when
#              the search head does not have access to the local network."
#              It does. Every request this action makes is outbound to the
#              PolySwarm API and nothing on the customer's network is touched.
#              The spec defaults it to true; it is written out because a
#              declaration a reader can check beats a default they have to
#              know.
#   drilldown_uri    the app's Sandbox Tasks view, in the documented
#              "../my_app/my_view" form, so an analyst who ran the action from
#              another app's context lands on the task table rather than on a
#              view name that does not resolve there. The spec's example also
#              shows form.orig_sid and form.orig_rid tokens appended; they are
#              deliberately absent, because that view declares no inputs by
#              those names and a token nothing reads is a promise the page does
#              not keep.
#
# param._cam_workers IS DELIBERATELY ABSENT. Appendix B of the same
# specification describes it as the list of remote workers an action may be
# queued to, "Optional. Defaults to None", and this action has no worker model:
# it runs on the search head that fired it. Declaring it would also imply
# supports_workers, which the spec ties to a remote execution path this app
# does not have.
param._cam = {"category": ["Information Gathering"], "task": ["scan"], "subject": ["network", "process.sandbox"], "technology": [{"vendor": "PolySwarm", "product": "PolySwarm App", "version": ["1.0.0"]}], "supports_adhoc": true, "supports_cloud": true, "drilldown_uri": "../polyswarm_app_for_splunk/sandbox"}
