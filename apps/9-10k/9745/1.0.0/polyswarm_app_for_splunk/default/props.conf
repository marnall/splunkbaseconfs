# Index-time and search-time handling for the events this app writes.
#
# One sourcetype, polyswarm:artifact, written by the polyswarm_intel_pull
# modular input. Design section 5 asks for "all app-generated events tagged and
# mapped, with eventtypes, tags, and props shipped", and notes that v1 had none
# of it.
#
# THE SOURCETYPE STRING IS DUPLICATED IN THREE PLACES AND A TEST ASSERTS IT.
# It is here, in the shipped stanza in default/inputs.conf, and as SOURCETYPE
# in bin/input_intel_pull.py, which sets it on every event it writes. The code
# setting it is what makes this stanza reliable: an operator who changed the
# sourcetype in a local inputs.conf alone would keep indexing events and
# silently lose every extraction below, plus the CIM mapping built on them.
# Three copies of a string is defect class B5 unless something checks they
# agree, so something does.

[polyswarm:artifact]

# The events are one JSON object per line, written by
# bin/input_intel_pull._dumps with sorted keys and no spaces in the separators.
#
# KV_MODE = json is the whole of the field extraction. There is deliberately no
# EXTRACT, no REPORT and no transforms stanza for this sourcetype: the field
# names in the JSON are already the names an analyst searches on, because they
# are polyswarmsearch's own output field names. A regular expression over a
# JSON body would be a second, weaker parser for a format Splunk parses
# natively.
KV_MODE = json

# One event per line, and the line is the event.
#
# SHOULD_LINEMERGE = false with an explicit LINE_BREAKER is the pair that makes
# that true rather than nearly true. With line merging on, Splunk decides where
# an event ends by looking for a timestamp at the start of a line, and a JSON
# object whose first key is not a date has none, so two artifacts can be merged
# into one event. That failure is invisible until somebody counts.
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)

# THE EVENT TIME IS WHEN THE ARTIFACT WAS PULLED, NOT WHEN IT WAS FIRST SEEN,
# AND THAT IS A DECISION RATHER THAN A DEFAULT.
#
# The obvious configuration here is TIMESTAMP_FIELDS = polyswarm_first_seen,
# and it is wrong. first_seen is when the PLATFORM first saw the file, which
# can be months or years before the pull: the recorded response carries
# artifacts whose first scan predates the query window entirely. Filing today's
# intel under that date puts new events behind a customer's retention boundary,
# where a search over the last 24 hours cannot see them and where a frozen
# bucket may eventually delete them. An operator who turned the input on and
# found nothing in `index=... earliest=-1h` would have no way to tell that from
# an input that is not running.
#
# So the event time is the pull time. The input supplies it on the event
# itself, and DATETIME_CONFIG = CURRENT is the same answer stated in the conf,
# so that a copy of these events arriving by any other route, a summary index
# through | collect for example, is timed the same way.
#
# Nothing is lost by this. polyswarm_first_seen and polyswarm_last_seen are
# extracted as fields by KV_MODE above and are searchable, sortable and
# usable in a where clause, which is everything except being _time.
DATETIME_CONFIG = CURRENT

# For the Set Sourcetype UI and the sourcetype list.
description = PolySwarm threat intel artifacts, one event per artifact
category = Custom

# ---------------------------------------------------------------------------
# CIM mapping. Design section 5's groundwork, and no more than that.
# ---------------------------------------------------------------------------
#
# WHAT IS MAPPED, AND IT IS DELIBERATELY THREE FIELDS.
#
# The Common Information Model's Malware data model describes malware DETECTED
# ON A HOST. Its Malware_Attacks dataset is built around that: `dest` is the
# system the infection was found on, `action` is what the product did about it,
# and `user` is whose session it happened in. A PolySwarm intel artifact is not
# any of that. It is a reputation record about a file: the platform has seen
# this digest, this is what the engines said, this is the family. Nobody's host
# is involved.
#
# So the three fields below are mapped because they are the same fact under two
# names, and nothing else is:
#
#   file_hash      the artifact's sha256. The same value, and file_hash is
#                  where every CIM-aware search looks for it.
#   signature      the malware family. The CIM defines signature as the name of
#                  the infection detected, and a family name is exactly that.
#                  Multivalue, because the platform can hold more than one
#                  attribution for one artifact and bin/input_intel_pull.py
#                  refuses to pick between them.
#   vendor_product a constant, because it is one: these events come from this
#                  app and from nowhere else.
#
# WHAT IS NOT MAPPED, WHICH MATTERS MORE.
#
# There is no alias for dest, user, action, category, src, url or file_name,
# because this app has no honest value for any of them. An alias to a field
# that does not exist costs nothing and says nothing; an EVAL inventing one
# would put a fabricated host or a guessed action into a customer's Malware
# data model, which is the C6 doctrine applied to a field extraction rather
# than to an event.
#
# `severity` is the one that looks mappable and is not. The CIM's severity is
# an ordered vocabulary about how bad an incident is, and polyswarm_verdict is
# a statement about a file's reputation. Deriving one from the other would be
# this app asserting that a malicious verdict is a high severity incident,
# which depends entirely on where the file turned up, and that is the
# customer's correlation search to write and not ours to assume.
#
# WHY THE `attack` TAG IS NOT APPLIED. See default/tags.conf: these events
# carry the `malware` tag and not `attack`, so they are discoverable as malware
# data without being claimed as attack observations. That is the honest
# position for intel, and it is what makes this groundwork rather than a
# finished data model mapping: when the enrichment path attaches one of these
# verdicts to a host event, THAT event has a dest and can be tagged attack.
FIELDALIAS-file_hash = polyswarm_sha256 AS file_hash
FIELDALIAS-signature = polyswarm_families AS signature
EVAL-vendor_product = "PolySwarm"
