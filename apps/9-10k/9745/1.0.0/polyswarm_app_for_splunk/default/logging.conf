# Logging configuration for the PolySwarm App.
#
# Loaded by splunklib's configure_logging(), which probes local/logging.conf
# then default/logging.conf, chdirs to the app root first, and substitutes
# SPLUNK_HOME. bin/ps_log.py is the only writer, and it falls back to stderr if
# this file is missing or unloadable, so a mistake here degrades logging rather
# than breaking a search.
#
# The file goes under $SPLUNK_HOME/var/log/splunk, which splunkd indexes into
# _internal on its own with a sourcetype derived from the filename. That is
# what makes the health dashboard in design section 4.6 a search rather than a
# file to go and read on a box.
#
# TRAP: every logger that must survive is named here.
#
# configure_logging() calls fileConfig() without disable_existing_loggers, so
# it defaults to True and every logger NOT named in this file is switched off.
# splunklib configures its own "splunklib" logger before an app command runs,
# so leaving it out of [loggers] would silence the SDK's own diagnostics as a
# side effect of us adding ours. It is listed below for that reason and not
# because this app writes to it.
#
# To change the level, copy this file to local/logging.conf and edit it there.
# A local copy wins, and it survives an app upgrade.

[loggers]
keys = root, splunklib, polyswarm_app_for_splunk

[handlers]
keys = app_file

[formatters]
keys = structured

# ps_log writes the whole key=value line itself, so the formatter adds only what
# the line cannot know: when, and at what level. No logger name and no module,
# because component= already says which part of the app is speaking and a
# second answer to the same question is noise in a grep.
[formatter_structured]
format = %(asctime)s %(levelname)s %(message)s
datefmt = %Y-%m-%d %H:%M:%S

# Rotating, and small. These lines are terse and the volume is bounded by
# searches run, but a customer scheduling enrichment every five minutes should
# not find this file has grown without limit.
[handler_app_file]
class = handlers.RotatingFileHandler
level = INFO
formatter = structured
args = ('%(SPLUNK_HOME)s/var/log/splunk/polyswarm_app_for_splunk.log', 'a', 5242880, 5)

[logger_root]
level = WARNING
handlers = app_file

# INFO by default: one line per request, one pair per search. The per-record
# and per-lookup lines ps_log writes at DEBUG stay off until an operator
# raising the level asks for them, because a search over ten thousand hashes
# would otherwise write ten thousand lines to report that the cache worked.
[logger_polyswarm_app_for_splunk]
level = INFO
handlers = app_file
qualname = polyswarm_app_for_splunk
propagate = 0

# Named so that loading this file does not switch the SDK's own logger off.
# See the trap note at the top.
[logger_splunklib]
level = WARNING
handlers = app_file
qualname = splunklib
propagate = 0
