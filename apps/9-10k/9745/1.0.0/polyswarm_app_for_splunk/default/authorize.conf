# Roles shipped by the PolySwarm App.
#
# WHY THIS FILE EXISTS (ruled 2026-09-09, decision D27). Object permissions and
# splunkd capabilities are two independent gates, and until this file existed
# the app satisfied only the first of them. metadata/default.meta grants the
# power role read on the four metered commands, on both enrich workflow actions
# and on the alert action, so power passes the object gate. The credential the
# commands need is read from splunkd's storage/passwords endpoint with the
# searching user's own session key, and that endpoint has a capability gate of
# its own: Splunk's capability reference, "Define roles on the Splunk platform
# with capabilities" on help.splunk.com, describes list_storage_passwords as
# what "Lets the user list and view the /storage/passwords endpoint, lets the
# user perform GETs", and the Power column of that table is not marked for that
# row. dev.splunk.com's "Manage secret storage" page says the same thing from
# the other side: a secret is "accessible to any user with the
# admin_all_objects or list_storage_passwords capabilities". The built-in power
# role holds neither.
#
# So a user holding only power was granted every object it needed and refused
# the key. Confirmed live on a Splunk Enterprise 10.4.2 instance: a fresh
# power-only user gets HTTP 403 on
# /servicesNS/nobody/polyswarm_app_for_splunk/storage/passwords, and
# | polyswarmsearch fails with the ClientConfigurationError that
# bin/ps_client.get_api_key raises, "Could not read the PolySwarm API key from
# credential storage (HTTPError). The running user may lack the capability to
# read storage/passwords." Every metered command, both enrich workflow actions
# and any alert fired as a power user were broken on a configured install.
#
# WHY A NEW ROLE RATHER THAN A CHANGE TO POWER. Adding the capability to
# [role_power] here would work and is the wrong shape three times over. It is a
# change to a built-in role, so an app that installs it silently widens the
# capability set of a role the customer already assigns everywhere, including on
# search heads where this app is one of forty. It grants read of EVERY secret on
# the instance, not this app's, because list_storage_passwords is
# instance-wide rather than per-app, so the blast radius is the customer's whole
# credential store. And Splunk's own packaging checks treat built-in role
# edits as a defect: the vendored AppInspect at
# .venv/lib/python3.11/site-packages/splunk_appinspect/default_checks/
# check_cloud_simple_app.py fails an app whose role stanzas inherit admin,
# sc_admin or splunk-system-role, and fails any importRoles or grantableRoles
# setting on [role_admin], [role_sc_admin] or [role_splunk-system-role]
# (CheckImportRolesAndGrantableRolesForBuiltInRoles). A shipped custom role is
# the pattern Splunk's role documentation describes and the pattern AppInspect
# permits, so that is what this file does.
#
# WHAT THE ADMIN STILL CHOOSES. Nothing here assigns the role to anybody.
# Shipping a role definition is inert until an administrator grants it, so the
# decision to let a named person read the instance's secrets stays with the
# person accountable for it. An administrator who would rather not use the
# shipped role at all can add list_storage_passwords to a role of their own, or
# to power, and the app works identically: the object ACLs in
# metadata/default.meta name power as well as this role, deliberately, so
# neither route is blocked by the other. docs/install.md section 9 documents
# both routes and the error text a user sees without either.
#
# THE SPECIFICATION THIS FILE IS WRITTEN AGAINST. Splunk's authorize.conf
# reference and "Create and manage roles in Splunk Enterprise using the
# authorize.conf configuration file" on help.splunk.com: the stanza header is
# [role_<roleName>] and "You must include role_ in the stanza name"; "Role
# names must use lowercase characters only" and "cannot contain spaces, colons,
# semicolons, or forward slashes", which is also what AppInspect's
# CheckAuthorizeConfRoleNames enforces with the pattern role_.*[A-Z:;/ ].*;
# importRoles takes a semicolon-separated list and "the role that you are
# defining inherits the capabilities from each role you specify in the value";
# and a capability is enabled with "<capability> = enabled", where enabled is
# the only accepted value because capabilities are disabled by default.
# Capabilities inherited from an imported role cannot be disabled again, which
# is why this role imports power rather than trying to subtract from it.
#
# Note also what is NOT written here. There is no [capability::...] stanza:
# AppInspect's CheckAuthorizeConfCapabilityNotModified fails an app that
# declares a capability stanza matching a Splunk-defined capability, and
# list_storage_passwords is one (it is in AppInspect's own
# splunk_defined_authorize_capability_list). Declaring the capability is
# Splunk's job; enabling it on a role is this file's.
#
# Adding a capability line here, or importing a different role, is a security
# review rather than a convenience edit.

# The PolySwarm analyst role.
#
# Exactly one import and exactly one capability, and both halves are load
# bearing.
#
# importRoles = power gives the role everything the app's object ACLs already
# expect of power: read on the metered commands, the enrich workflow actions,
# the alert action, the dashboards and the lookup definitions, plus read and
# write on the KV store collections those commands fill. Naming power rather
# than restating its capabilities means the role tracks power if a customer
# edits it, and it means this file has no opinion about search quotas, real
# time search or index access, which are the customer's to set.
#
# list_storage_passwords = enabled is the whole point of the role: it is the
# capability splunkd requires for a GET of storage/passwords, which is how
# bin/ps_client.get_api_key reads the key as the searching user.
#
# Nothing else is enabled. In particular this role gets no admin_all_objects
# and no edit_storage_passwords, so it can read the key the administrator
# stored and cannot store, change or delete one, and it cannot reach objects
# whose ACL does not name it. Saving the key stays an administrator action, as
# [storage/passwords] in metadata/default.meta says: that stanza's write clause
# is admin and sc_admin only, and this role is named in its read clause alone.
[role_polyswarm_analyst]
importRoles = power
list_storage_passwords = enabled
