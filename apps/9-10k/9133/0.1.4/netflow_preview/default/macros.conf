[netflow_index]
definition = sourcetype=flowintegrator

[netflow_search_rule_20060]
definition = `netflow_index` nfc_id=20060

[netflow_search_rule_20103]
definition = `netflow_index` nfc_id=20103

[netflow_search_rule_20700]
definition = `netflow_index` nfc_id=20700

[netflow_search_rule_20701]
definition = `netflow_index` nfc_id=20701

[netflow_search_rule_20702]
definition = `netflow_index` nfc_id=20702

[per_second_chart(3)]
args = timechart_expr, span_token, span_int
definition =  timechart $span_token$ limit=10  useother="f" $timechart_expr$  \
            | foreach *  \
                [ eval <<FIELD>> = case("<<FIELD>>"=="_time", _time, 1==1, '<<FIELD>>'*8/($span_int$*1000000)) ]


[format_port_column(2)]
args = result, port
definition = lookup `is_local_lookup` port_lookup port AS $port$ OUTPUT service AS service | strcat $port$ "/" transport " (" service ")" $result$ 

[format_ip_column(3)]
args = result, ip, host
definition = eval $result$=if(isnull($host$),$ip$,$ip$." (".$host$.")")

[set_span]
definition = head 1                                                                               \
            | addinfo                                                                             \
            | eval range = if(info_max_time="+Infinity",3600,info_max_time-info_min_time)         \
            | eval span = if(range<3600,"span=30s","span=" . round(range/120) . "s")              \
            | eval span_int=if(range<3600,30,round(range/120))                                    \
            | eval all_time_latest=if(info_max_time="+Infinity",_time,info_max_time)              \
            | eval all_time_earliest=if(info_max_time="+Infinity",_time-3600,info_min_time)       \
            | eval t_int_seconds = round(t_int/1000)

#definition = source=20067_summary_1h_subnet_groups

[dedup_timechart_events]
definition =  fillnull value="" input_snmp \
            | dedup src_ip src_port dest_ip dest_port transport _time

[is_local_lookup]
definition = local=false

[auto_scale_bytes(1)]
args = field
definition = case(\
$field$ >= 1099511627776, round($field$/1099511627776,2)." TB", \
$field$ >= 1073741824,    round($field$/1073741824,2)." GB", \
$field$ >= 1048576,       round($field$/1048576,2)." MB", \
$field$ >= 1024,          round($field$/1024,2)." KB", \
true(),                   $field$." B")

# Duration formatter. Embeddable inside eval:
#   | eval dur = `auto_scale_duration(avg_duration)`

# Duration formatter. Embeddable inside eval:
#   | eval dur = `auto_scale_duration(avg_duration)`

[auto_scale_duration(1)]
args = field
definition = case(\
$field$ >= 3600, round($field$/3600,1)." hr", \
$field$ >= 60,   round($field$/60,1)." min", \
true(),          round($field$,0)." s")

# === Filter input population (from exporters_devices_lookup) ==============
