[cloud_base_filter]
definition = `netflow_index` nfc_id=20062 (src_cloud_service=* OR dest_cloud_service=* OR src_cloud_region=* OR dest_cloud_region=*)
iseval = 0

[cloud_enrich]
definition = fillnull value="" device_type exp_ip exp_name site flow_type src_ip dest_ip src_ip6 dest_ip6 dest_port src_cloud_service dest_cloud_service src_cloud_region dest_cloud_region src_cloud_provider dest_cloud_provider src_vm_name dest_vm_name \
| eval cloud_service = coalesce(if(dest_cloud_service!="", dest_cloud_service, null()), if(src_cloud_service!="", src_cloud_service, null()), "") \
| eval cloud_region = coalesce(if(dest_cloud_region!="", dest_cloud_region, null()), if(src_cloud_region!="", src_cloud_region, null()), "") \
| eval cloud_provider = coalesce(if(dest_cloud_provider!="", dest_cloud_provider, null()), if(src_cloud_provider!="", src_cloud_provider, null()), "") \
| eval service_region = if(cloud_service!="" AND cloud_region!="", cloud_service . " (" . cloud_region . ")", coalesce(cloud_service, cloud_region)) \
| eval src_ip_eff = coalesce(if(src_ip!="", src_ip, null()), if(src_ip6!="", src_ip6, null()), "") | eval src_host_label = if(src_vm_name!="", src_ip_eff . " (" . src_vm_name . ")", src_ip_eff) \
| eval dest_ip_eff = coalesce(if(dest_ip!="", dest_ip, null()), if(dest_ip6!="", dest_ip6, null()), "") | eval dest_host_label = if(dest_vm_name!="", dest_ip_eff . " (" . dest_vm_name . ")", dest_ip_eff) \
| eval bytes = coalesce(bytes_in,0) + coalesce(bytes_out,0)
iseval = 0

[tcp_health_base]
definition = `netflow_search_rule_20060`
iseval = 0

[tcp_health_enrich]
definition = fillnull value="" exp_ip src_ip src_host site | lookup devices_lookup exp_ip OUTPUT exp_name device_type | fillnull value="" exp_name device_type | eval reset_count = coalesce(reset_count, 0) | eval device_network = if(exp_name = "", exp_ip, exp_ip . " (" . exp_name . ")") | eval src_label = if(src_host = "", src_ip, src_ip . " (" . src_host . ")")
iseval = 0

[ndh_status_icon(1)]
args = severity
definition = case($severity$="Normal","🟢", $severity$="Low","🟡", $severity$="Medium","🟠", $severity$="High","🔴", $severity$="Critical","🟣", $severity$="Unknown","⚪", true(),"⚪")
# ============================================================================
# Interface health — shared definitions
#
# Extracted from six duplicated in-dashboard copies (device_health.xml x4,
# network_topology.xml x2). Edit here, not in the dashboards.
#
# Field profile: NFO interface_mon emits 64-bit HC counters only. The 32-bit
# ifInUcastPkts / ifOutUcastPkts / ifInNUcastPkts / ifOutNUcastPkts were
# withdrawn; the coalesce fallbacks below exist for StackWise_interface_mon,
# which still carries the old profile.
# ============================================================================

[ndh_interface_deltas(1)]
args = by_fields
definition = fillnull value=0 ifInErrors ifOutErrors ifInDiscards ifOutDiscards \
| eval MgmtIP = mgmt_ip \
| addinfo \
| eval Site = coalesce(site, "Unassigned") \
| eval range_seconds = case(info_max_time="+Infinity", 3600, \
                            info_max_time > info_min_time, info_max_time - info_min_time, \
                            true(), 3600) \
| eval in_ucast  = coalesce(ifHCInUcastPkts,  ifInUcastPkts) \
| eval out_ucast = coalesce(ifHCOutUcastPkts, ifOutUcastPkts) \
| eval in_nucast = case(isnotnull(ifHCInMulticastPkts) OR isnotnull(ifHCInBroadcastPkts), \
                            coalesce(ifHCInMulticastPkts,0) + coalesce(ifHCInBroadcastPkts,0), \
                        isnotnull(ifInNUcastPkts), ifInNUcastPkts, \
                        true(), null()) \
| eval out_nucast = case(isnotnull(ifHCOutMulticastPkts) OR isnotnull(ifHCOutBroadcastPkts), \
                            coalesce(ifHCOutMulticastPkts,0) + coalesce(ifHCOutBroadcastPkts,0), \
                         isnotnull(ifOutNUcastPkts), ifOutNUcastPkts, \
                         true(), null()) \
| stats latest(_time) as LastSeen latest(sysName) as LatestDevice latest(device_type) as LatestType first(range_seconds) as range_seconds \
        latest(ifHCInOctets) as latestInOctets earliest(ifHCInOctets) as earliestInOctets \
        latest(ifHCOutOctets) as latestOutOctets earliest(ifHCOutOctets) as earliestOutOctets \
        latest(ifInErrors) as latestInErrors earliest(ifInErrors) as earliestInErrors \
        latest(ifOutErrors) as latestOutErrors earliest(ifOutErrors) as earliestOutErrors \
        latest(ifInDiscards) as latestInDiscards earliest(ifInDiscards) as earliestInDiscards \
        latest(ifOutDiscards) as latestOutDiscards earliest(ifOutDiscards) as earliestOutDiscards \
        latest(in_ucast) as latestInUcast earliest(in_ucast) as earliestInUcast \
        latest(out_ucast) as latestOutUcast earliest(out_ucast) as earliestOutUcast \
        latest(in_nucast) as latestInNUcast earliest(in_nucast) as earliestInNUcast \
        latest(out_nucast) as latestOutNUcast earliest(out_nucast) as earliestOutNUcast \
        latest(ifHighSpeed) as ifHighSpeedLatest latest(ifSpeed) as ifSpeedLatest \
  by $by_fields$ \
| eval deltaInOctets = case(isnull(latestInOctets) OR isnull(earliestInOctets), null(), \
                            latestInOctets-earliestInOctets>0, latestInOctets-earliestInOctets, true(), 0) \
| eval deltaOutOctets = case(isnull(latestOutOctets) OR isnull(earliestOutOctets), null(), \
                             latestOutOctets-earliestOutOctets>0, latestOutOctets-earliestOutOctets, true(), 0) \
| eval deltaInErrors = if(latestInErrors-earliestInErrors>0, latestInErrors-earliestInErrors, 0) \
| eval deltaOutErrors = if(latestOutErrors-earliestOutErrors>0, latestOutErrors-earliestOutErrors, 0) \
| eval deltaInDiscards = if(latestInDiscards-earliestInDiscards>0, latestInDiscards-earliestInDiscards, 0) \
| eval deltaOutDiscards = if(latestOutDiscards-earliestOutDiscards>0, latestOutDiscards-earliestOutDiscards, 0) \
| eval deltaInUcast = case(isnull(latestInUcast) OR isnull(earliestInUcast), null(), \
                           latestInUcast-earliestInUcast>0, latestInUcast-earliestInUcast, true(), 0) \
| eval deltaOutUcast = case(isnull(latestOutUcast) OR isnull(earliestOutUcast), null(), \
                            latestOutUcast-earliestOutUcast>0, latestOutUcast-earliestOutUcast, true(), 0) \
| eval deltaInNUcast = case(isnull(latestInNUcast) OR isnull(earliestInNUcast), null(), \
                            latestInNUcast-earliestInNUcast>0, latestInNUcast-earliestInNUcast, true(), 0) \
| eval deltaOutNUcast = case(isnull(latestOutNUcast) OR isnull(earliestOutNUcast), null(), \
                             latestOutNUcast-earliestOutNUcast>0, latestOutNUcast-earliestOutNUcast, true(), 0) \
| eval errorDiscardDelta = deltaInErrors + deltaOutErrors + deltaInDiscards + deltaOutDiscards \
| eval packet_base_known = if(isnotnull(deltaInUcast) AND isnotnull(deltaOutUcast), 1, 0) \
| eval packetDelta = if(packet_base_known=1, \
                        deltaInUcast + deltaOutUcast + coalesce(deltaInNUcast,0) + coalesce(deltaOutNUcast,0) + errorDiscardDelta, \
                        null()) \
| eval octet_base_known = if(isnotnull(deltaInOctets) AND isnotnull(deltaOutOctets), 1, 0) \
| eval speed_bps = case(tonumber(ifHighSpeedLatest) > 0, tonumber(ifHighSpeedLatest) * 1000000, \
                        tonumber(ifSpeedLatest) > 0 AND tonumber(ifSpeedLatest) < 4000000000, tonumber(ifSpeedLatest), \
                        true(), null()) \
| eval UtilizationPct = if(octet_base_known=1 AND speed_bps > 0 AND range_seconds > 0, \
                           round(((max(deltaInOctets, deltaOutOctets) * 8) / range_seconds) / speed_bps * 100, 2), null()) \
| eval PacketLossPct = case(isnull(packetDelta), null(), \
                            packetDelta > 0, round(errorDiscardDelta / packetDelta * 100, 2), \
                            true(), 0)
iseval = 0
errormsg = ndh_interface_deltas(<space-separated by-clause fields>)
description = Per-interface counter deltas, utilisation % and packet-loss % from an \
  interface_mon search. Emits UtilizationPct and PacketLossPct (null when the \
  underlying counters are absent - never fabricated as 0).

[ndh_interface_health_score(2)]
args = util_field, loss_field
definition = eval RLS = case(isnull($util_field$), null(), \
                             $util_field$ <= 70, 100, \
                             true(), max(0, round(100 + (70 - $util_field$) * (100/30), 2))) \
| eval PLS = case(isnull($loss_field$), null(), \
                  true(), max(0, min(100, round(100 - $loss_field$, 2)))) \
| eval HealthScore = case(isnotnull(PLS) AND isnotnull(RLS), min(PLS, RLS), \
                          isnotnull(PLS), PLS, \
                          isnotnull(RLS), RLS, \
                          true(), null()) \
| eval HealthDriver = case(isnull(HealthScore), "No data", \
                           isnull(RLS), "Loss", \
                           isnull(PLS), "Load", \
                           PLS < RLS, "Loss", \
                           RLS < PLS, "Load", \
                           true(), "Both")
iseval = 0
errormsg = ndh_interface_health_score(<utilisation_pct_field>, <packet_loss_pct_field>)
description = Relative-load score (RLS) and packet-loss score (PLS), knee at 70% to \
  match cpu_score/mem_score. HealthScore is the worse of the two, so a single-dimension \
  fault is not diluted by a healthy second dimension. HealthDriver names the dimension \
  that set the score.
