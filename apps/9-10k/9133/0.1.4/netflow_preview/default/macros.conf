[host_label(1)]
args = side
definition = eval $side$_ip_eff = `coalesce_ip($side$)` \
| eval $side$_host_label = case($side$_vm_name!="", $side$_ip_eff." (".$side$_vm_name.")", isnotnull($side$_host) AND $side$_host!="" AND $side$_host!="unknown", $side$_ip_eff." (".$side$_host.")", true(), $side$_ip_eff)
iseval = 0

[host_labels]
definition = `host_label(src)` | `host_label(dest)`
iseval = 0

[coalesce_ip(1)]
args = side
definition = coalesce(if($side$_ip!="", $side$_ip, null()), if($side$_ip6!="", $side$_ip6, null()))
iseval = 0

[coalesce_ips]
definition = eval src_ip = `coalesce_ip(src)`, dest_ip = `coalesce_ip(dest)`
iseval = 0

