# Site options.

# Device / Network options, cascaded from $site$ and $device_type$.
# Emits exp_ip (value) + label (display); label falls back to exp_ip.

[ip_is_local(1)]
args = ip
definition = (cidrmatch("10.0.0.0/8", $ip$) OR cidrmatch("172.16.0.0/12", $ip$) OR cidrmatch("192.168.0.0/16", $ip$))
iseval = 0

