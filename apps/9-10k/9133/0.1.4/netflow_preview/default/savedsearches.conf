[set_default_devices_lookup]
is_visible = false
enableSched = 1
cron_schedule = 1 1 1 1 1
run_on_startup = true
search = | makeresults \
         | eval site="*" \
         | eval device_type="*" \
         | eval mgmt_ip="*" \
         | eval exp_ip="*" \
         | eval exp_name="*" \
         | inputlookup devices_lookup  append=t \
         | dedup site,device_type,mgmt_ip,exp_ip,exp_name  \
         | table site,device_type,mgmt_ip,exp_ip,exp_name  \
         | outputlookup devices_lookup

[build_devices_lookup_update]
action.webhook.enable_allowlist = 0
alert.track = 0
cron_schedule = */30 * * * *
dispatch.earliest_time = -32m@m
dispatch.latest_time = -2m@m
enableSched = 1
is_visible = 0
run_on_startup = 1
search = `netflow_index` | fillnull value="" site device_type exp_ip mgmt_ip exp_name | inputlookup devices_lookup append=t | dedup site device_type exp_ip mgmt_ip exp_name | sort exp_ip | table site device_type exp_ip mgmt_ip exp_name | outputlookup devices_lookup


[build_devices_lookup_rebuild]
action.webhook.enable_allowlist = 0
alert.track = 0
cron_schedule = */30 * * * *
dispatch.earliest_time = -32m@m
dispatch.latest_time = -2m@m
is_visible = 0
run_on_startup = 1
search = `netflow_index` | fillnull value="" site device_type exp_ip mgmt_ip exp_name | dedup site device_type exp_ip mgmt_ip exp_name | sort exp_ip | table site device_type exp_ip mgmt_ip exp_name | outputlookup devices_lookup


[build_topology_tier_positions_rebuild]
action.webhook.enable_allowlist = 0
alert.track = 0
cron_schedule = 7,37 * * * *
dispatch.earliest_time = -24h@m
dispatch.latest_time = now
schedule_window = auto
search = ``` ===================================================================== \
    build_topology_tier_positions : REBUILD \
    ===================================================================== ``` \
`netflow_search_rule_20702` \
| eval dest_join = coalesce(dest_mgmt_ip, dest_ip, dest_ip6) \
| where dest_join!="" AND dest_join!="0.0.0.0" AND dest_join!="255.255.255.255" AND NOT match(dest_join, "^(22[4-9]|23[0-9])\.") \
| fillnull value="Unassigned" site \
| eval _kind="edge", probe_src = site . ":" . mgmt_ip, probe_dst = site . ":" . dest_join \
| fields _kind site mgmt_ip dest_join probe_src probe_dst con_source \
``` inventory joins the main stream: it carries metadata for BOTH endpoints and \
    injects managed devices that have no 20702 adjacency at all (previously \
    dropped from the topology entirely) ``` \
| append \
    [ search `netflow_search_rule_20701` \
      | fillnull value="Unassigned" site \
      ``` inv_tier: NFO-authoritative device_tier. absent on pre-tier-aware agents -> \
          null all the way through to the band coalesce, which then falls back ``` \
      | stats latest(sysName) as inv_name latest(device_type) as inv_type latest(device_tier) as inv_tier by site mgmt_ip \
      | eval _kind="inv", probe_src = site . ":" . mgmt_ip, probe_dst = probe_src \
      | fields _kind site mgmt_ip probe_src probe_dst inv_name inv_type inv_tier ] \
``` project inventory onto the source end and the destination end of every edge ``` \
| eventstats values(inv_type) as src_type values(inv_name) as src_name values(inv_tier) as src_tier by probe_src \
| eventstats values(inv_type) as neighbor_type by probe_dst \
| eval src_type      = coalesce(mvindex(src_type,0), "unknown") \
| eval src_name      = mvindex(src_name,0) \
| eval src_tier      = mvindex(src_tier,0) \
| eval neighbor_type = coalesce(mvindex(neighbor_type,0), "unmanaged") \
``` PERIMETER TEST. external == not in inventory AND the address is outside the \
    managed estate. "outside" is NOT the same as "public": \
      public                  -> internet peer \
      169.254/16, fe80::/10   -> link-local, i.e. the far side of a point-to-point \
                                 tunnel (every AWS/Azure VPN BGP session lives here). \
                                 never a device anyone can discover or manage. \
      100.64/10               -> CGNAT / cloud transit space, not your estate. \
    only RFC1918 (10/8, 172.16/12, 192.168/16) means "probably an internal device we \
    failed to scan" and therefore undiscovered. treating link-local as internal put \
    hundreds of VPN tunnel far-ends in the undiscovered band, which has no aggregation, \
    and left their routers in core with external nodes floating above them. \
    this exact expression is repeated in the far-end synthesis below; the two MUST agree ``` \
| eval dest_is_perimeter = case( \
    isnull(dest_join) OR dest_join="",                                                 0, \
    match(dest_join, ":"),   if(cidrmatch("2000::/3", dest_join) OR cidrmatch("fe80::/10", dest_join), 1, 0), \
    cidrmatch("10.0.0.0/8", dest_join) OR cidrmatch("172.16.0.0/12", dest_join) \
        OR cidrmatch("192.168.0.0/16", dest_join) OR cidrmatch("127.0.0.0/8", dest_join) \
        OR cidrmatch("0.0.0.0/8", dest_join) OR cidrmatch("224.0.0.0/3", dest_join),    0, \
    true(),                                                                            1) \
| eval is_l3_row = if(_kind="edge" AND con_source IN ("OSPF","IP_FORWARDING","BGP","NEXT_HOP"), 1, 0) \
``` TWO GRADES OF EXTERNAL EVIDENCE. \
    peer  = eBGP session to an unmanaged public address -> genuinely the perimeter \
    route = a route/next-hop toward public space -> every router with a default \
            route has one, so it must NOT by itself promote a device to edge ``` \
| eval ext_peer_row  = if(_kind="edge" AND con_source="BGP" AND neighbor_type="unmanaged" AND dest_is_perimeter=1, 1, 0) \
| eval ext_route_row = if(_kind="edge" AND con_source IN ("BGP","NEXT_HOP","IP_FORWARDING") AND neighbor_type="unmanaged" AND dest_is_perimeter=1, 1, 0) \
| eval nbr_ep_row    = if(_kind="edge" AND neighbor_type IN ("server","wireless","storage","virtualization","printer","power","management"), 1, 0) \
| eval in_inv_row    = if(_kind="inv", 1, 0) \
| eval nb_row        = if(_kind="edge", dest_join, null()) \
| stats max(is_l3_row) as has_l3 max(ext_peer_row) as ext_peer max(ext_route_row) as ext_route \
        max(nbr_ep_row) as has_endpoint_neighbor max(in_inv_row) as in_inventory \
        dc(nb_row) as degree values(nb_row) as neighbors \
        values(src_type) as src_type values(src_name) as src_name values(src_tier) as src_tier \
      by site mgmt_ip \
| eval src_type=mvindex(src_type,0), src_name=mvindex(src_name,0), src_tier=mvindex(src_tier,0) \
| eval node_id = site . ":" . mgmt_ip \
| eval _acc_sw = if((src_type="switch" OR src_type="modular chassis") AND has_endpoint_neighbor=1, 1, 0) \
| eventstats values(eval(if(_acc_sw=1, node_id, null()))) as gacc \
| eventstats values(eval(if(src_type IN ("switch","modular chassis","router","gateway"), node_id, null()))) as gnet \
``` isolated devices have no neighbours: emit a single placeholder row so mvexpand \
    cannot drop them ``` \
| eval _nc = coalesce(mvcount(neighbors), 0) \
| eval nrow = if(_nc>0, mvrange(0, _nc), 0) \
| mvexpand nrow \
| eval nb = if(_nc>0, mvindex(neighbors, nrow), null()) \
| eval _nbid = if(isnotnull(nb), replace(site . ":" . nb, "\.", "\\."), null()) \
| eval _nb_acc = if(isnotnull(_nbid) AND isnotnull(mvfind(gacc, "^" . _nbid . "$")), 1, 0) \
| eval _nb_net = if(isnotnull(_nbid) AND isnotnull(mvfind(gnet, "^" . _nbid . "$")), nb, null()) \
| stats sum(_nb_acc) as acc_nbr_count values(_nb_net) as net_neighbors max(has_l3) as has_l3 \
        max(ext_peer) as ext_peer max(ext_route) as ext_route \
        max(has_endpoint_neighbor) as has_endpoint_neighbor max(in_inventory) as in_inventory \
        max(degree) as degree values(neighbors) as neighbors \
        values(src_type) as src_type values(src_name) as src_name values(src_tier) as src_tier \
      by site mgmt_ip \
| eval src_type=mvindex(src_type,0), src_name=mvindex(src_name,0), src_tier=mvindex(src_tier,0) \
| eval node_id = site . ":" . mgmt_ip \
 \
``` ---------- definite structural bands ---------- \
    edge requires a routing-capable type, so a cloud host with a public next-hop \
    can never be promoted out of the endpoint band. If a site has no eBGP anywhere, \
    route-grade evidence is accepted so that single-router sites still get an edge. ``` \
| eventstats max(ext_peer) as site_has_peer by site \
| eval routing_capable = if(src_type IN ("router","gateway","firewall","security","switch","modular chassis"), 1, 0) \
| eval is_edge    = if(routing_capable=1 AND (ext_peer=1 OR src_type="gateway" OR (site_has_peer=0 AND ext_route=1)), 1, 0) \
``` fabric signature: the ordered set of managed network neighbours. Switches that \
    share a signature are peers at the same tier; that peer group is the aggregation \
    (spine) side when it is smaller than the set it collectively fronts. ``` \
| eval fabric_sig  = if(src_type IN ("switch","modular chassis"), mvjoin(mvsort(net_neighbors), ","), null()) \
| eval fabric_span = coalesce(mvcount(net_neighbors), 0) \
| eventstats dc(node_id) as peer_group by site fabric_sig \
| eval is_spine   = if((src_type="switch" OR src_type="modular chassis") AND ( \
                         (isnotnull(fabric_sig) AND fabric_span>=3 AND peer_group>=2 AND peer_group<fabric_span) \
                         OR (has_endpoint_neighbor=0 AND has_l3=1 AND acc_nbr_count>=2)), 1, 0) \
| eval is_service = if(src_type IN ("firewall","security","load balancer"), 1, 0) \
``` device_tier -> band. identity map over the pinned 5-value enum, plus aliases \
    for the granular fabric names, so NFO may emit leaf/distribution without any \
    schema or dashboard change. anything outside it (including "unknown" and \
    absent) yields null so the coalesce falls back to inference. to revoke NFO \
    authority during rollout, change the tier_band expression to null() ``` \
| eval _tier = lower(coalesce(src_tier,"")) \
| eval tier_band = case(_tier IN ("edge","core","spine","access","endpoint"), _tier, \
                        _tier="leaf",                                        "access", \
                        _tier="distribution",                                "spine", \
                        true(),                                              null()) \
| eval band_base = case( \
    isnotnull(tier_band),                                                               tier_band, \
    src_type IN ("server","wireless","storage","virtualization","printer","power","management"), "endpoint", \
    is_edge=1,                                                                          "edge", \
    is_service=1,                                                                       null(), \
    src_type="router",                                                                  "core", \
    is_spine=1,                                                                         "spine", \
    (src_type="switch" OR src_type="modular chassis") AND has_endpoint_neighbor=1,      "access", \
    src_type="hub" AND degree>1,                                                        "access", \
    src_type="hub",                                                                     "endpoint", \
    src_type IN ("switch","modular chassis"),                                           null(), \
    true(),                                                                             "endpoint") \
| eval _y_base = case(band_base="edge",100, band_base="core",300, band_base="spine",500, band_base="access",700, band_base="endpoint",900) \
| eval _needs_pos = if(isnull(band_base), 1, 0) \
| eventstats values(eval(if(_needs_pos=0 AND band_base!="endpoint", node_id . "=" . _y_base, null()))) as anchor_map \
| eval _nc = coalesce(mvcount(neighbors), 0) \
| eval nrow = if(_nc>0, mvrange(0, _nc), 0) \
| mvexpand nrow \
| eval nb = if(_nc>0, mvindex(neighbors, nrow), null()) \
| eval _ai = if(_needs_pos=1 AND isnotnull(nb), mvfind(anchor_map, "^" . replace(site . ":" . nb, "\.", "\\.") . "="), null()) \
| eval _ay = if(isnotnull(_ai), tonumber(mvindex(split(mvindex(anchor_map, _ai), "="), 1)), null()) \
| stats min(_ay) as anchor_y max(_needs_pos) as _needs_pos max(is_service) as is_service \
        max(degree) as degree max(in_inventory) as in_inventory max(has_l3) as has_l3 \
        max(has_endpoint_neighbor) as has_endpoint_neighbor max(_y_base) as _y_base \
        values(band_base) as band_base \
        values(src_type) as src_type values(src_name) as src_name values(src_tier) as src_tier \
      by site mgmt_ip \
| eval src_type=mvindex(src_type,0), src_name=mvindex(src_name,0), src_tier=mvindex(src_tier,0), band_base=mvindex(band_base,0) \
| eval node_id = site . ":" . mgmt_ip \
| eval anchor_band = case(anchor_y=100,"edge", anchor_y=300,"core", anchor_y=500,"spine", anchor_y=700,"access", anchor_y=900,"endpoint") \
| eval band = case( \
    isnotnull(band_base),                                       band_base, \
    is_service=1 AND isnotnull(anchor_band),                    anchor_band, \
    is_service=1 AND src_type="load balancer",                  "access", \
    is_service=1,                                               "core", \
    anchor_band="spine",                                        "access", \
    isnotnull(anchor_band),                                     anchor_band, \
    true(),                                                     "access") \
| eval yPositions = case( \
    isnotnull(band_base),                                       _y_base, \
    anchor_band="spine" AND is_service=0,                       700, \
    isnotnull(anchor_y),                                        anchor_y + 100, \
    band="core",                                                300, \
    true(),                                                     700) \
| eval band_conf = case(isnotnull(band_base), "strong", isnotnull(anchor_band), "anchored", true(), "weak") \
| eval node_label_base = if(isnull(src_name) OR src_name="" OR src_name=mgmt_ip, mgmt_ip, mgmt_ip . " (" . src_name . ")") \
| eval node_kind = "managed" \
| eval has_adjacency = if(degree>0, 1, 0) \
| append \
    [ search `netflow_search_rule_20702` \
      | eval dest_join = coalesce(dest_mgmt_ip, dest_ip, dest_ip6) \
      | where dest_join!="" AND dest_join!="0.0.0.0" AND dest_join!="255.255.255.255" AND NOT match(dest_join, "^(22[4-9]|23[0-9])\.") \
      | fillnull value="Unassigned" site \
      | stats values(con_source) as fe_sources values(mgmt_ip) as fe_reporters latest(dest_sysName) as fe_name by site dest_join \
      ``` precedence: discovery-protocol evidence > routing evidence > bridge-only ``` \
      ``` identical perimeter test to the managed side above — both must agree, or an \
          external node lands at y=20 wired to a node with no edge band between ``` \
      | eval fe_is_perimeter = case( \
            isnull(dest_join) OR dest_join="",                                           0, \
            match(dest_join, ":"), if(cidrmatch("2000::/3", dest_join) OR cidrmatch("fe80::/10", dest_join), 1, 0), \
            cidrmatch("10.0.0.0/8", dest_join) OR cidrmatch("172.16.0.0/12", dest_join) \
                OR cidrmatch("192.168.0.0/16", dest_join) OR cidrmatch("127.0.0.0/8", dest_join) \
                OR cidrmatch("0.0.0.0/8", dest_join) OR cidrmatch("224.0.0.0/3", dest_join),  0, \
            true(),                                                                     1) \
      | eval band = case( \
            isnotnull(mvfind(fe_sources, "^(LLDP|CDP|OSPF)$")),                          "undiscovered", \
            isnotnull(mvfind(fe_sources, "^(NEXT_HOP|BGP|IP_FORWARDING)$")) AND fe_is_perimeter=1, "external", \
            isnotnull(mvfind(fe_sources, "^(NEXT_HOP|BGP|IP_FORWARDING)$")),             "undiscovered", \
            true(),                                                                     "endpoint") \
      | eval mgmt_ip   = dest_join \
      | eval node_label_base = if(isnull(fe_name) OR fe_name="" OR fe_name=mgmt_ip, mgmt_ip, mgmt_ip . " (" . fe_name . ")") \
      | eval node_id   = site . ":" . mgmt_ip \
      | eval src_type  = case(band="endpoint","host", band="external","unmanaged-peer", true(),"undiscovered-device") \
      | eval node_kind = "synthetic" \
      | eval has_adjacency = 1, band_conf = "strong" \
      | fields node_id mgmt_ip node_label_base site src_type band band_conf node_kind has_adjacency fe_reporters ] \
| eventstats values(eval(if(node_kind="managed" AND band!="endpoint", node_id . "=" . yPositions, null()))) as band_map \
| eval y_hint = if(band="undiscovered", 99999, null()) \
| foreach mode=multivalue fe_reporters \
    [ eval _bi = mvfind(band_map, "^" . replace(site . ":" . <<ITEM>>, "\.", "\\.") . "="), \
           _ry = if(isnotnull(_bi), tonumber(mvindex(split(mvindex(band_map, _bi), "="), 1)) + 100, null()), \
           y_hint = if(band="undiscovered", min(y_hint, coalesce(_ry, 99999)), y_hint) ] \
| eval y_hint = case(band!="undiscovered", null(), y_hint=99999, 800, true(), y_hint) \
| eventstats values(eval(if(node_kind="managed", 1, null()))) as _is_mgd by node_id \
| where node_kind="managed" OR isnull(_is_mgd) \
| fields - band_map fe_reporters _bi _ry _is_mgd _needs_pos _y_base _tier tier_band band_base \
          anchor_y anchor_band is_service has_l3 has_endpoint_neighbor in_inventory \
 \
``` full rebuild: every node observed this run. the _update variant carries \
    first_seen forward and ages last_seen; here they are both "now" by definition ``` \
| eval first_seen = now() \
| eval last_seen  = now() \
| eval is_stale   = 0 \
``` conditional site suffix: labels carry " (site)" only when the final row set \
    spans more than one site; single-site deployments render plain "ip (sysName)" ``` \
| eventstats dc(site) as site_count \
| eval node_name = if(site_count > 1, node_label_base . " (" . site . ")", node_label_base) \
``` positions/styling from band. the three not-in-inventory kinds share a neutral grey \
    family and are separated by ICON, not hue: host = dark slate + monitor, external peer = \
    mid grey + globe, undiscovered = light grey + networkDevice. amber was removed here \
    because red/amber/green carry HEALTH SEVERITY everywhere else in the app, so an amber \
    node reads as "this device is degraded" when it only means "not in inventory". the \
    networkDevice icon states what the evidence supports: only network equipment speaks \
    LLDP/CDP/OSPF, so a far-end discovered that way IS a network device, just an unpolled one. ``` \
| eval yPositions = case(band="external",20, band="undiscovered",coalesce(y_hint,800), isnotnull(yPositions),yPositions, \
                         band="edge",100, band="core",300, band="spine",500, band="access",700, true(),900) \
| eval nodeColor  = case(band="external","#7F8C8D", band="undiscovered","#AEB6BF", node_kind="synthetic" AND band="endpoint","#546E7A", band="edge","#7C86FF", band="core","#2E6FE6", band="spine","#00B4D8", band="access","#0E8F8F", true(),"#6B7A8F") \
| eval nodeIcon   = case(src_type="unmanaged-peer",      "globe", \
                         src_type="undiscovered-device", "networkDevice", \
                         src_type="host",                "monitor", \
                         src_type="firewall",            "wallBricks", \
                         src_type="security",            "securityCamera", \
                         src_type="router",              "arrowsFourRightLeftUpDown", \
                         src_type="gateway",             "gate", \
                         src_type="switch",              "arrowsDoubleLeftRight", \
                         src_type="modular chassis",     "cube", \
                         src_type="load balancer",       "nodeTopology", \
                         src_type="server",              "servers", \
                         src_type="virtualization",      "serversCloud", \
                         src_type="storage",             "cylinderMulti", \
                         src_type="wireless",            "wifiSignal", \
                         src_type="printer",             "printer", \
                         src_type="hub",                 "deviceEdgeHub", \
                         src_type="management",          "slidersTripleHorizontal", \
                         src_type="power",               "cellularGateway", \
                         true(),                         "networkDevice") \
| table node_id node_name node_label_base mgmt_ip site src_type band band_conf node_kind has_adjacency degree y_hint first_seen last_seen is_stale yPositions nodeColor nodeIcon \
| outputlookup override_if_empty=false topology_tier_positions


