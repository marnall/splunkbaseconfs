[admin:dv_ai_assistant_user]
match = /dv_ai_assistant/admin
members = ai_chat, ai_run

[admin:dv_ai_assistant_admin]
match = /dv_ai_assistant/admin
members = ai_providers, ai_provider_test, ai_settings, ai_knowledge_base
capability = edit_ai_assistant

[admin_external:ai_providers]
handlertype = python
handlerfile = ai_providers_handler.py
handleractions = edit, list, create, remove

python.version = python3.9
python.required = 3.9, 3.13
[admin_external:ai_provider_test]
handlertype = python
handlerfile = ai_provider_test_handler.py
handleractions = list, create
handlerpersistentmode = true

python.version = python3.9
python.required = 3.9, 3.13
[admin_external:ai_chat]
handlertype = python
handlerfile = ai_chat_handler.py
handleractions = list, create
handlerpersistentmode = true

python.version = python3.9
python.required = 3.9, 3.13
[admin_external:ai_run]
handlertype = python
handlerfile = ai_run_handler.py
handleractions = list, create
handlerpersistentmode = true

python.version = python3.9
python.required = 3.9, 3.13
[admin_external:ai_settings]
handlertype = python
handlerfile = ai_settings_handler.py
handleractions = edit, list, create

python.version = python3.9
python.required = 3.9, 3.13
[admin_external:ai_knowledge_base]
handlertype = python
handlerfile = ai_knowledge_base_handler.py
handleractions = edit, list, create, remove

python.version = python3.9
python.required = 3.9, 3.13
[script:dv_ai_notable_update_action]
match = /dv_ai_notable_update/ai_notable_update_action
script = ai_notable_update.py
scripttype = persist
handler = ai_notable_update.AINotableUpdateHandler
requireAuthentication = true
output_modes = json
passPayload = true
passHttpHeaders = true

python.version = python3.9
python.required = 3.9, 3.13
[script:dv_ai_history_action]
match = /dv_ai_history/history
script = ai_history.py
scripttype = persist
handler = ai_history.AIHistoryHandler
requireAuthentication = true
output_modes = json
passPayload = true
passHttpHeaders = true
passSystemAuth = true
python.version = python3.9
python.required = 3.9, 3.13
