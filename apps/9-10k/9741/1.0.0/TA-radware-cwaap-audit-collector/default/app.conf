[launcher]
version = 1.0.0
description = Collects the Radware Cloud WAAP portal Activity Log (audit / user-activity log) through the Radware Cloud API and indexes it as JSON events in Splunk. Audit-only: security events are delivered by CWAAP Log Exporter.
author = Sean Ramati

[id]
version = 1.0.0
name = TA-radware-cwaap-audit-collector

[install]
build = 1788887829
is_configured = false
state = enabled

[package]
id = TA-radware-cwaap-audit-collector
check_for_updates = true

[ui]
label = Radware CWAAP Audit Log Collector
supported_themes = light, dark
is_visible = true

[triggers]
reload.ta_radware_cwaap_audit_collector_settings = simple
