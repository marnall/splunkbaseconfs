[radware:cwaap:audit]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 0
# Field names used by the legacy "Radware CWAF Event Collector" (Splunkbase 5281)
# so searches written for that add-on keep working.
FIELDALIAS-legacy_5281 = userEmail AS user trackingId AS id processTypeText AS details userIp AS userIP userCountry AS country userAgent AS user_agent
EVAL-activity = coalesce('activityType.Value', activityType)
EVAL-event_type = "activity"
