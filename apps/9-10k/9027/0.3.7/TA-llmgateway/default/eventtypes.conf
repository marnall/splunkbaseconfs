[llmgateway_request]
search = sourcetype="llmgateway:bifrost"

[llmgateway_success]
search = sourcetype="llmgateway:bifrost" llmgateway_status=success

[llmgateway_error]
search = sourcetype="llmgateway:bifrost" llmgateway_error_flag=true

[llmgateway_streaming_request]
search = sourcetype="llmgateway:bifrost" llmgateway_stream=true

[llmgateway_high_token_usage]
search = sourcetype="llmgateway:bifrost" llmgateway_tokens_total>10000

[llmgateway_off_hours]
search = sourcetype="llmgateway:bifrost" (llmgateway_hour_of_day<6 OR llmgateway_hour_of_day>20)

[llmgateway_tool_call]
search = sourcetype="llmgateway:bifrost" llmgateway_has_tools=true

[llmgateway_ollama]
search = sourcetype="llmgateway:bifrost" llmgateway_provider=ollama

[llmgateway_openai]
search = sourcetype="llmgateway:bifrost" llmgateway_provider=openai

[llmgateway_anthropic]
search = sourcetype="llmgateway:bifrost" llmgateway_provider=anthropic

[llmgateway_bedrock]
search = sourcetype="llmgateway:bifrost" llmgateway_provider=bedrock

[llmgateway_with_retry]
search = sourcetype="llmgateway:bifrost" llmgateway_retries>0

[llmgateway_litellm_request]
search = sourcetype="llmgateway:litellm"

[llmgateway_litellm_success]
search = sourcetype="llmgateway:litellm" llmgateway_status=success

[llmgateway_litellm_error]
search = sourcetype="llmgateway:litellm" llmgateway_error_flag=true

[llmgateway_litellm_tool_call]
search = sourcetype="llmgateway:litellm" llmgateway_has_tools=true
