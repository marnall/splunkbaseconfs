[llmgateway:bifrost]
SHOULD_LINEMERGE    = false
LINE_BREAKER        = ([\r\n]+)
TRUNCATE            = 0
KV_MODE             = none
INDEXED_EXTRACTIONS = json

TIME_PREFIX             = "timestamp":"
TIME_FORMAT             = %Y-%m-%dT%H:%M:%S.%7NZ
MAX_TIMESTAMP_LOOKAHEAD = 40

# Core request fields (flat JSON output from bifrost_logs.py)
FIELDALIAS-llmgateway_request_id     = id                 AS llmgateway_request_id
FIELDALIAS-llmgateway_model          = model              AS llmgateway_model
FIELDALIAS-llmgateway_provider       = provider           AS llmgateway_provider
FIELDALIAS-llmgateway_status         = status             AS llmgateway_status
FIELDALIAS-llmgateway_stream         = stream             AS llmgateway_stream
FIELDALIAS-llmgateway_call_type      = object             AS llmgateway_call_type
FIELDALIAS-llmgateway_latency_ms     = latency            AS llmgateway_latency_ms
FIELDALIAS-llmgateway_tokens_input   = prompt_tokens      AS llmgateway_tokens_input
FIELDALIAS-llmgateway_tokens_output  = completion_tokens  AS llmgateway_tokens_output
FIELDALIAS-llmgateway_tokens_total   = total_tokens       AS llmgateway_tokens_total
FIELDALIAS-llmgateway_key_name       = selected_key_name  AS llmgateway_key_name
FIELDALIAS-llmgateway_retries        = number_of_retries  AS llmgateway_retries
FIELDALIAS-llmgateway_virtual_key    = virtual_key_name   AS llmgateway_virtual_key
FIELDALIAS-llmgateway_routing_rule   = routing_rule_name  AS llmgateway_routing_rule
FIELDALIAS-llmgateway_user           = user_name          AS llmgateway_user
FIELDALIAS-llmgateway_team           = team_name          AS llmgateway_team
FIELDALIAS-llmgateway_customer       = customer_name      AS llmgateway_customer
FIELDALIAS-llmgateway_prompt_name    = selected_prompt_name    AS llmgateway_prompt_name
FIELDALIAS-llmgateway_prompt_version = selected_prompt_version AS llmgateway_prompt_version
FIELDALIAS-llmgateway_input          = input_prompt       AS llmgateway_input_prompt
FIELDALIAS-llmgateway_output         = output_text        AS llmgateway_output_text
FIELDALIAS-llmgateway_system         = system_prompt      AS llmgateway_system_prompt
FIELDALIAS-llmgateway_tools          = tool_calls         AS llmgateway_tool_calls
FIELDALIAS-llmgateway_cost           = cost               AS llmgateway_cost_total
FIELDALIAS-llmgateway_summary        = content_summary    AS llmgateway_content_summary
FIELDALIAS-llmgateway_finish         = stop_reason        AS llmgateway_finish_reason

# Derived fields
EVAL-llmgateway_gateway      = "bifrost"
EVAL-llmgateway_hour_of_day  = strftime(_time, "%H")
EVAL-llmgateway_day_of_week  = strftime(_time, "%A")
EVAL-llmgateway_error_flag   = if(status="error" OR status="failed", "true", "false")
EVAL-llmgateway_has_tools    = if(isnotnull(tool_calls) AND tool_calls!="", "true", "false")
EVAL-llmgateway_has_system   = if(isnotnull(system_prompt) AND system_prompt!="", "true", "false")
EVAL-llmgateway_large_payload = if(is_large_payload_request="true" OR is_large_payload_response="true", "true", "false")

[llmgateway:litellm]
SHOULD_LINEMERGE    = false
LINE_BREAKER        = ([\r\n]+)
TRUNCATE            = 0
KV_MODE             = none
INDEXED_EXTRACTIONS = json

TIME_PREFIX             = "timestamp":\s*"
TIME_FORMAT             = %Y-%m-%dT%H:%M:%S.%6NZ
MAX_TIMESTAMP_LOOKAHEAD = 40

# Core request fields
FIELDALIAS-llmgateway_li_model        = model               AS llmgateway_model
FIELDALIAS-llmgateway_li_provider     = custom_llm_provider AS llmgateway_provider
FIELDALIAS-llmgateway_li_model_group  = model_group         AS llmgateway_model_group
FIELDALIAS-llmgateway_li_deployment   = deployment          AS llmgateway_deployment
FIELDALIAS-llmgateway_li_status       = status              AS llmgateway_status
FIELDALIAS-llmgateway_li_stream       = stream              AS llmgateway_stream
FIELDALIAS-llmgateway_li_call_type    = call_type           AS llmgateway_call_type
FIELDALIAS-llmgateway_li_api_base     = api_base            AS llmgateway_api_base
FIELDALIAS-llmgateway_li_latency      = latency_ms          AS llmgateway_latency_ms
FIELDALIAS-llmgateway_li_finish       = finish_reason       AS llmgateway_finish_reason

# Tokens
FIELDALIAS-llmgateway_li_tok_in       = prompt_tokens       AS llmgateway_tokens_input
FIELDALIAS-llmgateway_li_tok_out      = completion_tokens   AS llmgateway_tokens_output
FIELDALIAS-llmgateway_li_tok_total    = total_tokens        AS llmgateway_tokens_total

# Cost
FIELDALIAS-llmgateway_li_cost         = response_cost       AS llmgateway_cost_total

# Prompts and response
FIELDALIAS-llmgateway_li_input        = input_prompt        AS llmgateway_input_prompt
FIELDALIAS-llmgateway_li_output       = output_text         AS llmgateway_output_text
FIELDALIAS-llmgateway_li_system       = system_prompt       AS llmgateway_system_prompt
FIELDALIAS-llmgateway_li_tools        = tool_calls          AS llmgateway_tool_calls

# Identity and tracing
FIELDALIAS-llmgateway_li_request_id   = request_id          AS llmgateway_request_id
FIELDALIAS-llmgateway_li_call_id      = call_id             AS llmgateway_call_id
FIELDALIAS-llmgateway_li_trace_id     = trace_id            AS llmgateway_trace_id
FIELDALIAS-llmgateway_li_user         = user                AS llmgateway_user
FIELDALIAS-llmgateway_li_key_alias    = api_key_alias       AS llmgateway_key_name
FIELDALIAS-llmgateway_li_team         = team_alias          AS llmgateway_team

# Nested standard_logging_object extractions
EVAL-llmgateway_requester_ip = spath(_raw, "standard_logging_object.metadata.requester_ip_address")
EVAL-llmgateway_user_agent   = spath(_raw, "standard_logging_object.metadata.user_agent")
EVAL-llmgateway_route        = spath(_raw, "standard_logging_object.metadata.user_api_key_request_route")

# Derived fields
EVAL-llmgateway_gateway      = "litellm"
EVAL-llmgateway_hour_of_day  = strftime(_time, "%H")
EVAL-llmgateway_day_of_week  = strftime(_time, "%A")
EVAL-llmgateway_error_flag   = if(status="error" OR status="failed", "true", "false")
EVAL-llmgateway_has_tools    = if(isnotnull(tool_calls) AND tool_calls!="null" AND tool_calls!="", "true", "false")
EVAL-llmgateway_has_system   = if(isnotnull(system_prompt) AND system_prompt!="", "true", "false")
