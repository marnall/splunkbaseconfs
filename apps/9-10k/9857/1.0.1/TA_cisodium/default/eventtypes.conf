# One eventtype per CIM dataset the feeds fill. Deleted records stay searchable
# (deleted=true) but are kept out of the data models.

[cisodium_incident]
search = sourcetype="cisodium:incident" deleted=false
description = Cisodium incidents (CIM Ticket Management: Incident)

[cisodium_vulnerability]
search = sourcetype="cisodium:vulnerability" deleted=false
description = Cisodium vulnerability findings (CIM Vulnerabilities)

[cisodium_asset_network]
search = sourcetype="cisodium:asset" (ip_address=* OR hostname=* OR fqdn=*)
description = Cisodium assets with a network identity (CIM Inventory: Network)

[cisodium_audit_authentication]
search = sourcetype="cisodium:audit" vendor_action IN ("login", "login_failed")
description = Sign-ins to Cisodium (CIM Authentication)

[cisodium_audit_change]
search = sourcetype="cisodium:audit" NOT vendor_action IN ("login", "login_failed", "logout")
description = Changes made in Cisodium (CIM Change)

[cisodium_audit_account]
search = sourcetype="cisodium:audit" (vendor_action IN ("password_reset", "password_change", "mfa_enable", "mfa_disable") OR entity_type="user")
description = Changes to Cisodium user accounts (CIM Change: Account Management)

[cisodium_risk]
search = sourcetype="cisodium:risk"
description = Cisodium risk register

[cisodium_control]
search = sourcetype="cisodium:control"
description = Cisodium security controls
