[expose:ta_cisodium_account]
pattern = ta_cisodium_account
methods = POST, GET

[expose:ta_cisodium_account_specified]
pattern = ta_cisodium_account/*
methods = POST, GET, DELETE

[expose:ta_cisodium_settings]
pattern = ta_cisodium_settings
methods = POST, GET

[expose:ta_cisodium_settings_specified]
pattern = ta_cisodium_settings/*
methods = POST, GET, DELETE

[expose:ta_cisodium_cisodium_feed]
pattern = ta_cisodium_cisodium_feed
methods = POST, GET

[expose:ta_cisodium_cisodium_feed_specified]
pattern = ta_cisodium_cisodium_feed/*
methods = POST, GET, DELETE

[expose:data/indexes]
pattern = data/indexes
methods = GET
