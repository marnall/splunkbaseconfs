# "Open in Cisodium" in the event actions menu of every record that has a page
# in Cisodium. `host` is the Cisodium tenant the record came from, `ui_path`
# the record's page there; the link is always https.
[cisodium_open_record]
label = Open in Cisodium
type = link
fields = ui_path
eventtypes = cisodium_*
display_location = both
link.method = get
link.target = blank
link.uri = https://$!host$$!ui_path$
