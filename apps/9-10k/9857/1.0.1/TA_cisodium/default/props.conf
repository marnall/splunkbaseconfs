# Cisodium Add-on — parsing and CIM mappings for the six Cisodium feeds.
#
# Each event is one Cisodium record as JSON. The modular input sets _time to the
# record's `event_time` (when it last changed); TIME_* below only matter if the
# JSON is ever ingested another way. Fields are extracted at search time.
#
# Splunk-reserved names never appear in the JSON: the add-on renames them
# (a record's `source`, e.g. nessus or microsoft-sentinel, is `cisodium_source`).
# `host` is the Cisodium tenant the record came from.
#
# EVALs in one stanza are computed independently of each other, from the
# extracted fields — `vendor_severity = severity` keeps the raw value even
# though `severity` is rewritten to the CIM vocabulary next to it.

[cisodium:incident]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 200000
TIME_PREFIX = "event_time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6NZ
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC
# Ticket Management (Incident)
FIELDALIAS-cisodium_incident_ticket = ref AS ticket_id
FIELDALIAS-cisodium_incident_users = assigned_to AS user reported_by AS src_user
FIELDALIAS-cisodium_incident_submitted = created_at AS time_submitted
EVAL-severity = case(lower(severity) IN ("critical", "high", "medium", "low"), lower(severity), lower(severity) IN ("info", "informational"), "informational", isnotnull(severity), "unknown")
EVAL-vendor_severity = severity
EVAL-severity_id = case(lower(severity) == "critical", 5, lower(severity) == "high", 4, lower(severity) == "medium", 3, lower(severity) == "low", 2, lower(severity) IN ("info", "informational"), 1)
EVAL-dest = mvindex('affected_systems{}', 0)
EVAL-vendor = "Cisodium"
EVAL-product = "Cisodium"
EVAL-vendor_product = "Cisodium"

[cisodium:vulnerability]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 200000
TIME_PREFIX = "event_time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6NZ
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC
# Vulnerabilities
FIELDALIAS-cisodium_vuln_cve = "cves{}" AS cve
FIELDALIAS-cisodium_vuln_cvss = cvss_score AS cvss
FIELDALIAS-cisodium_vuln_user = assigned_to AS user
FIELDALIAS-cisodium_vuln_url = "affected_urls{}" AS url
EVAL-signature = title
EVAL-signature_id = coalesce(external_id, ref)
EVAL-category = coalesce(owasp_category, cwe_id, cisodium_source, "vulnerability")
EVAL-dest = coalesce(fqdn, ip_address, mvindex('affected_assets{}', 0))
EVAL-dvc = host
EVAL-severity = case(lower(severity) IN ("critical", "high", "medium", "low"), lower(severity), lower(severity) IN ("info", "informational", "none"), "informational", isnotnull(severity), "unknown")
EVAL-vendor_severity = severity
EVAL-severity_id = case(lower(severity) == "critical", 5, lower(severity) == "high", 4, lower(severity) == "medium", 3, lower(severity) == "low", 2, lower(severity) IN ("info", "informational", "none"), 1)
EVAL-vendor = "Cisodium"
EVAL-product = "Cisodium"
EVAL-vendor_product = "Cisodium"

[cisodium:asset]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 200000
TIME_PREFIX = "event_time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6NZ
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC
# Inventory (Network)
FIELDALIAS-cisodium_asset_network = ip_address AS ip mac_address AS mac
EVAL-dest = coalesce(fqdn, hostname, ip_address, name)
EVAL-dns = coalesce(fqdn, hostname)
EVAL-vendor = "Cisodium"
EVAL-product = "Cisodium"
EVAL-vendor_product = "Cisodium"

