[cisodium:audit]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 200000
TIME_PREFIX = "event_time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6NZ
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC
# Change and Authentication. Cisodium's own verb stays in vendor_action.
FIELDALIAS-cisodium_audit_actor = ip_address AS src
FIELDALIAS-cisodium_audit_object = entity_type AS object_category
EVAL-vendor_action = action
EVAL-action = case(action == "login", "success", action == "login_failed", "failure", action == "logout", "logoff", action IN ("create", "upload", "import"), "created", action IN ("delete", "bulk_delete"), "deleted", action IN ("read", "export", "download"), "read", action == "unlock", "unlocked", isnotnull(action), "modified")
EVAL-status = if(action == "login_failed" OR lower(severity) IN ("error", "critical") OR tonumber('metadata.status_code') >= 400, "failure", "success")
EVAL-result = 'metadata.status_code'
EVAL-user = coalesce(user_email, user_name, user_id)
EVAL-object = coalesce(entity_name, entity_type, resource_type)
EVAL-object_id = coalesce(entity_id, resource_id)
EVAL-command = coalesce('metadata.method' . " " . 'metadata.path', action)
EVAL-change_type = "application"
EVAL-app = "cisodium"
EVAL-dest = host
EVAL-dvc = host
EVAL-vendor = "Cisodium"
EVAL-product = "Cisodium"
EVAL-vendor_product = "Cisodium"
