[admin:ta_cisodium_configuration]
match = /
members = ta_cisodium_account, ta_cisodium_settings

[admin:ta_cisodium_inputs]
match = /
members = ta_cisodium_cisodium_feed

[admin_external:ta_cisodium_account]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = ta_cisodium_rh_account.py
handleractions = edit, list, remove, create
handlerpersistentmode = true

[admin_external:ta_cisodium_settings]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = ta_cisodium_rh_settings.py
handleractions = edit, list
handlerpersistentmode = true

[admin_external:ta_cisodium_cisodium_feed]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = ta_cisodium_rh_cisodium_feed.py
handleractions = edit, list, remove, create
handlerpersistentmode = true
