[device.availability]
title = Device availability
description = Current vendor-reported reachability and operational status for a device.
subject = vertex:device
required_metrics = availability_status
metric_definitions = {"availability_status":{"display_name":"Availability status","unit":"state","value_type":"state","polarity":"categorical","allowed_values":["online","offline","alerting","dormant","unknown"]}}
state_values = ["ok","degraded","critical","unknown"]
disabled = 0
version = 1

[device.telemetry]
title = Device telemetry
description = Current control-plane resource utilization reported for a device.
subject = vertex:device
required_metrics = cpu_utilization_pct, memory_utilization_pct
metric_definitions = {"cpu_utilization_pct":{"display_name":"CPU utilization","unit":"pct","value_type":"number","polarity":"lower_is_better","valid_min":0,"valid_max":100},"memory_utilization_pct":{"display_name":"Memory utilization","unit":"pct","value_type":"number","polarity":"lower_is_better","valid_min":0,"valid_max":100}}
state_values = ["ok","degraded","critical","unknown"]
disabled = 0
version = 1

[interface.throughput]
title = Interface throughput
description = Directional interface throughput and traffic volume reported by a data source.
subject = vertex:interface
required_metrics = throughput_in_bps, throughput_out_bps
optional_metrics = throughput_total_bps, traffic_in_kb, traffic_out_kb, traffic_total_kb
metric_definitions = {"throughput_in_bps":{"display_name":"Inbound throughput","unit":"bps","value_type":"number","polarity":"neutral","valid_min":0},"throughput_out_bps":{"display_name":"Outbound throughput","unit":"bps","value_type":"number","polarity":"neutral","valid_min":0},"throughput_total_bps":{"display_name":"Total throughput","unit":"bps","value_type":"number","polarity":"neutral","valid_min":0},"traffic_in_kb":{"display_name":"Inbound traffic","unit":"KB","value_type":"number","polarity":"neutral","valid_min":0},"traffic_out_kb":{"display_name":"Outbound traffic","unit":"KB","value_type":"number","polarity":"neutral","valid_min":0},"traffic_total_kb":{"display_name":"Total traffic","unit":"KB","value_type":"number","polarity":"neutral","valid_min":0}}
state_values = ["ok","degraded","critical","unknown"]
disabled = 0
version = 1

[interface.power]
title = Interface power
description = Electrical energy delivered by a powered interface during an observation interval.
subject = vertex:interface
required_metrics = energy_delivered_wh
metric_definitions = {"energy_delivered_wh":{"display_name":"Energy delivered","unit":"Wh","value_type":"number","polarity":"neutral","valid_min":0}}
state_values = ["ok","degraded","critical","unknown"]
disabled = 0
version = 1

[interface.status]
title = Interface status
description = Operational, administrative, forwarding, power, and access-control status for an interface.
subject = vertex:interface
required_metrics = oper_status, admin_status
optional_metrics = is_uplink, speed, speed_bps, duplex, errors, warnings, error_count, warning_count, spanning_tree_statuses, poe_is_allocated, secure_port_active, secure_port_authentication_status, error_pct, discard_pct
metric_definitions = {"oper_status":{"display_name":"Operational status","unit":"state","value_type":"state","polarity":"categorical"},"admin_status":{"display_name":"Administrative status","unit":"state","value_type":"state","polarity":"categorical","allowed_values":["enabled","disabled"]},"is_uplink":{"display_name":"Is uplink","unit":"boolean","value_type":"boolean","polarity":"neutral"},"speed":{"display_name":"Negotiated speed","unit":"string","value_type":"string","polarity":"neutral"},"speed_bps":{"display_name":"Negotiated speed","unit":"bps","value_type":"number","polarity":"neutral","valid_min":0},"duplex":{"display_name":"Duplex","unit":"string","value_type":"string","polarity":"neutral"},"errors":{"display_name":"Errors","unit":"json","value_type":"json","polarity":"categorical"},"warnings":{"display_name":"Warnings","unit":"json","value_type":"json","polarity":"categorical"},"error_count":{"display_name":"Actionable error count","unit":"count","value_type":"number","polarity":"lower_is_better","valid_min":0},"warning_count":{"display_name":"Warning count","unit":"count","value_type":"number","polarity":"lower_is_better","valid_min":0},"spanning_tree_statuses":{"display_name":"Spanning tree statuses","unit":"json","value_type":"json","polarity":"categorical"},"poe_is_allocated":{"display_name":"PoE allocated","unit":"boolean","value_type":"boolean","polarity":"neutral"},"secure_port_active":{"display_name":"Secure port active","unit":"boolean","value_type":"boolean","polarity":"neutral"},"secure_port_authentication_status":{"display_name":"Secure port authentication status","unit":"string","value_type":"string","polarity":"categorical"},"error_pct":{"display_name":"Error rate","unit":"pct","value_type":"number","polarity":"lower_is_better","valid_min":0},"discard_pct":{"display_name":"Discard rate","unit":"pct","value_type":"number","polarity":"lower_is_better","valid_min":0}}
state_values = ["ok","degraded","critical","unknown"]
disabled = 0
version = 1

[interface.uplink_quality]
title = Interface uplink quality
description = Loss and latency observed from an uplink interface toward probe targets.
subject = vertex:interface
required_metrics = loss_pct, latency_ms
optional_metrics = target_ip, uplink
metric_definitions = {"loss_pct":{"display_name":"Loss","unit":"pct","value_type":"number","polarity":"lower_is_better","valid_min":0,"valid_max":100},"latency_ms":{"display_name":"Latency","unit":"ms","value_type":"number","polarity":"lower_is_better","valid_min":0},"target_ip":{"display_name":"Probe target","unit":"string","value_type":"string","polarity":"neutral"},"uplink":{"display_name":"Uplink","unit":"string","value_type":"string","polarity":"neutral"}}
state_values = ["ok","degraded","critical","unknown"]
disabled = 0
version = 1

