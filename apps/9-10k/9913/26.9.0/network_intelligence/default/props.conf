EVAL-display_category = if(endpoint_name="devices_topology_nodes_discovered", "discovered_neighbor", null())

EVAL-edge_type = if(endpoint_name IN ("devices_topology_l2_links", "devices_topology_nodes_discovered"), "connected_to", null())
