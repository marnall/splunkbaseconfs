EVAL-mac_address = if(endpoint_name="devices_topology_nodes_discovered", lower(replace(trim(nullif(nullif('discovered.mac', ""), "null")), "-", ":")), null())
EVAL-display_name = if(endpoint_name="devices_topology_nodes_discovered", coalesce(nullif(nullif('discovered.system.name', ""), "null"), 'discovered.derivedId'), null())
EVAL-short_name = if(endpoint_name="devices_topology_nodes_discovered", coalesce(nullif(nullif('discovered.system.name', ""), "null"), 'discovered.derivedId'), null())
