EVAL-src_id_value = case(endpoint_name="devices_topology_l2_links", 'source.device.id', endpoint_name="devices_topology_nodes_discovered", 'reporter.id', 1=1, null())
EVAL-dst_id_namespace = case(endpoint_name="devices_topology_l2_links", "vendor:meraki", endpoint_name="devices_topology_nodes_discovered", "source:meraki", 1=1, null())
EVAL-dst_id_type = case(endpoint_name="devices_topology_l2_links", "serial_number", endpoint_name="devices_topology_nodes_discovered", "internal_identifier", 1=1, null())
EVAL-dst_id_value = case(endpoint_name="devices_topology_l2_links", 'target.device.id', endpoint_name="devices_topology_nodes_discovered", 'discovered.derivedId', 1=1, null())
EVAL-src_interface_id_type = if(endpoint_name IN ("devices_topology_l2_links", "devices_topology_nodes_discovered"), "internal_identifier", null())
EVAL-src_interface_id_value = case(endpoint_name="devices_topology_l2_links", 'source.device.port.id', endpoint_name="devices_topology_nodes_discovered", 'reporter.interface.id', 1=1, null())
EVAL-dst_interface_id_type = if(endpoint_name IN ("devices_topology_l2_links", "devices_topology_nodes_discovered"), "internal_identifier", null())
EVAL-dst_interface_id_value = case(endpoint_name="devices_topology_l2_links", 'target.device.port.id', endpoint_name="devices_topology_nodes_discovered", 'discovered.port.id', 1=1, null())

EVAL-properties_json = case(endpoint_name="devices_topology_l2_links", json_object("link_id", linkId, "organization_id", organizationId), endpoint_name="devices_topology_nodes_discovered", json_object("organization_id", organizationId, "protocol", protocol, "reporter_id", 'reporter.id', "reporter_interface_id", 'reporter.interface.id', "reporter_interface_status", 'reporter.interface.status', "system_name", nullif(nullif('discovered.system.name', ""), "null"), "system_description", nullif(nullif('discovered.system.description', ""), "null"), "platform", nullif(nullif('discovered.system.platform', ""), "null"), "capabilities", json(coalesce(mv_to_json_array('discovered.system.capabilities{}', false()), "[]")), "chassis_id", nullif(nullif('discovered.chassis.id', ""), "null"), "port_id", nullif(nullif('discovered.port.id', ""), "null"), "addresses", json(coalesce(mv_to_json_array('discovered.addresses{}', false()), "[]"))), 1=1, null())

