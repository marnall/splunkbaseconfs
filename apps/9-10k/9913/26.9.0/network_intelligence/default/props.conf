#
# Network Intelligence — Field Aliases and Calculated Fields
#
# Maps each vendor's raw field names to NI standard field names that
# the data models expect. This is the normalization layer.
#
# Chain: raw fields → props.conf aliases/evals → data model fields
#

#
# ── Network Intelligence: Internal Logs ───────────────
#
# Component log files are written as network_intelligence.<component>.log under
# $SPLUNK_HOME/var/log/splunk by ni_app_logging.py.
#
[source::...(/|\\)var(/|\\)log(/|\\)splunk(/|\\)network_intelligence*]
TIME_PREFIX=^
TIME_FORMAT=%Y-%m-%d %H:%M:%S,%3N
LINE_BREAKER =([\r\n]+)\d{4}-\d{2}-\d{2}\s
SHOULD_LINEMERGE = false
TRUNCATE = 200000
MAX_TIMESTAMP_LOOKAHEAD = 23
sourcetype = network_intelligence_log

[network_intelligence_log]
description = Network Intelligence Internal Log
EXTRACT-pid = ^[^\n]*\spid=(?<pid>\d+)
EXTRACT-thread_id = ^[^\n]*\sthread_id=(?<thread_id>\d+)
EXTRACT-log_level = ^[^\n]*\s(?<log_level>DEBUG|INFO|WARNING|ERROR|CRITICAL)\s+\[
EXTRACT-component = ^[^\n]*\s(?:DEBUG|INFO|WARNING|ERROR|CRITICAL)\s+\[network_intelligence\.(?<component>[^\]]+)\]

#
# ── Meraki: Site Inventory (Networks) ──────────────────
#
[meraki:organizationsnetworks]
FIELDALIAS-ni_internal_identifier = id AS internal_identifier
FIELDALIAS-ni_site_name  = name AS site_name

EVAL-entity_type   = "site"
EVAL-display_name  = name
EVAL-short_name    = name
EVAL-entity_status = "active"
EVAL-internal_identifier_namespace = "source:meraki"
EVAL-source_system = "meraki"
EVAL-vendor        = "meraki"
EVAL-site_name_aliases = trim(name)
EVAL-organization_id = organizationId
EVAL-time_zone = timeZone
EVAL-site_tags = 'tags{}'
EVAL-site_notes = nullif(notes, "null")
EVAL-observed_ts = _time

#
# ── Meraki: Device Inventory ───────────────────────────
#
[meraki:devices]
FIELDALIAS-ni_device_name     = name AS device_name
FIELDALIAS-ni_serial_number = serial AS serial_number
FIELDALIAS-ni_device_model    = model AS device_model
FIELDALIAS-ni_mgmt_ip         = lanIp AS mgmt_ip
FIELDALIAS-ni_site_id         = networkId AS site_id
FIELDALIAS-ni_controller_id   = organizationId AS controller_id
FIELDALIAS-ni_device_product  = productType AS device_product_type
FIELDALIAS-ni_firmware_version = firmware AS firmware_version

EVAL-entity_type   = "device"
EVAL-mac_address = lower(replace(trim(mac), "-", ":"))
EVAL-display_name  = coalesce(name, serial)
EVAL-short_name    = coalesce(name, serial)
EVAL-entity_status = "active"
EVAL-site_id_namespace = "source:meraki"
EVAL-site_id_type = "internal_identifier"
EVAL-device_type   = productType
EVAL-device_vendor = "meraki"
EVAL-vendor        = "meraki"
EVAL-source_system = "meraki"
EVAL-ni_source     = "meraki_api"
EVAL-display_category = coalesce(productType, "device")
EVAL-geo_lat = tonumber(lat)
EVAL-geo_lon = tonumber(lng)
EVAL-entity_subtype = case(productType="appliance", "gateway", productType="switch", "switch", productType="wireless", "wireless_ap", productType="sensor", "sensor", productType="wirelessController", "wireless_controller", productType="camera", "camera", productType="cellularGateway", "cellular_gateway", productType="campusGateway", "campus_gateway", 1=1, null())
EVAL-observed_ts = _time

#
# ── Meraki: Switch Ports (Interface Traffic) ──────────
#   NOTE: Port-level fields (portId, status, speed, trafficInKbps.*)
#   are nested inside a ports{} JSON array (one event per switch).
#   EVAL/FIELDALIAS cannot flatten arrays, so the NI_Interface_Traffic
#   data model tstats path will not resolve per-port metrics.
#   The UI hooks use spath+mvexpand in fallback queries to flatten
#   the array at search time.
#
[meraki:switchportsbyswitch]
EVAL-device_vendor = "meraki"
EVAL-ni_source     = "meraki_api"
EVAL-observed_ts = _time

#
# ── NI Custom Input: Meraki ThousandEyes Extensions ───
