#
# NI_Alert normalization — Meraki assurance alerts.
#
# props.conf emits src/src_id/src_id_type/src_id_namespace directly. Resolving these to a Network
# Intelligence graph entity is NOT performed here or in NI_Alert.json — it happens via a
# lookup applied at query time.
#
# Two search-time ordering rules from the Splunk knowledge-object pipeline govern this
# stanza (https://help.splunk.com/en/splunk-enterprise/manage-knowledge-objects/knowledge-management-manual/10.4/get-started-with-knowledge-objects/the-sequence-of-search-time-operations):
#   1. FIELDALIAS (step 5) runs before EVAL calculated fields (step 6) — so aliasing
#      `type AS signature` / `severity AS vendor_severity` first is safe; the EVALs below
#      can read the aliased fields.
#   2. All EVAL-* in one stanza run IN PARALLEL — one EVAL cannot reference a field
#      produced by another EVAL in the same stanza. src, src_id, src_id_type, and
#      src_id_namespace are each computed independently off the raw JSON (each recomputes
#      the device-vs-site branch). Device-level src/src_id preserve all managed device
#      serials as multivalue fields.

[meraki:assurancealerts]
FIELDALIAS-ni_signature       = type AS signature
FIELDALIAS-ni_vendor_severity = severity AS vendor_severity

EVAL-app           = "meraki"
EVAL-type          = "alert"

# src components: device-level when scope.devices carries a managed device
# (has a serial), else site-level. scope.devices{} can also contain LLDP/CDP peer
# entries with no `serial` (only portIdentifier/lldpCdpPacket) — those must not be
# mistaken for a device-scoped alert, so serial is filtered for non-empty values.
# Each EVAL independently recomputes the branch (parallel EVALs can't reference each other).
EVAL-src         = if(mvcount(mvfilter(isnotnull('scope.devices{}.serial') AND 'scope.devices{}.serial'!="")) > 0, mvfilter(isnotnull('scope.devices{}.serial') AND 'scope.devices{}.serial'!=""), 'network.id')
EVAL-src_id      = if(mvcount(mvfilter(isnotnull('scope.devices{}.serial') AND 'scope.devices{}.serial'!="")) > 0, mvfilter(isnotnull('scope.devices{}.serial') AND 'scope.devices{}.serial'!=""), 'network.id')
EVAL-src_id_type = if(mvcount(mvfilter(isnotnull('scope.devices{}.serial') AND 'scope.devices{}.serial'!="")) > 0, "serial_number", "internal_identifier")
EVAL-src_id_namespace = if(mvcount(mvfilter(isnotnull('scope.devices{}.serial') AND 'scope.devices{}.serial'!="")) > 0, "vendor:meraki", "source:meraki")

EVAL-title       = coalesce(title, signature)
EVAL-description = coalesce(detailedDescription, description)

# severity: Meraki assurance alerts emit only critical/warning; unknown/absent -> informational.
# Reads aliased vendor_severity (alias ran in step 5).
EVAL-severity = case(vendor_severity=="critical","critical", vendor_severity=="warning","medium", 1==1,"informational")

# status: open/closed (active -> open; resolved/dismissed -> closed)
EVAL-status = if((isnotnull(resolvedAt) AND resolvedAt!="null") OR (isnotnull(dismissedAt) AND dismissedAt!="null"), "closed", "open")

# links: network.url is always populated. scope.devices{}.url is populated whenever
# a managed device is present (LLDP/CDP peer entries have no url key, so spath omits
# them from this multivalue field automatically — no extra filtering needed).
# scope.applications{}.url is populated on ThousandEyes-derived alert types
# (thousand_eyes_application_alert, insight_web_app) and points at the ThousandEyes
# alert detail page, not a Meraki dashboard link. mvappend requires 2+ args and
# rejects a bare null()-producing expression as its only argument, so link_type is
# always called with all 3 branches even though only network is guaranteed present.
# link_url/link_type stay as the flat CIM-style fields; link_record is the paired
# representation alerts/spl.py carries through — each mvmap branch stamps its own
# "type" literal onto its own url field, so pairing never depends on link_url and
# link_type staying positionally aligned (they don't: link_type collapses a
# multivalue network.url to a single "network" literal via mvcount()>0).
EVAL-link_url  = mvappend('network.url', 'scope.devices{}.url', 'scope.applications{}.url')
EVAL-link_type = mvappend(if(mvcount('network.url')>0,"network",null()), mvmap('scope.devices{}.url',"device"), mvmap('scope.applications{}.url',"application"))
EVAL-link_record = mvappend( \
    mvmap('network.url', json_object("type","network","url",'network.url')), \
    mvmap('scope.devices{}.url', json_object("type","device","url",'scope.devices{}.url')), \
    mvmap('scope.applications{}.url', json_object("type","application","url",'scope.applications{}.url')))

#
# NI_Alert normalization — Catalyst Center issues.
#
# This stanza follows the Alerts ERD v1 source-identifier contract used by the
# pending NI_Alert model update: props emits src/src_id/src_id_type/src_id_namespace
# and leaves graph vertex/canonical-key resolution to query-time lookup enrichment.
# Keep each EVAL independent because EVALs in one props stanza run in parallel.

[cisco:dnac:issue]
EVAL-id = IssueID

EVAL-source_system = "catalyst_center"
EVAL-app           = "catalyst_center"
EVAL-type          = "alert"

EVAL-src    = coalesce(DeviceMACAddress, DeviceSerialNumber, DeviceID, DeviceIpAddress, IssueSpecificEntityValue, host, cisco_catalyst_host)
EVAL-src_id = coalesce(lower(DeviceMACAddress), DeviceSerialNumber, if(match(lower(trim(DeviceID)), "^[0-9a-f]{2}(:[0-9a-f]{2}){5}$"), lower(trim(DeviceID)), DeviceID), DeviceIpAddress, if(match(lower(trim(IssueSpecificEntityValue)), "^[0-9a-f]{2}(:[0-9a-f]{2}){5}$"), lower(trim(IssueSpecificEntityValue)), IssueSpecificEntityValue), host, cisco_catalyst_host)
EVAL-src_id_type = case(isnotnull(DeviceMACAddress) AND DeviceMACAddress!="", "mac_address", isnotnull(DeviceSerialNumber) AND DeviceSerialNumber!="", "serial_number", isnotnull(DeviceID) AND DeviceID!="" AND match(lower(trim(DeviceID)), "^[0-9a-f]{2}(:[0-9a-f]{2}){5}$"), "mac_address", isnotnull(DeviceID) AND DeviceID!="", "internal_identifier", isnotnull(DeviceIpAddress) AND DeviceIpAddress!="", "ip_address", isnotnull(IssueSpecificEntityValue) AND IssueSpecificEntityValue!="" AND match(lower(trim(IssueSpecificEntityValue)), "^[0-9a-f]{2}(:[0-9a-f]{2}){5}$"), "mac_address", isnotnull(IssueSpecificEntityValue) AND IssueSpecificEntityValue!="", "internal_identifier", isnotnull(host) AND host!="", "custom", isnotnull(cisco_catalyst_host) AND cisco_catalyst_host!="", "custom", 1=1, null())
EVAL-src_id_namespace = case(isnotnull(DeviceMACAddress) AND DeviceMACAddress!="", "global", isnotnull(DeviceSerialNumber) AND DeviceSerialNumber!="", "vendor:cisco", isnotnull(DeviceID) AND DeviceID!="" AND match(lower(trim(DeviceID)), "^[0-9a-f]{2}(:[0-9a-f]{2}){5}$"), "global", isnotnull(DeviceID) AND DeviceID!="", "source:catalyst_center", isnotnull(DeviceIpAddress) AND DeviceIpAddress!="", "global", isnotnull(IssueSpecificEntityValue) AND IssueSpecificEntityValue!="" AND match(lower(trim(IssueSpecificEntityValue)), "^[0-9a-f]{2}(:[0-9a-f]{2}){5}$"), "global", isnotnull(IssueSpecificEntityValue) AND IssueSpecificEntityValue!="", "source:catalyst_center", isnotnull(host) AND host!="", "source:catalyst_center", isnotnull(cisco_catalyst_host) AND cisco_catalyst_host!="", "source:catalyst_center", 1=1, null())

EVAL-signature       = coalesce(IssueSpecificName, signature, IssueName, IssueSpecificCategory)
EVAL-vendor_severity = coalesce(IssueSpecificPriority, IssuePriority, IssueSpecificSeverity, severity)
EVAL-severity        = case(match(upper(coalesce(IssueSpecificPriority, IssuePriority, "")), "^P1$"), "critical", match(upper(coalesce(IssueSpecificPriority, IssuePriority, "")), "^P2$"), "high", match(upper(coalesce(IssueSpecificPriority, IssuePriority, "")), "^P3$"), "medium", match(upper(coalesce(IssueSpecificPriority, IssuePriority, "")), "^P4$"), "low", lower(coalesce(IssueSpecificSeverity, severity))=="critical", "critical", lower(coalesce(IssueSpecificSeverity, severity))=="high", "high", lower(coalesce(IssueSpecificSeverity, severity))=="medium", "medium", lower(coalesce(IssueSpecificSeverity, severity))=="low", "low", 1=1, "informational")

EVAL-title       = coalesce(IssueSpecificSummary, IssueName, title, IssueSpecificName, signature)
EVAL-description = coalesce(IssueSpecificDescription, description)
EVAL-status      = case(lower(IssueStatus)=="resolved", "closed", lower(IssueStatus)=="active", "open", 1=1, "open")

#
# NI_Alert normalization — ThousandEyes alert notifications.
#
# Each source alert produces separate trigger and clear webhook events. alert.id
# identifies the source alert across those lifecycle notifications; the top-level
# id identifies only the individual webhook event. testId resolves to the existing
# synthetic_test internal-identifier mapping in source:thousandeyes.
# Keep each EVAL independent because EVALs in one props stanza run in parallel.

[cisco:thousandeyes:alerts]
KV_MODE = json

EVAL-id            = coalesce('alert.id', id)
EVAL-source_system = "thousandeyes"
EVAL-app            = "thousandeyes"
EVAL-type           = "alert"

EVAL-src = coalesce(nullif(src, ""), 'alert.targets{}', testId, thousandeyes_test_id, 'alert.details{}.source.id')
EVAL-src_id = coalesce(nullif(testId, ""), nullif(thousandeyes_test_id, ""), 'alert.details{}.source.id', nullif(src, ""))
EVAL-src_id_type = case(isnotnull(testId) AND testId!="", "internal_identifier", isnotnull(thousandeyes_test_id) AND thousandeyes_test_id!="", "internal_identifier", mvcount('alert.details{}.source.id')>0, "internal_identifier", isnotnull(src) AND src!="", "custom", 1=1, null())
EVAL-src_id_namespace = case((isnotnull(testId) AND testId!="") OR (isnotnull(thousandeyes_test_id) AND thousandeyes_test_id!="") OR mvcount('alert.details{}.source.id')>0 OR (isnotnull(src) AND src!=""), "source:thousandeyes", 1=1, null())

EVAL-signature       = coalesce(nullif(signature, ""), nullif('alert.rule.name', ""), nullif('alert.type', ""), test_type)
EVAL-vendor_severity = upper(coalesce(vendor_severity, 'alert.severity'))
EVAL-severity        = case(upper(coalesce(vendor_severity, 'alert.severity'))=="CRITICAL", "critical", upper(coalesce(vendor_severity, 'alert.severity'))=="MAJOR", "high", upper(coalesce(vendor_severity, 'alert.severity'))=="MINOR", "low", upper(coalesce(vendor_severity, 'alert.severity'))=="INFO", "informational", 1=1, "informational")

EVAL-title = coalesce(nullif('alert.test.name', ""), nullif(test_description, ""), nullif(signature, ""), nullif('alert.rule.name', ""), nullif('alert.type', ""), nullif(src, ""), testId)
EVAL-description = coalesce(nullif(test_description, ""), nullif('alert.rule.expression', ""), nullif('alert.rule.notes', ""), 'alert.details{}.metricsAtStart')
EVAL-status = if(isnotnull('alert.cleared') AND tostring('alert.cleared')!="", "closed", "open")

EVAL-link_url = itsiDrilldownURI
EVAL-link_type = if(isnotnull(itsiDrilldownURI) AND itsiDrilldownURI!="", "test", null())
EVAL-link_record = if(isnotnull(itsiDrilldownURI) AND itsiDrilldownURI!="", json_object("type", "test", "url", itsiDrilldownURI), null())

# ── NI Capability Summary Observations ────────────────
#
[ni:capability:observation]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
TIME_PREFIX = "observed_ts":\s*
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 16
KV_MODE = json
