#
# Network Intelligence — Data Model Acceleration Settings
#
# Model definitions live in default/data/models/*.json
# This file only configures acceleration.
#

[NI_Inventory]
acceleration                = false
acceleration.earliest_time  = -1mon
acceleration.max_time       = 3600
acceleration.cron_schedule  = */5 * * * *

[NI_Topology]
acceleration                = false
acceleration.earliest_time  = -1mon
acceleration.max_time       = 3600
acceleration.cron_schedule  = */5 * * * *

# acceleration = false is a hard requirement here — AppInspect fails app
# submission if a shipped data model ships with acceleration = true.

[NI_Alert]
acceleration               = false
acceleration.earliest_time = -1mon
acceleration.max_time      = 3600
acceleration.cron_schedule = */5 * * * *
