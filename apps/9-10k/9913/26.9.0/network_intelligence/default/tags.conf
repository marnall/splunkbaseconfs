#
# Network Intelligence — Tag Assignments
#
# Tags connect event types to data model constraints. A single event type
# can carry multiple tags, placing it into multiple data models / datasets.
#
# Chain: eventtypes.conf → tags.conf → data model constraint
#

#
# ── Meraki → NI_Inventory.Devices ────────────────────
#
[eventtype=ni_meraki_device_inventory]
ni_device = enabled
ni_device_inventory = enabled
ni_inventory = enabled
ni_inventory_device = enabled

#
# ── Meraki → NI_Topology ──────────────────────────────
#
[eventtype=ni_meraki_discovered_topology]
ni_inventory = enabled
ni_inventory_discovered = enabled
ni_topology = enabled

[eventtype=ni_meraki_l2_topology_link]
ni_topology = enabled

#
# ── Meraki → NI_Topology (interface / uplink) ─────────
#
[eventtype=ni_meraki_switch_ports]
ni_interface = enabled

[eventtype=ni_meraki_uplink_addresses]
# Adapter-only source. The payload contains nested uplink/address records and
# does not emit complete canonical graph facts through props alone.

[eventtype=ni_meraki_sdwan_statuses]
# Adapter-only source. The payload contains nested tunnel/peer records and
# does not emit complete canonical graph facts through props alone.

[eventtype=ni_meraki_thousandeyes_extension]
# Relationship materialization is outside the initial L2 topology scope.

#
# ── Meraki → NI_Inventory.Sites ──────────────────────
#
[eventtype=ni_meraki_site_inventory]
ni_inventory = enabled
ni_inventory_site = enabled

#
# ── Catalyst Center → NI_Inventory / NI_Topology ─────
#
[eventtype=ni_catalyst_site_topology]
ni_inventory = enabled
ni_inventory_site = enabled

[eventtype=ni_catalyst_device_health]
ni_inventory = enabled
ni_inventory_device = enabled

[eventtype=ni_catalyst_interface_health]
ni_inventory = enabled
ni_inventory_interface = enabled

[eventtype=ni_catalyst_physical_topology]
# Adapter-only source. One event contains nested nodes and links.

#
# ── Meraki → NI_Alert ─────────────────────────────────
#
# NI_Alert reuses CIM's `alert` tag at the root (no NI-specific alert tag) —
# any TA already tagging `alert` on a CIM-compliant sourcetype gets partial
# credit for free.
[eventtype=ni_meraki_alert]
alert = enabled

#
# ── Catalyst Center → NI_Alert ────────────────────────
#
[eventtype=ni_catalyst_issue]
alert = enabled

#
# ── ThousandEyes → NI_Alert ───────────────────────────
#
[eventtype=ni_thousandeyes_alert]
alert = enabled
