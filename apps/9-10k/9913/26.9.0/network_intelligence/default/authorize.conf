# NI application capabilities and built-in roles.

#####################
## Capabilities
#####################

# Capabilities are namespaced ni_* to avoid collisions with Splunk built-ins.
# Effective capabilities are the additive union across all roles a user holds
# (FR45). Splunk platform admins get full NI access via capabilities granted
# directly on role_admin/role_sc_admin below; no other Splunk role implies
# any ni_* capability.

# Query topology endpoints: projections, vertices, edges, neighborhood.
[capability::ni_topology_read]
# Query health endpoints: subjects, metrics, history, dependencies.
[capability::ni_health_read]
# Query alert endpoints: devices/alerts, sites/alerts.
[capability::ni_alerts_read]
# Query synthetics endpoints: agent results, test history.
[capability::ni_synthetics_read]
# Read and write RBAC visibility policies (ni_rbac_policies KV collection).
[capability::ni_rbac_manage]
# Read and write NI app configuration via the NI Settings API (index routing,
# health thresholds, data source settings). Does not require Splunk admin.
[capability::ni_config_manage]
# Create or grant other users the ni_admin / ni_restricted_admin roles.
[capability::ni_admin_manage]

#####################
## Roles
#####################

## Splunk Admin / Splunk Cloud Admin
## Grant the ni_* capabilities directly on the platform admin roles (rather than
## importing role_ni_admin) so admin/sc_admin get full NI access out of the box.
## Capability flags are independent attributes and merge additively no matter
## what other apps' authorize.conf files also touch role_admin/role_sc_admin.
## importRoles does not: when Splunk merges two role_admin stanzas from
## different apps, whichever app sorts last (alphabetical order) wins the
## importRoles value outright, silently dropping ni_admin from the other.
[role_admin]
ni_topology_read = enabled
ni_health_read = enabled
ni_alerts_read = enabled
ni_synthetics_read = enabled
ni_rbac_manage = enabled
ni_config_manage = enabled
ni_admin_manage = enabled

[role_sc_admin]
ni_topology_read = enabled
ni_health_read = enabled
ni_alerts_read = enabled
ni_synthetics_read = enabled
ni_rbac_manage = enabled
ni_config_manage = enabled
ni_admin_manage = enabled

# Full NI access: all read and manage capabilities, plus ni_admin_manage (can
# create/grant other users the ni_admin or ni_restricted_admin roles).
# Assignable directly, and also imported by role_admin/role_sc_admin.
[role_ni_admin]
importRoles = user
ni_topology_read = enabled
ni_health_read = enabled
ni_alerts_read = enabled
ni_synthetics_read = enabled
ni_rbac_manage = enabled
ni_config_manage = enabled
ni_admin_manage = enabled

# All read capabilities plus RBAC/config management, but no ni_admin_manage,
# so it cannot create or grant other users the ni_admin/ni_restricted_admin roles.
[role_ni_restricted_admin]
importRoles = user
ni_topology_read = enabled
ni_health_read = enabled
ni_alerts_read = enabled
ni_synthetics_read = enabled
ni_rbac_manage = enabled
ni_config_manage = enabled

# All read capabilities, unrestricted visibility. No RBAC or config manage.
[role_ni_read_only]
importRoles = user
ni_topology_read = enabled
ni_health_read = enabled
ni_alerts_read = enabled
ni_synthetics_read = enabled

# Read capabilities only; visibility is restricted to whatever RBAC policy
# row is bound to the caller. Operators create one role per visibility scope
# (e.g. ni_region_apac) and pair it with the matching policy row.
[role_ni_scoped_read]
importRoles = user
ni_topology_read = enabled
ni_health_read = enabled
ni_alerts_read = enabled
ni_synthetics_read = enabled
