#
# Network Intelligence — Event Type Definitions
#
# Event types classify raw vendor events so that tags.conf can map them
# into NI data models. Each stanza name uses the ni_ prefix to avoid
# collisions with the Meraki TA's own event types.
#
# Chain: eventtypes.conf → tags.conf → data model constraint
#

#
# ── Meraki: Device Inventory ───────────────────────────
#
[ni_meraki_device_inventory]
search = sourcetype=meraki:devices

#
# ── Meraki: Topology ───────────────────────────────────
#
# The official Meraki add-on emits one normalized observation per L2 link or
# discovered node through its custom organization endpoints. Discovered-node
# observations participate in both inventory and topology.
[ni_meraki_discovered_topology]
search = sourcetype=meraki:custom endpoint_name=devices_topology_nodes_discovered

[ni_meraki_l2_topology_link]
search = sourcetype=meraki:custom endpoint_name=devices_topology_l2_links

#
# ── Meraki: Interface / Uplink ─────────────────────────
#
[ni_meraki_switch_ports]
search = sourcetype=meraki:switchportsbyswitch

[ni_meraki_uplink_addresses]
search = sourcetype=meraki:devicesuplinksaddressesbydevice

[ni_meraki_sdwan_statuses]
search = sourcetype=meraki:appliancesdwanstatuses

[ni_meraki_thousandeyes_extension]
search = sourcetype=meraki:extensions:thousandeyes

#
# ── Meraki: Site Inventory ──────────────────────────────
#
[ni_meraki_site_inventory]
search = sourcetype=meraki:organizationsnetworks

#
# ── Catalyst Center: Inventory and Topology ───────────
#
[ni_catalyst_site_topology]
search = sourcetype=cisco:dnac:site:topology

[ni_catalyst_device_health]
search = sourcetype=cisco:dnac:devicehealth

[ni_catalyst_interface_health]
search = sourcetype=cisco:dnac:devicehealth:interface

[ni_catalyst_physical_topology]
search = sourcetype=cisco:dnac:custom endpoint_name=topology_physical_topology

#
# ── Meraki: Assurance Alerts ───────────────────────────
#
[ni_meraki_alert]
search = sourcetype=meraki:assurancealerts

#
# ── Catalyst Center: Issues ───────────────────────────
#
[ni_catalyst_issue]
search = sourcetype=cisco:dnac:issue

#
# ── ThousandEyes: Alerts ──────────────────────────────
#
[ni_thousandeyes_alert]
search = sourcetype=cisco:thousandeyes:alerts
