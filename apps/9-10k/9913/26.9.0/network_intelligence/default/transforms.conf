[ni_canonical_entity_type_mappings_lookup]
filename = ni_canonical_entity_type_mappings.csv
case_sensitive_match = false

[ni_vertices_lookup]
external_type = kvstore
collection = ni_vertices
fields_list = _key, canonical_key, vertex_id, entity_type, entity_subtype, display_name, short_name, status, site_vertex_id, parent_vertex_id, region, geo_lat, geo_lon, vendor, source_systems, display_category, identity, properties, evidence_ref, overrides, last_observed_ts

[ni_vertex_mappings_lookup]
external_type = kvstore
collection = ni_vertex_mappings
fields_list = _key, mapping_key, canonical_key, mapping_id, vertex_id, source_system, id_namespace, id_type, id_value, entity_type, is_primary, last_observed_ts
max_matches = 1000

[ni_capability_vertex_coverage_lookup]
filename = ni_capability_vertex_coverage.csv
case_sensitive_match = false

[ni_capability_state_lookup]
external_type = kvstore
collection = ni_capability_state
fields_list = _key, subject, subject_class, subject_type, subject_id, subject_canonical_key, capability_id, binding_id, source_system, source_id_type, source_id, state, score, metrics_json, evidence_ref, observation_id, observed_ts, observed_ts_ms, materialized_ts, valid, error_message, updated_ts

[ni_edges_lookup]
external_type = kvstore
collection = ni_edges
fields_list = _key, canonical_key, edge_id, src_vertex_id, dst_vertex_id, src_interface_vertex_id, dst_interface_vertex_id, edge_type, directionality, source_systems, evidence_ref, properties, last_observed_ts

[ni_rbac_policies_lookup]
external_type = kvstore
collection = ni_rbac_policies
fields_list = _key, policy_id, app_role, description, visibility_expr, untagged_default, enabled, priority, updated_by, updated_ts, valid_to_ts

[ni_rbac_config_lookup]
external_type = kvstore
collection = ni_rbac_config
fields_list = _key, config_key, global_untagged_default, fail_mode, updated_by, updated_ts
