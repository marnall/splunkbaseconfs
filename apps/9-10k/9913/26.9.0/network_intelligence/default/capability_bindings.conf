[catalyst_center.device_telemetry]
capability_id = device.telemetry
title = Catalyst Center device telemetry
description = Maps Catalyst Center device health CPU and memory utilization onto device telemetry observations, using Catalyst's own health scores for state.
source_system = catalyst_center
base_search = `ni_indexes` sourcetype="cisco:dnac:devicehealth"
subject = vertex:device
subject_id_type = internal_identifier
subject_id_expr = DeviceID
subject_id_namespace = source:catalyst_center
materializer_group = catalyst_center_device
let.cpu_health_score = if(tonumber(CPUHealth)>=0, tonumber(CPUHealth), null())
let.memory_health_score = if(tonumber(MemoryUtilizationHealth)>=0, tonumber(MemoryUtilizationHealth), null())
metric.cpu_utilization_pct = if(tonumber(CPUUtilization)>=0, tonumber(CPUUtilization), null())
metric.memory_utilization_pct = if(tonumber(MemoryUtilization)>=0, tonumber(MemoryUtilization), null())
state_expr = case((cpu_health_score>=0 AND cpu_health_score<=2) OR (memory_health_score>=0 AND memory_health_score<=2), "critical", (cpu_health_score>=3 AND cpu_health_score<=7) OR (memory_health_score>=3 AND memory_health_score<=7), "degraded", (isnotnull(cpu_health_score) OR isnotnull(memory_health_score)) AND (isnull(cpu_health_score) OR (cpu_health_score>=8 AND cpu_health_score<=10)) AND (isnull(memory_health_score) OR (memory_health_score>=8 AND memory_health_score<=10)), "ok", 1=1, "unknown")
score_expr = case(state="critical", 0, state="degraded", 60, state="ok", 100, 1=1, null())
observed_time_expr = coalesce(tonumber(LastUpdateTime)/1000, _time)
aggregation_policy = {"current":"latest_observed"}
evidence_search_template = {"index":"cisco_dnac","sourcetype":"cisco:dnac:devicehealth","keys":{"device_id":"{DeviceID}","serial_number":"{SerialNumber}"}}
binding_status = active
disabled = 0
version = 1

