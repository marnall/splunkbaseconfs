[meraki.device_availability]
capability_id = device.availability
title = Meraki device availability
description = Maps Meraki device availability records onto device availability observations.
source_system = meraki
base_search = `ni_indexes` sourcetype="meraki:devicesavailabilities"
subject = vertex:device
subject_id_type = serial_number
subject_id_expr = serial
subject_id_namespace = vendor:meraki
materializer_group = meraki_device
metric.availability_status = lower(coalesce(status, "unknown"))
state_expr = case(availability_status="online", "ok", availability_status="offline", "critical", availability_status="alerting" OR availability_status="dormant", "degraded", 1=1, "unknown")
score_expr = case(state="ok", 100, state="degraded", 60, state="critical", 0, 1=1, null())
observed_time_expr = _time
aggregation_policy = {"current":"latest_observed"}
evidence_search_template = {"index":"meraki","sourcetype":"meraki:devicesavailabilities","keys":{"serial":"{serial}"}}
binding_status = active
disabled = 0
version = 1

[meraki.interface_throughput]
capability_id = interface.throughput
title = Meraki interface throughput
description = Maps Meraki switch port usage-history intervals onto interface throughput observations.
source_system = meraki
base_search = `ni_indexes` sourcetype="meraki:custom" endpoint_name="switch_ports_usage_history_by_device_by_interval"
subject = vertex:interface
subject_id_type = internal_identifier
subject_id_expr = trim(port_id)
parent_id_type = serial_number
parent_id_namespace = vendor:meraki
parent_id_expr = serial
materializer_group = meraki_interface
pre_transform_spl = | dedup serial
expansion_step.1 = {"path":"ports{}","output":"port_item","fields":{"portId":"port_id"}}
expansion_step.2 = {"input":"port_item","path":"intervals{}","output":"interval_item","fields":{"startTs":"interval_start_ts","endTs":"interval_end_ts","data.usage.total":"traffic_total_kb_raw","data.usage.upstream":"traffic_out_kb_raw","data.usage.downstream":"traffic_in_kb_raw","bandwidth.usage.total":"throughput_total_kbps_raw","bandwidth.usage.upstream":"throughput_out_kbps_raw","bandwidth.usage.downstream":"throughput_in_kbps_raw","energy.usage.total":"energy_delivered_wh_raw"}}
metric.throughput_in_bps = tonumber(throughput_in_kbps_raw)*1000
metric.throughput_out_bps = tonumber(throughput_out_kbps_raw)*1000
metric.throughput_total_bps = tonumber(throughput_total_kbps_raw)*1000
metric.traffic_in_kb = tonumber(traffic_in_kb_raw)
metric.traffic_out_kb = tonumber(traffic_out_kb_raw)
metric.traffic_total_kb = tonumber(traffic_total_kb_raw)
state_expr = case(isnotnull(throughput_in_bps) AND isnotnull(throughput_out_bps), "ok", 1=1, "unknown")
score_expr = case(state="ok", 100, 1=1, null())
observed_time_expr = coalesce(strptime(replace(interval_end_ts, "Z$", "+0000"), "%Y-%m-%dT%H:%M:%S.%6N%z"), _time)
aggregation_policy = {"current":"latest_observed","dedupe_fields":["subject_id","observed_ts"]}
evidence_search_template = {"index":"meraki","sourcetype":"meraki:custom","keys":{"endpoint_name":"{endpoint_name}","organization_id":"{organizationId}","serial":"{serial}","port_id":"{port_id}","interval_start_ts":"{interval_start_ts}","interval_end_ts":"{interval_end_ts}"}}
binding_status = active
disabled = 0
version = 1

