pre_transform_spl = | dedup serial
expansion_step.1 = {"path":"ports{}","output":"port_item","fields":{"portId":"port_id"}}
expansion_step.2 = {"input":"port_item","path":"intervals{}","output":"interval_item","fields":{"startTs":"interval_start_ts","endTs":"interval_end_ts","energy.usage.total":"energy_delivered_wh_raw"}}
let.energy_delivered_wh = tonumber(energy_delivered_wh_raw)
metric.energy_delivered_wh = energy_delivered_wh
state_expr = case(isnotnull(energy_delivered_wh), "ok", 1=1, "unknown")
score_expr = case(state="ok", 100, 1=1, null())
observed_time_expr = coalesce(strptime(replace(interval_end_ts, "Z$", "+0000"), "%Y-%m-%dT%H:%M:%S.%6N%z"), _time)
aggregation_policy = {"current":"latest_observed","dedupe_fields":["subject_id","observed_ts"]}
evidence_search_template = {"index":"meraki","sourcetype":"meraki:custom","keys":{"endpoint_name":"{endpoint_name}","organization_id":"{organizationId}","serial":"{serial}","port_id":"{port_id}","interval_start_ts":"{interval_start_ts}","interval_end_ts":"{interval_end_ts}"}}
binding_status = active
disabled = 0
version = 1

[meraki.interface_status]
capability_id = interface.status
title = Meraki interface status
description = Maps Meraki switch port status records onto normalized interface status observations.
source_system = meraki
base_search = `ni_indexes` sourcetype="meraki:custom" endpoint_name="switch_ports_statuses_by_switch"
subject = vertex:interface
subject_id_type = internal_identifier
subject_id_expr = trim(port_id)
parent_id_type = serial_number
parent_id_namespace = vendor:meraki
parent_id_expr = serial
materializer_group = meraki_interface
expansion_step.1 = {"path":"ports{}","output":"port_item","fields":{"portId":"port_id","enabled":"enabled_raw","status":"status_raw","isUplink":"is_uplink_raw","errors{}":"port_errors","warnings{}":"port_warnings","speed":"speed_raw","duplex":"duplex_raw","securePort.active":"secure_port_active_raw","securePort.authenticationStatus":"secure_port_authentication_status_raw","spanningTree.statuses{}":"spanning_tree_statuses_raw","poe.isAllocated":"poe_is_allocated_raw"}}
let.actionable_error_count = coalesce(mvcount(mvfilter(isnotnull(port_errors) AND lower(port_errors)!="port disconnected" AND lower(port_errors)!="port disabled")), 0)
let.warning_count = coalesce(mvcount(port_warnings), 0)
metric.oper_status = lower(status_raw)
metric.admin_status = case(lower(tostring(enabled_raw))="true", "enabled", lower(tostring(enabled_raw))="false", "disabled", 1=1, null())
metric.is_uplink = case(lower(tostring(is_uplink_raw))="true", true(), lower(tostring(is_uplink_raw))="false", false(), 1=1, null())
metric.speed = speed_raw
metric.speed_bps = case(match(lower(speed_raw), "^[0-9.]+ gbps$"), tonumber(mvindex(split(speed_raw, " "), 0))*1000000000, match(lower(speed_raw), "^[0-9.]+ mbps$"), tonumber(mvindex(split(speed_raw, " "), 0))*1000000, match(lower(speed_raw), "^[0-9.]+ kbps$"), tonumber(mvindex(split(speed_raw, " "), 0))*1000, match(lower(speed_raw), "^[0-9.]+ bps$"), tonumber(mvindex(split(speed_raw, " "), 0)), 1=1, null())
metric.duplex = lower(duplex_raw)
metric.errors = coalesce(mv_to_json_array(port_errors, false()), "[]")
metric.warnings = coalesce(mv_to_json_array(port_warnings, false()), "[]")
metric.error_count = actionable_error_count
metric.warning_count = warning_count
metric.spanning_tree_statuses = coalesce(mv_to_json_array(spanning_tree_statuses_raw, false()), "[]")
metric.poe_is_allocated = case(lower(tostring(poe_is_allocated_raw))="true", true(), lower(tostring(poe_is_allocated_raw))="false", false(), 1=1, null())
metric.secure_port_active = case(lower(tostring(secure_port_active_raw))="true", true(), lower(tostring(secure_port_active_raw))="false", false(), 1=1, null())
metric.secure_port_authentication_status = secure_port_authentication_status_raw
state_expr = case(lower(tostring(enabled_raw))="true" AND lower(status_raw)="disconnected" AND lower(tostring(is_uplink_raw))="true", "critical", actionable_error_count>0, "critical", warning_count>0, "degraded", isnotnull(status_raw) AND status_raw!="", "ok", 1=1, "unknown")
score_expr = case(state="critical", 0, state="degraded", 60, state="ok", 100, 1=1, null())
observed_time_expr = coalesce(strptime(replace(collection_time, "Z$", "+0000"), "%Y-%m-%dT%H:%M:%S.%6N%z"), _time)
aggregation_policy = {"current":"latest_observed"}
evidence_search_template = {"index":"meraki","sourcetype":"meraki:custom","keys":{"endpoint_name":"{endpoint_name}","organization_id":"{organizationId}","serial":"{serial}","port_id":"{port_id}","collection_time":"{collection_time}"}}
binding_status = active
disabled = 0
version = 1

[meraki.interface_uplink_quality]
capability_id = interface.uplink_quality
title = Meraki interface uplink quality
description = Maps Meraki uplink loss and latency time-series points onto interface uplink observations.
source_system = meraki
base_search = `ni_indexes` sourcetype="meraki:devicesuplinkslossandlatency"
subject = vertex:interface
subject_id_type = internal_identifier
subject_id_expr = trim(uplink)
parent_id_type = serial_number
parent_id_namespace = vendor:meraki
parent_id_expr = serial
materializer_group = meraki_interface
expansion_step.1 = {"path":"timeSeries{}","output":"ts_item","fields":{"ts":"point_ts","lossPercent":"loss_pct_raw","latencyMs":"latency_ms_raw"}}
let.loss_pct = tonumber(loss_pct_raw)
let.latency_ms = tonumber(latency_ms_raw)
metric.loss_pct = loss_pct
metric.latency_ms = latency_ms
metric.target_ip = ip
metric.uplink = uplink
state_expr = case(loss_pct>=20 OR latency_ms>=300, "critical", loss_pct>=5 OR latency_ms>=150, "degraded", isnotnull(loss_pct) OR isnotnull(latency_ms), "ok", 1=1, "unknown")
score_expr = case(state="critical", 0, state="degraded", 60, state="ok", 100, 1=1, null())
observed_time_expr = coalesce(strptime(replace(point_ts, "Z$", "+0000"), "%Y-%m-%dT%H:%M:%S%z"), strptime(point_ts, "%Y-%m-%dT%H:%M:%S%Z"), _time)
aggregation_policy = {"current":"latest_worst_state","dedupe_fields":["subject_id","target_ip","observed_ts"]}
evidence_search_template = {"index":"meraki","sourcetype":"meraki:devicesuplinkslossandlatency","keys":{"serial":"{serial}","uplink":"{uplink}","ip":"{ip}","point_ts":"{point_ts}"}}
binding_status = active
disabled = 0
version = 1

[thousandeyes.synthetic_network_quality]
capability_id = synthetic.network_quality
title = ThousandEyes synthetic network quality
description = Maps ThousandEyes network path metrics onto synthetic network quality observations.
source_system = thousandeyes
base_search = `ni_indexes` sourcetype="cisco:thousandeyes:metric"
subject = vertex:synthetic_test
subject_id_type = internal_identifier
subject_id_expr = test_id
subject_id_namespace = source:thousandeyes
materializer_group = thousandeyes_synthetic
pivot_policy = {"bucket_span":"5m","group_by":["test_id","agent_id","test_agent"],"aggregations":{"test_name":"latest(test_name)","test_type":"latest(test_type)","test_target":"latest(test_target)","permalink":"latest(permalink)","loss_pct":"latest(loss_value)","latency_ms":"latest(latency_value)","jitter_ms":"latest(jitter_value)","http_availability_raw":"latest(http_availability_value)","dns_availability_raw":"latest(dns_availability_value)","http_duration_raw":"latest(http_duration_value)","dns_duration_raw":"latest(dns_duration_value)"}}
metric.loss_pct = tonumber(loss_pct)
metric.latency_ms = tonumber(latency_ms)
metric.jitter_ms = tonumber(jitter_ms)
metric.test_type = test_type
state_expr = case(loss_pct>=10 OR latency_ms>=1000, "critical", loss_pct>0 OR latency_ms>=250, "degraded", isnotnull(loss_pct) AND isnotnull(latency_ms), "ok", 1=1, "unknown")
score_expr = case(state="critical", 0, state="degraded", 60, state="ok", 100, 1=1, null())
observed_time_expr = _time
aggregation_policy = {"current":"latest_complete_bucket","within_bucket":"latest"}
evidence_search_template = {"index":"thousandeyes","sourcetype":"cisco:thousandeyes:metric","keys":{"test_id":"{test_id}","agent_id":"{agent_id}","permalink":"{permalink}"}}
binding_status = active
disabled = 0
version = 1

