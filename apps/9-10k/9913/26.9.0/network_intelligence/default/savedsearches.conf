[Telemetry - Network Intelligence Graph]
description = Sends anonymous aggregate telemetry about the materialized Network Intelligence graph.
disabled = 0
enableSched = 1
is_visible = false
cron_schedule = 11 3 * * *
allow_skew = 100%
dispatch.earliest_time = -1d
dispatch.latest_time = now
search = | inputlookup ni_vertices_lookup \
 | eval entity_type=case(entity_type IN ("device","site","interface","discovered_neighbor","synthetic_agent","synthetic_test"), entity_type, 1=1, "other"), vertex_observed_ts=tonumber(last_observed_ts) \
 | stats count AS total_vertices \
     count(eval(entity_type="device")) AS vertex_device_count \
     count(eval(entity_type="site")) AS vertex_site_count \
     count(eval(entity_type="interface")) AS vertex_interface_count \
     count(eval(entity_type="discovered_neighbor")) AS vertex_discovered_neighbor_count \
     count(eval(entity_type="synthetic_agent")) AS vertex_synthetic_agent_count \
     count(eval(entity_type="synthetic_test")) AS vertex_synthetic_test_count \
     count(eval(entity_type="other")) AS vertex_other_count \
     max(vertex_observed_ts) AS latest_vertex_observed_ts \
 | eval total_edges=0, edge_connected_to_count=0, edge_runs_test_count=0, edge_other_count=0, edge_directed_count=0, edge_bidirectional_count=0, edge_directionality_other_count=0, latest_vertex_observed_ts=coalesce(tonumber(latest_vertex_observed_ts),0), latest_edge_observed_ts=0 \
 | fields total_vertices vertex_device_count vertex_site_count vertex_interface_count vertex_discovered_neighbor_count vertex_synthetic_agent_count vertex_synthetic_test_count vertex_other_count total_edges edge_connected_to_count edge_runs_test_count edge_other_count edge_directed_count edge_bidirectional_count edge_directionality_other_count latest_vertex_observed_ts latest_edge_observed_ts \
 | append [ | inputlookup ni_edges_lookup \
     | eval edge_type=case(edge_type IN ("connected_to","runs_test"), edge_type, 1=1, "other"), directionality=case(directionality IN ("directed","bidirectional"), directionality, 1=1, "other"), edge_observed_ts=tonumber(last_observed_ts) \
     | stats count AS total_edges \
         count(eval(edge_type="connected_to")) AS edge_connected_to_count \
         count(eval(edge_type="runs_test")) AS edge_runs_test_count \
         count(eval(edge_type="other")) AS edge_other_count \
         count(eval(directionality="directed")) AS edge_directed_count \
         count(eval(directionality="bidirectional")) AS edge_bidirectional_count \
         count(eval(directionality="other")) AS edge_directionality_other_count \
         max(edge_observed_ts) AS latest_edge_observed_ts \
     | eval total_vertices=0, vertex_device_count=0, vertex_site_count=0, vertex_interface_count=0, vertex_discovered_neighbor_count=0, vertex_synthetic_agent_count=0, vertex_synthetic_test_count=0, vertex_other_count=0, latest_vertex_observed_ts=0, latest_edge_observed_ts=coalesce(tonumber(latest_edge_observed_ts),0) \
     | fields total_vertices vertex_device_count vertex_site_count vertex_interface_count vertex_discovered_neighbor_count vertex_synthetic_agent_count vertex_synthetic_test_count vertex_other_count total_edges edge_connected_to_count edge_runs_test_count edge_other_count edge_directed_count edge_bidirectional_count edge_directionality_other_count latest_vertex_observed_ts latest_edge_observed_ts ] \
 | append [ | makeresults \
     | eval total_vertices=0, vertex_device_count=0, vertex_site_count=0, vertex_interface_count=0, vertex_discovered_neighbor_count=0, vertex_synthetic_agent_count=0, vertex_synthetic_test_count=0, vertex_other_count=0, total_edges=0, edge_connected_to_count=0, edge_runs_test_count=0, edge_other_count=0, edge_directed_count=0, edge_bidirectional_count=0, edge_directionality_other_count=0, latest_vertex_observed_ts=0, latest_edge_observed_ts=0 \
     | fields total_vertices vertex_device_count vertex_site_count vertex_interface_count vertex_discovered_neighbor_count vertex_synthetic_agent_count vertex_synthetic_test_count vertex_other_count total_edges edge_connected_to_count edge_runs_test_count edge_other_count edge_directed_count edge_bidirectional_count edge_directionality_other_count latest_vertex_observed_ts latest_edge_observed_ts ] \
 | stats sum(total_vertices) AS total_vertices \
     sum(vertex_device_count) AS vertex_device_count \
     sum(vertex_site_count) AS vertex_site_count \
     sum(vertex_interface_count) AS vertex_interface_count \
     sum(vertex_discovered_neighbor_count) AS vertex_discovered_neighbor_count \
     sum(vertex_synthetic_agent_count) AS vertex_synthetic_agent_count \
     sum(vertex_synthetic_test_count) AS vertex_synthetic_test_count \
     sum(vertex_other_count) AS vertex_other_count \
     sum(total_edges) AS total_edges \
     sum(edge_connected_to_count) AS edge_connected_to_count \
     sum(edge_runs_test_count) AS edge_runs_test_count \
     sum(edge_other_count) AS edge_other_count \
     sum(edge_directed_count) AS edge_directed_count \
     sum(edge_bidirectional_count) AS edge_bidirectional_count \
     sum(edge_directionality_other_count) AS edge_directionality_other_count \
     max(latest_vertex_observed_ts) AS latest_vertex_observed_ts \
     max(latest_edge_observed_ts) AS latest_edge_observed_ts \
 | eval latest_vertex_observed_ts=round(coalesce(tonumber(latest_vertex_observed_ts),0)/1000,3), latest_edge_observed_ts=round(coalesce(tonumber(latest_edge_observed_ts),0)/1000,3), data_available=if(total_vertices+total_edges>0,1,0) \
 | eval event=json_object("schema_version",1,"data_available",data_available,"total_vertices",total_vertices,"vertex_device_count",vertex_device_count,"vertex_site_count",vertex_site_count,"vertex_interface_count",vertex_interface_count,"vertex_discovered_neighbor_count",vertex_discovered_neighbor_count,"vertex_synthetic_agent_count",vertex_synthetic_agent_count,"vertex_synthetic_test_count",vertex_synthetic_test_count,"vertex_other_count",vertex_other_count,"total_edges",total_edges,"edge_connected_to_count",edge_connected_to_count,"edge_runs_test_count",edge_runs_test_count,"edge_other_count",edge_other_count,"edge_directed_count",edge_directed_count,"edge_bidirectional_count",edge_bidirectional_count,"edge_directionality_other_count",edge_directionality_other_count,"latest_vertex_observed_ts",latest_vertex_observed_ts,"latest_edge_observed_ts",latest_edge_observed_ts) \
 | fields event
action.outputtelemetry = 1
action.outputtelemetry.param.anonymous = 1
action.outputtelemetry.param.support = 1
action.outputtelemetry.param.license = 0
action.outputtelemetry.param.optinrequired = 3
action.outputtelemetry.param.component = app.NetworkIntelligence.graph
action.outputtelemetry.param.input = event
action.outputtelemetry.param.type = aggregate

[Telemetry - Network Intelligence Health]
description = Sends anonymous per-capability aggregate telemetry about Network Intelligence health state.
disabled = 0
enableSched = 1
is_visible = false
cron_schedule = 23 3 * * *
allow_skew = 100%
dispatch.earliest_time = -1d
dispatch.latest_time = now
search = | rest splunk_server=local report_as=text "/servicesNS/nobody/network_intelligence/api/v1/health/metrics_summary" \
 | spath input=value path=items{} output=summary_item \
 | mvexpand summary_item \
 | spath input=summary_item \
 | eval eligible_subject_count=coalesce(tonumber(eligible_subject_count),0), reporting_subject_count=coalesce(tonumber(reporting_subject_count),0), missing_eligible_subject_count=coalesce(tonumber(missing_eligible_subject_count),0), ok_count=coalesce(tonumber(ok_count),0), degraded_count=coalesce(tonumber(degraded_count),0), critical_count=coalesce(tonumber(critical_count),0), needs_attention_count=coalesce(tonumber(needs_attention_count),0), health_pct=coalesce(tonumber(health_pct),0), latest_observed_ts=coalesce(tonumber(latest_observed_ts),0), data_available=if(reporting_subject_count>0,1,0) \
 | sort 0 capability_id \
 | eval event=json_object("schema_version",1,"data_available",data_available,"capability_id",capability_id,"eligible_subject_count",eligible_subject_count,"reporting_subject_count",reporting_subject_count,"missing_eligible_subject_count",missing_eligible_subject_count,"ok_count",ok_count,"degraded_count",degraded_count,"critical_count",critical_count,"needs_attention_count",needs_attention_count,"health_pct",health_pct,"latest_observed_ts",latest_observed_ts) \
 | fields event
action.outputtelemetry = 1
action.outputtelemetry.param.anonymous = 1
action.outputtelemetry.param.support = 1
action.outputtelemetry.param.license = 0
action.outputtelemetry.param.optinrequired = 3
action.outputtelemetry.param.component = app.NetworkIntelligence.health
action.outputtelemetry.param.input = event
action.outputtelemetry.param.type = aggregate
