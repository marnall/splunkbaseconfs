[meraki.switchportsbyswitch.interface_vertex]
title = Meraki switch port interface vertices
description = Expands Meraki switch port inventory into MAC-parented canonical interface vertices.
source_system = meraki
source_sourcetype = meraki:switchportsbyswitch
base_search = `ni_indexes` sourcetype="meraki:switchportsbyswitch"
observed_time_expr = _time
expansion_step.1 = {"path":"ports{}","output":"port_item","fields":{"portId":"portId","name":"port_name","type":"port_type","enabled":"port_enabled","vlan":"vlan","voiceVlan":"voiceVlan","allowedVlans":"allowedVlans","activeVlans":"activeVlans","poeEnabled":"poeEnabled","linkNegotiation":"linkNegotiation","rstpEnabled":"rstpEnabled","stpGuard":"stpGuard","accessPolicyType":"accessPolicyType"}}
target = vertex:interface
identifier.internal_identifier = portId
parent.mac_address = lower(replace(trim(mac),"-",":"))
site.internal_identifier = coalesce('network.id',networkId)
site.internal_identifier.id_namespace = "source:meraki"
field.vendor = "meraki"
field.entity_subtype = "physical"
field.display_name = coalesce(port_name, portId)
field.short_name = coalesce(port_name, portId)
field.status = "active"
field.site_vertex_id = site_vertex_id
field.display_category = if(port_type="stack", "stack_port", "interface")
field.interface_id = portId
field.interface_name = coalesce(port_name, portId)
field.interface_type = if(port_type="stack", "stack", "wired")
field.admin_status = if(lower(tostring(port_enabled))="true", "enabled", "disabled")
field.is_uplink = 0
identity.internal_identifier = tostring(portId)
identity.interface_name = tostring(coalesce(port_name, portId))
identity.parent_device_mac = parent.mac_address
property.port_mode = port_type
property.vlan = vlan
property.voice_vlan = voiceVlan
property.allowed_vlans = allowedVlans
property.active_vlans = activeVlans
property.poe_enabled = poeEnabled
property.link_negotiation = linkNegotiation
property.rstp_enabled = rstpEnabled
property.stp_guard = stpGuard
property.access_policy_type = accessPolicyType
property.network_id = site_id
evidence_ref_template = {"index":"{index}","sourcetype":"{sourcetype}","source":"{source}","host":"{host}","keys":{"serial":"{serial}","port_id":"{portId}"}}
adapter_status = active
disabled = 0
version = 1

[meraki.devicesuplinksaddressesbydevice.uplink_interface_vertex]
title = Meraki device uplink interface vertices
description = Expands Meraki uplink records into MAC-parented WAN and management interface vertices.
source_system = meraki
source_sourcetype = meraki:devicesuplinksaddressesbydevice
base_search = `ni_indexes` sourcetype="meraki:devicesuplinksaddressesbydevice"
observed_time_expr = _time
expansion_step.1 = {"path":"uplinks{}","output":"uplink_item"}
target = vertex:interface
let.addresses_json = coalesce(json_extract(uplink_item, "addresses"), "[]")
identifier.internal_identifier = interface
parent.mac_address = lower(replace(trim(mac),"-",":"))
site.internal_identifier = coalesce('network.id',networkId)
site.internal_identifier.id_namespace = "source:meraki"
field.vendor = "meraki"
field.entity_subtype = if(match(lower(interface), "^man"), "management", "uplink")
field.display_name = interface
field.short_name = interface
field.status = "active"
field.site_vertex_id = site_vertex_id
field.display_category = if(match(lower(interface), "^man"), "management_interface", "uplink")
field.interface_id = interface
field.interface_name = interface
field.interface_type = if(match(lower(interface), "^man"), "management", if(match(lower(interface), "cell"), "cellular", "wan"))
field.admin_status = "unknown"
field.is_uplink = 1
identity.internal_identifier = tostring(interface)
identity.interface_name = tostring(interface)
identity.parent_device_mac = parent.mac_address
property.network_id = site_id
property.addresses = addresses_json
evidence_ref_template = {"index":"{index}","sourcetype":"{sourcetype}","source":"{source}","host":"{host}","keys":{"serial":"{serial}","uplink_interface":"{interface}"}}
adapter_status = active
disabled = 0
version = 1

[catalyst_center.physical_topology.connected_to_edge]
title = Catalyst Center physical connected_to edges
description = Expands physical links into normalized Catalyst Center device and interface identifier tuples.
source_system = catalyst_center
source_sourcetype = cisco:dnac:custom
base_search = `ni_indexes` sourcetype="cisco:dnac:custom" endpoint_name="topology_physical_topology"
expansion_step.1 = {"path":"links{}","output":"link_item","fields":{"source":"src_device_id","target":"dst_device_id","startPortID":"src_interface_id","endPortID":"dst_interface_id","linkStatus":"link_status","id":"link_id"}}
observed_time_expr = coalesce(collection_time, _time)
target = edge:connected_to
edge.directionality = "bidirectional"
edge.src_id_namespace = "source:catalyst_center"
edge.src_id_type = "internal_identifier"
edge.src_id_value = src_device_id
edge.dst_id_namespace = "source:catalyst_center"
edge.dst_id_type = "internal_identifier"
edge.dst_id_value = dst_device_id
edge.src_interface_id_namespace = "source:catalyst_center"
edge.src_interface_id_type = "internal_identifier"
edge.src_interface_id_value = src_interface_id
edge.dst_interface_id_namespace = "source:catalyst_center"
edge.dst_interface_id_type = "internal_identifier"
edge.dst_interface_id_value = dst_interface_id
property.link_id = link_id
property.link_status = link_status
evidence_ref_template = {"index":"{index}","sourcetype":"{sourcetype}","source":"{source}","host":"{host}","keys":{"link_id":"{link_id}","src_device_id":"{src_device_id}","dst_device_id":"{dst_device_id}","src_interface_id":"{src_interface_id}","dst_interface_id":"{dst_interface_id}"}}
adapter_status = active
disabled = 0
version = 1

[thousandeyes.metric.synthetic_agent_vertex]
title = ThousandEyes synthetic agent vertices
description = Reduces metric observations into one source-agent vertex per ThousandEyes agent.
source_system = thousandeyes
source_sourcetype = cisco:thousandeyes:metric
base_search = `ni_indexes` sourcetype="cisco:thousandeyes:metric"
observed_time_expr = observed_ts
target = vertex:synthetic_agent
identifier.internal_identifier = agent_id
identifier.internal_identifier.id_namespace = "source:thousandeyes"
field.vendor = "thousandeyes"
field.display_name = coalesce(agent_name,agent_id)
field.short_name = coalesce(agent_name,agent_id)
field.display_category = "synthetic_agent"
identity.internal_identifier = tostring(agent_id)
identity.internal_identifier_namespace = "source:thousandeyes"
property.account_id = account_id
property.location = agent_location
property.country_iso = agent_country_iso
property.region_iso = agent_region_iso
property.geoname_id = agent_geoname_id
evidence_ref_template = {"index":"{index}","sourcetype":"{sourcetype}","source":"{source}","host":"{host}","keys":{"agent_id":"{agent_id}"}}
adapter_status = active
disabled = 0
version = 1

[thousandeyes.metric.synthetic_test_vertex]
title = ThousandEyes synthetic test vertices
description = Reduces metric observations into one vertex per ThousandEyes test, including tests without source agents.
source_system = thousandeyes
source_sourcetype = cisco:thousandeyes:metric
base_search = `ni_indexes` sourcetype="cisco:thousandeyes:metric"
observed_time_expr = observed_ts
target = vertex:synthetic_test
identifier.internal_identifier = test_id
identifier.internal_identifier.id_namespace = "source:thousandeyes"
field.vendor = "thousandeyes"
field.display_name = coalesce(test_name,test_id)
field.short_name = coalesce(test_name,test_id)
field.display_category = "synthetic_test"
identity.internal_identifier = tostring(test_id)
identity.internal_identifier_namespace = "source:thousandeyes"
property.account_id = account_id
property.test_types = mv_to_json_array(test_type,false())
property.server_addresses = mv_to_json_array(server_address,false())
property.target_agent = if(isnotnull(target_agent_id),json_object("id",target_agent_id,"name",target_agent_name,"location",target_agent_location,"country_iso",target_agent_country_iso,"region_iso",target_agent_region_iso,"geoname_id",target_agent_geoname_id),null())
evidence_ref_template = {"index":"{index}","sourcetype":"{sourcetype}","source":"{source}","host":"{host}","keys":{"test_id":"{test_id}"}}
adapter_status = active
disabled = 0
version = 1

[thousandeyes.metric.runs_test_edge]
title = ThousandEyes agent runs test edges
description = Materializes one directed runs_test edge for each observed source-agent and test pair.
source_system = thousandeyes
source_sourcetype = cisco:thousandeyes:metric
base_search = `ni_indexes` sourcetype="cisco:thousandeyes:metric"
observed_time_expr = observed_ts
target = edge:runs_test
edge.directionality = "directed"
edge.src_id_namespace = "source:thousandeyes"
edge.src_id_type = "internal_identifier"
edge.src_id_value = agent_id
edge.dst_id_namespace = "source:thousandeyes"
edge.dst_id_type = "internal_identifier"
edge.dst_id_value = test_id
property.account_id = account_id
property.permalink = permalink
evidence_ref_template = {"index":"{index}","sourcetype":"{sourcetype}","source":"{source}","host":"{host}","keys":{"agent_id":"{agent_id}","test_id":"{test_id}"}}
adapter_status = active
disabled = 0
version = 1
