#
# Network Intelligence — Data Source Configuration
#
# One stanza per OOTB source_system. Ships with every source disabled and no
# indexes configured. Enable a source through the settings API or CLI, which
# validates indexes/interval and recomputes ni_indexes and the source's
# adapters, bindings, and saved searches as one transaction. Do not hand-edit
# local/data_sources.conf directly outside that flow — it will not recompute
# the dependent state.
#

[meraki]
indexes =
collection_interval_s =
disabled = 1

[catalyst_center]
indexes =
collection_interval_s =
disabled = 1

[thousandeyes]
indexes =
collection_interval_s =
disabled = 1
