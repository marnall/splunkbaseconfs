# NI App — data-layer tunables
#
# This file contains settings owned by the NI application data layer.
# It intentionally contains only settings that have no equivalent in Splunk's own
# limits.conf; Splunk-governed caps (e.g. max_documents_per_batch_save in
# limits.conf [kvstore]) are NOT duplicated here — they are enforced server-side.

[kvstore]
# Maximum number of values included in a single $in clause when querying KV Store.
# This is NOT a KV Store record limit.  It works around the KV Store query being
# serialized into the HTTP request URL: very large $in arrays overflow the URL and
# produce HTTP 431 (Request Header Fields Too Large) from the Splunk REST API.
# Reduce if you observe 431 errors; increase only with caution on large deployments.
# No equivalent setting exists in limits.conf.
query_in_clause_chunk_size = 50


[topology]
# Hop policy for GET /api/v1/graph/topology/l2. Both values must be positive,
# and default_hops must not exceed max_hops. Invalid values fall back safely to
# the shipped defaults below.
default_hops = 1
max_hops = 3


[graph_configuration]
identifier_types = serial_number, mac_address, internal_identifier, ifindex


[collection]
# Global collection cadence for the cross-source Path-1 data-model searches
# (NI_Inventory/NI_Topology/NI_Alert), and the fallback for any data source that
# does not set its own collection_interval_s in data_sources.conf. Must be one of
# the fixed preset set: 60, 300, 900, 1800, 3600 (seconds).
default_collection_interval_s = 300


[alerts]
# Search job artifact TTL and the KV Store snapshot binding's expiry — kept equal
# so a snapshot row never outlives the job it points at.
snapshot_ttl_seconds = 600
# Bounded poll ceiling (ms) after job creation before returning snapshot.state=running
# instead of waiting for the search to finish. Capped backoff: 100ms -> 500ms.
snapshot_create_wait_ms = 3000
# Bounded poll ceiling (ms) for GET /api/v1/alerts/summary before the job is
# cancelled and the request fails with 503 search_unavailable. Larger than
# snapshot_create_wait_ms: the summary response has no sid cursor, so a slow
# aggregate has no partial-result fallback to return instead of waiting longer.
summary_create_wait_ms = 5000
# max_count passed to the search job — also the hard cap on total pageable rows.
max_snapshot_rows = 10000
# Default/maximum `limit` accepted on GET /api/v1/alerts.
default_limit = 50
max_limit = 1000
# max_time passed to the search job (seconds).
search_max_time = 60
