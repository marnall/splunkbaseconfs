#
# Network Intelligence — Search Macros
#
# ni_indexes is the single index-scoping point for NI data models. Its shipped
# default is index=main — deployments override this in local/macros.conf to
# point at their real indexes. Do not add per-model index-scoping macros;
# reuse this one.

[ni_indexes]
definition = index=main
iseval = 0

# ni_alert_subject_resolution resolves an alert's source-native identifier to
# candidate graph vertices at query time. Resolution is namespace-scoped with a
# namespace-free fallback, matching the graph-wide mapping contract
# (docs/graph_topology/README.md: prefer (id_namespace, id_type, id_value);
# namespace-free resolution only when the caller cannot establish a namespace)
# and mirroring [NI - Populate Graph Edges] in savedsearches.conf. Both the
# exact and the namespace-free lookup run on every row and the per-row
# selection happens in eval, because SPL cannot branch on a stage. Both paths
# are index-backed by ni_vertex_mappings' namespaced_lookup_accel and
# unscoped_lookup_accel accelerated_fields (collections.conf).
#
# The namespace-presence guard is load-bearing, not defensive: cisco:dnac:issue's
# EVAL-src_id_namespace (props.conf) ends in a `1=1, null()` branch, so
# src_id_namespace can legitimately be null. Selecting the namespace-free result
# explicitly on a null/empty namespace keeps correctness independent of what
# `lookup` does with a null input field.
#
# Resolution stays candidate-only within the selected path: a namespace narrows
# the match but never picks a winner. Multiple surviving candidates still emit
# multiple rows for the caller to classify via resolution_state.
#
# Args: row_key (a value stable per source event, e.g. app.":".id.":". _time),
# id_type (field holding the identifier kind, e.g. src_id_type), id_value
# (field holding the identifier value, possibly multivalue, e.g. src_id),
# id_namespace (field holding the identifier namespace, possibly null, e.g.
# src_id_namespace). All four are field names, not literals.
#
# Row multiplicity contract: emits one row per (row_key, identifier value,
# surviving candidate vertex). A missing id_value still emits one row per
# row_key via the __NI_NO_ID__ sentinel so callers can detect
# missing_identifier; an id_value with no matching vertex in the selected
# namespace path still emits one row via the __NI_NO_VERTEX__ sentinel so
# callers can detect unmatched_identifier. Callers are expected to regroup with
# stats — this macro intentionally does not, so summary/vertex/edge callers can
# regroup differently.
#
# ni_exact_vertex_id / ni_unscoped_vertex_id are scratch multivalue fields and
# are dropped before `mvexpand ni_cand_vertex_id`: keeping them would multiply
# mvexpand's per-row memory and leak two candidate lists into callers' stats.
#
# The `mvexpand ni_res_id limit=50` below is an intentional constant, not a
# tunable — it is not wired to any ni_settings.conf setting. 50 distinct
# identifier values per alert is expected to be generous for any single
# source event; raise it here directly if that assumption ever breaks.
[ni_alert_subject_resolution(4)]
args = row_key, id_type, id_value, id_namespace
definition = eval ni_res_id_present=if(isnull($id_value$) OR mvcount($id_value$)=0, 0, 1), \
    ni_res_id=coalesce($id_value$, "__NI_NO_ID__"), \
    ni_row_key=$row_key$ \
    | mvexpand ni_res_id limit=50 \
    | lookup ni_vertex_mappings_lookup id_namespace AS $id_namespace$ id_type AS $id_type$ id_value AS ni_res_id \
        OUTPUT vertex_id AS ni_exact_vertex_id \
    | lookup ni_vertex_mappings_lookup id_type AS $id_type$ id_value AS ni_res_id \
        OUTPUT vertex_id AS ni_unscoped_vertex_id \
    | eval ni_cand_vertex_id=if(isnotnull($id_namespace$) AND $id_namespace$!="", ni_exact_vertex_id, ni_unscoped_vertex_id), \
        ni_cand_vertex_id=coalesce(mvdedup(ni_cand_vertex_id), "__NI_NO_VERTEX__") \
    | fields - ni_exact_vertex_id ni_unscoped_vertex_id \
    | mvexpand ni_cand_vertex_id \
    | lookup ni_vertices_lookup vertex_id AS ni_cand_vertex_id \
        OUTPUT canonical_key AS ni_canonical_key \
            display_name AS ni_display_name entity_type AS ni_entity_type \
            site_vertex_id AS ni_site_vertex_id \
    | where ni_cand_vertex_id="__NI_NO_VERTEX__" \
        OR (isnotnull(ni_canonical_key) AND ni_canonical_key!="") \
    | eval ni_matched=if(ni_cand_vertex_id="__NI_NO_VERTEX__", 0, 1)
iseval = 0

# Shared base extraction for the ThousandEyes capability observation
# materializers (savedsearches.conf) — one cisco:thousandeyes:metric scan and
# vertex lookup feeds all three synthetic.* bindings instead of each stanza
# repeating it. Excludes the base_search (index/sourcetype scoping) so callers
# supply that themselves, matching how a future compiler would assemble
# <base_search> + <pre_transform_spl> + ... from capability_bindings.conf.
[ni_thousandeyes_synthetic_metric_base]
definition = | eval test_id=coalesce('thousandeyes.test.id', testId), agent_id=coalesce('thousandeyes.source.agent.id', agentId, 'agent.agentId'), agent_name=coalesce('thousandeyes.source.agent.name', agentName, 'agent.agentName'), test_name=coalesce('thousandeyes.test.name', testName), test_type=coalesce('thousandeyes.test.type', testType), test_target=coalesce('thousandeyes.test.target', target, server, dest, 'alert.targets{}.name'), permalink=coalesce('thousandeyes.permalink', permalink), metric_name=coalesce(metric_name, metricName, name), metric_value=coalesce(metric_value, metricValue, value), test_agent=test_id.":".agent_id \
 | where isnotnull(test_id) AND test_id!="" AND isnotnull(agent_id) AND agent_id!="" \
 | eval loss_value=coalesce('metric_name:network.loss', if(metric_name="network.loss", metric_value, null())), latency_value=coalesce('metric_name:network.latency', if(metric_name="network.latency", metric_value, null())), jitter_value=coalesce('metric_name:network.jitter', if(metric_name="network.jitter", metric_value, null())) \
 | eval http_availability_value=coalesce('metric_name:http.server.request.availability', if(metric_name="http.server.request.availability", metric_value, null()), if(metric_name="http.server.availability", metric_value, null())), dns_availability_value=coalesce('metric_name:dns.lookup.availability', if(metric_name="dns.lookup.availability", metric_value, null())) \
 | eval http_duration_value=coalesce('metric_name:http.client.request.duration', 'metric_name:http.server.responseTime', if(metric_name="http.client.request.duration", metric_value, null()), if(metric_name="http.server.responseTime", metric_value, null())), dns_duration_value=coalesce('metric_name:dns.lookup.duration', if(metric_name="dns.lookup.duration", metric_value, null())) \
 | eval evidence_index = coalesce(nullif(index, ""), mvindex(_si, 1)), evidence_source = source, evidence_host = host \
 | bin _time span=5m \
 | stats latest(test_name) as test_name latest(test_type) as test_type latest(test_target) as test_target latest(permalink) as permalink latest(loss_value) as loss_pct latest(latency_value) as latency_ms latest(jitter_value) as jitter_ms latest(http_availability_value) as http_availability_raw latest(dns_availability_value) as dns_availability_raw latest(http_duration_value) as http_duration_raw latest(dns_duration_value) as dns_duration_raw latest(evidence_index) as evidence_index latest(evidence_source) as evidence_source latest(evidence_host) as evidence_host by _time test_id agent_id test_agent \
 | eval source_system="thousandeyes", subject="vertex:synthetic_test", subject_class="vertex", subject_type="synthetic_test", subject_id_namespace="source:thousandeyes", subject_id_type="internal_identifier", subject_id=test_id, source_id_type="test_agent", source_id=test_agent, observed_ts=_time, materialized_ts=now() \
 | lookup ni_vertex_mappings_lookup entity_type AS subject_type id_namespace AS subject_id_namespace id_type AS subject_id_type id_value AS subject_id OUTPUT vertex_id AS subject_candidates \
 | eval subject_candidates=mvdedup(subject_candidates), subject_uuid=if(mvcount(subject_candidates)=1,mvindex(subject_candidates,0),null()) \
 | lookup ni_vertices_lookup vertex_id AS subject_uuid OUTPUT canonical_key AS subject_canonical_key
iseval = 0

# Vertex-level worst-wins health rollup (docs/health/standard-metrics-and-statuses.md
# § Health Rollup Algorithm): critical > degraded > unknown > ok > unmonitored.
# Self-contained generating macro — invoke as `ni_vertex_health_rollup` on its own,
# rather than piping a base_search into it. Enumerates every active vertex, expands
# it against the capabilities that cover its entity_type
# (ni_capability_vertex_coverage_lookup, derived from the `subject` field of each
# active stanza in capabilities.conf), and looks up the matching ni_capability_state
# row per (subject_id, capability_id):
#   - entity_type has no covering capability at all         -> unmonitored
#   - entity_type is covered but no ni_capability_state row -> unmonitored rollup; omit capability
#   - entity_type is covered and a row exists               -> that row's state
# Computed on demand rather than materialized into its own KV collection — callers
# needing a fast point lookup should call this and cache the result themselves.
[ni_vertex_health_rollup]
definition = | inputlookup ni_vertices_lookup \
 | rename vertex_id as subject_id, canonical_key as subject_canonical_key \
 | eval subject_class="vertex", subject_type=entity_type, subject="vertex:".entity_type \
 | fields subject subject_class subject_type subject_id subject_canonical_key entity_type \
 | lookup ni_capability_vertex_coverage_lookup entity_type OUTPUT capability_ids \
 | eval capability_id=if(isnotnull(capability_ids) AND capability_ids!="", split(capability_ids, "|"), "__none__") \
 | mvexpand capability_id \
 | lookup ni_capability_state_lookup subject_id capability_id OUTPUT state, score, observed_ts, observed_ts_ms \
 | eval has_coverage=if(capability_id="__none__", 0, 1), has_state=if(isnotnull(state) AND state!="", 1, 0) \
 | eval state=case(has_coverage=0, "unmonitored", has_state=1, state, 1=1, "unmonitored") \
 | eval capability_label=if(has_state=1, capability_id, null()) \
 | eval severity_rank=case(state="critical", 4, state="degraded", 3, state="unknown", 2, state="ok", 1, state="unmonitored", 0, 1=1, 2) \
 | eventstats max(severity_rank) as max_severity by subject_id \
 | eval contributing_capability=if(severity_rank=max_severity AND state!="ok" AND state!="unmonitored", capability_label, null()) \
 | stats max(severity_rank) as severity_rank max(has_coverage) as has_coverage values(capability_label) as capabilities values(contributing_capability) as contributing_capabilities count(eval(has_state=1)) as state_count count(eval(state="critical")) as critical_count count(eval(state="degraded")) as degraded_count count(eval(state="unknown")) as unknown_count count(eval(state="ok")) as ok_count max(observed_ts) as observed_ts max(observed_ts_ms) as observed_ts_ms latest(subject) as subject latest(subject_class) as subject_class latest(subject_type) as subject_type latest(subject_canonical_key) as subject_canonical_key by subject_id \
 | eval health_state=case(severity_rank=4, "critical", severity_rank=3, "degraded", severity_rank=2, "unknown", severity_rank=1, "ok", severity_rank=0, "unmonitored", 1=1, "unknown") \
 | eval health_score=case(critical_count>0, 0, degraded_count>0, 60, ok_count>0 AND unknown_count=0, 100, ok_count>0, 80, 1=1, null()) \
 | eval requires_attention=if(critical_count>0 OR degraded_count>0, 1, 0) \
 | eval reason=case(health_state="unmonitored" AND has_coverage=1, "No capability state data", health_state="unmonitored", "No capability bindings cover this vertex class", critical_count>0, critical_count." critical capability state(s)", degraded_count>0, degraded_count." degraded capability state(s)", unknown_count>0 AND ok_count=0, "Only unknown capability state(s)", unknown_count>0, "Some capability state(s) unknown", ok_count>0, "All capability states OK", 1=1, "No capability state") \
 | eval capabilities=mvjoin(mvdedup(capabilities), "|"), contributing_capabilities=mvjoin(mvdedup(contributing_capabilities), "|") \
 | fields subject subject_class subject_type subject_id subject_canonical_key health_state health_score severity_rank requires_attention reason capabilities contributing_capabilities state_count critical_count degraded_count unknown_count ok_count observed_ts observed_ts_ms
iseval = 0
