[ni_graph_materialize]
is_custom = 1
label = NI Graph Materialize
description = Resolve graph identity and upsert normalized vertex or edge search results.
command = nigraphmaterialize target="$action.ni_graph_materialize.param.target$"
# Splunk's global maxresults default (10000) truncates a scheduled saved
# search's results before nigraphmaterialize ever sees them, once the result
# set exceeds 10000 rows per run. Raising it here, in this action's own
# stanza, applies to every saved search that sets action.ni_graph_materialize
# = 1 without needing a per-search override.
maxresults = 50000
