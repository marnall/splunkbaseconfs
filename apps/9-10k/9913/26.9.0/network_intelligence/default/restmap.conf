[script:network_intelligence_api]
match = /api/v1
scripttype = persist
python.version = python3
handler = network_intelligence_rest_handler.NetworkIntelligenceRestHandler
script = network_intelligence_rest_handler.py
output_modes = json
requireAuthentication = true
# Coarse gate: must hold at least one ni_* read capability to reach the
# script at all; per-route checks happen in check_capability(),
# Keep in sync with authorize.conf's ni_*_read stanzas.
capability = ni_topology_read or ni_health_read or ni_alerts_read or ni_synthetics_read
passPayload = true
passHttpHeaders = true
passSystemAuth = true
python.required = 3.13
