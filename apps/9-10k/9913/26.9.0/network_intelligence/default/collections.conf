# NI Graph Model — KV Store Collections
#
# Three ni_* graph collections for the canonical entity graph.
#
# accelerated_fields are KV Store (MongoDB) indexes — required and AppInspect-safe.
# They are NOT Splunk data-model acceleration (which must never ship per AppInspect rules).

[ni_vertices]
enforceTypes = true
field.canonical_key       = string
field.vertex_id         = string
field.entity_type         = string
field.entity_subtype      = string
field.display_name        = string
field.short_name          = string
field.status              = string
field.site_vertex_id    = string
field.parent_vertex_id  = string
field.region              = string
field.geo_lat             = number
field.geo_lon             = number
field.vendor              = string
field.source_systems      = string
field.display_category    = string
field.identity            = string
field.properties          = string
field.evidence_ref        = string
field.overrides           = string
field.last_observed_ts    = number
accelerated_fields.vertex_id_accel       = {"vertex_id": 1}
accelerated_fields.canonical_key_accel     = {"canonical_key": 1}
accelerated_fields.entity_type_accel       = {"entity_type": 1}
accelerated_fields.entity_subtype_accel    = {"entity_type": 1, "entity_subtype": 1}
accelerated_fields.site_vertex_id_accel  = {"site_vertex_id": 1}
accelerated_fields.parent_vertex_id_accel = {"parent_vertex_id": 1}
accelerated_fields.region_accel            = {"region": 1}
accelerated_fields.vendor_accel            = {"vendor": 1}
accelerated_fields.display_category_accel  = {"display_category": 1}

[ni_vertex_mappings]
enforceTypes = true
field.mapping_key      = string
field.canonical_key    = string
field.mapping_id       = string
field.vertex_id        = string
field.source_system      = string
field.id_namespace       = string
field.id_type            = string
field.id_value           = string
field.entity_type        = string
field.is_primary         = bool
field.last_observed_ts   = number
accelerated_fields.mapping_key_accel  = {"mapping_key": 1}
accelerated_fields.canonical_key_accel = {"canonical_key": 1}
accelerated_fields.vertex_id_accel    = {"vertex_id": 1}
# Exact and namespace-free lookup paths used by subject resolution.
accelerated_fields.namespaced_lookup_accel = {"id_namespace": 1, "id_type": 1, "id_value": 1}
accelerated_fields.unscoped_lookup_accel = {"id_type": 1, "id_value": 1}
accelerated_fields.entity_type_accel    = {"entity_type": 1}

# ni_capability_state mirrors the prototype's ni_capability_state shape
# (docs/health/standard-metrics-and-statuses.md), renamed to the ni_* prefix
# for consistency with the collections above — same doc/ticket-alignment
# follow-up as the vertex/edge rename. The vertex-level worst-wins rollup is
# NOT materialized into its own collection — it's the `ni_vertex_health_rollup`
# macro (macros.conf), computed on demand from this collection + ni_vertices.

[ni_capability_state]
enforceTypes = true
field.subject = string
field.subject_class = string
field.subject_type = string
field.subject_id = string
field.subject_canonical_key = string
field.capability_id = string
field.binding_id = string
field.source_system = string
field.source_id_type = string
field.source_id = string
field.state = string
field.score = number
field.metrics_json = string
field.evidence_ref = string
field.observation_id = string
field.observed_ts = number
field.observed_ts_ms = number
field.materialized_ts = number
field.valid = bool
field.error_message = string
field.updated_ts = number
accelerated_fields.subject_accel = {"subject_class": 1, "subject_id": 1}
accelerated_fields.subject_capability_accel = {"subject_id": 1, "capability_id": 1}
accelerated_fields.capability_accel = {"capability_id": 1}
accelerated_fields.state_accel = {"state": 1}

# Edge collections share an identical field set and acceleration pattern.
# Kept adjacent here for easy diff review.

[ni_edges]
enforceTypes = true
field.canonical_key     = string
field.edge_id         = string
field.src_vertex_id   = string
field.dst_vertex_id   = string
field.src_interface_vertex_id = string
field.dst_interface_vertex_id = string
field.edge_type         = string
field.directionality    = string
field.source_systems    = string
field.evidence_ref      = string
field.properties        = string
field.last_observed_ts  = number
accelerated_fields.canonical_key_accel  = {"canonical_key": 1}
accelerated_fields.edge_id_accel      = {"edge_id": 1}
accelerated_fields.src_accel            = {"src_vertex_id": 1}
accelerated_fields.dst_accel            = {"dst_vertex_id": 1}
accelerated_fields.src_interface_accel  = {"src_interface_vertex_id": 1}
accelerated_fields.dst_interface_accel  = {"dst_interface_vertex_id": 1}
accelerated_fields.type_accel           = {"edge_type": 1}
accelerated_fields.scope_accel          = {"src_vertex_id": 1, "dst_vertex_id": 1, "edge_type": 1}

# ni_alert_snapshots binds a search job sid to the caller/route/query that
# created it, so a paged GET /api/v1/alerts?sid=... request can be served
# without re-running the search. _key = sid (natural PK).
[ni_alert_snapshots]
enforceTypes = true
field.route              = string
field.caller_user        = string
field.query_hash         = string
field.effective_query    = string
field.earliest           = string
field.latest             = string
field.created_ts         = number
field.expires_ts         = number
field.result_count        = number
field.last_accessed_ts   = number
field.schema_version     = number
accelerated_fields.expires_ts_accel     = {"expires_ts": 1}
accelerated_fields.caller_route_accel   = {"caller_user": 1, "route": 1}

# RBAC visibility-policy schema (docs/rbac/visibility-layer.md § Schema — new KV
# collections). rbac/policy_store.py reads these with the system token; the rest
# of the policy engine (expression evaluation, enforcement, audit) is still
# deferred — see bin/rbac/. _key = policy_id (natural PK).
[ni_rbac_policies]
enforceTypes = true
field.policy_id         = string
field.app_role          = string
field.description       = string
field.visibility_expr   = string
field.untagged_default  = string
field.enabled           = bool
field.priority          = number
field.updated_by        = string
field.updated_ts        = number
field.valid_to_ts       = number
accelerated_fields.app_role_accel         = {"app_role": 1}
accelerated_fields.app_role_enabled_accel = {"app_role": 1, "enabled": 1}
accelerated_fields.valid_to_ts_accel      = {"valid_to_ts": 1}

# Single-row global RBAC config (global untagged default, fail mode). _key and
# config_key are both always the literal string "global" — there is exactly
# one row. rbac/policy_store.py queries by config_key rather than _key.
[ni_rbac_config]
enforceTypes = true
field.config_key              = string
field.global_untagged_default = string
field.fail_mode               = string
field.updated_by              = string
field.updated_ts              = number
accelerated_fields.config_key_accel = {"config_key": 1}
