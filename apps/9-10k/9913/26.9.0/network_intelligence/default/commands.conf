[nigraphmaterialize]
filename = nigraphmaterialize.py
chunked = true
# Register as risky so ad hoc `| nigraphmaterialize` in hand-typed SPL is
# subject to Splunk's risky-command controls (check_risky_command). This
# command is intended to run via action.ni_graph_materialize.
is_risky = true
# run_in_preview is already false by default when chunked=true.
# Setting it explicitly false since this command mutates
# KV Store: preview execution must never upsert vertices or
# mappings from partial/intermediate search results.
run_in_preview = false
python.version = python3
python.required = 3.13

[nicapabilitystaterollup]
filename = command_ni_capability_state_rollup.py
chunked = true
# Current-state aggregation must run once on the search head.
local = true
run_in_preview = false
python.version = python3
python.required = 3.13
