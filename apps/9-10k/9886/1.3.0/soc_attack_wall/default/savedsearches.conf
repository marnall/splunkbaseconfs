# Genere par build.py - ne pas modifier a la main.
# Detail : toutes les 5 min, resultats copies dans l'index summary
# (pas de consommation de licence) pour alimenter le cumul et la relecture.

[wall_waf]
description = Wall - source WAF
search = | makeresults count=700 \
| addinfo \
| eval debut = if(info_min_time > 0, info_min_time, relative_time(now(), "-7m@m")) \
| eval _time = debut + (random() % 300000) / 1000 \
| eval h = tonumber(strftime(_time, "%H")), \
       jour = 0.25 + 0.75 * abs(sin((h - 3) * pi() / 20)), \
       pic = if(floor(debut / 300) % 17 == 0, 1, 0), \
       garde = if(pic == 1, 100, round(35 * jour)) \
| where random() % 100 < garde \
| eval k = random() % 100 \
| lookup wall_demo_origins k OUTPUT Country, src_lat, src_lon, net, base \
| eval src_ip = net . "." . (base + random() % 6) \
| eval source = "waf", s = if(pic == 1, 0, random() % 6) \
| lookup wall_demo_signatures source, s OUTPUT signature, severity \
| eval r = random() % 100 \
| eval dc = if(r < 65, "CLOUD", "DC-SUD"), \
       dest_host = mvindex(split("www.example.org,portail.example.org,api.example.org,recrutement.example.org", ","), random() % 4), \
       action = "blocked" \
| fields _time, src_ip, Country, src_lat, src_lon, dc, severity, signature, dest_host, action \
| eval source_tech = "WAF", src_ip = trim(src_ip) \
| iplocation src_ip prefix="wall_" \
| eval Country = coalesce(Country, wall_Country), src_lat = coalesce(src_lat, wall_lat), src_lon = coalesce(src_lon, wall_lon) \
| where isnotnull(Country) AND Country != "" \
| eval dc = if(in(dc, "DC-NORD", "DC-SUD", "CLOUD"), dc, "DC-NORD") \
| eval dst_lat = case(dc == "DC-NORD", 50.6292, dc == "DC-SUD", 43.2965, dc == "CLOUD", 50.1109), dst_lon = case(dc == "DC-NORD", 3.0573, dc == "DC-SUD", 5.3698, dc == "CLOUD", 8.6821) \
| eval severity = lower(severity), severity = if(in(severity, "critical", "high", "medium", "low", "informational"), severity, "medium") \
| eval action = lower(coalesce(action, "alerted")), signature = coalesce(signature, "WAF"), dest_host = coalesce(dest_host, "") \
| eval t = _time \
| table _time, t, Country, src_lat, src_lon, src_ip, dc, dst_lat, dst_lon, source_tech, severity, signature, dest_host, action \
| appendpipe [ stats count as n | eval meta = 1, debut = relative_time(now(), "-7m@m"), _time = debut | fields meta debut n _time ]
cron_schedule = */5 * * * *
enableSched = 1
dispatch.earliest_time = -7m@m
dispatch.latest_time = -2m@m
dispatch.ttl = 2p
schedule_window = 0
allow_skew = 0
action.summary_index = 1
action.summary_index._name = summary
is_visible = true

