# Cumul depuis minuit, jusqu'au debut du lot que la page rejoue.
# Passe 2 min apres le detail, quand le summary est a jour.
[wall_cumul]
description = Wall - daily total
search = index=summary search_name=wall_* search_name!=wall_cumul NOT meta=1 \
| eval t5 = _time - (_time % 300) \
| fillnull value="" Country signature \
| stats count by host, search_name, search_now, action, source_tech, severity, Country, signature, dc, t5 \
| eventstats min(host) as sh_retenu by search_name, search_now | where host == sh_retenu \
| stats sum(count) as count by action, source_tech, severity, Country, signature, dc, t5 \
| appendpipe [ stats count as n | eval meta = 1, fin = relative_time(now(), "-9m@m") | fields meta fin n ]
cron_schedule = 2-59/5 * * * *
enableSched = 1
dispatch.earliest_time = @d
dispatch.latest_time = -9m@m
dispatch.ttl = 2p
schedule_window = 0
allow_skew = 0
is_visible = true
