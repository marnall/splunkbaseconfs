[ad_index]
definition = index=windows-servers
iseval = 0

[ad_hosts]
definition = [| tstats count where `ad_index` sourcetype IN ("MSAD:NT6:Health","MSAD:NT6:Replication","PerfmonMk:NTDS") earliest=-24h@h latest=now by host, sourcetype | stats dc(sourcetype) as dc_signals, sum(eval(sourcetype=="MSAD:NT6:Health")) as has_health by host | where has_health>0 AND dc_signals>1 | table host]
iseval = 0

[ad_hosts_list]
definition = tstats count where `ad_index` sourcetype IN ("MSAD:NT6:Health","MSAD:NT6:Replication","PerfmonMk:NTDS") earliest=-24h@h latest=now by host, sourcetype | stats dc(sourcetype) as dc_signals, sum(eval(sourcetype=="MSAD:NT6:Health")) as has_health by host | where has_health>0 AND dc_signals>1 | table host | sort host
iseval = 0
