## Give the add-on's own deploy log a clean, searchable sourcetype. The file lives
## under $SPLUNK_HOME/var/log/splunk and is auto-monitored into index=_internal, so
## it is searchable as:
##   index=_internal source=*ta_s3_lambda_deployer_deploy.log
## and, with this stanza, sourcetype=ta:s3_lambda_deployer

[source::*ta_s3_lambda_deployer_deploy.log*]
sourcetype = ta:s3_lambda_deployer

[ta:s3_lambda_deployer]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 30
KV_MODE = auto
