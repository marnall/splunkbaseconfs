## Splunk app configuration file
## Non-UI metadata (id, ui, launcher) is generated/managed by ucc-gen from app.manifest
## and globalConfig.json. Values below are the AppInspect-required baseline.

[install]
is_configured = false
state = enabled
build = 1786000120

[package]
check_for_updates = true
id = TA_s3_lambda_deployer

[ui]
is_visible = true
label = Inno Streaming Add-on for AWS S3

[launcher]
author = Inno Software
description = Configure AWS credentials in Splunk and deploy, from the Splunk UI, an AWS Lambda that streams S3 (.gz) objects into Splunk via HEC. Deployment runs in-process with the AWS API (boto3); no AWS console or CLI required. Credentials are stored encrypted.
version = 1.0.3

[triggers]
reload.s3_lambda_deployer_settings = simple

[id]
version = 1.0.3
name = TA_s3_lambda_deployer
