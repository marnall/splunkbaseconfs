## UCC-generated configuration handler stanzas (kept verbatim so config persistence
## keeps working) PLUS our custom persistent REST handler that performs the AWS
## deployment (boto3, in-process). ucc-gen replaces this file wholesale rather than
## merging, so both must live here.

[admin:s3_lambda_deployer_configuration]
match = /
members = s3_lambda_deployer_settings

[admin_external:s3_lambda_deployer_settings]
handlertype = python
python.version = python3
# python.version=python3 governs Splunk < 10.2 (uses the platform python3, e.g. 3.9 on
# 9.x). python.required is honored on Splunk 10.2+; AppInspect 4.3.0 fails a bare "3.9"
# (deprecated), so list 3.13 too — Splunk uses the newest value present. 3.9 kept for
# forward/backward documentation. See CLAUDE.md.
python.required = 3.9, 3.13
handlerfile = s3_lambda_deployer_rh_settings.py
handleractions = edit, list
handlerpersistentmode = true

[script:deploy_lambda]
match                 = /deploy_lambda
script                = deploy_lambda.py
scripttype            = persist
handler               = deploy_lambda.DeployLambdaHandler
requireAuthentication = true
output_modes          = json
passPayload           = true
passHttpHeaders       = true
passSystemAuth        = true
passConf              = true
python.version        = python3
python.required       = 3.9, 3.13
