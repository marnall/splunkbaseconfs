## License expiry monitor (Splunk-side reliable clock). Emits license_status events
## and emails the configured recipients on impending/actual expiry.

[license_monitor://main]
interval = 3600
disabled = 0
python.version = python3
# 3.13 required by AppInspect 4.3.0 (bare 3.9 is deprecated); python.version=python3
# still governs Splunk < 10.2. See restmap.conf note and CLAUDE.md.
python.required = 3.9, 3.13
