## UCC-generated settings expose stanzas + our custom deploy endpoint expose.
## ucc-gen replaces this file wholesale, so all stanzas must live here.

[expose:s3_lambda_deployer_settings]
pattern = s3_lambda_deployer_settings
methods = POST, GET

[expose:s3_lambda_deployer_settings_specified]
pattern = s3_lambda_deployer_settings/*
methods = POST, GET, DELETE

[expose:deploy_lambda]
pattern = deploy_lambda
methods = POST, GET
