[deploy]

[aws_account]
aws_access_key_id = 
aws_secret_access_key = 
aws_session_token = 
region = us-east-1
wipe_credentials = 1

[deployment]
hec_url = https://http-inputs-<stack>.splunkcloud.com
hec_token = 
index = edr
sourcetype = edr:json
routes = 
auto_sourcetype = 1
hec_raw = 0
bucket = 
prefix = 
suffix = .gz
missed_prefix = _splunk_missed/
function_name = s3-to-splunk-hec
role_name = s3-to-splunk-hec-role
tags = 
lambda_timeout = 900
lambda_memory = 512
reserved_concurrency = 20
batch_max_bytes = 800000
gzip_post = 1
verify_ssl = 1

[license]
license_key = 

[proxy]
proxy_enabled = 
proxy_url = 
proxy_port = 

[logging]
loglevel = INFO
