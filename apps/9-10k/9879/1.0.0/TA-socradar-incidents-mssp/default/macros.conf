[latest_alarm_version_mssp]
definition = eval _rank=coalesce(collected_at, _indextime) | eventstats max(_rank) as _mrank by company_id alarm_id | where _rank=_mrank | dedup company_id alarm_id
iseval = 0
description = Cloud-safe "latest version per (company_id, alarm_id)" - MSSP variant: the dedup key carries company_id so every company is ranked independently and no assumption is made about alarm ids being unique across companies. Otherwise: ranks each event by the content field collected_at (falls back to _indextime for events indexed before collected_at existed), keeps the highest-ranked event per alarm, then collapses to one row. Replaces "dedup alarm_id sortby -_indextime", which is unreliable on clustered/SmartStore indexers. Verified equivalent (19/19) to the old dedup on current data.
