[socradar:incidents:mssp]
TRUNCATE = 0
SHOULD_LINEMERGE = 0
KV_MODE = json
# Event time = the alarm's "date" field (creation time). Without this, Splunk
# auto-scans the JSON and inconsistently picks a wrong field, dating some events
# far in the future so default-time dashboard/searches miss them.
TIMESTAMP_FIELDS = date
TIME_FORMAT = %Y-%m-%d %H:%M:%S
MAX_DAYS_HENCE = 2
category = Splunk App Add-on Builder
pulldown_type = 1

# --- CIM Alerts data model mapping (additive, search-time only; dashboards keep
# reading alarm_risk_level). coalesce+spath guards large events where automatic
# KV extraction is cut off ([spath] extraction_cutoff ~5000 bytes, [kv] limit=100
# fields) — the same pattern the bundled dashboards use. Calculated fields cannot
# reference each other, so each EVAL carries its own coalesce inline.
EVAL-id              = coalesce(alarm_id, spath(_raw,"alarm_id"))
EVAL-app             = "SOCRadar"
EVAL-vendor_product  = "SOCRadar Extended Threat Intelligence"
EVAL-type            = "alarm"
EVAL-description     = coalesce(alarm_text, spath(_raw,"alarm_text"))
EVAL-body            = coalesce(alarm_text, spath(_raw,"alarm_text"))
EVAL-signature       = coalesce('alarm_type_details.alarm_generic_title', spath(_raw,"alarm_type_details.alarm_generic_title"))
# signature_id must uniquely identify the alarm TYPE. SOCRadar sends no numeric type id
# in the alarm data, so we derive a stable slug from the generic title (one id per type,
# same granularity as signature). alarm_sub_type was too coarse (many types share a sub_type).
EVAL-signature_id    = lower(replace(replace(coalesce('alarm_type_details.alarm_generic_title', spath(_raw,"alarm_type_details.alarm_generic_title")), "[^A-Za-z0-9]+", "_"), "^_|_$", ""))
EVAL-severity_id     = coalesce(alarm_risk_level, spath(_raw,"alarm_risk_level"))
EVAL-severity        = case(upper(coalesce(alarm_risk_level, spath(_raw,"alarm_risk_level")))=="CRITICAL","critical", upper(coalesce(alarm_risk_level, spath(_raw,"alarm_risk_level")))=="HIGH","high", upper(coalesce(alarm_risk_level, spath(_raw,"alarm_risk_level")))=="MEDIUM","medium", upper(coalesce(alarm_risk_level, spath(_raw,"alarm_risk_level")))=="LOW","low", upper(coalesce(alarm_risk_level, spath(_raw,"alarm_risk_level")))=="INFO","informational", 1==1,"unknown")
EVAL-dest            = coalesce(alarm_asset, spath(_raw,"alarm_asset"))
# CIM Alerts models an alerting SYSTEM's message: src = the source of the message,
# i.e. the platform that raised the alarm. dest = the asset the alarm is about.
EVAL-src             = "SOCRadar"
# CIM "user" is deliberately NOT mapped: a SOCRadar alarm carries no user of its own,
# and the usernames found inside leak/botnet alarm content belong to THIRD PARTIES
# (stolen credentials), not to the customer. Mapping those to CIM user would make
# Enterprise Security's identity correlation treat them as the customer's own users
# and raise false notables. A wrong mapping is worse than a missing one.
[source::...ta-socradar-incidents-mssp*.log*]
# Co-install: the standard SOCRadar Incidents add-on has a glob that
# also matches this source. Pattern stanzas are resolved in ASCII order
# at the same priority, so raise this one to keep the MSSP log ours.
priority = 100
sourcetype = tasocradarincidentsmssp:log

[source::...ta_socradar_incidents_mssp*.log*]
# Co-install: the standard SOCRadar Incidents add-on has a glob that
# also matches this source. Pattern stanzas are resolved in ASCII order
# at the same priority, so raise this one to keep the MSSP log ours.
priority = 100
sourcetype = tasocradarincidentsmssp:log

[socradar:status:updates:mssp]
SHOULD_LINEMERGE = 0
category = Splunk App Add-on Builder
pulldown_type = 1
KV_MODE = json

[socradar:ioc:enrichment:mssp]
SHOULD_LINEMERGE = 0
KV_MODE = json
category = Splunk App Add-on Builder
pulldown_type = 1

