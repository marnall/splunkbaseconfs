# CIM Alerts data model binding. Kept as its own event type on purpose:
# customers can opt out of the Alerts data model mapping by disabling this
# event type locally, without touching anything else in the add-on.
#
# MSSP note: the event type is named after THIS app and matches only this app's
# sourcetype. Co-installing TA-socradar-incidents keeps its own separate event
# type, so an MSSP customer running both does not get double-tagged events.
[socradar_incidents_mssp_alert]
search = sourcetype="socradar:incidents:mssp"
