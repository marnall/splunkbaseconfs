# In case source type is not assigned at input
# [source::/var/log/technitium/dns/*.log*]
# sourcetype = technitium:dns
# SHOULD_LINEMERGE = false
# LINE_BREAKER = ([\r\n]+)\[
# TIME_PREFIX = ^\[
# TIME_FORMAT = %Y-%m-%d %H:%M:%S %Z
# MAX_TIMESTAMP_LOOKAHEAD = 30
# TRANSFORMS-routing = \
#     technitium_route_query, \
#     technitium_route_zone, \
#     technitium_route_zonefile, \
#     technitium_route_server, \
#     technitium_route_admin

[technitium:dns:json]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = \"timestamp\"\s*:\s*\"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 24

EVAL-answer = spath(_raw, "answers{}.recordData")
EVAL-answer_count = mvcount(spath(_raw, "answers{}"))
EVAL-dest = host
EVAL-duration = coalesce(responseRtt, 0) / 1000
EVAL-message_type = mvappend("Query", "Response")
EVAL-query = 'question.questionName'
EVAL-query_count = 1
EVAL-query_type = 'question.questionType'
EVAL-record_type = spath(_raw, "answers{}.recordType")
EVAL-reply_code_id = coalesce(responseCode, 0)
EVAL-reply_type = coalesce(responseType, "Unknown")
EVAL-src = clientIp
EVAL-transport = upper(protocol)
EVAL-ttl = spath(_raw, "answers{}.recordTtl")
EVAL-vendor_product = "Technitium DNS"

# Base source type assigned at input
[technitium:dns]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)\[
TIME_PREFIX = ^\[
TIME_FORMAT = %Y-%m-%d %H:%M:%S %Z
MAX_TIMESTAMP_LOOKAHEAD = 30
TRANSFORMS-routing = \
    technitium_route_query, \
    technitium_route_zone, \
    technitium_route_zonefile, \
    technitium_route_server, \
    technitium_route_admin

[technitium:dns:query]
REPORT-technitium_dns_fields = technitium_dns_extract_query
EVAL-action = if(rcode="NoError", "allowed", "blocked")
EVAL-reply_code_id = rcode
EVAL-answer = split(answer, ", ")
EVAL-message_type = "Query"
EVAL-record_type = query_type
EVAL-src = client_ip
EVAL-src_port = client_port
EVAL-dest = host
EVAL-is_nxdomain = if(rcode="NxDomain", 1, 0)
EVAL-vendor_product = "Technitium DNS"

[technitium:dns:server]

[technitium:dns:admin]

[technitium:dns:zone]
REPORT-technitium_dns_fields = technitium_dns_extract_zone
EVAL-action = if(rcode="NoError", "allowed", "blocked")
EVAL-reply_code_id = rcode
EVAL-answer = split(answer, ", ")
EVAL-message_type = "Query"
EVAL-record_type = query_type
EVAL-src = client_ip
EVAL-src_port = client_port
EVAL-dest = host
EVAL-is_nxdomain = if(rcode="NxDomain", 1, 0)
EVAL-vendor_product = "Technitium DNS"

[technitium:dns:zonefile]
REPORT-technitium_dns_zonefile = technitium_dns_extract_zonefile
