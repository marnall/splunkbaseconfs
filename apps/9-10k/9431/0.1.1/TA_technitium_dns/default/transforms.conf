# plain-text query
[technitium_route_query]
REGEX = \[(UDP|TCP)\]\s+QNAME:
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::technitium:dns:query

# zone transfer
[technitium_route_zone]
REGEX = QTYPE:\s+(IXFR|SOA)
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::technitium:dns:zone

# zone file write
[technitium_route_zonefile]
REGEX = ^\[.*\]\s+Saved\szone\sfile\sfor\sdomain:
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::technitium:dns:zonefile

# server operation
[technitium_route_server]
REGEX = DNS\sServer
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::technitium:dns:server

# administrative and cluster
[technitium_route_admin]
REGEX = \[(admin)\]|Server\sconfiguration\swas|Server\scluster\sconfig
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::technitium:dns:admin

# extractions
[technitium_dns_extract_query]
REGEX = ^\[(?<timestamp>[^\]]+)\]\s+\[(?<client_ip>[^:]+):(?<client_port>\d+)\]\s+\[(?<transport>UDP|TCP)\]\s+QNAME:\s+(?<query>[^;]*);\s+QTYPE:\s+(?<query_type>[^;]+);\s+QCLASS:\s+(?<query_class>[^;]+);\s+RCODE:\s+(?<rcode>[^;]+);\s+ANSWER:\s+\[(?<answer>[^\]]*)\]

[technitium_dns_extract_zone]
REGEX = ^\[(?<timestamp>[^\]]+)\]\s+\[(?<client_ip>[^:]+):(?<client_port>\d+)\]\s+\[(?<transport>UDP|TCP)\]\s+QNAME:\s+(?<query>[^;]*);\s+QTYPE:\s+(?<query_type>[^;]+);\s+QCLASS:\s+(?<query_class>[^;]+);\s+TSIG\sKeyName:\s(?<tsig_keyname>[^;]*);\sTSIG\sAlgo:\s(?<tsig_argorithm>[^;]*);\sTSIG\sError:\s(?<tsig_error>[^;]*);\sRCODE:\s(?<rcode>[^;]*);\sANSWER:\s\[(?<answer>[^\]]*)\]

[technitium_dns_extract_zonefile]
REGEX = domain:\s(?<zone>.*)

# lookups
[technitium_dns_authoritative_zones]
batch_index_query = 0
case_sensitive_match = 0
filename = technitium_dns_authoritative_zones.csv
match_type = WILDCARD(zone)
max_matches = 1
min_matches = 0
