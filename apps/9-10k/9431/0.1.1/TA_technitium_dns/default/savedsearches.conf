[technitium_dns_authoritative_zones_update]
action.webhook.enable_allowlist = 0
alert.track = 0
cron_schedule = 0 * * * *
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 1
run_on_startup = 1
schedule_window = 15
search = `technitium_dns_indexes` sourcetype="technitium:dns:zonefile"\
| rex "domain:\s(?<zone>.*)$"\
| stats count BY zone\
| eval zone = "*." . zone, zlen = len(zone)\
| sort 0 - zlen\
| fields - count zlen\
| outputlookup technitium_dns_authoritative_zones
