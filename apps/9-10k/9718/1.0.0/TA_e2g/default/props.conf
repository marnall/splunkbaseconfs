[e2g_authentication]

FIELDALIAS-e2g_user = UserName AS user
FIELDALIAS-e2g_signature_id = EventType AS signature_id

EVAL-app = "E2G"

EVAL-EventTypeDescription = case(EventType=="0","SuccessfulLogin", EventType=="1","FailedLogin", EventType=="2","UserLogout", EventType=="3","ForcedLogout", EventType=="4","Timeout", true(),"Unknown")

EVAL-signature = case(EventType=="0","SuccessfulLogin", EventType=="1","FailedLogin", EventType=="2","UserLogout", EventType=="3","ForcedLogout", EventType=="4","Timeout", true(),"Unknown")

EVAL-action = case(EventType=="0","success", EventType=="1","failure", true(),null())


[E2G-Audit]

FIELDALIAS-e2g_audit_user = UserName AS user
FIELDALIAS-e2g_object_id = DataItemWrapperOid AS object_id

EVAL-app = "E2G"
EVAL-vendor = "E2G"
EVAL-product = "Plant Asset Integrity"
EVAL-vendor_product = "E2G Plant Asset Integrity"

EVAL-change_type = "application"
EVAL-object = tostring(DataItemWrapperOid)

REPORT-e2g_audit_objects = e2g_audit_objects
REPORT-e2g_audit_keywords = e2g_audit_keywords