[carbonio_audit_default_authentication]
search = sourcetype=carbonio_audit cmd=Auth

[carbonio_amavis_malware_attack]
search = sourcetype=carbonio process_name=amavis (malware_signature=* OR virus_name=* OR file_name=* OR message="*INFECTED*" OR message="*is infected with*" OR message="*X-Amavis-Alert: INFECTED*")

[carbonio_audit_privileged_authentication]
search = sourcetype=carbonio_audit (cmd=AdminAuth OR cmd=DelegateAuth)

[carbonio_mailbox_authentication_failed]
search = sourcetype=carbonio_mailbox event_type=authentication_failed

[carbonio_mailbox_soap_authentication]
search = sourcetype=carbonio_mailbox logger=soap operation=AuthRequest

[carbonio_mailbox_delegated_authentication]
search = sourcetype=carbonio_mailbox event_type=delegated_access (delegated_doc=DelegateAuth OR message="*DelegateAuth*")

[carbonio_files_db_authentication_failed]
search = sourcetype=carbonio_files error_type=database_authentication_failed

[carbonio_mail_email_delivery]
search = sourcetype=carbonio_mail event_type=delivery

[carbonio_mailbox_email_delivery]
search = sourcetype=carbonio_mailbox event_type IN ("lmtp_deliver","mailop_add")

[carbonio_amavis_email_filtering]
search = sourcetype=carbonio process_name=amavis (amavis_result=* OR spam_flag=* OR spam_score=* OR malware_signature=* OR virus_name=* OR message="*Passed CLEAN*" OR message="*spam-tag*" OR message="*X-Spam-Status*" OR message="*INFECTED*" OR message="*is infected with*")

[carbonio_postfix_email_delivery]
search = sourcetype=carbonio process_name=postfix status=*

[carbonio_mail_smtp_network]
search = sourcetype=carbonio_mail event_type IN ("postscreen_connect","postscreen_allowlisted","postscreen_pass","postscreen_pregreet","smtpd_connect","smtpd_lost_connection","smtpd_disconnect","tls_setup")

[carbonio_smtp_network]
search = sourcetype=carbonio (process="postfix/postscreen" OR process="postfix/smtpd" OR process_component=postscreen OR postscreen_action=* OR event_type=postscreen_connect)

[carbonio_clamd_malware_operations]
search = sourcetype=carbonio_clamd

[carbonio_freshclam_malware_operations]
search = sourcetype=carbonio_freshclam
