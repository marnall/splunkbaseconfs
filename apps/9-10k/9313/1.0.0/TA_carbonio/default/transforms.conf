[carbonio_audit_kv]
REGEX = (?:\[|;|\s-\s)\s*([A-Za-z][A-Za-z0-9_]*)=([^;]*)
FORMAT = $1::$2
MV_ADD = true

[carbonio_common_kv]
REGEX = (?i)(?:^|[\s,;\(])((?:from|to|orig_to|relay|delay|delays|dsn|status|size|nrcpt|client|proto|helo|uid|commands|mail|rcpt|data|quit|ehlo|queued_as|mail_id|dkim_sd|ndn_needed))=("[^"]*"|<[^>]*>|\[[^\]]+\]|[^,\s\)]+)
FORMAT = $1::$2
MV_ADD = true

[carbonio_amavis_infected_file]
REGEX = (?i)The file\s+'([^']+)'\s+is infected with the\s+'([^']+)'\s+virus
FORMAT = file_name::$1 malware_signature::$2 virus_name::$2 event_type::malware_detected malware_action::infected

[carbonio_amavis_blocked_infected]
REGEX = (?i)Blocked\s+INFECTED\s+\(([^)]+)\)\s+\{([^}]+)\},\s+.*?\[([0-9a-fA-F:.]+)\]:(\d+)\s+<([^>]*)>\s+->\s+<([^>]*)>,\s+quarantine:\s+([^,\s]+),\s+Queue-ID:\s+([^,\s]+),\s+Message-ID:\s+<([^>]+)>,\s+mail_id:\s+([^,\s]+),\s+Hits:\s+([^,]+),\s+size:\s+(\d+),\s+(\d+)\s+ms
FORMAT = malware_signature::$1 virus_name::$1 amavis_policy::$2 src_ip::$3 src_port::$4 sender::$5 recipient::$6 quarantine::$7 queue_id::$8 message_id::$9 mail_id::$10 spam_score::$11 size::$12 duration_ms::$13 event_type::malware_blocked malware_action::quarantined

[carbonio_amavis_infected_signature]
REGEX = (?i)\bINFECTED:\s*([^,"\r\n]+)
FORMAT = malware_signature::$1 virus_name::$1 event_type::malware_detected malware_action::infected

[carbonio_amavis_header_alert]
REGEX = (?i)X-Amavis-Alert:\s+INFECTED,\s+message contains virus:\s*([^\\\r\n]+)
FORMAT = malware_signature::$1 virus_name::$1 event_type::malware_detected malware_action::infected header_name::X-Amavis-Alert

[carbonio_amavis_run_av]
REGEX = (?i)run_av\s+\(([^)]+)\):\s+(\S+)\s+INFECTED:\s*([^,\r\n]+)
FORMAT = scanner::$1 file_path::$2 malware_signature::$3 virus_name::$3 event_type::malware_detected malware_action::infected

[carbonio_amavis_envelope_from]
REGEX = (?i)X-Envelope-From:\s+<([^>]+)>
FORMAT = sender::$1 src_user::$1

[carbonio_amavis_envelope_to]
REGEX = (?i)X-Envelope-To(?:-Blocked)?:\s+<([^>]+)>
FORMAT = recipient::$1 dest_user::$1

[carbonio_amavis_quarantine_id]
REGEX = (?i)X-Quarantine-ID:\s+<([^>]+)>
FORMAT = quarantine_id::$1

[carbonio_postfix_queue]
REGEX = :\s+(?<queue_id>NOQUEUE|[A-F0-9]{5,}):
FORMAT = queue_id::$1

[carbonio_postfix_client]
REGEX = (?i)(?:client=|connect from\s+)(?<client_host>[^\[\s]+)\[(?<client_ip>\d{1,3}(?:\.\d{1,3}){3})\](?::(?<client_port>\d+))?
FORMAT = client_host::$1 client_ip::$2 client_port::$3

[carbonio_postfix_relay]
REGEX = (?i)relay=(?<relay_host>[^\[\s,]+)(?:\[(?<relay_ip>\d{1,3}(?:\.\d{1,3}){3})\])?(?::(?<relay_port>\d+))?
FORMAT = relay_host::$1 relay_ip::$2 relay_port::$3

[carbonio_amavis_session]
REGEX = amavis\[\d+\]:\s+\(([^)]+)\)
FORMAT = amavis_session::$1

[carbonio_amavis_passed]
REGEX = (?i)Passed\s+(\S+)\s+\{([^}]+)\},\s+\[([0-9a-fA-F:.]+)\](?::(\d+))?(?:\s+\[([0-9a-fA-F:.]+)\])?\s+<([^>]*)>\s+->\s+<([^>]*)>,\s+Queue-ID:\s+([^,\s]+),\s+Message-ID:\s+<([^>]+)>,\s+mail_id:\s+([^,\s]+),\s+Hits:\s+(-?\d+(?:\.\d+)?),\s+size:\s+(\d+),\s+queued_as:\s+([^,\s]+),\s+dkim_sd=(.*?),\s+(\d+)\s+ms
FORMAT = amavis_result::$1 amavis_policy::$2 src_ip::$3 src_port::$4 dest_ip::$5 sender::$6 recipient::$7 queue_id::$8 message_id::$9 mail_id::$10 spam_score::$11 size::$12 queued_as::$13 dkim_sd::$14 duration_ms::$15

[carbonio_amavis_passed_no_queue]
REGEX = (?i)Passed\s+(\S+)\s+\{([^}]+)\},\s+\[([0-9a-fA-F:.]+)\](?::(\d+))?(?:\s+\[([0-9a-fA-F:.]+)\])?\s+<([^>]*)>\s+->\s+<([^>]*)>,\s+Message-ID:\s+<([^>]+)>,\s+mail_id:\s+([^,\s]+),\s+Hits:\s+(-?\d+(?:\.\d+)?),\s+size:\s+(\d+),\s+queued_as:\s+([^,\s]+),\s+(\d+)\s+ms
FORMAT = amavis_result::$1 amavis_policy::$2 src_ip::$3 src_port::$4 dest_ip::$5 sender::$6 recipient::$7 message_id::$8 mail_id::$9 spam_score::$10 size::$11 queued_as::$12 duration_ms::$13

[carbonio_amavis_spam_tag]
REGEX = (?i)spam-tag,\s+<([^>]*)>\s+->\s+<([^>]*)>,\s+(Yes|No),\s+score=(-?\d+(?:\.\d+)?)\s+required=(-?\d+(?:\.\d+)?)\s+tests=\[([^\]]*)\]\s+autolearn=(\S+)
FORMAT = sender::$1 recipient::$2 spam_flag::$3 spam_score::$4 spam_required::$5 spam_tests::$6 spam_autolearn::$7

[carbonio_network]
REGEX = (?i)(?:CONNECT from|Peer:)\s+"?\[?([0-9a-fA-F:.]+)\]?:?(\d+)?
FORMAT = peer_ip::$1 peer_port::$2

[carbonio_error_reason]
REGEX = (?i)(?<reason>(?:Rewrite failed|Connection refused|lost connection|failed|error:).*)$
FORMAT = reason::$1

[carbonio_amavis_one_response]
REGEX = (?i)one_response_for_all\s+<([^>]*)>:\s+(success|failure),\s+r=(\d+),b=(\d+),d=(\d+),\s+ndn_needed=(\d+),\s+'([^']+)'
FORMAT = recipient::$1 delivery_result::$2 amavis_r::$3 amavis_b::$4 amavis_d::$5 ndn_needed::$6 smtp_response::$7

[carbonio_amavis_tempdir]
REGEX = (?i)TempDir::strip:\s+(\S+)
FORMAT = tempdir_path::$1

[carbonio_amavis_oldest_public_ip]
REGEX = (?i)oldest_public_ip_addr_from_received:\s+([0-9a-fA-F:.]+)
FORMAT = oldest_public_ip::$1

[carbonio_amavis_av_failed]
REGEX = (?i)\(!\)([^:]*av-scanner FAILED):\s+(.*)$
FORMAT = av_error::$1 reason::$2

[carbonio_amavis_smtp_response]
REGEX = (?i)sending SMTP response:\s+"([^"]*queued as ([A-F0-9]{5,})[^"]*)"
FORMAT = smtp_response::$1 queue_id::$2

[carbonio_queued_as_queue_id]
REGEX = (?i)queued as\s+([A-F0-9]{5,})
FORMAT = queue_id::$1
MV_ADD = true

[carbonio_amavis_data_dot]
REGEX = (?i)smtp resp to data-dot\s+\(<([^>]*)>\):\s+(.+?queued as\s+([A-F0-9]{5,}).*?dt:\s+([0-9.]+)\s+ms)
FORMAT = recipient::$1 smtp_response::$2 queue_id::$3 duration_ms::$4

[carbonio_amavis_fwd]
REGEX = (?i)\)\s+([^,\s]+)\s+FWD\s+from\s+<([^>]*)>\s+->\s+<([^>]*)>,\s+BODY=([^\s,]+)\s+(.*?queued as\s+([A-F0-9]{5,}).*)$
FORMAT = mail_id::$1 sender::$2 recipient::$3 body_encoding::$4 smtp_response::$5 queue_id::$6

[carbonio_amavis_lookup_sender]
REGEX = (?i)lookup\s+\[([^\]]*(?:sender|bysender)[^\]]*)\]\s+=>\s+([^,]+),\s+"([^"]+)"\s+(?:matches|does not match)
FORMAT = lookup_name::$1 lookup_result::$2 sender::$3

[carbonio_amavis_lookup_recipient]
REGEX = (?i)lookup\s+\[([^\]]*(?:recip|recipient)[^\]]*)\]\s+=>\s+([^,]+),\s+"([^"]+)"\s+(?:matches|does not match)
FORMAT = lookup_name::$1 lookup_result::$2 recipient::$3

[carbonio_amavis_orcpt]
REGEX = (?i)orcpt_encode\s+([^,\s]+),\s+([^,\s]+),\s+([^,\s]+)
FORMAT = orcpt_protocol::$1 recipient::$2 orcpt_encoding::$3

[carbonio_amavis_dsn]
REGEX = (?i)dsn:\s+from MTA\s+(\d+)\s+([^<]+?)\s+<([^>]*)>\s+->\s+<([^>]*)>:\s+on_succ=(\d+),\s+on_dly=(\d+),\s+on_fail=(\d+),\s+never=(\d+),\s+warn_sender=([^,]*),\s+DSN_passed_on=(\d+),\s+destiny=(\d+),\s+mta_resp:\s+"([^"]*queued as\s+([A-F0-9]{5,})[^"]*)"
FORMAT = dsn_code::$1 dsn_result::$2 sender::$3 recipient::$4 on_succ::$5 on_dly::$6 on_fail::$7 never::$8 warn_sender::$9 dsn_passed_on::$10 destiny::$11 smtp_response::$12 queue_id::$13

[carbonio_amavis_rcpt_response]
REGEX = (?i)smtp resp to RCPT\s+\([^)]+\)\s+\(<([^>]*)>\):\s+(\d+)\s+([0-9.]+)\s+(.+)$
FORMAT = recipient::$1 smtp_code::$2 smtp_dsn::$3 smtp_response::$4

[carbonio_postscreen_allowlisted]
REGEX = (?i)postfix/postscreen\[\d+\]:\s+ALLOWLISTED\s+\[([0-9a-fA-F:.]+)\]:(\d+)
FORMAT = postscreen_action::ALLOWLISTED src_ip::$1 src::$1 src_port::$2

[carbonio_postscreen_connect_full]
REGEX = (?i)postfix/postscreen\[\d+\]:\s+CONNECT from\s+\[([0-9a-fA-F:.]+)\]:(\d+)\s+to\s+\[([0-9a-fA-F:.]+)\]:(\d+)
FORMAT = postscreen_action::CONNECT src_ip::$1 src::$1 src_port::$2 dest_ip::$3 dest::$3 dest_port::$4

[carbonio_amavis_esmtp_response]
REGEX = (?i)ESMTP([<>])\s+(\d{3})\s+([0-9.]+)\s+\[([0-9a-fA-F:.]+)\]\s+(.+)$
FORMAT = smtp_direction::$1 smtp_code::$2 smtp_dsn::$3 peer_ip::$4 smtp_response::$5

[carbonio_amavis_rw_loop_banner]
REGEX = (?i)rw_loop read\s+\d+\s+chars<\s+250[- ]([^\\\s]+)
FORMAT = smtp_code::250 smtp_hostname::$1

[carbonio_amavis_rw_loop_capabilities]
REGEX = (?i)\\r\\n250[- ]([A-Z0-9][A-Z0-9-]*)(?:\s+(\d+))?
FORMAT = smtp_capability::$1 smtp_capability_value::$2
MV_ADD = true

[carbonio_amavis_noop_response]
REGEX = (?i)smtp resp to NOOP\s+\(idle\s+([0-9.]+)\s+s\):\s+(\d{3})\s+([0-9.]+)\s+([^\s]+)\s+Error:\s+(.+)$
FORMAT = idle_seconds::$1 smtp_code::$2 smtp_dsn::$3 smtp_hostname::$4 reason::$5

[carbonio_amavis_header_spam_status]
REGEX = (?is)header:\s+X-Spam-Status:\s+(Yes|No),\s+score=(-?\d+(?:\.\d+)?)\s+required=(-?\d+(?:\.\d+)?)\s+tests=\[([^\]]+)\]\s+autolearn=([^\\\s]+)\s+autolearn_force=([^\\\s]+)
FORMAT = header_name::X-Spam-Status spam_flag::$1 spam_score::$2 spam_required::$3 spam_tests::$4 spam_autolearn::$5 spam_autolearn_force::$6

[carbonio_amavis_header_virus_scanned]
REGEX = (?i)header:\s+X-Virus-Scanned:\s+amavis\s+at\s+([^\\\s]+)
FORMAT = header_name::X-Virus-Scanned virus_scanner::amavis scanner_host::$1 scanner_domain::$1

[carbonio_amavis_header_generic]
REGEX = (?is)header:\s+(X-[^:]+):\s+(.+?)(?:\\n)?$
FORMAT = header_name::$1 header_value::$2

[carbonio_postscreen_connect]
REGEX = postfix\/postscreen\[\d+\]:\s+(?<postscreen_action>CONNECT)\s+from\s+\[(?<src>\d{1,3}(?:\.\d{1,3}){3})\]:(?<src_port>\d+)\s+to\s+\[(?<dest_ip>\d{1,3}(?:\.\d{1,3}){3})\]:(?<dest_port>\d+)

[carbonio_slapd_get_csn]
REGEX = slapd\[(?<pid>\d+)\]:\s+(?<slapd_function>slap_get_csn):\s+conn=(?<conn>\d+)\s+op=(?<op>\d+)\s+(?<slapd_action>generated new csn)=(?<csn>\d{14}\.\d+Z#[0-9A-Fa-f]+#[0-9A-Fa-f]+#[0-9A-Fa-f]+)\s+manage=(?<manage>\d+)

[carbonio_slapd_queue_or_graduate_csn]
REGEX = slapd\[(?<pid>\d+)\]:\s+(?<slapd_function>slap_(?:queue|graduate_commit)_csn):\s+(?<slapd_action>queueing|removing)\s+(?<memory_address>0x[0-9A-Fa-f]+)\s+(?<csn>\d{14}\.\d+Z#[0-9A-Fa-f]+#[0-9A-Fa-f]+#[0-9A-Fa-f]+)

[carbonio_slapd_csn_any]
REGEX = (?<csn_time>\d{14}\.\d+Z)#(?<csn_seq>[0-9A-Fa-f]+)#(?<csn_server_id>[0-9A-Fa-f]+)#(?<csn_mod>[0-9A-Fa-f]+)

[carbonio_qmgr_from]
REGEX = postfix\/qmgr\[(?<pid>\d+)\]:\s+(?<queue_id>[A-F0-9]{5,20}):\s+from=<(?<sender>[^>]*)>,\s+size=(?<size>\d+),\s+nrcpt=(?<nrcpt>\d+)\s+\((?<queue_state>[^)]+)\)

[carbonio_qmgr_removed]
REGEX = postfix\/qmgr\[(?<pid>\d+)\]:\s+(?<queue_id>[A-F0-9]{5,20}):\s+(?<qmgr_action>removed)

[carbonio_sshd_accepted]
REGEX = sshd\[(?<pid>\d+)\]:\s+(?<ssh_action>Accepted)\s+(?<ssh_auth_method>\S+)\s+for\s+(?<user>\S+)\s+from\s+(?<src>\d{1,3}(?:\.\d{1,3}){3})\s+port\s+(?<src_port>\d+)\s+(?<ssh_protocol>\S+)

[carbonio_sshd_connection_closed]
REGEX = sshd\[(?<pid>\d+)\]:\s+(?<ssh_action>Connection closed)\s+by\s+(?<src>\d{1,3}(?:\.\d{1,3}){3})\s+port\s+(?<src_port>\d+)

[carbonio_sshd_error]
REGEX = sshd\[(?<pid>\d+)\]:\s+(?<severity>error):\s+(?<ssh_error>[^:]+):\s+(?<reason>.+)$

###################################################################################clamd##############################################################################################################

[carbonio_clamd_daemon]
REGEX = clamd daemon\s+([^\s]+)\s+\(OS:\s+([^,]+),\s+ARCH:\s+([^,]+),\s+CPU:\s+([^)]+)\)
FORMAT = daemon_version::$1 os::$2 arch::$3 cpu::$4 clamd_event::daemon_info

[carbonio_clamd_started]
REGEX = \+\+\+\s+Started at\s+(.+)$
FORMAT = clamd_event::started started_at::$1

[carbonio_clamd_stopped]
REGEX = ---\s+Stopped at\s+(.+)$
FORMAT = clamd_event::stopped stopped_at::$1

[carbonio_clamd_fd]
REGEX = Received\s+(\d+)\s+file descriptor\(s\)\s+from\s+systemd
FORMAT = clamd_event::systemd_fd file_descriptors::$1

[carbonio_clamd_log_size]
REGEX = Log file size limited to\s+(\d+)\s+bytes
FORMAT = clamd_event::log_limit log_file_size_limit::$1 limit_unit::bytes

[carbonio_clamd_db_path]
REGEX = Reading databases from\s+(\S+)
FORMAT = clamd_event::reading_databases db_path::$1

[carbonio_clamd_loaded_signatures]
REGEX = Loaded\s+(\d+)\s+signatures
FORMAT = clamd_event::loaded_signatures signatures_count::$1

[carbonio_clamd_db_reload]
REGEX = Database correctly reloaded\s+\((\d+)\s+signatures\)
FORMAT = clamd_event::database_reloaded signatures_count::$1 database_status::reloaded

[carbonio_clamd_tcp_bound]
REGEX = TCP:\s+Bound to\s+\[([^\]]+)\]:(\d+)
FORMAT = clamd_event::tcp_bound protocol::TCP bind_address::$1 port::$2

[carbonio_clamd_tcp_queue]
REGEX = TCP:\s+Setting connection queue length to\s+(\d+)
FORMAT = clamd_event::tcp_queue protocol::TCP connection_queue_length::$1

[carbonio_clamd_local_socket]
REGEX = LOCAL:\s+(?:Unix socket file|Removing stale socket file)\s+(\S+)
FORMAT = clamd_event::local_socket protocol::LOCAL socket_path::$1

[carbonio_clamd_limit]
REGEX = Limits:\s+(.+?)\s+limit set to\s+(\d+)\s+([^.\s]+)
FORMAT = clamd_event::limit limit_name::$1 limit_value::$2 limit_unit::$3

[carbonio_clamd_feature]
REGEX = ^(?:[A-Z][a-z]{2}\s+[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}\s+\d{4}\s+->\s+)?(.+?)\s+(enabled|disabled)\.?$
FORMAT = clamd_event::feature feature::$1 feature_status::$2

[carbonio_clamd_selfcheck]
REGEX = SelfCheck:\s+Database status\s+(.+?)\.?$
FORMAT = clamd_event::selfcheck database_status::$1

[carbonio_clamd_selfchecking]
REGEX = Self checking every\s+(\d+)\s+seconds
FORMAT = clamd_event::selfchecking selfcheck_interval::$1 selfcheck_interval_unit::seconds

[carbonio_clamd_bytecode]
REGEX = Bytecode:\s+Security mode set to\s+"([^"]+)"
FORMAT = clamd_event::bytecode bytecode_security_mode::$1

[carbonio_clamd_warning]
REGEX = LibClamAV\s+(\w+):\s+\*+\s*(.*?)\s*\*+$
FORMAT = log_level::$1 clamd_event::libclamav_warning reason::$2

#########################################docs-connector###################################################################

[carbonio_docs_connector_resteasy]
REGEX = ^(RESTEASY\d+):\s+(.*)$
SOURCE_KEY = message
FORMAT = event_code::$1 event_message::$2

[carbonio_docs_connector_class]
REGEX = (?i)(?:for|instance for)\s+([a-zA-Z0-9_.$]+)$
SOURCE_KEY = message
FORMAT = java_class::$1

##########################################files##########################################################################################

[carbonio_files_service_error]
REGEX = (?i)Service stopped unexpectedly
FORMAT = service_event::stopped_unexpectedly

[carbonio_files_exception]
REGEX = (?m)^(javax\.[A-Za-z0-9_.$]+|java\.[A-Za-z0-9_.$]+|org\.[A-Za-z0-9_.$]+):\s+(.+)$
FORMAT = exception_class::$1 exception_message::$2

[carbonio_files_caused_by]
REGEX = (?m)^Caused by:\s+([A-Za-z0-9_.$]+):\s+(.+)$
FORMAT = caused_by_class::$1 caused_by_message::$2

[carbonio_files_psql_fatal]
REGEX = (?i)FATAL:\s+(.+)
FORMAT = db_error_level::FATAL reason::$1

[carbonio_files_db_user]
REGEX = (?i)password authentication failed for user\s+"([^"]+)"
FORMAT = db_user::$1 user::$1

[carbonio_files_stack_methods]
REGEX = (?m)^\s+at\s+([A-Za-z0-9_.$]+)\.([A-Za-z0-9_$<>]+)\(([^:()]+)(?::(\d+))?\)
FORMAT = java_class::$1 java_method::$2 java_file::$3 java_line::$4
MV_ADD = true

#########################################freshclam#############################################################################################

[carbonio_freshclam_signal]
REGEX = (?m)^Received signal:\s+(.+)$
FORMAT = freshclam_signal::$1

[carbonio_freshclam_uptodate]
REGEX = (?m)^([A-Za-z0-9_.-]+\.cld)\s+database is up-to-date\s+\(version:\s+(\d+),\s+sigs:\s+(\d+),\s+f-level:\s+(\d+),\s+builder:\s+([^)]+)\)
FORMAT = database_file::$1 database_status::up_to_date database_version::$2 signatures_count::$3 f_level::$4 builder::$5
MV_ADD = true

[carbonio_freshclam_available_update]
REGEX = (?m)^([A-Za-z0-9_.-]+)\s+database available for update\s+\(local version:\s+(\d+),\s+remote version:\s+(\d+)\)
FORMAT = database_name::$1 database_status::available_for_update local_version::$2 remote_version::$3
MV_ADD = true

[carbonio_freshclam_testing_db]
REGEX = (?m)^Testing database:\s+'([^']+)'
FORMAT = test_database_path::$1

[carbonio_freshclam_updated]
REGEX = (?m)^([A-Za-z0-9_.-]+\.cld)\s+updated\s+\(version:\s+(\d+),\s+sigs:\s+(\d+),\s+f-level:\s+(\d+),\s+builder:\s+([^)]+)\)
FORMAT = database_file::$1 database_status::updated database_version::$2 signatures_count::$3 f_level::$4 builder::$5
MV_ADD = true

[carbonio_freshclam_test_passed]
REGEX = (?m)^Database test passed\.
FORMAT = database_test_result::passed

[carbonio_freshclam_notify]
REGEX = (?m)^Clamd successfully notified about the update\.
FORMAT = clamd_notify_status::success

############################################mail#########################################

[carbonio_mail_queue_id]
REGEX = :\s+(NOQUEUE|[A-F0-9]{5,}):
FORMAT = queue_id::$1

[carbonio_mail_postscreen_connect]
REGEX = (?i)CONNECT from\s+\[([0-9a-fA-F:.]+)\]:(\d+)\s+to\s+\[([0-9a-fA-F:.]+)\]:(\d+)
FORMAT = event_type::postscreen_connect src_ip::$1 src_port::$2 dest_ip::$3 dest_port::$4

[carbonio_mail_postscreen_allowlisted]
REGEX = (?i)ALLOWLISTED\s+\[([0-9a-fA-F:.]+)\]:(\d+)
FORMAT = event_type::postscreen_allowlisted postscreen_action::ALLOWLISTED src_ip::$1 src_port::$2

[carbonio_mail_postscreen_pass]
REGEX = (?i)PASS\s+(\S+)\s+\[([0-9a-fA-F:.]+)\]:(\d+)
FORMAT = event_type::postscreen_pass postscreen_action::PASS pass_type::$1 src_ip::$2 src_port::$3

[carbonio_mail_postscreen_pregreet]
REGEX = (?i)PREGREET\s+(\d+)\s+after\s+([0-9.]+)\s+from\s+\[([0-9a-fA-F:.]+)\]:(\d+):\s+(.+)$
FORMAT = event_type::postscreen_pregreet pregreet_size::$1 pregreet_after_seconds::$2 src_ip::$3 src_port::$4 pregreet_command::$5

[carbonio_mail_smtpd_connect]
REGEX = (?i)connect from\s+([^\[\s]+)\[([0-9a-fA-F:.]+)\]:(\d+)
FORMAT = event_type::smtpd_connect client_host::$1 client_ip::$2 src_ip::$2 src_port::$3

[carbonio_mail_smtpd_lost_connection]
REGEX = (?i)lost connection after\s+(\S+)\s+from\s+([^\[\s]+)\[([0-9a-fA-F:.]+)\]:(\d+)
FORMAT = event_type::smtpd_lost_connection lost_after::$1 client_host::$2 client_ip::$3 src_ip::$3 src_port::$4 reason::lost_connection

[carbonio_mail_smtpd_disconnect]
REGEX = (?i)disconnect from\s+([^\[\s]+)\[([0-9a-fA-F:.]+)\]:(\d+)\s+(.*)$
FORMAT = event_type::smtpd_disconnect client_host::$1 client_ip::$2 src_ip::$2 src_port::$3 smtp_commands::$4

[carbonio_mail_smtpd_client]
REGEX = (?i)client=([^\[\s]+)\[([0-9a-fA-F:.]+)\]:(\d+)
FORMAT = event_type::smtpd_client client_host::$1 client_ip::$2 src_ip::$2 src_port::$3

[carbonio_mail_message_id]
REGEX = (?i)message-id=<([^>]+)>
FORMAT = message_id::$1

[carbonio_mail_qmgr_from]
REGEX = (?i)from=<([^>]*)>,\s+size=(\d+),\s+nrcpt=(\d+)
FORMAT = sender::$1 size::$2 nrcpt::$3 event_type::qmgr_from

[carbonio_mail_delivery]
REGEX = (?i)to=<([^>]*)>,\s+(?:orig_to=<([^>]*)>,\s+)?relay=([^\s,\[]+)(?:\[([0-9a-fA-F:.]+)\])?(?::(\d+))?,\s+delay=([0-9.]+),\s+delays=([^,]+),\s+dsn=([0-9.]+),\s+status=(\w+)\s+\((.*)\)
FORMAT = recipient::$1 orig_recipient::$2 relay_host::$3 relay_ip::$4 relay_port::$5 delay::$6 delays::$7 dsn::$8 status::$9 smtp_response::$10 event_type::delivery

[carbonio_mail_removed]
REGEX = (?i):\s+([A-F0-9]{5,}):\s+removed
FORMAT = queue_id::$1 event_type::queue_removed

[carbonio_mail_tls_setup]
REGEX = (?i)setting up TLS connection from\s+([^\[\s]+)\[([0-9a-fA-F:.]+)\]:(\d+)
FORMAT = event_type::tls_setup client_host::$1 client_ip::$2 src_ip::$2 src_port::$3 protocol::TLS

[carbonio_mail_tls_cipher_list]
REGEX = (?i)([^\[\s]+)\[([0-9a-fA-F:.]+)\]:(\d+):\s+TLS cipher list\s+"([^"]+)"
FORMAT = event_type::tls_cipher_list client_host::$1 client_ip::$2 src_ip::$2 src_port::$3 tls_cipher_list::$4 protocol::TLS

[carbonio_mail_tls_state]
REGEX = (?i)SSL_accept:(.+)$
FORMAT = event_type::tls_state tls_state::$1 protocol::TLS

[carbonio_mail_anvil_stats]
REGEX = (?i)statistics:\s+(.+?)\s+(\d+)(?:/(\d+)s)?(?:\s+for\s+\(([^:]+):([0-9a-fA-F:.]+)\))?\s+at\s+(.+)$
FORMAT = event_type::anvil_statistics anvil_metric::$1 anvil_value::$2 anvil_window_seconds::$3 service::$4 src_ip::$5 anvil_time::$6

[carbonio_mail_postfix_script]
REGEX = (?i)the Postfix mail system is running:\s+PID:\s+(\d+)
FORMAT = event_type::postfix_running service_status::running postfix_pid::$1

###########################################################mailbox###########################################################################################################################################

[carbonio_mailbox_context_kv]
SOURCE_KEY = context
REGEX = (?:^|;)\s*([A-Za-z][A-Za-z0-9_]*)=([^;]*)
FORMAT = $1::$2
MV_ADD = true

[carbonio_mailbox_elapsed]
SOURCE_KEY = message
REGEX = (?i)^([A-Za-z0-9]+(?:Request)?)\s+elapsed=(\d+)
FORMAT = operation::$1 elapsed_ms::$2

[carbonio_mailbox_purge]
SOURCE_KEY = message
REGEX = (?i)^Purging messages\.?
FORMAT = operation::Purging_messages event_type::mailbox_purge

[carbonio_mailbox_lmtp_deliver]
SOURCE_KEY = message
REGEX = (?i)^Delivering message:\s+size=(\d+)\s+bytes,\s+nrcpts=(\d+),\s+sender=([^,]*),\s+msgid=<([^>]+)>
FORMAT = event_type::lmtp_deliver size::$1 nrcpt::$2 sender::$3 message_id::$4 operation::Delivering_message

[carbonio_mailbox_mailop_add]
SOURCE_KEY = message
REGEX = (?i)^Adding Message:\s+id=(\d+),\s+Message-ID=<([^>]+)>,\s+parentId=([^,]+),\s+folderId=(\d+),\s+folderName=([^ ]+)\s+acct=([A-Fa-f0-9-]+)
FORMAT = event_type::mailop_add message_internal_id::$1 message_id::$2 parent_id::$3 folder_id::$4 folder_name::$5 account_id::$6 operation::Adding_Message

[carbonio_mailbox_auth_failed]
SOURCE_KEY = message
REGEX = (?i)authentication failed for \[([^\]]+)\]
FORMAT = event_type::authentication_failed failed_user::$1 account::$1

[carbonio_mailbox_auth_error_reason]
SOURCE_KEY = message
REGEX = (?i)Reason:\s+(.+?)(?:\.?$)
FORMAT = reason::$1

[carbonio_mailbox_ldap_error_code]
REGEX = (?i)data\s+([0-9a-f]+),\s+v[0-9a-f]+
FORMAT = ldap_error_code::$1

[carbonio_mailbox_delegated_access]
SOURCE_KEY = message
REGEX = (?i)delegated access:\s+doc=([^,]+),\s+(?:(?:delegating account=([^,]+),\s+)?)authenticated account=([^,]+),\s+target account=([^\s,]+)
FORMAT = event_type::delegated_access delegated_doc::$1 delegating_account::$2 authenticated_account::$3 target_account::$4

[carbonio_mailbox_ldap_warning]
SOURCE_KEY = message
REGEX = (?i)^Ignoring delete/modify empty value attribute,\s+reason:\s+(.+)$
FORMAT = event_type::ldap_warning reason::$1

[carbonio_mailbox_exception]
REGEX = (?m)^([A-Za-z0-9_.$]+(?:Exception|Error)(?:\$[A-Za-z0-9_.$]+)?):\s+(.+)$
FORMAT = exception_class::$1 exception_message::$2

[carbonio_mailbox_caused_by]
REGEX = (?m)^Caused by:\s+([A-Za-z0-9_.$]+(?:Exception|Error)):\s+(.+)$
FORMAT = caused_by_class::$1 caused_by_message::$2

[carbonio_mailbox_stack_methods]
REGEX = (?m)^\s+at\s+([A-Za-z0-9_.$]+)\.([A-Za-z0-9_$<>]+)\(([^:()]+)(?::(\d+))?\)
FORMAT = java_class::$1 java_method::$2 java_file::$3 java_line::$4
MV_ADD = true

##################################################################nginx######################################################################################################################

[carbonio_nginx_base]
REGEX = ^(?<nginx_time>\d{4}/\d{2}/\d{2}\s+\d{2}:\d{2}:\d{2})\s+\[(?<severity>\w+)\]\s+(?<process_id>\d+)#(?<thread_id>\d+):\s+\*(?<connection_id>\d+)\s+(?<message>.*)$

[carbonio_nginx_client]
REGEX = \bclient:?\s+(?<src_ip>\d{1,3}(?:\.\d{1,3}){3})(?::(?<src_port>\d+))?

[carbonio_nginx_server]
REGEX = \bserver:\s+(?<dest_ip>\d{1,3}(?:\.\d{1,3}){3})(?::(?<dest_port>\d+))?

[carbonio_nginx_login]
REGEX = \blogin:\s+"(?<user>[^"]+)"

[carbonio_nginx_upstream]
REGEX = \bupstream:\s+(?<upstream>[^\s,]+)


###############################################################nginx.access###################################################################

[carbonio_nginx_access_base]
REGEX = ^(?<src_ip>\d{1,3}(?:\.\d{1,3}){3}):(?<src_port>\d+)\s+\S+\s+\S+\s+\[(?<nginx_time>[^\]]+)\]\s+"(?<request>[^"]*)"\s+(?<status>\d{3})\s+(?<bytes>\d+|-)\s+"(?<http_referrer>[^"]*)"\s+"(?<http_user_agent>[^"]*)"\s+"(?<upstream>[^"]*)"\s+"(?<local_endpoint>[^"]*)"

[carbonio_nginx_access_request]
REGEX = ^(?:\d{1,3}(?:\.\d{1,3}){3}):\d+\s+\S+\s+\S+\s+\[[^\]]+\]\s+"(?<http_method>[A-Z]+)\s+(?<url>\S+)\s+HTTP/(?<http_version>\d+(?:\.\d+)?)"

[carbonio_nginx_access_url]
REGEX = \s+"[A-Z]+\s+(?<url_scheme>https?)://(?<http_host>[^/\s\?:]+)(?::(?<url_port>\d+))?(?<uri_path>/[^?\s"]*)?(?:\?(?<uri_query>[^\s"]+))?\s+HTTP/

[carbonio_nginx_access_upstream]
REGEX = "\s+"(?<upstream_host>[^":\s-]+|\d{1,3}(?:\.\d{1,3}){3}):(?<upstream_port>\d+)"\s+"

[carbonio_nginx_access_dest]
REGEX = "\s+"(?<dest_ip>\d{1,3}(?:\.\d{1,3}){3}):(?<dest_port>\d+)"$

[carbonio_nginx_access_mailbox]
REGEX = /home/(?<mailbox_user>[^/\?\s]+)

[carbonio_nginx_access_soap]
REGEX = /service/soap/(?<soap_request>[^/\?\s]+)

[carbonio_nginx_access_service]
REGEX = /services/(?<carbonio_service>[^/\?\s]+)

[carbonio_nginx_access_component]
REGEX = /static/iris/(?<carbonio_component>[^/\?\s]+)

##################################################################nginx_clamav_signature_provider_access##############################################################################################

[carbonio_nginx_clamav_access_base]
REGEX = ^(?<src_ip>\d{1,3}(?:\.\d{1,3}){3})\s+(?<ident>\S+)\s+(?<user>\S+)\s+\[(?<nginx_time>[^\]]+)\]\s+"(?<request>[^"]*)"\s+(?<status>\d{3})\s+(?<bytes>\d+|-)\s+"(?<http_referrer>[^"]*)"\s+"(?<http_user_agent>[^"]*)"

[carbonio_nginx_clamav_access_request]
REGEX = "\s*(?<http_method>[A-Z]+)\s+(?<uri_path>[^\s\?"]+)(?:\?(?<uri_query>[^\s"]+))?\s+HTTP/(?<http_version>\d+(?:\.\d+)?)"

###############################################################################preview##############################################################################################################

[carbonio_preview_base]
REGEX = ^"?\[(?<preview_time>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2},\d{3})\]\s+(?<severity>\w+)\s+\[(?<logger>[^\]:]+):(?<line_number>\d+)\]\s+(?<src_ip>\d{1,3}(?:\.\d{1,3}){3}):(?<src_port>\d+)\s+-\s+"(?<request>[^"]+)"\s+(?<status>\d{3})"?$

[carbonio_preview_request]
REGEX = "(?<http_method>[A-Z]+)\s+(?<uri_path>[^\s\?"]+)(?:\?(?<uri_query>[^\s"]+))?\s+HTTP/(?<http_version>\d+(?:\.\d+)?)"
