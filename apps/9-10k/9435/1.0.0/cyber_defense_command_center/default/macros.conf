[cdcc_security_indexes]
definition = index=cdcc_demo
iseval = 0
description = Security telemetry indexes used by Cyber Defense Command Center. Replace with an OR-separated production index scope.

[cdcc_risk_indexes]
definition = index=risk
iseval = 0
description = Enterprise Security risk-event index scope.

[cdcc_internal_indexes]
definition = index=_internal
iseval = 0
description = Splunk internal telemetry index scope.

[cdcc_audit_indexes]
definition = index=_audit
iseval = 0
description = Splunk audit index scope.

[cdcc_finding_sla_hours]
definition = 24
iseval = 0
description = Maximum acceptable open-finding age in hours for CDCC capacity-risk analytics.

[cdcc_detection_filter]
definition = [| rest /servicesNS/-/-/saved/searches | search action.correlationsearch.enabled=1 | rename title AS savedsearch_name | fields savedsearch_name | format]
iseval = 0
description = Dynamically restricts scheduler telemetry to Enterprise Security correlation searches.

[cdcc_windows_json_normalize]
definition = spath | eval src=coalesce(src,src_ip,Source_Network_Address), dest=coalesce(dest,Computer,host), user=coalesce(user,TargetUserName,SubjectUserName), action=coalesce(action,case(EventCode=4625,"failure",EventCode=4624,"success",true(),null())), signature=coalesce(signature,case(EventCode=4625,"An account failed to log on",EventCode=4624,"An account was successfully logged on",true(),null()))
iseval = 0
description = Parses and normalizes synthetic Windows JSON at search time without overriding WinEventLog:Security.

[cdcc_assurance_indexes]
definition = index=summary source=cdcc:detection_assurance
iseval = 0
description = Compact detection-engineering assessment states written by CDCC scheduled assessments.
