[CDCC - Refresh Detection Inventory]
description = Caches ES correlation-search metadata for low-latency dashboard panels.
search = | rest /servicesNS/-/-/saved/searches | search action.correlationsearch.enabled=1 | fields title disabled cron_schedule eai:acl.app action.correlationsearch.enabled action.correlationsearch.annotations action.notable.param.security_domain | outputlookup cdcc_detection_inventory.csv
cron_schedule = 1-59/15 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 0
disabled = 1
run_on_startup = false

[CDCC - Windows Password Spray - Risk]
description = Repeated Windows failures across multiple targets.
search = `cdcc_security_indexes` sourcetype=WinEventLog:Security | `cdcc_windows_json_normalize` | search EventCode=4625 | bin _time span=30m | stats count dc(dest) AS target_count values(dest) AS targets by src user _time | where count>=3
cron_schedule = 2-59/10 * * * *
dispatch.earliest_time = -40m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = CDCC - Windows Password Spray - Risk
action.correlationsearch.annotations = {"mitre_attack":["T1110.003"]}
action.correlationsearch.metadata = {"detection_id":"a72b8ce1-fc8a-47b2-8198-5e0c89749f01","deprecated":0,"detection_version":"1"}
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"src","risk_object_type":"system","risk_score":45},{"risk_object_field":"user","risk_object_type":"user","risk_score":35}]
action.risk.param._risk_message = Password spray from $src$ targeted $target_count$ systems for $user$ with $count$ failures.

[CDCC - Critical Endpoint Malware Blocked - Risk]
description = Critical blocked endpoint malware activity.
search = `cdcc_security_indexes` sourcetype=cdcc:edr is_synthetic=true severity=critical action=blocked | stats count values(threat_name) AS threats values(mitre_technique_id) AS techniques by dest user src | where count>=1
cron_schedule = 4-59/10 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = CDCC - Critical Endpoint Malware Blocked - Risk
action.correlationsearch.annotations = {"mitre_attack":["T1486"]}
action.correlationsearch.metadata = {"detection_id":"81d5fa78-6c3d-4bea-9318-b57f758d163e","deprecated":0,"detection_version":"1"}
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"dest","risk_object_type":"system","risk_score":80},{"risk_object_field":"user","risk_object_type":"user","risk_score":40}]
action.risk.param._risk_message = Critical endpoint threats $threats$ were blocked on $dest$ for $user$.

[CDCC - Network Device Threat Activity - Risk]
description = Repeated threat activity observed by network infrastructure.
search = `cdcc_security_indexes` sourcetype=cisco:ios is_synthetic=true threat_name=* | stats count dc(action) AS action_count values(action) AS actions values(threat_name) AS threats by device_name src user | where count>=3
cron_schedule = 6-59/10 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = CDCC - Network Device Threat Activity - Risk
action.correlationsearch.annotations = {"mitre_attack":["T1602.002"]}
action.correlationsearch.metadata = {"detection_id":"0d1310e8-9867-459c-a049-f77bb787e803","deprecated":0,"detection_version":"1"}
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"device_name","risk_object_type":"system","risk_score":60},{"risk_object_field":"user","risk_object_type":"user","risk_score":30}]
action.risk.param._risk_message = Network device $device_name$ observed repeated threats $threats$ from $src$.

[CDCC - High Confidence Suspicious DNS - Risk]
description = Repeated high-confidence malicious DNS activity.
search = `cdcc_security_indexes` sourcetype=stream:dns is_synthetic=true threat_name=* confidence=high | stats count dc(query) AS unique_queries values(threat_name) AS threats by src user | where count>=3
cron_schedule = 8-59/10 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = CDCC - High Confidence Suspicious DNS - Risk
action.correlationsearch.annotations = {"mitre_attack":["T1071.004"]}
action.correlationsearch.metadata = {"detection_id":"9ad4698c-f4d3-4226-bdc9-7d109466f2bc","deprecated":0,"detection_version":"1"}
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"src","risk_object_type":"system","risk_score":45},{"risk_object_field":"user","risk_object_type":"user","risk_score":25}]
action.risk.param._risk_message = $src$ generated $count$ suspicious DNS events across $unique_queries$ queries for $threats$.

[CDCC - Multi-Source Threat Convergence - Risk]
description = High-severity evidence for an entity across three or more telemetry sources.
search = `cdcc_security_indexes` is_synthetic=true threat_name=* severity IN (high,critical) | stats count dc(sourcetype) AS source_count values(sourcetype) AS sources values(threat_name) AS threats values(mitre_technique_id) AS techniques by src user | where source_count>=3
cron_schedule = 0-59/10 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = CDCC - Multi-Source Threat Convergence - Risk
action.correlationsearch.annotations = {"mitre_attack":["T1078","T1059.001"]}
action.correlationsearch.metadata = {"detection_id":"e58ba21b-7c9d-4d85-b04d-439c4ad84f24","deprecated":0,"detection_version":"1"}
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"src","risk_object_type":"system","risk_score":75},{"risk_object_field":"user","risk_object_type":"user","risk_score":50}]
action.risk.param._risk_message = Threat convergence for $src$ across $source_count$ sources: $sources$.

[CDCC - Elevated Entity Risk - Finding]
description = Entity with multiple intermediate findings and cumulative risk at or above 100.
search = | tstats `summariesonly` `common_fbd_fields` from datamodel=Risk.All_Risk where earliest=-24h@h latest=now by All_Risk.normalized_risk_object, All_Risk.risk_object_type, index | `drop_dm_object_name("All_Risk")` | `get_mitre_annotations` | `generate_findings_summary_on_entity` | where risk_score>=100 AND count_intermediate_findings>=2
cron_schedule = 3-59/10 * * * *
dispatch.earliest_time = -25h@h
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.suppress = 1
alert.suppress.period = 3600
alert.suppress.fields = normalized_risk_object,risk_object_type
action.correlationsearch.enabled = 1
action.correlationsearch.detection_type = fbd
action.correlationsearch.label = CDCC - Elevated Entity Risk - Finding
action.correlationsearch.annotations = {"mitre_attack":["T1078"]}
action.correlationsearch.metadata = {"detection_id":"cd12d921-3318-42fd-8f38-3e0c89ae6f7f","deprecated":0,"detection_version":"1"}
action.correlationsearch.input_type = custom-fbd
action.correlationsearch.reopen_finding_groups = 1
action.correlationsearch.search_on = ["int-finding","finding"]
action.notable = 1
action.notable.param.rule_title = CDCC Elevated Entity Risk: $normalized_risk_object$
action.notable.param.rule_description = Entity $normalized_risk_object$ accumulated risk $risk_score$ from $count_intermediate_findings$ intermediate findings.
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.investigation_type = default

[CDCC Assurance - Detection Reliability Assessment]
description = Records current scheduler reliability state for ES detections. This assessment recommends review and does not modify detection content.
search = `cdcc_internal_indexes` sourcetype=scheduler savedsearch_name=* `cdcc_detection_filter` | stats count AS runs count(eval(status!="success")) AS failures count(eval(status="skipped")) AS skips perc95(run_time) AS p95_runtime values(reason) AS reasons by savedsearch_name | rename savedsearch_name AS detection | eval assurance_type="Reliability", assurance_key="reliability::".detection, status=if(failures>=2 OR skips>=2,"open","healthy"), severity=case(failures>=5 OR skips>=5,"critical",failures>=2 OR skips>=2,"high",true(),"informational"), evidence="runs=".runs.", failures=".failures.", skips=".skips.", p95_runtime=".round(p95_runtime,2)."s", recommendation=if(status="open","Review the scheduler reason, search concurrency and SPL runtime in ES Content Management.","No action required."), assessment_version="1", owasp_category="A09:2025,A10:2025", _time=now() | fields _time assurance_key assurance_type status severity detection evidence recommendation assessment_version owasp_category | collect index=summary source="cdcc:detection_assurance" marker="assessment=reliability"
cron_schedule = 2-59/15 * * * *
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1

[CDCC Assurance - Runtime Regression Assessment]
description = Compares recent detection runtime with its prior seven-day baseline and records review recommendations only.
search = `cdcc_internal_indexes` sourcetype=scheduler savedsearch_name=* `cdcc_detection_filter` | eval period=if(_time>=relative_time(now(),"-24h"),"current","baseline") | stats perc95(run_time) AS p95_runtime by savedsearch_name period | xyseries savedsearch_name period p95_runtime | fillnull current baseline value=0 | rename savedsearch_name AS detection | eval assurance_type="Runtime regression", assurance_key="runtime::".detection, regression_ratio=if(baseline>0,round(current/baseline,2),0), status=if(current>=30 AND baseline>0 AND current>=baseline*2,"open","healthy"), severity=if(status="open","high","informational"), evidence="current_p95=".round(current,2)."s, baseline_p95=".round(baseline,2)."s, ratio=".regression_ratio, recommendation=if(status="open","Profile the SPL and verify data-volume or acceleration changes before promotion.","No action required."), assessment_version="1", owasp_category="A09:2025,A10:2025", _time=now() | fields _time assurance_key assurance_type status severity detection evidence recommendation assessment_version owasp_category | collect index=summary source="cdcc:detection_assurance" marker="assessment=runtime"
cron_schedule = 12 * * * *
dispatch.earliest_time = -8d@d
dispatch.latest_time = now
enableSched = 1
disabled = 1

[CDCC Assurance - Schedule Collision Assessment]
description = Identifies dense ES detection cron groups and recommends staggering; it never changes schedules.
search = | rest /servicesNS/-/-/saved/searches | search action.correlationsearch.enabled=1 disabled=0 cron_schedule!="" | stats count AS detection_count values(title) AS detection_list by cron_schedule | eval assurance_type="Schedule collision", assurance_key="schedule::".md5(cron_schedule), detection=mvjoin(detection_list,"; "), status=if(detection_count>=5,"open","healthy"), severity=if(detection_count>=10,"high",if(detection_count>=5,"medium","informational")), evidence="cron=".cron_schedule.", detections=".detection_count, recommendation=if(status="open","Stagger equivalent schedules after validating ES scheduling guidance and detection latency requirements.","No action required."), assessment_version="1", owasp_category="A05:2025,A09:2025,A10:2025", _time=now() | fields _time assurance_key assurance_type status severity detection evidence recommendation assessment_version owasp_category | collect index=summary source="cdcc:detection_assurance" marker="assessment=schedule"
cron_schedule = 27 2 * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
disabled = 1

[CDCC Assurance - Metadata Compliance Assessment]
description = Assesses detection metadata needed for maintainable content engineering without editing native ES content.
search = | rest /servicesNS/-/-/saved/searches | search action.correlationsearch.enabled=1 | rename title AS detection eai:acl.app AS app | eval annotations='action.correlationsearch.annotations', metadata='action.correlationsearch.metadata', risk_message='action.risk.param._risk_message', finding_title='action.notable.param.rule_title', missing=if(isnull(annotations) OR len(annotations)<3,"annotations;","").if(isnull(metadata) OR len(metadata)<3,"metadata;","").if(isnull(description) OR len(description)<3,"description;","").if('action.risk'=1 AND (isnull(risk_message) OR len(risk_message)<3),"risk_message;","").if('action.notable'=1 AND (isnull(finding_title) OR len(finding_title)<3),"finding_title;","") | eval missing=trim(missing,";"), missing_count=if(len(missing)=0,0,mvcount(split(missing,";"))), assurance_type="Metadata compliance", assurance_key="metadata::".app."::".detection, status=if(missing_count>0,"open","healthy"), severity=case(missing_count>=3,"high",missing_count>0,"medium",true(),"informational"), evidence=if(missing_count>0,"missing=".missing,"required metadata present"), recommendation=if(status="open","Complete the missing fields through native ES Content Management and preserve detection version history.","No action required."), assessment_version="1", owasp_category="A03:2025,A06:2025,A08:2025,A09:2025", _time=now() | fields _time assurance_key assurance_type status severity detection app evidence recommendation assessment_version owasp_category | collect index=summary source="cdcc:detection_assurance" marker="assessment=metadata"
cron_schedule = 42 2 * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
disabled = 1

[CDCC Assurance - Data Contract Assessment]
description = Records field-readiness exceptions by sourcetype as an engineering signal beyond native ES source-health monitoring.
search = `cdcc_security_indexes` | spath | eval has_src=if(isnotnull(src),1,0), has_dest=if(isnotnull(dest),1,0), has_action=if(isnotnull(action),1,0), has_signature=if(isnotnull(signature),1,0) | stats count avg(has_src) AS src_coverage avg(has_dest) AS dest_coverage avg(has_action) AS action_coverage avg(has_signature) AS signature_coverage by sourcetype | eval src_pct=round(src_coverage*100,1), dest_pct=round(dest_coverage*100,1), action_pct=round(action_coverage*100,1), signature_pct=round(signature_coverage*100,1), assurance_type="Data contract", assurance_key="contract::".sourcetype, detection=sourcetype, status=if(src_pct<50 AND dest_pct<50,"open","healthy"), severity=if(status="open","medium","informational"), evidence="src=".src_pct."%, dest=".dest_pct."%, action=".action_pct."%, signature=".signature_pct."%", recommendation=if(status="open","Review source-specific field aliases and CIM normalization; do not force fields that are not semantically applicable.","No action required."), assessment_version="1", owasp_category="A09:2025,A10:2025", _time=now() | fields _time assurance_key assurance_type status severity detection evidence recommendation assessment_version owasp_category | collect index=summary source="cdcc:detection_assurance" marker="assessment=data_contract"
cron_schedule = 52 * * * *
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 1
disabled = 1

[CDCC Assurance - Zero-Yield Review Assessment]
description = Flags enabled ES detections that executed repeatedly without producing risk events or findings. Review is required; no content is changed.
search = | rest /servicesNS/-/-/saved/searches | search action.correlationsearch.enabled=1 disabled=0 | rename title AS detection eai:acl.app AS app | fields detection app | join type=left detection [search `cdcc_internal_indexes` sourcetype=scheduler savedsearch_name=* `cdcc_detection_filter` | stats count AS runs count(eval(status="success")) AS successes by savedsearch_name | rename savedsearch_name AS detection] | join type=left detection [search `cdcc_risk_indexes` | eval detection=coalesce(search_name,source) | stats count AS risk_events by detection] | join type=left detection [search `notable` | eval detection=coalesce(rule_name,search_name) | stats count AS findings by detection] | fillnull runs successes risk_events findings value=0 | eval outputs=risk_events+findings, assurance_type="Zero-yield review", assurance_key="yield::".app."::".detection, status=if(successes>=10 AND outputs=0,"open","healthy"), severity=if(status="open","medium","informational"), evidence="successful_runs=".successes.", risk_events=".risk_events.", findings=".findings, recommendation=if(status="open","Validate test results, thresholds, data contracts and suppression in native ES before changing the detection.","No action required."), assessment_version="1", owasp_category="A06:2025,A09:2025,A10:2025", _time=now() | fields _time assurance_key assurance_type status severity detection app evidence recommendation assessment_version owasp_category | collect index=summary source="cdcc:detection_assurance" marker="assessment=zero_yield"
cron_schedule = 7 3 * * *
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
enableSched = 1
disabled = 1

[CDCC Assurance - Critical Engineering Issue - Finding]
description = Optional notification layer for recent high or critical engineering issues. Disabled by default; enabling creates ES findings but never changes detections.
search = `cdcc_assurance_indexes` | stats latest(_time) AS last_seen latest(status) AS status latest(severity) AS severity latest(assurance_type) AS assurance_type latest(detection) AS detection latest(evidence) AS evidence latest(recommendation) AS recommendation by assurance_key | where status="open" AND severity IN ("high","critical") AND last_seen>=relative_time(now(),"-90m")
cron_schedule = 8-59/15 * * * *
dispatch.earliest_time = -2h
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.suppress = 1
alert.suppress.period = 86400
alert.suppress.fields = assurance_key
action.correlationsearch.enabled = 1
action.correlationsearch.label = CDCC Assurance - Critical Engineering Issue - Finding
action.correlationsearch.annotations = {"owasp":["A09:2025","A10:2025"]}
action.correlationsearch.metadata = {"detection_id":"e692596b-f21e-4d57-b947-748e169eb70d","deprecated":0,"detection_version":"1"}
action.notable = 1
action.notable.param.rule_title = CDCC Engineering Issue: $assurance_type$
action.notable.param.rule_description = $detection$: $evidence$ Recommendation: $recommendation$
action.notable.param.security_domain = audit
action.notable.param.severity = high
action.notable.param.investigation_type = default

