# stg_Xage_TA — index-time parsing and search-time CIM normalization.
# Xage Fabric audit logs arrive as syslog:
#
#   <134> 2026-09-02T19:11:20Z edgehost01 xage[1]: <134>1 - - xage - auditlog - {"id":"...","sourceType":"Edge Node",...}
#
# Current onboarding: source=xage and/or source=tcp:5514, sourcetype=syslog.
# This TA:
#   1. Reclasses matching events to sourcetype=xage:audit at index time
#   2. Applies the same search-time extractions to source::xage so already-
#      indexed events CIM-normalize WITHOUT reindexing
#
# Search-time order (Splunk): REPORT → EVAL → LOOKUP → eventtypes → tags.
# EVALs therefore never reference lookup-populated fields (action, event_class).
# json_extract requires Splunk 8.0+.
#
# CIM refs:
#   https://docs.splunk.com/Documentation/CIM/latest/User/Authentication
#   https://docs.splunk.com/Documentation/CIM/latest/User/Change
#   https://docs.splunk.com/Documentation/CIM/latest/User/Alerts

################################################################################
# INDEX-TIME + SEARCH-TIME — sourcetype xage:audit (new data)
################################################################################
[xage:audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# Prefer JSON event time over the outer syslog header (1s forwarder time).
# %N (not %9N): sample timestamps use 8 or 9 fractional digits.
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%NZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TZ = UTC
CHARSET = UTF-8
TRUNCATE = 50000
ANNOTATE_PUNCT = false
KV_MODE = none
category = Splunk App Add-on
pulldown_type = 1
description = Xage Fabric Edge Node auditlog (syslog + JSON)

REPORT-xage_header = xage_syslog_header
REPORT-xage_json = xage_json_payload

# Vendor fields — each EVAL reads xage_json directly (no EVAL-to-EVAL coupling)
EVAL-id               = json_extract(xage_json,"id")
EVAL-sourceType       = json_extract(xage_json,"sourceType")
EVAL-msgLevel         = json_extract(xage_json,"msgLevel")
EVAL-message          = json_extract(xage_json,"message")
EVAL-xage_timestamp   = json_extract(xage_json,"timestamp")
EVAL-information      = json_extract(xage_json,"information")
EVAL-isTrusted        = json_extract(xage_json,"isTrusted")
EVAL-userId           = json_extract(xage_json,"details.userId")
EVAL-userName         = json_extract(xage_json,"details.userName")
EVAL-deviceName       = json_extract(xage_json,"details.deviceName")
EVAL-deviceUsername   = json_extract(xage_json,"details.deviceUsername")
EVAL-accessMethodName = json_extract(xage_json,"details.accessMethodName")
EVAL-connectionId     = json_extract(xage_json,"details.connectionId")
EVAL-sessionID        = json_extract(xage_json,"details.sessionID")
EVAL-sourceId         = json_extract(xage_json,"details.sourceId")
EVAL-requestor        = json_extract(xage_json,"details.requestor")
EVAL-errorCode        = json_extract(xage_json,"details.errorCode")
EVAL-errorMessage     = json_extract(xage_json,"details.errorMessage")
EVAL-info             = json_extract(xage_json,"details.info")
EVAL-XNID             = json_extract(xage_json,"details.XNID")
EVAL-XNName           = json_extract(xage_json,"details.XNName")
EVAL-credential_name  = json_extract(xage_json,"details.name")
EVAL-credential_type  = json_extract(xage_json,"details.type")
EVAL-credential_id    = json_extract(xage_json,"details.id")
EVAL-unveiledByUser   = json_extract(xage_json,"details.unveiledByUser")

# CIM — common (Authentication / Change / Alerts)
EVAL-vendor_product = "Xage Fabric"
EVAL-vendor         = "Xage"
EVAL-app            = "xage"
EVAL-product        = "Fabric"
EVAL-dvc            = coalesce(json_extract(xage_json,"details.XNName"), json_extract(xage_json,"details.sourceId"), syslog_host_raw, host)
EVAL-src            = coalesce(json_extract(xage_json,"details.XNName"), json_extract(xage_json,"details.sourceId"), syslog_host_raw)
EVAL-user           = coalesce(json_extract(xage_json,"details.userId"), json_extract(xage_json,"details.userName"), json_extract(xage_json,"details.unveiledByUser"))
EVAL-src_user       = case(match(json_extract(xage_json,"message"),"credentials_unveiled"), json_extract(xage_json,"details.unveiledByUser"), match(json_extract(xage_json,"message"),"password_rotation"), coalesce(json_extract(xage_json,"details.userId"), json_extract(xage_json,"details.userName")), 1==1, null())
EVAL-dest           = case(match(json_extract(xage_json,"message"),"credentials_unveiled"), coalesce(json_extract(xage_json,"details.XNName"), json_extract(xage_json,"details.sourceId"), host), isnotnull(json_extract(xage_json,"details.deviceName")), json_extract(xage_json,"details.deviceName"), 1==1, coalesce(json_extract(xage_json,"details.XNName"), json_extract(xage_json,"details.sourceId"), host))
EVAL-dest_nt_host   = json_extract(xage_json,"details.deviceName")
EVAL-authentication_method  = json_extract(xage_json,"details.accessMethodName")
EVAL-authentication_service = if(isnotnull(json_extract(xage_json,"details.accessMethodName")), "Xage", null())
EVAL-signature      = json_extract(xage_json,"message")
EVAL-signature_id   = json_extract(xage_json,"id")
EVAL-reason         = json_extract(xage_json,"details.errorMessage")
EVAL-reason_id      = json_extract(xage_json,"details.errorCode")
EVAL-session_id     = json_extract(xage_json,"details.sessionID")
EVAL-object         = case(match(json_extract(xage_json,"message"),"credentials_unveiled"), json_extract(xage_json,"details.name"), match(json_extract(xage_json,"message"),"password_rotation"), coalesce(json_extract(xage_json,"details.userId"), json_extract(xage_json,"details.userName")), match(json_extract(xage_json,"message"),"write_access"), json_extract(xage_json,"details.deviceName"), 1==1, coalesce(json_extract(xage_json,"details.deviceName"), json_extract(xage_json,"details.name"), json_extract(xage_json,"information")))
EVAL-object_id      = case(match(json_extract(xage_json,"message"),"credentials_unveiled"), json_extract(xage_json,"details.id"), match(json_extract(xage_json,"message"),"password_rotation"), coalesce(json_extract(xage_json,"details.userId"), json_extract(xage_json,"details.userName")), 1==1, coalesce(json_extract(xage_json,"details.connectionId"), json_extract(xage_json,"id")))
EVAL-object_attrs   = case(match(json_extract(xage_json,"message"),"credentials_unveiled"), json_extract(xage_json,"details.type"), json_extract(xage_json,"message")=="device_write_access_enabled", "write_access=enabled", json_extract(xage_json,"message")=="device_write_access_disabled", "write_access=disabled", json_extract(xage_json,"message")=="user_on_AD_password_rotation_success", "password_rotated=true", json_extract(xage_json,"message")=="user_on_AD_password_rotation_fail", "password_rotated=false", 1==1, json_extract(xage_json,"details.info"))
EVAL-command        = json_extract(xage_json,"message")
EVAL-result         = coalesce(json_extract(xage_json,"details.errorMessage"), if(match(json_extract(xage_json,"message"),"fail"), "failure", "success"))
EVAL-result_id      = json_extract(xage_json,"details.errorCode")
EVAL-severity       = case(lower(json_extract(xage_json,"msgLevel"))=="critical","critical", lower(json_extract(xage_json,"msgLevel"))=="error","high", lower(json_extract(xage_json,"msgLevel"))=="warning" OR lower(json_extract(xage_json,"msgLevel"))=="warn","medium", lower(json_extract(xage_json,"msgLevel"))=="info","informational", lower(json_extract(xage_json,"msgLevel"))=="debug","low", 1==1,"unknown")
EVAL-severity_id    = case(lower(json_extract(xage_json,"msgLevel"))=="critical",1, lower(json_extract(xage_json,"msgLevel"))=="error",3, lower(json_extract(xage_json,"msgLevel"))=="warning" OR lower(json_extract(xage_json,"msgLevel"))=="warn",4, lower(json_extract(xage_json,"msgLevel"))=="info",6, lower(json_extract(xage_json,"msgLevel"))=="debug",7, 1==1,6)
EVAL-description    = coalesce(json_extract(xage_json,"details.errorMessage"), json_extract(xage_json,"information"), json_extract(xage_json,"details.info"), json_extract(xage_json,"message"))
EVAL-type           = "event"

# LOOKUP fills CIM action/status/change_type/object_category/event_class from
# message. Runs AFTER EVAL, so it does not collide with the EVALs above.
LOOKUP-xage_cim = xage_message_cim message AS message OUTPUTNEW action, status, change_type, object_category, event_class, default_severity

