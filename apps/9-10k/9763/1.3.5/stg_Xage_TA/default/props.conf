################################################################################
# Optional: UF/HF can set sourcetype=xage:syslog; we reclass to xage:audit.
################################################################################
[xage:syslog]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%NZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TZ = UTC
CHARSET = UTF-8
TRUNCATE = 50000
ANNOTATE_PUNCT = false
KV_MODE = none
TRANSFORMS-xage_sourcetype = xage_set_sourcetype
category = Splunk App Add-on
pulldown_type = 1
description = Xage Fabric syslog (pre-reclass)
REPORT-xage_header = xage_syslog_header
REPORT-xage_json = xage_json_payload
EVAL-message        = json_extract(xage_json,"message")
EVAL-id             = json_extract(xage_json,"id")
EVAL-msgLevel       = json_extract(xage_json,"msgLevel")
EVAL-sourceType     = json_extract(xage_json,"sourceType")
EVAL-user           = coalesce(json_extract(xage_json,"details.userId"), json_extract(xage_json,"details.userName"), json_extract(xage_json,"details.unveiledByUser"))
EVAL-dest           = coalesce(json_extract(xage_json,"details.deviceName"), json_extract(xage_json,"details.XNName"), host)
EVAL-dvc            = coalesce(json_extract(xage_json,"details.XNName"), json_extract(xage_json,"details.sourceId"), host)
EVAL-vendor_product = "Xage Fabric"
EVAL-app            = "xage"
EVAL-signature      = json_extract(xage_json,"message")
EVAL-severity       = case(lower(json_extract(xage_json,"msgLevel"))=="error","high", lower(json_extract(xage_json,"msgLevel"))=="critical","critical", 1==1,"informational")
LOOKUP-xage_cim = xage_message_cim message AS message OUTPUTNEW action, status, change_type, object_category, event_class, default_severity

################################################################################
# Default sourcetype for [tcp://5514] when sourcetype is not set (tcp-raw).
# Transform REGEX is xage-specific; non-Xage tcp-raw is unchanged.
################################################################################
[tcp-raw]
TRANSFORMS-xage_sourcetype = xage_set_sourcetype
