# Example inputs. Copy stanzas you need into local/inputs.conf on the
# forwarder or syslog receiver. Do NOT enable these defaults as-is.
#
# Production is ingesting on TCP/5514 with Splunk's default source=tcp:5514
# (often sourcetype=syslog). The TA CIM-normalizes that source at search time
# and reclasses matching events to sourcetype=xage:audit at index time.
# You do not have to rename source= on the input.

# TCP syslog (matches production source=tcp:5514)
# [tcp://5514]
# disabled = 1
# sourcetype = syslog
# index = xage
# connection_host = ip

# UDP syslog from Xage Edge
# [udp://514]
# disabled = 1
# sourcetype = xage:syslog
# source = xage
# index = xage
# connection_host = ip

# File monitor (if Edge writes a local audit file that is forwarded)
# [monitor:///var/log/xage/audit.log]
# disabled = 1
# sourcetype = xage:audit
# source = xage
# index = xage
