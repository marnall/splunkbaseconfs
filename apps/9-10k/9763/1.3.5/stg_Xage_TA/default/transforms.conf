# stg_Xage_TA — index-time sourcetype rewrite and search-time field extraction.
# See https://docs.splunk.com/Documentation/Splunk/latest/Admin/Transformsconf

# -----------------------------------------------------------------------------
# INDEX-TIME
# Applied from props [source::xage] / [source::tcp:5514] / [xage:syslog].
# Reclassifies onboarded syslog to xage:audit going forward.
# REGEX is scoped so mixed traffic on tcp:5514 is not rewritten unless it is Xage auditlog.
# -----------------------------------------------------------------------------
[xage_set_sourcetype]
REGEX = xage(?:\[\d+\])?:.*auditlog
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::xage:audit

# -----------------------------------------------------------------------------
# SEARCH-TIME REPORT extractions (referenced via REPORT- in props.conf)
# -----------------------------------------------------------------------------

# Outer RFC3164-style syslog + nested RFC5424 header:
# <134> 2026-09-02T19:11:20Z edgehost01 xage[1]: <134>1 - - xage - auditlog - {json}
[xage_syslog_header]
REGEX = ^<(\d+)>\s+(\S+)\s+(\S+)\s+([^\[\s:]+)(?:\[(\d+)\])?:\s+<(\d+)>(\d+)\s+(\S+)\s+(\S+)\s+(\S+)\s+(\S+)\s+(\S+)\s+(\S+)\s+
FORMAT = syslog_pri::$1 syslog_time::$2 syslog_host_raw::$3 program::$4 pid::$5 rfc5424_pri::$6 rfc5424_ver::$7 rfc5424_ts::$8 rfc5424_host::$9 rfc5424_app::$10 rfc5424_procid::$11 rfc5424_msgid::$12 rfc5424_sd::$13

# JSON payload after "auditlog - "
[xage_json_payload]
REGEX = auditlog\s+-\s+(\{.*\})
FORMAT = xage_json::$1

# CIM lookup (search-time)
[xage_message_cim]
filename = xage_message_cim.csv
