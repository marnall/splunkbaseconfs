# Event types that attach CIM tags (see tags.conf).
# Search strings are inlined (no macros): eventtype+tag expansion on SHC can
# drop parentheses from nested macros, which would leave tag=authentication empty.

[xage_authentication_success]
search = (source=xage OR source="tcp:5514" OR sourcetype=xage:audit OR sourcetype=xage:syslog) (message=user_access_device_success OR message=user_access_device_start OR message=user_login_success)
priority = 1

[xage_authentication_failure]
search = (source=xage OR source="tcp:5514" OR sourcetype=xage:audit OR sourcetype=xage:syslog) (message=user_access_device_fail OR message=user_login_fail)
priority = 1

[xage_change_account]
search = (source=xage OR source="tcp:5514" OR sourcetype=xage:audit OR sourcetype=xage:syslog) (message=user_on_AD_password_rotation_success OR message=user_on_AD_password_rotation_fail)
priority = 1

[xage_change_endpoint]
search = (source=xage OR source="tcp:5514" OR sourcetype=xage:audit OR sourcetype=xage:syslog) (message=device_write_access_enabled OR message=device_write_access_disabled)
priority = 1

[xage_change_privileged]
search = (source=xage OR source="tcp:5514" OR sourcetype=xage:audit OR sourcetype=xage:syslog) (message=credentials_unveiled OR message=credentials_unveiled_fail)
priority = 1

[xage_alert]
search = (source=xage OR source="tcp:5514" OR sourcetype=xage:audit OR sourcetype=xage:syslog) (msgLevel=Error OR msgLevel=Critical OR message=*fail*)
priority = 2
