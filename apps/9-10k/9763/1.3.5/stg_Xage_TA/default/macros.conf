# CIM / source macros. Override index pin in local/macros.conf:
#   [xage_index]
#   definition = index=<your_index> `xage_sources`

[xage_sources]
definition = (source=xage OR source="tcp:5514" OR sourcetype=xage:audit OR sourcetype=xage:syslog)
iseval = 0

[xage_index]
definition = `xage_sources`
iseval = 0

[xage]
definition = `xage_index`
iseval = 0

[xage_cim_authentication]
definition = `xage` tag=authentication
iseval = 0

[xage_cim_change]
definition = `xage` tag=change
iseval = 0

[xage_cim_alerts]
definition = `xage` tag=alert
iseval = 0

[xage_privileged]
definition = `xage` (tag=privileged OR message=credentials_unveiled OR message=device_write_access_enabled OR message=user_on_AD_password_rotation_*)
iseval = 0
