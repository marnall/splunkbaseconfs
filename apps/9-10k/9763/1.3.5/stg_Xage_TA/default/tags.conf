# CIM tags. Event types must also be exported system-wide (metadata/default.meta).
# Authentication: https://docs.splunk.com/Documentation/CIM/latest/User/Authentication
# Change:         https://docs.splunk.com/Documentation/CIM/latest/User/Change
# Alerts:         https://docs.splunk.com/Documentation/CIM/latest/User/Alerts

[eventtype=xage_authentication_success]
authentication = enabled
success = enabled

[eventtype=xage_authentication_failure]
authentication = enabled
failure = enabled
alert = enabled

[eventtype=xage_change_account]
change = enabled
account = enabled
audit = enabled

[eventtype=xage_change_endpoint]
change = enabled
endpoint = enabled
audit = enabled

[eventtype=xage_change_privileged]
change = enabled
audit = enabled
privileged = enabled
# privileged is a search/PAM tag, not a CIM Authentication tag — Authentication.action
# cannot also hold Change.action=read.

[eventtype=xage_alert]
alert = enabled
