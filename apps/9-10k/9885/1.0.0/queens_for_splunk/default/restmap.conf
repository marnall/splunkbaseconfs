# Saving scores goes through the app, not straight to the KV store:
#   POST /services/queens/start   and   POST /services/queens/finish
# The handler gets the logged-in user from the session and writes with the app's
# system token, so users only need read access to the queens_scores collection.
[script:queens_game]
match = /queens
script = queens_rest.py
scripttype = persist
handler = queens_rest.QueensHandler
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passSystemAuth = true
python.version = python3
python.required = 3.9,3.13
