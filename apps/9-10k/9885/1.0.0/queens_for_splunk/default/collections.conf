# One record per solved puzzle, written by the Play page.
[queens_scores]
field.user = string
field.game_id = string
field.mode = string
field.daily_date = string
field.size = number
field.difficulty = string
field.time_ms = number
field.clicks = number
field.mistakes = number
field.hints = number
field.perfect = bool
field.comment = string
field.completed_at = time
accelerated_fields.by_user = {"user": 1}
accelerated_fields.by_daily = {"mode": 1, "daily_date": 1}

# One record per started game, written only by the queens endpoints.
# The server's start time here is what the score's time is measured from.
[queens_sessions]
field.user = string
field.game_id = string
field.mode = string
field.daily_date = string
field.started_at = number
field.finished_at = number
field.used = bool
