[DV IOC Enrichment - Process New Notables]
description = Automatically enrich new Splunk ES notable events and update urgency when configured thresholds are met.
search = index=notable (event_id=* OR source_event_id=*) | eval event_id=coalesce(event_id,source_event_id), processed_key=sha256(event_id) | dedup event_id | lookup dv_ioc_processed_lookup _key AS processed_key OUTPUT completed AS dv_ioc_completed | where isnull(dv_ioc_completed) OR (dv_ioc_completed!=1 AND dv_ioc_completed!="true") | sort 0 _indextime | head 500 | fields _time event_id source_event_id search_name source rule_id rule_name title severity urgency src src_ip dest dest_ip client_ip c_ip ip domain query dns_query dest_host host url uri request_url http_url file_hash hash md5 sha1 sha256
enableSched = 1
cron_schedule = */5 * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.digest_mode = 0
actions = dv_ioc_enrich
action.dv_ioc_enrich = 1
action.dv_ioc_enrich.param.update_notable = 1
action.dv_ioc_enrich.param.send_email = 1
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
is_visible = 1

[DV IOC Enrichment - Provider Quota Exhausted]
description = Detect provider-level quota exhaustion. Disabled by default; enable and configure alert actions when desired.
search = index=_internal source="*/dv_ioc_intelligence.log" earliest=-10m | spath | search event="api_quota_exhausted" | dedup provider | table _time provider next_retry_at message
enableSched = 0
cron_schedule = */5 * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.digest_mode = 1
dispatch.earliest_time = -10m
dispatch.latest_time = now
is_visible = 1

[DV IOC Enrichment - Processing Failures]
description = Detect enrichment, alert-action, lock and retention failures. Disabled by default; enable and configure alert actions when desired.
search = index=_internal source="*/dv_ioc_intelligence.log" earliest=-10m | spath | search event="provider_request_failed" OR event="api_key_rejected" OR event="quota_state_lock_failed" OR event="alert_action_failed" OR event="kv_retention_failed" | table _time level event provider status event_id error
enableSched = 0
cron_schedule = */5 * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.digest_mode = 1
dispatch.earliest_time = -10m
dispatch.latest_time = now
is_visible = 1
