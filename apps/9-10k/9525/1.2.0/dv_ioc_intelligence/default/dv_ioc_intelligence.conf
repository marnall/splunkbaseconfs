[general]
enabled = 1
skip_private_ips = 1
severity_when_malicious = high
email_enabled = 0
email_to =
email_subject = Malicious IOC detected by DV IOC Enrichment
proxy_url =
ca_bundle =
processed_retention_days = 90
max_iocs_per_event = 20
replay_window_hours = 24
ip_fields = src,src_ip,dest,dest_ip,client_ip,c_ip,ip
domain_fields = domain,query,dns_query,dest_host,host
url_fields = url,uri,request_url,http_url
hash_fields = file_hash,hash,md5,sha1,sha256

[virustotal]
enabled = 0
verify_tls = 1
api_url = https://www.virustotal.com/api/v3
malicious_threshold = 3
suspicious_threshold = 2
cache_ttl_hours = 24
minute_limit = 4
daily_limit = 500

[abuseipdb]
enabled = 0
verify_tls = 1
api_url = https://api.abuseipdb.com/api/v2
confidence_threshold = 40
cache_ttl_hours = 24
daily_limit = 1000
max_age_days = 90

[misp]
enabled = 0
verify_tls = 1
api_url = https://misp.example.com
match_threshold = 1
cache_ttl_hours = 24
minute_limit = 60
daily_limit = 10000
published_only = 1
to_ids_only = 1
enforce_warninglist = 1

[otx]
enabled = 0
verify_tls = 1
api_url = https://otx.alienvault.com/api/v1
pulse_threshold = 1
max_pulse_age_days = 365
cache_ttl_hours = 24
minute_limit = 60
daily_limit = 10000
