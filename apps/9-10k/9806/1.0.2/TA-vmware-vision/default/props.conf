# Raw parsing settings shared with the search app.

[vmware:vision:vcenter]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=(?:<\d{1,3}>)?(?:1\s+)?(?:\d{4}-\d\d-\d\d[T ]|[A-Z][a-z]{2}\s+\d{1,2}\s)|Event\s+\[)
TRUNCATE = 262144
MAX_TIMESTAMP_LOOKAHEAD = 40
TIME_PREFIX = ^(?:<\d+>)?(?:1\s+)?
CHARSET = UTF-8

