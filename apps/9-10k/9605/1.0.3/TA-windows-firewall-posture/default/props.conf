##############################################################################
# TA-windows-firewall-posture - props.conf
##############################################################################

[windows:firewall:profile]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# A profile event is ~600 characters. Generous margin, still bounded.
TRUNCATE = 8000
TIME_PREFIX = collected_time=
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 25
KV_MODE = auto
category = Network & Security
description = Windows Defender Firewall profile posture inventory
pulldown_type = 1
FIELDALIAS-dvc = Computer ASNEW dvc Computer ASNEW dest Computer ASNEW host_name
EVAL-vendor_product = "Microsoft Windows Defender Firewall"
EVAL-severity = case(compliant="true","informational", finding_count>=3,"high", finding_count>=1,"medium", true(),"informational")

[windows:firewall:rule]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# A GPO rule can carry a long RemoteAddress or LocalPort list. The risk
# scoring fields (risks, risk_count, severity) are written at the END of the
# event, so a truncation would silently drop exactly what the inventory is
# for. Well above the 10000 default on purpose.
TRUNCATE = 25000
TIME_PREFIX = collected_time=
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 25
KV_MODE = auto
category = Network & Security
description = Windows Defender Firewall rule inventory
pulldown_type = 1
FIELDALIAS-dvc = Computer ASNEW dvc Computer ASNEW dest
FIELDALIAS-object = rule_name ASNEW object
EVAL-vendor_product = "Microsoft Windows Defender Firewall"
EVAL-object_category = "firewall_rule"
EVAL-profile_name = case(profile="1","Domain", profile="2","Private", profile="3","Domain, Private", profile="4","Public", profile="5","Domain, Public", profile="6","Private, Public", profile="7","All", profile="2147483647","All", profile="Any","All", true(), profile)
