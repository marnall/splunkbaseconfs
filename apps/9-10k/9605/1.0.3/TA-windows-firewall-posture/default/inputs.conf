##############################################################################
# TA-windows-firewall-posture - inputs.conf
#
# Both inputs ship DISABLED. Installing this add-on must never start a
# collection behind the administrator's back - enable them explicitly.
#
# Create local/inputs.conf on the forwarders (or push it from a deployment
# server) with at least:
#
#     [powershell://wfo_firewall_profiles]
#     disabled = 0
#     index = <your index>
#
#     [powershell://wfo_firewall_rules]
#     disabled = 0
#     index = <your index>
#
# The index must match the one declared in the `windows_firewall_index` macro
# on the search head, in the Microsoft Windows Firewall Observability app.
#
# Both scripts are READ ONLY: they query the local Windows Defender Firewall
# configuration through the NetSecurity cmdlets and never modify it.
#
# Requires: Windows 8.1 / Server 2012 R2 or later (NetSecurity module),
#           PowerShell 3.0 or later. The forwarder service account needs to
#           read the firewall configuration - Local System is enough.
##############################################################################

# Profile state: enabled, default actions, logging settings, log file health.
# Cheap (3 events per run), so every 30 minutes is fine.
[powershell://wfo_firewall_profiles]
script = . "$SplunkHome\etc\apps\TA-windows-firewall-posture\bin\wfo_get_firewall_profiles.ps1"
schedule = 0,30 * * * *
index = windows_firewall
sourcetype = windows:firewall:profile
disabled = 1

# Rule inventory: one event per enabled rule, with its port, address and
# application filters plus a risk score. A workstation has 200-400 rules, so
# this runs once a day, off peak.
[powershell://wfo_firewall_rules]
script = . "$SplunkHome\etc\apps\TA-windows-firewall-posture\bin\wfo_get_firewall_rules.ps1"
schedule = 17 3 * * *
index = windows_firewall
sourcetype = windows:firewall:rule
disabled = 1
