# Federal AI LookupOps capabilities and convenience roles.
# Shipped roles grant nothing by default beyond the capability sets below;
# administrators map them to real users/groups (including SAML groups)
# through standard Splunk role mapping.

[capability::lookupops_view]
[capability::lookupops_submit]
[capability::lookupops_approve]
[capability::lookupops_publish]
[capability::lookupops_rollback]
[capability::lookupops_use_ai]
[capability::lookupops_ai_admin]

[role_lookupops_user]
lookupops_view = enabled
lookupops_submit = enabled

[role_lookupops_reviewer]
importRoles = lookupops_user
lookupops_approve = enabled
lookupops_use_ai = enabled

[role_lookupops_publisher]
importRoles = lookupops_reviewer
lookupops_publish = enabled
lookupops_rollback = enabled

[role_lookupops_admin]
importRoles = lookupops_publisher
lookupops_ai_admin = enabled
