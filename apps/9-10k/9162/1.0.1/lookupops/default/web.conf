# Expose the LookupOps splunkd endpoint through Splunk Web with the user's
# session (CSRF-protected by Splunk Web's standard token handling).
#
# A `pattern` with a single `*` matches exactly one path segment, so one
# stanza per depth is required. The router serves routes up to three
# segments deep (for example /lookupops/requests/<id>/approve); without the
# deeper stanzas those nested routes return 404 through Splunk Web even
# though they resolve correctly against splunkd directly.
[expose:lookupops]
pattern = lookupops
methods = GET,POST,DELETE

[expose:lookupops_1]
pattern = lookupops/*
methods = GET,POST,DELETE

[expose:lookupops_2]
pattern = lookupops/*/*
methods = GET,POST,DELETE

[expose:lookupops_3]
pattern = lookupops/*/*/*
methods = GET,POST,DELETE
