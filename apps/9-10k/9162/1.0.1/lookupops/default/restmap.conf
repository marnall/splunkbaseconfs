[script:lookupops]
match = /lookupops
script = lookupops_rest.py
scripttype = persist
handler = lookupops_rest.LookupOpsHandler
python.version = python3
# python.version is deprecated as of Splunk Enterprise 10.2 but is still
# required by Splunk 9.x and by AppInspect's python3 check, so both settings
# are kept. On 10.2+ python.required takes precedence and the platform
# selects the highest listed interpreter that is available.
python.required = 3.9,3.13
requireAuthentication = true
