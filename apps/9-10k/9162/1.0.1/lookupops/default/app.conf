[install]
is_configured = 0
state = enabled
build = 2

[package]
id = lookupops
check_for_updates = true

[id]
name = lookupops
version = 1.0.1

[ui]
is_visible = 1
label = Federal AI LookupOps
# No setup_view is declared. Splunk gates every view in an app behind its
# setup page whenever a setup_view is declared and [install] is_configured
# is 0, and it only clears that gate when the setup page writes
# configured=1 back to the app. The LookupOps setup page is guidance only
# (it links to role mapping, the policy builder, and settings; it stores
# nothing), so declaring it left a fresh install stuck on the "App
# configuration" interstitial with no way through. The page is still
# shipped and is reachable from the nav bar as "Setup".

[launcher]
author = Federal AI
version = 1.0.1
description = Native, air-gap-first governance and AI-assisted review for Splunk lookup changes. Inventory, validate, diff, approve, publish, verify, and roll back CSV and KV Store lookups entirely inside Splunk.
