# "KV Editable Table" in the visualization picker; configured in the Format menu.
[kv_edit_table]
label = KV Editable Table
description = Editable table over KV store records: run a search over the lookup, set the collection in the Format menu, click cells, Save. Writes merge per record.
search_fragment = | inputlookup my_kvstore_lookup
default_height = 320
supports_trellis = false
supports_drilldown = true
supports_export = false
