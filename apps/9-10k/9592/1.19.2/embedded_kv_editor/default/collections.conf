# Demo collection for the demo dashboard. A field declared "= number" silently
# drops non-numeric or empty values on write: declare it only when every value
# is numeric (the demo's "priority").
[kv_editor_demo]
field.status = string
field.priority = number
field.owner = string
field.reviewer = string
field.comment = string
# stored fields of log-fed tables (Fields to store)
field.host = string
field.sourcetype = string
replicate = false
