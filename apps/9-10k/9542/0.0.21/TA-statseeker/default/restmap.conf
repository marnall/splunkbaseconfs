[admin:TA-statseeker_configuration]
match = /
members = TA-statseeker_account, TA-statseeker_settings

[admin:TA-statseeker_inputs]
match = /
members = TA-statseeker_statseeker_cpu_metrics, TA-statseeker_statseeker_device_health, TA-statseeker_statseeker_device_lookup, TA-statseeker_statseeker_device_temperature, TA-statseeker_statseeker_event_records, TA-statseeker_statseeker_memory_metrics, TA-statseeker_statseeker_port_metrics, TA-statseeker_statseeker_wan3g

[admin_external:TA-statseeker_account]
handlertype = python
python.version = python3
handlerfile = TA-statseeker_rh_account.py
handleractions = edit, list, remove, create
handlerpersistentmode = true

