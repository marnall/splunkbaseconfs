[statseeker_port_metrics]
python.version = python3
interval = 300
index = default
metric_fields = RxBps,TxBps,RxUtil,TxUtil,RxDiscardsPercent,TxDiscardsPercent,RxErrorPercent,TxErrorPercent
metadata_fields = ifAlias,ifDescr,ifAdminStatus,ifOperStatus,ifSpeed,idx,cdt_device.name,cdt_device.ipaddress
timefilter = range=now - 6m to now - 1m
sample_interval = 60
page_size = 500

[statseeker_device_health]
python.version = python3
interval = 300
index = default
device_fields = ipaddress,vendor,sysLocation,snmp_poll,snmp_state,ping_poll,ping_state,sysName,sysDescr,sysObjectID,memorySize
ping_metric_fields = ping_rtt,ping_jitter,ping_lost_percent
timefilter = range=now - 6m to now - 1m
page_size = 500

[statseeker_device_temperature]
python.version = python3
interval = 300
index = default
current_fields = temperatureValueCelsius
temperature_fields = temperatureDescr,temperatureType,idx,cdt_device.name
timefilter = range=now - 6m to now
page_size = 500

[statseeker_wan3g]
python.version = python3
interval = 300
index = default
current_fields = ModemTemp,GsmRSSI,GsmEcIo,NearbyCells,RetriesRemaining,RxBytes,TxBytes
wan3g_fields = IMEI,GsmCountry,GsmNetwork,idx,cdt_device.name
nearby_current_fields = PrimaryScramblingCode,RSCP,EcIoMeasurement
timefilter = range=now - 6m to now
page_size = 500

[statseeker_cpu_metrics]
python.version = python3
interval = 300
index = default
metric_fields = cpuLoad
metadata_fields = cpuDescr,cpuType,idx,cdt_device.name
timefilter = range=now - 6m to now - 1m
sample_interval = 60
page_size = 500

[statseeker_memory_metrics]
python.version = python3
interval = 300
index = default
metric_fields = memoryUsedPercent,memoryFreePercent,memoryUsed,memoryFree
metadata_fields = memoryDesc,memoryType,memorySize,idx,cdt_device.name
timefilter = range=now - 6m to now - 1m
sample_interval = 60
page_size = 500

[statseeker_device_lookup]
python.version = python3
interval = 300
lookup_filename = statseeker_device_inventory.csv
device_fields = ipaddress,vendor,sysLocation,snmp_poll,snmp_state,ping_poll,ping_state,sysName,sysDescr,sysObjectID,memorySize
page_size = 500

[statseeker_event_records]
python.version = python3
interval = 300
index = default
resource_name = event_record
timefilter = range=now - 6m to now
page_size = 500
