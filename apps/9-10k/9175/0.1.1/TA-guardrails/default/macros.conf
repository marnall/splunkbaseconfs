[guardrail_index]
definition = (index=guardrails)
iseval = 0

[guardrail_events]
definition = `guardrail_index` sourcetype=guardrail:*
iseval = 0

###############################################################################
# Per-finding explosion
#
# Event-level fields summarise the whole evaluation. These macros expand the
# nested arrays into one row per finding, which is what you want for accurate
# counts by category and for anything feeding risk scoring.
###############################################################################

[guardrail_findings_bedrock]
definition = `guardrail_index` sourcetype=guardrail:bedrock | spath path=guardrail.assessments{}.contentPolicy.filters{} output=_f | mvexpand _f | spath input=_f | rename type AS vendor_category, confidence AS vendor_severity, action AS vendor_action | eval guardrail_vendor="bedrock", finding_type="content_filter" | lookup guardrail_category_map guardrail_vendor, vendor_category OUTPUT category | lookup guardrail_severity_map guardrail_vendor, vendor_severity OUTPUT guardrail_score, severity, severity_id | lookup guardrail_action_map guardrail_vendor, vendor_action OUTPUT guardrail_action, action | fields - _f
iseval = 0

[guardrail_findings_bedrock_pii]
definition = `guardrail_index` sourcetype=guardrail:bedrock | spath path=guardrail.assessments{}.sensitiveInformationPolicy.piiEntities{} output=_f | mvexpand _f | spath input=_f | rename type AS pii_type, action AS vendor_action | eval guardrail_vendor="bedrock", vendor_category="PII", category="pii_exposure", finding_type="pii", vendor_severity="HIGH" | lookup guardrail_severity_map guardrail_vendor, vendor_severity OUTPUT guardrail_score, severity, severity_id | lookup guardrail_action_map guardrail_vendor, vendor_action OUTPUT guardrail_action, action | fields - _f
iseval = 0

[guardrail_findings_vertex]
definition = `guardrail_index` sourcetype=guardrail:vertex | spath path=jsonPayload.safetyRatings{} output=_f | mvexpand _f | spath input=_f | rename category AS vendor_category, severity AS vendor_severity, blocked AS vendor_action | eval guardrail_vendor="vertex", finding_type="safety_rating" | lookup guardrail_category_map guardrail_vendor, vendor_category OUTPUT category | lookup guardrail_severity_map guardrail_vendor, vendor_severity OUTPUT guardrail_score, severity, severity_id | lookup guardrail_action_map guardrail_vendor, vendor_action OUTPUT guardrail_action, action | fields - _f
iseval = 0

[guardrail_findings_acs]
definition = `guardrail_index` sourcetype=guardrail:azure:contentsafety | spath path=properties.result.categoriesAnalysis{} output=_f | mvexpand _f | spath input=_f | rename category AS vendor_category, severity AS vendor_severity | eval guardrail_vendor="azure_content_safety", finding_type="content_category", vendor_action='properties.decision' | lookup guardrail_category_map guardrail_vendor, vendor_category OUTPUT category | lookup guardrail_severity_map guardrail_vendor, vendor_severity OUTPUT guardrail_score, severity, severity_id | lookup guardrail_action_map guardrail_vendor, vendor_action OUTPUT guardrail_action, action | fields - _f
iseval = 0

[guardrail_findings_nemo]
definition = `guardrail_index` sourcetype=guardrail:nemo | spath path=activated_rails{} output=_f | mvexpand _f | spath input=_f | rename name AS vendor_category, decision AS vendor_action | eval guardrail_vendor="nemo", finding_type="rail", vendor_severity=if(vendor_action=="refuse","blocked","allowed") | lookup guardrail_category_map guardrail_vendor, vendor_category OUTPUT category | lookup guardrail_severity_map guardrail_vendor, vendor_severity OUTPUT guardrail_score, severity, severity_id | lookup guardrail_action_map guardrail_vendor, vendor_action OUTPUT guardrail_action, action | fields - _f
iseval = 0

[guardrail_findings_llamaguard]
definition = `guardrail_index` sourcetype=guardrail:llamaguard | spath path=violated_categories{} output=_f | mvexpand _f | rename _f AS vendor_category | eval guardrail_vendor="llama_guard", finding_type="hazard", vendor_severity=verdict, vendor_action=verdict | lookup guardrail_category_map guardrail_vendor, vendor_category OUTPUT category | lookup guardrail_severity_map guardrail_vendor, vendor_severity OUTPUT guardrail_score, severity, severity_id | lookup guardrail_action_map guardrail_vendor, vendor_action OUTPUT guardrail_action, action
iseval = 0

# Union of every per-finding view. Use inside a search: | `guardrail_findings`
[guardrail_findings]
definition = union [search `guardrail_findings_bedrock`] [search `guardrail_findings_bedrock_pii`] [search `guardrail_findings_vertex`] [search `guardrail_findings_acs`] [search `guardrail_findings_nemo`] [search `guardrail_findings_llamaguard`] | lookup guardrail_categories category OUTPUT category_family, is_attack, category_description
iseval = 0

###############################################################################
# Analyst views
###############################################################################

# Adversarial attempts only - injection, jailbreak, credential probing.
[guardrail_attacks]
definition = `guardrail_events` is_attack_attempt=1
iseval = 0

# Repeat offenders. The signal is not one blocked prompt, it is persistence.
[guardrail_top_offenders(1)]
args = window
definition = `guardrail_attacks` earliest=-$window$ | stats count AS attempts, dc(category) AS distinct_categories, values(category) AS categories, max(guardrail_score) AS max_score BY actor, user_domain, src, app | where attempts > 5 | sort - attempts
iseval = 0

# Bypass reconnaissance: one identity probing many distinct categories in a
# short window looks like someone mapping the guardrail, not a confused user.
[guardrail_bypass_recon]
definition = `guardrail_events` action=blocked | bucket _time span=15m | stats dc(category) AS categories_tripped, count AS attempts, values(category) AS which BY _time, actor, src | where categories_tripped >= 4
iseval = 0

# Guardrail volume collapsing while the application keeps serving traffic is
# the signature of a disabled or misconfigured policy. Absence of evidence is
# the alert here, so this has to be scheduled rather than watched on a panel.
[guardrail_silent_failure]
definition = `guardrail_events` | timechart span=1h count AS evaluations BY guardrail_vendor | untable _time, guardrail_vendor, evaluations | eventstats avg(evaluations) AS baseline, stdev(evaluations) AS sd BY guardrail_vendor | where evaluations < (baseline - 2*sd) AND baseline > 10
iseval = 0

# PII egress attempts. The filter caught it; the attempt is still the signal.
[guardrail_pii_attempts]
definition = `guardrail_events` category=pii_exposure direction=input | stats count AS attempts, values(guardrail_action) AS actions BY actor, src, app | sort - attempts
iseval = 0

# Output-direction blocks mean the model produced something unsafe, which is a
# different problem from a user asking for something unsafe.
[guardrail_output_failures]
definition = `guardrail_events` direction=output action=blocked | stats count BY model, category, app | sort - count
iseval = 0

[guardrail_block_rate]
definition = `guardrail_events` | timechart span=1h count(eval(action="blocked")) AS blocked, count AS total | eval block_rate_pct = round(blocked/total*100, 2)
iseval = 0
