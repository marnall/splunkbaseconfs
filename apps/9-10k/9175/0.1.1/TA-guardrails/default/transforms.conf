[guardrail_category_map]
filename = guardrail_category_map.csv
case_sensitive_match = true

[guardrail_severity_map]
filename = guardrail_severity_map.csv
case_sensitive_match = false

[guardrail_action_map]
filename = guardrail_action_map.csv
case_sensitive_match = false

[guardrail_categories]
filename = guardrail_categories.csv
case_sensitive_match = false

# Optional: drop evaluations where nothing fired. High volume, low signal.
# Apply with TRANSFORMS-drop = guardrail_drop_clean in local/props.conf.
[guardrail_drop_clean]
REGEX = "(?:guardrailAction|decision|verdict|finishReason)":"(?:NONE|accept|safe|STOP)"
DEST_KEY = queue
FORMAT = nullQueue
