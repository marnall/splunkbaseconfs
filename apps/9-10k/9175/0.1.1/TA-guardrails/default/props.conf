###############################################################################
# TA-guardrails - field normalization
#
# Every sourcetype below resolves to the same event-level schema:
#
#   guardrail_vendor  guardrail_id      guardrail_version  direction
#   guardrail_action  action            vendor_category    category
#   guardrail_score   severity          severity_id        signature
#   model             app               user               src
#   dest              request_id        vendor_product     ids_type
#
# Design note on multivalue findings
# ---------------------------------
# A single guardrail evaluation usually produces several findings: four content
# categories scored, two PII entities matched, one topic denied. Splunk's
# automatic lookups behave inconsistently across versions when the input field
# is multivalue, so the event-level fields here describe the *evaluation as a
# whole* - did anything block, what was the most severe category - and are
# single-valued and safe to accelerate in a datamodel.
#
# For per-finding analysis use the `guardrail_findings` macro, which explodes
# the nested arrays into one row per finding and applies the lookups on
# single-valued fields where their behaviour is well defined. That path is the
# authoritative one; the event-level fields are a summary for acceleration.
###############################################################################


###############################################################################
# AWS Bedrock Guardrails (via model invocation logging)
###############################################################################
[guardrail:bedrock]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 0
category = Structured
description = AWS Bedrock Guardrails assessment
pulldown_type = 1

# Prompt and completion bodies are dropped at index time. See README.
SEDCMD-a_drop_input_body = s/"inputBodyJson":\{.*?\},"inputContentType"/"inputBodyJson":{"redacted":true},"inputContentType"/g
SEDCMD-b_drop_pii_match = s/"match":"[^"]*"/"match":"<redacted>"/g

EVAL-guardrail_vendor = "bedrock"
EVAL-vendor_product = "AWS Bedrock Guardrails"
FIELDALIAS-bedrock_ids = guardrail.guardrailId AS guardrail_id guardrail.guardrailVersion AS guardrail_version requestId AS request_id modelId AS model
FIELDALIAS-bedrock_identity = identity.arn AS user
EVAL-direction = lower(coalesce('guardrail.inputDirection', "input"))
EVAL-vendor_action = coalesce('guardrail.action', "NONE")
EVAL-app = coalesce(app, mvindex(split(coalesce('identity.arn', "unknown"), "/"), 1))
EVAL-dest = coalesce(dest, "bedrock." . coalesce(region, "unknown") . ".amazonaws.com")
EVAL-vendor_category = mvappend('guardrail.assessments{}.contentPolicy.filters{}.type', if(isnotnull('guardrail.assessments{}.topicPolicy.topics{}.name'), "TOPIC", null()), if(isnotnull('guardrail.assessments{}.sensitiveInformationPolicy.piiEntities{}.type'), "PII", null()))
EVAL-vendor_severity = coalesce(mvindex('guardrail.assessments{}.contentPolicy.filters{}.confidence', 0), if('guardrail.action'=="GUARDRAIL_INTERVENED", "HIGH", "NONE"))
EVAL-signature = "bedrock:" . coalesce(mvjoin(mvdedup('guardrail.assessments{}.contentPolicy.filters{}.type'), ","), "policy")
EVAL-finding_count = coalesce(mvcount('guardrail.assessments{}.contentPolicy.filters{}.type'), 0) + coalesce(mvcount('guardrail.assessments{}.sensitiveInformationPolicy.piiEntities{}.type'), 0) + coalesce(mvcount('guardrail.assessments{}.topicPolicy.topics{}.name'), 0)

###############################################################################
# Azure AI Content Safety
###############################################################################

# --- shared normalization (generated; see bin/build_lookups.py) ---
LOOKUP-01_category = guardrail_category_map guardrail_vendor, vendor_category OUTPUTNEW category
LOOKUP-02_severity = guardrail_severity_map guardrail_vendor, vendor_severity OUTPUTNEW guardrail_score, severity, severity_id
LOOKUP-03_action = guardrail_action_map guardrail_vendor, vendor_action OUTPUTNEW guardrail_action, action
LOOKUP-04_family = guardrail_categories category OUTPUTNEW category_family, is_attack, category_description
EVAL-ids_type = "application"
EVAL-dvc = coalesce(dest, host)
EVAL-user_name = user
EVAL-user_id = lower(mvindex(split(mvindex(split(coalesce(user, "unknown"), "/"), -1), "@"), 0))
EVAL-user_domain = if(match(coalesce(user,""), "@"), lower(mvindex(split(user, "@"), -1)), null())
EVAL-actor = coalesce(user_id, src, "unknown")
EVAL-category = coalesce(category, "unknown")
EVAL-severity = coalesce(severity, "unknown")
EVAL-severity_id = coalesce(severity_id, 0)
EVAL-guardrail_score = coalesce(guardrail_score, 0)
EVAL-guardrail_action = coalesce(guardrail_action, "allowed")
EVAL-action = coalesce(action, "allowed")
EVAL-is_blocked = if(action=="blocked", 1, 0)
EVAL-is_attack_attempt = if(is_attack==1 AND guardrail_action!="allowed", 1, 0)
[guardrail:azure:contentsafety]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%7NZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 0
category = Structured
description = Azure AI Content Safety analysis
pulldown_type = 1

SEDCMD-a_drop_blocklist_text = s/"blocklistItemText":"[^"]*"/"blocklistItemText":"<redacted>"/g

EVAL-guardrail_vendor = "azure_content_safety"
EVAL-vendor_product = "Azure AI Content Safety"
FIELDALIAS-acs_ids = correlationId AS request_id properties.userPrincipal AS user callerIpAddress AS src properties.apiName AS guardrail_id
EVAL-direction = lower(coalesce('properties.direction', "input"))
EVAL-vendor_action = coalesce('properties.decision', "accept")
EVAL-dest = coalesce(dest, mvindex(split(coalesce(resourceId, "unknown"), "/"), -1))
EVAL-app = coalesce(app, operationName)
EVAL-vendor_category = mvappend('properties.result.categoriesAnalysis{}.category', if('properties.promptShield.userPromptAnalysis.attackDetected'=="true", "userPromptAttack", null()), if(mvcount('properties.result.blocklistsMatch{}.blocklistName')>0, "blocklistsMatch", null()))
EVAL-vendor_severity = tostring(max(mvmap('properties.result.categoriesAnalysis{}.severity', tonumber('properties.result.categoriesAnalysis{}.severity'))))
EVAL-signature = "azure_content_safety:" . coalesce(mvjoin(mvdedup('properties.result.categoriesAnalysis{}.category'), ","), "analysis")
EVAL-finding_count = coalesce(mvcount('properties.result.categoriesAnalysis{}.category'), 0)

