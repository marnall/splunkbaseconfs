[guardrail_evaluation]
search = sourcetype=guardrail:*

[guardrail_blocked]
search = sourcetype=guardrail:* action=blocked

[guardrail_attack_attempt]
search = sourcetype=guardrail:* is_attack_attempt=1

[guardrail_pii_detected]
search = sourcetype=guardrail:* category=pii_exposure

[guardrail_prompt_injection]
search = sourcetype=guardrail:* (category=prompt_injection OR category=jailbreak)

[guardrail_input_direction]
search = sourcetype=guardrail:* direction=input

[guardrail_output_direction]
search = sourcetype=guardrail:* direction=output
