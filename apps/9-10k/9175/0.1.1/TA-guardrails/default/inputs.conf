#
# All inputs ship disabled. Most guardrail telemetry arrives through an
# existing cloud add-on (Splunk Add-on for AWS, Microsoft Cloud Services,
# Google Cloud Platform) - in that case do not enable anything here. Instead
# override the sourcetype on the existing input, or use the props/transforms
# in this add-on against the sourcetype those add-ons already produce.
#
# The stanzas below cover self-hosted guardrails that write local files, and
# HEC ingestion for anything pushing directly.
#

[monitor:///var/log/guardrails/lakera/*.json]
disabled = 1
sourcetype = guardrail:lakera
index = guardrails

[monitor:///var/log/guardrails/llamaguard/*.json]
disabled = 1
sourcetype = guardrail:llamaguard
index = guardrails

[monitor:///var/log/guardrails/nemo/*.json]
disabled = 1
sourcetype = guardrail:nemo
index = guardrails
