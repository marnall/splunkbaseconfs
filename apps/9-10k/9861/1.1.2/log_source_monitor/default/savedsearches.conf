[LSM - Update Inventory]
description = Refreshes the last-seen time of every log source and records outage transitions.
search = | `lsm_update_inventory(1)`
dispatch.earliest_time = -4h@m
dispatch.latest_time = +4h
cron_schedule = */15 * * * *
enableSched = 1
schedule_priority = higher
schedule_window = 0
is_visible = true

[LSM - Initial Backfill]
description = Run once after installation. Builds the inventory from the last 30 days without recording outage history.
search = | `lsm_update_inventory(0)`
dispatch.earliest_time = -30d@d
dispatch.latest_time = +4h
enableSched = 0
is_visible = true

[LSM - Update Forwarder Inventory]
description = Refreshes the forwarder inventory from tcpin_connections metrics.
search = `lsm_update_forwarders`
dispatch.earliest_time = -20m
dispatch.latest_time = now
cron_schedule = 2-59/15 * * * *
enableSched = 1
is_visible = true

[LSM - Purge Outage History]
description = Removes outage records older than the configured history period.
search = | inputlookup lsm_outage_history | where detected_at >= now() - (`lsm_history_days` * 86400) | outputlookup lsm_outage_history
dispatch.earliest_time = -1m
dispatch.latest_time = now
cron_schedule = 30 3 * * *
enableSched = 1
is_visible = true

[LSM - Log Source Outage]
description = Reports log outages that started or recovered in the last 15 minutes.
search = | inputlookup lsm_outage_history \
| where detected_at >= relative_time(now(), "-15m") \
| eval Event=if(event_type="OUTAGE_STARTED", "Outage started", "Recovered"), last_data=`lsm_fmt_time(outage_start)`, duration=if(event_type="RECOVERED", `lsm_fmt_dur(duration_sec)`, `lsm_fmt_dur(now()-outage_start)`) \
| sort 0 event_type index sourcetype host \
| table Event index sourcetype host last_data duration crit_min \
| rename last_data as "Last data", duration as "Duration", crit_min as "Threshold (min)"
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = 5-59/15 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 0
action.email = 0
action.email.to =
action.email.subject = [Splunk] Log source outage - $job.resultCount$ event(s)
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table
is_visible = true

[LSM - Forwarder Connection Lost]
description = Reports forwarders that have not connected within the configured timeout. Each forwarder is reported at most once every 24 hours.
search = | inputlookup lsm_forwarders \
| eval silence_sec=now()-last_connect \
| where silence_sec >= `lsm_forwarder_timeout_min` * 60 AND silence_sec < 7 * 86400 \
| eval last_connection=`lsm_fmt_time(last_connect)`, silence=`lsm_fmt_dur(silence_sec)` \
| table fwd_host ip fwd_type version last_connection silence
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = 10-59/15 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = fwd_host
alert.suppress.period = 24h
action.email = 0
action.email.to =
action.email.subject = [Splunk] Forwarder not connected: $result.fwd_host$
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table
is_visible = true
