[lsm_indexes]
definition = index=*
iseval = 0

[lsm_retention_days]
definition = 30
iseval = 0

[lsm_history_days]
definition = 90
iseval = 0

[lsm_default_warn_min]
definition = 60
iseval = 0

[lsm_default_crit_min]
definition = 240
iseval = 0

[lsm_forwarder_timeout_min]
definition = 15
iseval = 0

[lsm_fmt_time(1)]
args = t
definition = if(isnull($t$), "-", strftime($t$, "%Y-%m-%d %H:%M:%S"))
iseval = 0

[lsm_fmt_dur(1)]
args = s
definition = case(isnull($s$), "-", abs($s$)<60, round($s$)."s", abs($s$)<3600, floor($s$/60)."m", abs($s$)<86400, floor($s$/3600)."h ".floor(($s$%3600)/60)."m", true(), floor($s$/86400)."d ".floor(($s$%86400)/3600)."h")
iseval = 0

[lsm_enrich]
definition = lookup lsm_thresholds index AS index sourcetype AS sourcetype host AS host OUTPUT warn_min crit_min monitor \
| eval warn_min=coalesce(tonumber(warn_min), `lsm_default_warn_min`), crit_min=coalesce(tonumber(crit_min), `lsm_default_crit_min`), monitor=coalesce(tonumber(monitor), 1) \
| eval silence_sec=now()-last_indexed \
| eval status=case(monitor=0, "DISABLED", silence_sec>=crit_min*60, "DOWN", silence_sec>=warn_min*60, "DELAYED", true(), "OK")
iseval = 0

[lsm_update_inventory(1)]
args = record_history
definition = tstats count as new_count min(_time) as new_first max(_time) as new_last max(_indextime) as new_indexed where `lsm_indexes` by index sourcetype host \
| inputlookup append=true lsm_inventory \
| stats min(first_seen) as old_first max(last_seen) as old_last max(last_indexed) as old_indexed values(status) as prev_status max(outage_start) as prev_outage_start min(new_first) as new_first max(new_last) as new_last max(new_indexed) as new_indexed sum(new_count) as recent_count by index sourcetype host \
| eval first_seen=if(isnull(old_first) OR new_first<old_first, new_first, old_first), last_seen=if(isnull(old_last) OR new_last>old_last, new_last, old_last), last_indexed=if(isnull(old_indexed) OR new_indexed>old_indexed, new_indexed, old_indexed), recent_count=coalesce(recent_count, 0) \
| where last_indexed >= now() - (`lsm_retention_days` * 86400) \
| `lsm_enrich` \
| eval prev_status=coalesce(mvindex(prev_status, 0), "NEW") \
| eval transition=case(status="DOWN" AND prev_status!="DOWN", "DOWN", prev_status="DOWN" AND status!="DOWN", "UP") \
| eval outage_start=case(transition="DOWN", last_indexed, status="DOWN", coalesce(prev_outage_start, last_indexed)) \
| eval checked_at=now() \
| appendpipe [ where isnotnull(transition) AND $record_history$=1 \
    | eval detected_at=now(), event_type=if(transition="DOWN", "OUTAGE_STARTED", "RECOVERED"), outage_start=if(transition="DOWN", outage_start, prev_outage_start), outage_end=if(transition="UP", now(), null()), duration_sec=if(transition="UP", outage_end-outage_start, null()), end_status=if(transition="UP", status, null()) \
    | table detected_at event_type index sourcetype host outage_start outage_end duration_sec warn_min crit_min end_status \
    | outputlookup append=true lsm_outage_history \
    | where 1=2 ] \
| table index sourcetype host first_seen last_seen last_indexed recent_count status outage_start checked_at \
| outputlookup lsm_inventory
iseval = 0

[lsm_update_forwarders]
definition = search index=_internal source=*metrics.log* group=tcpin_connections \
| eval fwd_host=coalesce(hostname, sourceHost, sourceIp) \
| stats min(_time) as first_connect max(_time) as last_connect latest(sourceIp) as ip latest(fwdType) as fwd_type latest(version) as version latest(os) as os sum(kb) as kb_recent by fwd_host \
| append [| inputlookup lsm_forwarders | eval kb_recent=0 | fields - _key] \
| stats min(first_connect) as first_connect max(last_connect) as last_connect first(ip) as ip first(fwd_type) as fwd_type first(version) as version first(os) as os sum(kb_recent) as kb_recent by fwd_host \
| where last_connect >= now() - (`lsm_retention_days` * 86400) \
| outputlookup lsm_forwarders
iseval = 0
