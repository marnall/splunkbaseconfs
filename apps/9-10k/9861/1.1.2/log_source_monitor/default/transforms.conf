[lsm_inventory]
external_type = kvstore
collection = lsm_inventory
fields_list = _key, index, sourcetype, host, first_seen, last_seen, last_indexed, recent_count, status, outage_start, checked_at

[lsm_outage_history]
external_type = kvstore
collection = lsm_outage_history
fields_list = _key, detected_at, event_type, index, sourcetype, host, outage_start, outage_end, duration_sec, warn_min, crit_min, end_status

[lsm_forwarders]
external_type = kvstore
collection = lsm_forwarders
fields_list = _key, fwd_host, ip, fwd_type, version, os, first_connect, last_connect, kb_recent

[lsm_thresholds]
filename = lsm_thresholds.csv
match_type = WILDCARD(index), WILDCARD(sourcetype), WILDCARD(host)
max_matches = 1
case_sensitive_match = false
