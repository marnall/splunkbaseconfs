[airtable:auditlog]
INDEXED_EXTRACTIONS = none
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
TIME_PREFIX = \"timestamp\"\s*:\s*\"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Custom
description = Airtable enterprise audit log events

# CIM Change datamodel alignment
FIELDALIAS-airtable_user = actor.user.email AS user
FIELDALIAS-airtable_user_name = actor.user.name AS user_name
FIELDALIAS-airtable_src = origin.ipAddress AS src
FIELDALIAS-airtable_http_user_agent = origin.userAgent AS http_user_agent
FIELDALIAS-airtable_object_id = modelId AS object_id
FIELDALIAS-airtable_object_category = modelType AS object_category
FIELDALIAS-airtable_command = action AS command

EVAL-vendor_product = "Airtable"
EVAL-app = "airtable"
EVAL-status = "success"
EVAL-object = coalesce('payload.name', 'payload.user.email', 'payload.base.name', 'modelId')

LOOKUP-airtable_action = airtable_action_lookup action OUTPUTNEW cim_action AS action_cim
