# Global defaults. Every airtable_auditlogs:// stanza inherits these, so a
# local/ stanza only needs to set what is specific to the tenant.
[airtable_auditlogs]
python.version = python3
python.required = 3.9
interval = 300
sourcetype = airtable:auditlog
index = default

token_realm = airtable_auditlogs
token_username = airtable_pat

# Categories relevant to permission, role, admin, integration and automation
# activity. Filtering happens server side, so excluded categories never leave
# Airtable.
categories = baseCollaboration,groups,role,share,user,oauth,personalAccessToken,enterprise,enterpriseSettings,enterpriseLicenses,workspaceCollaboration,interfaceCollaboration,workflow,managedApps,ai

# High volume view and login events, dropped before indexing. viewBase and
# viewShare fire once per user per base every 5 minutes. Do not remove these
# without understanding the license impact.
exclude_event_types = loginUser,viewBase,viewShare,viewForm,viewInterface

page_size = 1000
max_pages_per_run = 100

# Example stanza. Do not enable this one. Copy to local/inputs.conf instead.
[airtable_auditlogs://example]
disabled = 1
python.required = 3.9
enterprise_account_id = entXXXXXXXXXXXXXX
index = airtable_audit
