[cip_ti_traffic]
definition = index=fw_index_not_set sourcetype=fw_sourcetype_not_set type=traffic subtype=forward
iseval = 0

[cip_ti_traffic_local]
definition = index=fw_index_not_set sourcetype=fw_sourcetype_not_set type=traffic subtype=local
iseval = 0

[cip_ti_traffic_all]
definition = (`cip_ti_traffic`) OR (`cip_ti_traffic_local`)
iseval = 0

[cip_ti_normalize]
definition = eval nat_dest=if(trandisp="dnat", tranip, null()), nat_src=if(trandisp="snat", transip, null()) \
| eval fw_class=case(action="deny","blocked", proto IN (1,58),"neutral", match(action,"^(accept|close)$"),"established", match(action,"^(client-rst|server-rst|timeout)$") AND coalesce(rcvdbyte,0)>=`cip_ti_established_min_rcvdbyte`,"established", match(action,"^(client-rst|server-rst|timeout)$"),"attempted", match(action,"^(ip-conn|dns)$"),"neutral", true(),"unknown") \
| eval fw_surface=case(subtype="forward","perimeter", subtype="local","firewall-itself", true(),"unknown") \
| eval fw_path=case(match(srcintf,"(?i)^ssl\.|sslvpn") OR match(dstintf,"(?i)^ssl\.|sslvpn"),"remote-access", match(srcintf,"(?i)ipsec|vpn|tunnel") OR match(dstintf,"(?i)ipsec|vpn|tunnel"),"site-to-site", true(),"internet")
iseval = 0

[cip_ti_established_min_rcvdbyte]
definition = 61
iseval = 0

[cip_ti_feed_seen_tz]
definition = "+0900"
iseval = 0

[cip_ti_feed_version_tz]
definition = "+0000"
iseval = 0

[cip_ti_index]
definition = cip_ti_matches
iseval = 0

[cip_ti_severity]
definition = eval legacy_row=if(isnull(established_count),1,0) \
| eval _est=coalesce(established_count, 0), _att=if(legacy_row=1, coalesce(passed_count, 0), coalesce(attempted_count, 0)) \
| eval sev_tier=case(ti_direction="outbound" AND ti_profile="block",3, ti_direction="inbound" AND ti_profile="block",2, ti_profile="monitor",1, true(),1) \
| eval sev_tier=if(ti_profile="block" AND _est>0, sev_tier+1, sev_tier) \
| eval sev_tier=if(blocked_count>0 AND _est=0 AND _att=0, sev_tier-1, sev_tier) \
| eval sev_tier=if(ti_confidence>=90, sev_tier+1, sev_tier) \
| eval sev_tier=if(event_count>=100, sev_tier+1, sev_tier) \
| eval sev_tier=if(_est=0, min(sev_tier,1), sev_tier) \
| eval sev_tier=if(legacy_row=1, min(sev_tier,1), sev_tier) \
| eval sev_tier=max(0, min(3, sev_tier)) \
| eval sev_tier=if(ti_profile="monitor", min(sev_tier,2), sev_tier) \
| eval severity=case(sev_tier=3,"critical", sev_tier=2,"high", sev_tier=1,"watch", true(),"info")
iseval = 0
