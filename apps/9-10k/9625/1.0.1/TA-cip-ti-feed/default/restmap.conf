[script:cip_ti_setup]
match                 = /cip_ti_setup
script                = cip_ti_setup.py
scripttype            = persist
handler               = cip_ti_setup.SetupHandler
output_modes          = json
passPayload           = true
requireAuthentication = true
capability.get        = list_settings
capability.post       = admin_all_objects
python.version = python3
python.required = 3.13
