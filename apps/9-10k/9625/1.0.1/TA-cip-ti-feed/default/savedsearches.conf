[TI - CIP feed match 10m]
disabled = 0
enableSched = 1
realtime_schedule = 0
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = @m
search = `cip_ti_traffic_all` | `cip_ti_normalize` \
| lookup internal_networks cidr AS srcip OUTPUT zone AS src_zone \
| lookup internal_networks cidr AS dstip OUTPUT zone AS dst_zone \
| where NOT (isnotnull(src_zone) AND isnotnull(dst_zone)) \
| lookup cip_ti_inbound  ip AS srcip OUTPUT profile AS in_p  confidence AS in_c  reason AS in_r  feed_version AS in_v  first_seen_min AS in_fs  last_seen_max AS in_ls \
| lookup cip_ti_outbound ip AS dstip OUTPUT profile AS out_p confidence AS out_c reason AS out_r feed_version AS out_v first_seen_min AS out_fs last_seen_max AS out_ls \
| where isnotnull(in_p) OR isnotnull(out_p) \
| eval m=mvappend(if(isnotnull(in_p),"inbound",null()), if(isnotnull(out_p),"outbound",null())) \
| mvexpand m | where isnotnull(m) \
| eval ti_direction=m, match_field=if(m="inbound","srcip","dstip"), match_ip=if(m="inbound",srcip,dstip), ti_profile=if(m="inbound",in_p,out_p), ti_confidence=if(m="inbound",in_c,out_c), ti_reason=if(m="inbound",in_r,out_r), feed_version=if(m="inbound",in_v,out_v), ti_feed_first_seen=if(m="inbound",in_fs,out_fs), ti_feed_last_seen=if(m="inbound",in_ls,out_ls) \
| lookup ti_egress_allowlist ip AS dstip OUTPUT ip AS allowed_dstip \
| where NOT (ti_direction="outbound" AND isnotnull(allowed_dstip)) \
| addinfo | eval window_start=info_min_time, window_end=info_max_time, search_run_id=info_sid \
| lookup cip_ti_self_egress ip AS match_ip OUTPUT hosts_behind AS _self_hosts \
| eval _self=if(isnotnull(_self_hosts),1,0) \
| eval internal_asset=if(ti_direction="inbound", coalesce(nat_dest, dstip), srcip) \
| fillnull value="-" ti_reason feed_version \
| fillnull value=0 ti_confidence \
| stats count AS event_count, count(eval(fw_class="blocked")) AS blocked_count, count(eval(fw_class="established")) AS established_count, count(eval(fw_class="attempted")) AS attempted_count, count(eval(fw_class="neutral")) AS neutral_count, count(eval(fw_class="unknown")) AS unknown_count, sum(sentbyte) AS sent_bytes, sum(rcvdbyte) AS received_bytes, values(dstport) AS dst_ports, values(devname) AS devices, values(internal_asset) AS internal_assets, values(srcname) AS internal_names, values(fw_path) AS ti_paths, values(fw_surface) AS ti_surfaces, max(_self) AS ti_self_egress, min(_time) AS first_seen_epoch, max(_time) AS last_seen_epoch, values(ti_feed_first_seen) AS ti_feed_first_seen, values(ti_feed_last_seen) AS ti_feed_last_seen by window_start window_end search_run_id srcip dstip match_ip match_field ti_direction ti_profile ti_confidence ti_reason feed_version \
| eval passed_count=established_count+attempted_count \
| eval schema_version="2" \
| eval dedup_key=md5(tostring(window_start).":".srcip.":".dstip.":".match_ip.":".match_field) \
| eval _time=window_start \
| collect index=`cip_ti_index`

[TI - CIP Slack alert]
disabled = 0
enableSched = 1
realtime_schedule = 0
cron_schedule = 3,13,23,33,43,53 * * * *
dispatch.earliest_time = -1h@m
dispatch.latest_time = now
search = index=`cip_ti_index` \
| `cip_ti_severity` \
| eval internal_ip=coalesce(mvjoin(internal_assets, ", "), if(ti_direction="outbound", srcip, dstip)) \
| eval device_name=coalesce(mvjoin(internal_names, ", "), "-"), \
       firewall=coalesce(mvjoin(devices, ", "), "-"), \
       path_str=coalesce(mvjoin(ti_paths, ", "), "-"), \
       self_egress=if(coalesce(ti_self_egress,0)=1,"ours",""), \
       feed_seen=if(isnull(strptime(mvindex(ti_feed_last_seen,0)." ".`cip_ti_feed_seen_tz`,"%Y-%m-%d %H:%M:%S %z")),"-", \
         tostring(round((now()-strptime(mvindex(ti_feed_last_seen,0)." ".`cip_ti_feed_seen_tz`,"%Y-%m-%d %H:%M:%S %z"))/86400,0))."d ago") \
| eval fw_action=mvappend(if(_est>0,"established",null()), if(_att>0,"attempted",null()), if(blocked_count>0,"blocked",null())) \
| mvexpand fw_action \
| lookup cip_ti_alert_scope direction AS ti_direction action AS fw_action OUTPUT enabled AS scope_enabled min_confidence AS scope_minconf \
| eval scope_enabled=coalesce(scope_enabled,0), scope_minconf=coalesce(if(scope_minconf="",null(),scope_minconf),101) \
| where scope_enabled=1 AND ti_confidence>=scope_minconf \
| dedup dedup_key \
| eval seen_epoch=coalesce(last_seen_epoch,_time), _ours=if(self_egress="ours",1,0) \
| eval _fwself=if(coalesce(mvcount(mvfilter(ti_surfaces=="firewall-itself")),0)>0,1,0) \
| eval _fwall=if(_fwself=1 AND coalesce(mvcount(mvfilter(ti_surfaces!="firewall-itself")),0)=0,1,0) \
| eval asset_key=internal_ip, first_epoch=coalesce(first_seen_epoch, seen_epoch), _nm=mvmap(internal_names, replace(replace(internal_names, "\|", " "), ";", " ")) \
| eventstats sum(_est) AS a_est, sum(_att) AS a_att, sum(blocked_count) AS a_blk, sum(event_count) AS a_ev, min(first_epoch) AS a_first, max(seen_epoch) AS a_last, values(dst_ports) AS a_ports, max(sev_tier) AS a_sev, sum(sent_bytes) AS a_sent, sum(received_bytes) AS a_rcvd, values(_nm) AS a_names by match_ip ti_direction asset_key \
| eval asset_line=asset_key."|".coalesce(a_est,0)."|".coalesce(a_att,0)."|".coalesce(a_blk,0)."|".coalesce(a_ev,0)."|".a_last."|".strftime(a_first,"%m-%d %H:%M")."|".strftime(a_last,"%m-%d %H:%M")."|".coalesce(mvjoin(a_ports,"/"),"-")."|".coalesce(a_sev,0)."|".coalesce(a_sent,0)."|".coalesce(a_rcvd,0)."|".coalesce(mvjoin(a_names,"/"),"-") \
| eval internal_ip=split(internal_ip, ", "), device_name=if(device_name="-",null(),split(device_name, ", ")), firewall=if(firewall="-",null(),split(firewall, ", ")), path_str=if(path_str="-",null(),split(path_str, ", ")) \
| sort 0 - sev_tier, - seen_epoch \
| stats first(ti_profile) AS ti_profile, max(ti_confidence) AS ti_confidence, first(ti_reason) AS ti_reason, first(feed_version) AS feed_version, first(feed_seen) AS feed_seen, values(internal_ip) AS internal_ip, values(device_name) AS device_name, values(firewall) AS firewall, values(path_str) AS path_str, values(dst_ports) AS dst_ports, max(_fwself) AS _fwself, min(_fwall) AS _fwall, max(_ours) AS _ours, min(_time) AS _time, max(seen_epoch) AS seen_epoch, sum(event_count) AS event_count, sum(_est) AS established_count, sum(_att) AS attempted_count, sum(blocked_count) AS blocked_count, sum(passed_count) AS passed_count, sum(sent_bytes) AS sent_bytes, sum(received_bytes) AS received_bytes, values(asset_line) AS asset_lines, min(first_epoch) AS first_epoch by match_ip ti_direction \
| `cip_ti_severity` \
| eval internal_ip=mvjoin(internal_ip, ", "), device_name=coalesce(mvjoin(device_name, ", "),"-"), firewall=coalesce(mvjoin(firewall, ", "),"-"), path_str=coalesce(mvjoin(path_str, ", "),"-"), dst_ports_str=mvjoin(dst_ports, ", "), surface_str=case(_fwall=1,"firewall itself", _fwself=1,"partly firewall itself", true(),"crossed the firewall"), self_egress=if(_ours=1,"ours",""), seen_time=strftime(seen_epoch,"%Y-%m-%d %H:%M:%S %Z"), asset_lines=mvjoin(asset_lines, ";"), first_time=strftime(first_epoch,"%Y-%m-%d %H:%M:%S %Z") \
| sort 0 - sev_tier, + seen_epoch \
| table _time seen_time seen_epoch ti_direction ti_profile match_ip internal_ip device_name firewall ti_confidence ti_reason severity event_count established_count attempted_count blocked_count passed_count sent_bytes received_bytes dst_ports_str feed_version path_str surface_str self_egress feed_seen first_time asset_lines
counttype = number of events
quantity = 0
relation = greater than
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.fields = match_ip,ti_direction
alert.suppress.period = 45m
action.cip_ti_slack = 1
action.cip_ti_slack.param.max_rows = 20
action.cip_ti_slack.param.mask_internal_ip = 0

[TI - alert scope sync]
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = 3
dispatch.earliest_time = -1m
dispatch.latest_time = now
search = | rest splunk_server=local /servicesNS/nobody/TA-cip-ti-feed/configs/conf-cip_ti_feed \
| search title=settings \
| eval mc=coalesce(if(alert_min_confidence="",null(),alert_min_confidence),"80") \
| eval mc=if(isnum(mc), tostring(max(0, min(100, tonumber(mc)))), "80") \
| eval oe=coalesce(if(alert_outbound_established="",null(),alert_outbound_established), if(alert_outbound_passed="",null(),alert_outbound_passed), "1") \
| eval ie=coalesce(if(alert_inbound_established="",null(),alert_inbound_established), if(alert_inbound_passed="",null(),alert_inbound_passed), "1") \
| eval oa=coalesce(if(alert_outbound_attempted="",null(),alert_outbound_attempted), "0") \
| eval ia=coalesce(if(alert_inbound_attempted="",null(),alert_inbound_attempted), "0") \
| eval ob=coalesce(if(alert_outbound_blocked="",null(),alert_outbound_blocked), "0") \
| eval ib=coalesce(if(alert_inbound_blocked="",null(),alert_inbound_blocked), "0") \
| eval rowspec=mvappend("outbound:established:".oe, "outbound:attempted:".oa, "outbound:blocked:".ob, "inbound:established:".ie, "inbound:attempted:".ia, "inbound:blocked:".ib) \
| mvexpand rowspec \
| rex field=rowspec "(?<direction>[^:]+):(?<action>[^:]+):(?<raw>.+)" \
| eval enabled=if(match(lower(raw),"^(1|true|yes|on)$"),1,0), min_confidence=mc \
| table direction action enabled min_confidence \
| eventstats count AS _n | where _n=6 | fields - _n \
| outputlookup override_if_empty=false cip_ti_alert_scope.csv

[TI - self egress discovery]
disabled = 0
enableSched = 1
realtime_schedule = 0
cron_schedule = 5,15,25,35,45,55 * * * *
schedule_window = 5
dispatch.earliest_time = -1h
dispatch.latest_time = now
search = `cip_ti_traffic` | `cip_ti_normalize` \
| where isnotnull(nat_src) \
| where NOT (cidrmatch("10.0.0.0/8",nat_src) OR cidrmatch("172.16.0.0/12",nat_src) OR cidrmatch("192.168.0.0/16",nat_src) OR cidrmatch("127.0.0.0/8",nat_src) OR cidrmatch("169.254.0.0/16",nat_src) OR cidrmatch("100.64.0.0/10",nat_src) OR cidrmatch("fe80::/10",nat_src) OR cidrmatch("fc00::/7",nat_src) OR cidrmatch("::1/128",nat_src)) \
| stats dc(srcip) AS hosts_behind, values(devname) AS _fw, max(_time) AS _seen by nat_src \
| where hosts_behind>=2 \
| eval ip=nat_src, firewall=mvjoin(_fw,", "), last_seen=strftime(_seen,"%Y-%m-%d %H:%M") \
| table ip firewall hosts_behind last_seen \
| inputlookup append=true cip_ti_self_egress.csv \
| eval _fwl=split(firewall,", ") \
| stats max(hosts_behind) AS hosts_behind, max(last_seen) AS last_seen, values(_fwl) AS _fw2 by ip \
| eval firewall=mvjoin(_fw2,", ") \
| table ip firewall hosts_behind last_seen \
| outputlookup cip_ti_self_egress.csv

[TI - firewall roster sync]
disabled = 0
enableSched = 1
realtime_schedule = 0
cron_schedule = 2,12,22,32,42,52 * * * *
schedule_window = 5
dispatch.earliest_time = -15m
dispatch.latest_time = now
search = `cip_ti_traffic_all` | `cip_ti_normalize` \
| stats count AS events_last_window, max(_time) AS last_epoch, min(_time) AS first_epoch by devname \
| eval _rank=2 \
| inputlookup append=true cip_ti_roster.csv \
| eval _rank=coalesce(_rank,1) \
| sort 0 devname _rank \
| stats last(events_last_window) AS events_last_window, max(last_epoch) AS last_epoch, min(first_epoch) AS first_epoch by devname \
| where isnotnull(devname) AND devname!="" \
| table devname last_epoch first_epoch events_last_window \
| outputlookup override_if_empty=false cip_ti_roster.csv

[TI - retroactive sweep]
disabled = 0
enableSched = 1
realtime_schedule = 0
cron_schedule = 20 4 * * *
schedule_window = 60
dispatch.earliest_time = -30d
dispatch.latest_time = -20m@m
dispatch.max_time = 10800
search = `cip_ti_traffic_all` | `cip_ti_normalize` \
| lookup cip_ti_inbound  ip AS srcip OUTPUT profile AS in_p  confidence AS in_c  reason AS in_r  first_seen_min AS in_fs  last_seen_max AS in_ls \
| lookup cip_ti_outbound ip AS dstip OUTPUT profile AS out_p confidence AS out_c reason AS out_r first_seen_min AS out_fs last_seen_max AS out_ls \
| where isnotnull(in_p) OR isnotnull(out_p) \
| lookup internal_networks cidr AS srcip OUTPUT zone AS src_zone \
| lookup internal_networks cidr AS dstip OUTPUT zone AS dst_zone \
| where NOT (isnotnull(src_zone) AND isnotnull(dst_zone)) \
| eval _m=mvappend(if(isnotnull(in_p),"inbound",null()), if(isnotnull(out_p),"outbound",null())) \
| mvexpand _m | where isnotnull(_m) \
| eval ti_direction=_m \
| eval match_ip=if(ti_direction="inbound",srcip,dstip), ti_profile=if(ti_direction="inbound",in_p,out_p), ti_confidence=if(ti_direction="inbound",in_c,out_c), ti_reason=if(ti_direction="inbound",in_r,out_r), ti_feed_first_seen=if(ti_direction="inbound",in_fs,out_fs), ti_feed_last_seen=if(ti_direction="inbound",in_ls,out_ls) \
| eval internal_ip=if(ti_direction="inbound", coalesce(nat_dest, dstip), srcip) \
| lookup cip_ti_self_egress ip AS match_ip OUTPUT hosts_behind AS _self \
| where isnull(_self) \
| stats count AS event_count, count(eval(fw_class="established")) AS established_count, count(eval(fw_class="attempted")) AS attempted_count, count(eval(fw_class="blocked")) AS blocked_count, sum(sentbyte) AS sent_bytes, sum(rcvdbyte) AS received_bytes, values(dstport) AS _ports, values(internal_ip) AS _assets, values(fw_path) AS _paths, values(devname) AS _devs, values(srcname) AS _names, values(fw_surface) AS _surf, max(ti_confidence) AS ti_confidence, values(ti_profile) AS _prof, values(ti_reason) AS _reason, values(ti_feed_first_seen) AS _ffs, values(ti_feed_last_seen) AS _fls, min(_time) AS _first, max(_time) AS _last by match_ip ti_direction \
| eval passed_count=established_count+attempted_count, ti_profile=mvindex(_prof,0), ti_reason=mvindex(_reason,0) \
| `cip_ti_severity` \
| eval src="sweep" \
| append [ search index=`cip_ti_index` | stats count AS _live_n by match_ip ti_direction | eval src="live" | fields match_ip ti_direction src _live_n ] \
| append [| tstats count AS _live_total where index=`cip_ti_index` | eval src="total" | fields src _live_total ] \
| eventstats count(eval(src="live")) AS live_hits by match_ip ti_direction \
| eventstats sum(_live_n) AS _live_sum, max(_live_total) AS _live_total \
| where isnotnull(_live_total) AND coalesce(_live_sum,0)=_live_total \
| where src="sweep" AND live_hits=0 \
| lookup cip_ti_retro_seen match_ip ti_direction OUTPUT reported_at AS _rep \
| where isnull(_rep) \
| eval internal_ip=mvjoin(_assets, ", "), path_str=coalesce(mvjoin(_paths, ", "),"-"), dst_ports_str=mvjoin(_ports, ", "), firewall=coalesce(mvjoin(_devs, ", "),"-"), device_name=coalesce(mvjoin(_names, ", "),"-"), surface_str=case(coalesce(mvcount(mvfilter(_surf!="firewall-itself")),0)=0 AND coalesce(mvcount(mvfilter(_surf=="firewall-itself")),0)>0,"firewall itself", coalesce(mvcount(mvfilter(_surf=="firewall-itself")),0)>0,"partly firewall itself", true(),"crossed the firewall") \
| eval first_contact=strftime(_first,"%Y-%m-%d %H:%M:%S %Z"), seen_time=strftime(_last,"%Y-%m-%d %H:%M:%S %Z"), seen_epoch=_last, reported_at=strftime(now(),"%Y-%m-%d %H:%M") \
| eval ti_feed_first_seen=mvindex(_ffs,0), ti_feed_last_seen=mvindex(_fls,0), feed_seen=if(isnull(strptime(mvindex(_fls,0)." ".`cip_ti_feed_seen_tz`,"%Y-%m-%d %H:%M:%S %z")),"-", tostring(round((now()-strptime(mvindex(_fls,0)." ".`cip_ti_feed_seen_tz`,"%Y-%m-%d %H:%M:%S %z"))/86400,0))."d ago") \
| sort 0 - sev_tier, + seen_epoch \
| table match_ip ti_direction ti_profile ti_confidence ti_reason severity internal_ip device_name firewall ti_feed_first_seen ti_feed_last_seen feed_seen event_count established_count attempted_count blocked_count passed_count sent_bytes received_bytes dst_ports_str path_str surface_str seen_time seen_epoch first_contact reported_at \
| outputlookup append=true cip_ti_retro_seen.csv \
| eval fw_action=mvappend(if(established_count>0,"established",null()), if(attempted_count>0,"attempted",null()), if(blocked_count>0,"blocked",null())) \
| mvexpand fw_action \
| lookup cip_ti_alert_scope direction AS ti_direction action AS fw_action OUTPUT enabled AS scope_enabled min_confidence AS scope_minconf \
| eval scope_enabled=coalesce(scope_enabled,0), scope_minconf=coalesce(if(scope_minconf="",null(),scope_minconf),101) \
| where scope_enabled=1 AND ti_confidence>=scope_minconf \
| dedup match_ip ti_direction \
| eventstats count AS _would_alert \
| where _would_alert <= 50 \
| fields - fw_action scope_enabled scope_minconf _would_alert \
| eval first_time=first_contact
counttype = number of events
quantity = 0
relation = greater than
alert.track = 1
alert.digest_mode = 1
alert.suppress = 0
action.cip_ti_slack = 1
action.cip_ti_slack.param.max_rows = 20
action.cip_ti_slack.param.mask_internal_ip = 0
action.cip_ti_slack.param.kind = past
