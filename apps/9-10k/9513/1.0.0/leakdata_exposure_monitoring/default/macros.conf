[leakdata_base]
definition = sourcetype="leakdata:webhook" source="leakdata"
iseval = 0
description = Base search for events accepted from the LeakData HEC delivery preset. Add an index constraint in a local macro override when required by your deployment.

[leakdata_normalize]
definition = spath path=data.domain output=leakdata_domain | spath path=data.target output=leakdata_target | spath path=data.companyName output=leakdata_company | spath path=data.monitorType output=leakdata_monitor_type | spath path=data.severity output=leakdata_severity | spath path=data.riskScore output=leakdata_risk_score_raw | spath path=data.riskLevel output=leakdata_risk_level | spath path=data.breachCount output=leakdata_breach_count_raw | spath path=data.affectedEmailCount output=leakdata_affected_count_raw | spath path=data.dataTypes{} output=leakdata_data_types | spath path=data.detectedAt output=leakdata_detected_at | eval event_type=coalesce(leakdata_event_type,type), event_id=coalesce(leakdata_event_id,id), leakdata_asset=coalesce(leakdata_target,leakdata_domain), leakdata_risk_score=tonumber(leakdata_risk_score_raw), leakdata_breach_count=coalesce(tonumber(leakdata_breach_count_raw),0), leakdata_affected_count=coalesce(tonumber(leakdata_affected_count_raw),0), leakdata_risk_level=lower(coalesce(leakdata_risk_level,"")), leakdata_severity=lower(coalesce(leakdata_severity,""))
iseval = 0
description = Extracts the documented, minimized LeakData monitoring fields without inferring compromise or fabricating missing risk context.
