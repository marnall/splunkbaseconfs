[leakdata_events]
search = sourcetype="leakdata:webhook" source="leakdata"
description = Events accepted through the LeakData HEC payload preset.

[leakdata_exposure_signals]
search = eventtype=leakdata_events (leakdata_event_type="domain.alert" OR leakdata_event_type="breach.detected" OR leakdata_event_type="monitoring.alert")
description = LeakData monitoring signals. A match represents reported exposure context, not confirmed account or system compromise.
