[LeakData - Critical exposure review queue]
description = Disabled-by-default review queue. Selects only explicitly critical domain or monitoring signals with a reported affected count above zero. Results require human validation and do not prove compromise.
search = `leakdata_base` | `leakdata_normalize` | where (event_type="domain.alert" OR event_type="monitoring.alert") AND leakdata_severity="critical" AND leakdata_affected_count>0 | table _time event_id event_type leakdata_asset leakdata_company leakdata_severity leakdata_risk_score leakdata_breach_count leakdata_affected_count | sort - _time
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = now
is_scheduled = 0
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
actions =
