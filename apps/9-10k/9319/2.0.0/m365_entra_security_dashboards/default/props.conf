############################################################################
## Office 365 Management Activity
############################################################################
[o365:management:activity]
EVAL-src_ip       = coalesce(ClientIP, ActorIpAddress, ClientIPAddress)
EVAL-o365_user    = lower(UserId)
EVAL-o365_status  = case(match(ResultStatus,"(?i)succe|^true$"),"Success", match(ResultStatus,"(?i)fail"),"Failure", isnull(ResultStatus),"N/A", true(),ResultStatus)
