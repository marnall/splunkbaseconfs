##
## O365 & Entra ID Security — self-contained field normalization.
## Maps the nested Entra (Azure Monitor) JSON and the mixed O365 status values
## into a clean, shared vocabulary so the dashboards work without depending on
## any other Azure/O365 app. Search-time only.
##

############################################################################
## Microsoft Entra ID (Azure AD) via Event Hub — Sign-in & Audit
############################################################################
[azure:monitor:aad]
EVAL-user            = coalesce('properties.userPrincipalName', identity, 'properties.servicePrincipalName')
EVAL-user_display    = 'properties.userDisplayName'
EVAL-user_type       = 'properties.userType'
EVAL-src_ip          = coalesce('properties.ipAddress', callerIpAddress)
EVAL-app             = 'properties.appDisplayName'
EVAL-resource        = 'properties.resourceDisplayName'
EVAL-client_app      = 'properties.clientAppUsed'
EVAL-signin_status   = if(resultType="0" OR resultSignature="SUCCESS", "Success", "Failure")
EVAL-error_code      = coalesce('properties.status.errorCode', resultType)
EVAL-failure_reason  = coalesce('properties.status.failureReason', resultDescription)
EVAL-city            = 'properties.location.city'
EVAL-region          = 'properties.location.state'
EVAL-country         = coalesce('properties.location.countryOrRegion', location)
EVAL-lat             = 'properties.location.geoCoordinates.latitude'
EVAL-lon             = 'properties.location.geoCoordinates.longitude'
EVAL-os              = 'properties.deviceDetail.operatingSystem'
EVAL-browser         = 'properties.deviceDetail.browser'
EVAL-device_compliant = 'properties.deviceDetail.isCompliant'
EVAL-device_managed  = 'properties.deviceDetail.isManaged'
EVAL-ca_status       = 'properties.conditionalAccessStatus'
EVAL-is_interactive  = 'properties.isInteractive'
EVAL-mfa             = case(match('properties.authenticationRequirement',"multiFactor"),"MFA", match('properties.authenticationRequirement',"singleFactor"),"Single-factor", true(),'properties.authenticationRequirement')
EVAL-risk_level      = 'properties.riskLevelDuringSignIn'
EVAL-risk_state      = 'properties.riskState'
EVAL-asn             = 'properties.autonomousSystemNumber'
EVAL-is_legacy_auth  = if('properties.clientAppUsed' IN ("IMAP4","POP3","SMTP","MAPI","Exchange ActiveSync","Other clients","Authenticated SMTP","AutoDiscover","Exchange Online PowerShell","Exchange Web Services"),"Legacy","Modern")
## Audit
EVAL-audit_action    = coalesce('properties.activityDisplayName', operationName)
EVAL-audit_result    = coalesce('properties.result', resultSignature)
EVAL-audit_initiator = coalesce('properties.initiatedBy.user.userPrincipalName', 'properties.initiatedBy.app.displayName')
EVAL-audit_target    = 'properties.targetResources{}.displayName'
EVAL-audit_category  = 'properties.category'

