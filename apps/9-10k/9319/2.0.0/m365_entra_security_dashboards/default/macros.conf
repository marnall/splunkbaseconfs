## Index selection.
## By default this app searches all indexes (index=*) and keys everything off
## the vendor sourcetypes, so it works out of the box regardless of where the
## data lands. For performance, override these two macros in local/macros.conf
## to point at the actual index(es) that hold your Microsoft 365 / Entra ID data
## (e.g. definition = index=<your_m365_index> / definition = index=<your_entra_index>).
[o365_index]
definition = index=*
iseval = 0

[entra_index]
definition = index=*
iseval = 0

## Office 365 Management Activity
[o365]
definition = `o365_index` sourcetype=o365:management:activity
iseval = 0

## Microsoft Entra ID (Azure AD) via Event Hub
[aad]
definition = `entra_index` (sourcetype="azure:monitor:aad" OR sourcetype="mscs:azure:eventhub")
iseval = 0

[aad_signin]
definition = `aad` category="SignInLogs"
iseval = 0

[aad_audit]
definition = `aad` category="AuditLogs"
iseval = 0

## O365 sign-ins (Azure AD workload within Management Activity)
[o365_signin]
definition = `o365` Workload="AzureActiveDirectory"
iseval = 0

## Everything across both platforms (for combined overview/geo panels)
[m365]
definition = (`o365` OR `aad`)
iseval = 0
