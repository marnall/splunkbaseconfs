# python.version satisfies the legacy AppInspect check
# (check_inputs_conf_spec_stanzas_has_python_version_property — pre-10.2);
# python.required is the forward-looking setting required by Splunk Enterprise
# 10.2+ (check_modular_inputs_python_required). Both are set intentionally so
# the TA installs on current Cloud stacks and stays clean on future releases.
[veza_events]
python.version = python3
python.required = 3.13
interval = 60
index = main
sourcetype = veza:events
page_size = 1000
verify_tls = 1

[veza_audit_logs]
python.version = python3
python.required = 3.13
interval = 60
index = main
sourcetype = veza:audit
page_size = 1000
verify_tls = 1
