#
# Event types used to tag ZeroLock records into Splunk CIM data models.
# Searches match durable tokens in _raw (case-insensitive) so they hold up
# whether the alert arrives as a structured zmcAlert object or as message text.
#

# Any ZeroLock alert (structured zmcAlert object or alertId in the message).
[valicyber_zerolock_alert]
search = sourcetype="valicyber:zerolock" alertId

# Ransomware / cryptojacking -> Malware data model.
[valicyber_zerolock_malware]
search = sourcetype="valicyber:zerolock" (ransomware OR cryptojacking)

# Non-malware alerts (tampering, blocked, program/file/network access, ssh-mfa)
# -> Intrusion Detection data model.
[valicyber_zerolock_ids]
search = sourcetype="valicyber:zerolock" alertId NOT (ransomware OR cryptojacking)

# Login / logout / failed login -> Authentication data model.
# ssh-mfa is an alert and maps to Intrusion Detection, not Authentication:
# its alert status does not resolve to a success/failure auth outcome, which
# the Authentication data model requires for `action`.
[valicyber_zerolock_authentication]
search = sourcetype="valicyber:zerolock" ("logged in" OR "logged out" OR "failed login" OR "invalid login")

# Admin / policy / role / credential changes -> Change data model.
[valicyber_zerolock_change]
search = sourcetype="valicyber:zerolock" ("Set up MFA" OR "Changed password" OR "Reset user" OR "Created role" OR "Assigned" OR "Updated policy" OR "Created role")
