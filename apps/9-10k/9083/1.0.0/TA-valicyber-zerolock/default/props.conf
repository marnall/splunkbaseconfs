#
# Sourcetype configuration for ZeroLock Management Console (ZMC) data.
#
# ZeroLock delivers each record to Splunk HTTP Event Collector (HEC) as a
# single JSON object wrapped in the HEC {"event": {...}} envelope. HEC unwraps
# the envelope on ingest, so the ZeroLock fields (message, zmcTimestamp,
# zmcEndpoint.*, zmcAlert.*, ...) land at the JSON root of _raw. All extraction
# below is search-time. See CIM-field-mapping.md for the full ECS/CIM crosswalk.
#

[valicyber:zerolock]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
CHARSET = UTF-8
category = Security
pulldown_type = 1
disabled = false

# ---- JSON field extraction ----
KV_MODE = json
AUTO_KV_JSON = true

# ---- Timestamp: zmcTimestamp is epoch milliseconds, always present ----
TIME_PREFIX = "zmcTimestamp":\s*
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 25

# ---- Alert fields carried only in the message text (no zmcAlert object) ----
# e.g. '... alertId:7 - alertId:7 alertStatus:killed alertType:"Blocked" severity:medium ...'
REPORT-zerolock_msg_alert = zerolock_msg_alert_fields

# =====================================================================
# CIM normalization (calculated fields). ZeroLock's own fields are left
# in place; these add the CIM-standard aliases on top. Assignments from an
# absent source field evaluate to null and create nothing, so each record
# only gets the CIM fields relevant to it.
# =====================================================================

# ---- Vendor / product ----
EVAL-vendor = "Vali Cyber"
EVAL-product = "ZeroLock"
EVAL-vendor_product = "Vali Cyber ZeroLock"
EVAL-app = "zerolock"

# ---- Host / device (endpoint-scoped records) ----
EVAL-dest = 'zmcEndpoint.hostname'
EVAL-dest_ip = 'zmcEndpoint.ipAddress'
EVAL-dvc = 'zmcEndpoint.hostname'

# ---- Identity ----
EVAL-user = coalesce('zmcAlert.linuxUser', zmcUserEmail)
EVAL-src_user = zmcUserEmail

# ---- Source (ssh-mfa / network alerts) ----
EVAL-src = 'zmcAlert.sourceIP'
EVAL-src_ip = 'zmcAlert.sourceIP'

# ---- Tenant ----
EVAL-tenant = zmcTenantName

# ---- Alert identity, signature, severity (structured OR message-derived) ----
EVAL-signature = coalesce('zmcAlert.type', vc_alert_type)
EVAL-signature_id = coalesce('zmcAlert.id', vc_alert_id)
EVAL-category = coalesce('zmcAlert.type', vc_alert_type)
EVAL-ids_type = if(isnotnull(coalesce('zmcAlert.id', vc_alert_id)), "host", null())
# CIM severity vocab (informational|low|medium|high|critical); ZeroLock emits
# low|medium|high. Alerts always carry severity per CPS; default to medium.
EVAL-severity = case(isnotnull(coalesce('zmcAlert.severity', vc_alert_severity)), lower(coalesce('zmcAlert.severity', vc_alert_severity)), isnotnull(coalesce('zmcAlert.id', vc_alert_id)), "medium")

# ---- Unified action across data models ----
#   Authentication : success | failure
#   Malware / IDS  : allowed | blocked   (threat stopped => blocked)
#   Change         : created | updated
EVAL-action = case(match(lower(message), "logged in|logged out"), "success", match(lower(message), "failed login|invalid login"), "failure", match(lower(coalesce('zmcAlert.status', vc_alert_status)), "killed|remediated|suspended|released|blocked"), "blocked", match(lower(coalesce('zmcAlert.status', vc_alert_status)), "detected|init|archived|failure"), "allowed", match(message, "(?i)created"), "created", match(message, "(?i)changed|updated|edited|assigned|reset|set up"), "updated", true(), null())

# ---- Change data model ----
EVAL-object = case(match(message, "(?i)policy"), "policy", match(message, "(?i)role"), "role", match(message, "(?i)password"), "password", match(message, "(?i)MFA"), "MFA", match(message, "(?i)user"), "user", true(), null())
EVAL-object_category = case(match(message, "(?i)policy"), "policy", match(message, "(?i)role"), "role", match(message, "(?i)password|MFA|user"), "user", true(), null())

# ---- Malware / file-activity data model ----
# filesAffected[] is multivalue; keep the full path list and derive file names.
EVAL-file_path = 'zmcAlert.filesAffected{}.file'
EVAL-file_name = mvmap('zmcAlert.filesAffected{}.file', replace('zmcAlert.filesAffected{}.file', "^.*/", ""))
