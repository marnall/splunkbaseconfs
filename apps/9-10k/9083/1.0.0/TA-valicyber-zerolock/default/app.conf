#
# Vali Cyber ZeroLock Add-on for Splunk
# Technology Add-on (TA): parses and CIM-normalizes ZeroLock Management
# Console (ZMC) activity and alert data ingested via HTTP Event Collector (HEC).
#

[id]
name = TA-valicyber-zerolock
version = 1.0.0

[install]
is_configured = false
state = enabled

[package]
id = TA-valicyber-zerolock

[ui]
is_visible = false
label = Vali Cyber ZeroLock Add-on for Splunk

[launcher]
author = Vali Cyber
version = 1.0.0
description = Search-time parsing and Splunk Common Information Model (CIM) normalization for ZeroLock Management Console activity and alert data delivered over HTTP Event Collector (HEC). Maps ZeroLock hypervisor runtime-security telemetry to the Authentication, Malware, Intrusion Detection, and Change data models.
