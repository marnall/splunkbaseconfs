#
# Search-time field extractions for ZeroLock data.
#
# Some ZeroLock alerts carry their alert detail only in the message text
# (no zmcAlert object), e.g.:
#   ... alertId:7 - alertId:7 alertStatus:killed alertType:"Blocked" severity:medium ...
# This report extracts those fields from _raw. In the raw JSON the quotes
# around the alertType value are backslash-escaped (alertType:\"Blocked\"),
# so the pattern tolerates an optional leading backslash and stops at the
# next quote or backslash. props.conf then coalesces these vc_* temporaries
# with the structured zmcAlert.* fields.
#
[zerolock_msg_alert_fields]
REGEX = alertId:(?<vc_alert_id>\d+)\s+-\s+alertId:\d+\s+alertStatus:(?<vc_alert_status>\S+)\s+alertType:\\?"(?<vc_alert_type>[^"\\]+)\\?"\s+severity:(?<vc_alert_severity>\w+)
