#
# Lookup definitions for the CIM Gap Report. All three tables are generated from
# backend/services/cim_autopilot.py by scripts/gen_cim_lookups.py -- do not hand-edit
# the CSVs, they will be overwritten.
#

# Field-name dictionary: normalised vendor spelling -> CIM field.
[envy_cim_fields]
filename = envy_cim_fields.csv

# Model membership. Keyed by CIM field; model_role is "<Model>|<core|both|disc>"
# as a single value so one lookup returns every model a field belongs to as a
# multivalue. Parallel model/role columns would not survive mvexpand paired.
[envy_cim_models]
filename = envy_cim_models.csv

# Core-field count per model, so the SPL never has to count the table itself.
[envy_cim_model_meta]
filename = envy_cim_model_meta.csv

#
# Detection-library coverage. Generated by scripts/gen_rule_coverage_lookup.py from a
# converted Sigma corpus -- derived metadata only (opaque rule id, platform, field
# names). No rule titles, no UUIDs, no rule logic, no vendor name.
#

# field -> "<rule_uid>|<platform>" for every rule referencing it, as one composite
# value so a single lookup mvexpands cleanly.
[envy_rule_fields]
filename = envy_rule_fields.csv

# Per-rule denominator: how many distinct fields it references.
[envy_rule_meta]
filename = envy_rule_meta.csv

# Detections per platform, for the "cannot fire at all" complement.
[envy_rule_totals]
filename = envy_rule_totals.csv

# Rules depending on each field -- drives the most-wanted-absent panel.
[envy_rule_fieldcount]
filename = envy_rule_fieldcount.csv
