##
## envy-splunk-health -- commands.conf
##
## | envyvalidate -- online license validation (bin/envy_validate.py). Outbound-only
## HTTPS to the Envyously license server; streams the key row -> {valid,tier,
## expires,features}. Runs on the search head. Fails closed on any error.
##
[envyvalidate]
filename = envy_validate.py
type = python
python.version = python3
python.required = 3.13
streaming = true
local = true
passauth = false

##
## | envyofflineverify -- offline license verification (bin/envy_offline_verify.py).
## Verifies a signed token LOCALLY against the embedded public key; NO network
## (stdlib only), so it is Splunk Cloud + air-gap safe and passes AppInspect.
##
[envyofflineverify]
filename = envy_offline_verify.py
type = python
python.version = python3
python.required = 3.13
streaming = true
local = true
passauth = false
