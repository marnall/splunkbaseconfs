##
## envy-splunk-health -- savedsearches.conf
##

##
## Online license check. Reads the key from Setup (conf-envy_splunk_health/license),
## validates via `| envyvalidate` (outbound-only HTTPS, key only, never data), and
## re-stamps lookups/envy_license_state.csv every 15 min. Fails CLOSED to free tier
## on any error/timeout/unreachable server. Blank/ENVY-FREE stays free, no network.
##
[default]
# Trigger condition. These three legacy keys are what savedsearches.conf actually reads;
# alert_type / alert_comparator / alert_threshold are the REST + UI names and are NOT
# honoured from a .conf file. Omit them and every scheduled search inherits Splunk's
# system default counttype = always -- i.e. it fires on EVERY run with zero results.
# Measured at a customer site 2026-08-18: 807 of 1,024 fired alerts in 24h were empty from this.
counttype = number of events
relation = greater than
quantity = 0

[Envyously - License check]
# Housekeeping, not a detection: it maintains a lookup and must run on every schedule.
# Pinned to always so the app-level counted default does not change its behaviour.
counttype = always
alert.track = 0
description = Maintains lookups/envy_license_state.csv (the license state every licensed panel gates on) by validating the Setup key against the Envyously license server. Fails closed to free tier.
search = | rest /servicesNS/-/envy_splunk_health/configs/conf-envy_splunk_health/license splunk_server=local \
    | fields envy_license_key \
    | append [| makeresults | eval envy_license_key=""] \
    | head 1 \
    | eval envy_license_key=trim(coalesce(envy_license_key,"")) \
    | envyvalidate \
    | eval valid=coalesce(valid,"false"), tier=coalesce(tier,"free"), expires=coalesce(expires,""), features=coalesce(features,"dashboards") \
    | table valid tier expires features \
    | outputlookup envy_license_state.csv
disabled = 0
enableSched = 1
cron_schedule = */15 * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now

##
## Offline license check for Splunk Cloud / air-gapped deployments. Verifies the
## signed token from Setup against the embedded public key via `| envyofflineverify`
## (no network) and stamps the same lookup. Enable this and DISABLE the online
## check above when the environment cannot reach the Envyously license server.
##
[Envyously - License check (offline)]
# Housekeeping, not a detection: it maintains a lookup and must run on every schedule.
# Pinned to always so the app-level counted default does not change its behaviour.
counttype = always
alert.track = 0
description = Offline (no-network) license validation for Splunk Cloud / air-gap. Verifies the signed token against the embedded public key and stamps envy_license_state.csv. Fails closed to free tier on a bad/expired token.
search = | rest /servicesNS/-/envy_splunk_health/configs/conf-envy_splunk_health/license splunk_server=local \
    | fields envy_license_key \
    | append [| makeresults | eval envy_license_key=""] \
    | head 1 \
    | eval envy_license_key=trim(coalesce(envy_license_key,"")) \
    | envyofflineverify \
    | eval valid=coalesce(valid,"false"), tier=coalesce(tier,"free"), expires=coalesce(expires,""), features=coalesce(features,"dashboards") \
    | table valid tier expires features \
    | outputlookup envy_license_state.csv
disabled = 1
enableSched = 0
cron_schedule = */15 * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now

##
## LICENSED tier: scheduled health-degradation alert. Fires when a sourcetype that
## was collecting goes silent (STOPPED). Gated by `envy_licensed`, so it produces
## ZERO alerts on the free tier -- proactive alerting is the paid differentiator.
##
[Envyously - Health degradation alert (STOPPED sourcetypes)]
description = LICENSED: alerts when a previously-active sourcetype stops arriving (the failure mode that silently blinds a SIEM). Gated by `envy_licensed` -- free tier produces no alerts.
search = | tstats latest(_time) as last_seen count where `envy_health_index` by sourcetype \
    | eval mins_since=round((now()-last_seen)/60,0) \
    | where mins_since > 60 AND count > 500 \
    | sort - mins_since \
    | eval finding="Sourcetype ".sourcetype." went silent ".mins_since." min ago (was active)" \
    | table sourcetype last_seen mins_since count finding \
    | `envy_licensed`
disabled = 1
enableSched = 1
cron_schedule = 0 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
