#
# Envy Splunk Health -- data-collection assurance + config status.
# The traffic light no stock Splunk ships: every sourcetype green/amber/red by
# freshness, with explicit STOPPED detection (was collecting, went silent) --
# the failure mode that quietly blinds a SIEM. Free-tier lead magnet for the
# Envy Splunk line; the fix + content are the upsell.
#
[install]
is_configured = 0
state = enabled
build = 3

# Reload the custom license config on change (no restart) -- required because the
# app ships a custom conf (envy_splunk_health.conf).
[triggers]
reload.envy_splunk_health = simple

[launcher]
author = Envy Group, Inc.
description = Data-collection health for Splunk: a traffic light for every sourcetype (fresh / aging / stale / STOPPED) plus license and index status. See at a glance what is flowing, what went silent, and when it stopped.
version = 0.4.2

[ui]
is_visible = 1
label = Envy Splunk Health

[package]
id = envy_splunk_health
check_for_updates = 1

[id]
name = envy_splunk_health
version = 0.4.2
