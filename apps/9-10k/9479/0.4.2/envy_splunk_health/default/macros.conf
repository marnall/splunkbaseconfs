##
## envy-splunk-health -- macros.conf
##

##
## Index scope. Override in local/ or the Setup screen. Default index=* keeps the
## free tier working out of the box.
##
[envy_health_index]
definition = index=*
iseval = 0

##
## ---- License gate -------------------------------------------------------
##
## FREE tier: the data-collection health, config/license status, and license-burn
## dashboards run their own ad-hoc SPL and NEVER call `envy_licensed` -- they
## always work on whatever is indexed. That is the AppInspect-safe degraded mode.
##
## LICENSED tier: the Full Health Report panels and the scheduled degradation
## alert end their pipeline with `envy_licensed`, which left-joins
## lookups/envy_license_state.csv and drops every row when valid!="true"
## (including when the lookup is missing/empty/stale -- fails CLOSED, not open).
##
## envy_license_state.csv is re-stamped by the "Envyously - License check" saved
## search (online `| envyvalidate`) or "... (offline)" (`| envyofflineverify`).
##
[envy_licensed]
definition = eval envy_join=1 \
    | join type=left envy_join \
        [| inputlookup envy_license_state.csv | eval envy_join=1 | fields envy_join valid tier] \
    | where valid=="true" \
    | fields - envy_join valid
iseval = 0

##
## License banner for the Full Health Report. Invoke as the whole search with a
## leading pipe: `| \`envy_license_banner\``. Emits banner_text/banner_color/valid/
## tier. Fails closed to the free-tier activation banner if the lookup is empty.
##
[envy_license_banner]
definition = inputlookup envy_license_state.csv \
    | head 1 \
    | appendpipe [stats count | where count=0 | eval valid="false", tier="free"] \
    | eval banner_text=if(valid=="true", "Licensed -- ".tier." tier. Full report + scheduled health alerting active.", \
        "Free tier: dashboards only. Activate to unlock the full scorecard, remediation guidance, and scheduled alerting -> https://envyously.com/splunk/assessment/"), \
        banner_color=if(valid=="true", "#16a34a", "#A88434")
iseval = 0
