# ==============================================================================
# ZERO TRUST COMPLIANCE & IMS - REST ENDPOINT ROUTING
# ==============================================================================

[admin:zt_compliance_admin]
match = /zt_compliance
members = zt_compliance_handler, zt_pod_handler, zt_stories_handler, zt_discovery_engine

[admin_external:zt_compliance_handler]
handlertype = python
handlerfile = zt_compliance_handler.py
handleractions = list, edit, create
python.version = python3
python.required = 3.13

[admin_external:zt_pod_handler]
handlertype = python
handlerfile = zt_pod_handler.py
handleractions = list, edit, create
python.version = python3
python.required = 3.13

[admin_external:zt_stories_handler]
handlertype = python
handlerfile = zt_stories_handler.py
handleractions = list, edit, create
python.version = python3
python.required = 3.13

[admin_external:zt_discovery_engine]
handlertype = python
handlerfile = zt_discovery_engine.py
handleractions = list, edit, create
python.version = python3
python.required = 3.13

