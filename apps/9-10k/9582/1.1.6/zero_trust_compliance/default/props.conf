# ==============================================================================
# ZERO TRUST COMPLIANCE - PROPS & FIELD EXTRACTIONS
# Standards: CIM Normalization, VRAM CSV Aliases, DoD GOTS Telemetry
# ==============================================================================

[vram:asset:csv]
SHOULD_LINEMERGE = false
INDEXED_EXTRACTIONS = csv
KV_MODE = none
HEADER_MODE = firstline
pulldown_type = 1
category = Structured

# CIM Data Model Normalization: Vulnerabilities & Assets
FIELDALIAS-vram_asset_id = VRAM_Asset_ID AS asset_id
FIELDALIAS-vram_hostname = Host_Name AS dest
FIELDALIAS-vram_ip = IP_Address AS src_ip
FIELDALIAS-vram_severity = Vuln_Severity AS severity
FIELDALIAS-vram_sig_id = STIG_Rule_ID AS signature_id
FIELDALIAS-vram_status = Compliance_Status AS status
FIELDALIAS-vram_scan_time = Last_Scan_Date AS scan_time
FIELDALIAS-vram_poam = POAM_ID AS poam_id
FIELDALIAS-vram_cve = CVE_ID AS cve

EVAL-vendor_product = "Navy VRAM"
EVAL-dvc_type = "Vulnerability Management"

[zerotrust_audit]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = \"timestamp\":\s*
TIME_FORMAT = %s
category = Security
