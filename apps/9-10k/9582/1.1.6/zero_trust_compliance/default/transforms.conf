# ==============================================================================
# ZERO TRUST COMPLIANCE & IMS - LOOKUP TRANSFORMATIONS
# ==============================================================================

[zt_compliance_items_lookup]
collection = zt_compliance_items
external_type = kvstore
fields_list = _key, ref, capability, requirement, pillar, phase, status, tool, activity_type, implementation_scope, assigned_team, wbs_code, milestone_id, disruption_score, completion_pct, remediation_notes, blockers, nist_plane, nist_p_components, dfd_tier, is_deleted, updated_by, updated_at

[zt_agile_stories_lookup]
collection = zt_agile_stories
external_type = kvstore
fields_list = _key, story_id, ref, parent_wbs_code, title, description, outcomes, end_state, pillar, activity_type, implementation_scope, sprint, status, story_points, assignee, assigned_team, priority_class, predecessors, successors, acceptance_criteria, predictive_risk_level, blockers, isso_signed_off, isso_signoff_by, isso_signoff_date, approver_role, cac_edipi, cac_subject_dn, digital_signature_hash, evidence_ids, override_lock, override_by, override_reason, override_timestamp, discovered_telemetry_status, nist_plane, nist_p_components, dfd_tier, is_deleted, updated_by, updated_at

[zt_milestones_ims_lookup]
collection = zt_milestones_ims
external_type = kvstore
fields_list = _key, milestone_id, wbs_code, title, phase, predecessor_ids, planned_start_date, planned_end_date, actual_start_date, actual_end_date, duration_days, completion_pct, status, deliverable_summary, is_deleted, updated_by, updated_at

[zt_evidence_pod_lookup]
collection = zt_evidence_pod
external_type = kvstore
fields_list = _key, evidence_id, ref, governance_policy_id, artifact_name, artifact_type, hash_sha256, evidence_url, verified_by, verification_timestamp, last_verified_at, integrity_status, is_deleted, notes

[zt_tool_registry_lookup]
collection = zt_tool_registry
external_type = kvstore
fields_list = _key, tool_id, tool_name, vendor_type, pillars_covered, target_activities, data_model_binding, index_pattern, telemetry_sourcetype, custom_regex_extraction, custom_field_aliases, custom_json_path, health_status, last_telemetry_timestamp

[zt_discovery_cache_lookup]
collection = zt_discovery_cache
external_type = kvstore
fields_list = _key, ref, pillar, telemetry_detected, event_volume_24h, evaluated_posture, discovery_confidence, matched_sourcetypes, matched_tools, last_evaluated_timestamp


