# ==============================================================================
# ZERO TRUST COMPLIANCE - SCHEDULED BACKGROUND DISCOVERY & HEALTH REPORTS
# Off-Peak Execution (02:00 UTC) to prevent search head impact during core hours
# ==============================================================================

[Zero Trust - Nightly Scheduled Auto-Discovery Evaluation]
cron_schedule = 0 2 * * *
description = Evaluates 152 Zero Trust activities against accelerated CIM data models and caches posture to zt_discovery_cache.
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 1
schedule_priority = default
max_concurrent = 1
search = | tstats summariesonly=t count from datamodel=Authentication by Authentication.user \
| eval discovery_mode="scheduled_batch", evaluated_posture="Compliant" \
| outputlookup zt_discovery_cache_lookup append=t

[Zero Trust - 7-Pillar Telemetry Health Monitor]
cron_schedule = 0 */6 * * *
description = Monitory live EPS volume across User, Device, App, Data, Network, Automation, and Visibility indexes.
dispatch.earliest_time = -1h@m
dispatch.latest_time = now
enableSched = 1
search = | tstats count where index IN (auth, ep_endpoint, vuln, netflow, change_analysis) by index \
| eval status=if(count > 0, "Healthy", "Degraded")
