#
# Default app metadata. ucc-gen will overwrite the version fields at build
# time from app.manifest. App Inspect requires a [launcher] stanza with a
# version that matches app.manifest.
#

[install]
is_configured = false
state = enabled
build = 1780491519

[ui]
is_visible = true
label = AirspaceWatch — Live ADS-B Modular Input
supported_themes = light, dark

[launcher]
author = Will Searle
description = Modular input that polls a local tar1090/dump1090 ADS-B receiver and emits one Splunk event per aircraft. Powers the AirspaceWatch dashboard (Leeds, UK / 50nm radius) for the Splunk Dashboard Contest 2026.
version = 1.0.0

[package]
check_for_updates = true
id = TA-airspace-watch

[id]
name = TA-airspace-watch
version = 1.0.0

[triggers]
reload.airspace_watch_settings = simple
reload.airspace_watch = simple
reload.ta_airspace_watch_settings = simple
