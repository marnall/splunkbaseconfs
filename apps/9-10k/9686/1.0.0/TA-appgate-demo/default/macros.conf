##
## AppGate SDP demo -- base search macros
##
## `appgate_lf` is the ONLY object the dashboard depends on. It does the index
## selection AND all field mapping, so there is no dependency on sourcetype
## naming or on field aliases in props.conf. If the index changes, edit it here
## once and all 23 panels follow.
##
## WHY THE MAPPING LIVES HERE, NOT IN props.conf
## ---------------------------------------------
## props.conf FIELDALIAS stanzas key on sourcetype. If the sourcetype doesn't
## match exactly, every alias silently fails to apply and every panel returns
## zero rows with no error -- indistinguishable from "no data". Doing the
## mapping in the macro removes that failure mode.
##
## THE RAW EVENT SHAPE (confirmed against live events from 6 daemons)
## -----------------------------------------------------------------
##   {"version":2, "date":"Aug  5 18:34:49", "timestamp":"2026-08-05T18:34:49.040Z",
##    "hostname":"52.8.180.148", "daemon":"cz-vpnd",
##    "log":{"action":"allow", "event_type":"ip_access", "rule_name":"...", ...}}
##
## TWO DIFFERENT HOSTNAMES -- DO NOT COALESCE THEM.
##   top-level  hostname  = the APPLIANCE (gateway IP, or controller FQDN)
##   log.hostname         = the CLIENT DEVICE (e.g. "ip-10-10-10-46"), present on
##                          authentication_failed and similar
## An earlier version coalesced log.hostname first, which silently populated the
## appliance column with client device names. `appliance` now reads ONLY the
## top-level field; client device names go to `device_hostname`.
##
## DAEMONS SEEN: cz-controllerd (auth, authorization, admin audit, admin
## messages), cz-vpnd (ip_access, tunnel_*, acl_rules_update), cz-sessiond
## (session_*, *_token_*, device_claims_*), cz-appliance (ssh_access_failed).
## NOT cz-configd and NOT sshd -- the CrowdStrike parser expected those names.
##
## ARRAY FIELDS -- AND THE `{}` SUFFIX TRAP
## ----------------------------------------
## Splunk's JSON extraction names an ARRAY field with a trailing `{}`. The raw
## key log.policy_names extracts as the FIELD `log.policy_names{}`, which after
## `rename log.* AS *` becomes `policy_names{}` -- so a panel searching
## `policy_names=*` matches nothing and renders BLANK WITH NO ERROR. This is the
## same silent-blank failure class as the sourcetype-alias problem above.
##
## Stage 3 (`rename "*{}" AS "*"`) strips the suffix from every array field, so
## queries use the clean name. It is a NO-OP if your extraction doesn't add the
## suffix, so it is safe either way -- do not remove it as "redundant".
##
## Array fields, usable after stage 3 (multivalue -- mvexpand to aggregate per
## element, or stats treats the whole array as one opaque value):
##   policy_names, entitlement_names, site_names   <- on authorization_succeeded
##   successful_condition_names,
##   successful_entitlement_names                  <- on entitlement_token_evaluated
##   admin_role_names                              <- on admin_authorization_succeeded
## These are why per-user POLICY and ENTITLEMENT ASSIGNMENT is available from the
## LogForwarder after all, with no API poller.
##
## Arrays of OBJECTS are not covered and don't need to be: log.dns_settings
## extracts as `log.dns_settings{}.domain`, which does not END in `{}` and is
## left alone. No panel reads one.
##
## Requires JSON field extraction to be active (KV_MODE=json or an automatic
## _json / HEC extraction). If `index=appgate | head 1 | table log.event_type`
## comes back empty, fix that first -- no macro can recover unextracted fields.
##
## PIPELINE ORDER MATTERS:
##   1. eval appliance  -- read log.hostname and hostname while both are distinct
##   2. rename log.* AS *  -- flatten the nested block
##   3. rename "*{}" AS "*"  -- strip Splunk's array suffix (see above)
##   4. eval <aliases>  -- friendly names for the flattened fields
##
## Because this macro CONTAINS PIPES, panels must filter with an explicit
## `| search ...` after it. `appgate_lf event_type=ip_access` is a syntax error;
## `appgate_lf` | search event_type=ip_access` is correct.

[appgate_lf]
definition = index=appgate | eval appliance=hostname, device_hostname=coalesce('log.hostname', 'log.device_claims.os.hostname') | rename log.* AS * | rename "*{}" AS "*" | eval ag_user=coalesce(distinguished_name_user, username), ag_ou=distinguished_name_ou, entitlement=rule_name, ag_action=action, ag_status=status, ag_reason=coalesce(reason, drop_reason), dest_ip=destination_ip, dest_port=destination_port, ag_protocol=protocol, ag_bytes=packet_size, ag_client_ip=client_ip, ag_command=command, ag_lat='geoip.location.lat', ag_lon='geoip.location.lon', ag_country='geoip.country_name', ag_city='geoip.city_name', ag_region='geoip.region_name', auth_type=authentication_type, session=session_id, exec_ms=execution_ms, device_os='device_claims.os.name', device_platform='device_claims.os.platform', device_family='device_claims.os.family', device_client_type='device_claims.clientType', device_profile='device_claims.profileName', device_firewall='device_claims.isFirewallEnabled', device_user_admin='device_claims.isUserAdmin', device_stig='device_claims.stig', client_version=coalesce('device_claims.clientVersion', client_version), risk_score='scripted_user_claims.riskScore', clearance='scripted_user_claims.clearance', device_trust='scripted_user_claims.deviceTrust', geo_location='scripted_user_claims.geoLocation', home_base='scripted_user_claims.homeBase', user_role='scripted_user_claims.role', mfa_provided='scripted_user_claims.mfaProvided', ia_training='scripted_user_claims.iaTrainingCompleted', first_name='user_claims.firstName', last_name='user_claims.lastName', idp='user_claims.ag.identityProviderName', msg_level='admin_message.level', msg_category='admin_message.category', msg_text='admin_message.message', msg_source='admin_message.source'
iseval = 0

## ---------------------------------------------------------------------------
## Feed B -- Controller API poller.
##
## *** NOT USED BY THE CURRENT DASHBOARD *** -- Collective Health is
## LogForwarder-only. Retained (with the two snapshot macros) so the poller
## upgrade path stays available without re-deriving these definitions.
##
## If you DO enable the poller, note that `appgate_lf` above matches the whole
## appgate index. Add a sourcetype filter to both macros at that point so the
## two feeds stay separable.
## ---------------------------------------------------------------------------

[appgate_api]
definition = index=appgate sourcetype=appgate:api
iseval = 0

# Reduce a poller snapshot feed to its most recent sweep.
#
# entitlement_grant and entitlement_catalog are FULL RE-SHIPS on a heartbeat,
# not deltas. Counting them without this reduction multiplies every result by
# the number of sweeps in the time window -- a 24h window at a 60s cadence
# inflates user counts by ~1440x.
[appgate_latest_snapshot]
definition = eventstats max(snapshot_ts) as _latest_snapshot | where snapshot_ts=_latest_snapshot | fields - _latest_snapshot
iseval = 0

[appgate_latest_catalog]
definition = eventstats max(catalog_ts) as _latest_catalog | where catalog_ts=_latest_catalog | fields - _latest_catalog
iseval = 0
