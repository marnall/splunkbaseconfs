# CryptView Collector collects cryptographic metadata only. It does not collect private keys,
# passwords, keystore secrets, tokens, cookies, or confidential file contents.
#
# This scripted input is disabled by default.
# Set CRYPTVIEW_COLLECTOR_PATHS in the wrapper environment or wrapper script before enabling.

[script://$SPLUNK_HOME/etc/apps/TA-cryptview-collector/bin/cryptview_collect.sh]
disabled = 1
interval = 86400
index = cryptview
sourcetype = cryptview:crypto_asset
