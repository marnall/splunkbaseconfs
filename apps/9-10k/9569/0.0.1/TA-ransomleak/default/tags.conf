# CIM tags. The data models find events by tag, so this file is what actually
# makes `datamodel=Authentication` and `datamodel=Change` see `ransomleak:audit`.
#
# `ransomleak_audit_account_management` is a subset of
# `ransomleak_audit_change`; an event matching both accumulates `change` AND
# `account`, which is exactly what the Account_Management child dataset
# constrains on (it inherits the root's `change` constraint).
#
# Not present, deliberately: `default`, `privileged` and `cleartext` on the
# authentication eventtype. Our events carry no privilege level and no
# transport indicator, and Default_Authentication means "not privileged and
# not insecure" -- a claim we cannot support for a tenant-admin login. The
# root Authentication dataset does not depend on them.
#
# `ransomleak_audit_unmapped` and `ransomleak_audit_unclassified` have no
# stanza here on purpose: they exist to make un-modelled rows findable, not to
# put them in a model.
#
# UCC ALSO GENERATES THIS FILE. Today it renders empty, because the add-on's
# alert action declares no `adaptiveResponse` sourcetype, and the package copy
# runs after generation so this file wins outright. If an `adaptiveResponse`
# is ever added to globalConfig.json, its generated
# `[eventtype=<alert>_modaction_result]` stanza will be silently dropped and
# has to be merged in here by hand. Same applies to eventtypes.conf.

[eventtype=ransomleak_audit_authentication]
authentication = enabled

[eventtype=ransomleak_audit_change]
change = enabled

[eventtype=ransomleak_audit_account_management]
account = enabled
