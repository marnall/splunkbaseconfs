[ransomleak_assign_training]
icon_path = alerticon.png
label = Assign RansomLeak training
description = Assign a RansomLeak exercise to every user named in the triggering search results, via POST /api/integration/assignments. The account's API token must carry the 'integration' scope. Each assignment is keyed on (saved search, user, exercise), so a search that keeps firing over an overlapping window replays the original assignment instead of assigning the same person again.
