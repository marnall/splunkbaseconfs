# CIM membership for `ransomleak:audit`. `tags.conf` puts the CIM tags on the
# first three of these; `props.conf` computes the fields.
#
# `ransomleak:training`, `:phishing`, `:risk` and `:metrics` have no eventtype
# here on purpose -- they have no honest CIM home, and a forced mapping is
# something a reviewer catches and a customer silently gets wrong results
# from. See the design doc, "CIM mapping".
#
# WHY FOUR STANZAS AND NOT TWO
#
# The 32 values of `SecurityEventType` are partitioned here, and the partition
# is the point. `ransomleak_audit_unmapped` names the types we looked at and
# deliberately did not map, so "not in a data model" is a recorded decision
# with a searchable name rather than an absence. `ransomleak_audit_unclassified`
# is its complement: it matches any `ransomleak:audit` row whose `eventType` is
# NOT one of the 32.
#
# That last one is load-bearing, not decoration. `security_event.event_type` is
# a plain varchar with no DB constraint, and real tenants carry `mfa.enabled`,
# `mfa.disabled` and `role.assigned` -- 9.4% of the verification tenant's audit
# history -- written by code paths that no longer exist and that appear in no
# enum anywhere. An enumerate-only mapping would drop those rows out of every
# data model AND out of every eventtype, i.e. silently. Here they land in
# `ransomleak_audit_unclassified`, where
#   `eventtype=ransomleak_audit_unclassified | stats count by eventType`
# lists them, and where a backend enum addition that nobody has classified
# shows up the same way. They carry no CIM tags: being visible is not the same
# as claiming a mapping we have not made.
#
# `eventType` (camelCase, from the JSON body) is a different field from
# Splunk's own reserved `eventtype`. Splunk field names are case-sensitive, so
# these searches do not recurse; the near-collision is the backend's naming,
# not ours.
#
# tests/test_cim_mapping.py pins all four lists against the backend
# `SecurityEventType` enum, which it reads from backend/src directly.

# Authentication data model. `action` is success / failure / pending.
# `logout` is NOT here: CIM's Authentication `action` has no logout value.
[ransomleak_audit_authentication]
search = sourcetype="ransomleak:audit" eventType IN ("login.success", "login.failed", "mfa.challenge_sent", "mfa.verified", "mfa.failed")

# Change data model (All_Changes). `action` is created / updated / deleted /
# lockout, and `status` is success / failure.
[ransomleak_audit_change]
search = sourcetype="ransomleak:audit" eventType IN ("user.created", "user.deleted", "user.updated", "user.role_changed", "user.disabled", "user.enabled", "user.invited", "account.locked", "password.changed", "password.reset_completed", "license.assigned", "settings.changed", "role.default_changed", "api_token.created", "api_token.revoked", "scim.user_provisioned", "scim.user_updated", "scim.user_deactivated", "scim.group_created", "scim.group_updated", "scim.group_deleted", "scim.provision_failed", "scim.provision_failed_no_license")

# Account_Management, the Change child dataset. A strict subset of
# `ransomleak_audit_change` -- an event matches both and accumulates both tags.
# Excluded from it are the five events that change something which is not an
# account: `license.assigned`, `settings.changed`, `role.default_changed` and
# the two `api_token.*`. That same five-way exclusion is what flips the
# actor/object split in props.conf, because Account_Management is the dataset
# that moves the performer from `user` to `src_user`.
[ransomleak_audit_account_management]
search = sourcetype="ransomleak:audit" eventType IN ("user.created", "user.deleted", "user.updated", "user.role_changed", "user.disabled", "user.enabled", "user.invited", "account.locked", "password.changed", "password.reset_completed", "scim.user_provisioned", "scim.user_updated", "scim.user_deactivated", "scim.group_created", "scim.group_updated", "scim.group_deleted", "scim.provision_failed", "scim.provision_failed_no_license")

# Known types deliberately left out of both models. No tags, by design.
#
#   logout                   Authentication's `action` vocabulary is
#                            success / failure / pending / error -- there is no
#                            logout value. Change has a `logoff` action, but it
#                            belongs to session and instance changes to
#                            infrastructure, not to an identity audit trail.
#   password.reset_requested Nothing changed: a reset mail was sent. CIM has no
#                            "requested" action, and Authentication has no
#                            dataset for credential-recovery requests.
#   ip.blocked               A request was refused by the IP allowlist. That is
#                            Intrusion_Detection / Network_Traffic / Web
#                            territory, not Authentication or Change, and those
#                            models are out of scope here.
#   scorm.origin_blocked     Same class: a content-embedding origin check on an
#                            HTTP request.
[ransomleak_audit_unmapped]
search = sourcetype="ransomleak:audit" eventType IN ("logout", "password.reset_requested", "ip.blocked", "scorm.origin_blocked")

# The complement of all of the above: every `ransomleak:audit` row whose
# `eventType` is outside `SecurityEventType`. Retired types written by code
# paths that no longer exist land here, and so does an event with no
# `eventType` at all -- `NOT eventType IN (...)` matches an event that lacks
# the field. No tags: this is a signal, not a mapping.
[ransomleak_audit_unclassified]
search = sourcetype="ransomleak:audit" NOT eventType IN ("login.success", "login.failed", "logout", "mfa.challenge_sent", "mfa.verified", "mfa.failed", "account.locked", "password.changed", "password.reset_requested", "password.reset_completed", "user.created", "user.deleted", "user.updated", "user.role_changed", "user.disabled", "user.enabled", "user.invited", "license.assigned", "api_token.created", "api_token.revoked", "settings.changed", "role.default_changed", "ip.blocked", "scorm.origin_blocked", "scim.user_provisioned", "scim.user_updated", "scim.user_deactivated", "scim.group_created", "scim.group_updated", "scim.group_deleted", "scim.provision_failed", "scim.provision_failed_no_license")
