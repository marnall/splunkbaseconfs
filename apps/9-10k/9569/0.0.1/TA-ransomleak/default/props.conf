# EVERY SOURCETYPE HERE EXTRACTS `_time` FROM ONE FIELD, `rlEventTime`, WITH AN
# ANCHORED PREFIX. Three identical keys on all five stanzas:
#
#     TIME_PREFIX = ^\{"rlEventTime":\s*"
#     TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
#     MAX_TIMESTAMP_LOOKAHEAD = 64
#
# `rlEventTime` is written by `ransomleak_client.event_payload()` as the FIRST
# key of every event, on every input, carrying the exact instant that
# sourcetype's `_time` is defined to be. It is the add-on's own envelope field,
# not a payload field: no LMS DTO's field order, field name or field format is
# load-bearing for `_time` any more.
#
# ── WHAT IS ACTUALLY TRUE ON SPLUNK ENTERPRISE 10.4.2 ──────────────────────
#
# This header has been wrong twice. Both wrong versions asserted something
# about the modular input's explicit `<time>`; here is what was measured.
#
# 1. AN EXPLICIT `<time>` DOES NOT BEAT A CONFIGURED EXTRACTION. When a stanza
#    configures TIME_PREFIX and the prefix does not match an event, Splunk does
#    NOT fall back to the supplied `time=`. It takes the PREVIOUS EVENT'S
#    timestamp and logs `DateParserVerbose: Defaulting to timestamp of previous
#    event`. Measured on `[ransomleak:risk]`: raw modular XML carrying
#    `<time>1786821796.860436</time>` on a `format=table` event indexed 11.8
#    days stale, at the preceding series event's bucket day.
#
# 2. `DATETIME_CONFIG = CURRENT` DOES NOT PASS `<time>` THROUGH EITHER -- which
#    is what the previous version of this header got wrong, and it was the
#    worse mistake of the two. CURRENT keeps only the SUB-SECOND FRACTION of
#    the supplied value and takes the whole second from arrival. Measured over
#    1,181 `ransomleak:audit` events: 1,181 of 1,181 carried the source
#    timestamp's sub-second across 264 distinct fractions, while every whole
#    second was one of three arrival seconds. The resulting drift, against the
#    same corpus indexed correctly at `51205da3`:
#
#        ransomleak:audit          0.000 -> 162.22 days (max), 104.70 avg
#        ransomleak:phishing       0.000 -> 196.45 days (max),  99.88 avg
#        risk/metrics time_series  0.000 -> 900.89 days; 901 daily buckets
#                                           collapsed onto 2 instants
#
#    Identity panels on `-7d@d..now` counted 1,181 events where 59 belonged;
#    Phishing counted 1,591 where 0 belonged; `ds_feed_status`'s `STALE` arm
#    could never fire, because `max(_time)` was arrival time by construction.
#
#    Note WHY that shipped: `[ransomleak:training]` and the risk/metrics
#    `format=table` rows are the two cases whose intended `_time` IS the
#    arrival instant, so they look correct under either behaviour and CANNOT
#    discriminate. The fix rested on training's evidence alone. Any future
#    change here must be checked against `:audit`, `:phishing` or the series
#    shape -- the three that can tell the difference.
#
# 3. NO TIMESTAMP CONFIGURATION AT ALL FAILS SILENTLY. The A/B's auto-detect
#    arm produced the same wrong `_time` on table rows as a mismatched
#    TIME_PREFIX -- with ZERO `DateParserVerbose` lines. A configured prefix at
#    least screams when it stops matching; auto-detection does not.
#
# 4. `props.conf` MERGES PER ATTRIBUTE, NOT PER STANZA. A `[source::...]`
#    override that adds TIME_PREFIX but says nothing about DATETIME_CONFIG
#    still inherits DATETIME_CONFIG from the sourcetype stanza, and CURRENT
#    beats extraction. Two A/B arms were run and discarded before this was
#    spotted. It is also why DATETIME_CONFIG appears NOWHERE in this file: an
#    admin's `local/` copy that sets it re-breaks everything above.
#
# Measurements: integrations/splunk/docs/local-verification.md, and the
# four-arm A/B recorded there. Arm D -- one prefix, both payload shapes, zero
# DateParserVerbose -- is what this file implements.
#
# ── WHY THE PREFIX IS ANCHORED, AND WHY THAT IS THE WHOLE DESIGN ───────────
#
# The A/B proved that an alternation over the real payload fields
# (`"(?:bucketTime|observedAt|occurredAt|timestamp)":\s*"`, lookahead 900)
# parses all three shapes. It is not what ships, for one reason:
#
#   Splunk takes the FIRST match of TIME_PREFIX in the raw event.
#   `SecurityEventResponseDto.fromEntity` emits `timestamp` LAST, behind
#   `userAgent` (varchar 500) and `metadata` (an arbitrary, unbounded jsonb
#   object). A `"timestamp"` key INSIDE that `metadata` blob is serialized
#   EARLIER in the line than the DTO's own, so an unanchored alternation would
#   extract an unrelated, attacker- or integration-supplied value as `_time`.
#   No widening of the lookahead helps; a wider lookahead makes it likelier.
#
# The anchor removes the class of failure rather than narrowing it. `^\{`
# matches only at character zero of the event, so ONLY THE FIRST KEY OF THE
# TOP-LEVEL OBJECT can ever match -- at any nesting depth, under any key name,
# for any payload. `event_payload()` makes that first key `rlEventTime` by
# construction, and a payload that already carries the name is renamed rather
# than allowed to displace it. This is the property that makes "could a nested
# key win?" answerable by construction instead of by lookahead arithmetic.
#
# It also makes the 900-character lookahead unnecessary: the value starts at a
# fixed offset of 16 characters and ends by 41. 64 is the whole event's worth of
# scanning this needs.
#
# ── HOW THIS FAILS, AND WHY IT FAILS LOUDLY ───────────────────────────────
#
# If `rlEventTime` ever stops being emitted, stops being first, or stops
# matching TIME_FORMAT, Splunk logs one `DateParserVerbose` line PER EVENT
# naming the source:
#
#     index=_internal component=DateParserVerbose ransomleak
#
# That is the failure mode, and it is surfaced in the product: the "Recent
# errors and warnings" panel on RansomLeak Add-on Health reads exactly that
# search alongside the add-on's own log. This is the one thing the no-config
# arm could not offer, and it is why extraction is configured explicitly rather
# than left to auto-detection. It also fails EARLIER than that, in CI:
# `tests/test_ransomleak_client.py` executes this file's own TIME_PREFIX and
# TIME_FORMAT against serialized bodies from every collector, including an
# audit body whose `metadata` carries a decoy `"timestamp"`.
#
# ── WHAT `_time` MEANS, PER SOURCETYPE ────────────────────────────────────
#
#   ransomleak:audit                  the event's `timestamp` (occurrence)
#   ransomleak:phishing               the event's `occurredAt` (occurrence)
#   risk/metrics, format=time_series  the bucket's UTC day (`bucketTime`)
#   risk/metrics, format=table        the poll instant (no bucket exists)
#   ransomleak:training               the observation instant, NOT `assignedAt`
#
# Each helper computes that instant and passes it to `event_payload()`, which
# is the single place it becomes `rlEventTime`. `time=` is still passed on
# every event: it agrees by construction and it is what a hand-written
# `local/props.conf` that disabled extraction would fall back to. It is not
# authoritative, and nothing here may be weakened on the theory that it is.

[ransomleak:phishing]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = ^\{"rlEventTime":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 64
TZ = UTC
category = Security
pulldown_type = 1

[ransomleak:audit]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = ^\{"rlEventTime":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 64
TZ = UTC
category = Security
pulldown_type = 1

# ---------------------------------------------------------------------------
# CIM (Common Information Model) mapping -- Authentication and Change only.
#
# Authored against the CIM 6.2 field reference. Every field and every
# prescribed value used below also exists in CIM 5.x, but that was not
# verified, so `app.manifest` declares `>=6.0.0`. NOTHING HERE HAS BEEN RUN
# AGAINST A SPLUNK INSTANCE -- see integrations/splunk/docs/follow-ups.md.
#
# Membership is decided in `eventtypes.conf` (which carries the tags); this
# file only computes the fields. The two must agree, and
# `tests/test_cim_mapping.py` is what makes them agree: it partitions the
# backend `SecurityEventType` enum -- read straight out of
# backend/src/security-events/enums/security-event-type.enum.ts -- across the
# eventtypes and then checks every case() below covers exactly the right
# partition. A new backend event type fails that test until a human puts it in
# one of the three lists.
#
# `ransomleak:training`, `:phishing`, `:risk` and `:metrics` are deliberately
# NOT mapped. They have no honest CIM home and a forced mapping produces
# silently wrong results for customers -- see the design doc, "CIM mapping".
#
# WHY `match(...)` AND `[.]`:
#   `match()` is portable to every Splunk version, unlike eval's `IN`
#   operator; `[.]` is a character class matching a literal dot, so no
#   backslash has to survive conf parsing.
#
# WHY `nullif(nullif(x, ""), "null")` EVERYWHERE:
#   The DTO emits JSON `null` for absent ids and emails. This file used to guess
#   that `KV_MODE = json` would either skip such a field or produce an empty
#   string, and guarded with `nullif(x, "")` so it would be right either way.
#   MEASURED ON 10.4.2: it does NEITHER. It creates the field and fills it with
#   the four-character STRING `null`. Over 1,176 audit events, 1,156 carried
#   `targetId="null"` and ZERO carried an empty string, so every `nullif(x,"")`
#   returned a truthy value and every guard in this block failed:
#   `Authentication.user` was the string `"null"` on all 632 authentication
#   events, the actor was misfiled into `src_user`, and on `scim.user_updated`
#   a REAL `targetId` UUID was discarded because `"null"` won the coalesce.
#   See .superpowers/phase2-verification-report.md.
#
#   The `nullif(x, "")` arm is kept as well as, not instead of: it costs
#   nothing and it is what a hand-written `local/props.conf` with
#   `INDEXED_EXTRACTIONS` or a future `spath`-based extraction would produce.
#
#   WHY THIS CANNOT SWALLOW A LEGITIMATE VALUE. The guard is applied to exactly
#   five fields, and none of them can hold the text `null` as data:
#   `targetId` / `actorId` are UUIDs (`security_event.actor_id` /
#   `target_id`, uuid columns); `targetEmail` / `actorEmail` are email
#   addresses, which require an `@`; `ipAddress` is an address string whose
#   only non-address value is the `"unknown"` sentinel this block already
#   suppresses. It is deliberately NOT applied to `eventType`, `userAgent` or
#   anything reaching `metadata`, where free text could legitimately be `null`.
#   The comparison is case-sensitive and JSON emits lowercase `null` only, so a
#   user-supplied `"NULL"` would survive -- correctly, since it would be data.
#
# `user` vs `src_user` -- the actor/object split:
#   CIM puts the performer in `All_Changes.user`, but the Account_Management
#   child moves the performer to `src_user` and gives `user` to the account
#   that was changed. Our rows carry both roles (`actorEmail` / `targetEmail`),
#   so the rule is: when the event has a distinct subject, `user`/`user_id`
#   describe the SUBJECT and `src_user`/`src_user_id` describe the actor;
#   otherwise `user` is the actor and `src_user` is absent. The five
#   `settings.changed`-class events are the exception: they change an object
#   that is not an account, so root All_Changes semantics apply and `user`
#   stays the performer even though `targetId` names the affected object --
#   that object goes to `object` / `object_id` instead. `license.assigned` and
#   `role.default_changed` are the two that actually carry a `targetId`.
#
#   Consequence, accepted: `user.updated`, `user.role_changed`,
#   `user.disabled`, `user.enabled` and `license.assigned` record only a
#   `targetId`, never a `targetEmail`, so on those events `user` is a UUID.
#   CIM defines `user` as a "user string or identifier", so this is in spec,
#   but `stats by user` will mix emails and UUIDs. `user_id` always carries
#   the id, so a search can normalise on that instead.
#
# `src` is `ipAddress` MINUS THE SENTINEL. `getClientIp()` falls back to the
#   literal string "unknown" rather than to null, so a plain FIELDALIAS would
#   put "unknown" into `src` on every event the backend could not resolve an
#   address for -- a wrong constant dressed as data. A sometimes-absent `src`
#   is the honest answer; `src` is a recommended, not required, field.
#
# `app` and `dest` are constants. `app` is required by the Authentication
#   model and "ransomleak" is simply true. `dest` is the service the user
#   authenticated to, which is this product -- the events carry no host at
#   all. It deliberately does NOT distinguish tenants: the tenant's real LMS
#   host is known to the modular input as its account `base_url` but is never
#   stamped into the event body. Recorded in docs/follow-ups.md.
#
# Not tagged `default`, `privileged` or `cleartext`: the event says nothing
#   about the actor's privilege level, and an LMS tenant-admin login is by any
#   reading privileged, so claiming Default_Authentication ("not privileged
#   and not insecure") for every row would be a claim we cannot support. The
#   root Authentication dataset -- what ES Access Center and every
#   `datamodel=Authentication` search reads -- is unaffected.
FIELDALIAS-ransomleak_audit_cim = userAgent AS user_agent
EVAL-app = "ransomleak"
EVAL-dest = "ransomleak"
EVAL-vendor_product = "RansomLeak"
EVAL-src = if(isnull(nullif(nullif(ipAddress, ""), "null")) OR ipAddress == "unknown", null(), ipAddress)
EVAL-object = coalesce(nullif(nullif(targetEmail, ""), "null"), nullif(nullif(targetId, ""), "null"))
EVAL-object_id = nullif(nullif(targetId, ""), "null")
EVAL-user = if(match(eventType, "^(license[.]assigned|settings[.]changed|role[.]default_changed|api_token[.]created|api_token[.]revoked)$") OR isnull(coalesce(nullif(nullif(targetId, ""), "null"), nullif(nullif(targetEmail, ""), "null"))), coalesce(nullif(nullif(actorEmail, ""), "null"), nullif(nullif(actorId, ""), "null")), coalesce(nullif(nullif(targetEmail, ""), "null"), nullif(nullif(targetId, ""), "null")))
EVAL-user_id = if(match(eventType, "^(license[.]assigned|settings[.]changed|role[.]default_changed|api_token[.]created|api_token[.]revoked)$") OR isnull(coalesce(nullif(nullif(targetId, ""), "null"), nullif(nullif(targetEmail, ""), "null"))), nullif(nullif(actorId, ""), "null"), nullif(nullif(targetId, ""), "null"))
EVAL-src_user = if(match(eventType, "^(license[.]assigned|settings[.]changed|role[.]default_changed|api_token[.]created|api_token[.]revoked)$") OR isnull(coalesce(nullif(nullif(targetId, ""), "null"), nullif(nullif(targetEmail, ""), "null"))), null(), nullif(nullif(actorEmail, ""), "null"))
EVAL-src_user_id = if(match(eventType, "^(license[.]assigned|settings[.]changed|role[.]default_changed|api_token[.]created|api_token[.]revoked)$") OR isnull(coalesce(nullif(nullif(targetId, ""), "null"), nullif(nullif(targetEmail, ""), "null"))), null(), nullif(nullif(actorId, ""), "null"))
EVAL-action = case(match(eventType, "^(login[.]success|mfa[.]verified)$"), "success", match(eventType, "^(login[.]failed|mfa[.]failed)$"), "failure", match(eventType, "^(mfa[.]challenge_sent)$"), "pending", match(eventType, "^(user[.]created|user[.]invited|api_token[.]created|scim[.]user_provisioned|scim[.]group_created|scim[.]provision_failed|scim[.]provision_failed_no_license)$"), "created", match(eventType, "^(user[.]deleted|api_token[.]revoked|scim[.]group_deleted)$"), "deleted", match(eventType, "^(account[.]locked)$"), "lockout", match(eventType, "^(user[.]updated|user[.]role_changed|user[.]disabled|user[.]enabled|password[.]changed|password[.]reset_completed|license[.]assigned|settings[.]changed|role[.]default_changed|scim[.]user_updated|scim[.]user_deactivated|scim[.]group_updated)$"), "updated")
EVAL-change_type = case(match(eventType, "^(settings[.]changed)$"), "configuration", match(eventType, "^(user[.]created|user[.]deleted|user[.]updated|user[.]role_changed|user[.]disabled|user[.]enabled|user[.]invited|account[.]locked|password[.]changed|password[.]reset_completed|license[.]assigned|role[.]default_changed|api_token[.]created|api_token[.]revoked|scim[.]user_provisioned|scim[.]user_updated|scim[.]user_deactivated|scim[.]group_created|scim[.]group_updated|scim[.]group_deleted|scim[.]provision_failed|scim[.]provision_failed_no_license)$"), "AAA")
EVAL-status = case(match(eventType, "^(scim[.]provision_failed|scim[.]provision_failed_no_license)$"), "failure", match(eventType, "^(user[.]created|user[.]deleted|user[.]updated|user[.]role_changed|user[.]disabled|user[.]enabled|user[.]invited|account[.]locked|password[.]changed|password[.]reset_completed|license[.]assigned|settings[.]changed|role[.]default_changed|api_token[.]created|api_token[.]revoked|scim[.]user_provisioned|scim[.]user_updated|scim[.]user_deactivated|scim[.]group_created|scim[.]group_updated|scim[.]group_deleted)$"), "success")
# `Account_Lockouts` constrains on `result="lockout"`, NOT on `action`, even
# though the CIM field reference documents `lockout` as an `action` value. The
# mapping followed the reference and the lockout landed in no leaf dataset at
# all: verified in Splunk 10.4.2 with Splunk_SA_CIM 8.5.0 as
# `action_lockout=1, result_lockout=0, Account_Lockouts=0`, and 66+82+0+0=148
# of 149 Account_Management events. A probe event identical but for
# `result=lockout` landed correctly, which is what this line reproduces.
# Deliberately narrow: `result` stays unset on every other event type, so no
# other dataset's constraints can be affected.
EVAL-result = case(match(eventType, "^(account[.]locked)$"), "lockout")
EVAL-object_category = case(match(eventType, "^(scim[.]group_created|scim[.]group_updated|scim[.]group_deleted)$"), "group", match(eventType, "^(api_token[.]created|api_token[.]revoked)$"), "credential", match(eventType, "^(settings[.]changed)$"), "configuration", match(eventType, "^(role[.]default_changed)$"), "role", match(eventType, "^(license[.]assigned)$"), "license", match(eventType, "^(user[.]created|user[.]deleted|user[.]updated|user[.]role_changed|user[.]disabled|user[.]enabled|user[.]invited|account[.]locked|password[.]changed|password[.]reset_completed|scim[.]user_provisioned|scim[.]user_updated|scim[.]user_deactivated|scim[.]provision_failed|scim[.]provision_failed_no_license)$"), "user")

[ransomleak:training]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = ^\{"rlEventTime":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 64
TZ = UTC
category = Security
pulldown_type = 1

# `ransomleak:risk` and `ransomleak:metrics` carry BOTH response shapes of
# `POST /api/integration/grafana/query`, and their `_time` differs by shape:
#
#   format=time_series -> the bucket's UTC day, carried in `bucketTime`
#   format=table       -> the instant this input observed the row
#
# A table row has no timestamp of its own -- `overdue_users` and the aggregate
# tables are computed against CURRENT_DATE, so they describe *now* -- which is
# the same reasoning that put `ransomleak:training` on observation time.
#
# These two stanzas are where the previous-event defect was MEASURED, and they
# are the reason the extraction field is an ENVELOPE field rather than a payload
# field. The original `TIME_PREFIX = "bucketTime":\s*"` matched every series
# event and no table event, so 102 `overdue_users` rows landed on the preceding
# series bucket's day. One stanza cannot serve two payload shapes by naming
# their fields -- so it names neither. `grafana_input.py` decides the right
# instant per shape and `event_payload()` writes it to `rlEventTime` on both,
# which is what lets ONE prefix, identical to the other four stanzas', parse
# both. It is also where the digest trap lives: the stamp is applied at write
# time, AFTER change detection has digested the body, because a table row's
# observation instant moves every poll and digesting it would re-emit every row
# forever.

[ransomleak:risk]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = ^\{"rlEventTime":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 64
TZ = UTC
category = Security
pulldown_type = 1

