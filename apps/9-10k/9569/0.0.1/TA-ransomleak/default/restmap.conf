[admin:TA-ransomleak_configuration]
match = /
members = TA-ransomleak_account, TA-ransomleak_settings

[admin:TA-ransomleak_inputs]
match = /
members = TA-ransomleak_audit_events, TA-ransomleak_phishing_events, TA-ransomleak_ransomleak_metrics, TA-ransomleak_ransomleak_risk, TA-ransomleak_training_state

[admin_external:TA-ransomleak_account]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = TA-ransomleak_rh_account.py
handleractions = edit, list, remove, create
handlerpersistentmode = true

