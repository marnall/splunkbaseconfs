[super_mvrange(3)]
args = field,lbound,hbound
definition = eval _batch_size = 10000\
| eval _batches=mvrange( 0, ceiling( ($hbound$-$lbound$) / _batch_size ) )\
| eval $field$=null()\
| foreach mode=multivalue _batches\
 [ eval _batch_lbound= $lbound$ + <<ITEM>> * _batch_size, _batch_hbound=min( _batch_lbound + _batch_size, $hbound$), $field$=mvappend( $field$, mvrange( _batch_lbound, _batch_hbound ) ) ]\
| fields - _batch*
iseval = 0

[SPL_workshop_html_tweaker(1)]
args = field
definition = eval $field$=replace( '$field$', "<command>(\w+)</command>", "<a target=\"_blank\" href=\"https://help.splunk.com/en/splunk-cloud-platform/search/search-reference/10.4.2604/search-commands/\1\"><span style=\"font-family: monospace; text-decoration: underline;\">\1</span></a>" )\
| eval $field$=replace( '$field$', "<stats>(\w+)</stats>", "<a target=\"_blank\" href=\"https://help.splunk.com/en/splunk-cloud-platform/search/search-reference/10.4.2604/statistical-and-charting-functions/statistical-and-charting-functions\"><span style=\"font-family: monospace; text-decoration: underline;\">\1</span></a>" )\
| eval $field$=replace( '$field$', "<eval>(\w+)</eval>", "<a target=\"_blank\" href=\"https://help.splunk.com/en/splunk-cloud-platform/search/search-reference/10.4.2604/evaluation-functions/evaluation-functions\"><span style=\"font-family: monospace; text-decoration: underline;\">\1</span></a>" )\
| eval $field$=replace( '$field$', "<preish>(?s)(.+?)</preish>", "<span style=\"font-family: monospace;\">\1</span>" )
iseval = 0
