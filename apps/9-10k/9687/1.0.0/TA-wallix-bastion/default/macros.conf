#
# TA-wallix-bastion - macros.conf
# Edit wallix_bastion_index in local/macros.conf to point at your own index.
#

[wallix_bastion_index]
definition = index=wallix_bastion
iseval = 0
description = Index holding WALLIX Bastion data. Override in local/macros.conf.

[wallix_bastion]
definition = `wallix_bastion_index` (sourcetype=wallix:bastion OR sourcetype=wallix:bastion:* OR sourcetype="WB:syslog")
iseval = 0
description = All WALLIX Bastion events.

[wallix_bastion_auth]
definition = `wallix_bastion_index` sourcetype=wallix:bastion:auth
iseval = 0
description = WALLIX Bastion primary authentication events.

[wallix_bastion_audit]
definition = `wallix_bastion_index` sourcetype=wallix:bastion:audit
iseval = 0
description = WALLIX Bastion administration audit trail.

[wallix_bastion_sessions]
definition = `wallix_bastion_index` sourcetype=wallix:bastion:session
iseval = 0
description = WALLIX Bastion privileged session activity.

[wallix_bastion_vault]
definition = `wallix_bastion_index` sourcetype=wallix:bastion:vault
iseval = 0
description = WALLIX Bastion vault checkout/checkin activity.

[wallix_bastion_session_duration(1)]
args = duration_field
definition = eval wallix_duration_seconds = if(match($duration_field$, "^\d+:\d{2}:\d{2}$"), tonumber(mvindex(split($duration_field$,":"),0))*3600 + tonumber(mvindex(split($duration_field$,":"),1))*60 + tonumber(mvindex(split($duration_field$,":"),2)), null())
iseval = 0
description = Convert a WALLIX H:MM:SS duration into seconds.
