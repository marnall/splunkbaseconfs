#
# TA-wallix-bastion - app.conf
# Technology Add-on for WALLIX Bastion (Privileged Access Management)
#

[install]
is_configured = 0
state = enabled
build = 1788386232

[launcher]
author = Amara Traore
description = Parses, normalizes and CIM-maps WALLIX Bastion PAM syslog events (both the modern RFC 5424 double-quoted dialect and the legacy WAB(CORE) single-quoted dialect). Search-time only, no scripts, no binaries. Maps to Authentication, Change, Network Traffic and Endpoint/Processes.
version = 1.0.0

[ui]
is_visible = 0
label = WALLIX Bastion Add-on

[package]
id = TA-wallix-bastion
check_for_updates = true

[id]
name = TA-wallix-bastion
version = 1.0.0

[triggers]
# Reload this add-on's own conf file without restarting Splunk. Splunk's
# standard conf files (props, transforms, eventtypes, tags, macros) are
# reloaded by Splunk itself and must not be listed here.
reload.wallix_bastion = simple
