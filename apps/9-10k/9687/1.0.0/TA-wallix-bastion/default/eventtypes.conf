#
# TA-wallix-bastion - eventtypes.conf
# Event types carry the CIM tags declared in tags.conf.
#

## ---------- Authentication ----------

# A Bastion authentication is two events: status="started" when the attempt
# opens, then status="success" or a failure when it completes. Only the second
# carries an outcome, so only the second belongs in the Authentication data
# model - a "started" event has no action to report and would land in the
# model as action=unknown, roughly half of every authentication in the estate.
[wallix_bastion_authentication]
search = sourcetype=wallix:bastion:auth NOT wallix_status=started
#tags = authentication

# The opening half. No CIM tag: it is not an outcome. Kept as an eventtype so
# an attempt that never completes stays findable.
[wallix_bastion_authentication_started]
search = sourcetype=wallix:bastion:auth wallix_status=started

[wallix_bastion_authentication_privileged]
search = sourcetype=wallix:bastion:auth is_Privileged=true
#tags = authentication privileged

[wallix_bastion_session_authentication]
search = sourcetype=wallix:bastion:session wallix_type IN ("SESSION_ESTABLISHED_SUCCESSFULLY","CONNECTION_FAILED","AUTHENTICATION_SUCCESS","AUTHENTICATION_FAILURE","SESSION_DISCONNECTION","SESSION_KILLED")
#tags = authentication privileged

# CIM Default_Authentication is what is left once the privileged and the
# incomplete are taken out. Keying this on wallix_type="primary_authentication"
# was wrong: that value belongs to the legacy dialect, and an appliance
# emitting the modern one puts the authentication INTERFACE there - "Vault",
# for instance - so nothing ever reached the model.
[wallix_bastion_authentication_default]
search = sourcetype=wallix:bastion:auth NOT wallix_status=started NOT is_Privileged=true
#tags = authentication default

## ---------- Change / administration ----------

[wallix_bastion_change]
search = sourcetype=wallix:bastion:audit
#tags = change

[wallix_bastion_account_management]
search = sourcetype=wallix:bastion:audit wallix_object_type IN ("User","UserAuth","Usergroup","LdapMapping","Profile","Account")
#tags = change account

[wallix_bastion_authorization_change]
search = sourcetype=wallix:bastion:audit wallix_object_type IN ("Authorization","ConnectionPolicy","Restriction","Period","TimeFrame")
#tags = change

[wallix_bastion_vault_activity]
search = sourcetype=wallix:bastion:vault
#tags = change account

[wallix_bastion_backup]
search = sourcetype=wallix:bastion:audit wallix_action IN ("backup","restore")
#tags = change

## ---------- Network ----------

[wallix_bastion_network_traffic]
search = sourcetype=wallix:bastion:proxy
#tags = network communicate

[wallix_bastion_session_traffic]
search = sourcetype=wallix:bastion:session wallix_type="SESSION_ESTABLISHED_SUCCESSFULLY"
#tags = network communicate session start

[wallix_bastion_session_end]
search = sourcetype=wallix:bastion:session wallix_type IN ("SESSION_DISCONNECTION","SESSION_KILLED")
#tags = network session end

## ---------- Endpoint / process activity inside a session ----------

[wallix_bastion_process_activity]
search = sourcetype=wallix:bastion:session wallix_type IN ("NEW_PROCESS","COMPLETED_PROCESS")
#tags = process report endpoint

## ---------- High-value security signals (no CIM tag, for correlation) ----------

[wallix_bastion_session_integrity_failure]
search = sourcetype=wallix:bastion:integrity wallix_status="failed"

[wallix_bastion_forbidden_pattern]
search = sourcetype=wallix:bastion:session wallix_type IN ("PATTERN_FOUND","KILL_PATTERN_DETECTED","NOTIFY_PATTERN_DETECTED")

[wallix_bastion_clipboard_exfiltration]
search = sourcetype=wallix:bastion:session wallix_type IN ("CB_COPYING_PASTING_DATA_FROM_REMOTE_SESSION","CB_COPYING_PASTING_DATA_FROM_REMOTE_SESSION_EX")

[wallix_bastion_file_transfer]
search = sourcetype=wallix:bastion:session wallix_type IN ("SFTP_EVENT","DRIVE_REDIRECTION_READ","DRIVE_REDIRECTION_WRITE","DRIVE_REDIRECTION_WRITE_EX","DRIVE_REDIRECTION_DELETE","DRIVE_REDIRECTION_RENAME")

[wallix_bastion_keystrokes]
search = sourcetype=wallix:bastion:session wallix_type="KBD_INPUT"

[wallix_bastion_error]
search = sourcetype=wallix:bastion* (action=failure OR wallix_status=failed OR wallix_status=failure)
