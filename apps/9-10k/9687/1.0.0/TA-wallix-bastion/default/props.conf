#
# TA-wallix-bastion - props.conf
#
#  Ingest sourcetype ........ wallix:bastion        (put this on your input)
#  Routed sourcetypes ....... wallix:bastion:audit      administration audit trail
#                             wallix:bastion:auth       primary authentication
#                             wallix:bastion:session    privileged session activity
#                             wallix:bastion:proxy      proxy connection events
#                             wallix:bastion:vault      credential checkout/checkin
#                             wallix:bastion:integrity  session recording integrity
#                             wallix:bastion:system     appliance OS events
#  Compatibility ............ WB:syslog             (legacy TA-WALLIX_Bastion)
#

##############################################################################
# INGEST SOURCETYPE
##############################################################################

[wallix:bastion]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# LINE_BREAKER is honoured by a heavy forwarder or an indexer. A UNIVERSAL
# FORWARDER ignores it - the two settings below are the only event-boundary
# attributes a UF acts on. Without them a UF terminating a TCP syslog stream
# can cut mid-event when it rotates to the next indexer, producing truncated
# and merged events that look exactly like a broken regex.
EVENT_BREAKER_ENABLE = true
EVENT_BREAKER = ([\r\n]+)
TRUNCATE = 32768
KV_MODE = none
AUTO_KV_JSON = false
ANNOTATE_PUNCT = false
# Skips an optional <PRI> and RFC 5424 version digit, then lets datetime.xml
# resolve either the ISO 8601 (modern) or the BSD "Dec 20 17:19:35" (legacy)
# timestamp. Events that arrive with no header at all fall back to index time.
TIME_PREFIX = ^(?:<\d{1,3}>\d?\s?)?
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Network & Security
description = WALLIX Bastion PAM - mixed syslog stream, routed to wallix:bastion:* at index time
# Un-comment to collapse WALLIX's doubled backslashes in command_line / data.
# Modifies _raw at index time, so enable it deliberately.
# SEDCMD-wallix_unescape = s/\\\\/\\/g
TRANSFORMS-wallix_bastion_routing = wallix_bastion_route_audit, wallix_bastion_route_auth, wallix_bastion_route_session, wallix_bastion_route_proxy, wallix_bastion_route_vault, wallix_bastion_route_integrity, wallix_bastion_route_system
# Extractions are repeated on the parent so the add-on still works when it is
# installed on the search head only and index-time routing never ran.
REPORT-wallix_bastion_kv = wallix_bastion_event_tag, wallix_bastion_kv_d_account, wallix_bastion_kv_d_action, wallix_bastion_kv_d_begin, wallix_bastion_kv_d_button, wallix_bastion_kv_d_channel_id, wallix_bastion_kv_d_checkbox, wallix_bastion_kv_d_class_name, wallix_bastion_kv_d_client_ip, wallix_bastion_kv_d_client_name, wallix_bastion_kv_d_code, wallix_bastion_kv_d_command, wallix_bastion_kv_d_command_line, wallix_bastion_kv_d_copy_id, wallix_bastion_kv_d_credential_type, wallix_bastion_kv_d_data, wallix_bastion_kv_d_description, wallix_bastion_kv_d_device, wallix_bastion_kv_d_diagnostic, wallix_bastion_kv_d_direction, wallix_bastion_kv_d_display_name, wallix_bastion_kv_d_dst, wallix_bastion_kv_d_dst_port, wallix_bastion_kv_d_dst_protocol, wallix_bastion_kv_d_duration, wallix_bastion_kv_d_edit, wallix_bastion_kv_d_encryption_type, wallix_bastion_kv_d_end, wallix_bastion_kv_d_end_time, wallix_bastion_kv_d_file_name, wallix_bastion_kv_d_filename, wallix_bastion_kv_d_files, wallix_bastion_kv_d_flags, wallix_bastion_kv_d_format, wallix_bastion_kv_d_groups, wallix_bastion_kv_d_host, wallix_bastion_kv_d_icap_service, wallix_bastion_kv_d_identifier, wallix_bastion_kv_d_impacted, wallix_bastion_kv_d_infos, wallix_bastion_kv_d_login, wallix_bastion_kv_d_message, wallix_bastion_kv_d_method, wallix_bastion_kv_d_object, wallix_bastion_kv_d_partial_data, wallix_bastion_kv_d_pattern, wallix_bastion_kv_d_port, wallix_bastion_kv_d_post, wallix_bastion_kv_d_psid, wallix_bastion_kv_d_pubkey_hash, wallix_bastion_kv_d_pubkey_type, wallix_bastion_kv_d_reason, wallix_bastion_kv_d_renew_time, wallix_bastion_kv_d_result, wallix_bastion_kv_d_secondary, wallix_bastion_kv_d_server_name, wallix_bastion_kv_d_service, wallix_bastion_kv_d_session, wallix_bastion_kv_d_session_id, wallix_bastion_kv_d_session_uid, wallix_bastion_kv_d_sessionid, wallix_bastion_kv_d_sha256, wallix_bastion_kv_d_size, wallix_bastion_kv_d_source, wallix_bastion_kv_d_src, wallix_bastion_kv_d_src_ip, wallix_bastion_kv_d_s