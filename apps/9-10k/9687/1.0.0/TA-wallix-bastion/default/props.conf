##############################################################################
# PRIMARY AUTHENTICATION  ->  CIM Authentication
#   modern: [wabauth] action="authentify" user="jdoe" client_ip="192.0.2.4"
#           status="success" infos="diagnostic ['ad.corp' -password- authentication succeeded]"
#   legacy: WAB(CORE)[18190]: type='primary_authentication' username='admin'
#           client_ip='192.0.2.25' diagnostic='SUCCESS'
#   legacy: WAB(CORE)[18190]: type='session opened' username='admin'
#           secondary='root@debian32' client_ip='192.0.2.25' src_protocol='SSH'
##############################################################################

[wallix:bastion:auth]
KV_MODE = none
REPORT-wallix_bastion_kv = wallix_bastion_event_tag, wallix_bastion_kv_d_account, wallix_bastion_kv_d_action, wallix_bastion_kv_d_begin, wallix_bastion_kv_d_button, wallix_bastion_kv_d_channel_id, wallix_bastion_kv_d_checkbox, wallix_bastion_kv_d_class_name, wallix_bastion_kv_d_client_ip, wallix_bastion_kv_d_client_name, wallix_bastion_kv_d_code, wallix_bastion_kv_d_command, wallix_bastion_kv_d_command_line, wallix_bastion_kv_d_copy_id, wallix_bastion_kv_d_credential_type, wallix_bastion_kv_d_data, wallix_bastion_kv_d_description, wallix_bastion_kv_d_device, wallix_bastion_kv_d_diagnostic, wallix_bastion_kv_d_direction, wallix_bastion_kv_d_display_name, wallix_bastion_kv_d_dst, wallix_bastion_kv_d_dst_port, wallix_bastion_kv_d_dst_protocol, wallix_bastion_kv_d_duration, wallix_bastion_kv_d_edit, wallix_bastion_kv_d_encryption_type, wallix_bastion_kv_d_end, wallix_bastion_kv_d_end_time, wallix_bastion_kv_d_file_name, wallix_bastion_kv_d_filename, wallix_bastion_kv_d_files, wallix_bastion_kv_d_flags, wallix_bastion_kv_d_format, wallix_bastion_kv_d_groups, wallix_bastion_kv_d_host, wallix_bastion_kv_d_icap_service, wallix_bastion_kv_d_identifier, wallix_bastion_kv_d_impacted, wallix_bastion_kv_d_infos, wallix_bastion_kv_d_login, wallix_bastion_kv_d_message, wallix_bastion_kv_d_method, wallix_bastion_kv_d_object, wallix_bastion_kv_d_partial_data, wallix_bastion_kv_d_pattern, wallix_bastion_kv_d_port, wallix_bastion_kv_d_post, wallix_bastion_kv_d_psid, wallix_bastion_kv_d_pubkey_hash, wallix_bastion_kv_d_pubkey_type, wallix_bastion_kv_d_reason, wallix_bastion_kv_d_renew_time, wallix_bastion_kv_d_result, wallix_bastion_kv_d_secondary, wallix_bastion_kv_d_server_name, wallix_bastion_kv_d_service, wallix_bastion_kv_d_session, wallix_bastion_kv_d_session_id, wallix_bastion_kv_d_session_uid, wallix_bastion_kv_d_sessionid, wallix_bastion_kv_d_sha256, wallix_bastion_kv_d_size, wallix_bastion_kv_d_source, wallix_bastion_kv_d_src, wallix_bastion_kv_d_src_ip, wallix_bastion_kv_d_src_port, wallix_bastion_kv_d_src_protocol, wallix_bastion_kv_d_start_time, wallix_bastion_kv_d_state, wallix_bastion_kv_d_status, wallix_bastion_kv_d_target, wallix_bastion_kv_d_target_ip, wallix_bastion_kv_d_text, wallix_bastion_kv_d_timestamp, wallix_bastion_kv_d_title, wallix_bastion_kv_d_type, wallix_bastion_kv_d_uid, wallix_bastion_kv_d_url, wallix_bastion_kv_d_user, wallix_bastion_kv_d_username, wallix_bastion_kv_d_vault, wallix_bastion_kv_d_window, wallix_bastion_kv_d_windows, wallix_bastion_kv_s_account, wallix_bastion_kv_s_action, wallix_bastion_kv_s_client_ip, wallix_bastion_kv_s_device, wallix_bastion_kv_s_diagnostic, wallix_bastion_kv_s_dst_protocol, wallix_bastion_kv_s_message, wallix_bastion_kv_s_result, wallix_bastion_kv_s_secondary, wallix_bastion_kv_s_service, wallix_bastion_kv_s_session_id, wallix_bastion_kv_s_src_protocol, wallix_bastion_kv_s_status, wallix_bastion_kv_s_target_ip, wallix_bastion_kv_s_timestamp, wallix_bastion_kv_s_type, wallix_bastion_kv_s_uid, wallix_bastion_kv_s_user, wallix_bastion_kv_s_username, wallix_bastion_recording_files, wallix_bastion_legacy_program, wallix_bastion_bsd_header, wallix_bastion_rfc5424_header
# 'ad.corp' -password- authentication succeeded   (present in both dialects,
# inside diagnostic='...' for legacy and inside infos="diagnostic [...]" for modern)
EXTRACT-wallix_bastion_auth_diagnostic = '(?<wallix_auth_domain>[^']*)'\s+-(?<wallix_auth_method>[A-Za-z0-9_]+)-\s+(?<wallix_auth_message>[^\]']+)
EVAL-vendor = "WALLIX"
EVAL-product = "Bastion"
EVAL-vendor_product = "WALLIX Bastion"
EVAL-app = "wallix:bastion"
EVAL-src = coalesce(wallix_client_ip, wallix_src_ip)
EVAL-src_port = wallix_src_port
# The human operator authenticating to the Bastion
EVAL-src_user = coalesce(wallix_username, wallix_user)
# On a secondary authentication the effective identity is the target account
EVAL-user = case(isnotnull(wallix_secondary), mvindex(split(wallix_secondary, "@"), 0), isnotnull(wallix_account), wallix_account, true(), coalesce(wallix_user, wallix_username))
EVAL-dest = case(isnotnull(wallix_secondary), mvindex(split(wallix_secondary, "@"), -1), isnotnull(wallix_target_ip), wallix_target_ip, isnotnull(wallix_device), wallix_device, true(), host)
EVAL-authentication_method = coalesce(wallix_auth_method, wallix_method)
# The Authentication data model has no vendor_product field, so
# authentication_service is the only stable handle on "these events are the
# Bastion". It is therefore the product, uniformly, on :auth and on :session -
# not the directory that answered, which would be a different value per realm
# and leave no way to select WALLIX events at all. The realm stays available
# as wallix_auth_domain and is mapped to src_nt_domain.
EVAL-authentication_service = "wallix:bastion"
EVAL-src_nt_domain = wallix_auth_domain
EVAL-signature = coalesce(wallix_type, wallix_action)
EVAL-signature_id = coalesce(wallix_type, wallix_action)
EVAL-vendor_action = coalesce(wallix_type, wallix_action)
EVAL-reason = coalesce(wallix_infos, wallix_diagnostic, wallix_auth_message, wallix_message)
EVAL-session_id = coalesce(wallix_session_id, wallix_uid)
EVAL-src_protocol = wallix_src_protocol
EVAL-dest_protocol = wallix_dst_protocol
EVAL-action = case(lower(wallix_status)=="success","success", lower(wallix_status) IN ("failure","failed","fail"),"failure", lower(wallix_result)=="true","success", lower(wallix_result)=="false","failure", upper(wallix_diagnostic)=="SUCCESS","success", upper(wallix_diagnostic) IN ("FAIL","FAILURE"),"failure", match(lower(coalesce(wallix_auth_message, wallix_diagnostic, wallix_infos, "")),"succe"),"success", match(lower(coalesce(wallix_auth_message, wallix_diagnostic, wallix_infos, "")),"fail|denied|refus"),"failure", wallix_type IN ("session opened","session closed"),"success", true(),"unknown")
EVAL-is_Privileged = if(isnotnull(wallix_secondary) OR isnotnull(wallix_account), "true", "false")
LOOKUP-wallix_bastion_severity = wallix_bastion_severity_lookup wallix_severity_key AS wallix_status OUTPUTNEW severity, severity_id
FIELDALIAS-wallix_bastion_legacy_names = wallix_log_type AS WB_Event wallix_type AS WB_Type wallix_user AS WB_User wallix_action AS WB_Action wallix_status AS WB_Status wallix_client_ip AS WB_Client_Ip wallix_infos AS WB_Infos wallix_method AS WB_Method

