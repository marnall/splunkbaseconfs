# <<< end generated

[wallix_bastion_event_tag]
# The bracketed message tag: [wabaudit], [SSH Session], [Vault Activity]...
# Starts with a letter, so the syslog PID block [18190] cannot match; must be
# followed by a space, so bracketed values inside infos="..." cannot match.
REGEX = \[([A-Za-z][A-Za-z0-9 _-]{0,62})\]\s
FORMAT = wallix_log_type::$1

[wallix_bastion_recording_files]
# files=[...] / file=[...] are the only unquoted, bracket-delimited values.
# WALLIX writes the recording path with commas instead of slashes.
REGEX = \sfiles?=\[([^\]]+)\]
FORMAT = wallix_recording_raw::$1

[wallix_bastion_legacy_program]
# Legacy header: Dec 20 17:19:35 wab2 WAB(CORE)[18190]: ...
# Modern header: <14>1 2024-06-26T22:37:26+01:00 host rdpproxy 18992 - - [...]
REGEX = (?:^|\s)(?:WAB\((?<wallix_process_owner>[^)]+)\)|(?<wallix_daemon>rdpproxy|sshproxy|vncproxy|telnetproxy|wabengine))\[(?<wallix_pid>\d+)\]

[wallix_bastion_bsd_header]
# <14>Aug 28 12:26:45 WALLIXMACHINE sshproxy[13656]: [SSH Session] key="value"
#
# The envelope and the payload are INDEPENDENT axes. A Bastion can wrap a
# modern double-quoted payload in an RFC 3164 (BSD) header with a priority,
# which is what production appliances observed in the field actually emit -
# neither the pure RFC 5424 form nor the legacy WAB(CORE) single-quote form
# this add-on was first written against. Without this stanza the payload
# still parses, but the appliance's own hostname is lost, and in an estate
# with several Bastions nothing identifies which one spoke.
REGEX = ^(?:<\d{1,3}>)?[A-Z][a-z]{2}\s+\d{1,2}\s\d{2}:\d{2}:\d{2}\s+(?<wallix_syslog_host>\S+)\s+(?<wallix_syslog_app>[^\s\[:]+)(?:\[(?<wallix_syslog_procid>\d+)\])?:

[wallix_bastion_rfc5424_header]
# <PRI>VERSION TIMESTAMP HOSTNAME APP-NAME PROCID MSGID SD
# APP-NAME can be WAB(root), which is illegal RFC 5424 and breaks strict parsers.
REGEX = ^(?:<\d{1,3}>\d\s)?\d{4}-\d{2}-\d{2}T[0-9:.]+(?:Z|[+-]\d{2}:\d{2})\s+(?<wallix_syslog_host>\S+)\s+(?<wallix_syslog_app>\S+)\s+(?<wallix_syslog_procid>\S+)\s

[wallix_bastion_infos_pairs]
# infos="cn [local], device [QA_DEVICE]"  ->  multivalue wallix_infos_pair
REGEX = ([A-Za-z_][A-Za-z0-9_]*)\s\[([^\[\]]*)\]
FORMAT = wallix_infos_pair::$1=$2
REPEAT_MATCH = true
SOURCE_KEY = wallix_infos


##############################################################################
# 3. NORMALIZATION LOOKUPS
##############################################################################

[wallix_bastion_audit_action_lookup]
filename = wallix_bastion_audit_action.csv
case_sensitive_match = false
min_matches = 1
default_match = unknown

[wallix_bastion_object_category_lookup]
filename = wallix_bastion_object_category.csv
case_sensitive_match = false
min_matches = 1
default_match = object

[wallix_bastion_protocol_lookup]
filename = wallix_bastion_protocol.csv
case_sensitive_match = false

[wallix_bastion_session_action_lookup]
filename = wallix_bastion_session_action.csv
case_sensitive_match = false

[wallix_bastion_severity_lookup]
filename = wallix_bastion_severity.csv
case_sensitive_match = false
min_matches = 1
default_match = informational
