#
# TA-wallix-bastion - transforms.conf
#
# Two families of stanzas:
#   1. wallix_bastion_route_*  : INDEX-TIME sourcetype routing (one mixed syslog
#                                stream -> one sourcetype per WALLIX log family).
#   2. wallix_bastion_kv_*     : SEARCH-TIME key/value extraction, one stanza per
#                                WALLIX quoting dialect.
#   3. *_lookup                : normalization tables used by props.conf LOOKUP-*.
#

##############################################################################
# 1. INDEX-TIME SOURCETYPE ROUTING
#    Deploy on the indexers / heavy forwarder that parses the WALLIX stream.
#    Stanzas are mutually exclusive; unmatched events stay on wallix:bastion.
##############################################################################

[wallix_bastion_route_audit]
REGEX = \[wabaudit\]\s
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::wallix:bastion:audit

[wallix_bastion_route_auth]
# Modern: [wabauth] action="authentify" ...
# Legacy: WAB(CORE)[18190]: type='primary_authentication' ...
REGEX = (?:\[wabauth\]\s|WAB\(CORE\)\[\d+\]:\s+type=')
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::wallix:bastion:auth

[wallix_bastion_route_session]
REGEX = \[(?:SSH|RDP|VNC|TELNET|RLOGIN|SFTP|SCP)\s+Session\]\s
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::wallix:bastion:session

[wallix_bastion_route_proxy]
REGEX = \[(?:sshproxy|rdpproxy|vncproxy|telnetproxy|rloginproxy)\]\s
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::wallix:bastion:proxy

[wallix_bastion_route_vault]
REGEX = \[Vault\s+Activity\]\s
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::wallix:bastion:vault

[wallix_bastion_route_integrity]
REGEX = \[sessionintegrity\]\s
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::wallix:bastion:integrity

[wallix_bastion_route_system]
# Underlying Linux appliance events riding the same syslog stream.
REGEX = (?:pam_unix\(|\bsudo(?:\[\d+\])?:\s|\bCRON\[\d+\]:|\bsshd\[\d+\]:)
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::wallix:bastion:system


##############################################################################
# 2. SEARCH-TIME KEY/VALUE EXTRACTION
#
#    Both dialects are extracted with a "lazy value + lookahead on the next
#    key" pattern instead of a naive [^"]* / [^']* character class. That is what
#    makes the following real WALLIX payloads survive:
#
#      command_line="\"C:\\Windows\\system32\\x.exe\" -ServerName:y"   escaped quotes
#      diagnostic=''local' -pubkey- Authentication failed'             nested quotes
#      infos="cn [A], methods [X, Y and 1 other(s)]"                   commas + brackets
#      object="<Approval(uid=\'168c...\', status=3)>\n"                mixed quoting
#
#    Every key is prefixed with wallix_ so nothing collides with Splunk
#    metadata (host, source, index) or with the CIM fields we compute later.
##############################################################################

# >>> generated block - do not edit here; put your own
# extractions in local/transforms.conf

# Modern dialect: key="value". One stanza per key, and not one combined
# regex: at search time a transform extracts its first match and stops -
# REPEAT_MATCH is honoured at index time only.

[wallix_bastion_kv_d_account]
REGEX = (?:^|\s)account="(?<wallix_account>.*?)"(?=\s+[A-Za-z_][A-Za-z0-9_]*=["\[]|\]|\s*$)

[wallix_bastion_kv_d_action]
REGEX = (?:^|\s)action="(?<wallix_action>.*?)"(?=\s+[A-Za-z_][A-Za-z0-9_]*=["\[]|\]|\s*$)

