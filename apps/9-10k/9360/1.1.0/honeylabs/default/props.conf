[honeylabs:feed]
# The input writes key="value" pairs, which Splunk extracts natively, so this
# stanza only has to fix the timestamp: the feed carries the observation time
# and indexing time would misrepresent when the indicator was actually seen.
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = last_seen="
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 25
TRUNCATE = 10000
