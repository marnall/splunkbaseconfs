[honeylabs-command]
syntax = honeylabs (field=<field>)? (prefix=<string>)? (only_observed=<bool>)?
alias =
shortdesc = Enrich IP addresses with HoneyLabs honeypot telemetry.
description = \
    For each event, looks up the IPv4 address in the given field against \
    HoneyLabs honeypot sensors and writes back what those sensors observed: \
    a verdict, event counts, first and last seen, ASN, country, top port, \
    exploit hits, and any recognised scanner tag. \
    Addresses are batched into one request per chunk and cached for the life \
    of the search, and private or reserved addresses are skipped without \
    being sent anywhere. \
    Works without an account at a lower cap; a key set on the app's setup \
    page raises it.
comment1 = Flag firewall traffic from addresses our sensors have seen attacking.
example1 = index=firewall | honeylabs field=src_ip | where honeylabs_events > 0
comment2 = Keep only observed addresses, and show why.
example2 = index=proxy | honeylabs field=dest_ip only_observed=t | table dest_ip honeylabs_verdict honeylabs_events honeylabs_reference
comment3 = Use a different field prefix to avoid a collision.
example3 = index=ids | honeylabs field=src prefix=hl_
usage = public
tags = honeylabs threat intelligence enrichment ip reputation honeypot

[honeylabssearch-command]
syntax = honeylabssearch mode=(events|payloads|attackers|timeline|asn|fingerprint|ioc|cve|population) (query=<string>)? (ioc=<string>)? (cve=<string>)? (asn=<string>)? (fingerprint=<string>)? (fp_type=<string>)? (source_ip=<string>)? (country=<string>)? (dest_port=<int>)? (protocol=<string>)? (app_protocol=<string>)? (http_method=<string>)? (request_header=<string>)? (ja4=<string>)? (ja3=<string>)? (ip_version=<int>)? (by=<string>)? (bucket=<string>)? (days=<int>)? (window=<string>)? (limit=<int>)? (since=<string>)? (until=<string>)?
alias =
shortdesc = Query the HoneyLabs honeypot dataset directly.
description = \
    A generating command, so it opens a search rather than annotating one. \
    Where the honeylabs command answers questions about an address you \
    already have, this one queries the dataset itself. \
    mode=events returns raw sensor events with every field. \
    mode=payloads searches captured request text: URL path, body and headers. \
    mode=attackers ranks sources. mode=timeline buckets volume over time. \
    mode=ioc profiles an IP, a CIDR range or a domain. mode=cve shows who is \
    probing a CVE. mode=asn profiles a hosting provider. mode=fingerprint and \
    mode=population work on JA4, JA3, JA4H and HASSH values. \
    since and until default to the search time range, so the time picker \
    applies. Needs an API key, set on the app's setup page.
comment1 = Raw probes against a port, over whatever the time picker selects.
example1 = | honeylabssearch mode=events dest_port=8080 limit=200
comment2 = Find everyone who sent a given string in a request.
example2 = | honeylabssearch mode=payloads query="/cgi-bin/authLogin.cgi"
comment3 = Who is exercising a CVE.
example3 = | honeylabssearch mode=cve cve="CVE-2024-4577"
comment4 = Profile a whole subnet rather than one address.
example4 = | honeylabssearch mode=ioc ioc="185.220.101.0/24"
comment5 = Which other sources share this TLS fingerprint.
example5 = | honeylabssearch mode=population fp_type=ja4 fingerprint="t13i131000_f57a46bbacb6_ab7e3b40a677"
usage = public
tags = honeylabs threat intelligence honeypot search payload cve asn fingerprint
