# Disabled by default. An add-on that starts pulling data the moment it is
# installed, before anyone has chosen a feed, is both surprising and an
# AppInspect finding. Turn one on under Settings > Data inputs > HoneyLabs
# threat feed, which is where the setup page and the README both point. The
# setup page itself does not touch these; it only stores the API key.
#
# python.version / python.required are set on the scheme stanza and on each
# instance: AppInspect checks both, and a Splunk that cannot satisfy the
# requirement should refuse at install rather than run the input into a
# missing interpreter.
[honeylabs_feed]
python.version = python3
python.required = 3.13

[honeylabs_feed://exploiters]
feed = exploiters
interval = 3600
index = default
sourcetype = honeylabs:feed
python.version = python3
python.required = 3.13
disabled = 1

[honeylabs_feed://malware-infrastructure]
feed = malware-infrastructure
interval = 3600
index = default
sourcetype = honeylabs:feed
python.version = python3
python.required = 3.13
disabled = 1
