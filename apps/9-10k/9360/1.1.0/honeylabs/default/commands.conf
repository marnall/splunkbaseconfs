# chunked = true selects the v2 (chunked) custom search command protocol,
# which is what splunklib's StreamingCommand implements and what Splunk 8+
# expects. Without it Splunk speaks the legacy protocol and the command
# silently returns nothing.
#
# python.required pins the interpreter Splunk must have available. Without it
# a future Splunk that drops the default Python leaves the command silently
# unrunnable rather than failing loudly at install.
[honeylabs]
filename = honeylabs_enrich.py
chunked = true
python.version = python3
python.required = 3.13

# Generating command, so it must declare that it produces events rather than
# consuming them. Same chunked v2 protocol and the same interpreter pin as the
# enrichment command.
[honeylabssearch]
filename = honeylabs_search.py
chunked = true
python.version = python3
python.required = 3.13
