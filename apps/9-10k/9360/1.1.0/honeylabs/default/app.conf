#
# HoneyLabs Intelligence
#
[id]
name = honeylabs
version = 1.1.0

[install]
# No is_configured here, deliberately, and no setup_view in [ui] either.
#
# Nothing in this app requires configuration: the search command and both feed
# inputs work with no key at all. 1.0.0 and 1.0.1 nevertheless declared
# is_configured = false next to a setup_view, which is how Splunk is told the
# opposite. appRequiresSetup() in mrsparkle/controllers/view.py gates every
# view in an app that has a setup link and configured=0, and only a POST to
# apps/local/<app> clears it. The setup page never made one, so saving a key
# changed nothing and the app stayed walled off from its own dashboard. That
# POST also needs admin_all_objects or edit_local_apps, so a member of the
# plain user role could not have cleared it at any point.
#
# Setting is_configured = true would lift the gate but fails AppInspect's
# check_that_setup_has_not_been_performed, which rejects any truthy value in
# default/app.conf. Dropping setup_view is the fix that satisfies both: with no
# setup link there is nothing for appRequiresSetup to gate on. The setup page
# is still a view, reached from the app's navigation bar.
state = enabled
# Bumped with every release that touches appserver/static: Splunk keys the
# cache for those files on this number, so a stale build serves stale JS.
build = 3

[package]
id = honeylabs
check_for_updates = true

[ui]
is_visible = true
label = HoneyLabs Intelligence

[launcher]
author = HoneyLabs
version = 1.1.0
description = Query a honeypot dataset from Splunk: raw sensor events, captured request payloads, CVE exploitation, ASN and fingerprint profiles. Enrich the IP addresses already in your events with what those sensors observed, and index threat feeds of active exploiters and malware staging infrastructure.

[triggers]
reload.honeylabs_settings = simple
