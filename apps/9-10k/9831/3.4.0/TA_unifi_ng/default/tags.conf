# CIM data-model tags [v3.3.0]
# Attaches UniFi eventtypes to Splunk CIM data models.

# Inventory data model: network devices
[eventtype=unifi_device_inventory]
inventory = enabled
network = enabled
device = enabled

# Inventory data model: networks
[eventtype=unifi_network_inventory]
inventory = enabled
network = enabled

# Network Sessions data model: connected clients
[eventtype=unifi_client_session]
session = enabled
network = enabled
dhcp = enabled

# Performance data model: device CPU/memory
[eventtype=unifi_device_performance]
performance = enabled
os = enabled
resource = enabled
