# UniFi TA NG — sourcetype parsing + CIM mapping
#
# All events are single-line JSON objects with unifi_collection_time emitted
# FIRST (so TIME_PREFIX matches at the start of the event).
#
# _time policy (v3.1.1+):
#   * snapshot sourcetypes  -> _time = unifi_collection_time
#   * unifi:device:stats    -> _time = lastHeartbeatAt (real measurement time)
#
# KV_MODE=json so nested fields are extractable at search time.
# CIM field aliases / calculated fields (v3.3.0) map onto Splunk CIM data
# models; tags.conf attaches each sourcetype to its data model.

# ===========================================================================
# Sites / inventory / config — snapshot _time
# ===========================================================================

[unifi:site]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
TIME_PREFIX = unifi_collection_time"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3Q
MAX_TIMESTAMP_LOOKAHEAD = 256

[unifi:device]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
TIME_PREFIX = unifi_collection_time"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3Q
MAX_TIMESTAMP_LOOKAHEAD = 256
FIELDALIAS-cim_mac = macAddress AS mac
FIELDALIAS-cim_ip = ipAddress AS ip
FIELDALIAS-cim_dest = ipAddress AS dest
FIELDALIAS-cim_hostname = name AS dest_name
FIELDALIAS-cim_family = model AS family
FIELDALIAS-cim_version = firmwareVersion AS version
FIELDALIAS-cim_id = id AS dvc
EVAL-status = if(state="ONLINE","online","offline")
EVAL-vendor = "Ubiquiti"
EVAL-vendor_product = "UniFi Network"
EVAL-category = "network_device"

