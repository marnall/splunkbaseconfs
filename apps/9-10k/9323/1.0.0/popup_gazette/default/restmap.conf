# Display endpoint — any authenticated user may fetch active notices for their dashboard.
# No capability gate: every dashboard viewer must be able to receive popups.
[script:gazette_display]
match = /popup_gazette/display
scripttype = python
# python.required wins on 10.2+ (Splunk picks the highest listed version that is
# installed); python.version is kept for older cores that do not read it.
python.required = 3.9, 3.13
python.version = python3
handler = gazette_handler.GazetteDisplayHandler
output_modes = json
passSystemAuth = true

# Admin/management endpoint — CRUD on notices. GET (listing) + POST (upsert/delete).
# gazette_edit is the floor; global/raw/target escalation is re-checked against gazette_admin inside the handler.
[script:gazette_notices]
match = /popup_gazette/notices
scripttype = python
# python.required wins on 10.2+ (Splunk picks the highest listed version that is
# installed); python.version is kept for older cores that do not read it.
python.required = 3.9, 3.13
python.version = python3
handler = gazette_handler.GazetteAdminHandler
output_modes = json
passSystemAuth = true
capability = gazette_edit
