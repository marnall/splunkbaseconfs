###
### Popup Gazette — custom capabilities
###
### gazette_admin : full CRUD, may create global notices and use Raw HTML mode,
###                 sees all notices in the popup_gazette management view.
### gazette_edit  : create/edit/delete notices scoped to the calling app,
###                 restricted to app/view targets and Markdown mode.
###
### Both are granted by default to the admin role (on-prem) and sc_admin (Splunk Cloud).
### Any other role must be granted them explicitly via Settings -> Roles.
###

[capability::gazette_admin]

[capability::gazette_edit]

[role_admin]
gazette_admin = enabled
gazette_edit  = enabled

[role_sc_admin]
gazette_admin = enabled
gazette_edit  = enabled
