#
# TA-Oracle-OCI — Technology Add-on for Oracle Cloud Infrastructure (HEC push + API key pull)
#
# This TA replaces the archived "Splunk Addon for OCI" (Splunkbase app 5222)
# and "Splunk Cloud Addon for OCI" (app 7021), which are not compatible with
# Splunk platform 9.3+/10 (their bundled OCI SDK binaries are compiled for
# Python 3.7). This TA is data-only — field extractions, sourcetype config,
# and CIM tagging for events pushed via HTTP Event Collector from an OCI
# Function, plus a native modular input for pulling directly from OCI
# Streaming via API key auth. It contains no compiled binaries or Python
# interpreter dependency, so it is not tied to Splunk's embedded Python
# version and should remain forward-compatible across future platform
# upgrades.
#
# Companion OCI-side component (deployed separately, in OCI Functions, not
# part of this Splunk app): oci-logs-to-splunk-hec function. See README.

[install]
is_configured = 0
state = enabled
build = 1

[ui]
is_visible = true
label = Oracle Cloud Infrastructure Add-on for Splunk

[launcher]
author = Helmi | Nexagate Sdn Bhd.
version = 1.0.0
description = Field extractions, sourcetypes, and CIM tagging for OCI logs pushed via Splunk HEC, plus a native modular input pulling directly from OCI Streaming via API key auth. Replacement for the archived Splunk Addon for OCI (Splunkbase app 5222) and Splunk Cloud Addon for OCI (app 7021), which are incompatible with Splunk 9.3+/10.

[id]
name = TA-Oracle-OCI

[package]
id = TA-Oracle-OCI
check_for_updates = true

[triggers]
reload.storage.passwords = simple
# eventtypes.conf and tags.conf are Splunk-native config files that
# Splunk already reloads automatically on change — a reload.<conf>
# trigger is only valid (and only needed) for custom, app-defined conf
# files, so none is declared for them here.
# props.conf: most settings affect the indexing/parsing pipeline and
# genuinely require a restart to take effect, so there's no reload
# trigger that safely avoids one.
