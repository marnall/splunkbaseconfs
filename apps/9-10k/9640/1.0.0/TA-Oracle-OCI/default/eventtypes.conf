#
# Basic event types to support CIM data model mapping. Adjust/extend
# per your actual field names once you confirm the JSON shape your
# OCI Function is forwarding (audit envelope vs. raw log record, etc.)
#
# Note: eventtypes.conf's own "tags" attribute is deprecated by Splunk
# (see tags.conf.spec) -- actual CIM tag assignment for these
# eventtypes lives in default/tags.conf instead, not here.
#

[oci_audit]
search = sourcetype=oci:audit

[oci_flowlogs]
search = sourcetype=oci:flowlogs

[oci_cloudguard_problem]
search = sourcetype=oci:cloudguard:problem

[oci_loadbalancer]
search = sourcetype=oci:loadbalancer

[oci_objectstorage]
search = sourcetype=oci:objectstorage
