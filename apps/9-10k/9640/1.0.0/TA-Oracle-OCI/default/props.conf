#
# Sourcetype definitions for OCI events pushed via HEC from the companion
# oci-logs-to-splunk-hec OCI Function, or pulled via bin/oci_stream.py.
# Events arrive as JSON, so this is mostly timestamping + line-breaking +
# category metadata; field extraction is handled automatically by HEC's
# JSON auto-kv / KV_MODE=json.
#

[oci:audit]
KV_MODE = json
TIME_PREFIX = "eventTime":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3QZ
MAX_TIMESTAMP_LOOKAHEAD = 30
SHOULD_LINEMERGE = false
disabled = false
category = Cloud Infrastructure
pulldown_type = true
description = Oracle Cloud Infrastructure Audit Logs (via HEC push)
EVAL-vendor = "Oracle"
EVAL-product = "Oracle Cloud Infrastructure"

