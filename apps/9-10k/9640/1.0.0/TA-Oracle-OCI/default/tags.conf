#
# Tag assignments. Pair with eventtypes.conf. CIM tag names verified
# directly against Splunk's current CIM 8.5 data model reference docs
# (help.splunk.com), not assumed from the data model's display name --
# notably, Network Traffic's actual required tags are "network" +
# "communicate" together, NOT "network_traffic" (that string is not a
# real CIM tag at all). Each stanza also carries "oracle_cloud_infrastructure"
# -- not a CIM tag, just this app's own custom grouping tag, so
# tag=oracle_cloud_infrastructure finds all OCI-sourced events
# regardless of which CIM model they map to. Extend to match whichever
# additional CIM data models your dashboards/correlation searches use
# (e.g. Malware, Authentication) — tell me which ones your Enterprise
# Security content depends on and I'll flesh these out with the
# required field aliases in transforms.conf as well.
#

[eventtype=oci_audit]
change = enabled
oracle_cloud_infrastructure = enabled

[eventtype=oci_flowlogs]
network = enabled
communicate = enabled
oracle_cloud_infrastructure = enabled

[eventtype=oci_cloudguard_problem]
alert = enabled
oracle_cloud_infrastructure = enabled

[eventtype=oci_loadbalancer]
network = enabled
communicate = enabled
oracle_cloud_infrastructure = enabled

[eventtype=oci_objectstorage]
change = enabled
oracle_cloud_infrastructure = enabled
