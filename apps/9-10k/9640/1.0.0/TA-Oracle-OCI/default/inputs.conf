#
# TA-Oracle-OCI — default/inputs.conf
#
# No HEC input stanza is shipped here. Splunk Cloud requires HTTP Event
# Collector tokens/inputs to be provisioned via ACS (Admin Config Service),
# not shipped inside an app package -- a [http://...] stanza in an app is
# rejected by Cloud vetting. On Splunk Enterprise, create the HEC token
# via Settings > Data Inputs > HTTP Event Collector, or ACS on Cloud.
# See README.md "Push (HEC)" section for the exact ACS commands.
#
# No [oci_stream://...] stanza is shipped here either (deliberately) --
# configure the pull-based input via Settings > Data Inputs > OCI Stream
# (API Key Pull) > New, or by hand in a per-environment inputs.conf
# managed outside this package (deployment server, ACS, etc.). See
# README/inputs.conf.spec for all fields.
#
# [oci_stream] (the modular input's scheme name, no "://<instance>" here)
# sets python.version for every instance of this input, required by
# Splunk 9.4+ / AppInspect for Splunk Cloud vetting. A bare [default]
# stanza is not permitted in app-shipped inputs.conf (it would set a
# global default outside this app's scope), so it's scoped to the
# input's own stanza instead.
#
# python.required = 3.13 declares compatibility with the Python version
# Splunk 10.x ships (Splunk moved 9.x's embedded interpreter from 3.9 to
# 3.13 starting with Splunk 10). This TA has no compiled/bundled Python
# code, so it genuinely runs under both — this just makes that explicit
# for AppInspect ahead of the enforcement deadline.
[oci_stream]
python.version = python3
python.required = 3.13
