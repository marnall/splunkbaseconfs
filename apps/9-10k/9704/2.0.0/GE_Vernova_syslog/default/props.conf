[ge_vernova_syslog]
TRANSFORMS-host = ge_vernova_host
REPORT-ge_port = ge_vernova_host_port
REPORT-ge_vernova_data = ge_vernova_header, ge_vernova_sdid
REPORT-ge_vernova_msg = ge_vernova_msg

SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=<\d+>)
# Calculate the value of severity_id from prival and then look up the corresponding description and put it in severity_description
EVAL-severity_id	=	prival-((floor(prival/8))*8)
LOOKUP-severity_description = severity_lookup severity AS severity_id OUTPUT severity_description AS severity

# Do the same for facility (facility_id and facility_description)
EVAL-facility_id	=	floor(prival/8)
LOOKUP-facility_description = facility_lookup facility AS facility_id OUTPUT facility_description AS facility

# Other fields are directly extracted so we create aliases to fileds in the 'Alerts' and 'Authentication' data model 
FIELDALIAS-ge_vernova_id		=	ID as id
FIELDALIAS-ge_vernova_body		=	Text as body
FIELDALIAS-ge_vernova_src 		= hostname as src
FIELDALIAS-ge_vernova_app		=	appname as app
FIELDALIAS-ge_vernova_user		=	UsrID as user
