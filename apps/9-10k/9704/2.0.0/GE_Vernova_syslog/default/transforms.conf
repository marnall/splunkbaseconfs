[ge_vernova_host]
DEST_KEY = MetaData:Host
REGEX = \<\d+\>\d+\s+\S+\s+([^:\s]+)(?::(\d+))?
FORMAT = host::$1

[ge_vernova_host_port]
REGEX = ([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)(?::([0-9]+))?
FORMAT = hostname::$1 port::$2
WRITE_META = false
MV_ADD = false

[ge_vernova_sdata]
REGEX = \s{1}\[(\S+)\s+([^[\]]*+)\]
FORMAT = sdid::$1 sdata::$2
MV_ADD = true

[ge_vernova_kv_pairs]
SOURCE_KEY = sdata
#SOURCE_KEY = _raw
REGEX = \s+(\S+)=\"([^\"]+)\"
FORMAT = $1::$2
MV_ADD = true

[ge_vernova_sdid]
REGEX = \[(\S+)\s+
FORMAT = sdid::$1
MV_ADD = true

[ge_vernova_header]
REGEX = <(\d+)>\d{1}\s{1}\S+\s{1}\S+\s{1}(\S+)\s{1}(\S+)\s{1}(\S+)
FORMAT = prival::$1 appname::$2 procid::$3 msgid::$4
MV_ADD = true

[ge_vernova_msg]
REGEX = \]\s+(.*)$
FORMAT = msg::$1

[facility_lookup]
default_match = unknown
filename = lookup_facility.csv

[severity_lookup]
default_match = unknown
filename = lookup_severity.csv