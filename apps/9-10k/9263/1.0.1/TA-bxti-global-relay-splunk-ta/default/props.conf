[globalrelay:eventlog]
SHOULD_LINEMERGE = 0
category = Splunk App Add-on Builder
pulldown_type = 1
KV_MODE = json
TRUNCATE = 0
# Common CIM fields. Original Global Relay JSON fields remain unchanged.
EVAL-user = coalesce('ActorEntity.Email', 'ActorEntity.EntityName')
EVAL-user_name = 'ActorEntity.EntityName'
EVAL-src_user = coalesce('ActorEntity.Email', 'ActorEntity.EntityName')
EVAL-src = 'ActorEntity.IpAddress'
EVAL-app = "Global Relay"
EVAL-vendor_product = "Global Relay Event Log"
EVAL-vendor_account = 'ScopedCompanyName'
EVAL-dest = if(isnull('ScopedArchiveName') OR 'ScopedArchiveName'="_null_", 'ScopedCompanyName', 'ScopedArchiveName')
# Model-specific values are populated only for recognized EventType values.
EVAL-action = case(EventType="UserLoggedIn", "success", EventType="UserLoginFailed", "failure", EventType="UserLoggedOut", "success", EventType="UserViewedOtherMessage", "read", EventType="UserSearched", "search", EventType="ArchiveAccessed", "read", match(EventType, "(Created|Updated|Deleted|Assigned|Unassigned|Added|Removed|Granted|Revoked|Enabled|Disabled|Deactivated|Released)$"), "modified", true(), null())
EVAL-result = case(EventType="UserLoginFailed", "failure", EventType="UserLoggedIn" OR EventType="UserLoggedOut" OR match(EventType, "(Created|Updated|Deleted|Assigned|Unassigned|Added|Removed|Granted|Revoked|Enabled|Disabled|Deactivated|Released)$"), "success", true(), null())
EVAL-command = if(match(EventType, "(Created|Updated|Deleted|Assigned|Unassigned|Added|Removed|Granted|Revoked|Enabled|Disabled|Deactivated|Released)$"), EventType, null())
EVAL-change_type = if(match(EventType, "(Created|Updated|Deleted|Assigned|Unassigned|Added|Removed|Granted|Revoked|Enabled|Disabled|Deactivated|Released)$"), "configuration", null())
EVAL-status = if(match(EventType, "(Created|Updated|Deleted|Assigned|Unassigned|Added|Removed|Granted|Revoked|Enabled|Disabled|Deactivated|Released)$"), "success", null())
EVAL-object = case(EventType="UserViewedOtherMessage", 'AffectedEntity1.Subject', EventType="UserSearched", 'EventDetails1.SearchCriteria', EventType="ArchiveAccessed", 'ScopedArchiveName', isnotnull('AffectedEntity1.EntityName'), 'AffectedEntity1.EntityName', true(), null())
EVAL-object_id = coalesce('AffectedEntity1.SerialId', 'AffectedEntity1.EntityId', 'ScopedArchiveId', 'EventDetails1.CriteriaRecordId')
EVAL-object_category = case(EventType="UserViewedOtherMessage", "message", EventType="UserSearched", "search", EventType="ArchiveAccessed", "archive", isnotnull('AffectedEntity1.EntityType'), 'AffectedEntity1.EntityType', true(), null())
EVAL-object_attrs = case(EventType="UserSearched", 'EventDetails1.SearchCriteria', EventType="UserViewedOtherMessage", 'AffectedEntity1.Type', true(), null())

[source::...ta-bxti-global-relay-splunk-ta*.log*]
sourcetype = tabxtiglobalrelaysplunkta:log

