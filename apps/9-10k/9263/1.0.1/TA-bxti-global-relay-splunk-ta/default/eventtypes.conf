[globalrelay_authentication]
search = `globalrelay_index` (EventType=UserLoggedIn OR EventType=UserLoginFailed OR EventType=UserLoggedOut)
description = Global Relay authentication activity

[globalrelay_data_access]
search = `globalrelay_index` (EventType=ArchiveAccessed OR EventType=UserSearched OR EventType=UserViewedOtherMessage)
description = Global Relay archive, search, and message access activity

[globalrelay_change]
search = `globalrelay_index` (EventType=AccessToObjectGranted OR EventType=AccessToObjectRevoked OR EventType=AliasCreated OR EventType=AliasDeactivated OR EventType=ArchiveCreated OR EventType=ArchiveUpdated OR EventType=DirectorySyncUpdated OR EventType=ExternalDestinationCreated OR EventType=ExternalDestinationUpdated OR EventType=IpWhitelistCreated OR EventType=IpWhitelistDeleted OR EventType=IpWhitelistUpdated OR EventType=LegalHoldCreated OR EventType=LegalHoldReleased OR EventType=LegalHoldUpdated OR EventType=LoginIdCreated OR EventType=LoginIdDeleted OR EventType=LoginIdUpdated OR EventType=MemberAddedToGroup OR EventType=MemberRemovedFromGroup OR EventType=MessageFeedCreated OR EventType=MessageFeedUpdated OR EventType=ObjectAddedToLegalHold OR EventType=ObjectRemovedFromLegalHold OR EventType=RoleAssignedToSubject OR EventType=RoleCreated OR EventType=RoleDeleted OR EventType=RoleUnassignedFromSubject OR EventType=RoleUpdated OR EventType=RoutingPolicyCreated OR EventType=RoutingPolicyDeleted OR EventType=RoutingPolicyUpdated OR EventType=RoutingRuleSetCreated OR EventType=RoutingRuleSetDeleted OR EventType=RoutingRuleSetUpdated OR EventType=SystemTagCreated OR EventType=SystemTagUpdated OR EventType=UserAssignedToSharedMailbox OR EventType=UserCreated OR EventType=UserDisabled OR EventType=UserEnabled OR EventType=UserPasswordUpdated OR EventType=UserUnassignedFromSharedMailbox OR EventType=UserUpdated)
description = Global Relay administrative and configuration changes
