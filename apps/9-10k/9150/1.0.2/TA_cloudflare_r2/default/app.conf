[launcher]
version = 1.0.2
description = Ingests Cloudflare Logpush log files from Cloudflare R2 via the S3-compatible API (SigV4, path-style, no AWS STS dependency). Pure standard-library R2 client; credentials stored in Splunk's encrypted credential store. Supports all Cloudflare Logpush datasets.
author = Cloudflare, Inc.

[id]
version = 1.0.2
name = TA_cloudflare_r2

[install]
build = 1784238192
is_configured = false
state = enabled

[package]
id = TA_cloudflare_r2
check_for_updates = true

[ui]
label = Cloudflare R2 Log Ingestion
supported_themes = light, dark
is_visible = true

[triggers]
reload.ta_cloudflare_r2_settings = simple
reload.ta_cloudflare_r2_account = simple
