[ptnad_attack]
search = (sourcetype="pt:nad:syslog" OR sourcetype="pt:nad:syslog2") ('alert.s_id'=* OR 'alert{}.s_id'=* OR 'alerts{}.s_id'=* OR 'alerts{}.signature_id'=* OR 'rules{}.id'=* OR 'rules{}.rule_id'=*)
description = PT NAD single-rule and combined network attack events mapped to the CIM Intrusion Detection data model.

[ptnad_incident]
search = (sourcetype="pt:nad:syslog" OR sourcetype="pt:nad:syslog2") combined_event=1
description = PT NAD combined incident events containing multiple rule identifiers or an incident identifier.

[ptnad_activity]
search = (sourcetype="pt:nad:syslog" OR sourcetype="pt:nad:syslog2") identity_key=*
description = PT NAD activity detections mapped to the CIM Alerts data model.

[ptnad_ioc]
search = (sourcetype="pt:nad:syslog" OR sourcetype="pt:nad:syslog2") 'rpt{}.where'=*
description = PT NAD indicators of compromise mapped to the CIM Alerts data model.

[ptnad_audit]
search = (sourcetype="pt:nad:syslog" OR sourcetype="pt:nad:syslog2") event=*
description = PT NAD audit events.

[ptnad_login]
search = (sourcetype="pt:nad:syslog" OR sourcetype="pt:nad:syslog2") event="login"
description = PT NAD login audit events mapped to the CIM Authentication data model.

[ptnad_logout]
search = (sourcetype="pt:nad:syslog" OR sourcetype="pt:nad:syslog2") event="logout"
description = PT NAD logout audit events.

[ptnad_change]
search = (sourcetype="pt:nad:syslog" OR sourcetype="pt:nad:syslog2") event IN ("create","created","delete","deleted","update","updated","modify","modified","edit","edited","start","started","stop","stopped","enable","enabled","disable","disabled")
description = PT NAD administrative changes mapped to the CIM Change data model.

[ptnad_account_change]
search = (sourcetype="pt:nad:syslog" OR sourcetype="pt:nad:syslog2") object_type="user" event IN ("create","created","delete","deleted","update","updated","modify","modified","edit","edited","enable","enabled","disable","disabled")
description = PT NAD account management changes mapped to the CIM Change Account Management dataset.
