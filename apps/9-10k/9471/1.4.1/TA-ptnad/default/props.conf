# Canonical sourcetype for new PT NAD inputs.
[pt:nad:syslog]
CHARSET = UTF-8
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 70000
NO_BINARY_CHECK = true
TIME_PREFIX = \"(?:created|ts_start)\"\s*:\s*\"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC
SEDCMD-ptnad_remove_syslog_header = s/^.*?syslog_notifier\.[^:]+:\s*//
KV_MODE = json
EVAL-nad_event_type = case(mvcount(mvdedup(mvappend('alert{}.s_id','alerts{}.s_id','alerts{}.signature_id','rules{}.id','rules{}.rule_id')))>1 OR isnotnull(incident_id) OR lower(type)=="incident", "incident", isnotnull('alert.s_id') OR isnotnull('alert{}.s_id') OR isnotnull('alerts{}.s_id') OR isnotnull('alerts{}.signature_id') OR isnotnull('rules{}.id') OR isnotnull('rules{}.rule_id'), "alert", isnotnull(identity_key), "detection", isnotnull('rpt{}.where'), "reputation", isnotnull(event), "audit", true(), "unknown")
EVAL-combined_event = if(mvcount(mvdedup(mvappend('alert{}.s_id','alerts{}.s_id','alerts{}.signature_id','rules{}.id','rules{}.rule_id')))>1 OR isnotnull(incident_id) OR lower(type)=="incident", 1, 0)
EVAL-related_rule_id = mvdedup(mvappend('alert.s_id','alert{}.s_id','alerts{}.s_id','alerts{}.signature_id','rules{}.id','rules{}.rule_id'))
EVAL-related_rule_name = mvdedup(mvappend('alert.s_msg','alert{}.s_msg','alerts{}.s_msg','alerts{}.signature','rules{}.name','rules{}.rule_name'))
EVAL-rule_count = mvcount(mvdedup(mvappend('alert.s_id','alert{}.s_id','alerts{}.s_id','alerts{}.signature_id','rules{}.id','rules{}.rule_id')))
EVAL-nad_correlation_id = coalesce(incident_id,correlation_id,flow_id,identity_key,tostring(id))
EVAL-severity = case(isnotnull(criticality),lower(criticality),mvfind(mvappend('alert.s_pr','alert{}.s_pr','alerts{}.s_pr','rules{}.priority'),"^1$")>=0,"high",mvfind(mvappend('alert.s_pr','alert{}.s_pr','alerts{}.s_pr','rules{}.priority'),"^2$")>=0,"medium",mvfind(mvappend('alert.s_pr','alert{}.s_pr','alerts{}.s_pr','rules{}.priority'),"^3$")>=0,"low",true(),"informational")
EVAL-severity_id = coalesce('alert.s_pr','alert{}.s_pr','alerts{}.s_pr','rules{}.priority')
EVAL-vendor_severity = coalesce(criticality,tostring('alert.s_pr'),'alert{}.s_pr','alerts{}.s_pr','rules{}.priority')
EVAL-src_ip = coalesce('src.ip','details.ip')
EVAL-src_port = 'src.port'
EVAL-src = coalesce('src.ip','src.dns','details.ip')
EVAL-src_host = 'src.dns'
EVAL-src_mac = lower(replace('src.mac',"-",":"))
EVAL-src_country = 'src.geo.country'
EVAL-src_city = 'src.geo.city'
EVAL-src_asn = 'src.geo.asn'
EVAL-dest_ip = 'dst.ip'
EVAL-dest_port = 'dst.port'
EVAL-dest = coalesce('dst.ip','dst.dns',hostname,host)
EVAL-dest_host = 'dst.dns'
EVAL-dest_mac = lower(replace('dst.mac',"-",":"))
EVAL-dest_country = 'dst.geo.country'
EVAL-dest_city = 'dst.geo.city'
EVAL-dest_asn = 'dst.geo.asn'
EVAL-dvc = coalesce(hostname,stag,host)
EVAL-dvc_name = coalesce(hostname,stag)
EVAL-transport = lower(proto)
EVAL-protocol = lower(coalesce(app_proto,proto))
EVAL-app = case(isnotnull(event),"PT NAD",isnotnull(app_proto),lower(app_proto),true(),"PT NAD")
EVAL-action = case(event=="login",case(lower(result)=="success","success",lower(result)=="failure","failure",lower(result)=="pending","pending",true(),"error"),event=="logout","logoff",match(lower(event),"^(create|created)$"),"created",match(lower(event),"^(delete|deleted)$"),"deleted",match(lower(event),"^(update|updated)$"),"updated",match(lower(event),"^(modify|modified|edit|edited)$"),"modified",match(lower(event),"^(start|started|enable|enabled)$"),"started",match(lower(event),"^(stop|stopped|disable|disabled)$"),"stopped",isnotnull('alert.s_id') OR isnotnull('alert{}.s_id') OR isnotnull('alerts{}.s_id') OR isnotnull('alerts{}.signature_id') OR isnotnull('rules{}.id') OR isnotnull('rules{}.rule_id'),"allowed",true(),"unknown")
EVAL-category = coalesce('alert.s_cls','alert{}.s_cls','alerts{}.s_cls','rules{}.category','rpt{}.cat','type.name')
EVAL-ids_type = if(isnotnull('alert.s_id') OR isnotnull('alert{}.s_id') OR isnotnull('alerts{}.s_id') OR isnotnull('alerts{}.signature_id') OR isnotnull('rules{}.id') OR isnotnull('rules{}.rule_id'),"network",null())
EVAL-signature = coalesce('alert.s_msg','alert{}.s_msg','alerts{}.s_msg','alerts{}.signature','rules{}.name','rules{}.rule_name',title,'type.name','rpt{}.cat','rpt{}.type',event)
EVAL-signature_id = coalesce('alert.s_id','alert{}.s_id','alerts{}.s_id','alerts{}.signature_id','rules{}.id','rules{}.rule_id',identity_key,'rpt{}.id',event)
EVAL-description = coalesce('type.description','type.text','alert.s_msg','alert{}.s_msg','alerts{}.s_msg','alerts{}.description','rules{}.description',title,event)
EVAL-type = case(mvcount(mvdedup(mvappend('alert{}.s_id','alerts{}.s_id','alerts{}.signature_id','rules{}.id','rules{}.rule_id')))>1 OR isnotnull(incident_id) OR lower(type)=="incident","alert",isnotnull('alert.s_id') OR isnotnull('alert{}.s_id') OR isnotnull('alerts{}.s_id') OR isnotnull('alerts{}.signature_id') OR isnotnull('rules{}.id') OR isnotnull('rules{}.rule_id'),"alert",isnotnull(identity_key),"event",isnotnull('rpt{}.where'),"alert",isnotnull(event),"event",true(),"unknown")
EVAL-user = case(event=="login" OR event=="logout",username,lower(object_type)=="user",object_name,true(),username)
EVAL-user_name = case(event=="login" OR event=="logout",username,lower(object_type)=="user",object_name,true(),username)
EVAL-src_user = if(lower(object_type)=="user" AND event!="login" AND event!="logout",username,null())
EVAL-src_user_name = if(lower(object_type)=="user" AND event!="login" AND event!="logout",username,null())
EVAL-event_name = event
EVAL-object = object_name
EVAL-object_category = object_type
EVAL-change_type = if(isnotnull(event) AND event!="login" AND event!="logout",coalesce(object_type,"PT NAD configuration"),null())
EVAL-status = case(lower(result)=="success","success",isnotnull(result),"failure",true(),null())
EVAL-file_hash = 'rpt{}.md5'
EVAL-cve = mvdedup(mvappend('alert.refs.cve{}','alert.s_refs.cve{}','alert{}.refs.cve{}','alerts{}.refs.cve{}','rules{}.cve{}'))
EVAL-mitre_attack_id = mvdedup(mvappend('alert.att_ck{}','alert{}.att_ck{}','alerts{}.att_ck{}','rules{}.att_ck{}'))
EVAL-url = flow_url
EVAL-vendor = "Positive Technologies"
EVAL-product = "PT NAD"
EVAL-vendor_product = "Positive Technologies PT NAD"

