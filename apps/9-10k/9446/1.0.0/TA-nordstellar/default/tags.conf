# CIM data-model tags. These are the Splunk-standard tags the CIM data models
# constrain on. No custom NordStellar tags.

# CIM Alerts data model (root constraint: tag=alert).
[eventtype=nordstellar_security_event]
alert = enabled

# CIM Vulnerabilities data model (root constraint: tag=vulnerability).
[eventtype=nordstellar_attack_surface_vulnerability]
vulnerability = enabled

# CIM Malware data model / Malware_Attacks (root constraint: tag=malware attack).
[eventtype=nordstellar_malware_infection]
malware = enabled
attack = enabled
