# Custom persistent REST endpoint backing the setup page.
# Reachable from Splunk Web via the splunkd proxy as: nordstellar/setup
[script:nordstellar_setup]
match                 = /nordstellar/setup
script                = nordstellar_setup.py
scripttype            = persist
handler               = nordstellar_setup.SetupHandler
# Splunk Cloud vetting requires the interpreter to be pinned explicitly.
# python.version is deprecated from Splunk Enterprise 10.2 onwards in favour of
# python.required, so both are declared: older cores read the former and ignore
# the latter. The handler is stdlib-only, so 3.13 is safe to declare.
python.version        = python3
python.required       = 3.13
requireAuthentication = true
output_modes          = json
passPayload           = true
passSession           = true
passHttpHeaders       = true
# No capability.* gate here: splunkd still enforces permissions on the
# management-API calls the handler makes, so a non-admin user simply gets a
# permission error back. Generating a HEC token requires the edit_httpinputs
# capability (admin role has it).