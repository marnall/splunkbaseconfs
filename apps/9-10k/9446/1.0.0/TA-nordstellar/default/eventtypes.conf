# All NordStellar events -> CIM Alerts.
[nordstellar_security_event]
search = sourcetype="nordstellar:security:event"

# Attack Surface findings -> CIM Vulnerabilities.
[nordstellar_attack_surface_vulnerability]
search = sourcetype="nordstellar:security:event" type=ATTACK_SURFACE_*

# Info-stealer infections -> CIM Malware.
[nordstellar_malware_infection]
search = sourcetype="nordstellar:security:event" type=MALWARE_INFECTION
