[nordstellar:security:event]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
TRUNCATE = 0
category = Structured
description = NordStellar security events

# _time is the ingest time, deliberately NOT the event's own detected_at /
# date_added. NordStellar delivers historical findings whose dates can be months
# or years old, and Splunk uses _time to choose the bucket an event is written
# into. Backdating would (a) hide freshly delivered findings from recent-window
# searches and scheduled alerts, and (b) risk deletion: a bucket is frozen once
# its NEWEST event is older than frozenTimePeriodInSecs (90 days by default on
# Splunk Cloud), and events older than quarantinePastSecs (900 days) are
# segregated into an old-events-only quarantine bucket that freezes at once.
# The finding's own date is preserved as DetectedAt / DetectionTime below.
DATETIME_CONFIG = CURRENT

# NOTE: every EVAL- setting in a stanza is evaluated in parallel, so an EVAL-
# expression cannot reference a field produced by another EVAL-. Shared logic is
# therefore inlined at each use site rather than factored out.
#
# NOTE: an EVAL- always overrides an extracted field of the same name, even when
# it evaluates to null. Before naming a new EVAL-, check the field name does not
# occur in the NordStellar payload, or the event's own value is destroyed.

# --- Promoted NordStellar fields ---
FIELDALIAS-ns-event_id = id AS EventId
FIELDALIAS-ns-event_type = type AS EventType
FIELDALIAS-ns-module = module AS Module
FIELDALIAS-ns-risk_level = risk_level AS RiskLevel
EVAL-Tags = 'tags{}'
# AssetType / AssetValue selected per event type:
# domain permutation -> DOMAIN / original_domain; leaked data -> asset.type/value;
# attack surface -> source_type / asset_value. Dark web posts carry no asset at
# all, so they fall back to `query` - the monitored term that matched, which is
# the only thing tying the post back to something the customer owns.
EVAL-AssetType = case(type=="DOMAIN_PERMUTATION", "DOMAIN", isnotnull('asset.type'), 'asset.type', isnotnull(source_type), source_type, true(), "")
EVAL-AssetValue = case(type=="DOMAIN_PERMUTATION", original_domain, isnotnull('asset.value'), 'asset.value', isnotnull(asset_value), asset_value, isnotnull(query), query, true(), "")
# AssetValue holds the customer's OWN domain for a squatting finding, so the
# suspicious permutation needs a field of its own - it is the indicator a SOC
# blocks or pivots on.
EVAL-SquattedDomain = if(type=="DOMAIN_PERMUTATION", domain, null())
# When NordStellar found the finding, kept out of _time (see above). Attack-
# surface events carry detected_at; all others date_added. DetectedAt is the raw
# ISO-8601 string, DetectionTime its epoch form for time math and sorting.
# NordStellar always emits UTC, so a fixed +0000 offset is appended to the
# seconds part rather than relying on strptime to read the trailing "Z". Taking
# only the first 19 characters also tolerates a missing fractional part.
EVAL-DetectedAt = coalesce(detected_at, date_added)
EVAL-DetectionTime = strptime(substr(coalesce(detected_at, date_added), 1, 19)."+0000", "%Y-%m-%dT%H:%M:%S%z")
# Exposed software version on network service findings. The event's own `product`
# field already names the software, so it is left untouched.
FIELDALIAS-ns-service_version = version AS ServiceVersion
# Where the infected endpoint was located (MALWARE_INFECTION).
EVAL-DeviceCountry = 'location.country'
EVAL-DeviceCity = 'location.location_name'
EVAL-DevicePostalCode = 'location.zip_code'
EVAL-DeviceTimeZone = 'location.time_zone'

# --- CIM: vendor identity ---------------------------------------------------
# `product` is deliberately NOT set here: network service findings carry their
# own `product` naming the exposed software (e.g. OpenSSH), which an EVAL- of the
# same name would destroy. vendor_product already identifies the reporting tool.
EVAL-vendor = "Nord Security"
EVAL-vendor_product = "NordStellar"
# The system that discovered the finding (CIM Vulnerabilities).
EVAL-dvc = "NordStellar"

# --- CIM: common (Alerts data model) ----------------------------------------
FIELDALIAS-ns-signature_id = id AS signature_id
# risk_level -> CIM severity (string) + severity_id (numeric, 1-100 scale).
EVAL-severity = case(risk_level=="CRITICAL","critical", risk_level=="HIGH","high", risk_level=="MEDIUM","medium", risk_level=="LOW","low", risk_level=="INFORMATIONAL","informational", true(),"unknown")
EVAL-severity_id = case(risk_level=="CRITICAL",90, risk_level=="HIGH",70, risk_level=="MEDIUM",50, risk_level=="LOW",30, risk_level=="INFORMATIONAL",10, true(),1)
# Human-readable finding name (CIM signature; Alerts subject/body) chosen from
# the per-type title fields. The chain ends at `type` so it can never be null:
# data breach, combo list, domain permutation and combo-list consumer credential
# events carry no title field at all. That last fallback is deliberately a
# stable per-type value rather than a per-event one, so Enterprise Security can
# still group notables by signature.
EVAL-signature = coalesce(title, forum_title, channel_title, ransomware_title, marketplace_title, stealer_name, malware_stealer_name, dark_web_monitoring_rule_name, type)
EVAL-subject = coalesce(title, forum_title, channel_title, ransomware_title, marketplace_title, stealer_name, malware_stealer_name, dark_web_monitoring_rule_name, type)
EVAL-body = coalesce(description, content, impact_description)

# --- CIM: Vulnerabilities (attack surface) ----------------------------------
# Maps vulnerability id / score / service / protocol onto the CIM fields.
FIELDALIAS-ns-cve = cve_id AS cve
FIELDALIAS-ns-category = vulnerability_type AS category
FIELDALIAS-ns-service = network_service_name AS service
FIELDALIAS-ns-dest_port = port AS dest_port
EVAL-cvss = cvss3_score
# CIM prescribes lowercase transport values (tcp, udp).
EVAL-transport = lower(protocol)
# CWE identifiers as the CIM cross-reference field.
EVAL-xref = 'cwe_ids{}'

# --- CIM: asset / host (Malware + Vulnerabilities) --------------------------
# Malware: the infected endpoint IP. Everything else: the same asset AssetValue
# resolves to, inlined because one EVAL- cannot read another (see note above).
EVAL-dest = case(type=="MALWARE_INFECTION", 'device_info.ip', type=="DOMAIN_PERMUTATION", original_domain, isnotnull('asset.value'), 'asset.value', isnotnull(asset_value), asset_value, isnotnull(query), query, true(), "")
EVAL-dest_nt_host = 'device_info.system_name'
EVAL-os = 'device_info.os'
EVAL-file_name = mvindex('files{}.path', 0)

# --- CIM: identity (Malware / Authentication) -------------------------------
EVAL-user = case(type=="MALWARE_INFECTION", 'device_info.user_name', type=="CONSUMER_CREDENTIAL", coalesce(username, consumer), true(), coalesce(consumer, username, 'device_info.user_name'))
EVAL-user_email = lower(coalesce(email, if('asset.type'=="EMAIL", 'asset.value', null())))

# --- CIM: url ---------------------------------------------------------------
# `url` is an extracted field on most event types; keeping it inside the coalesce
# preserves the event's own value instead of overriding it.
EVAL-url = coalesce(evidence_url, url, site_subdomain_url)
