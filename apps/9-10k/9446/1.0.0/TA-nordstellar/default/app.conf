[install]
# 0 = Splunk shows the setup view (setup_view below) on first launch.
# The setup handler best-effort flips this to 1 after a token is generated.
is_configured = 0

[ui]
is_visible = 1
label = NordStellar
# Name of the dashboard view under default/data/ui/views used as the setup page.
setup_view = nordstellar_setup

[launcher]
author = Nord Security
description = Ingest and parse NordStellar security events forwarded to Splunk. Includes a setup page that generates the API URL and API key for your NordStellar integration, plus CIM field mappings.
version = 1.0.0

# Required for app installation; `name` must match the app folder / package id.
# Keep `version` in sync with [launcher] above.
[id]
name = TA-nordstellar
version = 1.0.0

[package]
id = TA-nordstellar
# Must stay enabled for Splunkbase-hosted apps - installed instances use it to
# discover new releases; Splunkbase package validation rejects a disabled value.
check_for_updates = true