#
# Field extraction for the GraphLens observed-relationship sourcetype.
# This does not create an index; it only tells Splunk how to parse events
# once an administrator has created an index and pointed a data input at
# it (see scripts/indexes.conf.example and INSTALL.md).
#

[graphlens:relationship]
SHOULD_LINEMERGE = false
INDEXED_EXTRACTIONS = csv
KV_MODE = none
TIMESTAMP_FIELDS = last_seen
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
disabled = false
