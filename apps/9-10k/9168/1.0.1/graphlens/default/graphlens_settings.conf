#
# GraphLens administrator configuration defaults.
#
# These are safe, environment-neutral defaults. Administrators change
# behaviour by creating local/graphlens_settings.conf (directly, or through
# the in-app Configuration page, which writes there via the standard
# Splunk properties/configs REST endpoint under the graphlens_manage_config
# capability). Never edit this default file for a specific deployment.
#

[limits]
max_visible_nodes = 1000
max_visible_edges = 2500
max_expansion_neighbours = 100
max_expansion_depth = 3
max_path_depth = 5
max_search_result_rows = 500
search_dispatch_max_time_seconds = 30

[search]
relationship_index = graphlens_relationships
evidence_default_index = *
default_earliest = -24h
default_latest = now

[features]
enable_export = true
enable_annotations = true
enable_saved_views = true
enable_clustering = true
enable_path_finder = true

[allowlist]
# Comma-separated. Empty means "governed entirely by the
# graphlens_node_types / graphlens_relationship_types KV Store collections".
allowed_node_types =
allowed_relationship_types =
allowed_layouts = cose,concentric,breadthfirst,circle,grid
allowed_export_formats = json,csv,png
