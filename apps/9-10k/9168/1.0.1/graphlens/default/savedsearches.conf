#
# GraphLens controlled search templates.
#
# The browser client never sends free-form SPL. It dispatches these saved
# searches by name and supplies only allowlisted, validated token values as
# args.<token> on the REST dispatch call (see src/.../services/searchService.js
# and utilities/splSafety.js). Every search is disabled for scheduling (no
# cron) because these are on-demand, user-triggered searches only.
#
# Time bounding is deliberately done ONLY through dispatch.earliest_time /
# dispatch.latest_time (standard REST dispatch parameters, parsed by
# Splunk's own dispatch layer) rather than through an $earliest$/$latest$
# token substituted into the SPL text - this removes an entire class of
# token-substitution injection surface for a value that is otherwise easy
# to get wrong. searchService.js always sends dispatch.earliest_time and
# dispatch.latest_time on every dispatch call, overriding the conservative
# defaults below.
#

[graphlens_initial_entity_search]
description = Locate candidate entities matching a validated search term for the initial graph node. Invoked by EntitySearch.
search = `graphlens_relationship_index`\
| eval node_id=source_id, node_type=source_type, node_label=source_label | append [ search `graphlens_relationship_index` | eval node_id=target_id, node_type=target_type, node_label=target_label ]\
| search (node_id="$safe_term$*" OR node_label="*$safe_term$*")\
| stats sum(event_count) as event_count min(first_seen) as first_seen max(last_seen) as last_seen max(risk_score) as risk_score by node_id node_type node_label source_index source_sourcetype\
| sort 0 - risk_score - event_count\
| head $safe_result_limit$
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.max_time = 30
dispatch.ttl = 300
enableSched = 0
is_visible = false

[graphlens_expand_node]
description = One-hop expansion of a single validated node identifier into its directly related edges. Invoked when a user expands a node.
search = `graphlens_relationship_index` (source_id="$safe_node_id$" OR target_id="$safe_node_id$")\
| `graphlens_edge_fields`\
| stats sum(event_count) as event_count min(first_seen) as first_seen max(last_seen) as last_seen max(risk_score) as risk_score by edge_id source_id source_type source_label target_id target_type target_label relationship_type relationship_label source_index source_sourcetype evidence_reference\
| sort 0 - risk_score - event_count\
| head $safe_expansion_limit$
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.max_time = 30
dispatch.ttl = 300
enableSched = 0
is_visible = false

[graphlens_node_details]
description = Retrieve aggregated properties for a single validated node identifier, merged with curated KV Store metadata.
search = `graphlens_relationship_index` (source_id="$safe_node_id$" OR target_id="$safe_node_id$")\
| eval node_id=if(source_id="$safe_node_id$", source_id, target_id), node_type=if(source_id="$safe_node_id$", source_type, target_type), node_label=if(source_id="$safe_node_id$", source_label, target_label)\
| stats sum(event_count) as event_count min(first_seen) as first_seen max(last_seen) as last_seen max(risk_score) as risk_score dc(edge_id) as relationship_count values(source_index) as source_indexes values(source_sourcetype) as source_sourcetypes by node_id node_type node_label\
| lookup graphlens_nodes node_id OUTPUT description as curated_description node_group as curated_node_group metadata as curated_metadata\
| head 1
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.max_time = 30
dispatch.ttl = 300
enableSched = 0
is_visible = false

[graphlens_edge_details]
description = Retrieve aggregated properties for a single validated edge identifier.
search = `graphlens_relationship_index` edge_id="$safe_edge_id$"\
| `graphlens_edge_fields`\
| stats sum(event_count) as event_count min(first_seen) as first_seen max(last_seen) as last_seen max(risk_score) as risk_score by edge_id source_id source_type source_label target_id target_type target_label relationship_type relationship_label source_index source_sourcetype evidence_reference\
| head 1
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.max_time = 30
dispatch.ttl = 300
enableSched = 0
is_visible = false

[graphlens_evidence_search]
description = Retrieve a bounded set of supporting raw events for a node or edge, driven only by an approved evidence_reference/index/sourcetype/field tuple built server-side in evidenceQueryBuilder.js, never by free-form user SPL.
search = index=$safe_evidence_index$ sourcetype=$safe_evidence_sourcetype$ $safe_evidence_key_field$=$safe_evidence_key_value$\
| head $safe_evidence_limit$\
| sort - _time
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.max_time = 30
dispatch.ttl = 120
enableSched = 0
is_visible = false

[graphlens_graph_statistics]
description = Aggregate counts used for the graph-limit banner and health page (total distinct nodes/edges/types observed in range, not the full dataset).
search = `graphlens_relationship_index`\
| stats dc(edge_id) as edge_count dc(source_id) as source_node_count dc(target_id) as target_node_count dc(relationship_type) as relationship_type_count sum(event_count) as total_event_count
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.max_time = 30
dispatch.ttl = 300
enableSched = 0
is_visible = false

[graphlens_cluster_expand]
description = Optional expansion of a collapsed cluster/group node into its bounded member set, grouped by an allowlisted field (node_type, source_index, etc).
search = `graphlens_relationship_index` $safe_cluster_field$="$safe_cluster_value$"\
| `graphlens_edge_fields`\
| stats sum(event_count) as event_count max(risk_score) as risk_score by edge_id source_id source_type source_label target_id target_type target_label relationship_type relationship_label\
| sort 0 - risk_score - event_count\
| head $safe_cluster_limit$
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.max_time = 30
dispatch.ttl = 300
enableSched = 0
is_visible = false

[graphlens_health]
description = Application health metrics for the GraphLens health dashboard, sourced from the app's own KV Store audit log collection (graphlens_audit_log). No indexed data or internal Splunk logs are required.
search = | inputlookup graphlens_audit_log\
| where created_time > relative_time(now(), "-7d")\
| eval outcome=coalesce(outcome, "unknown")\
| chart count over action by outcome
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.max_time = 30
dispatch.ttl = 300
enableSched = 0
is_visible = false
