#
# GraphLens KV Store collections.
#
# KV Store is used only for curated, low-volume data: node/edge metadata
# curation, type configuration, saved graph views and annotations.
# High-volume observed relationships remain in indexed events and are never
# stored in KV Store. See DATA_MODEL.md.
#

# Curated node metadata (static enrichment merged with indexed relationships).
[graphlens_nodes]
field.node_id = string
field.node_type = string
field.node_label = string
field.node_group = string
field.description = string
field.risk_score = number
field.source_index = string
field.source_sourcetype = string
field.metadata = string
field.updated_by = string
field.updated_time = number
accelerated_fields.node_id_idx = {"node_id": 1}
accelerated_fields.node_type_idx = {"node_type": 1}

# Curated, static (non time-series) relationships, e.g. dependency mappings.
[graphlens_edges]
field.edge_id = string
field.source_id = string
field.target_id = string
field.relationship_type = string
field.relationship_label = string
field.directed = bool
field.risk_score = number
field.metadata = string
field.updated_by = string
field.updated_time = number
accelerated_fields.edge_lookup_idx = {"source_id": 1, "target_id": 1}
accelerated_fields.edge_id_idx = {"edge_id": 1}

# Administrator-controlled node-type display configuration (colour, shape,
# icon, whether the type is enabled for search/display).
[graphlens_node_types]
field.node_type = string
field.display_label = string
field.color = string
field.shape = string
field.icon = string
field.enabled = bool
field.updated_by = string
field.updated_time = number
accelerated_fields.node_type_idx = {"node_type": 1}

# Administrator-controlled relationship-type display configuration.
[graphlens_relationship_types]
field.relationship_type = string
field.display_label = string
field.color = string
field.directed = bool
field.enabled = bool
field.updated_by = string
field.updated_time = number
accelerated_fields.relationship_type_idx = {"relationship_type": 1}

# Saved graph views (layout, expansion state, filters) owned per-user or
# shared, subject to normal Splunk KV Store ACLs.
[graphlens_saved_views]
field.view_id = string
field.view_name = string
field.description = string
field.owner = string
field.sharing = string
field.time_earliest = string
field.time_latest = string
field.initial_node_id = string
field.expanded_node_ids = string
field.pinned_node_ids = string
field.node_filters = string
field.relationship_filters = string
field.layout = string
field.graph_limits = string
field.created_time = number
field.modified_time = number
accelerated_fields.owner_idx = {"owner": 1}

# Lightweight application audit trail. Every tracked user action (search
# dispatch, expansion, collapse, evidence drilldown, export, annotation and
# saved-view CRUD, configuration change, graph-limit event, client error) is
# written here by the frontend audit service after the underlying action
# completes. This is the sole source for the health page (HEALTH.md /
# graphlens_health search) and never stores credentials, tokens or raw
# event content - only identifiers, the action name and an outcome.
[graphlens_audit_log]
field.event_id = string
field.action = string
field.actor = string
field.node_id = string
field.edge_id = string
field.outcome = string
field.detail = string
field.created_time = number
accelerated_fields.action_idx = {"action": 1}
accelerated_fields.created_idx = {"created_time": -1}

# User and shared annotations attached to a node or edge.
[graphlens_annotations]
field.annotation_id = string
field.target_id = string
field.target_kind = string
field.annotation_text = string
field.author = string
field.classification = string
field.sharing = string
field.expiry = number
field.created_time = number
field.modified_time = number
accelerated_fields.target_idx = {"target_id": 1}
