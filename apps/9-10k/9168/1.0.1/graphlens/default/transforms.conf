#
# GraphLens KV Store lookup definitions.
#
# These expose the KV Store collections declared in collections.conf as SPL
# lookups so saved searches can join curated metadata (graphlens_nodes,
# graphlens_edges), read type configuration, and read/report on the audit
# log using standard | lookup and | inputlookup syntax. No filesystem-based
# CSV lookups are used for anything that must be admin-editable at runtime.
#

[graphlens_nodes]
external_type = kvstore
collection = graphlens_nodes
fields_list = _key, node_id, node_type, node_label, node_group, description, risk_score, source_index, source_sourcetype, metadata, updated_by, updated_time

[graphlens_edges]
external_type = kvstore
collection = graphlens_edges
fields_list = _key, edge_id, source_id, target_id, relationship_type, relationship_label, directed, risk_score, metadata, updated_by, updated_time

[graphlens_node_types]
external_type = kvstore
collection = graphlens_node_types
fields_list = _key, node_type, display_label, color, shape, icon, enabled, updated_by, updated_time

[graphlens_relationship_types]
external_type = kvstore
collection = graphlens_relationship_types
fields_list = _key, relationship_type, display_label, color, directed, enabled, updated_by, updated_time

[graphlens_saved_views]
external_type = kvstore
collection = graphlens_saved_views
fields_list = _key, view_id, view_name, description, owner, sharing, time_earliest, time_latest, initial_node_id, expanded_node_ids, pinned_node_ids, node_filters, relationship_filters, layout, graph_limits, created_time, modified_time

[graphlens_annotations]
external_type = kvstore
collection = graphlens_annotations
fields_list = _key, annotation_id, target_id, target_kind, annotation_text, author, classification, sharing, expiry, created_time, modified_time

[graphlens_audit_log]
external_type = kvstore
collection = graphlens_audit_log
fields_list = _key, event_id, action, actor, node_id, edge_id, outcome, detail, created_time

# Static reference lookups seeded from CSV at install time (section "Sample
# data"). These are informational starting points only; administrators
# manage live type configuration through the KV Store collections above.
[graphlens_sample_node_types]
filename = graphlens_node_types_seed.csv

[graphlens_sample_relationship_types]
filename = graphlens_relationship_types_seed.csv
