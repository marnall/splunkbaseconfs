#
# GraphLens capabilities and example roles.
#
# GraphLens enforces access control using native Splunk capabilities rather
# than client-side role-name checks. Every server-side search, KV Store
# collection and configuration endpoint used by the application checks one
# of these capabilities through normal Splunk role-based access control.
#

[capability::graphlens_run_search]

[capability::graphlens_view_evidence]

[capability::graphlens_export_graph]

[capability::graphlens_create_annotation]

[capability::graphlens_manage_shared_annotation]

[capability::graphlens_save_view]

[capability::graphlens_manage_shared_view]

[capability::graphlens_manage_config]

[capability::graphlens_manage_collections]

[capability::graphlens_view_health]

#
# Example roles. Splunk Cloud customers should clone and adapt these roles
# rather than editing them in place; see ADMIN_GUIDE.md.
#

[role_graphlens_viewer]
importRoles = user
graphlens_run_search = enabled
graphlens_view_evidence = enabled
graphlens_export_graph = enabled
srchIndexesAllowed = *
srchJobsQuota = 3
rtSrchJobsQuota = 0
cumulativeSrchJobsQuota = 6

[role_graphlens_analyst]
importRoles = role_graphlens_viewer
graphlens_create_annotation = enabled
graphlens_save_view = enabled
srchJobsQuota = 6
cumulativeSrchJobsQuota = 12

[role_graphlens_admin]
importRoles = role_graphlens_analyst
graphlens_manage_shared_annotation = enabled
graphlens_manage_shared_view = enabled
graphlens_manage_config = enabled
graphlens_manage_collections = enabled
graphlens_view_health = enabled
srchJobsQuota = 12
cumulativeSrchJobsQuota = 24
