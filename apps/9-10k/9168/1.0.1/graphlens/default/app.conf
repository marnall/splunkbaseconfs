#
# GraphLens application configuration
#
# This file must contain only environment-neutral defaults. Deployment
# specific overrides belong in local/app.conf, never here.
#

[install]
is_configured = false
state = enabled
build = 1

[ui]
is_visible = true
label = GraphLens
docs_section_override = graphlens

[launcher]
author = Adam Liquorish
description = Interactive, Neo4j-like relationship graph exploration for data already stored in Splunk. GraphLens is an independent third-party application and does not require Neo4j or any other external graph database.
version = 1.0.1

[id]
name = graphlens
version = 1.0.1

[package]
id = graphlens
# GraphLens is built for public Splunkbase distribution, so update
# checking is deliberately left enabled (must not be disabled per the
# design brief and Splunk Cloud vetting guidance). check_for_updates is
# set explicitly here so that intent is unambiguous on review.
check_for_updates = true

[triggers]
reload.graphlens_settings = simple
