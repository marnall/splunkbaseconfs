[install]
is_configured = false

[launcher]
author = Aegisyst
description = AI-Native Detection Engineering for Splunk. Pulls approved Sigma-derived SPL rules from your Aegisyst tenant and writes them into savedsearches.conf on a schedule.
version = 1.0.1

[ui]
is_visible = true
label = Aegisyst for Splunk

[id]
name = aegisyst_for_splunk
version = 1.0.1

[package]
id = aegisyst_for_splunk

# Reload the app in place when our custom conf is edited, instead of
# forcing a full Splunk restart on every config change.
[triggers]
reload.aegisyst = simple
