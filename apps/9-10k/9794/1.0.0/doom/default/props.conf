[doom:gameplay]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
TIME_PREFIX = "timestamp":\s*
MAX_TIMESTAMP_LOOKAHEAD = 30
TIME_FORMAT = %s.%3N
TRUNCATE = 10000

# Calculated Fields for Analytical Value
EVAL-threat_level = case(mob_type=="Cyberdemon" OR mob_type=="Spider Mastermind", "CRITICAL", mob_type=="Baron of Hell" OR mob_type=="Cacodemon", "HIGH", mob_type=="Demon" OR mob_type=="Spectre" OR mob_type=="Lost Soul", "MEDIUM", 1=1, "LOW")
EVAL-is_lethal = if(event_type=="mob_kill" OR (is_fatal=="true" OR is_fatal==1), 1, 0)
EVAL-dps = if(event_type=="mob_damage", damage_dealt, null)
EVAL-kill_score = case(mob_type=="Cyberdemon", 1000, mob_type=="Spider Mastermind", 1000, mob_type=="Baron of Hell", 500, mob_type=="Cacodemon", 300, mob_type=="Demon", 150, mob_type=="Imp", 100, mob_type=="Shotgun Guy", 80, mob_type=="Zombieman", 50, 1=1, 20)

FIELDALIAS-mob_name = mob_type AS demon_type
FIELDALIAS-session = session_id AS doom_session
FIELDALIAS-map_name = map AS level_map
