[doom_combat]
search = index=doom sourcetype="doom:gameplay" (event_type="weapon_fired" OR event_type="shot_fired" OR event_type="mob_damage" OR event_type="mob_kill" OR event_type="player_damage")

[doom_kill]
search = index=doom sourcetype="doom:gameplay" event_type="mob_kill"

[doom_damage]
search = index=doom sourcetype="doom:gameplay" event_type="mob_damage"

[doom_shot]
search = index=doom sourcetype="doom:gameplay" (event_type="weapon_fired" OR event_type="shot_fired")

[doom_player_damage]
search = index=doom sourcetype="doom:gameplay" event_type="player_damage"

[doom_death]
search = index=doom sourcetype="doom:gameplay" event_type="player_death"

[doom_pickup]
search = index=doom sourcetype="doom:gameplay" event_type="item_pickup"

[doom_movement]
search = index=doom sourcetype="doom:gameplay" (event_type="step_taken" OR event_type="movement_sample")

[doom_secret]
search = index=doom sourcetype="doom:gameplay" event_type="secret_found"

[doom_level_complete]
search = index=doom sourcetype="doom:gameplay" (event_type="level_completed" OR event_type="level_complete")

[doom_cheat]
search = index=doom sourcetype="doom:gameplay" event_type="cheat_used"
