[DOOM - Demonic Threat Intelligence Overview]
search = index=doom sourcetype="doom:gameplay" event_type=mob_kill | stats count as kills, sum(overkill_damage) as total_overkill by mob_type | sort - kills
dispatch.earliest_time = -24h
dispatch.latest_time = now

[DOOM - Weapon Arsenal Effectiveness]
search = index=doom sourcetype="doom:gameplay" (event_type=shot_fired OR event_type=mob_damage OR event_type=mob_kill) | eval weapon=coalesce(weapon, killer_weapon) | stats count(eval(event_type=="shot_fired")) as shots_fired, count(eval(event_type=="mob_damage")) as hits, sum(damage_dealt) as total_damage, count(eval(event_type=="mob_kill")) as total_kills by weapon | eval hit_accuracy=round((hits/shots_fired)*100, 1) | sort - total_kills
dispatch.earliest_time = -24h
dispatch.latest_time = now

[DOOM - Player Hall of Fame (Speedruns & Scores)]
search = index=doom sourcetype="doom:gameplay" event_type=level_complete | table _time player_name map time_sec kills_pct items_pct secrets_pct | sort time_sec
dispatch.earliest_time = -7d
dispatch.latest_time = now

[DOOM - Alert: Demonic Cheat Code Activated]
search = index=doom sourcetype="doom:gameplay" event_type=cheat_used | stats count min(_time) as first_seen max(_time) as last_seen values(cheat_code) as cheats_used values(map) as maps by player_name, session_id | sort - count
dispatch.earliest_time = -24h
dispatch.latest_time = now
alert.severity = 4
alert.suppress = 0
