[CloudLens - Retention - Investigation Rows]
disabled = 0
enableSched = 1
cron_schedule = 22 3 * * *
schedule_window = auto
dispatch.earliest_time = -5m
dispatch.latest_time = now
description = Removes old investigation timeline rows using the configured timeline retention period, and removes rows for findings that are no longer retained.
counttype = always
alert.track = 0
alert.digest_mode = 1
action.cloudlens_finding = 1
action.cloudlens_finding.param.maintenance_mode = retention_investigation
search = | inputlookup cloudlens_investigation_lookup \
    | eval _retention_row="timeline", event_epoch=tonumber(event_time) \
    | lookup cloudlens_findings_lookup finding_id OUTPUT finding_id as retained_finding_id \
    | append [ | inputlookup cloudlens_settings_lookup | search setting="timeline_retention_days" | sort 0 - updated_at | head 1 | eval _retention_row="setting", retention_value=value | table _retention_row retention_value ] \
    | eventstats latest(retention_value) as retention_value \
    | eval retention_days=tonumber(coalesce(retention_value,"14")) \
    | eval retention_days=case(isnull(retention_days) OR retention_days<1,14, retention_days>3650,3650, 1==1,retention_days) \
    | where _retention_row="timeline" AND (isnull(finding_id) OR isnull(retained_finding_id) OR isnull(event_epoch) OR event_epoch<now()-(retention_days*86400)) \
    | sort 0 event_epoch \
    | head 1000 \
    | table _key

