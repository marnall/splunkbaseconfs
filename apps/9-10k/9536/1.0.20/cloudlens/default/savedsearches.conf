# EventTimeline internal searches retain legacy CloudLens titles for upgrades.
[CloudLens - Hydrate Investigation Compact]
disabled = 0
enableSched = 0
description = Fast mode-specific CloudTrail timeline hydration without AssumeRole lineage expansion.
dispatch.earliest_time = -2h
dispatch.latest_time = +2h
counttype = always
alert.track = 0
alert.digest_mode = 1
action.cloudlens_finding = 1
action.cloudlens_finding.param.hydration_complete_only = 1
search = ((index=$args.source_index$ sourcetype=$args.source_sourcetype$) OR ((`cloudlens_cloudtrail`) index=$args.fallback_index$)) ("$args.search_event_term$" OR "$args.search_principal_term$" OR "$args.search_username_term$" OR "$args.search_ip_term$" OR "$args.search_resource_term$") \
    | where eventID="$args.anchor_event_id$" OR event_id="$args.anchor_event_id$" OR 'userIdentity.arn'="$args.anchor_principal$" OR user_arn="$args.anchor_principal$" OR 'userIdentity.principalId'="$args.anchor_principal$" OR 'userIdentity.userName'="$args.anchor_username$" OR 'userIdentity.sessionContext.sessionIssuer.arn'="$args.anchor_principal$" OR 'userIdentity.sessionContext.sessionIssuer.userName'="$args.anchor_username$" OR 'userIdentity.invokedBy'="$args.anchor_principal$" OR sourceIPAddress="$args.anchor_ip$" OR src_ip="$args.anchor_ip$" OR source_ip="$args.anchor_ip$" OR 'resources{}.ARN'="$args.anchor_resource$" OR resource_arn="$args.anchor_resource$" OR target_resource="$args.anchor_resource$" OR 'requestParameters.resourceArn'="$args.anchor_resource$" OR 'requestParameters.roleArn'="$args.anchor_resource$" \
    | fields _time _raw index sourcetype eventName event_name eventSource eventID event_id awsRegion region recipientAccountId accountId aws_account_id sourceIPAddress src src_ip source_ip clientip user user_arn src_user src_user_id user_id principal principal_id action signature rule_name rule_title search_name resource resource_arn target_resource object_id object dest dest_host dvc host status status_label disposition userAgent errorCode errorMessage userIdentity.* requestParameters.* resources* \
    | `cloudlens_timeline_compact_normalize_aws` \
    | eval anchor_cloud="$args.anchor_cloud$", anchor_principal="$args.anchor_principal$", anchor_username="$args.anchor_username$", anchor_ip="$args.anchor_ip$", anchor_resource="$args.anchor_resource$", anchor_account="$args.anchor_account$", anchor_event_id="$args.anchor_event_id$", anchor_time=tonumber("$args.anchor_time$"), timeline_scope_requested="$args.timeline_scope$", hydration_dispatch_id="$args.hydration_dispatch_id$", hydration_generation="$args.hydration_generation$", hydration_profile="$args.hydration_profile$", source_index="$args.source_index$", source_sourcetype="$args.source_sourcetype$" \
    | eval anchor_principal=trim(replace(anchor_principal,"[\r\n]+"," ")), \
           anchor_username=trim(replace(anchor_username,"[\r\n]+"," ")), \
           anchor_ip=trim(replace(anchor_ip,"[\r\n]+"," ")), \
           anchor_resource=trim(replace(anchor_resource,"[\r\n]+"," ")), \
           anchor_account=trim(replace(anchor_account,"[\r\n]+"," ")), \
           anchor_event_id=trim(replace(anchor_event_id,"[\r\n]+"," ")), \
           timeline_scope_requested=if(timeline_scope_requested="user","user","resource"), \
           source_match=if(index=source_index AND (source_sourcetype="*" OR sourcetype=source_sourcetype),1,0), \
           cl_cloud=case(anchor_cloud!="" AND anchor_cloud!="aws" AND source_match=1,anchor_cloud,1==1,cl_cloud), \
           cl_principal_id=trim(replace(coalesce(mvindex(cl_principal_id,0),user_arn,src_user,src_user_id,user_id,user,principal_id,principal,""),"[\r\n]+"," ")), \
           cl_src_ip=trim(replace(coalesce(mvindex(cl_src_ip,0),sourceIPAddress,src_ip,source_ip,clientip,src,""),"[\r\n]+"," ")), \
           cl_account_id=trim(replace(coalesce(mvindex(cl_account_id,0),recipientAccountId,accountId,aws_account_id,""),"[\r\n]+"," ")), \
           cl_resource_id=trim(replace(coalesce(mvindex(nullif(cl_resource_id,"n/a"),0),resource_arn,target_resource,resource,object_id,object,dest,dest_host,dvc,"n/a"),"[\r\n]+"," ")), \
           cl_event_id=trim(replace(coalesce(mvindex(cl_event_id,0),eventID,event_id,""),"[\r\n]+"," ")), \
           cl_action=trim(replace(coalesce(mvindex(cl_action,0),eventName,event_name,action,signature,rule_name,rule_title,search_name,""),"[\r\n]+"," ")), \
           cl_region=coalesce(nullif(cl_region,""),awsRegion,region), \
           cl_service=coalesce(nullif(cl_service,""),eventSource,sourcetype), \
           cl_outcome=case(lower(coalesce(status_label,status,disposition,"")) IN ("failure","failed","blocked","denied"),"failure", lower(coalesce(status_label,status,disposition,"")) IN ("success","succeeded","allowed"),"success", 1==1,coalesce(cl_outcome,"unknown")), \
           cl_source_index=index, cl_source_sourcetype=sourcetype, \
           _event_key=if(isnotnull(cl_event_id) AND cl_event_id!="",cl_event_id,sha256(coalesce(index,"")."|".coalesce(sourcetype,"")."|".coalesce(cl_event_time,_time)."|".coalesce(cl_action,"")."|".coalesce(cl_principal_id,"")."|".coalesce(cl_resource_id,"")."|".coalesce(cl_src_ip,""))) \
    | fields - _raw \
    | where anchor_cloud="" OR anchor_cloud="aws" OR source_match=1 \
    | eval account_match=if(anchor_account="" OR cl_account_id=anchor_account,1,0), \
           keep_event=if(anchor_event_id!="" AND anchor_event_id!="n/a" AND cl_event_id=anchor_event_id,"1","0"), \
           keep_anchor=if(account_match=1 AND anchor_principal!="" AND anchor_principal!="n/a" AND cl_principal_id=anchor_principal,"1","0"), \
           keep_resource=if(account_match=1 AND anchor_resource!="" AND anchor_resource!="n/a" AND cl_resource_id=anchor_resource,"1","0"), \
           correlation_distance=abs(coalesce(cl_event_time,_time)-anchor_time) \
    | where (timeline_scope_requested="user" AND keep_anchor="1") OR (timeline_scope_requested="resource" AND (keep_event="1" OR keep_resource="1")) \
    | dedup _event_key \
    | sort $args.max_timeline_events_plus_one$ correlation_distance \
    | eventstats count AS hydration_candidate_count \
    | eval hydration_truncated_flag=if(hydration_candidate_count>tonumber("$args.max_timeline_events$"),1,0) \
    | head $args.max_timeline_events$ \
    | eval finding_id="$args.finding_id$", \
           cl_resource_id=if(keep_event="1" AND anchor_resource!="" AND anchor_resource!="n/a",anchor_resource,cl_resource_id), \
           timeline_scope=if(keep_event="1","both",timeline_scope_requested), \
           followup_id=case(keep_event="1","alert",keep_resource="1","same_resource",1==1,"anchor"), \
           followup_label=case(keep_event="1","Alert trigger",keep_resource="1","Same resource activity",1==1,"Anchor entity activity"), \
           node_id=coalesce(nullif(cl_principal_id,""),nullif(cl_src_ip,""),"unknown"), \
           node_kind=case(cl_principal_type=="Root","root",cl_principal_type=="IAMUser","iam_user",cl_principal_type=="AssumedRole","assumed_role",isnull(cl_principal_id) OR cl_principal_id="","ip",1==1,"principal"), \
           label=coalesce(nullif(cl_principal_name,""),nullif(cl_src_ip,""),node_id), \
           parent_id=if(isnotnull(cl_src_ip) AND cl_src_ip!="" AND cl_src_ip!=node_id,cl_src_ip,null()), \
           element_type="event", event_time=coalesce(cl_event_time,_time), outcome=cl_outcome, \
           is_alert=if(keep_event="1","true","false"), detail=cl_action." ".coalesce(cl_resource_id,""), \
           cl_access_key="", cl_session_issuer_arn="", cl_session_issuer_name="" \
    | eval _key=finding_id."::".hydration_generation."::"._event_key \
    | table _key finding_id element_type timeline_scope followup_id followup_label node_id node_kind label parent_id event_time outcome is_alert detail cl_action cl_cloud cl_account_id cl_region cl_service cl_resource_id cl_resource_type cl_principal_id cl_principal_type cl_access_key cl_session_name cl_role_session_name cl_session_issuer_arn cl_session_issuer_name cl_src_ip cl_user_agent cl_error cl_error_message cl_event_category cl_management_event cl_read_only cl_event_id cl_source_index cl_source_sourcetype hydration_truncated_flag hydration_profile hydration_generation \
    | outputlookup append=true key_field=_key cloudlens_investigation_lookup \
    | stats count AS hydration_result_count max(hydration_truncated_flag) AS hydration_truncated_flag \
    | eval finding_id="$args.finding_id$", hydration_dispatch_id="$args.hydration_dispatch_id$", hydration_generation="$args.hydration_generation$", hydration_profile="$args.hydration_profile$", hydration_truncated=if(coalesce(hydration_truncated_flag,0)=1,"true","false"), hydration_limit=tonumber("$args.max_timeline_events$"), hydration_source_mode="$args.source_mode$" \
    | table finding_id hydration_dispatch_id hydration_generation hydration_profile hydration_result_count hydration_truncated hydration_limit hydration_source_mode

[CloudLens - Hydrate Investigation]
disabled = 0
enableSched = 0
description = Assembles a CloudTrail evidence timeline for an external saved-search finding and writes it to the cloudlens_investigation KV store.
dispatch.earliest_time = -2h
dispatch.latest_time = +2h
counttype = always
alert.track = 0
alert.digest_mode = 1
action.cloudlens_finding = 1
action.cloudlens_finding.param.hydration_complete_only = 1
search = ((index=$args.source_index$ sourcetype=$args.source_sourcetype$) OR ((`cloudlens_cloudtrail`) index=$args.fallback_index$)) ("$args.search_event_term$" OR "$args.search_principal_term$" OR "$args.search_username_term$" OR "$args.search_ip_term$" OR "$args.search_resource_term$") \
    | where eventID="$args.anchor_event_id$" OR event_id="$args.anchor_event_id$" OR 'userIdentity.arn'="$args.anchor_principal$" OR user_arn="$args.anchor_principal$" OR 'userIdentity.principalId'="$args.anchor_principal$" OR 'userIdentity.userName'="$args.anchor_username$" OR 'userIdentity.sessionContext.sessionIssuer.arn'="$args.anchor_principal$" OR 'userIdentity.sessionContext.sessionIssuer.userName'="$args.anchor_username$" OR 'userIdentity.invokedBy'="$args.anchor_principal$" OR 'responseElements.assumedRoleUser.arn'="$args.anchor_principal$" OR sourceIPAddress="$args.anchor_ip$" OR src_ip="$args.anchor_ip$" OR source_ip="$args.anchor_ip$" OR 'resources{}.ARN'="$args.anchor_resource$" OR resource_arn="$args.anchor_resource$" OR target_resource="$args.anchor_resource$" OR 'requestParameters.resourceArn'="$args.anchor_resource$" OR 'requestParameters.roleArn'="$args.anchor_resource$" \
    | fields _time _raw index sourcetype eventName event_name eventSource eventID event_id awsRegion region recipientAccountId accountId aws_account_id sourceIPAddress src src_ip source_ip clientip user user_arn src_user src_user_id user_id principal principal_id action signature rule_name rule_title search_name resource resource_arn target_resource object_id object dest dest_host dvc host status status_label disposition userAgent errorCode errorMessage userIdentity.* requestParameters.* responseElements.* additionalEventData.* resources* \
    | `cloudlens_timeline_normalize_aws` \
    | `cloudlens_assumerole_link` \
    | eval anchor_cloud="$args.anchor_cloud$", anchor_principal="$args.anchor_principal$", anchor_username="$args.anchor_username$", anchor_ip="$args.anchor_ip$", anchor_resource="$args.anchor_resource$", anchor_account="$args.anchor_account$", anchor_event_id="$args.anchor_event_id$", anchor_time=tonumber("$args.anchor_time$"), timeline_scope_requested="$args.timeline_scope$", hydration_dispatch_id="$args.hydration_dispatch_id$", hydration_generation="$args.hydration_generation$", hydration_profile="$args.hydration_profile$", source_index="$args.source_index$", source_sourcetype="$args.source_sourcetype$" \
    | eval anchor_principal=trim(replace(anchor_principal,"[\r\n]+"," ")), \
           anchor_username=trim(replace(anchor_username,"[\r\n]+"," ")), \
           anchor_ip=trim(replace(anchor_ip,"[\r\n]+"," ")), \
           anchor_resource=trim(replace(anchor_resource,"[\r\n]+"," ")), \
           anchor_account=trim(replace(anchor_account,"[\r\n]+"," ")), \
           anchor_event_id=trim(replace(anchor_event_id,"[\r\n]+"," ")), \
           timeline_scope_requested=if(timeline_scope_requested="user","user","resource"), \
           source_match=if(index=source_index AND (source_sourcetype="*" OR sourcetype=source_sourcetype),1,0), \
           cl_cloud=case(anchor_cloud!="" AND anchor_cloud!="aws" AND source_match=1,anchor_cloud,1==1,cl_cloud), \
           cl_principal_id=coalesce(nullif(cl_principal_id,""),user_arn,src_user,src_user_id,user_id,user,principal_id,principal), \
           cl_src_ip=coalesce(nullif(cl_src_ip,""),sourceIPAddress,src_ip,source_ip,clientip,src), \
           cl_account_id=coalesce(nullif(cl_account_id,""),recipientAccountId,accountId,aws_account_id), \
           cl_resource_id=coalesce(nullif(nullif(cl_resource_id,""),"n/a"),resource_arn,target_resource,resource,object_id,object,dest,dest_host,dvc,"n/a"), \
           cl_action=coalesce(nullif(cl_action,""),eventName,event_name,action,signature,rule_name,rule_title,search_name), \
           cl_event_id=coalesce(nullif(cl_event_id,""),eventID,event_id), \
           cl_region=coalesce(nullif(cl_region,""),awsRegion,region), \
           cl_service=coalesce(nullif(cl_service,""),eventSource,sourcetype), \
           cl_outcome=case(lower(coalesce(status_label,status,disposition,"")) IN ("failure","failed","blocked","denied"),"failure", lower(coalesce(status_label,status,disposition,"")) IN ("success","succeeded","allowed"),"success", 1==1,coalesce(cl_outcome,"unknown")), \
           cl_principal_id=trim(replace(coalesce(mvindex(cl_principal_id,0),""),"[\r\n]+"," ")), \
           cl_access_key=trim(replace(coalesce(mvindex(cl_access_key,0),""),"[\r\n]+"," ")), \
           cl_src_ip=trim(replace(coalesce(mvindex(cl_src_ip,0),""),"[\r\n]+"," ")), \
           cl_account_id=trim(replace(coalesce(mvindex(cl_account_id,0),""),"[\r\n]+"," ")), \
           cl_resource_id=trim(replace(coalesce(mvindex(cl_resource_id,0),""),"[\r\n]+"," ")), \
           cl_event_id=trim(replace(coalesce(mvindex(cl_event_id,0),""),"[\r\n]+"," ")), \
           cl_action=trim(replace(coalesce(mvindex(cl_action,0),""),"[\r\n]+"," ")), \
           cl_assumed_principal=if(isnotnull(cl_assumed_arn) AND cl_assumed_arn!="" AND isnotnull(cl_assumed_session) AND cl_assumed_session!="",replace(replace(cl_assumed_arn,":iam::",":sts::"),":role/",":assumed-role/")."/".cl_assumed_session,null()), \
           cl_source_index=index, \
           cl_source_sourcetype=sourcetype, \
           _event_key=if(isnotnull(cl_event_id) AND cl_event_id!="",cl_event_id,sha256(coalesce(index,"")."|".coalesce(sourcetype,"")."|".coalesce(cl_event_time,_time)."|".coalesce(cl_action,"")."|".coalesce(cl_principal_id,"")."|".coalesce(cl_access_key,"")."|".coalesce(cl_resource_id,"")."|".coalesce(cl_src_ip,""))) \
    | fields - _raw \
    | where anchor_cloud="" OR anchor_cloud="aws" OR source_match=1 \
    | eval has_event=if(anchor_event_id!="" AND anchor_event_id!="n/a",1,0), \
           has_principal=if(anchor_principal!="" AND anchor_principal!="n/a",1,0), \
           account_match=if(anchor_account="" OR cl_account_id=anchor_account,1,0), \
           keep_event=if(has_event=1 AND cl_event_id=anchor_event_id,"1","0"), \
           keep_anchor=if(account_match=1 AND has_principal=1 AND (cl_principal_id=anchor_principal OR cl_access_key=anchor_principal),"1","0"), \
           keep_resource=if(account_match=1 AND cl_resource_id=anchor_resource AND anchor_resource!="" AND anchor_resource!="n/a","1","0"), \
           keep_parent_assume=if(timeline_scope_requested="resource" AND account_match=1 AND has_principal=1 AND cl_action="AssumeRole" AND cl_assumed_principal=anchor_principal,"1","0"), \
           keep_tamper=if(timeline_scope_requested="resource" AND anchor_account!="" AND cl_account_id=anchor_account AND (cl_action=="StopLogging" OR cl_action=="DeleteTrail" OR cl_action=="UpdateTrail" OR cl_action=="PutEventSelectors" OR cl_action=="DeleteBucketEncryption" OR cl_action=="DeleteFlowLogs" OR cl_action=="StopConfigurationRecorder"),"1","0"), \
           correlation_distance=abs(coalesce(cl_event_time,_time)-anchor_time) \
    | sort $args.max_correlation_events$ correlation_distance \
    | eventstats values(eval(if(keep_anchor="1" AND cl_action="AssumeRole" AND isnotnull(cl_assumed_access_key) AND cl_assumed_access_key!="",cl_assumed_access_key,null()))) AS anchor_child_keys values(eval(if(keep_parent_assume="1" AND isnotnull(cl_access_key) AND cl_access_key!="",cl_access_key,null()))) AS parent_session_keys \
    | eval keep_child_session=if(timeline_scope_requested="resource" AND account_match=1 AND isnotnull(cl_access_key) AND cl_access_key!="" AND mvfind(anchor_child_keys,"^".cl_access_key."$")>=0,"1","0"), \
           keep_grandparent_assume=if(timeline_scope_requested="resource" AND account_match=1 AND cl_action="AssumeRole" AND isnotnull(cl_assumed_access_key) AND cl_assumed_access_key!="" AND mvfind(parent_session_keys,"^".cl_assumed_access_key."$")>=0,"1","0") \
    | where (timeline_scope_requested="user" AND keep_anchor="1") OR (timeline_scope_requested="resource" AND (keep_event="1" OR keep_anchor="1" OR keep_resource="1" OR keep_parent_assume="1" OR keep_grandparent_assume="1" OR keep_child_session="1" OR keep_tamper="1")) \
	    | dedup _event_key \
	    | sort $args.max_timeline_events_plus_one$ correlation_distance \
	    | eventstats count AS hydration_candidate_count \
	    | eval hydration_truncated_flag=if(hydration_candidate_count>tonumber("$args.max_timeline_events$"),1,0) \
	    | head $args.max_timeline_events$ \
	    | eval finding_id="$args.finding_id$", \
	           cl_resource_id=if(keep_event="1" AND anchor_resource!="" AND anchor_resource!="n/a",anchor_resource,cl_resource_id), \
	           timeline_scope=case(keep_event="1","both", keep_tamper="1","both", (keep_anchor="1" OR keep_parent_assume="1" OR keep_grandparent_assume="1" OR keep_child_session="1") AND keep_resource="1","both", keep_resource="1","resource", keep_anchor="1" OR keep_parent_assume="1" OR keep_grandparent_assume="1" OR keep_child_session="1","user", 1==1,"user"), \
           followup_id=case(keep_event="1","alert", keep_tamper="1","logging_tamper", keep_child_session="1" OR keep_parent_assume="1" OR keep_grandparent_assume="1","role_lineage", keep_anchor="1","anchor", keep_resource="1","same_resource", 1==1,"anchor"), \
           followup_label=case(keep_event="1","Alert trigger", keep_tamper="1","Logging/defense-evasion in account", keep_child_session="1" OR keep_parent_assume="1" OR keep_grandparent_assume="1","AssumeRole lineage activity", keep_anchor="1","Anchor entity activity", keep_resource="1","Same resource activity", 1==1,"Anchor entity activity"), \
           node_id=coalesce(nullif(cl_principal_id,""),nullif(cl_src_ip,""),"unknown"), \
           node_kind=case(cl_principal_type=="Root","root", cl_principal_type=="IAMUser","iam_user", cl_principal_type=="AssumedRole","assumed_role", isnull(cl_principal_id) OR cl_principal_id="","ip", 1==1,"principal"), \
           label=coalesce(nullif(cl_principal_name,""),nullif(cl_src_ip,""),node_id), \
           ``` parent chain: prefer the issuing access key, else the source IP; never self-reference ``` \
           parent_id=case(isnotnull(cl_access_key) AND cl_access_key!="" AND cl_access_key!=node_id,cl_access_key,isnotnull(cl_src_ip) AND cl_src_ip!="" AND cl_src_ip!=node_id,cl_src_ip,1==1,null()), \
           element_type="event", \
	           event_time=coalesce(cl_event_time,_time), \
           outcome=cl_outcome, \
           is_alert=if(keep_event="1","true","false"), \
           detail=cl_action." ".coalesce(cl_resource_id,"") \
    | eval _key=finding_id."::".hydration_generation."::"._event_key \
    | table _key finding_id element_type timeline_scope followup_id followup_label node_id node_kind label parent_id event_time outcome is_alert detail cl_action cl_cloud cl_account_id cl_region cl_service cl_resource_id cl_resource_type cl_principal_id cl_principal_type cl_access_key cl_session_name cl_role_session_name cl_session_issuer_arn cl_session_issuer_name cl_src_ip cl_user_agent cl_error cl_error_message cl_event_category cl_management_event cl_read_only cl_event_id cl_source_index cl_source_sourcetype hydration_truncated_flag hydration_profile hydration_generation \
    | outputlookup append=true key_field=_key cloudlens_investigation_lookup \
    | stats count AS hydration_result_count max(hydration_truncated_flag) AS hydration_truncated_flag \
    | eval finding_id="$args.finding_id$", hydration_dispatch_id="$args.hydration_dispatch_id$", hydration_generation="$args.hydration_generation$", hydration_profile="$args.hydration_profile$", hydration_truncated=if(coalesce(hydration_truncated_flag,0)=1,"true","false"), hydration_limit=tonumber("$args.max_timeline_events$"), hydration_source_mode="$args.source_mode$" \
    | table finding_id hydration_dispatch_id hydration_generation hydration_profile hydration_result_count hydration_truncated hydration_limit hydration_source_mode

[CloudLens - Backfill Alert Timeline Anchors]
disabled = 0
enableSched = 1
cron_schedule = 4,19,34,49 * * * *
schedule_window = 2
realtime_schedule = 1
max_concurrent = 1
description = In automatic mode, ensures every stored EventTimeline finding has an alert-trigger timeline row if the original hydration search returned no rows.
dispatch.earliest_time = -5m
dispatch.latest_time = now
search = | inputlookup cloudlens_findings_lookup \
    | eval _timeline_row="finding" \
    | append [ | inputlookup cloudlens_settings_lookup where setting="automatic_timeline_generation" | sort 0 - updated_at | head 1 | eval _timeline_row="setting", automatic_timeline_generation=lower(value) | table _timeline_row automatic_timeline_generation ] \
    | eventstats values(automatic_timeline_generation) AS automatic_timeline_generation \
    | where _timeline_row="finding" AND automatic_timeline_generation IN ("1","true","yes","on","enabled","automatic") AND hydration_status!="manual" \
    | fields - _timeline_row automatic_timeline_generation \
    | lookup cloudlens_investigation_lookup finding_id OUTPUT finding_id AS existing_timeline_finding_id \
    | where isnull(existing_timeline_finding_id) \
    | sort 0 alert_time \
    | head 500 \
    | eval finding_id=coalesce(finding_id,_key), \
           node_id=coalesce(cl_principal_id,cl_src_ip,"alert"), \
           event_seed=coalesce(cl_event_id,finding_id), \
           _key=finding_id."::alert::".substr(sha256(event_seed),1,12), \
           element_type="event", \
           timeline_scope="both", \
           followup_id="alert", \
           followup_label="Alert trigger", \
           node_kind="principal", \
           label=node_id, \
           parent_id=if(isnotnull(cl_src_ip) AND cl_src_ip!="" AND cl_src_ip!=node_id,cl_src_ip,null()), \
           event_time=tonumber(alert_time), \
           outcome="alert", \
           is_alert="true", \
           detail=coalesce(detection,"Alert trigger"), \
           cl_region="", \
           cl_service=coalesce(cl_cloud,"Alert"), \
           cl_session_name="", \
           cl_role_session_name="", \
           cl_session_issuer_arn="", \
           cl_session_issuer_name="", \
           cl_user_agent="", \
           cl_error="", \
           cl_error_message="", \
           cl_resource_type="", \
           cl_principal_type=coalesce(cl_principal_type,""), \
           cl_event_category="", \
           cl_management_event="", \
           cl_read_only="", \
           cl_source_index=coalesce(cl_source_index,""), \
           cl_source_sourcetype=coalesce(cl_source_sourcetype,"") \
    | where isnotnull(finding_id) AND finding_id!="" AND isnotnull(event_time) \
    | table _key finding_id element_type timeline_scope followup_id followup_label node_id node_kind label parent_id event_time outcome is_alert detail cl_action cl_cloud cl_account_id cl_region cl_service cl_resource_id cl_resource_type cl_principal_id cl_principal_type cl_access_key cl_session_name cl_role_session_name cl_session_issuer_arn cl_session_issuer_name cl_src_ip cl_user_agent cl_error cl_error_message cl_event_category cl_management_event cl_read_only cl_event_id cl_source_index cl_source_sourcetype \
    | outputlookup append=true key_field=_key cloudlens_investigation_lookup

[CloudLens - Retry Pending Timeline Hydrations]
disabled = 0
enableSched = 1
cron_schedule = 2,7,12,17,22,27,32,37,42,47,52,57 * * * *
schedule_window = 1
realtime_schedule = 1
max_concurrent = 1
description = When automatic generation is enabled, retries bounded timeline hydration work deferred by per-alert guardrails or transient Splunk scheduler/KV failures.
dispatch.earliest_time = -10m
dispatch.latest_time = now
counttype = always
alert.track = 0
alert.digest_mode = 1
action.cloudlens_finding = 1
action.cloudlens_finding.param.hydration_retry_only = 1
action.cloudlens_finding.param.hydration_retry_max_attempts = 5
action.cloudlens_finding.param.max_hydrations_per_alert = 20
search = | inputlookup cloudlens_findings_lookup \
    | eval _timeline_row="finding" \
    | append [ | inputlookup cloudlens_settings_lookup where setting="automatic_timeline_generation" | sort 0 - updated_at | head 1 | eval _timeline_row="setting", automatic_timeline_generation=lower(value) | table _timeline_row automatic_timeline_generation ] \
    | eventstats values(automatic_timeline_generation) AS automatic_timeline_generation \
    | where _timeline_row="finding" AND automatic_timeline_generation IN ("1","true","yes","on","enabled","automatic") \
    | fields - _timeline_row automatic_timeline_generation \
    | eval hydration_attempts=tonumber(coalesce(hydration_attempts,0)), hydration_updated_at=tonumber(coalesce(hydration_updated_at,0)), hydration_retry_reason=case(hydration_status="dispatched" AND hydration_updated_at<=now()-600,"Previous hydration dispatch exceeded 10 minutes without a completion callback.",hydration_status="retry_pending",coalesce(hydration_last_error,"Previous hydration dispatch failed."),hydration_status="deferred","Hydration was deferred by per-alert backpressure.",1==1,"") \
    | where ((hydration_status IN ("pending","deferred","retry_pending") AND (hydration_updated_at=0 OR hydration_updated_at<=now()-120)) OR (hydration_status="dispatched" AND hydration_updated_at<=now()-600)) AND hydration_attempts<5 \
    | sort 0 hydration_updated_at \
    | head 20 \
    | table _key finding_id detection severity mitre_technique mitre_tactic cl_cloud cl_account_id cl_principal_id cl_principal_type cl_username cl_role_session_name cl_session_issuer_arn cl_session_issuer_name cl_invoked_by cl_resource_id cl_src_ip cl_action cl_event_id cl_source_index cl_source_sourcetype alert_time alert_time_source detection_time status assignee dedup_key timeline_anchor_status hydration_status hydration_attempts hydration_last_error hydration_updated_at hydration_completed_at hydration_result_count hydration_dispatch_id hydration_retry_reason

[CloudLens - Retention - Findings]
disabled = 0
enableSched = 1
cron_schedule = 17 3 * * *
schedule_window = auto
dispatch.earliest_time = -5m
dispatch.latest_time = now
description = Removes triggered EventTimeline alerts older than the configured alert retention period.
counttype = always
alert.track = 0
alert.digest_mode = 1
action.cloudlens_finding = 1
action.cloudlens_finding.param.maintenance_mode = retention_findings
search = | inputlookup cloudlens_findings_lookup \
    | lookup cloudlens_finding_triage_lookup finding_id OUTPUT status AS triage_status \
    | eval status=coalesce(triage_status,status,"new") \
    | eval _retention_row="finding", alert_epoch=tonumber(alert_time) \
    | append [ | inputlookup cloudlens_settings_lookup | search setting="alert_retention_days" | sort 0 - updated_at | head 1 | eval _retention_row="setting", retention_value=value | table _retention_row retention_value ] \
    | eventstats latest(retention_value) as retention_value \
    | eval retention_days=tonumber(coalesce(retention_value,"15")) \
    | eval retention_days=case(isnull(retention_days) OR retention_days<7 OR retention_days>15,15, 1==1,floor(retention_days)) \
    | eval protected_case=if(lower(coalesce(status,"")) IN ("triaging","investigating","hydrating") OR lower(coalesce(hydration_status,"")) IN ("pending","deferred","dispatched","retry_pending"),1,0) \
    | where _retention_row="finding" AND protected_case=0 AND (isnull(alert_epoch) OR alert_epoch<now()-(retention_days*86400)) \
    | sort 0 alert_epoch \
    | head 500 \
    | table _key

