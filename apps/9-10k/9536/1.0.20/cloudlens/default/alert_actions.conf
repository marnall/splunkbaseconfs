[cloudlens_finding]
is_custom = 1
label = Create EventTimeline Finding
description = Creates a normalized CloudTrail finding. Timelines are fetched by analysts unless automatic generation is enabled in EventTimeline Setup.
payload_format = json
forceCsvResults = true
python.required = 3.9,3.13
python.version = python3
param.severity = medium
param.default_status = new
param.lookback_secs = 7200
param.lookahead_secs = 1800
param.max_findings_per_alert = 100
param.max_hydrations_per_alert = 10
param.max_timeline_events = 2000
param.hydration_max_time_secs = 300
param.include_role_lineage = 0
param.hydration_retry_only = 0
param.hydration_retry_max_attempts = 5
param.hydration_complete_only = 0
param.maintenance_mode =
