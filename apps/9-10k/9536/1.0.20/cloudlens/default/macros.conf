	        len(coalesce(cl_json_key_id, mvindex('requestParameters.keyId',0), ""))>0, coalesce(cl_json_key_id, mvindex('requestParameters.keyId',0)), \
	        len(coalesce(cl_json_req_access_key, cl_json_created_access_key, mvindex('requestParameters.accessKeyId',0), ""))>0, coalesce(cl_json_req_access_key, cl_json_created_access_key, mvindex('requestParameters.accessKeyId',0)), \
	        len(coalesce(cl_json_created_access_key, mvindex('responseElements.accessKey.accessKeyId',0), ""))>0, coalesce(cl_json_created_access_key, mvindex('responseElements.accessKey.accessKeyId',0)), \
	        len(coalesce(cl_json_secret_id, mvindex('requestParameters.secretId',0), ""))>0, coalesce(cl_json_secret_id, mvindex('requestParameters.secretId',0)), \
	        len(coalesce(cl_json_parameter_name, mvindex('requestParameters.parameterName',0), ""))>0, coalesce(cl_json_parameter_name, mvindex('requestParameters.parameterName',0)), \
	        len(coalesce(cl_json_snapshot_id, mvindex('requestParameters.snapshotId',0), ""))>0, coalesce(cl_json_snapshot_id, mvindex('requestParameters.snapshotId',0)), \
	        len(coalesce(cl_json_volume_id, mvindex('requestParameters.volumeId',0), ""))>0, coalesce(cl_json_volume_id, mvindex('requestParameters.volumeId',0)), \
	        len(coalesce(cl_json_vpc_id, mvindex('requestParameters.vpcId',0), ""))>0, coalesce(cl_json_vpc_id, mvindex('requestParameters.vpcId',0)), \
	        len(coalesce(cl_json_subnet_id, mvindex('requestParameters.subnetId',0), ""))>0, coalesce(cl_json_subnet_id, mvindex('requestParameters.subnetId',0)), \
	        len(coalesce(cl_json_route_table_id, mvindex('requestParameters.routeTableId',0), ""))>0, coalesce(cl_json_route_table_id, mvindex('requestParameters.routeTableId',0)), \
	        len(coalesce(cl_json_network_acl_id, mvindex('requestParameters.networkAclId',0), ""))>0, coalesce(cl_json_network_acl_id, mvindex('requestParameters.networkAclId',0)), \
	        len(coalesce(cl_json_function_name, mvindex('requestParameters.functionName',0), ""))>0, coalesce(cl_json_function_name, mvindex('requestParameters.functionName',0)), \
	        len(coalesce(cl_json_repository_name, mvindex('requestParameters.repositoryName',0), ""))>0, coalesce(cl_json_repository_name, mvindex('requestParameters.repositoryName',0)), \
	        len(coalesce(cl_json_table_name, mvindex('requestParameters.tableName',0), ""))>0, coalesce(cl_json_table_name, mvindex('requestParameters.tableName',0)), \
	        len(coalesce(cl_json_db_instance_id, mvindex('requestParameters.dbInstanceIdentifier',0), ""))>0, coalesce(cl_json_db_instance_id, mvindex('requestParameters.dbInstanceIdentifier',0)), \
	        len(coalesce(cl_json_cluster_id, mvindex('requestParameters.clusterIdentifier',0), ""))>0, coalesce(cl_json_cluster_id, mvindex('requestParameters.clusterIdentifier',0)), \
	        len(coalesce(cl_json_load_balancer_name, mvindex('requestParameters.loadBalancerName',0), ""))>0, coalesce(cl_json_load_balancer_name, mvindex('requestParameters.loadBalancerName',0)), \
        1==1, "n/a"), \
    cl_event_id=coalesce(eventID, cl_json_event_id) \
    | eval cl_session_issuer_arn=coalesce('userIdentity.sessionContext.sessionIssuer.arn', cl_json_session_issuer_arn), \
        cl_session_issuer_name=coalesce('userIdentity.sessionContext.sessionIssuer.userName', cl_json_session_issuer_user), \
        cl_role_session_name=case(cl_principal_type="AssumedRole" AND like(cl_principal_arn,"%:assumed-role/%/%"),mvindex(split(cl_principal_arn,"/"),-1),cl_principal_type="AssumedRole" AND like(cl_json_principal_id,"%:%"),mvindex(split(cl_json_principal_id,":"),-1),1==1,null()) \
