	    cl_principal_name=case(cl_principal_type="AWSService",cl_invoked_by,cl_principal_type="AWSAccount",null(),1==1,coalesce('userIdentity.userName', cl_json_user_name, 'userIdentity.principalId', cl_json_principal_id)), \
	    cl_resource_type=coalesce(cl_json_resource_type, mvindex('resources{}.type',0), "n/a"), \
	    cl_bucket=coalesce(cl_json_bucket_name, mvindex('requestParameters.bucketName',0), cl_json_resource_arn, mvindex('resources{}.ARN',0)), \
	    cl_resource_id=case( \
	        len(coalesce(cl_json_bucket_name, mvindex('requestParameters.bucketName',0), ""))>0, "arn:aws:s3:::".coalesce(cl_json_bucket_name, mvindex('requestParameters.bucketName',0)), \
	        len(coalesce(cl_json_resource_arn, mvindex('resources{}.ARN',0), ""))>0, coalesce(cl_json_resource_arn, mvindex('resources{}.ARN',0)), \
	        len(coalesce(cl_json_request_resource_arn, cl_json_request_resource_arn_upper, mvindex('requestParameters.resourceArn',0), mvindex('requestParameters.resourceARN',0), ""))>0, coalesce(cl_json_request_resource_arn, cl_json_request_resource_arn_upper, mvindex('requestParameters.resourceArn',0), mvindex('requestParameters.resourceARN',0)), \
	        len(coalesce(cl_json_policy_arn, mvindex('requestParameters.policyArn',0), ""))>0, coalesce(cl_json_policy_arn, mvindex('requestParameters.policyArn',0)), \
	        len(coalesce(cl_json_role_arn, mvindex('requestParameters.roleArn',0), ""))>0, coalesce(cl_json_role_arn, mvindex('requestParameters.roleArn',0)), \
	        len(coalesce(cl_json_req_user_name, mvindex('requestParameters.userName',0), ""))>0 AND len(coalesce(cl_json_recipient_account_id, cl_json_user_account_id, mvindex(recipientAccountId,0), mvindex('userIdentity.accountId',0), ""))>0, "arn:aws:iam::".coalesce(cl_json_recipient_account_id, cl_json_user_account_id, mvindex(recipientAccountId,0), mvindex('userIdentity.accountId',0)).":user/".coalesce(cl_json_req_user_name, mvindex('requestParameters.userName',0)), \
	        len(coalesce(cl_json_req_role_name, mvindex('requestParameters.roleName',0), ""))>0 AND len(coalesce(cl_json_recipient_account_id, cl_json_user_account_id, mvindex(recipientAccountId,0), mvindex('userIdentity.accountId',0), ""))>0, "arn:aws:iam::".coalesce(cl_json_recipient_account_id, cl_json_user_account_id, mvindex(recipientAccountId,0), mvindex('userIdentity.accountId',0)).":role/".coalesce(cl_json_req_role_name, mvindex('requestParameters.roleName',0)), \
	        len(coalesce(cl_json_req_group_name, mvindex('requestParameters.groupName',0), ""))>0 AND len(coalesce(cl_json_recipient_account_id, cl_json_user_account_id, mvindex(recipientAccountId,0), mvindex('userIdentity.accountId',0), ""))>0, "arn:aws:iam::".coalesce(cl_json_recipient_account_id, cl_json_user_account_id, mvindex(recipientAccountId,0), mvindex('userIdentity.accountId',0)).":group/".coalesce(cl_json_req_group_name, mvindex('requestParameters.groupName',0)), \
	        len(coalesce(cl_json_instance_id, mvindex('requestParameters.instanceId',0), ""))>0, coalesce(cl_json_instance_id, mvindex('requestParameters.instanceId',0)), \
	        len(coalesce(cl_json_instance_set_id, mvindex('requestParameters.instancesSet.items{}.instanceId',0), ""))>0, coalesce(cl_json_instance_set_id, mvindex('requestParameters.instancesSet.items{}.instanceId',0)), \
	        len(coalesce(cl_json_group_id, mvindex('requestParameters.groupId',0), ""))>0, coalesce(cl_json_group_id, mvindex('requestParameters.groupId',0)), \
