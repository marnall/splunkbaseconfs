    cl_region=coalesce(awsRegion, cl_json_region), \
    cl_action=coalesce(eventName, cl_json_action), \
    cl_event_time_raw=coalesce(eventTime, cl_json_event_time), \
    cl_event_time=coalesce(strptime(cl_event_time_raw,"%Y-%m-%dT%H:%M:%S.%Q%Z"),strptime(cl_event_time_raw,"%Y-%m-%dT%H:%M:%S%Z"),_time), \
    cl_index_time=_indextime, \
    cl_ingest_delay=if(isnotnull(_indextime),_indextime-cl_event_time,null()), \
    cl_event_category=coalesce(eventCategory,cl_json_event_category), \
    cl_management_event=coalesce(managementEvent,cl_json_management_event), \
    cl_read_only=coalesce(readOnly,cl_json_read_only), \
    cl_service=coalesce(eventSource, cl_json_service), \
    cl_error=case(lower(coalesce(nullif(errorCode,""),nullif(cl_json_error,""),""))="success",null(),1==1,coalesce(nullif(errorCode,""),nullif(cl_json_error,""),nullif(errorMessage,""),nullif(cl_json_error_message,""))), \
    cl_error_message=coalesce(nullif(errorMessage,""), nullif(cl_json_error_message,"")), \
    cl_mfa_used=coalesce('additionalEventData.MFAUsed', cl_json_mfa_used), \
    cl_console_login=coalesce('responseElements.ConsoleLogin', cl_json_console_login), \
