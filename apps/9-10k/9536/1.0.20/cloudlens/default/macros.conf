    | spath path=errorMessage output=cl_json_error_message \
    | spath path=additionalEventData.MFAUsed output=cl_json_mfa_used \
    | spath path=responseElements.ConsoleLogin output=cl_json_console_login \
    | spath path=userIdentity.type output=cl_json_principal_type \
