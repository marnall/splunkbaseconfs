    cl_src_ip=coalesce(sourceIPAddress, cl_json_src_ip), \
    cl_user_agent=coalesce(userAgent, cl_json_user_agent), \
    cl_session_creation_time=coalesce('userIdentity.sessionContext.attributes.creationDate',cl_json_session_creation_time), \
    cl_session_mfa_authenticated=coalesce('userIdentity.sessionContext.attributes.mfaAuthenticated',cl_json_session_mfa_authenticated), \
    cl_principal_type=coalesce('userIdentity.type', cl_json_principal_type), \
    cl_principal_arn=coalesce('userIdentity.arn', cl_json_principal_arn), \
    cl_access_key=coalesce('userIdentity.accessKeyId', cl_json_access_key), \
    cl_invoked_by=coalesce('userIdentity.invokedBy', cl_json_invoked_by), \
