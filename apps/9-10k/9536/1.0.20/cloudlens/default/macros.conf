#
# EventTimeline macros (legacy cloudlens_* IDs retained for compatibility)
# ----------------
# Two layers:
#  1. The source macro points at the customer's CloudTrail data.
#  2. Normalization maps CloudTrail fields to the canonical cl_* entity model
#     consumed by the investigation timelines.
#
# Tune the source macro at install time. Timeline logic never hardcodes indexes.
# =====================================================================

# --- Source macros (edit per environment) ----------------------------
[cloudlens_cloudtrail]
definition = index=aws-cloudtrail
iseval = 0

# Optional acceleration contract for the manual timeline. The default delegates
# to the portable raw source. Administrators can override this macro locally
# with a summary-index or accelerated-data-model search that returns canonical
# cl_* fields. Auto mode only selects it when its definition differs from this
# default, and any locator failure falls back to the raw CloudTrail source.
[cloudlens_timeline_locator]
definition = `cloudlens_cloudtrail`
iseval = 0

# --- Canonical entity normalization (AWS CloudTrail) ------------------
# Produces the canonical cl_* fields used everywhere downstream.
[cloudlens_normalize_aws]
definition = spath path=eventName output=cl_json_action \
    | spath path=eventSource output=cl_json_service \
    | spath path=eventID output=cl_json_event_id \
    | spath path=eventTime output=cl_json_event_time \
