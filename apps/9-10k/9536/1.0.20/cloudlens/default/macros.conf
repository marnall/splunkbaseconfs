# --- Bounded investigation normalization -----------------------------
# Hydration only needs the fields used for correlation and presentation.
# Keeping this separate from the broad detection normalizer avoids dozens of
# unrelated JSON extractions for every event in a timeline window.
[cloudlens_timeline_normalize_aws]
definition = spath path=eventName output=cl_json_action \
    | spath path=eventSource output=cl_json_service \
    | spath path=eventID output=cl_json_event_id \
    | spath path=eventTime output=cl_json_event_time \
    | spath path=awsRegion output=cl_json_region \
    | spath path=recipientAccountId output=cl_json_recipient_account_id \
    | spath path=sourceIPAddress output=cl_json_src_ip \
    | spath path=userAgent output=cl_json_user_agent \
    | spath path=errorCode output=cl_json_error \
    | spath path=errorMessage output=cl_json_error_message \
    | spath path=userIdentity.type output=cl_json_principal_type \
    | spath path=userIdentity.arn output=cl_json_principal_arn \
    | spath path=userIdentity.principalId output=cl_json_principal_id \
    | spath path=userIdentity.accessKeyId output=cl_json_access_key \
    | spath path=userIdentity.accountId output=cl_json_user_account_id \
    | spath path=userIdentity.userName output=cl_json_user_name \
    | spath path=userIdentity.invokedBy output=cl_json_invoked_by \
    | spath path=userIdentity.sessionContext.sessionIssuer.arn output=cl_json_session_issuer_arn \
    | spath path=userIdentity.sessionContext.sessionIssuer.userName output=cl_json_session_issuer_user \
    | spath path=requestParameters.bucketName output=cl_json_bucket_name \
    | spath path=requestParameters.resourceArn output=cl_json_request_resource_arn \
    | spath path=requestParameters.resourceARN output=cl_json_request_resource_arn_upper \
    | spath path=requestParameters.userName output=cl_json_req_user_name \
    | spath path=requestParameters.roleName output=cl_json_req_role_name \
    | spath path=requestParameters.accessKeyId output=cl_json_req_access_key \
    | spath path=requestParameters.instanceId output=cl_json_instance_id \
    | spath path=requestParameters.roleArn output=cl_json_role_arn \
    | spath path=requestParameters.policyArn output=cl_json_policy_arn \
    | spath path=requestParameters.roleSessionName output=cl_json_role_session_name \
    | spath path=resources{}.ARN output=cl_json_resource_arn \
    | spath path=resources{}.type output=cl_json_resource_type \
    | spath path=responseElements.accessKey.accessKeyId output=cl_json_created_access_key \
    | spath path=responseElements.credentials.accessKeyId output=cl_json_assumed_access_key \
    | spath path=responseElements.assumedRoleUser.arn output=cl_json_assumed_session_arn \
    | eval cl_cloud="aws", \
        cl_account_id=coalesce(recipientAccountId,'userIdentity.accountId',cl_json_recipient_account_id,cl_json_user_account_id), \
        cl_region=coalesce(awsRegion,cl_json_region), \
        cl_action=coalesce(eventName,cl_json_action), \
        cl_event_time_raw=coalesce(eventTime,cl_json_event_time), \
        cl_event_time=coalesce(strptime(cl_event_time_raw,"%Y-%m-%dT%H:%M:%S.%Q%Z"),strptime(cl_event_time_raw,"%Y-%m-%dT%H:%M:%S%Z"),_time), \
        cl_service=coalesce(eventSource,cl_json_service), \
        cl_error_code_value=trim(coalesce(nullif(errorCode,""),nullif(cl_json_error,""),"")), \
        cl_error_message_value=trim(coalesce(nullif(errorMessage,""),nullif(cl_json_error_message,""),"")), \
        cl_error_message=cl_error_message_value, \
        cl_error=case(cl_error_code_value!="" AND NOT match(lower(cl_error_code_value),"^(success|succeeded|ok|allowed)$"),cl_error_code_value,cl_error_message_value!="" AND NOT match(lower(cl_error_message_value),"^(success|succeeded|ok|allowed)$"),cl_error_message_value,1==1,null()), \
        cl_outcome=if(isnull(cl_error),"success","failure"), \
        cl_src_ip=coalesce(sourceIPAddress,cl_json_src_ip), \
        cl_user_agent=coalesce(userAgent,cl_json_user_agent), \
        cl_principal_type=coalesce('userIdentity.type',cl_json_principal_type), \
        cl_principal_arn=coalesce('userIdentity.arn',cl_json_principal_arn), \
        cl_access_key=coalesce('userIdentity.accessKeyId',cl_json_access_key), \
        cl_invoked_by=coalesce('userIdentity.invokedBy',cl_json_invoked_by), \
        cl_principal_id=coalesce('userIdentity.arn',cl_json_principal_arn,cl_invoked_by,'userIdentity.principalId',cl_json_principal_id,'userIdentity.accessKeyId',cl_json_access_key), \
        cl_principal_name=case(cl_principal_type="AWSService",cl_invoked_by,cl_principal_type="AWSAccount",null(),1==1,coalesce('userIdentity.userName',cl_json_user_name,'userIdentity.principalId',cl_json_principal_id)), \
        cl_resource_type=coalesce(cl_json_resource_type,mvindex('resources{}.type',0),"n/a"), \
        cl_resource_id=case( \
            len(coalesce(cl_json_bucket_name,mvindex('requestParameters.bucketName',0),""))>0,"arn:aws:s3:::".coalesce(cl_json_bucket_name,mvindex('requestParameters.bucketName',0)), \
            len(coalesce(cl_json_resource_arn,mvindex('resources{}.ARN',0),""))>0,coalesce(cl_json_resource_arn,mvindex('resources{}.ARN',0)), \
            len(coalesce(cl_json_request_resource_arn,cl_json_request_resource_arn_upper,mvindex('requestParameters.resourceArn',0),mvindex('requestParameters.resourceARN',0),""))>0,coalesce(cl_json_request_resource_arn,cl_json_request_resource_arn_upper,mvindex('requestParameters.resourceArn',0),mvindex('requestParameters.resourceARN',0)), \
            len(coalesce(cl_json_policy_arn,mvindex('requestParameters.policyArn',0),""))>0,coalesce(cl_json_policy_arn,mvindex('requestParameters.policyArn',0)), \
            len(coalesce(cl_json_role_arn,mvindex('requestParameters.roleArn',0),""))>0,coalesce(cl_json_role_arn,mvindex('requestParameters.roleArn',0)), \
            len(coalesce(cl_json_req_user_name,mvindex('requestParameters.userName',0),""))>0 AND len(coalesce(cl_account_id,""))>0,"arn:aws:iam::".cl_account_id.":user/".coalesce(cl_json_req_user_name,mvindex('requestParameters.userName',0)), \
            len(coalesce(cl_json_req_role_name,mvindex('requestParameters.roleName',0),""))>0 AND len(coalesce(cl_account_id,""))>0,"arn:aws:iam::".cl_account_id.":role/".coalesce(cl_json_req_role_name,mvindex('requestParameters.roleName',0)), \
            len(coalesce(cl_json_instance_id,mvindex('requestParameters.instanceId',0),""))>0,coalesce(cl_json_instance_id,mvindex('requestParameters.instanceId',0)), \
            1==1,"n/a"), \
        cl_event_id=coalesce(eventID,cl_json_event_id), \
        cl_session_issuer_arn=coalesce('userIdentity.sessionContext.sessionIssuer.arn',cl_json_session_issuer_arn), \
        cl_session_issuer_name=coalesce('userIdentity.sessionContext.sessionIssuer.userName',cl_json_session_issuer_user), \
        cl_role_session_name=case(cl_principal_type="AssumedRole" AND like(cl_principal_arn,"%:assumed-role/%/%"),mvindex(split(cl_principal_arn,"/"),-1),cl_principal_type="AssumedRole" AND like(cl_json_principal_id,"%:%"),mvindex(split(cl_json_principal_id,":"),-1),1==1,null()) \
    | eval cl_session_name=cl_role_session_name, \
        cl_principal_name=case(cl_principal_type="AssumedRole" AND isnotnull(cl_role_session_name),cl_role_session_name,cl_principal_type="Root","root",1==1,cl_principal_name)
iseval = 0

# --- Compact investigation normalization -----------------------------
# Used by the default timeline engine after native/raw candidate pruning.
# It omits STS response extraction while retaining the issuer fields required
# to match the role attached to the current CloudTrail event. The enriched
# engine below remains available when cross-event role lineage is requested.
[cloudlens_timeline_compact_normalize_aws]
definition = spath path=eventName output=cl_json_action \
    | spath path=eventSource output=cl_json_service \
    | spath path=eventID output=cl_json_event_id \
    | spath path=eventTime output=cl_json_event_time \
    | spath path=eventCategory output=cl_json_event_category \
    | spath path=managementEvent output=cl_json_management_event \
    | spath path=readOnly output=cl_json_read_only \
    | spath path=awsRegion output=cl_json_region \
    | spath path=recipientAccountId output=cl_json_recipient_account_id \
    | spath path=sourceIPAddress output=cl_json_src_ip \
    | spath path=userAgent output=cl_json_user_agent \
    | spath path=errorCode output=cl_json_error \
    | spath path=errorMessage output=cl_json_error_message \
    | spath path=userIdentity.type output=cl_json_principal_type \
    | spath path=userIdentity.arn output=cl_json_principal_arn \
    | spath path=userIdentity.principalId output=cl_json_principal_id \
    | spath path=userIdentity.accountId output=cl_json_user_account_id \
    | spath path=userIdentity.accessKeyId output=cl_json_access_key \
    | spath path=userIdentity.userName output=cl_json_user_name \
    | spath path=userIdentity.invokedBy output=cl_json_invoked_by \
    | spath path=userIdentity.sessionContext.sessionIssuer.arn output=cl_json_session_issuer_arn \
    | spath path=userIdentity.sessionContext.sessionIssuer.userName output=cl_json_session_issuer_user \
    | spath path=requestParameters.bucketName output=cl_json_bucket_name \
    | spath path=requestParameters.resourceArn output=cl_json_request_resource_arn \
    | spath path=requestParameters.resourceARN output=cl_json_request_resource_arn_upper \
    | spath path=requestParameters.userName output=cl_json_req_user_name \
    | spath path=requestParameters.roleName output=cl_json_req_role_name \
    | spath path=requestParameters.accessKeyId output=cl_json_req_access_key \
    | spath path=requestParameters.instanceId output=cl_json_instance_id \
    | spath path=requestParameters.roleArn output=cl_json_role_arn \
    | spath path=requestParameters.policyArn output=cl_json_policy_arn \
    | spath path=resources{}.ARN output=cl_json_resource_arn \
    | spath path=resources{}.type output=cl_json_resource_type \
    | spath path=responseElements.accessKey.accessKeyId output=cl_json_created_access_key \
    | eval cl_cloud="aws", \
        cl_account_id=coalesce(recipientAccountId,'userIdentity.accountId',cl_json_recipient_account_id,cl_json_user_account_id), \
        cl_region=coalesce(awsRegion,cl_json_region), \
        cl_action=coalesce(eventName,cl_json_action), \
        cl_event_time_raw=coalesce(eventTime,cl_json_event_time), \
        cl_event_time=coalesce(strptime(cl_event_time_raw,"%Y-%m-%dT%H:%M:%S.%Q%Z"),strptime(cl_event_time_raw,"%Y-%m-%dT%H:%M:%S%Z"),_time), \
        cl_service=coalesce(eventSource,cl_json_service), \
        cl_error_code_value=trim(coalesce(nullif(errorCode,""),nullif(cl_json_error,""),"")), \
        cl_error_message_value=trim(coalesce(nullif(errorMessage,""),nullif(cl_json_error_message,""),"")), \
        cl_error_message=cl_error_message_value, \
        cl_error=case(cl_error_code_value!="" AND NOT match(lower(cl_error_code_value),"^(success|succeeded|ok|allowed)$"),cl_error_code_value,cl_error_message_value!="" AND NOT match(lower(cl_error_message_value),"^(success|succeeded|ok|allowed)$"),cl_error_message_value,1==1,null()), \
        cl_outcome=if(isnull(cl_error),"success","failure"), \
        cl_src_ip=coalesce(sourceIPAddress,cl_json_src_ip), \
        cl_user_agent=coalesce(userAgent,cl_json_user_agent), \
        cl_principal_type=coalesce('userIdentity.type',cl_json_principal_type), \
        cl_principal_arn=coalesce('userIdentity.arn',cl_json_principal_arn), \
        cl_access_key=coalesce('userIdentity.accessKeyId',cl_json_access_key), \
        cl_invoked_by=coalesce('userIdentity.invokedBy',cl_json_invoked_by), \
        cl_principal_id=coalesce('userIdentity.arn',cl_json_principal_arn,cl_invoked_by,'userIdentity.principalId',cl_json_principal_id), \
        cl_principal_name=case(cl_principal_type="AWSService",cl_invoked_by,cl_principal_type="AWSAccount",null(),1==1,coalesce('userIdentity.userName',cl_json_user_name,'userIdentity.principalId',cl_json_principal_id)), \
        cl_resource_type=coalesce(cl_json_resource_type,mvindex('resources{}.type',0),"n/a"), \
        cl_resource_id=case( \
            len(coalesce(cl_json_bucket_name,mvindex('requestParameters.bucketName',0),""))>0,"arn:aws:s3:::".coalesce(cl_json_bucket_name,mvindex('requestParameters.bucketName',0)), \
            len(coalesce(cl_json_resource_arn,mvindex('resources{}.ARN',0),""))>0,coalesce(cl_json_resource_arn,mvindex('resources{}.ARN',0)), \
            len(coalesce(cl_json_request_resource_arn,cl_json_request_resource_arn_upper,mvindex('requestParameters.resourceArn',0),mvindex('requestParameters.resourceARN',0),""))>0,coalesce(cl_json_request_resource_arn,cl_json_request_resource_arn_upper,mvindex('requestParameters.resourceArn',0),mvindex('requestParameters.resourceARN',0)), \
            len(coalesce(cl_json_policy_arn,mvindex('requestParameters.policyArn',0),""))>0,coalesce(cl_json_policy_arn,mvindex('requestParameters.policyArn',0)), \
            len(coalesce(cl_json_role_arn,mvindex('requestParameters.roleArn',0),""))>0,coalesce(cl_json_role_arn,mvindex('requestParameters.roleArn',0)), \
            len(coalesce(cl_json_req_user_name,mvindex('requestParameters.userName',0),""))>0 AND len(coalesce(cl_account_id,""))>0,"arn:aws:iam::".cl_account_id.":user/".coalesce(cl_json_req_user_name,mvindex('requestParameters.userName',0)), \
            len(coalesce(cl_json_req_role_name,mvindex('requestParameters.roleName',0),""))>0 AND len(coalesce(cl_account_id,""))>0,"arn:aws:iam::".cl_account_id.":role/".coalesce(cl_json_req_role_name,mvindex('requestParameters.roleName',0)), \
            len(coalesce(cl_json_instance_id,mvindex('requestParameters.instanceId',0),""))>0,coalesce(cl_json_instance_id,mvindex('requestParameters.instanceId',0)), \
            1==1,"n/a"), \
        cl_event_id=coalesce(eventID,cl_json_event_id), \
        cl_event_category=coalesce(eventCategory,cl_json_event_category), \
        cl_management_event=coalesce(managementEvent,cl_json_management_event), \
        cl_read_only=coalesce(readOnly,cl_json_read_only), \
        cl_session_issuer_arn=coalesce('userIdentity.sessionContext.sessionIssuer.arn',cl_json_session_issuer_arn), \
        cl_session_issuer_name=coalesce('userIdentity.sessionContext.sessionIssuer.userName',cl_json_session_issuer_user), \
        cl_role_session_name=case(cl_principal_type="AssumedRole" AND like(cl_principal_arn,"%:assumed-role/%/%"),mvindex(split(cl_principal_arn,"/"),-1),cl_principal_type="AssumedRole" AND like(cl_json_principal_id,"%:%"),mvindex(split(cl_json_principal_id,":"),-1),1==1,null()) \
    | eval cl_session_name=cl_role_session_name, \
        cl_principal_name=case(cl_principal_type="AssumedRole" AND isnotnull(cl_role_session_name),cl_role_session_name,cl_principal_type="Root","root",1==1,cl_principal_name)
iseval = 0

# Lightweight first pass for manual username and role searches. It runs only
# after indexed term pruning and rejects unrelated candidates before the full
# timeline normalizer is applied.
[cloudlens_manual_identity_candidate_aws]
definition = spath path=userIdentity.type output=cl_candidate_principal_type \
    | spath path=userIdentity.arn output=cl_candidate_principal_arn \
    | spath path=userIdentity.principalId output=cl_candidate_principal_id \
    | spath path=userIdentity.userName output=cl_candidate_user_name \
    | spath path=userIdentity.sessionContext.sessionIssuer.arn output=cl_candidate_issuer_arn \
    | spath path=userIdentity.sessionContext.sessionIssuer.userName output=cl_candidate_issuer_name \
    | spath path=requestParameters.userName output=cl_candidate_request_user \
    | spath path=requestParameters.roleName output=cl_candidate_request_role \
    | spath path=requestParameters.roleArn output=cl_candidate_request_role_arn \
    | spath path=requestParameters.roleSessionName output=cl_candidate_request_session \
    | spath path=responseElements.assumedRoleUser.arn output=cl_candidate_assumed_arn \
    | eval cl_candidate_session_name=case( \
            cl_candidate_principal_type="AssumedRole" AND like(cl_candidate_principal_arn,"%:assumed-role/%/%"),mvindex(split(cl_candidate_principal_arn,"/"),-1), \
            cl_candidate_principal_type="AssumedRole" AND like(cl_candidate_principal_id,"%:%"),mvindex(split(cl_candidate_principal_id,":"),-1), \
            1==1,null()), \
        cl_candidate_role_name=case( \
            isnotnull(cl_candidate_issuer_name),cl_candidate_issuer_name, \
            like(cl_candidate_issuer_arn,"%:role/%"),mvindex(split(cl_candidate_issuer_arn,"/"),-1), \
            like(cl_candidate_principal_arn,"%:assumed-role/%/%"),mvindex(split(cl_candidate_principal_arn,"/"),-2), \
            1==1,null()), \
        cl_candidate_principal_name=case( \
            cl_candidate_principal_type="Root","root", \
            cl_candidate_principal_type="AssumedRole",cl_candidate_session_name, \
            1==1,coalesce(cl_candidate_user_name,cl_candidate_principal_id))
iseval = 0

# --- Role-assumption lineage helper -----------------------------------
# Extracts the assumed access key from an AssumeRole response so it can be
# joined to downstream events (the cloud analog of parent->child process).
[cloudlens_assumerole_link]
definition = eval cl_assumed_access_key=coalesce('responseElements.credentials.accessKeyId', cl_json_assumed_access_key), \
    cl_assumed_arn=coalesce('requestParameters.roleArn', cl_json_role_arn), \
    cl_assumed_session=coalesce('requestParameters.roleSessionName', cl_json_role_session_name), \
    cl_assumed_session_arn=coalesce('responseElements.assumedRoleUser.arn',cl_json_assumed_session_arn)
iseval = 0

# --- Timeline defaults (override in local/) ---------------------------
[cloudlens_lookback]
definition = -2h
iseval = 0

[cloudlens_lookahead]
definition = +2h
iseval = 0
