[surizeek]
definition = (`surizeek_suricata` OR `surizeek_zeek`)
iseval = 0

[surizeek_suricata]
definition = [| inputlookup surizeek_settings.csv | where setting="suricata_scope" | eval value="(".value.")" | return $value]
iseval = 0

[surizeek_zeek]
definition = [| inputlookup surizeek_settings.csv | where setting="zeek_scope" | eval value="(".value.")" | return $value]
iseval = 0

[surizeek_flow_key]
definition = eval kind=if(isnotnull('id.orig_h'),"zeek","suricata"), sip=coalesce(src_ip,'id.orig_h'), dip=coalesce(dest_ip,'id.resp_h'), proto_norm=case(like(lower(proto),"%icmp%"),"icmp", isnotnull(proto),lower(proto), true(),"tcp") | eval sport=if(proto_norm="icmp",0,coalesce(src_port,'id.orig_p',0)), dport=if(proto_norm="icmp",0,coalesce(dest_port,'id.resp_p',0)) | eval flow_key=mvjoin(mvsort(mvappend(sip.":".sport, dip.":".dport)),"-")."|".proto_norm
iseval = 0
