[SEC - Rajada de permission denied]
alert.severity = 5
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = 5+ erros de permission denied do mesmo caller em 15min -- possivel tentativa de acesso indevido ou automacao mal configurada. Cobre tambem acesso negado (403) e brute force. Critico.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-logs | spath input=message | search type=response error="*permission denied*" | rename "auth.display_name" as Caller | stats count by Caller | where count >= 5

[SEC - Rajada de invalid token]
alert.severity = 5
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = 5+ erros de invalid token do mesmo IP de origem em 15min -- credenciais expiradas em massa ou tentativa de uso de token invalido. Agrupa por request.remote_address, nao por Caller: token totalmente invalido nao tem identidade resolvida pelo Vault, entao auth.display_name nunca vem preenchido nesse tipo de erro (testado -- agrupar so por Caller faz esse alerta nunca disparar). Cobre brute force. Critico.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-logs | spath input=message | search type=response error="*invalid token*" | rename "auth.display_name" as Caller, "request.remote_address" as SourceIP | fillnull value="(sem identidade)" Caller | stats count by SourceIP, Caller | where count >= 5

[SEC - Falha de autenticacao]
alert.severity = 5
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
description = Qualquer falha de autenticacao (login invalido, token expirado ou revogado) nos ultimos 5min -- alerta por ocorrencia individual, diferente das rajadas acima que exigem 5+ eventos. Critico.
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-logs | spath input=message | search type=response "request.path"="auth/*" error="*" | rename "auth.display_name" as Caller, "request.path" as Path, "request.namespace.path" as Namespace | table _time, Caller, Namespace, Path, error

[SEC - Token root criado]
alert.severity = 5
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = Token criado com policy root ou hcp-root -- operacao com token de maior privilegio possivel no cluster, deve ser sempre revisada. Critico.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-logs token/create | spath input=message | search "request.path"="auth/token/create" type=response ("response.auth.token_policies{}"="root" OR "response.auth.token_policies{}"="hcp-root") | rename "auth.display_name" as Caller, "request.namespace.path" as Namespace | table _time, Caller, Namespace, "response.auth.token_policies{}", response.auth.token_ttl

[SEC - Revogacao de token]
alert.severity = 4
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = Token revogado (revoke, revoke-accessor, revoke-orphan ou revoke-self). O audit log nao registra as policies do token revogado na propria requisicao, entao nao da pra distinguir automaticamente token root de token comum aqui -- revisar manualmente se aparentar ser token root. Exclui o caller jwt-msp: e o service principal interno do proprio HCP fazendo revogacao de rotina de tokens internos de curta duracao, confirmado em teste (19 eventos desse caller em minutos, sem nenhuma acao do usuario) -- ruido de plataforma, nao evento de seguranca. Alto.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-logs token/revoke | spath input=message | search type=request "request.path"="auth/token/revoke*" "auth.display_name"!="jwt-msp" | rename "auth.display_name" as Caller, "request.namespace.path" as Namespace, "request.path" as Path | table _time, Caller, Namespace, Path

[SEC - Token com TTL longo]
alert.severity = 4
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = Token criado com TTL >= 30 dias -- pratica de risco, deveria usar tokens de vida curta com renovacao. Separado do alerta de token root (SEC - Token root criado). Alto.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-logs token/create | spath input=message | search "request.path"="auth/token/create" type=response response.auth.token_ttl>=2592000 | rename "auth.display_name" as Caller, "request.namespace.path" as Namespace | table _time, Caller, Namespace, "response.auth.token_policies{}", response.auth.token_ttl

[SEC - Namespace ou policy alterado]
alert.severity = 4
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = Namespace ou policy foi criado/alterado/removido -- mudanca na estrutura de seguranca, deve ser sempre revisada. Alto.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-logs (sys/namespaces OR sys/policies) | spath input=message | search type=request ("request.path"="sys/namespaces/*" OR "request.path"="sys/policies/*") "request.operation"!=read "request.operation"!=list | rename "auth.display_name" as Caller | stats count by "request.path", "request.operation", Caller

[SEC - Auth Method habilitado ou desabilitado]
alert.severity = 4
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = Auth method habilitado ou desabilitado (sys/auth/*) -- muda a superficie de autenticacao do cluster, deve ser sempre revisado. O Vault registra habilitar um auth method como request.operation=update (nao "create") -- confirmado em teste, o filtro original so pegava o delete. Alto.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-logs sys/auth | spath input=message | search type=request "request.path"="sys/auth/*" ("request.operation"="update" OR "request.operation"="delete") | rename "auth.display_name" as Caller, "request.path" as Path, "request.operation" as Operacao | stats count by Path, Operacao, Caller

[SEC - Acesso fora do horario comercial]
alert.severity = 4
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = Requisicoes ao Vault fora do horario comercial (seg-sex, 08h-18h, horario de Brasilia) -- correlacao temporal, pode indicar acesso indevido ou automacao fora de janela. Nao usa date_hour/date_wday nativos porque o Splunk deste cluster roda em GMT (confirmado em teste com strftime(now())) -- calcula o horario de Brasilia aplicando offset fixo de -3h sobre _time (Brasil nao tem horario de verao desde 2019, entao o offset e fixo o ano todo, sem precisar de banco de fusos horarios). Se o servidor Splunk mudar de fuso no futuro, esse offset precisa ser revisado. Alto.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-logs | spath input=message | search type=request | rename "auth.display_name" as Caller, "request.path" as Path | eval br_hour=tonumber(strftime(_time-10800,"%H")), br_wday=strftime(_time-10800,"%A") | where br_wday="Saturday" OR br_wday="Sunday" OR br_hour<8 OR br_hour>=18 | stats count by Caller, Path, br_wday, br_hour

[SEC - Leitura de segredos sensiveis]
alert.severity = 4
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = Leitura de segredo KV -- trata todo kv/data/* como sensivel, ja que e o unico secrets engine ativo neste cluster (sem convencao secret/prod/* separada). Alto.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-logs kv/data | spath input=message | search type=request "request.operation"="read" "request.path"="kv/data/*" | rename "auth.display_name" as Caller, "request.namespace.path" as Namespace, "request.path" as Path | table _time, Caller, Namespace, Path

[SEC - Delecao de segredos]
alert.severity = 4
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = Delecao de segredo KV (versao especifica em kv/data/* ou delecao completa em kv/metadata/*) -- trata todo kv/* como sensivel, mesmo criterio do alerta de leitura. Alto.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-logs kv | spath input=message | search type=request "request.operation"="delete" ("request.path"="kv/data/*" OR "request.path"="kv/metadata/*") | rename "auth.display_name" as Caller, "request.namespace.path" as Namespace, "request.path" as Path | table _time, Caller, Namespace, Path

[SEC - Geracao de credenciais dinamicas]
alert.severity = 3
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = Geracao de credencial dinamica (database/aws) por usuario, root ou SAML -- exclui auth automatizado (ex: approle) de proposito, foco em acesso humano direto a credenciais de curta duracao. Nao ha secrets engine dinamica habilitada neste cluster ainda -- alerta fica pronto mas nao dispara ate database/ ou aws/ serem montados; nomes de campo (auth.mount_type) baseados na documentacao oficial do audit log do Vault, nao validados contra evento real deste ambiente. Medio.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-logs | spath input=message | search type=response ("request.path"="database/creds/*" OR "request.path"="aws/creds/*" OR "request.path"="aws/sts/*") ("auth.mount_type"="userpass" OR "auth.mount_type"="saml" OR "auth.mount_type"="token") | rename "auth.display_name" as Caller, "request.path" as Path, "request.namespace.path" as Namespace, "auth.mount_type" as AuthMethod | table _time, Caller, Namespace, Path, AuthMethod

[SEC - Renovacao de lease suspeita]
alert.severity = 3
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = 5+ renovacoes de lease/token pelo mesmo caller em 15min -- padrao anomalo de renovacao, mesmo criterio de rajada usado nos outros alertas de seguranca deste app. Threshold ilustrativo para lab, ajustar conforme baseline real. Medio.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-logs | spath input=message | search type=request ("request.path"="sys/leases/renew" OR "request.path"="auth/token/renew*") | rename "auth.display_name" as Caller | stats count by Caller | where count >= 5

[STAB - Cluster Sealed]
alert.severity = 5
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
description = Cluster Vault esta Sealed -- fora do ar, nao processa nenhuma requisicao. Alerta critico, checado a cada 5min.
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-metrics name=vault_core_unsealed | stats latest(gauge.value) as sealed | where sealed=0

[STAB - CPU alto por instancia]
alert.severity = 3
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = CPU de alguma instancia do cluster acima de 85% -- risco de capacidade. Threshold ilustrativo para lab, ajustar conforme baseline real.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-metrics name=cpu_seconds_total tags.mode=idle | bucket _time span=5m | stats rate(counter.value) as rateI by _time, tags.instance_id, tags.cpu | eval util=(1-rateI)*100 | stats avg(util) as util by _time, tags.instance_id | where isnotnull(util) | stats latest(util) as latest_util by tags.instance_id | where latest_util > 85

[STAB - Disk alto por instancia]
alert.severity = 3
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = Disco de alguma instancia do cluster acima de 85% -- risco de capacidade. Threshold ilustrativo para lab, ajustar conforme baseline real.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-metrics (name=filesystem_total_bytes OR name=filesystem_free_bytes) | bucket _time span=5m | stats sum(eval(if(name="filesystem_total_bytes",'gauge.value',0))) as total sum(eval(if(name="filesystem_free_bytes",'gauge.value',0))) as free by _time, tags.instance_id | eval util=(total-free)*100/total | where isnotnull(util) | stats latest(util) as latest_util by tags.instance_id | where latest_util > 85

[STAB - Memory alto por instancia]
alert.severity = 3
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = Memoria de alguma instancia do cluster acima de 85% -- risco de capacidade. Threshold ilustrativo para lab, ajustar conforme baseline real.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-metrics (name=memory_total_bytes OR name=memory_available_bytes) | bucket _time span=5m | stats sum(eval(if(name="memory_total_bytes",'gauge.value',0))) as total sum(eval(if(name="memory_available_bytes",'gauge.value',0))) as free by _time, tags.instance_id | eval util=(total-free)*100/total | where isnotnull(util) | stats latest(util) as latest_util by tags.instance_id | where latest_util > 85

[STAB - Pipeline de metricas sem dados]
alert.severity = 5
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */15 * * * *
description = Nenhuma metrica recebida do HCP Vault nos ultimos 15min -- indica que o streaming HEC parou (o mesmo tipo de falha silenciosa que motivou este projeto inteiro). Alerta critico.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=hcp-vault-metrics | stats count | where count=0

[REPORT - Weekly Activity Summary]
description = Resumo semanal de atividade: quem fez o que e quantas vezes, ultimos 7 dias. Ponto de partida pra revisao periodica de uso do cluster.
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
search = index=hcp-vault-logs | spath input=message | search type=request | rename "auth.display_name" as Caller, "request.operation" as Operacao | fillnull value="(sem identidade)" Caller | stats count by Caller, Operacao | sort - count

[REPORT - Privileged or Long-TTL Tokens Created]
description = Auditoria de seguranca: todo token criado com policy root/hcp-root ou TTL >= 30 dias nos ultimos 30 dias. Revisar periodicamente -- pratica de risco, deveria usar tokens de vida curta com renovacao.
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
search = index=hcp-vault-logs token/create | spath input=message | search "request.path"="auth/token/create" type=response | search ("response.auth.token_policies{}"="root" OR "response.auth.token_policies{}"="hcp-root" OR response.auth.token_ttl>=2592000) | rename "auth.display_name" as Caller, "request.namespace.path" as Namespace | fillnull value="(sem identidade)" Caller | table _time, Caller, Namespace, "response.auth.token_policies{}", response.auth.token_ttl | sort - _time

[REPORT - Failed Authentication and Permission Denials]
description = Todas as falhas de permission denied e invalid token dos ultimos 7 dias, agrupadas por quem tentou, o que tentou fazer e o erro exato. Revisao de seguranca -- picos aqui podem indicar tentativa de acesso indevido.
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
search = index=hcp-vault-logs | spath input=message | search type=response (error="*permission denied*" OR error="*invalid token*") | rename "auth.display_name" as Caller, "request.path" as Path, "request.namespace.path" as Namespace | rex mode=sed field=error "s/\d+ errors? occurred:\n\t\* //" | rex mode=sed field=error "s/\n\n$//" | fillnull value="(sem identidade)" Caller | fillnull value="(sem namespace)" Namespace | stats count by Caller, Path, Namespace, error | sort - count

[REPORT - Namespace and Policy Change History]
description = Historico de mudancas na estrutura de seguranca (namespaces e policies criados/alterados/removidos) nos ultimos 30 dias. Auditoria de change-management.
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
search = index=hcp-vault-logs (sys/namespaces OR sys/policies) | spath input=message | search type=request ("request.path"="sys/namespaces/*" OR "request.path"="sys/policies/*") "request.operation"!=read "request.operation"!=list | rename "auth.display_name" as Caller | fillnull value="(sem identidade)" Caller | stats count by "request.path", "request.operation", Caller | sort - count

[REPORT - CPU Utilization Daily Trend]
description = Pico diario de CPU por instancia, ultimos 7 dias -- tendencia pra planejamento de capacidade, distinto da visao ao vivo do dashboard.
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
search = index=hcp-vault-metrics name=cpu_seconds_total tags.mode=idle | bucket _time span=5m | stats rate(counter.value) as rateI by _time, tags.instance_id, tags.cpu | eval util=(1-rateI)*100 | stats avg(util) as util by _time, tags.instance_id | where isnotnull(util) | eval util=round(util,1) | timechart span=1d max(util) as "Max CPU %" by tags.instance_id

[REPORT - Disk Utilization Daily Trend]
description = Pico diario de uso de disco por instancia, ultimos 7 dias -- tendencia pra planejamento de capacidade, distinto da visao ao vivo do dashboard.
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
search = index=hcp-vault-metrics (name=filesystem_total_bytes OR name=filesystem_free_bytes) | bucket _time span=5m | stats sum(eval(if(name="filesystem_total_bytes",'gauge.value',0))) as total sum(eval(if(name="filesystem_free_bytes",'gauge.value',0))) as free by _time, tags.instance_id | eval util=(total-free)*100/total | where isnotnull(util) | eval util=round(util,1) | timechart span=1d max(util) as "Max Disk %" by tags.instance_id

[REPORT - Memory Utilization Daily Trend]
description = Pico diario de uso de memoria por instancia, ultimos 7 dias -- tendencia pra planejamento de capacidade, distinto da visao ao vivo do dashboard.
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
search = index=hcp-vault-metrics (name=memory_total_bytes OR name=memory_available_bytes) | bucket _time span=5m | stats sum(eval(if(name="memory_total_bytes",'gauge.value',0))) as total sum(eval(if(name="memory_available_bytes",'gauge.value',0))) as free by _time, tags.instance_id | eval util=(total-free)*100/total | where isnotnull(util) | eval util=round(util,1) | timechart span=1d max(util) as "Max Memory %" by tags.instance_id
