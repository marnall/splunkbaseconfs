#
# Eventgen Manager
# UI for configuring and controlling SA-Eventgen data generation.
#
# Do not edit this file. Copy any stanza you want to change into
# $SPLUNK_HOME/etc/apps/eventgen_manager/local/app.conf and edit it there.
#

[id]
name = eventgen_manager
version = 1.0.0

[install]
is_configured = false
state = enabled
build = 2

[launcher]
author = Kamal Singh Bisht
version = 1.0.0
description = Configure, preview, and control SA-Eventgen data generation from the browser. No more hand-editing eventgen.conf.

[package]
id = eventgen_manager
check_for_updates = true

[ui]
is_visible = true
label = Eventgen Manager
docs_section_override = AddOns

[triggers]
# Picking up UI-authored stanzas must not require a Splunk restart.
reload.eventgen = simple
