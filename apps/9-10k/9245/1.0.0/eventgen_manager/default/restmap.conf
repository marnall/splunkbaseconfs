#
# Custom REST API backing the Eventgen Manager UI.
#
# Base path: /services/eventgen_manager/api
#
# Handles the work the stock configs/ endpoints cannot do: reading and writing
# sample files on disk, rendering a token-replacement preview, and reporting
# install health.
#

[script:eventgen_manager_api]
match                 = /eventgen_manager/api
script                = eventgen_api.py
scripttype            = persist
handler               = eventgen_api.EventgenManagerApi
requireAuthentication = true
output_modes          = json
passPayload           = true
passHttpHeaders       = true
passSession           = true
python.version        = python3
python.required       = 3.13
# These must name capabilities Splunk actually defines. edit_modinput is not
# one of them, and requiring it denied every POST and DELETE to this endpoint
# for every user, administrators included.
capability.get        = list_inputs
capability.post       = admin_all_objects
capability.delete     = admin_all_objects
