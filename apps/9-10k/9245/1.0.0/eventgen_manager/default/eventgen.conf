#
# Starter configurations for Eventgen Manager.
#
# All four ship turned off. Open the Configurations page, press Start on the
# one you want, and events begin at the next interval. Use Clone to make your
# own copy before changing anything, so an app upgrade cannot overwrite it.
#
# Do not edit this file. The UI writes to
# $SPLUNK_HOME/etc/apps/eventgen_manager/local/eventgen.conf, which takes
# precedence over everything here.
#


# --------------------------------------------------------------------------
# Web access logs.
# Shows: timestamps, random addresses, values pulled from a file, a weighted
# list, and a random response size. The event *count* still follows the
# hour-of-day curve below; only per-token rating is unavailable.
# --------------------------------------------------------------------------
[access_combined.sample]
disabled = true
mode = sample
interval = 10
count = 20
earliest = -10s
latest = now
randomizeCount = 0.2
outputMode = modinput
index = main
sourcetype = access_combined
source = eventgen:access_combined

# Traffic that dips overnight and peaks late afternoon.
hourOfDayRate = { "0": 0.15, "1": 0.1, "2": 0.08, "3": 0.08, "4": 0.1, "5": 0.15, "6": 0.25, "7": 0.4, "8": 0.6, "9": 0.75, "10": 0.85, "11": 0.9, "12": 0.85, "13": 0.9, "14": 0.95, "15": 1.0, "16": 0.95, "17": 0.85, "18": 0.7, "19": 0.6, "20": 0.5, "21": 0.4, "22": 0.3, "23": 0.2 }
dayOfWeekRate = { "0": 0.5, "1": 1.0, "2": 1.0, "3": 0.95, "4": 1.0, "5": 0.9, "6": 0.45 }

token.0.token = ^\d+\.\d+\.\d+\.\d+
token.0.replacementType = random
token.0.replacement = ipv4

token.1.token = \[([^\]]+)\]
token.1.replacementType = timestamp
token.1.replacement = %d/%b/%Y:%H:%M:%S %z

token.2.token = - (\w+) \[
token.2.replacementType = mvfile
token.2.replacement = users.sample:1

token.3.token = HTTP/1\.1" (\d{3})
token.3.replacementType = random
token.3.replacement = list["200","200","200","200","201","204","304","401","403","404","500"]

# Not "rated": the 8.2.1 generator rejects it and substitutes an empty
# string, leaving a blank response size on every event. See the note on
# [app_json.sample].
token.4.token = " \d{3} (\d+)
token.4.replacementType = random
token.4.replacement = integer[120:48000]


# --------------------------------------------------------------------------
# Linux authentication logs.
# Shows: a syslog timestamp, a host name drawn from a list file, and two
# columns of the same user file staying consistent within one event.
# --------------------------------------------------------------------------
[linux_secure.sample]
disabled = true
mode = sample
interval = 30
count = 6
earliest = -30s
latest = now
outputMode = modinput
index = main
sourcetype = linux_secure
source = eventgen:linux_secure

token.0.token = ^\w{3}\s+\d+ \d{2}:\d{2}:\d{2}
token.0.replacementType = timestamp
token.0.replacement = %b %e %H:%M:%S

token.1.token = ^\S+ \d+ \S+ (\w+)
token.1.replacementType = file
token.1.replacement = hosts.sample

token.2.token = \d+\.\d+\.\d+\.\d+
token.2.replacementType = random
token.2.replacement = ipv4

token.3.token = \[(\d+)\]
token.3.replacementType = random
token.3.replacement = integer[2000:65000]


# --------------------------------------------------------------------------
# Structured application logs.
# Shows: an ISO 8601 timestamp, a generated trace identifier, matching user
# columns, and a random latency.
# --------------------------------------------------------------------------
[app_json.sample]
disabled = true
mode = sample
interval = 5
count = 25
earliest = -5s
latest = now
randomizeCount = 0.3
randomizeEvents = true
outputMode = modinput
index = main
sourcetype = _json
source = eventgen:app_json

token.0.token = "timestamp":"(.*?)"
token.0.replacementType = timestamp
token.0.replacement = %Y-%m-%dT%H:%M:%S.%fZ

token.1.token = "trace_id":"(\w+)"
token.1.replacementType = random
token.1.replacement = hex(16)

token.2.token = "user":"(\w+)"
token.2.replacementType = mvfile
token.2.replacement = users.sample:1

token.3.token = "host":"([\w.]+)"
token.3.replacementType = file
token.3.replacement = hosts.sample

# "rated" is documented in SA-Eventgen's own spec but the 8.2.1 generator
# rejects it ("No random token type detected for replacement"), substitutes
# nothing, and leaves "latency_ms": with no value. That is invalid JSON, so
# the _json sourcetype discards the whole event and nothing reaches the
# index. "random" produces the same kind of value and actually works.
token.4.token = "latency_ms":(\d+)
token.4.replacementType = random
token.4.replacement = integer[4:1800]

token.5.token = "level":"(\w+)"
token.5.replacementType = random
token.5.replacement = list["INFO","INFO","INFO","INFO","INFO","DEBUG","WARN","ERROR"]


# --------------------------------------------------------------------------
# Firewall traffic.
# Shows: a counter that never repeats, which is useful for connection and
# session identifiers that must stay unique across a run.
# --------------------------------------------------------------------------
[firewall_traffic.sample]
disabled = true
mode = sample
interval = 15
count = 12
earliest = -15s
latest = now
outputMode = modinput
index = main
sourcetype = cisco:asa
source = eventgen:firewall

token.0.token = ^\w{3} \d{2} \d{4} \d{2}:\d{2}:\d{2}
token.0.replacementType = timestamp
token.0.replacement = %b %d %Y %H:%M:%S

token.1.token = connection (\d+)
token.1.replacementType = integerid
token.1.replacement = 88000

token.2.token = outside:(\d+\.\d+\.\d+\.\d+)
token.2.replacementType = random
token.2.replacement = ipv4

# Not "rated": the 8.2.1 generator rejects it and substitutes an empty
# string, leaving bytes= blank. See the note on [app_json.sample].
token.3.token = bytes=(\d+)
token.3.replacementType = random
token.3.replacement = integer[0:250000]
