#
# Search head cluster replication for eventgen configuration.
#
# Configurations written through this app land in eventgen.conf, which is a
# custom configuration file. Splunk replicates a known list of files between
# search head cluster members, and anything not on that list stays on the
# member it was written to. Without this, a configuration created on one
# member is invisible on the others.
#

[shclustering]
conf_replication_include.eventgen = true
