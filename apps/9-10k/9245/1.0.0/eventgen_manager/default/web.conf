#
# Splunk Web only proxies splunkd endpoints that are explicitly exposed.
# These stanzas let the Eventgen Manager pages reach the endpoints they need
# through /splunkd/__raw.
#

# --- Custom API (sample files, preview, health) ---

[expose:eventgen_manager_api]
pattern = eventgen_manager/api
methods = GET,POST,DELETE

[expose:eventgen_manager_api_specified]
pattern = eventgen_manager/api/*
methods = GET,POST,DELETE

# --- eventgen.conf CRUD via the stock configs endpoint ---

[expose:eventgen_conf]
pattern = configs/conf-eventgen
methods = GET,POST

[expose:eventgen_conf_specified]
pattern = configs/conf-eventgen/*
methods = GET,POST,DELETE

# --- SA-Eventgen modular input control ---

[expose:eventgen_modinput]
pattern = data/inputs/modinput_eventgen
methods = GET,POST

[expose:eventgen_modinput_specified]
pattern = data/inputs/modinput_eventgen/*
methods = GET,POST,DELETE

# A wildcard matches one path segment only, so the action endpoints need
# stanzas of their own. Splunk's own web.conf does the same for
# search/jobs/*/control. Without these the proxy rejects the request and the
# generator cannot be started from the UI.

[expose:eventgen_modinput_enable]
pattern = data/inputs/modinput_eventgen/*/enable
methods = POST

[expose:eventgen_modinput_disable]
pattern = data/inputs/modinput_eventgen/*/disable
methods = POST
