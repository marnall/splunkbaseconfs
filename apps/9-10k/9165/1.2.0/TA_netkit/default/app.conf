[launcher]
version = 1.2.0
description = NetKit Add-on. Network probes that run on any full Splunk Enterprise instance (Heavy Forwarder, standalone, or search head): TCP-connect latency, internet throughput, TLS certificate inspection, and DNS lookups. Companion to the NetKit App.
author = David Twersky

[id]
version = 1.2.0
name = TA_netkit

[install]
build = 1785272321
is_configured = false
state = enabled

[package]
id = TA_netkit
check_for_updates = true

[ui]
label = NetKit Add-on
is_visible = true

[triggers]
reload.ta_netkit_settings = simple
reload.ta_netkit_domain_group = simple
reload.ta_netkit_dns_resolver = simple
reload.ta_netkit_certificate_authority = simple
