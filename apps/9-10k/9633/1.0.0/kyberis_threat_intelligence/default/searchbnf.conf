[kyberis-command]
syntax = kyberis field=<string> (profile=<string>)? (objective=<string>)? (cache=<bool>)? (cim=<bool>)?
shortdesc = Enrich events with Kyberis threat intelligence verdicts for IOC fields.
description = Streaming command that reads indicator values (IPs, domains, URLs, \
    hashes, emails) from the named event field(s), deduplicates them, and enriches \
    them in batches against the Kyberis API. Appends kyberis_* fields to each \
    event: urgency, score, threat, confidence, resolution, entity, actions, \
    caveats, and status. Verdicts with kyberis_threat at or above cim_min_threat \
    (kyberis.conf, default medium) also gain CIM Threat Intelligence fields \
    (threat_match_field, threat_match_value, threat_key, threat_collection, \
    threat_collection_key, threat_group, threat_category) for Enterprise Security \
    consumption; cim=false suppresses them for one search. field accepts a \
    comma-separated list of field names. \
    profile selects a named credential profile (defaults to default_profile from \
    kyberis.conf). objective overrides the reported enrichment objective; it must \
    never contain search text. Successful results are cached across searches in \
    the kyberis_ioc_cache KV Store collection for cache_ttl_seconds (kyberis.conf, \
    default 24h); cache=false bypasses the cache for one search. Requires the \
    list_storage_passwords capability.
usage = public
example1 = ... | kyberis field=src_ip
comment1 = Enrich the src_ip field of each event with Kyberis verdicts.
example2 = ... | kyberis field="src_ip,dest_ip" profile=soc_team
comment2 = Enrich two fields using the "soc_team" credential profile. Quote the \
    field list — an unquoted comma ends the option value.
example3 = ... | kyberis field=file_hash cache=false
comment3 = Force fresh verdicts from the API, ignoring cached results.
example4 = ... | kyberis field=src_ip | where isnotnull(threat_match_value)
comment4 = Keep only events whose indicator qualified as a CIM threat match \
    (kyberis_threat at or above cim_min_threat).
tags = kyberis

[kyberischeck-command]
syntax = kyberischeck (profile=<string>)?
shortdesc = Verify Kyberis configuration and credential profile resolution.
description = Resolves a named Kyberis credential profile (API key from Splunk \
    secure storage plus settings from kyberis.conf) into a ready API client and \
    reports the effective configuration. The API key itself is never emitted. \
    Requires the list_storage_passwords capability.
usage = public
example1 = | kyberischeck
comment1 = Check the default credential profile.
example2 = | kyberischeck profile=soc_team
comment2 = Check the named credential profile "soc_team".
tags = kyberis
