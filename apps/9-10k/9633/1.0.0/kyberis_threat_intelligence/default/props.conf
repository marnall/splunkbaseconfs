# Enrichment events written by the Kyberis enrichment alert action: one
# single-line JSON object per indicator. No timestamp is embedded in the
# event body — the moment of indexing is the moment of enrichment.

[kyberis:threat_activity]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
DATETIME_CONFIG = CURRENT
TRUNCATE = 65536
KV_MODE = json
category = Structured
description = Kyberis threat enrichment results indexed by the Kyberis enrichment alert action
