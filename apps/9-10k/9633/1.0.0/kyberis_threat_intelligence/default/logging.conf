# Logging for the app's custom search commands (splunklib loads this file per
# command invocation; override in local/logging.conf). Handlers write to
# stderr, which Splunk captures into the search's search.log. Root stays at
# INFO so operational lines like the per-search cache stats
# ("kyberis cache: N hit(s), ...") are visible when troubleshooting.

[loggers]
keys = root, splunklib

[logger_root]
level = INFO
handlers = stderr

[logger_splunklib]
level = WARNING
handlers = stderr
qualname = splunklib
propagate = 0

[handlers]
keys = stderr

[handler_stderr]
class = StreamHandler
level = NOTSET
formatter = search
args = (sys.stderr,)

[formatters]
keys = search

[formatter_search]
format = %(levelname)s %(name)s: %(message)s
