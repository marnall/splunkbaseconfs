# Indexed Kyberis threat activity (written by the Kyberis enrichment alert
# action) — search-time | kyberis output cannot carry tags, so data model
# membership only applies to indexed results. Tagged "threat" in tags.conf to
# satisfy the Threat_Activity constraint of the Threat Intelligence data model
# shipped with Splunk Enterprise Security. The alert action indexes every
# verdict (benign ones included, so analysts see the answer), but in ES
# semantics tag=threat marks an actual threat match — hence the eventtype
# requires the CIM threat_* fields, which cim.py only emits for verdicts at
# or above cim_min_threat.

[kyberis_threat_activity]
search = sourcetype=kyberis:threat_activity threat_match_value=*
