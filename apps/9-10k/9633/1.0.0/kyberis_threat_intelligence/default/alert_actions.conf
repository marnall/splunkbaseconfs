# Kyberis enrichment alert action (bin/kyberis_enrichment.py). Works from
# core Splunk alert actions and, via the Common Action Model metadata in
# param._cam, as an ES 7 adaptive response action in incident review.
# Enriches indicator fields from the triggering results through the shared
# Enricher core and indexes one kyberis:threat_activity event per indicator
# (see props.conf for the sourcetype, eventtypes.conf/tags.conf for the
# tag=threat data model wiring).

[kyberis_enrichment]
is_custom = 1
label = Kyberis enrichment
description = Enrich indicator fields from the alert results with Kyberis threat verdicts and index them as kyberis:threat_activity events.
icon_path = appIcon.png
payload_format = json
python.version = python3
python.required = 3.13

# Comma-separated result fields to read indicator values from; fields absent
# from a result row are skipped.
param.fields = src,dest,src_ip,dest_ip,domain,url,file_hash
# Credential profile; empty uses default_profile from kyberis.conf.
param.profile =
# Index the enrichment events are written to.
param.index = main
# Cap on unique indicators enriched per invocation (cost guard for
# misconfigured scheduled alerts); 0 removes the cap.
param.max_indicators = 100

param._cam = {"category": ["Information Gathering"], "task": ["scan"], "subject": ["network", "endpoint"], "technology": [{"vendor": "Kyberis", "product": "Threat Intelligence", "version": ["1.0.0"]}], "supports_adhoc": true, "supports_cloud": true}
