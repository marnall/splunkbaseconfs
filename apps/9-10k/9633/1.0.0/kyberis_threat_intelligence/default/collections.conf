# Cross-search TTL cache for | kyberis enrichment results. One document per
# indicator value: _key = SHA-256 of the raw indicator, plus the original
# indicator, a fetched_at epoch timestamp, the base_url the result was
# fetched from (reads ignore documents from a different base_url, so
# re-pointing environments never serves stale foreign verdicts), and the
# flat kyberis_* result fields (kept top-level so admins can inspect cache
# contents). Expiry is lazy — expired documents are ignored on read and
# swept opportunistically during searches; the app runs no background jobs.
#
# SECURITY: write access to this collection is admin-only (the app-level
# default in metadata/default.meta) and must stay that way. Cached documents
# are trusted as authentic Kyberis verdicts — a role that can write here can
# plant benign-looking results for malicious indicators (cache poisoning).
# Do not broaden the collection ACL; non-admin searches degrade gracefully
# to read-only cache use.
[kyberis_ioc_cache]
field.indicator = string
field.fetched_at = number
field.base_url = string
accelerated_fields.by_fetched_at = {"fetched_at": 1}
