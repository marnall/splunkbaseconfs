[install]
is_configured = false
state = enabled
build = 1

[id]
name = kyberis_threat_intelligence
version = 1.0.0

[launcher]
author = Kyberis
description = Kyberis threat intelligence enrichment and investigation for Splunk. Enrich IOCs from search results with Kyberis verdicts, scores, and context via the | kyberis custom search command and an ES adaptive response action.
version = 1.0.0

[package]
id = kyberis_threat_intelligence
# Must stay enabled: Splunkbase rejects uploads with update checks disabled,
# so users are notified when a new version is published. Set this to false
# only for private apps that are never published to Splunkbase. AppInspect's
# check_for_updates_disabled check warns about the value being true, but that
# check targets private apps and does not apply here.
check_for_updates = true

[ui]
is_visible = true
label = Kyberis Threat Intelligence
setup_view = kyberis_setup

[triggers]
reload.kyberis = simple
reload.logging = simple
