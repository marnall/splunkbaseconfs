
[secalerts_comments]
case_sensitive_match = 1
external_type = kvstore
fields_list = alert_id,comment,user,created,assigned_to,status,disposition,customkey
max_matches = 1000
min_matches = 1

[secalerts_userfilters]
case_sensitive_match = 1
collection = secalerts_userfilters
external_type = kvstore
fields_list = the_user,savedfilters
