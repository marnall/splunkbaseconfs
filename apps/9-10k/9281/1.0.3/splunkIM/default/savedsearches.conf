# Saved Searches for Splunk Incident Management (splunkIM)

[SplunkIM - Summary Event Aggregator]
search = index=summary marker="app=splunkIM" OR search_name=* \
| eval _key = md5(host . "::" . coalesce(mapped_category, search_name, "general_alert")) \
| eval now_time = now() \
| stats \
    count as incoming_count, \
    min(_time) as incoming_first_seen, \
    max(_time) as incoming_last_seen, \
    first(search_name) as search_name, \
    first(severity) as incoming_sev, \
    first(orig_source) as orig_source, \
    first(description) as description \
  by _key, host \
| lookup splunkim_incidents_lookup _key OUTPUT status, owner, severity as existing_sev, event_count as existing_count, first_seen as existing_first_seen, last_seen as existing_last_seen, resolved_at \
| lookup splunkim_severity_lookup raw_severity_value as incoming_sev OUTPUT target_severity as mapped_custom_sev \
| eval incident_id = coalesce(_key, "INC-" . substr(md5(host . search_name), 1, 8)) \
| eval incident_name = coalesce(search_name, "Security Alert") . " on " . host \
| eval mapped_category = coalesce(mapped_category, search_name, "Security Alert") \
| eval first_seen = coalesce(existing_first_seen, incoming_first_seen) \
| eval last_seen = max(coalesce(existing_last_seen, 0), incoming_last_seen) \
| eval event_count = coalesce(existing_count, 0) + incoming_count \
| eval severity = coalesce(existing_sev, mapped_custom_sev, incoming_sev, "Medium") \
| eval time_since_resolved = now_time - coalesce(resolved_at, 0) \
| eval status = case( \
    isnull(status) OR status="", "New", \
    status="Resolved" AND time_since_resolved <= 86400, "Active", \
    status="Resolved" AND time_since_resolved > 86400, "New", \
    1=1, status \
  ) \
| eval owner = coalesce(owner, "Unassigned") \
| outputlookup splunkim_incidents_lookup append=t key_field=_key
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 1
disabled = 0
description = Background worker that ingests raw summary index events, applies 24h aggregation window, 24h auto re-open rule, and updates KV Store.
