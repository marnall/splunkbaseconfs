# Search Macros for Splunk Incident Management (splunkIM)

[splunkim_list_incidents]
definition = inputlookup splunkim_incidents_lookup \
| eval _time=coalesce(last_seen, now()) \
| eval incident_id=coalesce(incident_id, _key) \
| eval incident_name=coalesce(incident_name, search_name . " on " . host, "Incident on " . host) \
| eval status=coalesce(status, "New") \
| eval owner=coalesce(owner, "Unassigned") \
| eval severity=coalesce(severity, "Medium") \
| eval first_seen_str=if(isnotnull(first_seen), strftime(first_seen, "%Y-%m-%d %H:%M:%S"), strftime(now()-3600, "%Y-%m-%d %H:%M:%S")) \
| eval last_seen_str=if(isnotnull(last_seen), strftime(last_seen, "%Y-%m-%d %H:%M:%S"), strftime(now(), "%Y-%m-%d %H:%M:%S"))
iseval = 0

[splunkim_list_audit_logs(1)]
args = incident_id
definition = inputlookup splunkim_audit_lookup \
| search incident_id="$incident_id$" \
| eval time_str=strftime(timestamp, "%Y-%m-%d %H:%M:%S") \
| sort - timestamp
iseval = 0

[splunkim_get_settings]
definition = inputlookup splunkim_settings_lookup \
| eval summary_index=coalesce(summary_index, "summary")
iseval = 0
