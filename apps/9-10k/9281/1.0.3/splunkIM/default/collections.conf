# KV Store Collections for Splunk Incident Management (splunkIM)

[splunkim_incidents]
enforceTypes = true
field.incident_id = string
field.incident_name = string
field.host = string
field.search_name = string
field.mapped_category = string
field.alert_type = string
field.orig_source = string
field.description = string
field.severity = string
field.status = string
field.owner = string
field.first_seen = number
field.last_seen = number
field.resolved_at = number
field.acknowledged_at = number
field.event_count = number
field.notes = string
field.custom_fields_json = string

[splunkim_audit_log]
enforceTypes = true
field.incident_id = string
field.timestamp = number
field.user = string
field.action = string
field.old_val = string
field.new_val = string
field.comment = string

[splunkim_alert_mappings]
enforceTypes = true
field.search_name_pattern = string
field.mapped_category = string
field.default_severity = string
field.target_team = string

[splunkim_settings]
enforceTypes = true
field.summary_index = string
field.aggregation_window_hrs = number
field.reopen_window_hrs = number
field.field_map_host = string
field.field_map_search_name = string
field.field_map_severity = string
field.field_map_orig_source = string
field.field_map_description = string
field.field_map_alert_type = string
field.visible_columns = string
field.drawer_fields = string

[splunkim_severity_mappings]
enforceTypes = true
field.raw_severity_value = string
field.target_severity = string
field.description = string
field.updated_at = number

