[DentiSystems - High Severity Deception Breach]
search = eventtype=dentisystems_attack severity_id=high OR severity_id=critical | stats count by src, dest, signature, severity_id
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 15m
alert.track = 1
action.email = 0

[DentiSystems - Volumetric Reconnaissance Scanning]
search = eventtype=dentisystems_attack | stats dc(dest_port) as target_ports, count by src | where target_ports > 10 OR count > 100
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert.severity = 4
alert.track = 1

[DentiSystems - Canary Credential Triggered]
search = sourcetype="dentisystems:threat" category="canary_leak" | stats count by token_id, src_ip, leak_source
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 5
alert.track = 1

[DentiSystems - GATE Edge SQLi or XSS Intercept]
search = sourcetype="dentisystems:threat" category="gate_edge" (signature="*SQLi*" OR signature="*XSS*") | stats count by src_ip, url, signature
dispatch.earliest_time = -10m
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
alert.severity = 4
alert.track = 1
