[virustotal_ip_lookup]
display_location = both
fields = src, src_ip
label = Lookup IP $@field_value$ on VirusTotal
link.method = get
link.target = _blank
link.uri = https://www.virustotal.com/gui/ip-address/$@field_value$
type = link

[abuseipdb_ip_lookup]
display_location = both
fields = src, src_ip
label = Lookup IP $@field_value$ on AbuseIPDB
link.method = get
link.target = _blank
link.uri = https://www.abuseipdb.com/check/$@field_value$
type = link
