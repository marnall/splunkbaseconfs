[dentisystems:threat]
SHOULD_LINEMERGE = false
TRUNCATE = 8388608
TIME_PREFIX = \"time\":\s*
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 15
KV_MODE = json
category = Security
description = DentiSystems active deception and honeypot threat events

# CIM Aliases & Field Normalization for Intrusion Detection & Alerts Data Models
FIELDALIAS-dentisystems_src = event.source_ip AS src, event.source_ip AS src_ip
FIELDALIAS-dentisystems_dest = event.node_id AS dest, event.node_id AS dvc
FIELDALIAS-dentisystems_dest_port = event.destination_port AS dest_port
FIELDALIAS-dentisystems_proto = event.protocol AS transport, event.protocol AS protocol
FIELDALIAS-dentisystems_signature = event.signature AS signature, event.signature AS rule
FIELDALIAS-dentisystems_severity = event.severity AS severity_id
FIELDALIAS-dentisystems_category = event.threat_type AS category
FIELDALIAS-dentisystems_user = event.payload AS raw_payload
FIELDALIAS-dentisystems_country = event.source_country AS src_country
FIELDALIAS-dentisystems_city = event.source_city AS src_city
FIELDALIAS-dentisystems_http_method = event.method AS http_method
FIELDALIAS-dentisystems_url = event.url AS url

EVAL-vendor = "DentiSystems"
EVAL-product = "DentiGrid"
EVAL-vendor_product = "DentiSystems DentiGrid"
EVAL-action = "blocked"
EVAL-ids_type = "network"
EVAL-type = "threat_intel"

# Sourcetype mapping for HEC threat_intelligence sourcetype
[threat_intelligence]
SHOULD_LINEMERGE = false
TRUNCATE = 8388608
KV_MODE = json
category = Security
description = Generic threat intelligence sourcetype from DentiSystems

FIELDALIAS-threat_src = event.source_ip AS src, event.source_ip AS src_ip
FIELDALIAS-threat_dest = event.node_id AS dest, event.node_id AS dvc
FIELDALIAS-threat_dest_port = event.destination_port AS dest_port
FIELDALIAS-threat_proto = event.protocol AS transport
FIELDALIAS-threat_signature = event.signature AS signature
FIELDALIAS-threat_country = event.source_country AS src_country
FIELDALIAS-threat_city = event.source_city AS src_city

EVAL-vendor = "DentiSystems"
EVAL-product = "DentiGrid"
EVAL-vendor_product = "DentiSystems DentiGrid"
EVAL-action = "detected"
