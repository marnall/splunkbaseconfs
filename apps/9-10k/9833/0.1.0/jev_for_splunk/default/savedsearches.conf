# Housekeeping only: deletes cache entries older than the configured lifetime. Sends nothing
# anywhere, which is why it may ship enabled. No search that calls `| jev` ships in this app.
[Jev - purge expired cache entries]
search = | jevpurge
cron_schedule = 17 3 * * *
enableSched = 1
dispatch.earliest_time = -5m
dispatch.latest_time = now
