# ucc-gen generates [id], [package], [ui] and most of [install] and [launcher] from
# globalConfig.json and app.manifest. Only what it cannot know goes here.
[launcher]
author = Abdallah Atie
version = 0.1.0
description = Unofficial. Adds the search command | jev: typed judgments (Choice, Score, Noul) from TypeSafe's Jev model for each result row, returned as fields. Not an official TypeSafe product; Jev and TypeSafe are marks of TypeSafe AI. Every call sends the named fields to the TypeSafe API. Apache License 2.0.

[install]
is_configured = false
python.required = 3.13,3.9
build = 1790074605
state = enabled

[triggers]
# jev.conf is read at search time; changing it needs no restart.
reload.jev = simple
reload.jev_for_splunk_settings = simple

[id]
version = 0.1.0
name = jev_for_splunk

[package]
id = jev_for_splunk
check_for_updates = true

[ui]
label = Jev for Splunk (unofficial)
supported_themes = light, dark
is_visible = true
