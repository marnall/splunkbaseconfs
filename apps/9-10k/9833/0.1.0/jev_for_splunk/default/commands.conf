# `| jev` sends the state fields a search names to the TypeSafe API. is_risky makes Splunk Web ask
# before running it from a link or a dashboard the user did not write: a crafted URL must not be
# able to send a logged-in analyst's data to a third party. Dashboards should read stored answers.
[jev]
filename = jev.py
chunked = true
python.version = python3
python.required = 3.13,3.9
is_risky = true

# Deletes expired answer-cache entries. Sends nothing anywhere.
[jevpurge]
filename = jevpurge.py
chunked = true
python.version = python3
python.required = 3.13,3.9
generating = true
