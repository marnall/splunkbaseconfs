[jev-command]
syntax = jev (questions=<string> | noul=<string> | choice=<string> options=<string> | score=<string> levels=<string>) state=<string> (as=<field>)? (maxrows=<int>)? (cache=<bool>)? (workers=<int>)?
shortdesc = Asks TypeSafe's Jev model typed questions about each result row and returns the answers as fields.
description = Sends the fields named in state= of each row to the TypeSafe API together with a question set from jev.conf \
  (questions=) or one inline question (noul=, choice= with comma-separated options=, score= with pipe-separated levels=). \
  Returns jev_<question>, jev_<question>_confidence, jev_<question>_label, jev_<question>_probabilities, jev_model and \
  jev_cached; a failed row gains jev_error, a row beyond maxrows gains jev_skipped. The inline answer is jev_answer \
  unless as= renames it. In state=, a.b nests, a.* takes every field with that prefix, a multivalue field becomes a \
  list and empty fields are left out. Requires the run_jev capability. Every call sends data to a third party: name \
  only the fields the question needs.
comment1 = Probability that each event reports a failed login.
example1 = ... | jev noul="Does this message report a failed login?" state=_raw as=failed_login | where failed_login > 0.8
comment2 = Route tickets to a team.
example2 = ... | jev choice="Which team should handle this?" options="network,security,platform,other" state="short_description,description"
comment3 = Run a question set from jev.conf.
example3 = ... | jev questions=syslog_triage state="mnemonic,examples" maxrows=200
usage = public
tags = ai classify judge typesafe jev
maintainer = Abdallah Atie

[jevpurge-command]
syntax = jevpurge
shortdesc = Deletes answer-cache entries of the jev command that are older than the configured lifetime.
description = Housekeeping for the jev_cache KV store collection. Sends nothing outside Splunk.
example1 = | jevpurge
usage = public
maintainer = Abdallah Atie
