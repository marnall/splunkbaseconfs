# Question sets for the `jev` search command. One stanza per question, named <set>/<question>:
#
#   [ticket_routing/team]
#   type = choice
#   instructions = Which team should handle the ticket in `short_description`?
#   option.network = Connectivity, routing, switching, wireless, DNS or DHCP
#   option.other = None of the above
#
# `| jev questions=ticket_routing state="short_description"` sends the named fields of each row as
# state and every question of the set in one request. Any app can add sets by shipping its own
# jev.conf and exporting it. Write one narrow judgment per question, describe score levels as
# situations, and give every choice an "other" option. See README/jev.conf.spec.
#
# Settings (key, model, limits) are not here: they are on the app's Configuration page.
# A set ships in this file only with a labelled fixture under evals/ and a measured score.
