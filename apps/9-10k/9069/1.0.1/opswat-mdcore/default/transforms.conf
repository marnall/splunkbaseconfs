# CEF header field extraction for MetaDefender Core syslog.
# CEF:Version|DeviceVendor|DeviceProduct|DeviceVersion|SignatureID|Name|Severity|Extension

[opswat_mdcore_cef_header]
REGEX = CEF:(\d+)\|([^|]*)\|([^|]*)\|([^|]*)\|([^|]*)\|([^|]*)\|([^|]*)\|
FORMAT = cef_version::$1 cef_vendor::$2 cef_product::$3 cef_device_version::$4 cef_signature_id::$5 cef_name::$6 cef_severity::$7
