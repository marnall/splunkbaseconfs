# Parsing + field extractions for OPSWAT MetaDefender Core syslog.
# Events reach Splunk via MD Core syslog through a Universal Forwarder or Splunk Connect for Syslog
# (SC4S), tagged sourcetype = opswat:mdcore:cef.
#
# DUAL FORMAT (spec 012): MD Core emits the SAME events in two interchangeable syslog formats and a
# pod restart can flip which one flows:
#   * CEF     — `...|core.workflow|Processing finished|..|OMSoverallResult=Sensitive\ Data\ Found ...`
#               OMS-prefixed key=value; spaces escaped as `\ `; value ends at the next ` OMS<key>=`.
#   * native  — `... MSCL[113] Processing finished, overallResult='Sensitive Data Found', ...`
#               bare key='value'; single-quote delimited; spaces literal.
# Every field below is therefore extracted TWICE into the same capture name — a CEF EXTRACT and a
# native EXTRACT. For any given event only one pattern matches; the other is a no-op, so the field
# is populated regardless of format. Dashboards rely on these fields (no inline rex) and dedup by
# dataId, so counts are correct whether one or both formats are flowing.
# Multi-word CEF values keep their `\ ` escapes; strip with replace(x,"\\","") at display time.

[opswat:mdcore:cef]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
category = Custom
pulldown_type = 1

# CEF header (vendor/product/name/severity/signature)
REPORT-opswat_mdcore_cef_header = opswat_mdcore_cef_header

# MD Core instance/node identity = the syslog HOSTNAME in the header. This is the pod name on a
# Kubernetes deployment (ephemeral) and the fixed machine hostname on a VM deployment (stable), and
# it matches MD Core's own "instance_name" when that is left at its hostname default. It is how you
# attribute events/statistics to an instance in a multi-instance deployment.
# The hostname is the syslog HOSTNAME field = the token right after the timestamp. Anchor on the
# timestamp so it is robust across BOTH formats MD Core emits: RFC3164 ("Mmm dd HH:MM:SS [TZ] host")
# and RFC5424-style ("2026-07-07T09:43:15Z host MSCL[pid]: ..."). Keying off "before CEF:0|" is not
# safe — the RFC5424 line carries an app-name tag and an address before the CEF payload.
EXTRACT-mdcore_instance = ^<\d+>\s*(?:\d{4}-\d{2}-\d{2}T\S+|[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}(?:\s+[A-Z]{2,5})?)\s+(?<mdcore_instance>[^\s:]+)

# MetaDefender Core OMS extension fields
EXTRACT-oms_overallResult    = OMSoverallResult=(?<overallResult>.+?)(?=\s+OMS[\w-]+=|$)
EXTRACT-oms_blocked          = OMSblocked=(?<blocked>\S+)
EXTRACT-oms_blockedReason    = OMSblocked_reason=(?<blockedReason>.+?)(?=\s+OMS[\w-]+=|$)
EXTRACT-oms_fileName         = OMSfileName=(?<fileName>.+?)(?=\s+OMS[\w-]+=|$)
EXTRACT-oms_fileType         = OMSfileTypeDesc=(?<fileType>.+?)(?=\s+OMS[\w-]+=|$)
EXTRACT-oms_sha256           = OMSsha256sum=(?<sha256>[0-9A-Fa-f]+)
EXTRACT-oms_threatName       = OMSthreatName=(?<threatName>.+?)(?=\s+OMS[\w-]+=|$)
EXTRACT-oms_detectedBy       = OMSthreatDetectedBy=(?<detectedBy>.+?)(?=\s+OMS[\w-]+=|$)
EXTRACT-oms_src              = OMSsource=(?<src>.+?)(?=\s+OMS[\w-]+=|$)
EXTRACT-oms_user             = OMSuser=(?<user>.+?)(?=\s+OMS[\w-]+=|$)
EXTRACT-oms_ruleName         = OMSruleName=(?<ruleName>.+?)(?=\s+OMS[\w-]+=|$)
EXTRACT-oms_parentId         = OMSparent_data_id=(?<parentId>\S+)
EXTRACT-oms_dataId           = OMSdata_id=(?<dataId>[0-9A-Fa-f]+)
EXTRACT-oms_fileId           = OMSfile_id=(?<fileId>[0-9A-Fa-f]+)
# Per-engine event (msgid 81 "Scan result received"): engine can be multi-word (CEF escapes spaces
# as `\ `, e.g. OMSengine=OPSWAT\ Predictive\ Alin\ AI), so match to the next OMS key, not \S+.
EXTRACT-oms_engine           = OMSengine=(?<engine>.+?)(?=\s+OMS[\w-]+=|$)
EXTRACT-oms_scanResult       = OMSscanResult=(?<scanResult>.+?)(?=\s+OMS[\w-]+=|$)
EXTRACT-oms_waitTime         = OMSwaitTime=(?<waitTime>\d+)
EXTRACT-oms_verdict          = OMSverdict=(?<verdict>[A-Z_]+)
# Deep CDR: MD Core emits core.sanitize events (no sanitization-status field). Real fields below.
EXTRACT-oms_sanitized_file_size = OMSsanitized_file_size=(?<sanitized_file_size>\d+)
EXTRACT-oms_signature        = OMSsignature=(?<signature>[0-9A-Fa-f]+)
EXTRACT-oms_action           = OMSaction=(?<action>\S+)
EXTRACT-oms_type             = OMStype=(?<ctype>\S+)
EXTRACT-oms_item             = OMSitem=(?<item>.+?)(?=\s+OMS[\w-]+=|$)
EXTRACT-oms_path             = OMSpath=(?<path>\S+)
EXTRACT-oms_taskId           = OMStask_id=(?<taskId>\S+)
EXTRACT-oms_result           = OMSresult=(?<result>\d+)
EXTRACT-oms_procMs           = OMStotal_processing_time=(?<procMs>\d+)
EXTRACT-oms_scanMs           = OMSscanDuration=(?<scanMs>\d+)
EXTRACT-oms_foundCount       = OMSthreatFoundCount=(?<foundCount>\d+)
EXTRACT-oms_totalResultCount = OMStotalResultCount=(?<totalResultCount>\d+)
EXTRACT-oms_emb              = OMSembeddedObjectsWithThreat=(?<emb>\d+)

# --- Native MSCL format (key='value'). Same capture names as the CEF EXTRACTs above. ---
# (?<!\w) guards keep data_id from matching root_data_id / parent_data_id, etc.
EXTRACT-nat_overallResult    = (?<!\w)overallResult='(?<overallResult>[^']*)'
EXTRACT-nat_blocked          = (?<!\w)blocked='(?<blocked>[^']*)'
EXTRACT-nat_blockedReason    = (?<!\w)blocked_reason='(?<blockedReason>[^']*)'
EXTRACT-nat_fileName         = (?<!\w)fileName='(?<fileName>[^']*)'
EXTRACT-nat_fileType         = (?<!\w)fileTypeDesc='(?<fileType>[^']*)'
EXTRACT-nat_sha256           = (?<!\w)sha256sum='(?<sha256>[0-9A-Fa-f]+)'
EXTRACT-nat_threatName       = (?<!\w)threatName='(?<threatName>[^']*)'
EXTRACT-nat_detectedBy       = (?<!\w)threatDetectedBy='(?<detectedBy>[^']*)'
EXTRACT-nat_src              = (?<!\w)source='(?<src>[^']*)'
EXTRACT-nat_user             = (?<!\w)user='(?<user>[^']*)'
EXTRACT-nat_ruleName         = (?<!\w)ruleName='(?<ruleName>[^']*)'
EXTRACT-nat_parentId         = (?<!\w)parent_data_id='(?<parentId>[^']*)'
EXTRACT-nat_dataId           = (?<!\w)data_id='(?<dataId>[0-9A-Fa-f]+)'
EXTRACT-nat_fileId           = (?<!\w)file_id='(?<fileId>[0-9A-Fa-f]+)'
EXTRACT-nat_verdict          = (?<!\w)verdict='(?<verdict>[A-Z_]+)'
# Per-engine event (msgid 81) in native format: engine='<name>' scanResult='<verdict>'.
EXTRACT-nat_engine           = (?<!\w)engine='(?<engine>[^']*)'
EXTRACT-nat_scanResult       = (?<!\w)scanResult='(?<scanResult>[^']*)'
EXTRACT-nat_waitTime         = (?<!\w)waitTime='(?<waitTime>\d+)'
EXTRACT-nat_sanitized_file_size = (?<!\w)sanitized_file_size='(?<sanitized_file_size>\d+)'
EXTRACT-nat_signature        = (?<!\w)signature='(?<signature>[0-9A-Fa-f]+)'
EXTRACT-nat_action           = (?<!\w)action='(?<action>[^']*)'
EXTRACT-nat_type             = (?<!\w)type='(?<ctype>[^']*)'
EXTRACT-nat_item             = (?<!\w)item='(?<item>[^']*)'
EXTRACT-nat_path             = (?<!\w)path='(?<path>[^']*)'
EXTRACT-nat_taskId           = (?<!\w)task_id='(?<taskId>[^']*)'
EXTRACT-nat_result           = (?<!\w)result='(?<result>\d+)'
EXTRACT-nat_procMs           = (?<!\w)total_processing_time='(?<procMs>\d+)'
EXTRACT-nat_foundCount       = (?<!\w)threatFoundCount='(?<foundCount>\d+)'
EXTRACT-nat_totalResultCount = (?<!\w)totalResultCount='(?<totalResultCount>\d+)'
EXTRACT-nat_emb              = (?<!\w)embeddedObjectsWithThreat='(?<emb>\d+)'

# MD Core scan-result JSON (webhook/HEC path). The result carries the built-in "instance_name"
# (the MD Core node/host that scanned the file). Alias it to the shared field name so dashboards
# and searches attribute statistics to an instance the same way across both sourcetypes.
[mdcore:scan:json]
FIELDALIAS-mdcore_instance = instance_name AS mdcore_instance
