[extract_modsec_giant_block]
REGEX = ^(?P<log_time>\S+)\s+(?P<reporting_ip>\S+)\s+(?P<syslog_id>\d+)\s+(?P<utc_time>\S+)\s+(?P<device_name>\S+)\s+(?P<component>\S+).*?\[client\s+(?P<client_ip>[^\]]+)\].*?(?P<modsec_info>ModSecurity:\s+[^.]+\.).*?\[file\s+(?P<File_name>[^\]]+)\].*?\[msg\s+(?P<msg>[^\]]+)\].*?\[data\s+(?P<data>[^\]]+)\].*?\[severity\s+(?P<Severity>[^\]]+)\].*?\[ver\s+(?P<version>[^\]]+)\].*?\[tag\s+(?P<tag_block>[^\]]+)\].*?\[hostname\s+(?P<Server_ip>[^\]]+)\].*?\[uri\s+(?P<Uri>[^\]]+)\].*?\[unique_id\s+(?P<unique_id>[^\]]+)\]

FORMAT = log_time::$1 reporting_ip::$2 syslog_id::$3 utc_time::$4 device_name::$5 component::$6 client_ip::$7 modsec_info::$8 file_name::$9  msg::$10 data::$11 severity::$12 version::$13 tags_block::$14 server_ip::$15 uri::$16 unique_id::$17
WRITE_META = true

[extract_tags_from_block]
SOURCE_KEY = tags_block
REGEX = \[tag\s+"(?P<tag>[^"]+)"\]
FORMAT = tag::$1
MV_ADD = true
