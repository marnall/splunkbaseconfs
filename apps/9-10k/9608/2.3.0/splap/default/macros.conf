[splap_laps]
definition = inputlookup splap_demo_laps
iseval = 0

[splap_segments]
definition = inputlookup splap_demo_segments
iseval = 0

[splap_events]
definition = inputlookup splap_demo_events
iseval = 0

[splap_channels]
definition = inputlookup splap_demo_channels
iseval = 0

[splap_traffic_adjusted]
definition = eval adj_ms = lap_time_ms - traffic_loss_ms
iseval = 0

[splap_rolling_degradation(1)]
args = window
definition = sort 0 competitor_id lap_number | `splap_traffic_adjusted` | streamstats current=f last(adj_ms) AS prev_ms by competitor_id | eval delta_ms = adj_ms - prev_ms | streamstats window=$window$ avg(delta_ms) AS deg_ms_per_lap by competitor_id
iseval = 0

[splap_fmt_ms(1)]
args = f
definition = eval $f$_s = round($f$/1000, 3)
iseval = 0
