# SPLap imported sessions: one sourcetype per canonical event type. Events are single-line JSON with an ISO-8601 UTC
# timestamp in timestamp_utc. KV_MODE=json extracts every field at search time; nothing is indexed beyond defaults.

[splap:meeting]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "timestamp_utc":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 30
KV_MODE = json
TRUNCATE = 0
category = Custom
description = SPLap canonical event (meeting)

