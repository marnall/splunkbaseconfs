# Saved searches for SPLap Demo Race 07. All run against bundled lookups only.
# None are scheduled; they are on-demand references used by the app and the labs.
[default]
enableSched = 0
dispatch.earliest_time = 0
dispatch.latest_time = now

[SPLap - Smoke test]
description = Install Doctor smoke test: confirms the four demo lookups are readable and returns row counts.
search = | inputlookup splap_demo_laps | stats count AS laps | appendcols [| inputlookup splap_demo_segments | stats count AS segments] | appendcols [| inputlookup splap_demo_events | stats count AS events] | appendcols [| inputlookup splap_demo_channels | stats count AS channels]

[SPLap - Lab 01 Running order]
description = Reconstruct the running order at the end of a selected lap.
search = | `splap_laps` | where lap_number=21 | sort position | table position competitor_id competitor_code team lap_time_ms compound_code stint_number

[SPLap - Lab 02 Lap consistency]
description = Find the most consistent five-lap run (lowest stdev of valid, non-pit, traffic-adjusted laps).
search = | `splap_laps` | where valid_lap=1 AND pit_flag=0 | `splap_traffic_adjusted` | sort 0 competitor_id lap_number | streamstats window=5 stdev(adj_ms) AS stdev_ms count AS n by competitor_id | where n=5 | sort stdev_ms | head 10 | eval window=(lap_number-4)."-".lap_number | table competitor_id competitor_code window stdev_ms

[SPLap - Lab 03 Degradation inflection]
description = First lap where rolling 3-lap traffic-adjusted degradation exceeds 0.15 s/lap for Car 27.
search = | `splap_laps` | where competitor_id=27 AND pit_flag=0 | `splap_rolling_degradation(3)` | where lap_number>=4 AND deg_ms_per_lap>150 | head 1 | eval deg_s_per_lap=round(deg_ms_per_lap/1000,3) | table competitor_id lap_number deg_ms_per_lap deg_s_per_lap

[SPLap - Lab 04 Sensor deviation]
description = Correlate wheel-speed divergence with GPS quality for Event 014.
search = | `splap_channels` | where competitor_id=12 AND lap_number=19 AND fidelity="10hz" | eval divergence_kph=abs(wheel_speed_kph-speed_kph) | bin sample_time_ms span=500 | stats max(divergence_kph) AS max_div min(gps_quality) AS gps_q max(quality_code) AS qcode by sample_time_ms | where max_div>2 OR qcode>0

[SPLap - Lab 05 Pit loss]
description = Rank pit stops against the field baseline using a z-score.
search = | `splap_events` | where event_type="pit" | eventstats median(pit_loss_ms) AS baseline_ms stdev(pit_loss_ms) AS sd by session_id | eval excess_ms=pit_loss_ms-baseline_ms, z=round((pit_loss_ms-baseline_ms)/sd,2) | sort - excess_ms | table event_id competitor_id pit_loss_ms baseline_ms excess_ms z

[SPLap - Lab 06 Data freshness]
description = Detect a frozen competitor feed from the 1 Hz channel stream.
search = | `splap_channels` | where fidelity="1hz" | sort 0 competitor_id sample_time_ms | streamstats current=f last(distance_m) AS prev_d by competitor_id | eval frozen=if(distance_m=prev_d,1,0) | streamstats reset_on_change=true sum(frozen) AS frozen_run by competitor_id frozen | stats max(frozen_run) AS max_frozen_samples by competitor_id | where max_frozen_samples>=5 | eval frozen_ms=max_frozen_samples*1000

[SPLap - Lab 07 Query racing baseline]
description = Deliberately inefficient baseline: compute best sector times with a join. Improve it with stats.
search = | `splap_segments` | join type=left competitor_id lap_number [| `splap_laps` | fields competitor_id lap_number position] | stats min(segment_time_ms) AS best_ms by sector | sort sector

[SPLap - Lab 08 Mission transfer]
description = The same segment pattern applied to a generic asset cycle: phases instead of segments, cycles instead of laps.
search = | `splap_segments` | rename competitor_id AS asset_id, lap_number AS cycle, segment_id AS phase, segment_time_ms AS phase_duration_ms | stats avg(phase_duration_ms) AS mean_ms p95(phase_duration_ms) AS p95_ms by phase | eval headroom_ms=p95_ms-mean_ms | sort - headroom_ms

[SPLap - Challenge 001]
description = Find the first traffic-adjusted degradation inflection (baseline query for Challenge 001).
search = | `splap_laps` | where competitor_id=27 AND pit_flag=0 | `splap_rolling_degradation(3)` | where lap_number>=4 AND deg_ms_per_lap>150 | head 1 | table competitor_id lap_number deg_ms_per_lap
