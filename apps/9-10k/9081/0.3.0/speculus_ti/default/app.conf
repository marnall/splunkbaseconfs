#
# Splunk app configuration file
#

[install]
is_configured = 0
state = enabled
build = 12

[launcher]
author = Speculus
description = Speculus threat intelligence for Splunk. Adds the | speculus search command to enrich IP addresses with threat scores, risk levels, infrastructure flags (Tor/VPN/proxy/datacenter) and threat activity from the Speculus combined database, plus dashboards to scan indexes for risky IPs and investigate individual addresses.
version = 0.3.0

[id]
name = speculus_ti
version = 0.3.0

[package]
id = speculus_ti
# Must stay enabled: AppInspect rejects the package outright when update
# checking is disabled, since Splunkbase relies on it to offer upgrades.
check_for_updates = 1

[ui]
is_visible = 1
label = Speculus Threat Intelligence
supported_themes = light, dark
