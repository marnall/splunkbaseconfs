[speculus_mmdb_updater]
python.version = python3
python.required = 3.9, 3.13

# Ships disabled: enable it and set endpoint_url + api_key under
# Settings > Data inputs > Speculus MMDB Updater (or in local/inputs.conf).
# interval is in seconds; the server rebuilds the database every few hours,
# so 4h keeps the local copy fresh without wasted downloads (conditional GET
# makes a no-change run a single 304 round-trip).
[speculus_mmdb_updater://default]
endpoint_url =
api_key =
verify_ssl = 1
interval = 14400
disabled = 1
