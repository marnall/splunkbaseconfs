# Field-menu actions for IP fields in the event viewer. Field list is a
# wildcard match; covers the common names the | speculus command auto-detects.

[speculus_scan_ip]
label = Speculus: Scan IP
display_location = both
fields = ip, src_ip, dest_ip, src, dest, clientip, client_ip, remote_addr, remote_ip, *_ip, ip_*
type = link
link.method = get
link.target = blank
link.uri = /app/speculus_ti/speculus_ip_investigate?form.ip=$@field_value$

[speculus_enrich_search]
label = Speculus: enrich this IP in search
display_location = field_menu
fields = ip, src_ip, dest_ip, src, dest, clientip, client_ip, remote_addr, remote_ip, *_ip, ip_*
type = search
search.search_string = | makeresults | eval ip="$@field_value$" | speculus field=ip | fields - _time
search.target = blank
search.preserve_timerange = false
