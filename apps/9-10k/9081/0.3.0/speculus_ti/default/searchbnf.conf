[speculus-command]
syntax = speculus (field=<fieldname>)? (prefix=<string>)?
shortdesc = Enrich IP addresses with Speculus threat intelligence.
description = Looks up each event's IP address in the local Speculus combined \
    threat database and appends enrichment fields: speculus_score (0-100), \
    speculus_risk (low/medium/high/very high), ASN/ISP/geo context, \
    infrastructure flags (speculus_is_tor, speculus_is_vpn, speculus_is_proxy, \
    speculus_is_datacenter, speculus_is_blacklisted), proxy details \
    (speculus_proxy_*) and threat details (speculus_threat_activity, \
    speculus_threat_malware, speculus_threat_corroboration, ...). \
    speculus_matched is "true" when the IP is present in the database. \
    If field= is omitted, the first present field among src_ip, dest_ip, src, \
    dest, clientip, client_ip, remote_addr, remote_ip, ip is used.
usage = public
example1 = index=fw | speculus field=src_ip | where speculus_score >= 80
comment1 = Enrich firewall events and keep only high-risk sources.
example2 = | makeresults | eval ip="203.0.113.7" | speculus field=ip
comment2 = Look up a single IP address.
tags = speculus threat intel ip enrichment reputation
