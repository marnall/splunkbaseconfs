[scaleway:audittrail_events]
LOOKUP-scaleway_applications_enrichment = scaleway_applications application_id AS "request_body.application_id" OUTPUTNEW application_created_at application_deletable application_editable application_managed application_name application_tags application_updated_at
LOOKUP-scaleway_groups_enrichment = scaleway_groups group_id AS "request_body.group_id" OUTPUTNEW group_application_ids group_created_at group_deletable group_description group_editable group_managed group_name group_tags group_updated_at group_user_ids