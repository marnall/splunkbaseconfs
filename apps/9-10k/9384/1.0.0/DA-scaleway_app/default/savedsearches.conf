[Scaleway - Populate application lookup]
cron_schedule = 30 0 * * *
description = This scheduled report populates the scaleway_applications lookup file
dispatch.earliest_time = -7d@h
dispatch.latest_time = now
enableSched = 1
search = `scaleway_index` sourcetype="scaleway:iam:applications"\
| rename created_at AS application_created_at\
| rename deletable AS application_deletable\
| rename description AS application_description\
| rename editable AS application_editable\
| rename id AS application_id\
| rename managed AS application_managed\
| rename name AS application_name\
| rename tags{} AS application_tags\
| rename updated_at AS application_updated_at\
| dedup application_name\
| table application_id,application_name,application_created_at,application_updated_at,application_deletable,application_editable,application_managed,application_tags\
| outputlookup scaleway_applications
disabled = 1

[Scaleway - Populate groups lookup]
cron_schedule = 30 0 * * *
