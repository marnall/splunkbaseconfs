[Scaleway - Populate asset lookup]
cron_schedule = 30 0 * * *
description = This scheduled report populates the scaleway_assets lookup file
dispatch.earliest_time = -7d@h
dispatch.latest_time = now
enableSched = 1
search = `scaleway_index` sourcetype="scaleway:instance"\
| eval private_ip=if(private_ip="null", null(), private_ip)\
| eval 'ipv6.address'=if('ipv6.address'="null", null(), 'ipv6.address')\
| eval ip=mvappend(private_ip, lower('ipv6.address'))\
| eval ip=mvjoin(ip, "|")\
| eval mac=mvappend(lower(mac_address), lower('private_nics{}.mac_address'))\
| eval mac=mvjoin(mac, "|")\
| eval nt_host=coalesce(lower(hostname), lower(name))\
| eval dns=lower(dns)\
| eval priority=if(protected="true", "high", "low")\
| lookup localities.csv locality AS zone OUTPUT locality_city AS city locality_country AS country\
| eval bunit=coalesce(lower(organization), lower(project))\
| eval category=mvappend(lower(commercial_type), lower('tags{}'), "cloud", "virtual_machine")\
| eval category=mvjoin(category, "|")\
| eval cim_entity_zone=coalesce(lower(zone), lower('location.zone_id'))\
| dedup mac\
| table ip,mac,nt_host,dns,owner,priority,lat,long,city,country,bunit,category,pci_domain,is_expected,should_timesync,should_update,requires_av,cim_entity_zone\
| outputlookup scaleway_assets
disabled = 1

[Scaleway - Populate identity lookup]
cron_schedule = 30 0 * * *
description = This scheduled report populates the scaleway_identities lookup file
dispatch.earliest_time = -7d@h
dispatch.latest_time = now
enableSched = 1
search = `scaleway_index` sourcetype="scaleway:iam:users"\
| eval identity=mvappend(username, email, id)\
| eval identity=lower(mvjoin(identity, "|"))\
| eval nick=lower(first_name + " " + last_name)\
| eval first=lower(first_name)\
| eval last=lower(last_name)\
| eval email=lower(email)\
| eval phone=if(isnull(phone_number) OR phone_number="", null(), phone_number)\
| eval managedBy=if(isnull(account_root_user_id) OR account_root_user_id="", null(), lower(account_root_user_id))\
| eval priority=if(match('tags{}', "admin|root"), "high", "low")\
| eval category=lower(type)\
| eval startDate=strftime(strptime(created_at, "%Y-%m-%dT%H:%M:%S.%6N%Z"), "%m/%d/%Y %H:%M")\
| dedup email\
| table identity,prefix,nick,first,last,suffix,email,phone,managedBy,priority,bunit,category,watchlist,startDate,endDate,work_city,work_country,work_lat,work_long,cim_entity_zone\
| outputlookup scaleway_identities
disabled = 1

[Scaleway - No data ingesting in the last hour]
action.email = 1
action.email.to = changeme@example.com
action.email.useNSSubject = 1
action.keyindicator.invert = 0
action.makestreams.param.verbose = 0
action.nbtstat.param.verbose = 0
action.notable.param.verbose = 0
action.nslookup.param.verbose = 0
action.ping.param.verbose = 0
action.risk.forceCsvResults = 1
action.risk.param.verbose = 0
action.send2uba.param.verbose = 0
action.threat_add.param.verbose = 0
action.webhook.enable_allowlist = 0
alert.suppress = 0
alert.track = 0
alert_condition = search Usage == 0
counttype = custom
cron_schedule = 0 * * * *
description = This alert triggers when no log data has been received within the last 60 minutes.
disabled = 1
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
search = index=_internal source=*license_usage.log type=Usage (s IN (audittrail_events*,audittrail_authentication_events*,audittrail_system_events*,iam_logs*,iam_users*,iam_applications*,instance_servers*)) | timechart sum(b) as Usage | rename Usage as "Data volume"

[Scaleway - Increased number of errors from yesterday]
action.email = 1
action.email.to = changeme@example.com
action.email.useNSSubject = 1
action.keyindicator.invert = 0
action.makestreams.param.verbose = 0
action.nbtstat.param.verbose = 0
action.notable.param.verbose = 0
action.nslookup.param.verbose = 0
action.ping.param.verbose = 0
action.risk.forceCsvResults = 1
action.risk.param.verbose = 0
action.send2uba.param.verbose = 0
action.threat_add.param.verbose = 0
action.webhook.enable_allowlist = 0
alert.suppress = 0
alert.track = 0
alert_condition = search variance > 0
counttype = custom
cron_schedule = 0 0 * * *
description = This alert triggers when the current volume of log errors (ERROR/CRITICAL) significantly exceeds yesterday's average hourly baseline.
disabled = 1
dispatch.earliest_time = -1d
dispatch.latest_time = now
enableSched = 1
search = index=_internal source=*ta-scaleway_addon* log_level IN (ERROR, CRITICAL) earliest=-1d@d latest=now\
| eval day=if(_time < relative_time(now(), "@d"), "yesterday", "today") \
| bin _time span=1h\
| stats count as errors_per_hour by _time, day\
| stats sum(eval(if(day="today", errors_per_hour, null))) as today_total_errors,\
        avg(eval(if(day="yesterday", errors_per_hour, null))) as yesterday_avg_hourly_errors\
| eval variance = today_total_errors - yesterday_avg_hourly_errors

[Scaleway - Increased number of failed logins]
action.email = 1
action.email.to = changeme@example.com
action.email.useNSSubject = 1
action.keyindicator.invert = 0
action.makestreams.param.verbose = 0
action.nbtstat.param.verbose = 0
action.notable.param.verbose = 0
action.nslookup.param.verbose = 0
action.ping.param.verbose = 0
action.risk.forceCsvResults = 1
action.risk.param.verbose = 0
action.send2uba.param.verbose = 0
action.threat_add.param.verbose = 0
action.webhook.enable_allowlist = 0
alert.digest_mode = 0
alert.suppress = 0
alert.track = 0
cron_schedule = * * * * *
description = This alert triggers when a sudden surge in failed authentication or console login attempts is detected.
disabled = 1
dispatch.earliest_time = rt
dispatch.latest_time = rt
enableSched = 1
search = `scaleway_index` (sourcetype="scaleway:audittrail_events:auths" action="failure") earliest=-24h\
| rename resources{}.name as Nickname\
| bin _time span=1h\
| stats count as hourly_failures by _time, Nickname\
| stats latest(hourly_failures) as current_hour_failures, avg(hourly_failures) as avg_hourly_failures by Nickname\
| where current_hour_failures > (2 * avg_hourly_failures) AND avg_hourly_failures > 0