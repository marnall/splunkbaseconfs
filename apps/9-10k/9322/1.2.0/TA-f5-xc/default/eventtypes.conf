## Eventtypes for F5 Distributed Cloud (XC) data delivered as sourcetype=f5:xc.

## All F5 XC events are HTTP requests -> Web data model.
[f5_xc_web]
search = sourcetype="f5:xc"

## WAF (app firewall) security events -> Intrusion Detection.
[f5_xc_waf_attack]
search = sourcetype="f5:xc" sec_event_type="waf_sec_event"

## Bot Defense violations -> Intrusion Detection.
[f5_xc_bot_attack]
search = sourcetype="f5:xc" sec_event_type="bot_defense_sec_event"

## L7 service-policy violations (e.g. geofencing) that were enforced -> Intrusion Detection.
[f5_xc_policy_attack]
search = sourcetype="f5:xc" sec_event_type="svc_policy_sec_event" action="block"
