##
## F5 Distributed Cloud (XC) - CIM mapping
## sourcetype: f5:xc  (set this on the F5 XC HEC token / input; see README.md)
##
## Field reference:
##   https://docs.cloud.f5.com/docs/how-to/app-security/event-logs
##

[f5:xc]
KV_MODE = json
TRUNCATE = 0
SHOULD_LINEMERGE = false
EVENT_BREAKER_ENABLE = true
# F5 XC "time" is RFC3339 (e.g. 2026-06-21T12:16:48.027Z). %N tolerates 3-9 fractional digits.
TIME_PREFIX = "time"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%N%Z
MAX_TIMESTAMP_LOOKAHEAD = 40

#### Prevent CIM field collisions ####
# Raw "src" is an F5 network-zone label (e.g. N:public / N:site-local-inside), NOT the client IP.
# Preserve it as src_zone and force CIM src/src_port from the real fields (EVAL beats the extracted value).
FIELDALIAS-f5xc_src_zone = src AS src_zone
EVAL-src       = src_ip
EVAL-src_port  = src_port

#### Web data model ####
EVAL-action            = case(action="block","blocked", action="allow","allowed", true(), action)
FIELDALIAS-http_method = method AS http_method
FIELDALIAS-http_user_agent   = user_agent AS http_user_agent
FIELDALIAS-http_content_type = content-type AS http_content_type
EVAL-uri_path          = coalesce(req_path, path)
FIELDALIAS-uri_query   = req_params AS uri_query
EVAL-http_referrer     = coalesce(referer, original_referer)
EVAL-status            = if(rsp_code=0, null(), rsp_code)
EVAL-dest              = coalesce(authority, domain, sni)
FIELDALIAS-dest_ip     = dst_ip AS dest_ip
EVAL-dest_port         = coalesce(lb_port, if(dst_port=0, null(), dst_port))
FIELDALIAS-site        = authority AS site
EVAL-url               = coalesce(authority,"") . coalesce(req_path,"") . if(isnotnull(req_params) AND req_params!="", "?" . req_params, "")
EVAL-url_length        = len('url')
EVAL-http_version      = replace(coalesce(http_version, protocol), "HTTP(\d)(\d)", "HTTP/\1.\2")
EVAL-bytes_in          = req_size
EVAL-bytes_out         = rsp_size
EVAL-bytes             = coalesce(req_size,0) + coalesce(rsp_size,0)

#### Intrusion Detection data model ####
EVAL-ids_type          = "application"
EVAL-signature         = coalesce(mvjoin('signatures{}.name',"; "), mvjoin('violations{}.name',"; "), mvjoin('threat_campaigns{}.name',"; "), 'bot_info.name', sec_event_name)
EVAL-signature_id      = coalesce(mvjoin('signatures{}.id',"; "), mvjoin('threat_campaigns{}.id',"; "))
EVAL-category          = coalesce(mvjoin('attack_types{}.name',"; "), mvjoin('signatures{}.attack_type',"; "), mvjoin('violations{}.attack_type',"; "), 'bot_defense.insight', sec_event_name)
EVAL-vendor_action     = coalesce(recommended_action, waf_mode, mvjoin('violations{}.name',"; "))
EVAL-severity          = case(match(mvjoin('signatures{}.risk',","),"High") OR violation_rating>=4 OR req_risk="high" OR isnotnull(mvindex('threat_campaigns{}.name',0)) OR 'bot_defense.insight'="MALICIOUS","high", match(mvjoin('signatures{}.risk',","),"Medium") OR violation_rating=3 OR req_risk="medium","medium", match(mvjoin('signatures{}.risk',","),"Low") OR violation_rating<=2 OR req_risk="low","low", action="block","medium", true(),"informational")
EVAL-cve               = coalesce('cves{}', 'risk_score_info.cve')

#### Common / Network / TLS ####
EVAL-dvc               = coalesce(site, cluster_name)
EVAL-vendor            = "F5"
EVAL-product           = "Distributed Cloud"
EVAL-vendor_product    = "F5 Distributed Cloud"
EVAL-transport         = "tcp"
EVAL-ssl_version       = tls_version
EVAL-ssl_cipher        = tls_cipher_suite
EVAL-response_time     = coalesce('time_to_last_downstream_tx_byte', 'rtt_downstream_seconds')

#### Geo (client) ####
FIELDALIAS-src_geo = country AS src_country city AS src_city region AS src_region
EVAL-src_lat  = if(latitude="PRIVATE", null(), latitude)
EVAL-src_long = if(longitude="PRIVATE", null(), longitude)
