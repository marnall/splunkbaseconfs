##
## Optional: index-time sourcetype assignment for F5 XC HEC data.
##
## PREFERRED: set sourcetype = f5:xc directly on the F5 XC HEC token/input
##   (ideally a DEDICATED token). See README.md. No transform needed.
##
## FALLBACK: only if you cannot set the sourcetype on the token AND the token
##   is shared with other data, gate the rewrite on a stable F5-only marker in
##   _raw so unrelated events on the same token are not relabelled. Wire it up
##   in props.conf against the relevant source/host, e.g.:
##
##     [source::<your_f5_hec_source>]
##     TRANSFORMS-set_f5xc_sourcetype = f5_xc_set_sourcetype
##
##   Index-time transforms must reach the indexing tier (deploy via the
##   Cloud/ACS app-install path, not just the search head).
##

[f5_xc_set_sourcetype]
DEST_KEY = MetaData:Sourcetype
# Match only F5 XC payloads (these keys/values do not appear in unrelated data).
REGEX = "(?:sec_event_type|req_id|tenant)"\s*:\s*"(?:[^"]*ves-io|waf_sec_event|bot_defense_sec_event|svc_policy_sec_event)
FORMAT = sourcetype::f5:xc
