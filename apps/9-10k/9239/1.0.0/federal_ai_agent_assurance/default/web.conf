# Expose the Agent Assurance splunkd endpoint through Splunk Web with the
# user's session (CSRF-protected by Splunk Web's standard token handling).
#
# Splunk Web's [expose] pattern treats "*" as a SINGLE path segment, so a
# stanza is required for each depth the REST surface uses. The deepest routes
# are three segments below /faaa (e.g. /faaa/releases/{id}/submit,
# /faaa/waivers/{id}/decide), so patterns are declared for depths 0-3.
[expose:faaa]
pattern = faaa
methods = GET,POST,DELETE

[expose:faaa_1]
pattern = faaa/*
methods = GET,POST,DELETE

[expose:faaa_2]
pattern = faaa/*/*
methods = GET,POST,DELETE

[expose:faaa_3]
pattern = faaa/*/*/*
methods = GET,POST,DELETE
