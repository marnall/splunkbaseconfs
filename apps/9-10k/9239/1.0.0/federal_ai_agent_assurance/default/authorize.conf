# Federal AI Agent Assurance capabilities and convenience roles. Roles map
# to real users/groups (including SAML groups) via standard Splunk role
# mapping. Splunk admin status does NOT bypass separation of duties, which
# is enforced in application logic.

[capability::faaa_view]
[capability::faaa_manage_agents]
[capability::faaa_edit_release]
[capability::faaa_submit]
[capability::faaa_test]
[capability::faaa_review]
[capability::faaa_accept_risk]
[capability::faaa_authorize]
[capability::faaa_attest]
[capability::faaa_suspend]
[capability::faaa_manage_policies]
[capability::faaa_approve_waiver]
[capability::faaa_export]
[capability::faaa_import]
[capability::faaa_manage_integrations]
[capability::faaa_use_ai]
[capability::faaa_ai_admin]
[capability::faaa_selftest]

[role_faaa_developer]
faaa_view = enabled
faaa_manage_agents = enabled
faaa_edit_release = enabled
faaa_submit = enabled
faaa_test = enabled
faaa_export = enabled

[role_faaa_reviewer]
importRoles = faaa_developer
faaa_review = enabled
faaa_use_ai = enabled
faaa_attest = enabled
faaa_import = enabled

[role_faaa_authorizing_official]
faaa_view = enabled
faaa_accept_risk = enabled
faaa_authorize = enabled
faaa_suspend = enabled
faaa_approve_waiver = enabled
faaa_export = enabled

[role_faaa_admin]
importRoles = faaa_reviewer;faaa_authorizing_official
faaa_manage_policies = enabled
faaa_manage_integrations = enabled
faaa_ai_admin = enabled
faaa_selftest = enabled
