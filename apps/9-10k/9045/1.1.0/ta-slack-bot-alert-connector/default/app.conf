[launcher]
author = Gopinath Jyothi
version = 1.1.0
description = Public Splunk alert action for routing saved-search notifications to Slack with a bot token.

[id]
version = 1.1.0
name = ta-slack-bot-alert-connector

[install]
build = 1784120822
is_configured = false
state = enabled

[package]
id = ta-slack-bot-alert-connector
check_for_updates = true

[ui]
label = Slack Bot Alert Connector for Splunk
supported_themes = light, dark
is_visible = true

[triggers]
reload.ta-slack_bot_alert_connector_settings = simple
