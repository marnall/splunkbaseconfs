#
# TA-appgate_sdp :: props.conf
# Appgate SDP (Software Defined Perimeter / ZTNA) audit events.
#
# Event shape: single-line JSON with an envelope
#   {"version":2,"timestamp":"...","hostname":"<appliance>","daemon":"cz-*","log":{...}}
# and the audit payload nested under "log" (Appgate wraps events this way for
# all non-LogServer destinations, per sdphelp.appgate.com audit-log-types).
# The payload schema varies by log.event_type across the cz-vpnd, cz-sessiond,
# cz-controllerd, and cz-configd daemons.
#
# CIM mappings verified against CIM 8.5 data model documentation
# (help.splunk.com/en/splunk-enterprise/common-information-model/8.5/).
#
# NOTE ON INGEST PATH: at CalSTRS this feed arrives via SC4S (source=sc4s),
# which delivers events over HEC with the timestamp and event boundaries
# already set. The index-time settings below are therefore inert for the
# SC4S path but are included so the sourcetype also parses correctly if the
# LogForwarder JSON is ever ingested via file monitor, TCP input, or a UF.
#

[appgate:sdp]

# ---------------------------------------------------------------------------
# Index-time parsing (used for non-HEC ingest paths; harmless under SC4S)
# ---------------------------------------------------------------------------
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)\{
# device_claims / appliance_status events can exceed the 10k default
TRUNCATE = 100000
TIME_PREFIX = ^\{"version":\d+,"timestamp":"
# Subsecond precision varies: cz-vpnd emits millis, cz-sessiond/controllerd
# nanos (%9Q tolerates fewer digits). Literal trailing Z; TZ=UTC supplies the
# zone, avoiding any %Z-vs-literal-Z strptime ambiguity.
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9QZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TZ = UTC

# ---------------------------------------------------------------------------
# Search-time extraction
# ---------------------------------------------------------------------------
KV_MODE = json

category = Network & Security
description = Appgate SDP audit and access events (JSON, LogForwarder/syslog/SC4S)
pulldown_type = 1

# ---------------------------------------------------------------------------
# Field aliases
# ---------------------------------------------------------------------------
# The appliance (gateway/controller) that produced the event
FIELDALIAS-appgate_sdp_dvc = hostname ASNEW dvc
FIELDALIAS-appgate_sdp_event_type = "log.event_type" ASNEW event_type
FIELDALIAS-appgate_sdp_signature = "log.event_type" ASNEW signature
FIELDALIAS-appgate_sdp_session_id = "log.session_id" ASNEW session_id

# --- Network Traffic (event_type=ip_access) ---
FIELDALIAS-appgate_sdp_dest_port = "log.destination_port" ASNEW dest_port
FIELDALIAS-appgate_sdp_rule = "log.rule_name" ASNEW rule
FIELDALIAS-appgate_sdp_icmp = "log.icmp_code" ASNEW icmp_code "log.icmp_type" ASNEW icmp_type
# packet_size is the size of the packet that triggered the flow decision;
# it is the closest available analogue to bytes for ip_access events.
FIELDALIAS-appgate_sdp_bytes = "log.packet_size" ASNEW bytes

# --- Authentication (event_type=*authentication*/authorization*) ---
FIELDALIAS-appgate_sdp_authsvc = "log.user_claims.ag.identityProviderName" ASNEW authentication_service

# --- Certificates (vpn_certificate_signed | certificate_issued |
#     appliance_certificate_renewed | issued_certificate_revoked) ---
FIELDALIAS-appgate_sdp_ssl = "log.certificate.issuer" ASNEW ssl_issuer "log.certificate.subject" ASNEW ssl_subject "log.certificate.serial" ASNEW ssl_serial "log.certificate.fingerprint" ASNEW ssl_hash "log.certificate.version" ASNEW ssl_version

# --- Compute Inventory (event_type=device_claims_accepted | device_on_boarded) ---
# family/os land in All_Inventory/OS; ip lands in the Network child dataset.
# os_version is a convenience copy; the CIM field (All_Inventory "version") is
# populated by a conditional EVAL below because the name collides with the
# envelope schema-version field present on every event.
FIELDALIAS-appgate_sdp_inventory = "log.device_claims.os.family" ASNEW family "log.device_claims.clientIPs{}" ASNEW ip "log.device_claims.os.version" ASNEW os_version

# ---------------------------------------------------------------------------
# Calculated fields
# ---------------------------------------------------------------------------
EVAL-vendor = "Appgate"
EVAL-product = "SDP"
EVAL-vendor_product = "Appgate SDP"
EVAL-app = "appgate_sdp"

# src: ip_access carries the in-tunnel source (pool IP); session/tunnel/auth
# events carry the client's public IP under different names per daemon.
EVAL-src = coalesce('log.source_ip', 'log.client_ip', 'log.system_claims.clientSrcIP', 'log.system_claims.client_src_ip')
EVAL-src_ip = coalesce('log.source_ip', 'log.client_ip', 'log.system_claims.clientSrcIP', 'log.system_claims.client_src_ip')
EVAL-src_port = coalesce('log.source_port', 'log.client_port')

# dest: traffic events -> protected resource IP; device posture/onboarding
# events -> the endpoint; everything else -> the appliance handling the event.
EVAL-dest = coalesce('log.destination_ip', 'log.device_claims.os.hostname', 'log.client_hostname', hostname)

# dest_ip: for ip_access the protected resource; for session/tunnel events the
# CIM Network Sessions definition applies ("the internal IP address allocated
# to the client"), which is Appgate's assigned pool/tunnel IP. The vendor
# sentinel "Unassigned" is filtered so no literal lands in a CIM ip field.
EVAL-dest_ip = coalesce('log.destination_ip', if('log.pool_v4_ip'!="Unassigned", 'log.pool_v4_ip', null()), 'log.system_claims.tunIPv4')

# user: nearly every event carries distinguished_name_user; controller auth
# events carry it in user_claims; user_license_allocated only carries the full
# DN (CN=<device>,CN=<user>,OU=<idp>) so the user CN is parsed out. The final
# branch parses the DN itself for Appgate versions that omit the _user split.
EVAL-user = coalesce('log.distinguished_name_user', 'log.user_claims.ag.username', replace('log.user_distinguished_name', "^CN=[^,]+,\s*CN=([^,]+),.*$", "\1"), replace('log.distinguished_name', "^CN=[^,]+,\s*CN=([^,]+),.*$", "\1"))

# action, per CIM model of the tagged event family (values verified CIM 8.5):
#   Network Traffic  : allowed | blocked   (vendor: allow, allow_report, block,
#                      block_report, drop, reject; block_report = condition
#                      failure or ALERT-rule tripwire, still a block)
#   Authentication   : success | failure
#   Network Sessions : started | ended
EVAL-action = case(\
    'log.event_type'=="ip_access" AND 'log.action' IN ("allow", "allow_report"), "allowed",\
    'log.event_type'=="ip_access" AND 'log.action' IN ("block", "block_report", "drop", "reject"), "blocked",\
    'log.event_type' IN ("authentication_succeeded", "otp_authentication_succeeded", "password_authentication_succeeded", "ssh_access_succeeded", "authorization_succeeded", "admin_authorization_succeeded", "claims_token_accepted", "entitlement_token_accepted"), "success",\
    'log.event_type' IN ("authentication_failed", "otp_authentication_failed", "password_authentication_failed", "ssh_access_failed", "authorization_failed", "admin_authorization_failed", "claims_token_not_accepted", "entitlement_token_not_accepted"), "failure",\
    'log.event_type' IN ("session_created", "session_reconnected", "tunnel_connected", "tunnel_established"), "started",\
    'log.event_type' IN ("session_removed", "tunnel_closed"), "ended")

# AH/ESP/GRE (documented vendor values) fall through to lowercase; the branch
# is restricted to ip_access so remedy events' pseudo-protocol stays unmapped.
EVAL-transport = case('log.protocol'=="TCP", "tcp", 'log.protocol'=="UDP", "udp", 'log.protocol'=="ICMP", "icmp", 'log.event_type'=="ip_access" AND isnotnull('log.protocol'), lower('log.protocol'))

# Vendor: up = client-to-endpoint (into the protected network), down = reverse
EVAL-direction = case('log.direction'=="up", "inbound", 'log.direction'=="down", "outbound")

# Translated source: prefer the vendor's explicit NAT fields (nat_src_ip/port,
# documented for ip_access but absent in this environment's data); fall back to
# the client's public IP:port, the pre-tunnel (outside) address of the
# in-tunnel src.
EVAL-src_translated_ip = coalesce('log.nat_src_ip', if(isnotnull('log.source_ip'), 'log.client_ip', null()))
EVAL-src_translated_port = coalesce('log.nat_src_port', if(isnotnull('log.source_ip'), 'log.client_port', null()))

# reason: session/token families carry log.reason; blocked/dropped ip_access
# flows carry the explanation in log.drop-reason instead.
EVAL-reason = coalesce('log.reason', 'log.drop-reason')

# Session statistics (present on tunnel_closed / acl_rules_update)
EVAL-duration = tonumber('log.statistics.session-duration')
EVAL-bytes_in = if(isnotnull('log.statistics.bytes-read.ipv4'), tonumber('log.statistics.bytes-read.ipv4') + coalesce(tonumber('log.statistics.bytes-read.ipv6'), 0), null())
EVAL-bytes_out = if(isnotnull('log.statistics.bytes-written.ipv4'), tonumber('log.statistics.bytes-written.ipv4') + coalesce(tonumber('log.statistics.bytes-written.ipv6'), 0), null())
EVAL-packets_in = if(isnotnull('log.statistics.packets-read.ipv4'), tonumber('log.statistics.packets-read.ipv4') + coalesce(tonumber('log.statistics.packets-read.ipv6'), 0), null())
EVAL-packets_out = if(isnotnull('log.statistics.packets-written.ipv4'), tonumber('log.statistics.packets-written.ipv4') + coalesce(tonumber('log.statistics.packets-written.ipv6'), 0), null())

# Certificates: validity bounds converted to epoch (vendor format
# 2026-07-14T15:42:35Z; the Z is rewritten to +0000 so parsing is TZ-safe)
EVAL-ssl_start_time = strptime(replace('log.certificate.valid_from', "Z$", "+0000"), "%Y-%m-%dT%H:%M:%S%z")
EVAL-ssl_end_time = strptime(replace('log.certificate.valid_to', "Z$", "+0000"), "%Y-%m-%dT%H:%M:%S%z")
EVAL-ssl_validity_window = strptime(replace('log.certificate.valid_to', "Z$", "+0000"), "%Y-%m-%dT%H:%M:%S%z") - strptime(replace('log.certificate.valid_from', "Z$", "+0000"), "%Y-%m-%dT%H:%M:%S%z")
# First CN of the RFC2253 DN (issuer: the CA; subject: the device identity)
EVAL-ssl_issuer_common_name = replace('log.certificate.issuer', "^.*?CN=([^,]+).*$", "\1")
EVAL-ssl_subject_common_name = replace('log.certificate.subject', "^.*?CN=([^,]+).*$", "\1")

# Compute Inventory (OS + Network child datasets)
EVAL-os = 'log.device_claims.os.name'
# All_Inventory.version must carry the OS version for inventory-tagged events;
# every other event keeps the JSON envelope's schema-version value (a
# calculated field referencing its own name reads the pre-calculation value).
EVAL-version = if('log.event_type' IN ("device_claims_accepted", "device_on_boarded") AND isnotnull('log.device_claims.os.version'), 'log.device_claims.os.version', version)
# CIM requires lowercase colon-separated MACs; vendor sends bare uppercase hex.
# mvmap() returns null for single-value input, hence the mvcount() guard.
EVAL-mac = if(mvcount('log.device_claims.macAddresses{}') > 1, mvmap('log.device_claims.macAddresses{}', lower(replace('log.device_claims.macAddresses{}', "([0-9A-Fa-f]{2})(?=[0-9A-Fa-f])", "\1:"))), lower(replace('log.device_claims.macAddresses{}', "([0-9A-Fa-f]{2})(?=[0-9A-Fa-f])", "\1:")))

# ---------------------------------------------------------------------------
# Automatic lookups
# ---------------------------------------------------------------------------
LOOKUP-appgate_sdp_event_desc = appgate_sdp_event_lookup event_type OUTPUTNEW event_category, event_description
