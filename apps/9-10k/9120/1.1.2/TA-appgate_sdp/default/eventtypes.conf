#
# TA-appgate_sdp :: eventtypes.conf
# One eventtype per Appgate SDP event family. event_type is a search-time
# field alias of log.event_type defined in props.conf (aliases are applied
# before eventtypes in Splunk's search-time operation order).
#
#

# --- Base ---
[appgate_sdp]
search = sourcetype=appgate:sdp

# --- Network Traffic ---
[appgate_sdp_ip_access]
search = sourcetype=appgate:sdp event_type=ip_access

# --- Authentication ---
[appgate_sdp_authentication_success]
search = sourcetype=appgate:sdp (event_type=authentication_succeeded OR event_type=otp_authentication_succeeded OR event_type=password_authentication_succeeded OR event_type=ssh_access_succeeded)

# claims_token_not_accepted is deliberately NOT here: token validations fire
# repeatedly per session (no 1:1 success counterpart is tagged), so tagging
# only the rejections would skew Authentication success/failure ratios.
[appgate_sdp_authentication_failure]
search = sourcetype=appgate:sdp (event_type=authentication_failed OR event_type=otp_authentication_failed OR event_type=password_authentication_failed OR event_type=ssh_access_failed)

# Authorization (policy grant) fires once per sign-in in addition to
# authentication_succeeded; not CIM-tagged, to avoid double-counting logins
# in the Authentication data model. See README.
[appgate_sdp_authorization]
search = sourcetype=appgate:sdp (event_type=authorization_succeeded OR event_type=authorization_failed OR event_type=admin_authorization_succeeded OR event_type=admin_authorization_failed)

# --- Network Sessions (SDP session lifecycle, cz-sessiond) ---
[appgate_sdp_session_start]
search = sourcetype=appgate:sdp (event_type=session_created OR event_type=session_reconnected)

[appgate_sdp_session_end]
search = sourcetype=appgate:sdp event_type=session_removed

# --- Tunnel lifecycle (per-gateway data-plane connections, cz-vpnd) ---
# Tagged into Network Sessions (VPN child). Only tunnel_established carries
# the "start" tag: tunnel_connected fires at TLS connect *before* session
# login (and not every connect establishes), so start-tagging both would
# double-count session starts. See README for unique-session counting notes.
[appgate_sdp_tunnel_connect]
search = sourcetype=appgate:sdp event_type=tunnel_connected

[appgate_sdp_tunnel_establish]
search = sourcetype=appgate:sdp event_type=tunnel_established

[appgate_sdp_tunnel_close]
search = sourcetype=appgate:sdp event_type=tunnel_closed

# --- Certificates ---
[appgate_sdp_certificate]
search = sourcetype=appgate:sdp (event_type=vpn_certificate_signed OR event_type=certificate_issued OR event_type=appliance_certificate_renewed OR event_type=issued_certificate_revoked)

# --- Compute Inventory (device posture) ---
[appgate_sdp_device_inventory]
search = sourcetype=appgate:sdp (event_type=device_claims_accepted OR event_type=device_on_boarded)

# --- Appgate-specific families (no clean CIM data model; eventtype only) ---
[appgate_sdp_entitlement]
search = sourcetype=appgate:sdp (event_type=entitlement_token_evaluated OR event_type=entitlement_token_accepted OR event_type=entitlement_token_expired OR event_type=entitlement_token_not_accepted)

[appgate_sdp_acl_update]
search = sourcetype=appgate:sdp event_type=acl_rules_update

[appgate_sdp_remedy]
search = sourcetype=appgate:sdp (event_type=remedy_action_triggered OR event_type=remedy_conditions_evaluated)

[appgate_sdp_claims_token]
search = sourcetype=appgate:sdp (event_type=claims_token_accepted OR event_type=claims_token_not_accepted OR event_type=claims_token_expired OR event_type=claims_token_refreshed OR event_type=token_revoked)

[appgate_sdp_device_script]
search = sourcetype=appgate:sdp event_type=device_claim_script_downloaded

[appgate_sdp_license]
search = sourcetype=appgate:sdp (event_type=user_license_allocated OR event_type=user_license_deleted OR event_type=license_uploaded OR event_type=license_removed)

[appgate_sdp_admin_message]
search = sourcetype=appgate:sdp (event_type=admin_message_posted OR event_type=admin_message_deleted)

# Appliance lifecycle & health (status_changed, activated, rebooted, ...);
# appliance_certificate_renewed is excluded so eventtype families stay disjoint
# (it belongs to appgate_sdp_certificate).
[appgate_sdp_appliance_status]
search = sourcetype=appgate:sdp event_type=appliance_* NOT event_type=appliance_certificate_renewed

# HTTP-level analog of ip_access; not observed in this environment yet.
# Candidate for the Web data model if it starts flowing (see README).
[appgate_sdp_url_access]
search = sourcetype=appgate:sdp event_type=url_access

# Admin configuration changes (Controller entity CRUD). Candidate for the
# Change data model if the admin audit feed is enabled (see README).
[appgate_sdp_config_change]
search = sourcetype=appgate:sdp (event_type=entity_created OR event_type=entity_updated OR event_type=entity_deleted)

# Appgate signals dropped audit logs -- alert on this for ingest completeness
[appgate_sdp_audit_drop]
search = sourcetype=appgate:sdp event_type=audit_drop

# Local account locked out after repeated authentication failures
[appgate_sdp_account_lockout]
search = sourcetype=appgate:sdp event_type=local_user_locked

# ALERT-rule tripwire: packet matched an entitlement action configured to
# ALERT -- the vendor's explicit "notify the SIEM" signal
[appgate_sdp_alert]
search = sourcetype=appgate:sdp event_type=alert_triggered

# Admin blocklist ("blacklist") management actions
[appgate_sdp_blocklist]
search = sourcetype=appgate:sdp (event_type=blacklist_entry_added OR event_type=blacklist_entry_removed)
