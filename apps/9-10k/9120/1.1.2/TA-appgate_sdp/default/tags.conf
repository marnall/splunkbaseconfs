#
# TA-appgate_sdp :: tags.conf
# CIM data model tag assignments per eventtype (verified against CIM 8.5):
#
#   Network Traffic   : network + communicate
#   Authentication    : authentication
#   Network Sessions  : network + session (+ start/end/vpn children)
#   Certificates      : certificate (+ ssl child)
#   Compute Inventory : inventory + OS child (system + version) + Network child (network)
#
# Vendor tags (appgate, ztna, policy, entitlement, remedy) are descriptive,
# match no CIM data model constraint, and exist so that every appgate:sdp
# event carries at least one tag for searchability and coverage auditing.
#

# --- Base: every appgate:sdp event ---
[eventtype=appgate_sdp]
appgate = enabled
ztna = enabled

# --- Network Traffic ---
[eventtype=appgate_sdp_ip_access]
network = enabled
communicate = enabled

# --- Authentication ---
[eventtype=appgate_sdp_authentication_success]
authentication = enabled

[eventtype=appgate_sdp_authentication_failure]
authentication = enabled

# --- Network Sessions: SDP broker session lifecycle (cz-sessiond) ---
[eventtype=appgate_sdp_session_start]
network = enabled
session = enabled
start = enabled
vpn = enabled

[eventtype=appgate_sdp_session_end]
network = enabled
session = enabled
end = enabled
vpn = enabled

# --- Network Sessions: per-gateway tunnel lifecycle (cz-vpnd) ---
# tunnel_connected is a pre-login TLS connect: session-related, but not a
# session start (root + vpn only, no start tag).
[eventtype=appgate_sdp_tunnel_connect]
network = enabled
session = enabled
vpn = enabled

[eventtype=appgate_sdp_tunnel_establish]
network = enabled
session = enabled
start = enabled
vpn = enabled

[eventtype=appgate_sdp_tunnel_close]
network = enabled
session = enabled
end = enabled
vpn = enabled

# --- Network Sessions: per-session VPN statistics records ---
# acl_rules_update carries cumulative session counters (bytes, packets, RTT,
# duration) for an active VPN session -> All_Sessions/VPN, no start/end.
[eventtype=appgate_sdp_acl_update]
network = enabled
session = enabled
vpn = enabled

# --- Certificates (root: certificate; SSL child: ssl) ---
[eventtype=appgate_sdp_certificate]
certificate = enabled
ssl = enabled

# --- Compute Inventory ---
# Root requires tag=inventory AND at least one child dataset tag.
# OS child = system + version (the tag is NOT "os"; "os" is the field name).
# Network child = network (exposes the ip/mac fields of the device claims).
[eventtype=appgate_sdp_device_inventory]
inventory = enabled
system = enabled
version = enabled
network = enabled

# --- Policy evaluation families (no CIM data model exists for authorization
#     policy evaluation; descriptive tags only) ---
[eventtype=appgate_sdp_entitlement]
policy = enabled
entitlement = enabled

[eventtype=appgate_sdp_remedy]
policy = enabled
remedy = enabled
