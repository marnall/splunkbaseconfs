[admin:mispfuse_configuration]
match = /
members = mispfuse_account, mispfuse_settings

[admin_external:mispfuse_account]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = mispfuse_rh_account.py
handleractions = edit, list, remove, create
handlerpersistentmode = true

[admin_external:mispfuse_settings]
handlertype = python
python.version = python3
python.required = 3.9, 3.13
handlerfile = mispfuse_rh_settings.py
handleractions = edit, list
handlerpersistentmode = true
