[expose:mispfuse_account]
pattern = mispfuse_account
methods = POST, GET

[expose:mispfuse_account_specified]
pattern = mispfuse_account/*
methods = POST, GET, DELETE

[expose:mispfuse_settings]
pattern = mispfuse_settings
methods = POST, GET

[expose:mispfuse_settings_specified]
pattern = mispfuse_settings/*
methods = POST, GET, DELETE
