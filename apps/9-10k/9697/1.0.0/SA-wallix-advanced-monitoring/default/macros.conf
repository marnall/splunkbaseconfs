#
# App-local macros. The data macros (`wallix_bastion`, `wallix_bastion_sessions`,
# ...) come from TA-wallix-bastion, which this app requires.
#

[wallix_business_hours]
definition = eval wallix_hour = tonumber(strftime(_time, "%H")), wallix_wday = tonumber(strftime(_time, "%w")) | eval wallix_off_hours = if(wallix_wday IN (0,6) OR wallix_hour < 7 OR wallix_hour >= 20, 1, 0)
iseval = 0
description = Flags events outside Mon-Fri 07:00-20:00. Edit in local/macros.conf to match your calendar.

[wallix_critical_targets]
definition = search wallix_device IN ("*-PROD-*", "*-DC-*", "*-DB-*")
iseval = 0
description = Which targets count as critical. Replace this definition, or point it at a lookup, to match your estate.
