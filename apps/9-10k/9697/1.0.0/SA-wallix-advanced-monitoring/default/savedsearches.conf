#
# WALLIX Bastion detections.
#
# Nothing here fires on its own. Each detection ships with enableSched = 0,
# which is what stops the schedule; the cron line is the cadence it will use
# once you turn scheduling on, after reviewing the threshold against your own
# volume.
#
# They ship with disabled = 0 on purpose. disabled = 1 would disable the
# knowledge object itself: the search would not appear, and | savedsearch
# "<name>" would answer "Unable to find saved search" - so you could not run
# one by hand to see what it returns before deciding to enable it. Which is
# exactly what you want to do first.
#
# Each one is an ordinary alert: it produces result rows, and can fire any
# alert action installed on this search head. They ship with enableSched = 0,
# so none of them runs until you turn scheduling on.
#

##############################################################################
[WALLIX - Repeated authentication failures against the Bastion]
disabled = 0
cron_schedule = 4 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 0
search = `wallix_bastion` sourcetype=wallix:bastion:auth action=failure \
| stats count AS failures dc(user) AS accounts_tried earliest(_time) AS firstTime latest(_time) AS lastTime values(authentication_method) AS methods BY src \
| where failures >= 10 \
| eval window_minutes = round((lastTime - firstTime)/60, 1) \
| convert ctime(firstTime) ctime(lastTime)
description = Ten or more failed primary authentications from one source in an hour. The Bastion is the front door to every privileged account, so credential stuffing here matters more than on an ordinary application.
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 3600
alert.suppress.fields = src
counttype = number of events
quantity = 0
relation = greater than

##############################################################################
[WALLIX - Privileged session opened outside business hours]
disabled = 0
cron_schedule = 9 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 0
search = `wallix_bastion_sessions` wallix_type=SESSION_ESTABLISHED_SUCCESSFULLY \
| `wallix_business_hours` \
| where wallix_off_hours = 1 \
| `wallix_critical_targets` \
| stats values(wallix_account) AS accounts values(wallix_device) AS targets values(wallix_client_ip) AS src dc(wallix_session_id) AS sessions latest(wallix_session_id) AS wallix_session_id BY wallix_user \
| rename wallix_user AS user
description = A privileged session on a critical target outside Mon-Fri 07:00-20:00. Tune the window in the wallix_business_hours macro and the target list in wallix_critical_targets.
alert.severity = 3
alert.suppress = 1
alert.suppress.period = 7200
alert.suppress.fields = user
counttype = number of events
quantity = 0
relation = greater than

##############################################################################
[WALLIX - Clipboard data copied out of a privileged session]
disabled = 0
cron_schedule = 14 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 0
search = `wallix_bastion` eventtype=wallix_bastion_clipboard_exfiltration \
| stats count AS events sum(bytes) AS total_bytes values(wallix_type) AS signals latest(wallix_session_id) AS wallix_session_id latest(wallix_client_ip) AS src BY wallix_user wallix_account wallix_device \
| where events >= 3 \
| rename wallix_user AS user, wallix_account AS target_account, wallix_device AS dest
description = Data leaving a target through the RDP clipboard. Copying INTO a session is routine; copying OUT of one is how data leaves a jump host without touching the network.
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 1800
alert.suppress.fields = user,dest
counttype = number of events
quantity = 0
relation = greater than

##############################################################################
[WALLIX - Session recording failed its integrity check]
disabled = 0
cron_schedule = 19 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 0
search = `wallix_bastion` eventtype=wallix_bastion_session_integrity_failure \
| stats count AS failures values(file_path) AS recordings latest(wallix_target) AS target latest(wallix_begin) AS session_begin latest(wallix_end) AS session_end BY wallix_user wallix_session_uid \
| rename wallix_user AS user, wallix_session_uid AS session_id
description = The Bastion could not verify the recording of a privileged session. Either the storage is failing or someone touched the evidence - both are incidents, and both invalidate the session as an audit record.
alert.severity = 5
counttype = number of events
quantity = 0
relation = greater than

##############################################################################
[WALLIX - Forbidden command pattern triggered]
disabled = 0
cron_schedule = 24 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 0
search = `wallix_bastion` eventtype=wallix_bastion_forbidden_pattern \
| stats count AS hits values(wallix_pattern) AS patterns values(wallix_data) AS detail latest(wallix_session_id) AS wallix_session_id latest(wallix_client_ip) AS src BY wallix_user wallix_account wallix_device wallix_type \
| rename wallix_user AS user, wallix_account AS target_account, wallix_device AS dest, wallix_type AS signature
description = A kill or notify pattern fired inside a session. On a notify pattern the Bastion did nothing but log - that is the case worth escalating.
alert.severity = 5
counttype = number of events
quantity = 0
relation = greater than

##############################################################################
[WALLIX - One operator connected from several source addresses]
disabled = 0
cron_schedule = 29 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 0
search = `wallix_bastion_sessions` wallix_type=SESSION_ESTABLISHED_SUCCESSFULLY \
| sort 0 _time \
| streamstats time_window=30m dc(wallix_client_ip) AS sources values(wallix_client_ip) AS src_list dc(wallix_session_id) AS sessions BY wallix_user \
| where sources >= 2 \
| sort 0 - sources \
| dedup wallix_user \
| eval window_minutes = 30, peakTime = _time \
| convert ctime(peakTime) \
| rename wallix_user AS user \
| table user, sources, src_list, sessions, peakTime, window_minutes \
| sort - sources
description = The same Bastion account opened privileged sessions from two or more source addresses within a sliding 30-minute window. Either the account is shared, or its credentials are. The window is enforced by streamstats time_window: computing a first-to-last spread over the whole search window instead would exclude precisely the operators who are active throughout it. Reporting keeps the single peak row per operator - dedup after sorting on sources - rather than aggregating with stats: src_list is then the addresses of that one window, so it always holds exactly as many entries as sources says. stats first() on a multivalue field keeps only its first value, which silently reduced the list to one address.
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 3600
alert.suppress.fields = user
counttype = number of events
quantity = 0
relation = greater than

##############################################################################
[WALLIX - Burst of vault credential checkouts]
disabled = 0
cron_schedule = 34 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 0
search = `wallix_bastion_vault` wallix_action=checkout \
| stats dc(wallix_account) AS secrets values(wallix_account) AS accounts count AS checkouts earliest(_time) AS firstTime latest(_time) AS lastTime BY wallix_user \
| where secrets >= 5 \
| eval window_minutes = round((lastTime - firstTime)/60, 1) \
| rename wallix_user AS user
description = One operator pulled five or more distinct secrets out of the vault in an hour. Harvesting credentials looks exactly like this, and so does a badly written automation - the difference is usually the account, not the pattern.
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 3600
alert.suppress.fields = user
counttype = number of events
quantity = 0
relation = greater than

##############################################################################
[WALLIX - Audit-relevant configuration deleted]
disabled = 0
cron_schedule = 39 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 0
search = `wallix_bastion_audit` action=deleted wallix_object_type IN ("User","Usergroup","Authorization","ConnectionPolicy","Notification","sessionlog","apikey","Profile") \
| stats count AS deletions values(wallix_object_type) AS object_types values(wallix_object) AS objects values(wallix_client_ip) AS src BY wallix_user \
| rename wallix_user AS user
description = An administrator deleted an object that carries audit weight - a user, an authorization, a recording policy, a notification or an API key. Shortening the audit trail is a step in most insider cases.
alert.severity = 5
counttype = number of events
quantity = 0
relation = greater than

##############################################################################
[WALLIX - New operator to target pair]
disabled = 0
cron_schedule = 44 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 0
search = `wallix_bastion_sessions` wallix_type=SESSION_ESTABLISHED_SUCCESSFULLY \
| eval pair = wallix_user . " -> " . wallix_account . "@" . wallix_device \
| stats earliest(_time) AS firstTime latest(wallix_session_id) AS wallix_session_id latest(wallix_client_ip) AS src BY pair wallix_user wallix_account wallix_device \
| where firstTime >= relative_time(now(), "-1h@m") \
| join type=left pair [ search `wallix_bastion_sessions` earliest=-30d@d latest=-1h@m wallix_type=SESSION_ESTABLISHED_SUCCESSFULLY \
    | eval pair = wallix_user . " -> " . wallix_account . "@" . wallix_device \
    | stats count AS historic BY pair ] \
| where isnull(historic) \
| rename wallix_user AS user, wallix_account AS target_account, wallix_device AS dest
description = An operator reached a privileged account they have not used in the last thirty days. Noisy in the first month while the baseline fills, then genuinely useful. Consider replacing the subsearch with a summary index once tuned.
alert.severity = 3
counttype = number of events
quantity = 0
relation = greater than
