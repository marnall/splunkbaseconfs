#
# Single KV collection: one row per tracked entity.
#
#   _key = index :: sourcetype :: host
#
# The field.* = number lines are load bearing. Without them KV stores the values
# as strings, "age > threshold_sec" compares lexicographically, and "900" > "86400"
# evaluates true -- every entity looks broken (or none do) with no error anywhere.
# enforceTypes catches that at write time instead.
#
[dvlm_log_tracking]
enforceTypes = true
field.index           = string
field.sourcetype      = string
field.host            = string
field.last_time       = number
field.last_index_time = number
field.ev              = number
field.cycle_time      = number
accelerated_fields.idx_index = {"index": 1}
accelerated_fields.idx_host  = {"host": 1}

# Human decisions only. One row per entity that a person has touched -- not one per
# entity. It grows with operator-hours, not with the estate, so it stays small no matter
# how large dvlm_log_tracking gets.
#
# Every column is h_ prefixed. The macro reads this with a bare | lookup (no OUTPUT list,
# because the schema will grow), and a bare lookup overwrites any same-named field in the
# pipeline. The prefix makes that collision impossible by construction, and validate.sh
# enforces it -- brain/03 documents what the OUTPUT list costs when a column is added.
[dvlm_entity]
enforceTypes = true
field.h_monitored = number
field.h_reason    = string
field.h_until     = string
field.h_thr_sec   = number
field.h_thr_mode  = string
field.h_by        = string
field.h_ack_at    = number
field.h_at        = number
field.h_ha_peer   = string
field.h_ha_id     = string
field.h_ha_host   = string

# Optional, reciprocal HA relationship. Both members must name each other and carry
# the same id before either can use the other's arrival time. A partial browser write
# therefore leaves ordinary outage detection in force. Existing decision fields stay put.
# Host relationships use separate ha-host: keys in this same collection. h_ha_host
# identifies the normalized host; h_ha_peer holds the peer host, not an entity key.
# Older entity relationships omit h_ha_host and retain their original source scope.

# h_thr_mode is declared but NOTHING READS IT in v3. It carried one value, "auto", meaning
# "follow the nightly learner", and the learner is gone. The declaration stays for one
# version so that rows written by v2 still validate while the one-shot cleanup clears the
# field; it leaves once every install has run that. The macro's guard on it was removed
# outright rather than left behind -- see docs/04-status-logic.md, which explains why a
# dead guard on this field would have silently voided every manual threshold.

# TWO COLLECTIONS. v2 had three: dvlm_learned held what the nightly learner computed, and
# went with the learner. Nothing recomputes anything now, so the only machine-written
# collection left is dvlm_log_tracking and the only human-written one is dvlm_entity. That
# split -- machines never write decisions, people never write observations -- is the whole
# data model, and it is easier to state with two collections than with three.
