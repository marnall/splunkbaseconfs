#
# Log Monitoring
#
[install]
# STAMPED BY scripts/build_tgz.sh on every package -- the value below is a
# placeholder and is never what ships. make_url injects /static/@<build>/ for
# cache-busting; without a fresh number users keep running the previously cached
# JS and CSS and nothing in Splunk says so. It used to be bumped by hand, and
# during v3 it was not: the Actions parser went from 7 values to 6 under one
# unchanged build.
#
# The VERSION below is NOT stamped, because it needs judgement: a deleted saved search is
# not a patch. But it was forgotten in exactly the same way -- four different packages went
# out as 3.0.1, one of them removing a search. build_tgz.sh now refuses to overwrite an
# existing package whose contents differ, and names the files, so the two cannot drift
# again without somebody deciding to.
build = 20260915072446
is_configured = 0
state = enabled

[ui]
is_visible = 1
label = Log Monitoring

[launcher]
author = Datavira
# This is a TILE CAPTION, not a summary. It renders under the app on the launcher and in a
# Splunkbase listing, both of which give it a couple of lines. It was 367 characters and
# enumerated the lookups, the four verdicts and the scope model -- everything README says,
# in the one place with no room for it. validate.sh caps the length, because prose with
# nobody watching it only grows.
description = Detects log outages on arrival time, per index, sourcetype and host, and diagnoses whether the agent or the source stopped delivering.
version = 3.12.2

[package]
id = dv_log_monitoring
# Splunkbase submissions must allow the platform to check for app updates.
check_for_updates = 1
