#
# Lookup definitions.
#
# WILDCARD + max_matches = 1 means the FIRST matching row in a file wins, so within
# a file row order is priority: most specific pattern at the top.
#
# ACROSS the FOUR threshold files precedence is by DIMENSION, not by order. The
# full chain the macro implements, most specific first:
#   manual (dvlm_entity, typed by a person)
#     >  entity (index + sourcetype + host together)
#     >  host  >  sourcetype  >  index
#     >  class (syslog_threshold_sec, source_class="syslog" only)
#     >  dvlm_settings.default_threshold_sec
# This comment said "the three threshold files" and ranked host first for as long as
# dvlm_threshold_entity has existed, which is the whole of v2 and v3: it named the app's
# most specific rule nowhere and told the reader host outranked it. A host rule always
# beats an index rule, so adding one file's rule can never shadow another's. None of the
# four may contain a catch-all: that would make its dimension match everything and
# silence the ones below it.
#
[dvlm_log_tracking]
external_type = kvstore
collection = dvlm_log_tracking
fields_list = _key, index, sourcetype, host, last_time, last_index_time, ev, cycle_time

[dvlm_threshold_entity]
filename = dvlm_threshold_entity.csv
match_type = WILDCARD(index_pat), WILDCARD(sourcetype_pat), WILDCARD(host_pat)
max_matches = 1
case_sensitive_match = false

[dvlm_threshold_host]
filename = dvlm_threshold_host.csv
match_type = WILDCARD(host_pat)
max_matches = 1
case_sensitive_match = false

[dvlm_threshold_sourcetype]
filename = dvlm_threshold_sourcetype.csv
match_type = WILDCARD(sourcetype_pat)
max_matches = 1
case_sensitive_match = false

[dvlm_threshold_index]
filename = dvlm_threshold_index.csv
match_type = WILDCARD(index_pat)
max_matches = 1
case_sensitive_match = false

[dvlm_suppress]
filename = dvlm_suppress.csv
match_type = WILDCARD(index_pat), WILDCARD(sourcetype_pat), WILDCARD(host_pat)
max_matches = 1
case_sensitive_match = false

[dvlm_index_config]
filename = dvlm_index_config.csv
match_type = WILDCARD(index_pat)
max_matches = 1
case_sensitive_match = false

[dvlm_settings]
filename = dvlm_settings.csv

[dvlm_entity]
external_type = kvstore
collection = dvlm_entity
fields_list = _key, h_monitored, h_reason, h_until, h_ack_at, h_thr_sec, h_thr_mode, h_by, h_at, h_ha_peer, h_ha_id, h_ha_host

# Scope. Both are operator files and both ship EMPTY -- an empty allow list must mean
# "no filter", never "allow nothing", or the day somebody creates the file and leaves it
# blank the app goes dark with no error anywhere.
#
# Same WILDCARD convention as every other _pat lookup in this app, so an operator who has
# used dvlm_suppress already knows the syntax: srv-app-* matches, case does not.
[dvlm_host_allow]
filename = dvlm_host_allow.csv
match_type = WILDCARD(host_pat)
max_matches = 1
case_sensitive_match = false

[dvlm_host_deny]
filename = dvlm_host_deny.csv
match_type = WILDCARD(host_pat)
max_matches = 1
case_sensitive_match = false
