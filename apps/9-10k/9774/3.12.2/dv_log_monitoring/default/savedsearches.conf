[Log Monitoring - Clear Learner Marker]
search = | inputlookup dvlm_entity | eventstats sum(eval(if(isnotnull(h_thr_mode) AND h_thr_mode != "", 1, 0))) AS dvlm_stale | where dvlm_stale > 0 | fields - h_thr_mode dvlm_stale | outputlookup dvlm_entity key_field=_key append=false override_if_empty=false | stats count AS rows_rewritten
description = RUN ONCE BY HAND, and only if you are upgrading from 2.x. Run Maintenance Backup first. Every entity somebody pressed the old Set dynamic threshold on carries h_thr_mode=auto in dvlm_entity, and in 3.x nothing reads that field: those entities already follow the ordinary threshold rules again, and any threshold you typed by hand is untouched. This only removes the dead column so that no row carries state no code reads. It ships DISABLED and is not scheduled on purpose, because it REWRITES dvlm_entity, which holds every decision a person has ever made here and is the one collection that cannot be reconstructed. One guard, and it is the one that matters: override_if_empty=false, so a run that finds nothing to clear is a no-op rather than a delete - replace mode with zero rows would otherwise empty the collection. There is NO row ceiling and none is wanted: | inputlookup as the first command of a search returns the whole collection. Idempotent - the second run reports 0 rows rewritten. Skip it entirely on a fresh 3.x install; there is nothing to clear.
disabled = 1
dispatch.earliest_time = -5m
dispatch.latest_time = now
request.ui_dispatch_app = dv_log_monitoring
request.ui_dispatch_view = log-outage

[Log Monitoring - Create Missing Lookups]
search = | makeresults | fields - _time | append [ | makeresults | eval exists=0 | append [ | rest /servicesNS/-/dv_log_monitoring/data/lookup-table-files count=0 splunk_server=local | search title="dvlm_host_allow.csv" | eval exists=1 | fields exists ] | stats max(exists) AS exists | where exists=0 | eval r="#srv-app-*~platform~ONE ROW HERE AND ONLY MATCHING ENDPOINTS ARE WATCHED. Empty = no filter." | eval r=split(r,";") | mvexpand r | eval f=split(r,"~") | eval host_pat=mvindex(f,0), owner=mvindex(f,1), note=mvindex(f,2) | table host_pat owner note | outputlookup dvlm_host_allow override_if_empty=false | stats count AS dvlm_host_allow ] | append [ | makeresults | eval exists=0 | append [ | rest /servicesNS/-/dv_log_monitoring/data/lookup-table-files count=0 splunk_server=local | search title="dvlm_host_deny.csv" | eval exists=1 | fields exists ] | stats max(exists) AS exists | where exists=0 | eval r="#srv-lab-*~platform~Never watched. Takes precedence over the allow list." | eval r=split(r,";") | mvexpand r | eval f=split(r,"~") | eval host_pat=mvindex(f,0), owner=mvindex(f,1), note=mvindex(f,2) | table host_pat owner note | outputlookup dvlm_host_deny override_if_empty=false | stats count AS dvlm_host_deny ] | append [ | makeresults | eval exists=0 | append [ | rest /servicesNS/-/dv_log_monitoring/data/lookup-table-files count=0 splunk_server=local | search title="dvlm_index_config.csv" | eval exists=1 | fields exists ] | stats max(exists) AS exists | where exists=0 | eval r="_audit~off~~~Noise;_introspection~off~~~Noise;_telemetry~off~~~Noise;_configtracker~off~~~Noise;_thefishbucket~off~~~Noise;main~off~~~Default index;summary~off~~~Summary;notable~off~~~Enterprise Security;risk~off~~~Enterprise Security;cim_modactions~off~~~Enterprise Security;history~off~~~Splunk internal;splunklogger~off~~~Splunk internal;#fortinet~entity~Network~syslog~Example: syslog device that reports its HOSTNAME not its IP - without this row it is classed endpoint and a silence reads as Agent Stopped;#vmware-*~entity~Virtualization~api~Example: API source whose hostname does not say so;#windows~entity~Windows~~Example: monitor Security, Sysmon and every other sourcetype separately;#netflow~entity~Network~~Example: monitor each network host and sourcetype separately;#*_net~entity~Network~~Example: team from a naming convention;#*_sec~entity~Security~~;#wineventlog*~entity~Windows~~;*~entity~~~Default: full grain, no team. KEEP THIS ROW LAST" | eval r=split(r,";") | mvexpand r | eval f=split(r,"~") | eval index_pat=mvindex(f,0), mode=mvindex(f,1), team=mvindex(f,2), class=mvindex(f,3), note=mvindex(f,4) | table index_pat mode team class note | outputlookup dvlm_index_config override_if_empty=false | stats count AS dvlm_index_config ] | append [ | makeresults | eval exists=0 | append [ | rest /servicesNS/-/dv_log_monitoring/data/lookup-table-files count=0 splunk_server=local | search title="dvlm_settings.csv" | eval exists=1 | fields exists ] | stats max(exists) AS exists | where exists=0 | eval r="cfg~86400~3~7200~7776000~30~3600~900~604800" | eval r=split(r,";") | mvexpand r | eval f=split(r,"~") | eval cfg_key=mvindex(f,0), default_threshold_sec=mvindex(f,1), escalate_mult=mvindex(f,2), liveness_window_sec=mvindex(f,3), purge_sec=mvindex(f,4), mass_breach_pct=mvindex(f,5), drift_sec=mvindex(f,6), collector_stale_sec=mvindex(f,7), syslog_threshold_sec=mvindex(f,8) | table cfg_key default_threshold_sec escalate_mult liveness_window_sec purge_sec mass_breach_pct drift_sec collector_stale_sec syslog_threshold_sec | outputlookup dvlm_settings override_if_empty=false | stats count AS dvlm_settings ] | append [ | makeresults | eval exists=0 | append [ | rest /servicesNS/-/dv_log_monitoring/data/lookup-table-files count=0 splunk_server=local | search title="dvlm_suppress.csv" | eval exists=1 | fields exists ] | stats max(exists) AS exists | where exists=0 | eval r="#*~*~srv-test-*~~Lab environment~platform;#*~*~10.50.*~2027-01-01~Migration window~network" | eval r=split(r,";") | mvexpand r | eval f=split(r,"~") | eval index_pat=mvindex(f,0), sourcetype_pat=mvindex(f,1), host_pat=mvindex(f,2), until=mvindex(f,3), reason=mvindex(f,4), owner=mvindex(f,5) | table index_pat sourcetype_pat host_pat until reason owner | outputlookup dvlm_suppress override_if_empty=false | stats count AS dvlm_suppress ] | append [ | makeresults | eval exists=0 | append [ | rest /servicesNS/-/dv_log_monitoring/data/lookup-table-files count=0 splunk_server=local | search title="dvlm_threshold_entity.csv" | eval exists=1 | fields exists ] | stats max(exists) AS exists | where exists=0 | eval r="#*~ms:iis:default~*~2678400~Example: a sourcetype that only delivers a few days a month - 31 days. Leave a column as * to mean any;#windows~WinEventLog:Security~dc-*~3600~Example: one sourcetype on one host group only - 1h, without touching those hosts other feeds;#*~perfmon~srv-db-*~7200~Example: narrow a single feed on a single host group. Specific rows go ABOVE generic ones" | eval r=split(r,";") | mvexpand r | eval f=split(r,"~") | eval index_pat=mvindex(f,0), sourcetype_pat=mvindex(f,1), host_pat=mvindex(f,2), threshold_sec=mvindex(f,3), note=mvindex(f,4) | table index_pat sourcetype_pat host_pat threshold_sec note | outputlookup dvlm_threshold_entity override_if_empty=false | stats count AS dvlm_threshold_entity ] | append [ | makeresults | eval exists=0 | append [ | rest /servicesNS/-/dv_log_monitoring/data/lookup-table-files count=0 splunk_server=local | search title="dvlm_threshold_host.csv" | eval exists=1 | fields exists ] | stats max(exists) AS exists | where exists=0 | eval r="#dsk-*~1814400~Example: workstations - 21 days. Rule: threshold >= 1.5x the natural cadence;#10.10.1.*~3600~Example: a critical syslog segment - 1h. Put specific rows ABOVE the generic ones;#*:*~86400~Was shipped live. Equal to default_threshold_sec so it changed nothing - and being a host row it outranked every sourcetype and index rule for API entities;#*.*.*.*~604800~Was shipped live. Syslog now gets this from settings syslog_threshold_sec which ranks BELOW the three dimensions, so a sourcetype or index rule can reach an IP host" | eval r=split(r,";") | mvexpand r | eval f=split(r,"~") | eval host_pat=mvindex(f,0), threshold_sec=mvindex(f,1), note=mvindex(f,2) | table host_pat threshold_sec note | outputlookup dvlm_threshold_host override_if_empty=false | stats count AS dvlm_threshold_host ] | append [ | makeresults | eval exists=0 | append [ | rest /servicesNS/-/dv_log_monitoring/data/lookup-table-files count=0 splunk_server=local | search title="dvlm_threshold_index.csv" | eval exists=1 | fields exists ] | stats max(exists) AS exists | where exists=0 | eval r="#fw_edge~3600~Example: a critical firewall index - 1h;#app_batch~172800~Example: a nightly job - 48h. Rule: threshold >= 1.5x the natural cadence;#low_volume_index~604800~Example: an index that barely produces logs - 1 week" | eval r=split(r,";") | mvexpand r | eval f=split(r,"~") | eval index_pat=mvindex(f,0), threshold_sec=mvindex(f,1), note=mvindex(f,2) | table index_pat threshold_sec note | outputlookup dvlm_threshold_index override_if_empty=false | stats count AS dvlm_threshold_index ] | append [ | makeresults | eval exists=0 | append [ | rest /servicesNS/-/dv_log_monitoring/data/lookup-table-files count=0 splunk_server=local | search title="dvlm_threshold_sourcetype.csv" | eval exists=1 | fields exists ] | stats max(exists) AS exists | where exists=0 | eval r="#WinEventLog:System~14400~Example: a chatty channel that still goes quiet at night - 4h;#*:metrics~7200~Example: metric feeds - 2h" | eval r=split(r,";") | mvexpand r | eval f=split(r,"~") | eval sourcetype_pat=mvindex(f,0), threshold_sec=mvindex(f,1), note=mvindex(f,2) | table sourcetype_pat threshold_sec note | outputlookup dvlm_threshold_sourcetype override_if_empty=false | stats count AS dvlm_threshold_sourcetype ] | stats sum(dvlm_host_allow) AS dvlm_host_allow, sum(dvlm_host_deny) AS dvlm_host_deny, sum(dvlm_index_config) AS dvlm_index_config, sum(dvlm_settings) AS dvlm_settings, sum(dvlm_suppress) AS dvlm_suppress, sum(dvlm_threshold_entity) AS dvlm_threshold_entity, sum(dvlm_threshold_host) AS dvlm_threshold_host, sum(dvlm_threshold_index) AS dvlm_threshold_index, sum(dvlm_threshold_sourcetype) AS dvlm_threshold_sourcetype
description = RUN THIS FIRST ON A FRESH INSTALL, AND AGAIN AFTER EVERY UPGRADE. It is the only thing that creates the nine CSV lookups this app is configured through, and it is safe to run at any time: it writes only the files that are NOT already on disk and touches nothing you have edited. On a fresh install that is all nine; on a configured instance it usually writes nothing and reports zeros. Run it as often as you like. Why it matters on an upgrade: a release can add a lookup the macro then reads, and a | lookup whose file is missing does not return null - it fails the search, and dvlm_status is the first command of every panel and every alert, so the whole app stops until the file exists. The package deliberately ships no CSVs, because Splunk untars over the app directory and a shipped lookup would overwrite your thresholds, suppressions, scope entries, index modes and team assignments on every upgrade. The KV collections are separate - collections.conf creates those on restart.
disabled = 1
dispatch.earliest_time = -5m
dispatch.latest_time = now
request.ui_dispatch_app = dv_log_monitoring
request.ui_dispatch_view = log-outage

[Log Monitoring - Backfill]
search = | tstats max(_time) AS last_time, max(_indextime) AS last_index_time, count AS ev WHERE index=* NOT [ | inputlookup dvlm_index_config | where mode="off" AND NOT match(index_pat, "^#") | append [ | makeresults | eval index_pat="__dvlm_none__" | fields index_pat ] | rename index_pat AS index | fields index | format ] earliest=-30d@d latest=+24h _index_earliest=-30d@d _index_latest=+5m BY index, sourcetype, host | `dvlm_norm_host` | where isnotnull(host) AND host!="" AND host!="." AND host!="*" AND sourcetype!="*" | eval cycle_time = now() | stats max(last_time) AS last_time, max(last_index_time) AS last_index_time, sum(ev) AS ev, max(cycle_time) AS cycle_time BY index, sourcetype, host | eval _key = index."::".sourcetype."::".host | fields _key index sourcetype host last_time last_index_time ev cycle_time | outputlookup dvlm_log_tracking append=true key_field=_key
description = RUN ONCE at install. Same search as the collector with a 30-day window. Use the full history window. Older historical subsets can overwrite newer stored observations; see the README known limitations before splitting by time.
