[Log Monitoring - Maintenance Purge]
search = | inputlookup dvlm_log_tracking | eval cfg_key="cfg" | lookup dvlm_settings cfg_key | lookup dvlm_suppress index_pat AS index, sourcetype_pat AS sourcetype, host_pat AS host OUTPUT reason AS sup_reason, until AS sup_until | lookup dvlm_index_config index_pat AS index OUTPUT mode | eval mode = if(isnull(mode) OR mode="" OR mode IN ("host","stream"), "entity", mode), is_live = if(index IN ("_internal","_dsphonehome"), 1, 0) | eval grain_bad = if(is_live=1, 0, case(mode="off", 1, mode="entity" AND (sourcetype="*" OR host="*"), 1, true(), 0)) | eval drop = if(grain_bad=1 OR (isnotnull(sup_reason) AND sup_reason!="" AND (isnull(sup_until) OR sup_until="" OR sup_until="0") AND (now()-last_index_time) > coalesce(tonumber(purge_sec), 7776000)), 1, 0) | where drop=0 | fields _key index sourcetype host last_time last_index_time ev cycle_time | outputlookup dvlm_log_tracking key_field=_key append=false override_if_empty=false
description = Daily. Removes retired host/stream summaries and observations from mode=off indexes. Complete Backfill and review obsolete observations before enabling cleanup after an upgrade. Independently, permanently suppressed rows silent past purge_sec can be removed. The Stale Grain Rows panel previews only the first condition. Liveness is exempt from mode cleanup, not from the permanent-suppression age condition. Age alone never deletes.
disabled = 1
