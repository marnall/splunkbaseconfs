[Log Monitoring - Alert Self Health]
search = | `dvlm_status` | stats max(gate_ok) AS gate_ok, max(mass_outage) AS mass_outage, max(breach_pct) AS breach_pct, count AS entities | eval gate_ok = coalesce(gate_ok, 0), mass_outage = coalesce(mass_outage, 0), breach_pct = coalesce(breach_pct, 0), entities = coalesce(entities, 0) | where gate_ok = 0 OR mass_outage = 1 | eval problem = case(entities = 0, "Nothing is being tracked at all", gate_ok = 0, "Collector gate closed", true(), "Mass outage"), kind = "all", stale_for = "-" | append [ | makeresults count=2 | streamstats count AS n | eval kind = if(n=1, "data (entity)", "liveness (_internal)"), cycle_time = 0 | fields kind cycle_time | inputlookup append=true dvlm_log_tracking | where isnotnull(kind) OR index IN ("_internal","_dsphonehome") OR (host!="*" AND sourcetype!="*") | eval kind = coalesce(kind, case(index="_internal", "liveness (_internal)", index="_dsphonehome", "liveness (phonehome)", true(), "data (entity)")) | eval cfg_key="cfg" | lookup dvlm_settings cfg_key | stats max(cycle_time) AS last_run, sum(eval(if(cycle_time>0,1,0))) AS entities, max(collector_stale_sec) AS stale_limit BY kind | eval stale_limit = coalesce(tonumber(stale_limit), 900) | eval limit = case(kind="liveness (_internal)", 3 * stale_limit, kind="liveness (phonehome)", 7200, true(), stale_limit) | where (now() - last_run) > limit | eval problem = if(entities = 0, "Collector has never run", "Collector stale"), stale_for = if(last_run > 0, tostring(now()-last_run, "duration"), "never") ] | table problem kind entities stale_for breach_pct
description = The most important alert here. A dead collector makes everything look silent; this is the only legitimate reason the outage alerts go quiet.
