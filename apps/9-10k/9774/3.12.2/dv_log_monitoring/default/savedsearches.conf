[Log Monitoring - Collector DSPhoneHome]
search = index=_dsphonehome earliest=-2h latest=now | rex field=data.connectionId "^([^\_]+)\_([^\_]+)\_([^\_]+)\_([^\_]+)\_(?<conn_host>[^\_]+)" | eval conn_host = if(isnotnull(conn_host), replace(conn_host, "%", "_"), null()) | eval host = coalesce(conn_host, 'data.hostname', hostname) | eval ph = coalesce('data.lastPhoneHomeTime', lastPhoneHomeTime, _indextime) | eval ph = if(ph > 100000000000, ph/1000, ph) | `dvlm_norm_host` | where isnotnull(host) AND host!="" AND host!="." | stats max(ph) AS last_index_time, max(_time) AS last_time, count AS ev BY host | eval index="_dsphonehome", sourcetype="*", cycle_time=now() | eval _key = index."::".sourcetype."::".host | fields _key index sourcetype host last_time last_index_time ev cycle_time | outputlookup dvlm_log_tracking append=true key_field=_key
description = Hourly. Second, INDEPENDENT liveness axis: can the agent reach the deployment server. Together with _internal it separates Agent Not Forwarding from Agent Stopped. SHIPS ENABLED, so the thing to do is CHECK it, not start it: open Operations > Phone-Home Coverage. If the host names look wrong for your estate, disable this and fix the extraction - a wrong regex writes hosts that do not exist. Setup Guide, step 4.
disabled = 0
