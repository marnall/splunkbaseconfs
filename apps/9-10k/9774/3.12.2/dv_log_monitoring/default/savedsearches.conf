description = Daily. Copies dvlm_log_tracking to dvlm_log_tracking_backup.csv. This one is a convenience: the collectors refill the collection from your indexes in half an hour. ENABLE ITS PARTNER TOO - Maintenance Backup Decisions is the one that matters. Runs 5 minutes before Maintenance Purge, which is the only wholesale rewrite this app performs. README.txt has the restore recipe.
