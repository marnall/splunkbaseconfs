[Log Monitoring - Maintenance Backup Decisions]
search = | inputlookup dvlm_entity | outputlookup dvlm_entity_backup.csv override_if_empty=false | stats count AS decisions
description = Daily. Copies dvlm_entity to dvlm_entity_backup.csv. Every row in dvlm_entity is a decision somebody typed and nothing in the world can reconstruct it. Separate from Maintenance Backup because two collections cannot be backed up in one pipeline without putting one of them in a subsearch, and a subsearch is the one place | inputlookup is bounded - so the file that cannot be rebuilt was the file that could silently be written short. To restore, and key_field=_key is not optional - without it the KV store generates new keys and every decision stops matching its entity: | inputlookup dvlm_entity_backup.csv | outputlookup dvlm_entity key_field=_key append=false .
disabled = 1
