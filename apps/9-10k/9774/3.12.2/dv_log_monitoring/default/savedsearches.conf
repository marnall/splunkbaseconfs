#
# Log Monitoring - saved searches.  GENERATED by scripts/build_conf.py -- do not hand-edit.
#
# THREE SEARCHES SHIP ENABLED. Everything else ships disabled.
#
# The rule, and it is the whole rule: a search that only UPSERTS observations starts on
# its own, because an app that watches nothing until someone reads a manual is an app
# that watches nothing. A search that DELETES, that ALERTS, or that is meant to be run
# ONCE by hand does not, because each of those has a consequence a person should own.
#
# Enabled on install:  Collector, Collector Liveness, Collector DSPhoneHome
# Still yours:         Create Missing Lookups (run it first), the backfills (run once),
#                      Maintenance Backup and Purge (they delete), all three alerts
#
# NOTHING HERE WRITES A METRIC INDEX, and nothing needs run_mcollect. v2 shipped two
# history writers and a nightly threshold learner; v3 has neither, so the failure mode
# they carried -- a scheduled search dispatching as an owner without the capability,
# failing every cycle in total silence while the scheduler stayed green -- cannot occur.
# What the learner produced is now a search you run by hand when you want it:
# docs/11-searches-you-run-by-hand.md.
#
# UPGRADING AN INSTANCE THAT IS ALREADY RUNNING. Do this FIRST, before anything else, and do
# not skip it because the version looks like a small step:
#
#     Run "Create Missing Lookups" by hand, once.
#
# This package ships no lookup files, so your CSVs survive the upgrade untouched. But an
# upgrade can add a lookup that the macro then READS, and a | lookup whose file does not exist
# does not return null -- it fails the search. dvlm_status is the first command of every panel
# and every alert, so the app stops until the file is there. Create Missing Lookups writes only
# the files that are absent and is idempotent: on a fully configured instance it writes nothing
# and reports zeros.
#
# ONE lookup creator, and it is safe. Earlier versions shipped two: "Create Lookups"
# replaced all nine files unconditionally and "Create Missing Lookups" wrote only what was
# absent. On a fresh install they did exactly the same thing; the only capability the first
# one had that the second does not is OVERWRITING files somebody had already edited. The app
# ended up warning against it in four places, and one of them was a STATE the Setup Guide
# rendered: "UPGRADE - DO NOT RUN THIS". A button whose documentation is mostly "do not press
# this" is a footgun, so it was deleted rather than documented harder. Resetting to the
# shipped defaults now means deleting the CSVs first, which is rare and is meant to be
# deliberate.
#
# Order for the rest:
# THE INSTALL ORDER IS NOT REPEATED HERE, and that is deliberate.
#
# It used to be, and this file's copy drifted out of step with the other two: it
# numbered 0 through 6 while Log Monitoring > Setup Guide and README.txt both numbered
# 0 through 4, and it listed Alert Self Health as an install step while both of
# those say - correctly - that who gets alerted is a decision per team and not part of
# installing. It even claimed to be "the same order" as the Setup Guide while not being
# it. Three copies of one list is how every numbering slip in this app has happened.
#
# Two remain, and each has a reason the other cannot cover:
#   Log Monitoring > Setup Guide   the order WITH LIVE STATE - which steps are done
#   README.txt                     the order on disk, readable before anything is installed
#
# Everything this list used to add on its own now lives in README.txt: the cardinality
# measurement before backfilling, running Daily Digest by hand before scheduling it,
# and what the three alerts are. Verified before deleting, not assumed.
#
# dispatch is deliberately WIDER than the WHERE clause on both sides. Splunk
# intersects the two, so dispatch.latest_time = now would silently discard the
# latest=+24h that keeps clock-ahead devices inside the window.
#


[Log Monitoring - Collector]
search = | tstats max(_time) AS last_time, max(_indextime) AS last_index_time, count AS ev WHERE index=* NOT [ | inputlookup dvlm_index_config | where mode="off" AND NOT match(index_pat, "^#") | append [ | makeresults | eval index_pat="__dvlm_none__" | fields index_pat ] | rename index_pat AS index | fields index | format ] earliest=-24h latest=+24h _index_earliest=-8m _index_latest=+5m BY index, sourcetype, host | `dvlm_norm_host` | where isnotnull(host) AND host!="" AND host!="." AND host!="*" AND sourcetype!="*" | eval cycle_time = now() | stats max(last_time) AS last_time, max(last_index_time) AS last_index_time, sum(ev) AS ev, max(cycle_time) AS cycle_time BY index, sourcetype, host | eval _key = index."::".sourcetype."::".host | fields _key index sourcetype host last_time last_index_time ev cycle_time | outputlookup dvlm_log_tracking append=true key_field=_key
description = Every 5 minutes, last 8 minutes of ARRIVAL time. Only entities that sent in this window are written; anything silent keeps its old row and ages.
disabled = 0
dispatch.earliest_time = -25h
dispatch.latest_time = +25h
request.ui_dispatch_app = dv_log_monitoring
request.ui_dispatch_view = log-outage
cron_schedule = */5 * * * *
enableSched = 1
is_scheduled = 1

[Log Monitoring - Collector Liveness]
