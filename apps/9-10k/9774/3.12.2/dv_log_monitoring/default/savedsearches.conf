[Log Monitoring - Daily Digest]
search = | `dvlm_status` | where gate_ok=1 | eventstats dc(host) AS feed_hosts, dc(eval(if(sev>=2, host, null()))) AS feed_hosts_bad BY index, sourcetype | eventstats count AS host_streams, sum(eval(if(sev>=2, 1, 0))) AS host_streams_bad, max(agent_alive) AS host_alive BY host | where sev >= 2 | eval group_key = case( ha_linked=1, "ha:".ha_group, feed_hosts_bad >= 5 AND feed_hosts_bad = feed_hosts, index."::".sourcetype, host!="*" AND host_alive=0 AND host_streams_bad = host_streams, host, true(), _key) | stats max(sev) AS sev, values(verdict) AS verdict, dc(host) AS hosts, count AS streams, values(host) AS host_list, max(age) AS worst_age, values(team) AS team, values(index) AS indexes, values(sourcetype) AS sourcetypes BY group_key | eval severity = if(sev=3, "Critical", "Warning"), host_list = if(hosts > 10, mvappend(mvindex(host_list,0,9), "... +".(hosts-10)), host_list), silent_for = tostring(worst_age, "duration"), indexes = mvjoin(indexes, ", "), sourcetypes= mvjoin(sourcetypes, ", "), team = mvjoin(team, ", ") | sort 0 - sev, - worst_age | table severity verdict team indexes sourcetypes hosts streams host_list silent_for
