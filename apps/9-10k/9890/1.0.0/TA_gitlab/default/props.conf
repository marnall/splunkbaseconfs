[gitlab:audit:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
CHARSET = UTF-8

TIME_PREFIX = "time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 24
TZ = UTC

KV_MODE = json

EVAL-app = "gitlab"

[gitlab:application:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
CHARSET = UTF-8

TIME_PREFIX = "time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 24
TZ = UTC

KV_MODE = json

EVAL-app = "gitlab"
EVAL-action = if(match(message, "^Successful Login:"), "success", null())

EXTRACT-gitlab_application_successful_login = \"message\":\"Successful Login:\s+username=(?<user>[^\s]+)\s+ip=(?<src>[^\s]+)\s+method=(?<authentication_method>[^\s]+)\s+admin=(?<gitlab_admin>true|false)

[gitlab:production:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
CHARSET = UTF-8

TIME_PREFIX = "time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 24
TZ = UTC

KV_MODE = json

FIELDALIAS-gitlab_production_http_method = method AS http_method
FIELDALIAS-gitlab_production_src = remote_ip AS src
FIELDALIAS-gitlab_production_src_ip = remote_ip AS src_ip
FIELDALIAS-gitlab_production_user = username AS user
FIELDALIAS-gitlab_production_user_agent = ua AS http_user_agent
FIELDALIAS-gitlab_production_uri_path = path AS uri_path
FIELDALIAS-gitlab_production_rails_action = action AS gitlab_action

EVAL-app = "gitlab"
EVAL-vendor_product = "GitLab"
EVAL-response_time = round(duration_s * 1000, 3)
EVAL-action = case( status>=200 AND status<400, "allowed",status=401 OR status=403, "blocked",status>=400, "error")

[gitlab:api:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
CHARSET = UTF-8

TIME_PREFIX = "time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 24
TZ = UTC

KV_MODE = json

FIELDALIAS-gitlab_api_http_method = method AS http_method
FIELDALIAS-gitlab_api_uri_path = path AS uri_path
FIELDALIAS-gitlab_api_user_agent = ua AS http_user_agent
FIELDALIAS-gitlab_api_route = route AS gitlab_route

EVAL-src = if(isnotnull(remote_ip), trim(mvindex(split(remote_ip, ","), 0)), null())
EVAL-src_ip = if(isnotnull(remote_ip), trim(mvindex(split(remote_ip, ","), 0)), null())

EVAL-user = coalesce(username, 'meta.user')

EVAL-app = "gitlab"
EVAL-vendor_product = "GitLab"

EVAL-response_time = round(duration_s * 1000, 3)

EVAL-action = case( status>=200 AND status<400, "allowed",status=401 OR status=403, "blocked",status>=400, "error")


[gitlab:shell]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
CHARSET = UTF-8

TIME_PREFIX = "time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%:z
MAX_TIMESTAMP_LOOKAHEAD = 25

KV_MODE = json

FIELDALIAS-gitlab_shell_src = remote_ip AS src
FIELDALIAS-gitlab_shell_user = username AS user

EVAL-app = "gitlab_shell"
EVAL-vendor_product = "GitLab"

EVAL-authentication_method = if(msg="executing git command" AND gl_key_type="key", "ssh_key", null())

EVAL-action = if(msg="executing git command" AND isnotnull(username) AND isnotnull(remote_ip), "success", null())

[gitlab:nginx:access]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
CHARSET = UTF-8

TIME_PREFIX = \[
TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z
MAX_TIMESTAMP_LOOKAHEAD = 26

KV_MODE = none

EXTRACT-gitlab_nginx_access = ^(?<src>\S+)\s+-\s+(?<nginx_user>\S+)\s+\[[^\]]+\]\s+"(?<http_method>\S+)\s+(?<request_uri>\S+)\s+(?<http_version>HTTP/\S+)"\s+(?<status>\d{3})\s+(?<bytes_out>\d+)\s+"(?<http_referrer>[^"]*)"\s+"(?<http_user_agent>[^"]*)"\s+(?<nginx_response_time_raw>\S+)$

EVAL-user = if(nginx_user="-", null(), nginx_user)

EVAL-uri_path = mvindex(split(request_uri, "?"), 0)
EVAL-uri_query = if(like(request_uri, "%?%"), mvindex(split(request_uri, "?"), 1), null())

EVAL-app = "gitlab"
EVAL-vendor_product = "GitLab"

EVAL-action = case(tonumber(status)>=200 AND tonumber(status)<400, "allowed",tonumber(status)=401 OR tonumber(status)=403, "blocked",tonumber(status)>=400, "error")

[gitlab:sidekiq]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 200000
CHARSET = UTF-8

TIME_PREFIX = "time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 24
TZ = UTC

KV_MODE = json

EVAL-app = "gitlab"
EVAL-vendor_product = "GitLab"

EVAL-user = 'meta.user'
EVAL-gitlab_project = 'meta.project'
EVAL-gitlab_root_namespace = 'meta.root_namespace'
EVAL-gitlab_caller = 'meta.caller_id'

EVAL-sidekiq_worker = class
EVAL-sidekiq_queue = queue

EVAL-job_duration_ms = if(isnotnull(duration_s), round(duration_s * 1000, 3), null())
EVAL-scheduling_latency_ms = if(isnotnull(scheduling_latency_s), round(scheduling_latency_s * 1000, 3), null())
