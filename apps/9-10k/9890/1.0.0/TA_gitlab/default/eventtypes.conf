[gitlab_authentication_success]
search = sourcetype="gitlab:application:json" message="Successful Login:*"

[gitlab_web_requests]
search = sourcetype="gitlab:production:json" method=* path=* status=*

[gitlab_api_web_requests]
search = sourcetype="gitlab:api:json" method=* path="/api/*" status=*

[gitlab_shell_ssh_authentication_success]
search = sourcetype="gitlab:shell" msg="executing git command" gl_key_type="key" username=* remote_ip=*

[gitlab_nginx_web_requests]
search = sourcetype="gitlab:nginx:access" http_method=* status=*

[gitlab_sidekiq_job_start]
search = sourcetype="gitlab:sidekiq" job_status="start"

[gitlab_sidekiq_job_done]
search = sourcetype="gitlab:sidekiq" job_status="done"

[gitlab_sidekiq_job_deduplicated]
search = sourcetype="gitlab:sidekiq" job_status="deduplicated"

[gitlab_sidekiq_error]
search = sourcetype="gitlab:sidekiq" severity="ERROR"

[gitlab_sidekiq_warning]
search = sourcetype="gitlab:sidekiq" severity="WARN"
