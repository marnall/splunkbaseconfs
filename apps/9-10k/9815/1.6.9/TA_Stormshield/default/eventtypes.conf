[storm_network]
search = (sourcetype=stormshield:filter action=blocked) OR (sourcetype=stormshield:connection action=allowed) OR (sourcetype=stormshield:filter action=allowed ipproto=udp) OR (sourcetype="stormshield:ids" action=*)

[storm_web]
search = sourcetype=stormshield:web OR sourcetype=stormshield:plugin

[storm_auth]
search = (sourcetype=stormshield:auth NOT msg="SSH session closed") OR (sourcetype=stormshield:server msg="logged in")

[storm_ids]
search = sourcetype=stormshield:ids

[storm_vpn]
search = sourcetype=stormshield:vpn action=*

[storm_server]
search = sourcetype=stormshield:server action=* NOT msg="logged in"

[storm_dhcp]
search = sourcetype=stormshield:dhcp

[storm_pvm]
search = sourcetype=stormshield:pvm
