[stormshield]
disabled = false
NO_BINARY_CHECK = true
CHARSET = UTF-8
MAX_TIMESTAMP_LOOKAHEAD = 40
TIME_PREFIX = time="
TIME_FORMAT = %Y-%m-%d %H:%M:%S
TZ = Europe/Paris

TRANSFORMS-force_stormshield_sourcetype = force_stormshield_sourcetype_filter, force_stormshield_sourcetype_connection, force_stormshield_sourcetype_web, force_stormshield_sourcetype_auth, force_stormshield_sourcetype_system, force_stormshield_sourcetype_plugin, force_stormshield_sourcetype_ids, force_stormshield_sourcetype_vpn, force_stormshield_sourcetype_server, force_stormshield_sourcetype_monitor, force_stormshield_sourcetype_dhcp, force_stormshield_sourcetype_ipsecstat, force_stormshield_sourcetype_filterstat, force_stormshield_sourcetype_ftp, force_stormshield_sourcetype_pop3, force_stormshield_sourcetype_smtp, force_stormshield_sourcetype_ssl, force_stormshield_sourcetype_xvpn, force_stormshield_sourcetype_routing, force_stormshield_sourcetype_dmrouting, force_stormshield_sourcetype_routerstat, force_stormshield_sourcetype_pvm, force_stormshield_sourcetype_sandboxing

[stormshield:filter]
FIELDALIAS-dvc_net = fw as dvc
EVAL-action = case(action="pass","allowed",action="block","blocked")
FIELDALIAS-src_port = srcport as src_port
FIELDALIAS-src_mac = srcmac as src_mac
FIELDALIAS-src_translated_ip = modsrc as src_translated_ip
FIELDALIAS-src_translated_port = modsrcport as src_translated_port
FIELDALIAS-src_interface = srcifname as src_interface
FIELDALIAS-dest_net = dst as dest
FIELDALIAS-dest_port_net = dstport as dest_port
FIELDALIAS-dest_interface = dstifname as dest_interface
FIELDALIAS-dest_translated_ip = moddst as dest_translated_ip
FIELDALIAS-dest_translated_port = moddstport as dest_translated_port
FIELDALIAS-rule_id = ruleid as rule_id
FIELDALIAS-rule = rulename as rule
FIELDALIAS-transport_net = ipproto as transport
FIELDALIAS-app = proto as app
FIELDALIAS-bytes_out_net = sent as bytes_out
FIELDALIAS-bytes_in_net = rcvd as bytes_in
FIELDALIAS-dest_name = dstname as dest_name
EVAL-bytes = bytes_in+bytes_out
EVAL-src_host = if(isnull(srcname),src,srcname)
EVAL-dest_host = if(isnull(dstname),dst,dstname)

[stormshield:connection]
FIELDALIAS-dvc_conn = fw as dvc
EVAL-action = case(action="pass","allowed",action="block","blocked")
FIELDALIAS-src_port_conn = srcport as src_port
FIELDALIAS-src_mac_conn = srcmac as src_mac
FIELDALIAS-src_translated_ip_conn = modsrc as src_translated_ip
FIELDALIAS-src_translated_port_conn = modsrcport as src_translated_port
FIELDALIAS-src_interface_conn = srcifname as src_interface
FIELDALIAS-dest__conn = dst as dest
FIELDALIAS-dest_port_conn = dstport as dest_port
FIELDALIAS-dest_interface_conn = dstifname as dest_interface
FIELDALIAS-dest_translated_ip_conn = moddst as dest_translated_ip
FIELDALIAS-dest_translated_port_conn = moddstport as dest_translated_port
FIELDALIAS-rule_id_conn = ruleid as rule_id
EVAL-rule = if(isnull(rulename),ruleid,rulename)
FIELDALIAS-transport_conn = ipproto as transport
FIELDALIAS-app_conn = proto as app
FIELDALIAS-bytes_out_conn = sent as bytes_out
FIELDALIAS-bytes_in_conn = rcvd as bytes_in
FIELDALIAS-dest_name = dstname as dest_name
EVAL-bytes = bytes_in+bytes_out
EVAL-src_host = if(isnull(srcname),src,srcname)
EVAL-dest_host = if(isnull(dstname),dst,dstname)

[stormshield:web]
FIELDALIAS-dvc_web = fw as dvc
EVAL-action = case(action="pass","allowed",action="block","blocked")
FIELDALIAS-dest_web = dst as dest
FIELDALIAS-dest_port_web = dstport as dest_port
FIELDALIAS-bytes_out_web = sent as bytes_out
FIELDALIAS-bytes_in_web = rcvd as bytes_in
EVAL-bytes = bytes_in+bytes_out
FIELDALIAS-status = result as status
FIELDALIAS-http_method = op as http_method
FIELDALIAS-uri_path = arg as uri_path
FIELDALIAS-category = cat_site as category
EVAL-url = proto + "://" + dstname + arg

[stormshield:auth]
FIELDALIAS-dvc_auth = fw as dvc
FIELDALIAS-authentication_service = domain as authentication_service
FIELDALIAS-signature_auth = msg as signature
EVAL-action = case(msg="SSH authentication failed: authentication failed, bad password","failure",msg="SSH authentication failed: user not found in ldap","failure",msg="Authentication request invalid","failure",msg="logged in","success",msg="SSH authentication success on the firewall","success")
FIELDALIAS-dest_auth = host as dest
EVAL-app = case(msg LIKE "SSH %", "stormshield ssh", msg="Authentication request invalid", "stormshield webadmin")

[stormshield:system]
FIELDALIAS-signature_sys = msg as signature
FIELDALIAS-dest_sys = host as dest

[stormshield:plugin]
EVAL-action = case(action="pass","allowed",action="block","blocked")
FIELDALIAS-signature_plugin = msg as signature
FIELDALIAS-bytes_out_plugin = sent as bytes_out
FIELDALIAS-bytes_in_plugin = rcvd as bytes_in
EVAL-bytes = bytes_in+bytes_out
FIELDALIAS-dest_plugin = dst as dest
FIELDALIAS-dest_port_plugin = dstport as dest_port
FIELDALIAS-transport_plugin = ipproto as transport
FIELDALIAS-url_domain = dstname as url_domain
FIELDALIAS-uri_path = arg as uri_path
EVAL-url = dstname + arg
FIELDALIAS-status = result as status
FIELDALIAS-http_method = op as http_method
EVAL-vendor_product = "stormshield_plugin"
FIELDALIAS-dvc_plugin = fw as dvc

[stormshield:ids]
EVAL-action = case(action="pass","allowed",action="block","blocked")
FIELDALIAS-signature_ids = msg as signature
FIELDALIAS-dest_ids = dst as dest
FIELDALIAS-src_port_ids = srcport as src_port
FIELDALIAS-dest_port_ids = dstport as dest_port
FIELDALIAS-transport_ids = ipproto as transport
EVAL-vendor_product = "stormshield_ips"
EVAL-ids_type = "network"
FIELDALIAS-dvc_ids = fw as dvc
EVAL-severity = case(pri="0","critical",pri="1","high",pri="2","critical",pri="3","high",pri="4","low",pri="5","low",pri="6","informational",pri="7","informational")
FIELDALIAS-signature_id_ids = alarmid ASNEW signature_id

[stormshield:server]
FIELDALIAS-dvc_server = fw as dvc
FIELDALIAS-dest_server = host as dest
FIELDALIAS-src_server = address as src
FIELDALIAS-command = msg as command
FIELDALIAS-signature_server = msg as signature
EXTRACT-object_server = msg=\"(?:CONFIG|SYSTEM) (?P<object>.+?) (?:NEW|UPDATE|DELETE|LIST|GET|SHOW|INSERT|REMOVE|ACTIVATE|STATE|DATE)
EVAL-change_type = "configuration"
EVAL-result = if(error="0","success","error="+error)
EVAL-app = if(msg="logged in", "stormshield webadmin", "unknown")
EVAL-action = case(msg LIKE "SSH authentication failed%","failure",msg LIKE "Authentication request invalid","failure",msg LIKE "logged in","success",msg LIKE "SSH authentication success on the firewall","success",msg LIKE "CONFIG%NEW%" AND update="1","modified",msg LIKE "CONFIG%NEW%","created",msg LIKE "CONFIG%DELETE%","deleted",msg LIKE "CONFIG%UPDATE%","modified",msg LIKE "CONFIG%LIST%","read",msg LIKE "CONFIG%GET%","read",msg LIKE "CONFIG%SHOW%","read",msg LIKE "CONFIG%INSERT%","created",msg LIKE "CONFIG%REMOVE%","deleted",msg LIKE "CONFIG%ACTIVATE%","modified",msg LIKE "CONFIG%CHECK%","read",msg LIKE "CONFIG%EXPLICIT%","read",msg LIKE "HA CHECKSYNC%","read",msg="QUIT","logoff",msg LIKE "SYSTEM%","read")

[stormshield:dhcp]
EVAL-vendor_product = "stormshield_dhcp"
FIELDALIAS-dvc_dhcp = fw as dvc
FIELDALIAS-app = service as app
EXTRACT-signature,dest_ip,dest_mac = msg=\"(?P<signature>\w+) \w+ (?P<dest_ip>[^ ]+) \w+ (?P<dest_mac>[^ ]+)
EVAL-action = case(msg like "%DHCPREQUEST%","ends",msg like "%DHCPNAK%","blocked",msg like "%DHCPACK%","started", 1==1,"unknown")

[stormshield:vpn]
EVAL-action = case(lower(msg) LIKE "%established%","started",lower(msg) LIKE "%rekeyed%","started",lower(msg) LIKE "%delete%","ended",lower(msg) LIKE "%closing%","ended",lower(msg) LIKE "%fail%","blocked",lower(msg) LIKE "%block%","blocked")
FIELDALIAS-dest_ip = dst as dest_ip
FIELDALIAS-dest_dns = dstname as dest_dns

[stormshield:ftp]
FIELDALIAS-dvc_ftp = fw as dvc
FIELDALIAS-dest_ftp = dst as dest
FIELDALIAS-dest_port_ftp = dstport as dest_port
FIELDALIAS-http_method_ftp = op as http_method
FIELDALIAS-uri_path_ftp = arg as uri_path
FIELDALIAS-bytes_out_ftp = sent as bytes_out
FIELDALIAS-bytes_in_ftp = rcvd as bytes_in
FIELDALIAS-filename_ftp = filename as file_name
EVAL-vendor_product = "stormshield_ftp"

[stormshield:pop3]
FIELDALIAS-dvc_pop3 = fw as dvc
FIELDALIAS-dest_pop3 = dst as dest
FIELDALIAS-dest_port_pop3 = dstport as dest_port
FIELDALIAS-filename_pop3 = filename as file_name
FIELDALIAS-virus_pop3 = virus as signature
EVAL-vendor_product = "stormshield_pop3"

[stormshield:smtp]
FIELDALIAS-dvc_smtp = fw as dvc
FIELDALIAS-dest_smtp = dst as dest
FIELDALIAS-dest_port_smtp = dstport as dest_port
FIELDALIAS-rule_smtp = rulename as rule
FIELDALIAS-filename_smtp = filename as file_name
FIELDALIAS-virus_smtp = virus as signature
EVAL-vendor_product = "stormshield_smtp"

[stormshield:ssl]
FIELDALIAS-dvc_ssl = fw as dvc
FIELDALIAS-dest_ssl = dst as dest
FIELDALIAS-dest_port_ssl = dstport as dest_port
FIELDALIAS-category_ssl = cat_site as category
FIELDALIAS-rule_ssl = rulename as rule
EVAL-vendor_product = "stormshield_ssl"

[stormshield:xvpn]
FIELDALIAS-dvc_xvpn = fw as dvc
FIELDALIAS-authentication_service_xvpn = domain as authentication_service
FIELDALIAS-localnet_xvpn = localnet as src_net
FIELDALIAS-remotenet_xvpn = remotenet as dest_net
EVAL-vendor_product = "stormshield_xvpn"

[stormshield:pvm]
FIELDALIAS-dvc_pvm = fw as dvc
FIELDALIAS-dest_pvm = src as dest
FIELDALIAS-dest_name_pvm = srcname as dest_name
FIELDALIAS-category_pvm = family as category
FIELDALIAS-vulnid_pvm = vulnid as signature_id
FIELDALIAS-signature_pvm = vulnid as signature
EVAL-severity = case(severity="0","informational",severity="1","low",severity="2","medium",severity="3","high",severity="4","critical")
EVAL-vendor_product = "stormshield_pvm"

[stormshield:sandboxing]
FIELDALIAS-dvc_sandboxing = fw as dvc
FIELDALIAS-dest_sandboxing = dst as dest
FIELDALIAS-filename_sandboxing = filename as file_name
FIELDALIAS-filetype_sandboxing = filetype as file_type
FIELDALIAS-sandboxing_result = sandboxing as signature
FIELDALIAS-hash_sandboxing = hash as file_hash
EVAL-vendor_product = "stormshield_sandboxing"
