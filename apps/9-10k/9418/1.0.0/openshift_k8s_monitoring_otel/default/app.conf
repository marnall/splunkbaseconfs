[install]
is_configured = false
state = enabled
build = 1

[ui]
is_visible = true
label = OpenShift & Kubernetes Monitoring
icon = appIcon.png

[launcher]
author = Waleed Abosree
description = Monitoring dashboards for Kubernetes and OpenShift clusters instrumented with the Splunk OpenTelemetry Collector: cluster overview, workload health, control plane, nodes, pods, resource usage, application logs, Kubernetes events, and API audit trail, with cross-dashboard drilldowns. Target indexes are configurable through the k8s_events and k8s_metrics macros.
version = 1.0.0

[package]
id = openshift_k8s_monitoring_otel
